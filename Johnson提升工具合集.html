<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#087f5b">
<title>Johnson's Ocean Learning Quest</title>
<style>
:root{
  --sky:#eef9ff;--lagoon:#d9f3ff;--water:#92dcf6;--royal:#1557c0;--royal-dark:#0b3f91;
  --green:#087f5b;--green-dark:#056349;--mint:#dff8ee;--coral:#ff7b6b;--sun:#ffd45c;
  --ink:#12304a;--muted:#547088;--line:#b8ddec;--white:#fff;--soft:#f7fcff;
  --good:#087f5b;--good-bg:#e2f7ee;--try:#b65b26;--try-bg:#fff3df;
  --shadow:0 6px 18px rgba(20,87,150,.12);--radius:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--sky);color:var(--ink);min-height:100vh;overflow:hidden}
button,input,select{font:inherit}
button{-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.topbar{height:72px;background:var(--green);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:4px solid #0aa779;position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:10px;background:transparent;border:0;color:#fff;cursor:pointer;text-align:left;min-width:260px}
.brand-mark{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--royal);font-size:28px;box-shadow:inset 0 -4px 0 #bfe9fa;animation:float 3.2s ease-in-out infinite}
.brand strong{display:block;font-size:19px;line-height:1.15}.brand small{display:block;opacity:.82;font-size:12px;margin-top:3px}
.top-stats{margin-left:auto;display:flex;gap:8px;align-items:center}
.stat-pill{height:42px;min-width:82px;padding:0 12px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800}
.icon-btn{width:42px;height:42px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;border-radius:8px;cursor:pointer;font-size:20px;display:grid;place-items:center}
.icon-btn:active,.sea-nav:active,.primary:active,.option:active,.tool-card:active{transform:translateY(2px) scale(.98)}
.app-shell{height:calc(100vh - 72px);height:calc(100dvh - 72px);display:grid;grid-template-columns:minmax(0,1fr) 316px;overflow:hidden}
.workspace{overflow-y:auto;padding:24px clamp(18px,3vw,38px) 48px;background-color:var(--sky);background-image:radial-gradient(circle at 14px 14px,rgba(21,87,192,.055) 2px,transparent 2px);background-size:28px 28px;scroll-behavior:smooth}
.screen{max-width:1020px;margin:0 auto;animation:fadeUp .28s ease}
.control-rail{background:#fff;border-left:2px solid var(--line);overflow-y:auto;padding:16px;position:relative}
.mentor{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line)}
.neptune{width:70px;height:70px;border:0;border-radius:50%;background:var(--lagoon);font-size:42px;cursor:pointer;box-shadow:inset 0 -5px 0 #9ed8ed;position:relative}
.neptune::after{content:'✦';position:absolute;right:3px;top:2px;color:var(--sun);font-size:20px;animation:twinkle 1.4s infinite}
.mentor h2{font-size:16px;color:var(--royal-dark)}.mentor p{font-size:13px;line-height:1.45;color:var(--muted);margin-top:3px}
.rail-heading{font-size:12px;text-transform:uppercase;color:var(--muted);font-weight:900;margin:16px 0 8px}
.sea-nav-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sea-nav{min-height:66px;border:2px solid var(--line);border-radius:8px;background:var(--soft);color:var(--ink);cursor:pointer;display:flex;align-items:center;padding:8px;gap:7px;text-align:left;font-weight:800;transition:.18s}
.sea-nav .animal{font-size:28px;display:block;transition:.18s}.sea-nav span:last-child{font-size:12px;line-height:1.2}
.sea-nav:hover .animal,.sea-nav.active .animal{transform:translateY(-3px) rotate(-5deg)}
.sea-nav:hover{border-color:var(--royal);background:var(--lagoon)}
.sea-nav.active{background:var(--royal);color:#fff;border-color:var(--royal-dark);box-shadow:inset 0 -4px 0 var(--royal-dark)}
.topic-list{display:flex;flex-direction:column;gap:6px}
.topic-btn{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);text-align:left;padding:8px 10px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:750}
.topic-btn:hover,.topic-btn.active{background:var(--mint);border-color:#54b894;color:var(--green-dark)}
.topic-btn .topic-dot{width:9px;height:9px;border-radius:50%;background:var(--water);flex:0 0 auto}.topic-btn.active .topic-dot{background:var(--green)}
.mission{margin-top:16px;background:var(--mint);border:2px solid #8ed9bd;border-radius:8px;padding:12px}
.mission-top{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:900;color:var(--green-dark)}
.progress-track{height:12px;background:#fff;border:1px solid #8ed9bd;border-radius:8px;overflow:hidden;margin:9px 0}.progress-fill{height:100%;background:var(--green);width:0;transition:width .45s ease}
.reward-btn{width:100%;min-height:44px;border:0;border-radius:8px;background:var(--sun);color:#654a00;padding:9px;font-weight:900;cursor:pointer;box-shadow:inset 0 -3px 0 #e5ae20}.reward-btn:disabled{opacity:.55;cursor:default;box-shadow:none}
.rail-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}
.rail-action{min-height:42px;border:1px solid var(--line);background:var(--soft);color:var(--royal-dark);border-radius:8px;padding:8px 6px;font-size:12px;font-weight:800;cursor:pointer}
.welcome{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:24px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:8px;padding:26px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.welcome::after{content:'';position:absolute;left:0;right:0;bottom:0;height:8px;background:linear-gradient(90deg,var(--royal) 0 30%,var(--green) 30% 65%,var(--coral) 65% 82%,var(--sun) 82%)}
.eyebrow{color:var(--green);font-weight:900;font-size:13px;text-transform:uppercase;margin-bottom:6px}
h1{font-size:32px;line-height:1.15;color:var(--royal-dark);letter-spacing:0}
.lead{font-size:16px;color:var(--muted);line-height:1.6;margin:10px 0 16px;max-width:680px}
.crew-scene{height:168px;background:var(--lagoon);border:2px solid #82cfec;border-radius:8px;position:relative;overflow:hidden;display:grid;place-items:center}
.crew-scene::before{content:'☀️';position:absolute;top:10px;right:14px;font-size:30px}.crew-scene::after{content:'〰 〰 〰';position:absolute;bottom:5px;left:0;right:0;text-align:center;color:var(--royal);font-size:28px}
.crew-main{font-size:70px;filter:drop-shadow(0 6px 4px rgba(11,63,145,.18));animation:float 3s ease-in-out infinite}.crew-mini{position:absolute;font-size:32px}.crew-mini.one{left:14px;bottom:24px}.crew-mini.two{right:18px;bottom:30px}.crew-mini.three{left:24px;top:15px;font-size:25px}
.primary{min-height:44px;border:0;border-radius:8px;background:var(--royal);color:#fff;padding:11px 16px;font-weight:900;cursor:pointer;box-shadow:inset 0 -4px 0 var(--royal-dark);transition:.12s}.primary.green{background:var(--green);box-shadow:inset 0 -4px 0 var(--green-dark)}
.secondary{min-height:44px;border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--royal-dark);padding:9px 14px;font-weight:850;cursor:pointer}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:28px 0 12px}.section-head h2{font-size:21px;color:var(--royal-dark)}.section-head p{font-size:13px;color:var(--muted)}
.route-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.route-card{min-height:176px;border:2px solid var(--line);border-radius:8px;background:#fff;padding:16px 16px 40px;text-align:left;cursor:pointer;position:relative;overflow:hidden;transition:.18s;color:var(--ink)}
.route-card:hover{transform:translateY(-3px);border-color:var(--royal);box-shadow:var(--shadow)}
.route-card .big-icon{font-size:38px;display:block;margin-bottom:12px}.route-card h3{font-size:16px;color:var(--royal-dark)}.route-card p{font-size:13px;color:var(--muted);line-height:1.45;margin-top:5px}.route-card .go{position:absolute;right:11px;bottom:10px;color:var(--royal);font-weight:900}
.route-card.math{border-top:6px solid var(--royal)}.route-card.science{border-top:6px solid var(--green)}.route-card.english{border-top:6px solid var(--coral)}.route-card.chinese{border-top:6px solid var(--sun)}
.ocean-strip{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.animal-chip{min-width:82px;height:50px;border:2px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-size:24px;transition:.16s}.animal-chip:hover{transform:translateY(-4px) rotate(-2deg);background:var(--lagoon);border-color:var(--royal)}
.page-title{display:flex;gap:14px;align-items:center;margin-bottom:20px}.page-icon{width:62px;height:62px;border-radius:8px;background:var(--lagoon);display:grid;place-items:center;font-size:38px;border:2px solid var(--line)}.page-title h1{font-size:28px}.page-title p{font-size:14px;color:var(--muted);margin-top:4px}
.topic-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.chip-btn{min-height:44px;border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);padding:8px 11px;font-size:13px;font-weight:850;cursor:pointer}.chip-btn.active{background:var(--royal);color:#fff;border-color:var(--royal-dark)}
.question-card{background:#fff;border:2px solid var(--line);border-radius:8px;padding:22px;box-shadow:var(--shadow)}
.question-kicker{display:flex;justify-content:space-between;gap:8px;color:var(--green);font-size:12px;font-weight:900;text-transform:uppercase;margin-bottom:9px}.question{font-size:20px;line-height:1.55;font-weight:800;color:var(--ink)}
.visual-stage{margin:18px 0;background:var(--soft);border:2px dashed #86cbe6;border-radius:8px;min-height:125px;padding:16px;display:grid;place-items:center;overflow:hidden}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.option{min-height:54px;border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);padding:10px 12px;text-align:left;cursor:pointer;font-weight:750;line-height:1.4;transition:.15s}.option:hover{border-color:var(--royal);background:var(--lagoon)}.option.correct{background:var(--good-bg);border-color:var(--good);color:var(--green-dark)}.option.wrong{background:var(--try-bg);border-color:#e7a569;color:#8b441b}.option:disabled{cursor:default}
.feedback{margin-top:16px;border-radius:8px;padding:16px;border:2px solid;animation:pop .28s ease}.feedback.good{background:var(--good-bg);border-color:#63c5a0}.feedback.try{background:var(--try-bg);border-color:#e7a569}.feedback h3{font-size:17px;margin-bottom:7px}.feedback p{line-height:1.6;font-size:14px}.model-answer{margin-top:10px;padding-top:10px;border-top:1px solid currentColor}.model-answer strong{display:block;margin-bottom:4px}mark{background:#fff1a7;color:#443400;border-radius:3px;padding:1px 3px}
.explain-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.explain-step{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;line-height:1.45}.step-no{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--royal);color:#fff;font-weight:900;margin-bottom:6px}
.bar-model{width:min(560px,100%)}.bar-row{display:flex;height:46px;border:3px solid var(--royal-dark);border-radius:8px;overflow:hidden;margin:7px 0}.bar-part{display:grid;place-items:center;background:var(--water);border-right:2px solid #fff;color:var(--royal-dark);font-weight:900;flex:1}.bar-part:last-child{border-right:0}.bar-part.hot{background:var(--sun)}.bar-part.unknown{background:#fff;border:2px dashed var(--coral);color:var(--coral)}
.angle-model{width:210px;height:160px;position:relative}.ray{position:absolute;width:96px;height:6px;background:var(--royal);left:50%;top:63%;transform-origin:left center;border-radius:4px}.ray.a{transform:rotate(0)}.ray.b{transform:rotate(205deg)}.ray.c{transform:rotate(110deg)}.angle-dot{position:absolute;width:18px;height:18px;background:var(--coral);border-radius:50%;left:calc(50% - 7px);top:calc(63% - 6px)}.angle-label{position:absolute;font-size:18px;color:var(--royal-dark);font-weight:900}.angle-label.x{left:91px;top:22px;font-size:23px}.angle-label.one{left:111px;top:116px}.angle-label.two{left:30px;top:83px}
.percent-grid{display:grid;grid-template-columns:repeat(10,17px);gap:2px}.percent-cell{width:17px;height:17px;background:#fff;border:1px solid var(--line)}.percent-cell.on{background:var(--green)}
.ratio-model{display:flex;gap:28px;align-items:center}.dot-group{display:grid;grid-template-columns:repeat(5,26px);gap:6px;text-align:center}.ratio-dot{width:26px;height:26px;border-radius:50%;background:var(--royal)}.ratio-dot.girl{background:var(--coral)}
.track-model{width:min(580px,100%);position:relative;padding:12px}.track-line{height:16px;background:var(--water);border:3px solid var(--royal);border-radius:8px;position:relative}.track-line::before{content:'🏁';position:absolute;right:-8px;top:-34px;font-size:30px}.track-car{font-size:35px;position:absolute;left:4%;top:-22px;animation:drive 3s ease-in-out infinite}.track-stats{display:flex;justify-content:space-between;margin-top:12px;font-weight:900;color:var(--royal-dark)}
.balance{width:250px;height:145px;position:relative}.beam{position:absolute;width:210px;height:8px;background:var(--royal-dark);left:20px;top:48px;border-radius:8px}.stand{position:absolute;width:8px;height:82px;background:var(--green);left:121px;top:48px}.base{position:absolute;width:100px;height:10px;background:var(--green);left:75px;bottom:4px;border-radius:8px}.pan{position:absolute;top:60px;width:82px;height:48px;border-bottom:5px solid var(--coral);border-radius:0 0 42px 42px;text-align:center;padding-top:16px;font-weight:900}.pan.left{left:8px}.pan.right{right:8px}
.vocab-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.vocab-card{height:132px;border:2px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;padding:14px;text-align:left;position:relative;overflow:hidden}.vocab-card strong{font-size:18px;color:var(--royal-dark)}.vocab-card .meaning{display:none;font-size:13px;line-height:1.5;margin-top:8px;color:var(--muted)}.vocab-card.flipped{background:var(--mint);border-color:#65c29f}.vocab-card.flipped .meaning{display:block}.vocab-card .tap{position:absolute;right:8px;bottom:6px;font-size:11px;color:var(--muted)}
.cycle{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}.cycle-node{width:74px;height:74px;border-radius:50%;background:#fff;border:3px solid var(--green);display:grid;place-items:center;text-align:center;font-size:12px;font-weight:900}.cycle-arrow{font-size:24px;color:var(--royal)}
.magnet-stage{display:flex;align-items:center;gap:25px;font-size:45px}.force-lines{color:var(--royal);letter-spacing:5px;animation:pulse 1.4s infinite}
.reading-layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px;align-items:start}.article{background:#fff;border:2px solid var(--line);border-radius:8px;padding:22px;box-shadow:var(--shadow)}.article h2{font-size:24px;color:var(--royal-dark);margin-bottom:4px}.article-meta{font-size:12px;color:var(--muted);margin-bottom:16px}.article p{font-size:17px;line-height:1.9;margin:12px 0}.vocab{border:0;border-bottom:3px solid var(--sun);background:#fffbe7;color:var(--royal-dark);font-weight:800;cursor:pointer;padding:0 2px}.dictionary{background:var(--mint);border:2px solid #8ed9bd;border-radius:8px;padding:14px;position:sticky;top:0}.dictionary h3{font-size:15px;color:var(--green-dark)}.dictionary input{width:100%;border:2px solid #8ed9bd;border-radius:8px;padding:9px;margin:9px 0;background:#fff}.word-result{min-height:90px;font-size:13px;line-height:1.55;color:var(--muted)}.word-result strong{display:block;color:var(--royal-dark);font-size:18px}.syntax-key{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;margin-top:10px}.syntax-key span{padding:3px 6px;border-radius:5px}.key-subject,.syntax-on .syntax-subject{background:#dce9ff}.key-verb,.syntax-on .syntax-verb{background:#dcf8e8}.key-detail,.syntax-on .syntax-detail{background:#fff0c3}.syntax-on .syntax-subject,.syntax-on .syntax-verb,.syntax-on .syntax-detail{padding:2px 3px;border-radius:4px}
.story-lab{background:#fff;border:2px solid var(--line);border-radius:8px;padding:20px}.builder-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.builder-row label{font-size:12px;font-weight:900;color:var(--muted)}.builder-row select{width:100%;border:2px solid var(--line);border-radius:8px;padding:10px;background:#fff;color:var(--ink);margin-top:5px}.generated-story{margin-top:14px;background:var(--lagoon);border-left:6px solid var(--royal);padding:16px;line-height:1.8;min-height:100px}
.cn{font-family:"PingFang SC","Microsoft YaHei",sans-serif}.oral-scene{height:230px;background:#dff6ff;border:2px solid #85cde8;border-radius:8px;position:relative;overflow:hidden;margin-bottom:16px}.oral-scene .place{position:absolute;left:0;right:0;bottom:0;height:70px;background:#bfe6aa;border-top:5px solid #8fc67b}.scene-item{position:absolute;font-size:50px}.scene-item.tree{left:8%;bottom:40px;font-size:74px}.scene-item.child{left:38%;bottom:42px}.scene-item.bin{right:14%;bottom:42px}.scene-item.litter{right:32%;bottom:32px;font-size:28px}.scene-item.sun{right:7%;top:12px;font-size:42px}.oral-tools{display:flex;gap:9px;flex-wrap:wrap}.oral-plan{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.plan-block{background:#fff;border:2px solid var(--line);border-radius:8px;padding:12px;min-height:104px}.plan-block strong{color:var(--royal-dark);display:block;margin-bottom:5px}.model-cn{display:none;margin-top:14px;background:var(--mint);border:2px solid #8ed9bd;border-radius:8px;padding:15px;line-height:1.8}.model-cn.show{display:block}.audio-playback{width:100%;margin-top:10px}
.library-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tool-card{min-height:120px;border:2px solid var(--line);border-radius:8px;background:#fff;padding:14px;text-align:left;cursor:pointer;color:var(--ink);transition:.16s}.tool-card:hover{border-color:var(--green);transform:translateY(-2px)}.tool-card .tool-icon{font-size:28px}.tool-card h3{font-size:14px;color:var(--royal-dark);margin:7px 0 4px}.tool-card p{font-size:12px;line-height:1.4;color:var(--muted)}
.tool-overlay{position:fixed;inset:0;background:#fff;z-index:80;display:none;flex-direction:column}.tool-overlay.show{display:flex}.tool-head{height:60px;background:var(--green);color:#fff;display:flex;align-items:center;padding:8px 14px;gap:10px}.tool-head h2{font-size:17px}.tool-head button{border:1px solid rgba(255,255,255,.4);border-radius:8px;background:rgba(255,255,255,.16);color:#fff;padding:9px 12px;cursor:pointer;font-weight:800}.tool-frame{flex:1;border:0;width:100%;background:#fff}
.toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-18px);background:var(--royal-dark);color:#fff;border:2px solid #fff;border-radius:8px;padding:11px 16px;z-index:120;box-shadow:0 8px 26px rgba(0,0,0,.2);font-weight:850;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:110}
.empty-note{padding:14px;border:2px dashed var(--line);border-radius:8px;color:var(--muted);text-align:center}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes twinkle{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.97);opacity:.2}100%{transform:scale(1);opacity:1}}
@keyframes drive{0%,100%{left:4%}50%{left:72%}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@media(max-width:1080px){.route-grid{grid-template-columns:1fr 1fr}.library-grid{grid-template-columns:1fr 1fr}.reading-layout{grid-template-columns:1fr}.dictionary{position:static}.vocab-grid{grid-template-columns:1fr 1fr}}
@media(max-width:900px){body{overflow:auto}.topbar{height:auto;min-height:68px}.brand{min-width:0}.brand small{display:none}.top-stats .stat-pill:nth-child(2){display:none}.app-shell{height:auto;min-height:calc(100dvh - 68px);grid-template-columns:1fr;overflow:visible}.control-rail{order:-1;border-left:0;border-bottom:2px solid var(--line);padding:10px 14px;overflow:visible}.mentor,.topic-list,.mission,.rail-actions,.rail-heading{display:none}.sea-nav-grid{grid-template-columns:repeat(6,1fr);gap:6px}.sea-nav{min-height:58px;justify-content:center;padding:5px;text-align:center}.sea-nav .animal{font-size:25px}.sea-nav span:last-child{display:none}.workspace{overflow:visible;padding:18px 14px 40px}.welcome{grid-template-columns:1fr}.crew-scene{height:130px}.options{grid-template-columns:1fr}.explain-grid{grid-template-columns:1fr}.builder-row,.oral-plan{grid-template-columns:1fr}.library-grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.topbar{padding:8px}.brand-mark{width:42px;height:42px}.brand strong{font-size:15px}.top-stats{gap:4px}.stat-pill{min-width:62px;padding:0 6px;font-size:12px}.icon-btn{width:42px;height:42px}.sea-nav-grid{grid-template-columns:repeat(6,1fr)}.welcome{padding:18px}.welcome h1{font-size:26px}.route-grid,.library-grid,.vocab-grid{grid-template-columns:1fr}.page-title h1{font-size:23px}.question-card{padding:16px}.question{font-size:18px}.ratio-model{gap:10px;transform:scale(.82)}.ocean-strip{justify-content:center}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}

<body>
<header class="topbar">
  <button class="brand" onclick="openView('home')" aria-label="Go to home">
    <span class="brand-mark">🔱</span>
    <span><strong>Johnson's Ocean Quest</strong><small>Small wins. Strong thinking.</small></span>
  </button>
  <div class="top-stats" aria-label="Learning progress">
    <div class="stat-pill" title="Learning streak">🔥 <span id="streakTop">0</span> days</div>
    <div class="stat-pill" title="Experience points">🫧 <span id="xpTop">0</span> XP</div>
    <button class="icon-btn" id="soundBtn" onclick="toggleSound()" title="Sound on" aria-label="Toggle sound">🔊</button>
  </div>
</header>

<div class="app-shell">
  <main class="workspace" id="workspace"><div class="screen" id="screen"></div></main>
  <aside class="control-rail" aria-label="Learning controls">
    <div class="mentor">
      <button class="neptune" onclick="sparkler(this)" title="Tap Neptune's sparkler" aria-label="Neptune's sparkler">🧜‍♂️</button>
      <div><h2>Captain Neptune</h2><p id="mentorMsg">One brave try starts the voyage.</p></div>
    </div>
    <div class="rail-heading">Choose a reef</div>
    <nav class="sea-nav-grid" id="mainNav">
      <button class="sea-nav" data-view="home" onclick="openView('home')" aria-label="Today's Route"><span class="animal">🐋</span><span>Today's Route</span></button>
      <button class="sea-nav" data-view="math" onclick="openView('math')" aria-label="Math Reef"><span class="animal">🐢</span><span>Math Reef</span></button>
      <button class="sea-nav" data-view="science" onclick="openView('science')" aria-label="Science Cove"><span class="animal">🐬</span><span>Science Cove</span></button>
      <button class="sea-nav" data-view="english" onclick="openView('english')" aria-label="Reading Bay"><span class="animal">🐙</span><span>Reading Bay</span></button>
      <button class="sea-nav" data-view="chinese" onclick="openView('chinese')" aria-label="华文海湾"><span class="animal">🦀</span><span>华文海湾</span></button>
      <button class="sea-nav" data-view="library" onclick="openView('library')" aria-label="Tool Library"><span class="animal">🦈</span><span>Tool Library</span></button>
    </nav>
    <div class="rail-heading" id="topicHeading">Today's choices</div>
    <div class="topic-list" id="topicList"></div>
    <div class="mission">
      <div class="mission-top"><span>Daily Dive</span><span id="missionCount">0 / 3</span></div>
      <div class="progress-track"><div class="progress-fill" id="missionFill"></div></div>
      <button class="reward-btn" id="rewardBtn" onclick="claimReward()">Open today's pearl +15 XP</button>
    </div>
    <div class="rail-actions">
      <button class="rail-action" onclick="backupProgress()">💾 Backup</button>
      <button class="rail-action" onclick="restoreProgress()">📥 Restore</button>
    </div>
  </aside>
</div>

<div class="tool-overlay" id="toolOverlay">
  <div class="tool-head"><button onclick="closeTool()">← Ocean Quest</button><h2 id="toolTitle">Learning Tool</h2></div>
  <iframe class="tool-frame" id="toolFrame" title="Johnson learning tool"></iframe>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<canvas id="fx"></canvas>

<script>
"use strict";
const $=id=>document.getElementById(id);
const STORE="johnson_ocean_quest_v1";
const ENCOURAGE=[
  "Your effort is visible. One step is still progress.",
  "Strong thinkers make brave first attempts.",
  "You do not need to know it yet. You are here to learn it.",
  "Every model answer adds a tool to your brain.",
  "Small wins become strong skills when they repeat."
];
let state={xp:0,streak:0,best:0,lastActive:"",missionDate:"",mission:0,rewardDate:"",sound:true,answers:{},savedWords:[]};
let currentView="home",currentTopic="",toastTimer=null,recorder=null,recordChunks=[],audioStream=null;

function localDay(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function yesterday(){const d=new Date();d.setDate(d.getDate()-1);return localDay(d)}
function loadState(){try{const s=JSON.parse(localStorage.getItem(STORE));if(s)state=Object.assign(state,s)}catch(e){}if(state.missionDate!==localDay()){state.missionDate=localDay();state.mission=0}saveState()}
function saveState(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}}
function firstActivityToday(){const t=localDay();if(state.lastActive===t)return;state.streak=state.lastActive===yesterday()?state.streak+1:1;state.best=Math.max(state.best,state.streak);state.lastActive=t}
function award(points,message,celebrate=true,key=""){
  const answerKey=key?localDay()+":"+key:"";
  if(answerKey&&state.answers[answerKey]){showToast(message);if(celebrate)sparkBurst(innerWidth/2,110,20,3);return}
  firstActivityToday();state.xp+=points;state.mission=Math.min(3,state.mission+1);if(answerKey)state.answers[answerKey]=true;saveState();renderChrome();showToast(message+"  +"+points+" XP");
  if(celebrate){playTone(true);sparkBurst(innerWidth/2,120,55,5)}else playTone(false);
}
function renderChrome(){
  $("streakTop").textContent=state.streak;$("xpTop").textContent=state.xp;$("missionCount").textContent=state.mission+" / 3";$("missionFill").style.width=(state.mission/3*100)+"%";
  $("soundBtn").textContent=state.sound?"🔊":"🔇";$("soundBtn").title=state.sound?"Sound on":"Sound off";
  const claimed=state.rewardDate===localDay();$("rewardBtn").disabled=claimed;$("rewardBtn").textContent=claimed?"Today's pearl collected ✓":"Open today's pearl +15 XP";
  document.querySelectorAll(".sea-nav").forEach(b=>b.classList.toggle("active",b.dataset.view===currentView));
}
function claimReward(){if(state.rewardDate===localDay())return;state.rewardDate=localDay();firstActivityToday();state.xp+=15;saveState();renderChrome();fireworks();playTone(true);showToast("A pearl for showing up today!  +15 XP")}
function toggleSound(){state.sound=!state.sound;saveState();renderChrome();if(state.sound)playTone(true)}
function playTone(good){if(!state.sound)return;try{const A=window.AudioContext||window.webkitAudioContext;const ac=new A();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type="sine";o.frequency.setValueAtTime(good?660:330,ac.currentTime);if(good)o.frequency.exponentialRampToValueAtTime(990,ac.currentTime+.14);g.gain.setValueAtTime(.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.24);o.start();o.stop(ac.currentTime+.25)}catch(e){}}
function showToast(msg){clearTimeout(toastTimer);$("toast").textContent=msg;$("toast").classList.add("show");toastTimer=setTimeout(()=>$("toast").classList.remove("show"),2400)}

const TOPICS={
  home:[{id:"math",label:"🐢 Start with one Math model"},{id:"science",label:"🐬 Learn one Science word"},{id:"english",label:"🐙 Read today's story"},{id:"chinese",label:"🦀 练习口语"}],
  math:[{id:"mistakes",label:"Mistake Shells"},{id:"angles",label:"Angles"},{id:"percentage",label:"Percentage"},{id:"fractions",label:"Fractions"},{id:"ratio",label:"Ratio"},{id:"average",label:"Average"},{id:"speed",label:"Speed"},{id:"algebra",label:"Algebra"}],
  science:[{id:"vocab",label:"Science Word Pearls"},{id:"living",label:"Living & Non-living"},{id:"materials",label:"Materials"},{id:"cycles",label:"Life Cycles"},{id:"magnets",label:"Magnets"}],
  english:[{id:"story",label:"Today's Adventure"},{id:"news",label:"Today's News"},{id:"storylab",label:"Build a Story"}],
  chinese:[{id:"reading",label:"短文阅读"},{id:"oral",label:"口语训练"}],
  library:[{id:"english",label:"English Tools"},{id:"math",label:"Math Tools"},{id:"chinese",label:"华文工具"},{id:"progress",label:"Progress Tools"}]
};
function setTopic(topic){currentTopic=topic;if(currentView==="math")renderMath(topic);else if(currentView==="science")renderScience(topic);else if(currentView==="english")renderEnglish(topic);else if(currentView==="chinese")renderChinese(topic);else if(currentView==="library")renderLibrary(topic);else openView(topic);renderTopics()}
function renderTopics(){
  const list=TOPICS[currentView]||[];$("topicHeading").textContent=currentView==="home"?"Today's choices":"Choose a topic";
  $("topicList").innerHTML=list.map(t=>`<button class="topic-btn ${currentTopic===t.id?'active':''}" onclick="setTopic('${t.id}')"><span class="topic-dot"></span>${t.label}</button>`).join("");
}
function openView(view,topic=""){
  currentView=view;currentTopic=topic||({math:"angles",science:"vocab",english:"story",chinese:"reading",library:"english"}[view]||"");
  $("mentorMsg").textContent=ENCOURAGE[(new Date().getDate()+Object.keys(TOPICS).indexOf(view)+1)%ENCOURAGE.length];renderChrome();renderTopics();
  if(view==="home")renderHome();if(view==="math")renderMath(currentTopic);if(view==="science")renderScience(currentTopic);if(view==="english")renderEnglish(currentTopic);if(view==="chinese")renderChinese(currentTopic);if(view==="library")renderLibrary(currentTopic);
  $("workspace").scrollTop=0;
}

function renderHome(){
  const h=new Date().getHours(),g=h<12?"Good morning":h<18?"Good afternoon":"Good evening";
  $("screen").innerHTML=`
    <section class="welcome">
      <div><div class="eyebrow">Daily Dive · ${localDay()}</div><h1>${g}, Johnson.</h1><p class="lead">Today is not a test of how much you already know. Choose one reef, make one brave try, then study the picture and model answer.</p><button class="primary green" onclick="openView('math','angles')">Begin today's 10-minute dive →</button></div>
      <div class="crew-scene" aria-label="Neptune and ocean learning crew"><span class="crew-main">🧜‍♂️</span><span class="crew-mini one">🐢</span><span class="crew-mini two">🐬</span><span class="crew-mini three">🐠</span></div>
    </section>
    <div class="section-head"><div><h2>Choose today's reef</h2><p>Every answer opens the worked model, even when the first try misses.</p></div><strong>🫧 ${state.xp} XP</strong></div>
    <section class="route-grid">
      <button class="route-card math" onclick="openView('math')"><span class="big-icon">🐢</span><h3>Math Model Reef</h3><p>Angles, percentages, fractions, ratio, average, speed and algebra.</p><span class="go">Dive →</span></button>
      <button class="route-card science" onclick="openView('science')"><span class="big-icon">🐬</span><h3>Science Word Cove</h3><p>Build precise vocabulary, then turn OEQ thinking into friendly MCQ choices.</p><span class="go">Explore →</span></button>
      <button class="route-card english" onclick="openView('english')"><span class="big-icon">🐙</span><h3>Reading Bay</h3><p>One adventure, one news-style text, clickable words and sentence maps.</p><span class="go">Read →</span></button>
      <button class="route-card chinese" onclick="openView('chinese')"><span class="big-icon">🦀</span><h3>华文珊瑚湾</h3><p>选择题、小短文与看图口语，先看范例再组织自己的答案。</p><span class="go">出发 →</span></button>
    </section>
    <div class="section-head"><div><h2>Meet the study crew</h2><p>Tap a friend for a tiny spark of encouragement.</p></div></div>
    <div class="ocean-strip">${["🐋","🐢","🐬","🐙","🦈","🐠","🦀","🐡","🦭","🪼","🦞","🧜‍♂️"].map(x=>`<button class="animal-chip" onclick="crewCheer(this)" aria-label="Ocean friend ${x}">${x}</button>`).join("")}</div>`;
}
function crewCheer(el){const msgs=["Tiny step, real progress!","Your thinking is getting stronger.","A brave try counts.","You found another clue.","Keep the picture in your mind!"];showToast(msgs[Math.floor(Math.random()*msgs.length)]);sparkler(el)}

const MATH={
  angles:{title:"Angles",tag:"See the full turn",q:"Three angles meet at a point. Two angles are 110° and 95°. What is the third angle?",opts:["145°","155°","165°","205°"],ans:1,visual:`<div class="angle-model"><div class="ray a"></div><div class="ray b"></div><div class="ray c"></div><div class="angle-dot"></div><div class="angle-label x">x°</div><div class="angle-label one">110°</div><div class="angle-label two">95°</div></div>`,model:"A full turn is 360°. Therefore, x = 360° − 110° − 95° = 155°.",steps:["Start with one full turn: 360°.","Combine the known angles: 110° + 95° = 205°.","Find the missing part: 360° − 205° = 155°."]},
  percentage:{title:"Percentage",tag:"Find 100% from a known part",q:"A tank is 40% full and contains 24 L of water. What is the tank's full capacity?",opts:["48 L","60 L","64 L","96 L"],ans:1,visual:percentVisual(40),model:"40% is 24 L. So 10% is 6 L, and 100% is 60 L.",steps:["40% → 24 L","Divide both sides by 4: 10% → 6 L","Multiply by 10: 100% → 60 L"]},
  fractions:{title:"Fractions",tag:"Move from parts to the whole",q:"3/5 of Johnson's stickers are blue. There are 18 blue stickers. How many stickers are there altogether?",opts:["24","30","36","45"],ans:1,visual:`<div class="bar-model"><div class="bar-row">${[1,2,3,4,5].map(i=>`<div class="bar-part ${i<=3?'hot':''}">${i<=3?'6':'?'}</div>`).join("")}</div><div style="text-align:center;font-weight:900">3 parts = 18, so 1 part = 6</div></div>`,model:"3 parts represent 18 stickers. One part is 18 ÷ 3 = 6. Five parts are 6 × 5 = 30 stickers.",steps:["Draw 5 equal parts because the denominator is 5.","The 3 blue parts total 18, so each part is 6.","The whole has 5 parts: 5 × 6 = 30."]},
  ratio:{title:"Ratio",tag:"Turn units into real amounts",q:"The ratio of boys to girls in a club is 3 : 5. There are 40 children altogether. How many girls are there?",opts:["15","20","24","25"],ans:3,visual:`<div class="ratio-model"><div><div class="dot-group">${Array(3).fill('<span class="ratio-dot"></span>').join('')}</div><b>3 boy units</b></div><div><div class="dot-group">${Array(5).fill('<span class="ratio-dot girl"></span>').join('')}</div><b>5 girl units</b></div></div>`,model:"There are 3 + 5 = 8 units. One unit is 40 ÷ 8 = 5 children. The 5 girl units represent 5 × 5 = 25 girls.",steps:["Add the ratio units: 3 + 5 = 8.","Find one unit: 40 ÷ 8 = 5 children.","Find five girl units: 5 × 5 = 25 girls."]},
  average:{title:"Average",tag:"Rebuild the total",q:"The average of four numbers is 13. Three of the numbers are 12, 15 and 9. What is the fourth number?",opts:["13","14","15","16"],ans:3,visual:`<div class="bar-model"><div class="bar-row"><div class="bar-part">12</div><div class="bar-part">15</div><div class="bar-part">9</div><div class="bar-part unknown">?</div></div><div style="text-align:center;font-weight:900">4 equal average shares of 13 → total 52</div></div>`,model:"The total of four numbers is 13 × 4 = 52. The known numbers total 12 + 15 + 9 = 36. The fourth number is 52 − 36 = 16.",steps:["Rebuild the total: average × number of items = 13 × 4 = 52.","Add the known numbers: 12 + 15 + 9 = 36.","Find the missing number: 52 − 36 = 16."]},
  speed:{title:"Speed",tag:"Distance divided by time",q:"A cyclist travels 72 km in 1.5 hours. What is the cyclist's average speed?",opts:["36 km/h","48 km/h","54 km/h","108 km/h"],ans:1,visual:`<div class="track-model"><div class="track-line"><span class="track-car">🚴</span></div><div class="track-stats"><span>72 km</span><span>1.5 h</span></div></div>`,model:"Average speed = total distance ÷ total time = 72 ÷ 1.5 = 48 km/h.",steps:["Use total distance: 72 km.","Use total time: 1.5 h.","Divide distance by time: 72 ÷ 1.5 = 48 km/h."]},
  algebra:{title:"Algebra",tag:"Keep both sides balanced",q:"A number is multiplied by 4, then 7 is added. The result is 31. What is the number?",opts:["5","6","7","8"],ans:1,visual:`<div class="balance"><div class="beam"></div><div class="stand"></div><div class="base"></div><div class="pan left">4x + 7</div><div class="pan right">31</div></div>`,model:"4x + 7 = 31. Subtract 7 from both sides: 4x = 24. Divide both sides by 4: x = 6.",steps:["Write the relationship: 4x + 7 = 31.","Undo +7 on both sides: 4x = 24.","Share 24 into 4 equal groups: x = 6."]}
};
function percentVisual(n){let h='<div><div class="percent-grid">';for(let i=0;i<100;i++)h+=`<span class="percent-cell ${i<n?'on':''}"></span>`;return h+'</div><div style="text-align:center;margin-top:7px;font-weight:900">40 shaded squares = 40%</div></div>'}
function renderMath(topic){
  if(topic==="mistakes"){renderMistakes();return}const q=MATH[topic]||MATH.angles;
  $("screen").innerHTML=`<div class="page-title"><div class="page-icon">🐢</div><div><h1>Math Model Reef</h1><p>Try it, then see the thinking move in pictures.</p></div></div>
    <div class="topic-chips">${TOPICS.math.filter(t=>t.id!=="mistakes").map(t=>`<button class="chip-btn ${topic===t.id?'active':''}" onclick="setTopic('${t.id}')">${t.label}</button>`).join("")}</div>
    <section class="question-card"><div class="question-kicker"><span>${q.title}</span><span>Original Singapore-style practice</span></div><div class="question">${q.q}</div><div class="visual-stage">${q.visual}</div><div class="options" id="mathOptions">${q.opts.map((o,i)=>`<button class="option" onclick="answerMath('${topic}',${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join("")}</div><div id="mathFeedback"></div></section>`;
}
function answerMath(topic,pick){const q=MATH[topic],buttons=[...document.querySelectorAll("#mathOptions .option")];buttons.forEach((b,i)=>{b.disabled=true;if(i===q.ans)b.classList.add("correct");if(i===pick&&i!==q.ans)b.classList.add("wrong")});const ok=pick===q.ans;$("mathFeedback").innerHTML=feedbackHTML(ok,q.model,q.steps);award(ok?10:5,ok?"Correct thinking!":"Good try. The model is now yours.",ok,"math-"+topic)}
function feedbackHTML(ok,model,steps){return `<div class="feedback ${ok?'good':'try'}"><h3>${ok?'✅ Clear thinking!':'💙 Brave try. Study the pattern below.'}</h3><div class="model-answer"><strong>Model Answer</strong><p>${model}</p></div><div class="explain-grid">${steps.map((s,i)=>`<div class="explain-step"><span class="step-no">${i+1}</span>${s}</div>`).join("")}</div></div>`}
function renderMistakes(){$("screen").innerHTML=`<div class="page-title"><div class="page-icon">🐚</div><div><h1>Mistake Shells</h1><p>Old mistakes are clues, not labels.</p></div></div><div class="question-card"><div class="question">Johnson's collected paper-review tools</div><p class="lead">Open the original mistake collections, then return here for topic-by-topic picture models.</p><div class="library-grid" style="margin-top:14px"><button class="tool-card" onclick="openTool('Johnson/tools/Johnson_WA2_错题挑战赛.html','WA2 Mistake Challenge')"><span class="tool-icon">⚔️</span><h3>WA2 Mistake Challenge</h3><p>Review and fix collected questions.</p></button><button class="tool-card" onclick="openTool('Johnson/tools/Johnson_P5_T3_Math_批改报告.html','P5 T3 Math Review')"><span class="tool-icon">📊</span><h3>P5 T3 Paper 2 Review</h3><p>Return to marked-paper learning points.</p></button><button class="tool-card" onclick="setTopic('angles')"><span class="tool-icon">🐢</span><h3>Start a fresh model</h3><p>Practise one visual topic now.</p></button></div></div>`}

const VOCAB=[
  ["characteristic","a feature that helps us describe or identify something","Living things share characteristics such as growing and reproducing."],
  ["classify","to sort things into groups using shared characteristics","We classify animals by features we can observe."],
  ["material","the substance an object is made from","A raincoat may be made from waterproof material."],
  ["flexible","able to bend without breaking","Rubber is flexible, so it can bend."],
  ["offspring","a young living thing produced by its parent","A chick is the offspring of a hen."],
  ["life cycle","the stages a living thing passes through as it grows","A butterfly's life cycle includes egg, larva, pupa and adult."],
  ["attract","to pull an object closer","A magnet can attract an iron nail."],
  ["repel","to push another magnet away","Like poles repel each other."],
  ["magnetic","able to be attracted by a magnet","Iron and steel are magnetic materials."]
];
const SCIENCE={
  living:{title:"Living & Non-living Things",q:"A battery-powered toy car can move. Which response best explains why the toy car is non-living?",opts:["It is non-living because it is small.","It is non-living because it cannot grow and reproduce by itself; movement alone is not enough.","It is living because all moving things are alive.","It is living because it uses energy from a battery."],ans:1,model:"The toy car is non-living because it <mark>cannot grow</mark> and <mark>cannot reproduce</mark> by itself. Movement alone is not a characteristic that proves something is living.",visual:`<div style="text-align:center"><div style="font-size:64px">🚗 🔋</div><div style="font-weight:900;margin-top:8px">moves ✓ &nbsp; grows ✕ &nbsp; reproduces ✕</div></div>`},
  materials:{title:"Diversity of Materials",q:"Mei wants to make a rain cover for her school bag. Which is the best material and reason?",opts:["Paper, because it absorbs water.","Clear plastic, because it is waterproof and flexible.","Cotton, because it is soft and absorbent.","Glass, because it is hard and heavy."],ans:1,model:"Clear plastic is suitable because it is <mark>waterproof</mark>, so water cannot pass through it, and <mark>flexible</mark>, so it can wrap around the bag.",visual:`<div style="display:flex;gap:18px;align-items:center;font-size:52px"><span>🎒</span><span style="color:var(--royal)">＋</span><span>🛍️</span><span style="color:var(--green)">→ dry ✓</span></div>`},
  cycles:{title:"Life Cycles",q:"Which sequence shows the life cycle of a butterfly in the correct order?",opts:["egg → pupa → larva → adult","egg → larva → pupa → adult","larva → egg → adult → pupa","adult → pupa → egg → larva"],ans:1,model:"The butterfly life cycle is <mark>egg → larva (caterpillar) → pupa → adult</mark>. The adult then lays eggs and the cycle repeats.",visual:`<div class="cycle"><div class="cycle-node">🥚<br>egg</div><span class="cycle-arrow">→</span><div class="cycle-node">🐛<br>larva</div><span class="cycle-arrow">→</span><div class="cycle-node">🟤<br>pupa</div><span class="cycle-arrow">→</span><div class="cycle-node">🦋<br>adult</div></div>`},

let particles=[],fxActive=false;
const FX=["#1557c0","#0aa779","#ff7b6b","#ffd45c","#92dcf6","#ffffff"];
function sparkBurst(x,y,n=40,speed=4){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=(.35+Math.random())*speed;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.5,g:.09,life:45+Math.random()*30,size:2+Math.random()*4,color:FX[i%FX.length],rot:Math.random()*6})}if(!fxActive){fxActive=true;requestAnimationFrame(drawFX)}}
function drawFX(){const c=$("fx"),ctx=c.getContext("2d"),dpr=Math.min(devicePixelRatio||1,2);c.width=innerWidth*dpr;c.height=innerHeight*dpr;c.style.width=innerWidth+"px";c.style.height=innerHeight+"px";ctx.scale(dpr,dpr);particles=particles.filter(p=>p.life>0);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.life--;p.rot+=.1;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=Math.min(1,p.life/24);ctx.fillStyle=p.color;ctx.fillRect(-p.size,-p.size/2,p.size*2,p.size);ctx.restore()});if(particles.length)requestAnimationFrame(drawFX);else{fxActive=false;ctx.clearRect(0,0,innerWidth,innerHeight)}}
function sparkler(el){const r=el.getBoundingClientRect();for(let i=0;i<5;i++)setTimeout(()=>sparkBurst(r.left+r.width/2,r.top+r.height/2,18,3.5),i*120);playTone(true);showToast("Neptune says: effort creates the sparkle.")}
function fireworks(){for(let i=0;i<5;i++)setTimeout(()=>sparkBurst(innerWidth*(.18+Math.random()*.64),innerHeight*(.18+Math.random()*.4),70,6),i*180)}
