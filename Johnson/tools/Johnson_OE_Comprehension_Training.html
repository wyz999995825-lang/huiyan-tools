<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Johnson P5 OE Comprehension — 7-Day Training</title>
<style>
:root{
  --bg:#faf5ec;--card:#fff8f0;--border:#e0d5c5;--text:#2c2418;--text2:#7a6e5e;
  --accent:#1a7a6d;--accent-bg:#e8f5f0;--green:#1a8a5c;--green-bg:#e5f5ec;
  --red:#c0392b;--red-bg:#fce8e6;--orange:#d4790e;--orange-bg:#fdf0dc;
  --yellow:#9a7b1a;--yellow-bg:#fdf6e3;
  --radius:12px;--shadow:0 2px 8px rgba(0,0,0,.06);
  --font-body:17px;--font-passage:17px;--font-q:16px;--lh:1.9
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1a16;--card:#262420;--border:#3e3a32;--text:#e8e2d8;--text2:#a09888;
  --accent:#3dbfa8;--accent-bg:#1a2e2a;--green-bg:#1a2e22;--red-bg:#2e1a1a;
  --orange-bg:#2e2618;--yellow-bg:#2e2a18
}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Georgia","Noto Serif SC","Times New Roman",serif;background:var(--bg);color:var(--text);line-height:var(--lh);padding:20px;max-width:820px;margin:0 auto;font-size:var(--font-body)}
h1{font-size:24px;margin-bottom:4px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.subtitle{color:var(--text2);font-size:15px;margin-bottom:20px;font-family:-apple-system,sans-serif}
/* Day Tabs */
.day-tabs{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap;position:sticky;top:0;z-index:10;background:var(--bg);padding:10px 0;font-family:-apple-system,sans-serif}
.day-tab{padding:10px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);cursor:pointer;font-size:14px;font-weight:500;transition:.2s;min-width:44px;text-align:center}
.day-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.day-tab.locked{opacity:.4;cursor:not-allowed}
.day-tab.done{border-color:var(--green);color:var(--green)}
.day-tab.done.active{background:var(--green);color:#fff}
/* Day Content */
.day{display:none}
.day.active{display:block}
.day-header{background:var(--accent-bg);border:1.5px solid var(--accent);border-radius:var(--radius);padding:18px 20px;margin-bottom:20px}
.day-header h2{font-size:19px;color:var(--accent);margin-bottom:6px;font-family:-apple-system,sans-serif}
.day-header .day-focus{font-size:15px;color:var(--text2)}
.day-header .day-skills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.day-header .skill-tag{font-size:12px;background:var(--card);border:1px solid var(--border);padding:3px 10px;border-radius:14px;font-family:-apple-system,sans-serif}
/* Framework Box */
.framework{background:var(--card);border:2px solid var(--accent);border-radius:var(--radius);padding:18px;margin-bottom:20px}
.framework h3{font-size:16px;color:var(--accent);margin-bottom:10px;font-family:-apple-system,sans-serif}
.fw-step{display:flex;gap:12px;margin-bottom:10px;font-size:15px}
.fw-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0;font-family:-apple-system,sans-serif}
.fw-p .fw-icon{background:#dbeafe;color:#2563eb}
.fw-e .fw-icon{background:#fef3cd;color:#92400e}
.fw-x .fw-icon{background:#d1fae5;color:#065f46}
@media(prefers-color-scheme:dark){
.fw-p .fw-icon{background:#1e3a5a;color:#93c5fd}
.fw-e .fw-icon{background:#3d3019;color:#fbbf24}
.fw-x .fw-icon{background:#1a3a2a;color:#6ee7b7}
}
/* Passage */
.passage{background:var(--yellow-bg);border-left:5px solid var(--orange);padding:20px 22px;border-radius:0 var(--radius) var(--radius) 0;margin-bottom:22px;font-size:var(--font-passage);line-height:2.1}
.passage-title{font-weight:700;font-size:15px;color:var(--accent);margin-bottom:12px;font-family:-apple-system,sans-serif}
.passage .ln{color:var(--orange);font-size:13px;margin-right:8px;user-select:none;font-weight:700;font-family:-apple-system,sans-serif}
.kw{background:#ffe8b0;padding:2px 5px;border-radius:4px;font-weight:600}
@media(prefers-color-scheme:dark){.kw{background:#4a3a18}}
/* Question Card */
.qcard{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow);transition:border-color .3s}
.qcard.st-correct{border-color:var(--green)}
.qcard.st-partial{border-color:var(--orange)}
.qcard.st-wrong{border-color:var(--red)}
.qcard .qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-family:-apple-system,sans-serif}
.qcard .qnum{font-weight:700;font-size:15px;color:var(--accent)}
.qcard .qmarks{font-size:13px;color:var(--text2);background:var(--bg);padding:3px 10px;border-radius:10px}
.qcard .qtext{font-size:var(--font-q);margin-bottom:12px;line-height:1.7}
.qcard .error-ref{display:inline-block;font-size:12px;background:var(--orange-bg);color:var(--orange);padding:3px 10px;border-radius:6px;margin-bottom:10px;font-family:-apple-system,sans-serif}
.qcard textarea{width:100%;min-height:100px;border:2px solid var(--border);border-radius:10px;padding:14px;font-size:16px;font-family:inherit;resize:vertical;background:var(--bg);color:var(--text);line-height:1.7}
.qcard textarea:focus{outline:none;border-color:var(--accent)}
.qcard textarea:disabled{opacity:.5}
.qcard .btnrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center;font-family:-apple-system,sans-serif}
.btn{padding:10px 20px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:.2s;font-family:-apple-system,sans-serif}
.btn-go{background:var(--accent);color:#fff}
.btn-go:hover{opacity:.9}
.btn-go:disabled{opacity:.35;cursor:not-allowed}
.btn-hint{background:var(--bg);border:1.5px solid var(--border);color:var(--text2)}
.btn-retry{background:var(--orange);color:#fff;display:none}
.wcount{font-size:13px;color:var(--text2);margin-left:auto;font-family:-apple-system,sans-serif}
.wcount .wc{font-weight:700}
.hint{margin-top:10px;padding:14px;background:var(--yellow-bg);border-radius:10px;font-size:15px;color:var(--yellow);display:none;line-height:1.7}
.hint.show{display:block}
.fb{margin-top:12px;padding:14px 16px;border-radius:10px;font-size:15px;line-height:1.7;display:none}
.fb.correct{display:block;background:var(--green-bg);border:1.5px solid #a7d7b8;color:#1a5c36}
.fb.partial{display:block;background:var(--orange-bg);border:1.5px solid #e0c8a0;color:#7a5a1a}
.fb.wrong{display:block;background:var(--red-bg);border:1.5px solid #e8b0aa;color:#7a1a1a}
@media(prefers-color-scheme:dark){
.fb.correct{background:#1a2e22;border-color:#2a5a3a;color:#7dcea0}
.fb.partial{background:#2e2618;border-color:#5a4a28;color:#e8c870}
.fb.wrong{background:#2e1a1a;border-color:#5a2a2a;color:#e8a0a0}
}
.att{font-size:12px;color:var(--text2)}
/* Progress */
.pbar{height:8px;background:var(--border);border-radius:4px;margin-bottom:18px;overflow:hidden}
.pfill{height:100%;background:var(--green);border-radius:4px;transition:width .4s}
/* Summary */
.summary{background:var(--card);border:2px solid var(--green);border-radius:var(--radius);padding:24px;margin-top:24px;text-align:center;display:none}
.summary h3{font-size:20px;margin-bottom:6px;font-family:-apple-system,sans-serif}
.summary .bscore{font-size:42px;font-weight:700;color:var(--accent);font-family:-apple-system,sans-serif}
.summary .detail{font-size:14px;color:var(--text2);margin-top:6px}
.nbtn{display:block;width:100%;padding:14px;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-top:14px;font-family:-apple-system,sans-serif}
.nbtn:hover{opacity:.9}
.nbtn:disabled{opacity:.35;cursor:not-allowed}
.rbtn{display:block;width:100%;padding:12px;background:transparent;color:var(--text2);border:1.5px solid var(--border);border-radius:10px;font-size:14px;cursor:pointer;margin-top:8px;font-family:-apple-system,sans-serif}
/* Overall progress */
.overall{background:var(--accent-bg);border-radius:var(--radius);padding:16px 20px;margin-bottom:20px;font-family:-apple-system,sans-serif}
.overall h3{font-size:15px;color:var(--accent);margin-bottom:8px}
.overall .week-bar{display:flex;gap:4px;height:12px}
.overall .week-seg{flex:1;border-radius:3px;background:var(--border);transition:background .3s}
.overall .week-seg.done{background:var(--green)}
.overall .week-seg.current{background:var(--accent)}
</style>
</head>
<body>
<h1>Johnson OE Comprehension · 7-Day Training</h1>
<p class="subtitle">P5 Term 3 · 基于 28 道错题定制 · 每天 1 篇 + 5 道题</p>

<div class="overall">
  <h3>Week Progress</h3>
  <div class="week-bar" id="weekBar"></div>
</div>

<div class="day-tabs" id="dayTabs"></div>
<div id="dayContainer"></div>

<script>
// ======================== DATA ========================
const DAYS = [
{
  title: "Day 1: PEE 答题框架",
  focus: "学会用 Point-Evidence-Explanation 写出完整的 2 分答案",
  skills: ["PEE 框架","比喻解读","2 分题结构"],
  framework: {
    title: "PEE 答题框架（每道 OE 题都要用）",
    steps: [
      {cls:"fw-p",icon:"P",html:"<strong>Point</strong> — 先写你的观点/答案（用完整句）<br><em>例：Ethan felt defeated and hopeless.</em>"},
      {cls:"fw-e",icon:"E",html:"<strong>Evidence</strong> — 引用原文证据（用引号）<br><em>例：The text says he \"sank into the sofa like a deflated balloon\".</em>"},
      {cls:"fw-x",icon:"X",html:"<strong>Explanation</strong> — 用自己的话解释为什么<br><em>例：This suggests he had lost all energy and felt empty inside, just like a balloon with no air.</em>"}
    ]
  },
  passage: `<span class="ln">1</span>Every Saturday morning, eleven-year-old Maya would visit her grandmother's flat in Toa Payoh. The familiar smell of pandan cake greeted her as she stepped through the door, and Ah Ma would already be in the kitchen, humming an old Hokkien tune.
<br><br><span class="ln">5</span>But today, something was different. The kitchen was dark and silent. Maya found Ah Ma sitting in the living room, staring at an old photograph. It showed a young couple standing outside a shophouse — Ah Ma and Ah Gong, decades ago, before Maya was even born.
<br><br><span class="ln">9</span>"Ah Ma?" Maya said softly.
<br><br><span class="ln">10</span>Her grandmother looked up, and Maya saw that <span class="kw">her eyes were two tired lanterns, flickering but refusing to go out</span>. "Today is your Ah Gong's birthday," she said quietly. "He would have been eighty."
<br><br><span class="ln">13</span>Maya sat beside her and took the photograph. The man in the picture had kind eyes and a wide grin. She had never met him — he passed away before she was born — but Ah Ma had told her a thousand stories. How he would cycle to the market at dawn to buy the freshest fish. How he sang terribly but always sang anyway.
<br><br><span class="ln">18</span>"Do you miss him?" Maya asked.
<br><br><span class="ln">19</span>"Every single day," Ah Ma said. Then she <span class="kw">straightened her back and lifted her chin</span>. "But he would scold me if he saw me sitting here feeling sorry for myself. <span class="kw">He always said that the best way to remember someone is to keep living the way they taught you to.</span>"
<br><br><span class="ln">23</span>She stood up, smoothed her blouse, and walked to the kitchen. "Come, girl. <span class="kw">We have a pandan cake to bake.</span>"
<br><br><span class="ln">25</span>Maya followed, and soon the flat was filled with the <span class="kw">warm, green-gold scent of pandan and coconut</span>. As <span class="kw">they</span> worked side by side, Ah Ma began humming again — the same old Hokkien tune. And this time, Maya hummed along.`,
  questions: [
    {
      num: "Q1 — Figurative Language", marks: 2,
      text: 'What does the phrase <strong>"her eyes were two tired lanterns, flickering but refusing to go out"</strong> (Line 10) tell us about Ah Ma?',
      ref: "你的错题 M017：比喻题只写了一个词 anxious，丢了 2 分",
      hint: "2 分题 = 2 层。(1) 比喻含义：tired lanterns flickering = ？ (2) 这说明 Ah Ma 的情感和精神状态是怎样的？",
      placeholder: "P: Ah Ma felt...\nE: The text describes her eyes as...\nX: This suggests...",
      check(n) {
        const hasMetaphor = /lantern|flicker|tired|dim|fad|weak|weary|glow|light/.test(n);
        const hasFeeling = /sad|grief|sorrow|miss|strong|resilient|determin|persist|refus.*give|not give up|carry on|endur/.test(n);
        const long = n.split(' ').length >= 10;
        if (hasMetaphor && hasFeeling && long) return {r:'correct',fb:'<strong>✓ Excellent!</strong> 你同时解释了比喻含义和深层情感。<br><strong>Model:</strong> Ah Ma\'s eyes are compared to "tired lanterns" that are "flickering but refusing to go out" (E). This suggests she is weary and sad from years of missing Ah Gong — like a lantern running low on oil (metaphor meaning). Yet the fact that the lanterns "refuse to go out" shows she is also resilient and determined to carry on despite her grief (P+X).'};
        if (hasMetaphor || hasFeeling) return {r:'partial',fb:'<strong>△ 部分正确。</strong> 2 分需要两层：(1) "tired lanterns flickering" = 她疲惫悲伤（像快熄灭的灯笼）(2) "refusing to go out" = 但她坚强不放弃。'+(long?'':'答案再写长一些。')};
        return {r:'wrong',fb:'<strong>✗ 两层含义：</strong>(1) "tired lanterns" = 疲惫的灯笼 = 她因多年思念而憔悴悲伤 (2) "flickering but refusing to go out" = 虽然灯火微弱但不肯熄灭 = 她虽然悲伤但坚强不放弃。用 PEE 框架重写！'};
      }
    },
    {
      num: "Q2", marks: 2,
      text: 'How did Ah Ma\'s mood change from the beginning to the end of the passage? Use evidence to support your answer.',
      ref: "你的错题 M021：Before/After 对比回答不准确",
      hint: "对比题：(1) 开头她的状态是什么？引用证据。(2) 结尾呢？也引用证据。说明是什么导致了这个变化。",
      placeholder: "At the beginning, Ah Ma felt...\nBy the end, she...\nThis change happened because...",
      check(n) {
        const hasBefore = /sad|quiet|still|star|silent|dark|griev|miss|photograph|melanchol|lonely/.test(n);
        const hasAfter = /hum|bake|cake|kitchen|cheer|better|bright|pandan|stand up|positive|liv/.test(n);
        const long = n.split(' ').length >= 12;
        if (hasBefore && hasAfter && long) return {r:'correct',fb:'<strong>✓ Well done!</strong> 对比清晰，证据充分。<br><strong>Model:</strong> At the beginning, Ah Ma was sad and withdrawn — the kitchen was "dark and silent", and she was staring at an old photograph of Ah Gong (E). By the end, her mood had shifted to one of warmth and purpose. She stood up, went to the kitchen, and invited Maya to bake, saying "We have a pandan cake to bake" (E). This change happened because she remembered Ah Gong\'s advice: "the best way to remember someone is to keep living the way they taught you to." She chose to honour his memory through action rather than sadness (X).'};
        if (hasBefore || hasAfter) return {r:'partial',fb:'<strong>△ 你只写了一半。</strong>对比题要两边都写：(1) 开头：sad, silent, staring at photograph (2) 结尾：baking, humming, active。还要解释为什么变化（Ah Gong 的话启发了她）。'};
        return {r:'wrong',fb:'<strong>✗ 对比：</strong>开头 — kitchen "dark and silent"，她独自看老照片（sad/grieving）。结尾 — 她站起来去厨房烘焙，开始哼歌（positive/determined）。变化原因：她想起 Ah Gong 说"remember someone by keep living"。'};
      }
    },
    {
      num: "Q3 — Phrase ID", marks: 1, phraseLen: 4,
      text: 'From Lines 19–22, pick out a <strong>four-word phrase</strong> that shows Ah Ma regained her composure and strength.',
      ref: "你的错题 M008：Phrase ID 没按词数要求",
      hint: "composure = 镇定、恢复精神。在 Lines 19-22 中找一个身体动作的描述，数清楚 4 个词。",
      placeholder: "写出 4 个词的短语",
      check(n) {
        if (/straightened her back and/.test(n) || /her back and lifted/.test(n) || /back and lifted her/.test(n)) return {r:'correct',fb:'<strong>✓ 找对了！</strong>"straightened her back and lifted" 或类似的 4 词短语表达了她振作起来、重新站稳。不过最精确的答案是 "straightened her back and" + "lifted her chin" 两个动作。'};
        if (/lifted her chin/.test(n)) return {r:'partial',fb:'<strong>△ "lifted her chin" 只有 3 个词</strong>，题目要 4 个词。试试包含更多词：如 "and lifted her chin"。'};
        if (/straighten|lifted|chin|back/.test(n)) return {r:'partial',fb:'<strong>△ 方向对了</strong>，但要写出恰好 4 个词的完整短语。"straightened her back and" 或 "and lifted her chin" 都不太完美。最佳答案：这道题确实比较难截——可以写 "straightened her back and" (4词)。'};
        return {r:'wrong',fb:'<strong>✗ 正确答案区域：</strong>"straightened her back and lifted her chin" — 这表示她重新振作。4 词可以截 "straightened her back and" 或 "and lifted her chin"。关键是表达 regained composure 的身体动作。'};
      }
    },
    {
      num: "Q4 — Pronoun Reference", marks: 1,
      text: 'What does <strong>"they"</strong> (Line 25) refer to?',
      ref: "你的错题 M011：把 they 指向了 compliments 而不是人",
      hint: "they 只能指代人！回到前文看谁在一起做事。",
      placeholder: "'they' refers to...",
      check(n) {
        if (/(maya.*ah ma|ah ma.*maya|grandmother.*maya|maya.*grandmother|girl.*grandmother|grandmother.*girl)/.test(n)) return {r:'correct',fb:'<strong>✓ Correct!</strong> "they" = Maya and Ah Ma. 她们在厨房里一起做蛋糕。记住：they 只能指代人！'};
        if (/maya|ah ma|grandmother/.test(n)) return {r:'partial',fb:'<strong>△ 要写完整</strong>——"they" 指代两个人：Maya and Ah Ma。不能只写一个人。'};
        return {r:'wrong',fb:'<strong>✗</strong> "they" = Maya and Ah Ma (Maya 和阿嫲)。前文说 Maya followed，然后 "they worked side by side"。they 只能指人！'};
      }
    },
    {
      num: "Q5 — Inferential", marks: 2,
      text: 'What does Ah Ma mean when she says <strong>"We have a pandan cake to bake"</strong> (Line 23)? What does this reveal about her character?',
      ref: "你的错题 M023(Q10)：只写了情感没解释话语含义",
      hint: "2 分：(1) 这句话表面上在说什么？(2) 更深层的意思是什么？联系 Ah Gong 说的话——"keep living the way they taught you to"。",
      placeholder: "P: Ah Ma means that...\nE: Earlier, she recalled Ah Gong's words...\nX: This reveals that she is...",
      check(n) {
        const hasMeaning = /bake|cook|keep going|carry on|move on|routine|normal|action|do something|live|not.*sit|positive/.test(n);
        const hasCharacter = /strong|resilient|determin|practical|brave|optimist|love|honour|remember|courag|positive|character|not give up|refuse.*give up/.test(n);
        const long = n.split(' ').length >= 10;
        if (hasMeaning && hasCharacter && long) return {r:'correct',fb:'<strong>✓ Perfect!</strong> 两层都答到了。<br><strong>Model:</strong> On the surface, Ah Ma is suggesting they bake a pandan cake — continuing her Saturday routine with Maya (meaning). On a deeper level, she is choosing to honour Ah Gong\'s memory through action rather than sitting in sadness. Earlier she recalled his words: "the best way to remember someone is to keep living the way they taught you to" (E). This reveals she is a resilient and strong-willed person who faces grief with determination and love rather than self-pity (character).'};
        if (hasMeaning || hasCharacter) return {r:'partial',fb:'<strong>△ 答到一层了。</strong>2 分需要两层：(1) 话语含义：她选择用行动（烘焙蛋糕）代替悲伤 (2) 性格特征：resilient（坚韧）, strong-willed（意志坚强）, 用行动纪念而非沉浸悲伤。'};
        return {r:'wrong',fb:'<strong>✗ 两层：</strong>(1) 表面意思是去烘焙蛋糕，更深层是她选择用行动（继续生活）来纪念 Ah Gong，而不是坐着伤心。(2) 这反映她是一个坚强、务实、不轻易被击垮的人。'};
      }
    }
  ]
},
{
  title: "Day 2: True/False 反驳技巧",
  focus: "学会直接反驳题目关键词，用原文证据支撑 True/False 判断",
  skills: ["True/False","关键词反驳","curtly 等词汇"],
  framework: {
    title: "True/False 答题三步法",
    steps: [
      {cls:"fw-p",icon:"1",html:"<strong>判断 True 或 False</strong> — 对比题目说法和原文事实"},
      {cls:"fw-e",icon:"2",html:"<strong>直接反驳关键词</strong> — 题目说 \"patient\"？找原文证据说她 NOT patient<br><em>不要描述别的事情，要针对题目的措辞来反驳</em>"},
      {cls:"fw-x",icon:"3",html:"<strong>引用证据 + 解释</strong> — 引号引原文 + 用自己的话解释为什么这证明 True/False"}
    ]
  },

// ======================== RENDER ========================
const MAX_RETRIES = 3;
const state = { day: 0, unlocked: [true], levels: [] };
for (let i = 1; i < DAYS.length; i++) state.unlocked.push(false);
DAYS.forEach(d => state.levels.push({done:0, correct:0, answered:{}, attempts:{}, scores:{}}));

function render() {
  // Week bar
  const wb = document.getElementById('weekBar');
  wb.innerHTML = DAYS.map((_,i) => `<div class="week-seg${state.levels[i].done===DAYS[i].questions.length?' done':i===state.day?' current':''}"></div>`).join('');
  // Tabs
  const tabs = document.getElementById('dayTabs');
  tabs.innerHTML = DAYS.map((d,i) => {
    const cls = i===state.day ? 'active' : !state.unlocked[i] ? 'locked' : state.levels[i].done===DAYS[i].questions.length ? 'done' : '';
    return `<div class="day-tab ${cls}" onclick="goDay(${i})">${i+1}</div>`;
  }).join('');
  // Content
  const container = document.getElementById('dayContainer');
  container.innerHTML = '';
  DAYS.forEach((d,di) => {
    const div = document.createElement('div');
    div.className = 'day' + (di===state.day ? ' active' : '');
    div.id = 'day'+di;
    let html = `<div class="day-header"><h2>${d.title}</h2><div class="day-focus">${d.focus}</div><div class="day-skills">${d.skills.map(s=>`<span class="skill-tag">${s}</span>`).join('')}</div></div>`;
    if (d.framework) {
      html += `<div class="framework"><h3>${d.framework.title}</h3>${d.framework.steps.map(s=>`<div class="fw-step ${s.cls}"><div class="fw-icon">${s.icon}</div><div>${s.html}</div></div>`).join('')}</div>`;
    }
    html += `<div class="pbar"><div class="pfill" id="prog${di}" style="width:${Math.round(state.levels[di].done/d.questions.length*100)}%"></div></div>`;
    html += `<div class="passage"><div class="passage-title">Read the passage carefully:</div>${d.passage}</div>`;
    d.questions.forEach((q,qi) => {
      const qid = `${di}_${qi}`;
      const st = state.levels[di].answered[qi] ? (state.levels[di].scores[qi]>=1?'st-correct':state.levels[di].scores[qi]>0?'st-partial':'st-wrong') : '';
      html += `<div class="qcard ${st}" id="qc${qid}">`;
      html += `<div class="qhead"><span class="qnum">${q.num}</span><span class="qmarks">${q.marks} mark${q.marks>1?'s':''}</span></div>`;
      html += `<div class="qtext">${q.text}</div>`;
      if (q.ref) html += `<div class="error-ref">📌 ${q.ref}</div>`;
      html += `<textarea id="a${qid}" placeholder="${q.placeholder||''}" ${state.levels[di].answered[qi]?'disabled':''}></textarea>`;
      html += `<div class="btnrow">`;
      html += `<button class="btn btn-go" id="go${qid}" onclick="doCheck(${di},${qi})" ${state.levels[di].answered[qi]?'disabled':''}>Check</button>`;
      if (q.hint) html += `<button class="btn btn-hint" onclick="toggleH('h${qid}')">Hint</button>`;
      html += `<button class="btn btn-retry" id="re${qid}" onclick="doRetry(${di},${qi})">Try Again</button>`;
      if (q.phraseLen) html += `<span class="wcount">Words: <span class="wc" id="wc${qid}">0</span> / ${q.phraseLen}</span>`;
      html += `<span class="att" id="at${qid}"></span>`;
      html += `</div>`;
      if (q.hint) html += `<div class="hint" id="h${qid}">${q.hint}</div>`;
      html += `<div class="fb" id="f${qid}"></div>`;
      html += `</div>`;
    });
    // Summary
    html += `<div class="summary" id="sum${di}"><h3>Day ${di+1} Complete!</h3><div class="bscore" id="sc${di}">0/${d.questions.length}</div><div class="detail" id="det${di}"></div>`;
    if (di < DAYS.length-1) html += `<button class="nbtn" id="nb${di}" disabled onclick="unlockDay(${di+1})">进入 Day ${di+2} →</button>`;
    else html += `<div id="finalMsg" style="margin-top:12px;text-align:left;font-size:15px"></div>`;
    html += `<button class="rbtn" onclick="resetDay(${di})">重做 Day ${di+1}</button></div>`;
    div.innerHTML = html;
    container.appendChild(div);
  });
  // Bind word counters
  DAYS.forEach((d,di) => d.questions.forEach((q,qi) => {
    if (q.phraseLen) {
      const ta = document.getElementById(`a${di}_${qi}`);
      if (ta) ta.oninput = () => {
        const wc = ta.value.trim().split(/\s+/).filter(w=>w).length;
        const el = document.getElementById(`wc${di}_${qi}`);
        el.textContent = wc;
        el.style.color = wc===q.phraseLen?'var(--green)':wc>q.phraseLen?'var(--red)':'var(--accent)';
      };
    }
  }));
}

function goDay(n) {
  if (!state.unlocked[n]) return;
  state.day = n;
  document.querySelectorAll('.day').forEach((el,i) => el.classList.toggle('active', i===n));
  document.querySelectorAll('.day-tab').forEach((el,i) => {
    el.classList.toggle('active', i===n);
    el.classList.toggle('locked', !state.unlocked[i]);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}

function unlockDay(n) {
  state.unlocked[n] = true;
  goDay(n);
  render();
}

function toggleH(id) { document.getElementById(id).classList.toggle('show'); }

function doCheck(di, qi) {
  if (state.levels[di].answered[qi]) return;
  const ta = document.getElementById(`a${di}_${qi}`);
  const ans = ta.value.trim();
  if (!ans) return;
  const n = ans.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  const q = DAYS[di].questions[qi];
  const res = q.check(n);
  const fid = `f${di}_${qi}`;
  // Show feedback
  const fb = document.getElementById(fid);
  fb.className = 'fb ' + res.r;
  fb.innerHTML = res.fb;
  fb.scrollIntoView({behavior:'smooth',block:'nearest'});
  // Track attempts
  if (!state.levels[di].attempts[qi]) state.levels[di].attempts[qi] = 0;
  state.levels[di].attempts[qi]++;
  const att = state.levels[di].attempts[qi];
  if (res.r === 'correct') {
    state.levels[di].answered[qi] = true;
    state.levels[di].scores[qi] = 1;
    state.levels[di].correct += 1;
    ta.disabled = true;
    document.getElementById(`go${di}_${qi}`).disabled = true;
    document.getElementById(`qc${di}_${qi}`).className = 'qcard st-correct';
  } else if (att >= MAX_RETRIES) {
    state.levels[di].answered[qi] = true;
    state.levels[di].scores[qi] = res.r==='partial' ? 0.5 : 0;
    state.levels[di].correct += state.levels[di].scores[qi];
    ta.disabled = true;
    document.getElementById(`go${di}_${qi}`).disabled = true;
    document.getElementById(`qc${di}_${qi}`).className = 'qcard '+(res.r==='partial'?'st-partial':'st-wrong');
  } else {
    document.getElementById(`re${di}_${qi}`).style.display = 'inline-block';
    document.getElementById(`at${di}_${qi}`).textContent = `(Attempt ${att}/${MAX_RETRIES})`;
    document.getElementById(`qc${di}_${qi}`).className = 'qcard '+(res.r==='partial'?'st-partial':'st-wrong');
    return; // Don't count as done yet
  }
  state.levels[di].done = Object.keys(state.levels[di].answered).filter(k=>state.levels[di].answered[k]).length;
  updateProg(di);
}

function doRetry(di, qi) {
  const ta = document.getElementById(`a${di}_${qi}`);
  ta.disabled = false; ta.value = ''; ta.focus();
  document.getElementById(`go${di}_${qi}`).disabled = false;
  document.getElementById(`re${di}_${qi}`).style.display = 'none';
  document.getElementById(`f${di}_${qi}`).className = 'fb';
  document.getElementById(`qc${di}_${qi}`).className = 'qcard';
}

function updateProg(di) {
  const s = state.levels[di];
  const total = DAYS[di].questions.length;
  document.getElementById(`prog${di}`).style.width = Math.round(s.done/total*100)+'%';
  // Update week bar
  document.querySelectorAll('.week-seg')[di].className = 'week-seg'+(s.done===total?' done':di===state.day?' current':'');
  if (s.done === total) {
    const sum = document.getElementById(`sum${di}`);
    sum.style.display = 'block';
    const score = Math.round(s.correct*10)/10;
    document.getElementById(`sc${di}`).textContent = score+'/'+total;
    const det = document.getElementById(`det${di}`);
    if (score >= total*0.8) det.textContent = '太棒了！这一天的技巧已经掌握。';
    else if (score >= total*0.5) det.textContent = '还不错，建议重做答错的题巩固一下。';
    else det.textContent = '需要多练习。点击下方重做这一天的练习。';
    const nb = document.getElementById(`nb${di}`);
    if (nb) nb.disabled = score < total*0.4;
    // Day tab done state
    document.querySelectorAll('.day-tab')[di].classList.add('done');
    // Final day summary
    if (di === DAYS.length-1) {
      const allCorrect = state.levels.reduce((a,l)=>a+l.correct,0);
      const allTotal = DAYS.reduce((a,d)=>a+d.questions.length,0);
      const pct = Math.round(allCorrect/allTotal*100);
      let msg = '';
      if (pct >= 80) msg = '<strong>恭喜完成 7 天训练！</strong>你已经掌握了 OE 阅读理解的核心答题技巧。继续在考试中坚持用 PEE 框架，Phrase ID 一定数词数，pronoun reference 先判断指人还是物。';
      else if (pct >= 60) msg = '<strong>7 天训练完成！</strong>大部分技巧已经掌握。建议回去重做 Day 1-2 的弱项题目巩固 PEE 和 True/False 技巧。';
      else msg = '<strong>7 天训练完成。</strong>建议从 Day 1 重新开始，先确保 PEE 框架完全掌握再往后走。每天练一篇，不要急。';
      document.getElementById('finalMsg').innerHTML = `<p>${msg}</p><p style="margin-top:8px;color:var(--text2)">总分：${Math.round(allCorrect*10)/10} / ${allTotal} (${pct}%)</p>`;
    }
    sum.scrollIntoView({behavior:'smooth',block:'center'});
  }
}

function resetDay(di) {
  state.levels[di] = {done:0, correct:0, answered:{}, attempts:{}, scores:{}};
  render();
  goDay(di);
}

render();
</script>
</body>
