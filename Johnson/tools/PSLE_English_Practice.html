<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSLE English Practice Platform</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#f7fafc;color:#2d3748;min-height:100vh;display:flex;flex-direction:column}
.header{background:linear-gradient(135deg,#1a365d 0%,#2b6cb0 50%,#3182ce 100%);color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:1000;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.header h1{font-size:1.5rem;font-weight:700;letter-spacing:.5px}
.header .subtitle{font-size:.85rem;opacity:.85;margin-top:2px}
.hamburger{display:none;background:none;border:none;color:#fff;font-size:1.6rem;cursor:pointer;padding:4px 8px}
.app-layout{display:flex;flex:1;overflow:hidden}
.sidebar{width:260px;background:#1a365d;color:#fff;overflow-y:auto;flex-shrink:0;transition:transform .3s}
.sidebar .nav-section{padding:8px 0}
.sidebar .nav-label{font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:#90cdf4;padding:12px 16px 4px;font-weight:600}
.sidebar .nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;font-size:.85rem;transition:background .2s;border-left:3px solid transparent}
.sidebar .nav-item:hover{background:rgba(255,255,255,.1)}
.sidebar .nav-item.active{background:rgba(255,255,255,.15);border-left-color:#10B981}
.sidebar .nav-item .icon{font-size:1.1rem;width:22px;text-align:center}
.sidebar .nav-sub{padding-left:48px;font-size:.78rem;padding-top:6px;padding-bottom:6px;cursor:pointer;transition:background .2s;color:#bee3f8}
.sidebar .nav-sub:hover{background:rgba(255,255,255,.08);color:#fff}
.sidebar .nav-sub.active{color:#10B981;font-weight:600}
.main-content{flex:1;overflow-y:auto;padding:24px;max-height:calc(100vh - 60px)}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.1);padding:20px;margin-bottom:16px}
.card h2{font-size:1.15rem;color:#1a365d;margin-bottom:12px}
.card h3{font-size:1rem;color:#2d3748;margin-bottom:8px}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.dash-card{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:20px;cursor:pointer;transition:transform .15s,box-shadow .15s;border-left:4px solid #3182ce}
.dash-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.dash-card h3{color:#1a365d;font-size:.95rem;margin-bottom:6px}
.dash-card .stats{font-size:.8rem;color:#718096;margin-bottom:8px}
.progress-bar{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden}
.progress-bar .fill{height:100%;background:linear-gradient(90deg,#10B981,#38a169);border-radius:4px;transition:width .4s}
.q-container{margin-bottom:20px}
.q-text{font-size:.95rem;line-height:1.6;margin-bottom:10px}
.q-options{display:flex;flex-direction:column;gap:6px}
.q-option{padding:10px 14px;border:2px solid #e2e8f0;border-radius:8px;cursor:pointer;font-size:.88rem;transition:all .2s}
.q-option:hover:not(.disabled){border-color:#3182ce;background:#ebf8ff}
.q-option.selected{border-color:#3182ce;background:#ebf8ff}
.q-option.correct{border-color:#10B981;background:#f0fff4}
.q-option.wrong{border-color:#e53e3e;background:#fff5f5}
.q-option.disabled{cursor:default;opacity:.7}
.q-option.disabled.correct{opacity:1}
.q-explanation{margin-top:8px;padding:10px 14px;border-radius:8px;font-size:.85rem;line-height:1.5}
.q-explanation.right{background:#f0fff4;color:#22543d;border:1px solid #c6f6d5}
.q-explanation.wrong{background:#fff5f5;color:#742a2a;border:1px solid #fed7d7}
.cloze-passage{font-size:.95rem;line-height:2.2;margin-bottom:16px}
.cloze-blank{display:inline-block;min-width:100px;border-bottom:2px solid #3182ce;text-align:center;padding:2px 8px;cursor:pointer;border-radius:4px 4px 0 0;transition:.2s;font-weight:600;color:#2b6cb0;background:#ebf4ff;position:relative}
.cloze-blank:hover{background:#bee3f8}
.cloze-blank.filled{background:#e2e8f0;color:#2d3748}
.cloze-blank.correct{border-bottom-color:#10B981;color:#22543d;background:#f0fff4;cursor:default}
.cloze-blank.wrong{border-bottom-color:#e53e3e;color:#742a2a;background:#fff5f5;cursor:default}
.cloze-blank .blank-num{font-size:.7rem;color:#718096;margin-right:3px}
.word-bank{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0;padding:14px;background:#f7fafc;border:2px dashed #cbd5e0;border-radius:10px}
.word-bank-title{font-size:.8rem;color:#718096;font-weight:600;width:100%;margin-bottom:4px}
.word-chip{padding:6px 14px;background:#fff;border:2px solid #e2e8f0;border-radius:18px;cursor:pointer;font-size:.88rem;font-weight:500;transition:.2s;user-select:none}
.word-chip:hover{border-color:#3182ce;background:#ebf8ff;transform:translateY(-1px)}
.word-chip.selected{border-color:#3182ce;background:#bee3f8;color:#2b6cb0}
.word-chip.used{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.word-chip.correct-chip{border-color:#10B981;background:#f0fff4;color:#22543d}
.word-chip.wrong-chip{border-color:#e53e3e;background:#fff5f5;color:#742a2a}
.cloze-answer-show{font-size:.78rem;color:#e53e3e;font-weight:600}
.cloze-explain{margin-top:6px;padding:8px 12px;background:#fff5f5;border-left:3px solid #e53e3e;border-radius:4px;font-size:.82rem;color:#742a2a;line-height:1.5}
.cloze-explain.right{background:#f0fff4;border-left-color:#10B981;color:#22543d}
.visual-text-box{border:3px solid #2d3748;border-radius:8px;padding:20px;margin-bottom:16px;background:#fffff0;max-width:600px}
.visual-text-box h4{text-align:center;font-size:1.1rem;border-bottom:2px solid #2d3748;padding-bottom:8px;margin-bottom:12px;text-transform:uppercase}
.visual-text-box .vt-line{font-size:.88rem;margin-bottom:4px;line-height:1.5}
.visual-text-box .vt-bold{font-weight:700}
.visual-text-box .vt-center{text-align:center}
.visual-text-box .vt-highlight{background:#fefcbf;padding:2px 6px;border-radius:3px}
.edit-passage{font-size:.95rem;line-height:2}
.edit-underline{text-decoration:underline;text-decoration-color:#e53e3e;cursor:pointer;padding:1px 2px;border-radius:3px;transition:background .2s}
.edit-underline:hover{background:#fff5f5}
.edit-underline.correct-mark{background:#f0fff4;text-decoration-color:#10B981}
.edit-underline.wrong-mark{background:#fff5f5;text-decoration-color:#e53e3e}
.st-input{width:100%;border:2px solid #e2e8f0;border-radius:8px;padding:10px 14px;font-size:.9rem;resize:vertical;min-height:60px;transition:border-color .2s;font-family:inherit}
.st-input:focus{border-color:#3182ce;outline:none}
.btn{padding:10px 20px;border:none;border-radius:8px;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:#3182ce;color:#fff}
.btn-primary:hover{background:#2b6cb0}
.btn-success{background:#10B981;color:#fff}
.btn-success:hover{background:#0d9668}
.btn-outline{background:transparent;border:2px solid #3182ce;color:#3182ce}
.btn-outline:hover{background:#ebf8ff}
.btn-sm{padding:6px 14px;font-size:.8rem}
.nav-buttons{display:flex;gap:10px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.timer-display{font-size:1.1rem;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.score-box{text-align:center;padding:30px;background:linear-gradient(135deg,#ebf8ff,#f0fff4);border-radius:12px;margin:16px 0}
.score-box .score-big{font-size:3rem;font-weight:800;color:#1a365d}
.score-box .score-label{color:#718096;font-size:.9rem;margin-top:4px}
.part-tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.part-tab{padding:8px 16px;border-radius:8px 8px 0 0;cursor:pointer;font-size:.82rem;font-weight:600;background:#e2e8f0;color:#4a5568;transition:all .2s}
.part-tab.active{background:#3182ce;color:#fff}
.part-tab .check{color:#10B981;margin-left:4px}
.edit-options{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.edit-opt{padding:6px 12px;border:1px solid #e2e8f0;border-radius:6px;cursor:pointer;font-size:.82rem;transition:all .15s;display:inline-block}
.edit-opt:hover{border-color:#3182ce;background:#ebf8ff}
.edit-opt.correct{border-color:#10B981;background:#f0fff4}
.edit-opt.wrong{border-color:#e53e3e;background:#fff5f5}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.7rem;font-weight:600}
.badge-green{background:#f0fff4;color:#22543d}
.passage-label{display:inline-block;background:#1a365d;color:#fff;padding:2px 10px;border-radius:12px;font-size:.75rem;font-weight:600;margin-bottom:8px}
@media(max-width:768px){
.hamburger{display:block}
.sidebar{position:fixed;top:56px;left:0;bottom:0;z-index:999;transform:translateX(-100%)}
.sidebar.open{transform:translateX(0)}
.sidebar-overlay{display:none;position:fixed;inset:0;top:56px;background:rgba(0,0,0,.4);z-index:998}
.sidebar-overlay.open{display:block}
.main-content{padding:16px}
.dash-grid{grid-template-columns:1fr}
.header h1{font-size:1.1rem}
}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:2px}
.main-content::-webkit-scrollbar{width:6px}
.main-content::-webkit-scrollbar-thumb{background:#cbd5e0;border-radius:3px}
</style>
</head>
<body>
<header class="header">
<div style="display:flex;align-items:center;gap:12px">
<button class="hamburger" onclick="toggleSidebar()">&#9776;</button>
<div>
<h1>PSLE English Practice Platform</h1>
<div class="subtitle">Student: Johnson | Target: PSLE 2027</div>
</div>
</div>
<div style="display:flex;align-items:center;gap:12px">
<span id="globalTimer" class="timer-display" style="display:none">00:00</span>
<button class="btn btn-sm" style="color:#fff;border:1px solid rgba(255,255,255,.4);background:transparent" onclick="toggleGlobalTimer()">&#9202; Timer</button>
<button class="btn btn-sm" style="color:#fff;border:1px solid rgba(255,255,255,.4);background:transparent" onclick="resetAllProgress()">Reset</button>
</div>
</header>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<div class="app-layout">
<nav class="sidebar" id="sidebar">
<div class="nav-section">
<div class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')"><span class="icon">&#128202;</span>Dashboard</div>
</div>
<div class="nav-section">
<div class="nav-label">Grammar MCQ (120 Q)</div>
<div class="nav-item" data-page="mcq" onclick="navigate('mcq')"><span class="icon">&#9998;</span>Grammar MCQ</div>
<div id="mcqSubs"></div>
</div>
<div class="nav-section">
<div class="nav-label">Grammar Cloze (120 Blanks)</div>
<div class="nav-item" data-page="cloze" onclick="navigate('cloze')"><span class="icon">&#128221;</span>Grammar Cloze</div>
<div id="clozeSubs"></div>
</div>
<div class="nav-section">
<div class="nav-label">Visual Text (60 Q)</div>
<div class="nav-item" data-page="visual" onclick="navigate('visual')"><span class="icon">&#128444;</span>Visual Text</div>
<div id="visualSubs"></div>
</div>
<div class="nav-section">
<div class="nav-label">Editing (120 Corrections)</div>
<div class="nav-item" data-page="editing" onclick="navigate('editing')"><span class="icon">&#9999;</span>Editing</div>
<div id="editingSubs"></div>
</div>
<div class="nav-section">
<div class="nav-label">S&amp;T (60 Q)</div>
<div class="nav-item" data-page="st" onclick="navigate('st')"><span class="icon">&#128260;</span>S &amp; T</div>
<div id="stSubs"></div>
</div>
<div class="nav-section">
<div class="nav-item" data-page="wrong" onclick="navigate('wrong')"><span class="icon">&#10060;</span>Wrong Answers</div>
</div>
</nav>
<main class="main-content" id="mainContent"></main>
</div>
<script>
// ===== DATA =====
var mcqData={
1:{title:"Part 1 - Tenses",questions:[
{q:"If she _____ the dentist earlier, she would not have lost her tooth.",o:["visits","visited","had visited","has visited"],a:2,e:"Third conditional requires past perfect in the if-clause. (2016 PSLE)"},
{q:"_____ James put the compass in his bag, we would not be lost in the forest.",o:["If","Had","Has","Did"],a:1,e:"Had-inversion replaces 'If James had put...' (2024 PSLE)"},
{q:"Rita _____ given up if her friends had not encouraged her.",o:["will have","would have","has","had"],a:1,e:"Third conditional main clause: would have + past participle. (2018 PSLE)"},
{q:"Emily _____ forward to the school carnival since the beginning of the year.",o:["looks","looked","is looking","has been looking"],a:3,e:"'Since' signals present perfect continuous tense. (2023 PSLE)"},
{q:"Jack and I _____ to the same school since Primary One.",o:["go","went","have gone","had gone"],a:2,e:"'Since Primary One' requires present perfect tense."},
{q:"By the time the fire brigade arrived, the fire _____ already been put out by the neighbours.",o:["has","had","is","was"],a:1,e:"Past perfect: action completed before another past action."},
{q:"She _____ her homework before she went out to play.",o:["finishes","finished","has finished","had finished"],a:3,e:"Past perfect for the earlier of two past actions."},
{q:"The teacher _____ the lesson when the bell rang.",o:["just finished","has just finished","had just finished","is just finishing"],a:2,e:"Past perfect with 'just' for an action completed right before another past event."},
{q:"We _____ in this neighbourhood for ten years now.",o:["live","lived","have lived","had lived"],a:2,e:"'For ten years now' signals present perfect."},
{q:"If I _____ you, I would apologise to her.",o:["am","was","were","had been"],a:2,e:"Second conditional uses 'were' for all subjects."},
{q:"The baby _____ soundly for two hours when the loud thunder woke him up.",o:["sleeps","slept","has been sleeping","had been sleeping"],a:3,e:"Past perfect continuous for duration before a past interruption."},
{q:"By next Friday, they _____ all the preparations for the concert.",o:["complete","completed","will have completed","have completed"],a:2,e:"Future perfect for an action that will be done by a future time."},
{q:"She had already _____ dinner when her father came home.",o:["eat","ate","eaten","eating"],a:2,e:"Past perfect: had + past participle (eaten)."},
{q:"The children _____ playing in the field when it started to rain.",o:["are","were","have been","had been"],a:1,e:"Past continuous for an ongoing action interrupted by another past event."},
{q:"Mr Tan _____ at this school since 2010.",o:["teaches","taught","has taught","is teaching"],a:2,e:"'Since 2010' requires present perfect."},
{q:"_____ she studied harder, she would have passed the test.",o:["If","Had","Has","Should"],a:1,e:"Had-inversion in third conditional."},
{q:"Mother _____ dinner every evening before Father reaches home.",o:["prepares","prepared","has prepared","is preparing"],a:0,e:"Simple present for habitual actions with 'every evening'."},
{q:"Tom _____ his best friend since kindergarten.",o:["knows","knew","has known","had known"],a:2,e:"'Since kindergarten' requires present perfect."},
{q:"They _____ the project by the time the teacher checks on them tomorrow.",o:["finish","finished","will have finished","have finished"],a:2,e:"Future perfect for completion before a future time."},
{q:"If the rain _____ not stopped, the match would have been cancelled.",o:["has","had","did","was"],a:1,e:"Third conditional: 'If...had not stopped'."}
]},
2:{title:"Part 2 - Verb Forms & Connectors",questions:[
{q:"Uncle Azman recounted how his mother would watch him _____ the bus for school every morning.",o:["board","boards","boarded","boarding"],a:0,e:"Sensory verb 'watch' + object + base form. (2016 PSLE)"},
{q:"Judy witnessed a boy _____ the game cards into his bag.",o:["slip","slips","slipped","slipping"],a:0,e:"Sensory verb 'witnessed' + object + base form. (2022 PSLE)"},
{q:"Krishnan helped the old lady _____ her keys from the drain.",o:["to retrieve","retrieve","retrieving","retrieved"],a:1,e:"'Help' + object + base form. (2017 PSLE)"},
{q:"The children enjoy _____ songs together during recess.",o:["sing","sings","singing","to sing"],a:2,e:"'Enjoy' is followed by the gerund (-ing form)."},
{q:"Mother made her children _____ up their rooms before going out.",o:["clean","cleans","cleaned","cleaning"],a:0,e:"'Make' + object + base form."},
{q:"The teacher let the students _____ early for the holiday.",o:["leave","leaves","left","leaving"],a:0,e:"'Let' + object + base form."},
{q:"_____ the heavy rain, the football match continued as planned.",o:["Although","Despite","Unless","Because"],a:1,e:"'Despite' is followed by a noun phrase."},
{q:"We heard someone _____ for help in the distance.",o:["call","calls","called","calling"],a:0,e:"Sensory verb 'heard' + object + base form."},
{q:"The old man sat by the river and watched the boats _____ by.",o:["sail","sails","sailed","sailing"],a:0,e:"'Watched' + object + base form for a complete action."},
{q:"_____ she was tired, she continued to practise the piano.",o:["Although","Despite","However","Because"],a:0,e:"'Although' + subject + verb (full clause)."},
{q:"The flowers need _____ every day during the dry season.",o:["water","waters","watering","watered"],a:2,e:"'Need' + gerund in passive sense."},
{q:"My parents do not allow me _____ out on weekdays.",o:["go","goes","going","to go"],a:3,e:"'Allow' + object + to-infinitive."},
{q:"_____ studying hard, he failed the examination.",o:["Although","Despite","Unless","Since"],a:1,e:"'Despite' + gerund phrase."},
{q:"The boy was seen _____ across the road carelessly.",o:["run","runs","running","to run"],a:2,e:"Passive sensory: 'was seen running' (ongoing action)."},
{q:"Please have the mechanic _____ my car by tomorrow.",o:["repair","repairs","repaired","repairing"],a:0,e:"Causative 'have' + person + base form."},
{q:"She practised hard _____ she could win the singing competition.",o:["so that","despite","although","unless"],a:0,e:"'So that' expresses purpose."},
{q:"_____ you return the library books by Friday, you will be fined.",o:["Although","Despite","Unless","Since"],a:2,e:"'Unless' = 'if not'."},
{q:"The teacher noticed a pupil _____ during the lesson.",o:["sleep","sleeps","slept","sleeping"],a:3,e:"'Noticed' + object + present participle for ongoing observation."},
{q:"He refused _____ the truth about what happened.",o:["tell","tells","telling","to tell"],a:3,e:"'Refuse' + to-infinitive."},
{q:"They decided _____ the hiking trip _____ the bad weather forecast.",o:["to cancel ... because of","cancelling ... although","cancel ... despite","to cancel ... unless"],a:0,e:"'Decided' + to-infinitive; 'because of' + noun phrase."}
]},
3:{title:"Part 3 - Prepositions",questions:[
{q:"The scientist is well-known _____ his expertise in designing robots.",o:["for","of","by","about"],a:0,e:"Fixed collocation: 'well-known for'. (2016 PSLE)"},
{q:"Rashid accused me _____ copying his homework.",o:["for","about","of","with"],a:2,e:"Fixed collocation: 'accuse someone of'. (2018 PSLE)"},
{q:"The host congratulated the young singer _____ his excellent performance.",o:["for","on","at","about"],a:1,e:"Fixed collocation: 'congratulate someone on'. (2023 PSLE)"},
{q:"The performance by the teachers took us _____ surprise!",o:["in","at","by","with"],a:2,e:"Fixed expression: 'take by surprise'. (2025 PSLE)"},
{q:"The children were afraid _____ the dark.",o:["at","of","with","about"],a:1,e:"Fixed collocation: 'afraid of'."},
{q:"She is very interested _____ learning how to play the guitar.",o:["on","at","in","for"],a:2,e:"Fixed collocation: 'interested in'."},
{q:"The robbers robbed him _____ all his money.",o:["from","of","with","for"],a:1,e:"Fixed collocation: 'rob someone of'."},
{q:"We arrived at the airport well ahead _____ time.",o:["in","at","of","by"],a:2,e:"Fixed expression: 'ahead of time'."},
{q:"He was _____ the impression that the meeting was cancelled.",o:["in","under","on","at"],a:1,e:"Fixed expression: 'under the impression'."},
{q:"_____ response to the feedback, the school made several changes.",o:["On","In","At","For"],a:1,e:"Fixed expression: 'in response to'."},
{q:"_____ spite of the heavy traffic, we arrived on time.",o:["In","On","At","With"],a:0,e:"Fixed expression: 'in spite of'."},
{q:"The pupil apologised _____ the teacher _____ his rude behaviour.",o:["to ... for","for ... to","with ... about","at ... for"],a:0,e:"'Apologise to someone for something'."},
{q:"She insisted _____ paying for the meal.",o:["in","on","at","for"],a:1,e:"Fixed collocation: 'insist on'."},
{q:"The outcome of the match depends _____ the last player.",o:["at","in","on","for"],a:2,e:"Fixed collocation: 'depend on'."},
{q:"We should not laugh _____ people who are less fortunate.",o:["on","at","about","for"],a:1,e:"Fixed collocation: 'laugh at'."},
{q:"The boy was charged _____ stealing from the shop.",o:["for","of","with","about"],a:2,e:"Fixed collocation: 'charged with'."},
{q:"She takes great pride _____ her work.",o:["on","in","of","at"],a:1,e:"Fixed collocation: 'take pride in'."},
{q:"The manager was satisfied _____ the team's performance.",o:["about","at","with","on"],a:2,e:"Fixed collocation: 'satisfied with'."},
{q:"They searched _____ the missing keys for hours.",o:["at","on","for","with"],a:2,e:"Fixed collocation: 'search for'."},
{q:"Please refrain _____ talking during the concert.",o:["of","from","for","about"],a:1,e:"Fixed collocation: 'refrain from'."}
]},
4:{title:"Part 4 - Subject-Verb Agreement & Quantifiers",questions:[
{q:"All the furniture _____ moved to another room just now.",o:["is","are","was","were"],a:2,e:"'Furniture' is uncountable = singular verb; past tense. (2016 PSLE)"},
{q:"The news about the famous singer _____ since yesterday.",o:["circulates","has been circulating","have been circulating","circulated"],a:1,e:"'News' is uncountable = singular verb; 'since' = present perfect continuous. (2024 PSLE)"},
{q:"Mrs Vishal, together with her children, _____ in the park every weekend.",o:["jog","jogs","are jogging","have jogged"],a:1,e:"'Together with' does not change the subject. Subject = Mrs Vishal (singular). (2018 PSLE)"},
{q:"The number of students _____ increased this year.",o:["has","have","is","are"],a:0,e:"'The number of' = singular subject."},
{q:"A number of books _____ missing from the library.",o:["is","was","are","has"],a:2,e:"'A number of' = plural."},
{q:"Neither the boys nor their teacher _____ aware of the change.",o:["is","are","was","were"],a:0,e:"'Neither...nor' - verb agrees with nearest subject ('teacher' = singular)."},
{q:"Each of the students _____ given a new textbook.",o:["is","are","was","were"],a:2,e:"'Each of' = singular; past context = 'was'."},
{q:"There _____ much food left after the party.",o:["is","are","was","were"],a:2,e:"'Food' is uncountable, past tense = 'was'."},
{q:"The luggage _____ still at the airport.",o:["is","are","has","have"],a:0,e:"'Luggage' is uncountable = singular verb."},

// ===== APP STATE =====
var STORAGE_PREFIX='psle_eng_';
var currentPage='dashboard';
var currentPart=1;
var globalTimerInterval=null;
var globalTimerSeconds=0;
var globalTimerRunning=false;

function loadState(key,def){try{var v=localStorage.getItem(STORAGE_PREFIX+key);return v?JSON.parse(v):def}catch(e){return def}}
function saveState(key,val){try{localStorage.setItem(STORAGE_PREFIX+key,JSON.stringify(val))}catch(e){}}
function getWrongAnswers(){return loadState('wrongAnswers',[])}
function addWrongAnswer(entry){var wa=getWrongAnswers();var exists=wa.find(function(w){return w.section===entry.section&&w.part===entry.part&&w.qIndex===entry.qIndex});if(!exists){wa.push(entry);saveState('wrongAnswers',wa)}}
function removeWrongAnswer(section,part,qIndex){var wa=getWrongAnswers();wa=wa.filter(function(w){return!(w.section===section&&w.part===part&&w.qIndex===qIndex)});saveState('wrongAnswers',wa)}
function getProgress(section,part){return loadState('progress_'+section+'_'+part,{answered:0,correct:0,total:0})}
function saveProgress(section,part,data){saveState('progress_'+section+'_'+part,data)}
function getAnswerState(section,part){return loadState('answers_'+section+'_'+part,{})}
function saveAnswerState(section,part,data){saveState('answers_'+section+'_'+part,data)}

function navigate(page,part){
currentPage=page;
if(part!==undefined)currentPart=part;else currentPart=1;
renderPage();
document.querySelectorAll('.nav-item').forEach(function(el){el.classList.remove('active')});
document.querySelectorAll('.nav-sub').forEach(function(el){el.classList.remove('active')});
var navEl=document.querySelector('.nav-item[data-page="'+page+'"]');
if(navEl)navEl.classList.add('active');
document.getElementById('sidebar').classList.remove('open');
document.getElementById('sidebarOverlay').classList.remove('open');
document.getElementById('mainContent').scrollTop=0;
}

function toggleSidebar(){
document.getElementById('sidebar').classList.toggle('open');
document.getElementById('sidebarOverlay').classList.toggle('open');
}

function buildSidebar(){
var sections=[{id:'mcq',el:'mcqSubs',parts:6},{id:'cloze',el:'clozeSubs',parts:6},{id:'visual',el:'visualSubs',parts:6},{id:'editing',el:'editingSubs',parts:6},{id:'st',el:'stSubs',parts:6}];
sections.forEach(function(s){
var container=document.getElementById(s.el);
var html='';
for(var i=1;i<=s.parts;i++){
html+='<div class="nav-sub" data-page="'+s.id+'" data-part="'+i+'" onclick="navigate(\''+s.id+'\','+i+')">Part '+i+'</div>';
}
container.innerHTML=html;
});
}

function toggleGlobalTimer(){
if(globalTimerRunning){clearInterval(globalTimerInterval);globalTimerRunning=false;document.getElementById('globalTimer').style.display='none'}
else{globalTimerSeconds=0;globalTimerRunning=true;document.getElementById('globalTimer').style.display='inline';
globalTimerInterval=setInterval(function(){globalTimerSeconds++;var m=Math.floor(globalTimerSeconds/60).toString().padStart(2,'0');var s=(globalTimerSeconds%60).toString().padStart(2,'0');document.getElementById('globalTimer').textContent=m+':'+s},1000)}
}

function renderPage(){
var mc=document.getElementById('mainContent');
switch(currentPage){
case'dashboard':renderDashboard(mc);break;
case'mcq':renderMCQ(mc);break;
case'cloze':renderCloze(mc);break;
case'visual':renderVisual(mc);break;
case'editing':renderEditing(mc);break;
case'st':renderST(mc);break;
case'wrong':renderWrong(mc);break;
default:renderDashboard(mc);
}
}

function renderDashboard(mc){
var sections=[
{id:'mcq',name:'Grammar MCQ',total:120,parts:6,icon:'&#9998;'},
{id:'cloze',name:'Grammar Cloze',total:120,parts:6,icon:'&#128221;'},
{id:'visual',name:'Visual Text',total:60,parts:6,icon:'&#128444;'},
{id:'editing',name:'Editing',total:120,parts:6,icon:'&#9999;'},
{id:'st',name:'S & T',total:60,parts:6,icon:'&#128260;'}
];
var totalAnswered=0,totalCorrect=0,totalQ=0;
var cardsHtml='';
sections.forEach(function(s){
var answered=0,correct=0;
for(var p=1;p<=s.parts;p++){var pr=getProgress(s.id,p);answered+=(pr.answered||0);correct+=(pr.correct||0)}
totalAnswered+=answered;totalCorrect+=correct;totalQ+=s.total;
var pct=s.total>0?Math.round(answered/s.total*100):0;
var accPct=answered>0?Math.round(correct/answered*100):0;
cardsHtml+='<div class="dash-card" onclick="navigate(\''+s.id+'\')"><h3>'+s.icon+' '+s.name+'</h3><div class="stats">'+answered+' / '+s.total+' completed | Accuracy: '+accPct+'%</div><div class="progress-bar"><div class="fill" style="width:'+pct+'%"></div></div></div>';
});
var wa=getWrongAnswers();
var overallPct=totalQ>0?Math.round(totalAnswered/totalQ*100):0;
var overallAcc=totalAnswered>0?Math.round(totalCorrect/totalAnswered*100):0;
mc.innerHTML='<div class="card" style="background:linear-gradient(135deg,#ebf8ff,#f0fff4);margin-bottom:20px"><h2>Welcome back, Johnson!</h2><div style="display:flex;gap:30px;flex-wrap:wrap;margin-top:12px"><div><div style="font-size:2rem;font-weight:800;color:#1a365d">'+overallPct+'%</div><div style="font-size:.8rem;color:#718096">Overall Progress</div></div><div><div style="font-size:2rem;font-weight:800;color:#10B981">'+overallAcc+'%</div><div style="font-size:.8rem;color:#718096">Accuracy</div></div><div><div style="font-size:2rem;font-weight:800;color:#e53e3e">'+wa.length+'</div><div style="font-size:.8rem;color:#718096">Wrong Answers</div></div><div><div style="font-size:2rem;font-weight:800;color:#3182ce">'+totalAnswered+'</div><div style="font-size:.8rem;color:#718096">Questions Done</div></div></div></div><h2 style="margin-bottom:16px;color:#1a365d">Section Overview</h2><div class="dash-grid">'+cardsHtml+'</div><div class="dash-card" style="margin-top:16px;border-left-color:#e53e3e;cursor:pointer" onclick="navigate(\'wrong\')"><h3>&#10060; Wrong Answers</h3><div class="stats">'+wa.length+' questions to review</div></div>';
}

function escHtml(str){if(!str)return'';return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function renderPartTabs(section,numParts){
var html='<div class="part-tabs">';
for(var i=1;i<=numParts;i++){
var pr=getProgress(section,i);
var done=pr.answered>0&&pr.answered>=pr.total&&pr.total>0;
html+='<div class="part-tab'+(currentPart===i?' active':'')+'" onclick="navigate(\''+section+'\','+i+')">Part '+i+(done?' <span class="check">&#10004;</span>':'')+'</div>';
}
return html+'</div>';
}

function renderNavButtons(section,numParts){
var html='<div class="nav-buttons">';
if(currentPart>1)html+='<button class="btn btn-outline" onclick="navigate(\''+section+'\','+(currentPart-1)+')">&larr; Part '+(currentPart-1)+'</button>';
else html+='<span></span>';
if(currentPart<numParts)html+='<button class="btn btn-primary" onclick="navigate(\''+section+'\','+(currentPart+1)+')">Part '+(currentPart+1)+' &rarr;</button>';
else html+='<span></span>';
return html+'</div>';
}

// ===== MCQ =====
function renderMCQ(mc){
var data=mcqData[currentPart];if(!data){mc.innerHTML='<p>No data.</p>';return}
var state=getAnswerState('mcq',currentPart);
var html='<div class="card"><h2>Grammar MCQ - '+data.title+'</h2>'+renderPartTabs('mcq',6);
var allAnswered=true;
data.questions.forEach(function(q,i){
var answered=state[i]!==undefined;if(!answered)allAnswered=false;
var userAns=state[i];
html+='<div class="q-container"><div class="q-text"><strong>Q'+(i+1)+'.</strong> '+q.q+'</div><div class="q-options">';
q.o.forEach(function(opt,j){
var cls='q-option';
if(answered){cls+=' disabled';if(j===q.a)cls+=' correct';else if(j===userAns&&userAns!==q.a)cls+=' wrong'}
html+='<div class="'+cls+'" onclick="answerMCQ('+i+','+j+')">('+String.fromCharCode(65+j)+') '+opt+'</div>';
});
html+='</div>';
if(answered){var isCorrect=userAns===q.a;html+='<div class="q-explanation '+(isCorrect?'right':'wrong')+'">'+(isCorrect?'&#10004; Correct!':'&#10008; Wrong. Answer: ('+String.fromCharCode(65+q.a)+') '+q.o[q.a]+'.')+' '+q.e+'</div>'}
html+='</div>';
});
if(allAnswered){var pr=getProgress('mcq',currentPart);html+='<div class="score-box"><div class="score-big">'+pr.correct+'/'+pr.total+'</div><div class="score-label">Score for '+data.title+'</div></div>'}
html+=renderNavButtons('mcq',6)+'</div>';
mc.innerHTML=html;
}

function answerMCQ(qIdx,optIdx){
var state=getAnswerState('mcq',currentPart);if(state[qIdx]!==undefined)return;
state[qIdx]=optIdx;saveAnswerState('mcq',currentPart,state);
var q=mcqData[currentPart].questions[qIdx];var isCorrect=optIdx===q.a;
var pr=getProgress('mcq',currentPart);pr.answered=Object.keys(state).length;pr.correct=(pr.correct||0)+(isCorrect?1:0);pr.total=mcqData[currentPart].questions.length;saveProgress('mcq',currentPart,pr);
if(!isCorrect)addWrongAnswer({section:'mcq',part:currentPart,qIndex:qIdx,question:q.q,userAnswer:'('+String.fromCharCode(65+optIdx)+') '+q.o[optIdx],correctAnswer:'('+String.fromCharCode(65+q.a)+') '+q.o[q.a],explanation:q.e});
renderMCQ(document.getElementById('mainContent'));
}

// ===== CLOZE (Pitaya-style word bank) =====
var clozeActiveBlank=null; // {part, pi, blankIdx}

function renderCloze(mc){
var passages=clozeData[currentPart];if(!passages){mc.innerHTML='<p>No data.</p>';return}
var html='<div class="card"><h2>Grammar Cloze - Part '+currentPart+'</h2>'+renderPartTabs('cloze',6)+'<p style="font-size:.85rem;color:#718096;margin-bottom:16px">\u{1F4CC} Click a blank in the passage, then select a word from the word bank below. Click \u201cCheck Answers\u201d when done.</p>';
passages.forEach(function(p,pi){
var stateKey='cloze_'+currentPart+'_'+pi;
var submitted=loadState(stateKey+'_submitted',false);
var savedAnswers=loadState(stateKey,{});
html+='<div class="card" style="border-left:4px solid #3182ce"><span class="passage-label">Passage '+(pi+1)+'</span><h3>'+p.title+'</h3>';

// Build passage with clickable blanks
var passageHtml='<div class="cloze-passage" id="clozePassage_'+currentPart+'_'+pi+'">';
var parts=p.passage.split(/\{(\d+)\}/);
for(var k=0;k<parts.length;k++){
if(k%2===0){passageHtml+=parts[k]}
else{
var bi=parseInt(parts[k])-1;
var val=savedAnswers[bi]||'';
if(submitted){
var correct=p.blanks[bi].toLowerCase();
var isCorrect=val.trim().toLowerCase()===correct;
var cls='cloze-blank '+(isCorrect?'correct':'wrong');
passageHtml+='<span class="'+cls+'"><span class="blank-num">('+(bi+1)+')</span> '+(val||'___')+'</span>';
if(!isCorrect){
passageHtml+=' <span class="cloze-answer-show">\u2192 '+p.blanks[bi]+'</span>';
}
} else {
var isActive=clozeActiveBlank&&clozeActiveBlank.part===currentPart&&clozeActiveBlank.pi===pi&&clozeActiveBlank.blankIdx===bi;
var cls='cloze-blank'+(val?' filled':'')+(isActive?' selected':'');
passageHtml+='<span class="'+cls+'" onclick="selectClozeBlank('+currentPart+','+pi+','+bi+')" id="cb_'+currentPart+'_'+pi+'_'+bi+'"><span class="blank-num">('+(bi+1)+')</span> '+(val||'___')+'</span>';
}
}
}
passageHtml+='</div>';
html+=passageHtml;

// Word bank (only if not submitted) — each chip tracked by index
if(!submitted){
// Track which bank indices are used by which blank
var usedBankIndices=loadState(stateKey+'_usedIdx',{});
// Shuffle bank deterministically per part+passage using seed
var bankIndices=[];for(var bii=0;bii<p.bank.length;bii++)bankIndices.push(bii);
bankIndices.sort(function(a,b){
var wa=p.bank[a],wb2=p.bank[b];
var ha=a*7+currentPart*13+pi*17,hb=b*7+currentPart*13+pi*17;
for(var ci=0;ci<wa.length;ci++)ha=(ha*31+wa.charCodeAt(ci))%999983;
for(var ci=0;ci<wb2.length;ci++)hb=(hb*31+wb2.charCodeAt(ci))%999983;
return ha-hb;
});
html+='<div class="word-bank" id="wb_'+currentPart+'_'+pi+'"><span class="word-bank-title">\u{1F4E6} Word Bank \u2014 click a blank, then pick a word (each word can only be used once):</span>';
bankIndices.forEach(function(bankIdx){
var w=p.bank[bankIdx];
var isUsed=false;
for(var uk in usedBankIndices){if(usedBankIndices[uk]===bankIdx){isUsed=true;break;}}
var cls='word-chip'+(isUsed?' used':'');
html+='<span class="'+cls+'" onclick="pickClozeWordByIdx('+currentPart+','+pi+','+bankIdx+')">'+w+'</span>';
});
html+='</div>';
html+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn btn-primary" onclick="submitCloze('+currentPart+','+pi+')">Check Answers</button><button class="btn" style="background:#e2e8f0;color:#4a5568" onclick="clearClozePassage('+currentPart+','+pi+')">Clear All</button></div>';
} else {
// Show score + explanations
var sc=loadState(stateKey+'_score',{correct:0,total:0});
html+='<div style="margin-top:10px"><span class="badge badge-green" style="font-size:.9rem;padding:4px 12px">'+sc.correct+'/'+sc.total+' correct</span></div>';
// Explanations for each blank
if(p.explains){
html+='<div style="margin-top:14px"><strong style="font-size:.9rem">\u{1F4D6} Explanations:</strong>';
p.blanks.forEach(function(ans,ei){
var userAns=(savedAnswers[ei]||'').trim().toLowerCase();
var isRight=userAns===ans.toLowerCase();
var cls=isRight?'cloze-explain right':'cloze-explain';
html+='<div class="'+cls+'" style="margin-top:6px"><strong>('+(ei+1)+')</strong> ';
if(!isRight){html+='Your answer: <span style="text-decoration:line-through;color:#e53e3e">'+(savedAnswers[ei]||'empty')+'</span> \u2192 Correct: <strong>'+ans+'</strong><br>';}
else{html+='\u2705 <strong>'+ans+'</strong> — ';}
html+=(p.explains[ei]||'')+'</div>';
});
html+='</div>';
}
}
html+='</div>';
});
html+=renderNavButtons('cloze',6)+'</div>';mc.innerHTML=html;
}

function selectClozeBlank(part,pi,bi){
var sk='cloze_'+part+'_'+pi;
var saved=loadState(sk,{});
var usedIdx=loadState(sk+'_usedIdx',{});
// If clicking on a filled blank, clear it (release the word back to bank)
if(saved[bi]){
delete saved[bi];
delete usedIdx[bi];
saveState(sk,saved);
saveState(sk+'_usedIdx',usedIdx);
}
clozeActiveBlank={part:part,pi:pi,blankIdx:bi};
renderCloze(document.getElementById('mainContent'));
// Scroll word bank into view
var wb=document.getElementById('wb_'+part+'_'+pi);if(wb)wb.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function pickClozeWordByIdx(part,pi,bankIdx){
if(!clozeActiveBlank||clozeActiveBlank.part!==part||clozeActiveBlank.pi!==pi)return;
var bi=clozeActiveBlank.blankIdx;
var sk='cloze_'+part+'_'+pi;
var saved=loadState(sk,{});
var usedIdx=loadState(sk+'_usedIdx',{});
// Check if this bank chip is already used
for(var uk in usedIdx){if(usedIdx[uk]===bankIdx)return;}
// If this blank already had a word, free its old bank chip
if(typeof usedIdx[bi]!=='undefined'){delete usedIdx[bi];}
// Assign
var word=clozeData[part][pi].bank[bankIdx];
saved[bi]=word;
usedIdx[bi]=bankIdx;
saveState(sk,saved);
saveState(sk+'_usedIdx',usedIdx);
// Move to next empty blank
var passage=clozeData[part][pi];
var nextBlank=-1;
for(var n=bi+1;n<passage.blanks.length;n++){if(!saved[n]){nextBlank=n;break}}
if(nextBlank===-1){for(var n=0;n<bi;n++){if(!saved[n]){nextBlank=n;break}}}
if(nextBlank>=0)clozeActiveBlank={part:part,pi:pi,blankIdx:nextBlank};
else clozeActiveBlank=null;
renderCloze(document.getElementById('mainContent'));
}

function clearClozePassage(part,pi){
var sk='cloze_'+part+'_'+pi;saveState(sk,{});saveState(sk+'_usedIdx',{});clozeActiveBlank=null;
renderCloze(document.getElementById('mainContent'));
}

function submitCloze(part,pi){
var passage=clozeData[part][pi];var sk='cloze_'+part+'_'+pi;var saved=loadState(sk,{});
var correct=0;var total=passage.blanks.length;
passage.blanks.forEach(function(ans,i){
var userAns=(saved[i]||'').trim().toLowerCase();
if(userAns===ans.toLowerCase())correct++;
else addWrongAnswer({section:'cloze',part:part,qIndex:pi*10+i,question:passage.title+' - Blank '+(i+1),userAnswer:saved[i]||'(empty)',correctAnswer:ans,explanation:(passage.explains&&passage.explains[i])?passage.explains[i]:'The correct word is "'+ans+'".'});
});
saveState(sk+'_submitted',true);saveState(sk+'_score',{correct:correct,total:total});
var tc=0,ta=0;
clozeData[part].forEach(function(p2,pi2){var sk2='cloze_'+part+'_'+pi2;if(loadState(sk2+'_submitted',false)){var s2=loadState(sk2+'_score',{correct:0,total:0});tc+=s2.correct;ta+=s2.total}});
saveProgress('cloze',part,{answered:ta,correct:tc,total:20});
clozeActiveBlank=null;
renderCloze(document.getElementById('mainContent'));
}

// ===== VISUAL =====
function renderVisual(mc){
var data=visualData[currentPart];if(!data){mc.innerHTML='<p>No data.</p>';return}
var state=getAnswerState('visual',currentPart);
var html='<div class="card"><h2>Visual Text - '+data.title+'</h2>'+renderPartTabs('visual',6)+data.stimulus;
var allAnswered=true;
data.questions.forEach(function(q,i){
var answered=state[i]!==undefined;if(!answered)allAnswered=false;
var userAns=state[i];
html+='<div class="q-container"><div class="q-text"><strong>Q'+(i+1)+'.</strong> '+q.q+'</div><div class="q-options">';
q.o.forEach(function(opt,j){
var cls='q-option';if(answered){cls+=' disabled';if(j===q.a)cls+=' correct';else if(j===userAns&&userAns!==q.a)cls+=' wrong'}
html+='<div class="'+cls+'" onclick="answerVisual('+i+','+j+')">('+String.fromCharCode(65+j)+') '+opt+'</div>';
});
html+='</div>';
if(answered){var isCorrect=userAns===q.a;html+='<div class="q-explanation '+(isCorrect?'right':'wrong')+'">'+(isCorrect?'&#10004; Correct!':'&#10008; Wrong. Answer: ('+String.fromCharCode(65+q.a)+') '+q.o[q.a]+'.')+' '+q.e+'</div>'}
html+='</div>';
});
if(allAnswered){var pr=getProgress('visual',currentPart);html+='<div class="score-box"><div class="score-big">'+pr.correct+'/'+pr.total+'</div><div class="score-label">Score</div></div>'}
html+=renderNavButtons('visual',6)+'</div>';mc.innerHTML=html;
}

function answerVisual(qIdx,optIdx){
var state=getAnswerState('visual',currentPart);if(state[qIdx]!==undefined)return;
state[qIdx]=optIdx;saveAnswerState('visual',currentPart,state);
var q=visualData[currentPart].questions[qIdx];var isCorrect=optIdx===q.a;
var pr=getProgress('visual',currentPart);pr.answered=Object.keys(state).length;pr.correct=(pr.correct||0)+(isCorrect?1:0);pr.total=visualData[currentPart].questions.length;saveProgress('visual',currentPart,pr);
if(!isCorrect)addWrongAnswer({section:'visual',part:currentPart,qIndex:qIdx,question:q.q,userAnswer:'('+String.fromCharCode(65+optIdx)+') '+q.o[optIdx],correctAnswer:'('+String.fromCharCode(65+q.a)+') '+q.o[q.a],explanation:q.e});
renderVisual(document.getElementById('mainContent'));
}

// ===== EDITING =====
function renderEditing(mc){
var data=editingData[currentPart];if(!data){mc.innerHTML='<p>No data.</p>';return}
var state=getAnswerState('editing',currentPart);
var html='<div class="card"><h2>Editing - '+data.title+'</h2>'+renderPartTabs('editing',6)+'<p style="font-size:.85rem;color:#718096;margin-bottom:12px">For each numbered word, select the correct form from the options below.</p>';
var passageHtml='<div class="edit-passage" style="margin-bottom:20px">';
var textParts=data.text.split(/\{(\d+)\}/);
for(var k=0;k<textParts.length;k++){
if(k%2===0){passageHtml+=textParts[k]}
else{
var idx=parseInt(textParts[k])-1;var item=data.items[idx];
var answered=state[idx]!==undefined;
var cls='edit-underline';
if(answered){cls+=state[idx]===item.correct?' correct-mark':' wrong-mark'}
passageHtml+='<span class="'+cls+'"><strong>('+( idx+1)+')</strong> '+item.word+'</span>';
}
}
passageHtml+='</div>';html+=passageHtml;
data.items.forEach(function(item,i){
var answered=state[i]!==undefined;
html+='<div class="q-container" style="padding:8px 0;border-bottom:1px solid #e2e8f0"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><strong style="min-width:30px">('+( i+1)+')</strong>';
item.options.forEach(function(opt){
var cls='edit-opt';
if(answered){if(opt===item.correct)cls+=' correct';else if(opt===state[i]&&state[i]!==item.correct)cls+=' wrong'}
html+='<span class="'+cls+'" onclick="answerEditing('+i+',\''+opt.replace(/'/g,"\\'")+'\')">'+opt+'</span> ';
});
if(answered&&state[i]!==item.correct)html+='<span style="font-size:.8rem;color:#e53e3e;margin-left:8px">Correct: '+item.correct+'</span>';
html+='</div></div>';
});
var allAnswered=Object.keys(state).length===data.items.length;
if(allAnswered){var pr=getProgress('editing',currentPart);html+='<div class="score-box"><div class="score-big">'+pr.correct+'/'+pr.total+'</div><div class="score-label">Score</div></div>'}
html+=renderNavButtons('editing',6)+'</div>';mc.innerHTML=html;
}

function answerEditing(idx,opt){
var state=getAnswerState('editing',currentPart);if(state[idx]!==undefined)return;
state[idx]=opt;saveAnswerState('editing',currentPart,state);
var item=editingData[currentPart].items[idx];var isCorrect=opt===item.correct;
var pr=getProgress('editing',currentPart);pr.answered=Object.keys(state).length;pr.correct=(pr.correct||0)+(isCorrect?1:0);pr.total=editingData[currentPart].items.length;saveProgress('editing',currentPart,pr);
if(!isCorrect)addWrongAnswer({section:'editing',part:currentPart,qIndex:idx,question:editingData[currentPart].title+' - Item '+(idx+1)+': "'+item.word+'"',userAnswer:opt,correctAnswer:item.correct,explanation:'The correct form is "'+item.correct+'".'});
renderEditing(document.getElementById('mainContent'));
}

// ===== S&T =====
function renderST(mc){
var data=stData[currentPart];if(!data){mc.innerHTML='<p>No data.</p>';return}
var state=getAnswerState('st',currentPart);
var html='<div class="card"><h2>Synthesis &amp; Transformation - '+data.title+'</h2>'+renderPartTabs('st',6)+'<p style="font-size:.85rem;color:#718096;margin-bottom:16px">Type your answer. Click "Check" to verify.</p>';
data.questions.forEach(function(q,i){
var answered=state[i]!==undefined;
html+='<div class="q-container" style="padding-bottom:12px;border-bottom:1px solid #e2e8f0"><div class="q-text"><strong>Q'+(i+1)+'.</strong> '+escHtml(q.q)+'</div>';
html+='<div style="font-size:.85rem;color:#3182ce;margin-bottom:8px"><em>'+q.instruction+'</em></div>';
if(!answered){
html+='<textarea class="st-input" id="st_input_'+i+'" placeholder="Type your answer here...">'+escHtml(loadState('st_draft_'+currentPart+'_'+i,''))+'</textarea>';
html+='<div style="margin-top:6px"><button class="btn btn-primary btn-sm" onclick="answerST('+i+')">Check</button></div>';
}else{
var result=state[i];
html+='<div style="padding:8px 12px;border-radius:8px;margin-top:4px;font-size:.9rem;'+(result.correct?'background:#f0fff4;border:1px solid #c6f6d5':'background:#fff5f5;border:1px solid #fed7d7')+'"><strong>Your answer:</strong> '+escHtml(result.userAnswer)+'<br>'+(result.correct?'&#10004; Correct!':'&#10008; <strong>Suggested answer:</strong> '+q.answer[0])+'</div>';
html+='<div class="q-explanation '+(result.correct?'right':'wrong')+'">'+q.e+'</div>';
}
html+='</div>';
});
var allAnswered=Object.keys(state).length===data.questions.length;
if(allAnswered){var pr=getProgress('st',currentPart);html+='<div class="score-box"><div class="score-big">'+pr.correct+'/'+pr.total+'</div><div class="score-label">Score</div></div>'}
html+=renderNavButtons('st',6)+'</div>';mc.innerHTML=html;
}

function answerST(qIdx){
var input=document.getElementById('st_input_'+qIdx);if(!input)return;
var userAns=input.value.trim();if(!userAns){input.style.borderColor='#e53e3e';return}
var q=stData[currentPart].questions[qIdx];
var normalized=userAns.toLowerCase().replace(/[.,!?;:'"]/g,'').replace(/\s+/g,' ').trim();
var isCorrect=false;
for(var k=0;k<q.answer.length;k++){
var normAns=q.answer[k].toLowerCase().replace(/[.,!?;:'"]/g,'').replace(/\s+/g,' ').trim();
if(normalized===normAns){isCorrect=true;break}
}
var state=getAnswerState('st',currentPart);
state[qIdx]={userAnswer:userAns,correct:isCorrect};
saveAnswerState('st',currentPart,state);
var pr=getProgress('st',currentPart);pr.answered=Object.keys(state).length;pr.correct=(pr.correct||0)+(isCorrect?1:0);pr.total=stData[currentPart].questions.length;saveProgress('st',currentPart,pr);
if(!isCorrect)addWrongAnswer({section:'st',part:currentPart,qIndex:qIdx,question:q.q+' ('+q.instruction+')',userAnswer:userAns,correctAnswer:q.answer[0],explanation:q.e});
saveState('st_draft_'+currentPart+'_'+qIdx,'');
renderST(document.getElementById('mainContent'));
}

document.addEventListener('input',function(e){
if(e.target&&e.target.id&&e.target.id.indexOf('st_input_')===0){
var idx=parseInt(e.target.id.split('_')[2]);
saveState('st_draft_'+currentPart+'_'+idx,e.target.value);
}
});

// ===== WRONG ANSWERS =====
function renderWrong(mc){
var wa=getWrongAnswers();
var html='<div class="card"><h2>&#10060; Wrong Answers Review</h2>';
if(wa.length===0){html+='<p style="color:#718096;padding:20px 0">No wrong answers yet. Keep practising!</p>'}
else{
html+='<p style="font-size:.85rem;color:#718096;margin-bottom:16px">'+wa.length+' wrong answer(s) to review.</p>';
var groups={};
wa.forEach(function(w){var key=w.section.toUpperCase()+' Part '+w.part;if(!groups[key])groups[key]=[];groups[key].push(w)});
Object.keys(groups).forEach(function(key){
html+='<h3 style="margin:16px 0 8px;color:#1a365d">'+key+'</h3>';
groups[key].forEach(function(w){
html+='<div style="padding:10px;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:8px;background:#fff5f5"><div style="font-size:.9rem;margin-bottom:4px"><strong>'+escHtml(w.question)+'</strong></div><div style="font-size:.82rem;color:#e53e3e">Your answer: '+escHtml(w.userAnswer)+'</div><div style="font-size:.82rem;color:#22543d">Correct: '+escHtml(w.correctAnswer)+'</div><div style="font-size:.8rem;color:#718096;margin-top:4px">'+w.explanation+'</div><button class="btn btn-sm btn-outline" style="margin-top:6px" onclick="removeWrongAndRefresh(\''+w.section+'\','+w.part+','+w.qIndex+')">&#10004; Mark Reviewed</button></div>';
});
});
html+='<div style="margin-top:16px"><button class="btn btn-primary" onclick="clearAllWrong()">Clear All</button></div>';
}
html+='</div>';mc.innerHTML=html;
}

function removeWrongAndRefresh(section,part,qIndex){removeWrongAnswer(section,part,qIndex);renderWrong(document.getElementById('mainContent'))}
function clearAllWrong(){if(confirm('Clear all wrong answers?')){saveState('wrongAnswers',[]);renderWrong(document.getElementById('mainContent'))}}

function resetAllProgress(){
if(confirm('This will reset ALL progress. Are you sure?')){
var keys=[];for(var i=0;i<localStorage.length;i++){var key=localStorage.key(i);if(key&&key.indexOf(STORAGE_PREFIX)===0)keys.push(key)}
keys.forEach(function(k){localStorage.removeItem(k)});navigate('dashboard');
}
}

buildSidebar();
navigate('dashboard');
</script>
