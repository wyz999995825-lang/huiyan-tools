<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Model Composition Studio</title>
<style>
:root{--navy:#0b438f;--blue:#1e62c7;--sea:#eaf8ff;--mint:#dff8ee;--green:#087f5b;--ink:#17324d;--muted:#5d7895;--line:#b9e0f2;--paper:#fff;--warm:#fff5dd}*{box-sizing:border-box}body{margin:0;background:#eaf8ff;color:var(--ink);font-family:Arial,sans-serif;line-height:1.6}.app{max-width:1120px;margin:auto;padding:24px 20px 64px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:start;border-bottom:3px solid #63bddc;padding-bottom:18px}.kicker{margin:0;color:var(--green);font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase}.hero h1{margin:4px 0;font-size:29px;line-height:1.2;color:var(--navy)}.hero p{margin:0;color:var(--muted)}button{font:inherit}.sound,.secondary{border:2px solid var(--line);background:var(--paper);color:var(--navy);border-radius:7px;padding:9px 12px;font-weight:700;cursor:pointer}.tabs{display:flex;gap:9px;overflow:auto;padding:20px 0 14px}.tab{min-width:190px;border:2px solid var(--line);background:var(--paper);border-radius:7px;padding:10px 12px;text-align:left;color:var(--ink);cursor:pointer}.tab.active{background:var(--blue);border-color:var(--blue);color:white}.tab strong,.tab small{display:block}.tab small{opacity:.8}.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(270px,.85fr);gap:20px}.paper,.panel{background:var(--paper);border:2px solid var(--line);border-radius:8px}.paper{padding:26px}.paper h2{margin:0;color:var(--navy);font-size:27px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 16px}.chip{background:var(--mint);border:1px solid #a5e3cf;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700;color:#086448}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 14px}.primary{border:0;border-radius:7px;background:var(--green);color:white;padding:10px 13px;font-weight:800;cursor:pointer}.essay p{font-family:Georgia,serif;font-size:17px;line-height:1.92;margin:0 0 17px}.essay p:first-child::first-letter{font-size:2.7em;color:var(--blue);float:left;line-height:.8;padding-right:6px}.panel{padding:17px;margin-bottom:14px}.panel h3{margin:0 0 10px;color:var(--navy);font-size:17px}.step{display:flex;gap:10px;padding:10px 0;border-top:1px solid #dcedf5}.step:first-of-type{border-top:0}.n{width:24px;height:24px;flex:0 0 24px;display:grid;place-items:center;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;font-weight:800}.step strong{display:block;font-size:13px}.step span{font-size:13px;color:var(--muted);display:block}.move{padding:10px;background:var(--warm);border-left:4px solid #f1b93d;border-radius:4px;margin:9px 0}.move strong{display:block;color:#735100;font-size:13px}.move span{font-size:13px}.done{background:var(--mint);border:2px solid #79d9b7;color:#075d43;border-radius:7px;padding:10px;font-weight:700;margin-top:14px}@media(max-width:780px){.app{padding:16px 12px 42px}.hero{display:block}.sound{margin-top:12px}.layout{grid-template-columns:1fr}.paper{padding:18px}.hero h1{font-size:25px}.essay p{font-size:16px}}
</style>
</head>
<body><main class="app"><header class="hero"><div><p class="kicker">Johnson English · Growing Model Library</p><h1>Model Composition Studio</h1><p>Read a strong model. Notice its choices. Borrow the method, then make it yours.</p></div><button class="sound" id="sound" type="button">🔊 Read aloud</button></header><nav class="tabs" id="tabs" aria-label="Model compositions"></nav><section id="screen"></section></main>
<script>
const STORE='johnson_model_composition_studio_v1';const tabs=document.getElementById('tabs'),screen=document.getElementById('screen'),sound=document.getElementById('sound');let muted=false,activeId='model-compo-a-mistake-001';
// Future family-provided model compositions are appended here. Existing IDs and study records never change.
const COMPOSITIONS=[{id:'model-compo-a-mistake-001',title:'A Mistake',type:'P5/P6 Continuous Writing',theme:'Friendship · Responsibility · Time management',source:'Family model composition · added 2026-08-29',paragraphs:[
'Whenever I see a birthday invitation, I cannot help but remember a mistake I made two years ago. Although my friend forgave me, the guilt I felt that day has remained fresh in my mind. Even now, I can still remember the incident as clearly as if it had happened yesterday…',
'“Johnson, go and finish your homework before you do anything else,” Mum reminded me. I dragged myself back to my room, took out the homework my teacher had given me and started working. Just as I was concentrating, my phone suddenly buzzed. Curious, I reached into my bag and took it out. It was a message from my best friend, Tim. “Johnson, today is my birthday! I’m having a birthday party at four o’clock this afternoon. I really hope you can come!” My eyes lit up with excitement. Without hesitation, I dashed downstairs and told Mum about Tim’s invitation. She nodded and smiled. “Of course you can go, but you must finish your homework first.” I agreed and hurried back upstairs.',
'After what seemed like hours and hours, I finally completed my homework. I stretched my aching arms and let out a long sigh of relief. I was exhausted. Glancing at Tim’s message again, I realised that it was only two o’clock. There were still two hours before the party. “I have plenty of time. I’ll just take a short nap,” I thought. Suddenly, I remembered Tim’s birthday present. I ran downstairs, found a box of chocolates and carefully wrapped it for him. Then I returned to my bedroom and collapsed onto my comfortable bed. Within minutes, I was fast asleep. However, I made one terrible mistake — I forgot to set an alarm.',
'When I finally opened my eyes, I glanced sleepily at the clock. My eyes widened in horror. 3:50 p.m.! “Oh no! Tim’s birthday party!” I sprang out of bed, changed my clothes as quickly as lightning, grabbed the present and dashed out of the house. My heart was pounding against my chest as I raced towards the bus stop. “Why didn’t I set an alarm?” I thought desperately. I wished I could turn back the clock, but it was too late.',
'By the time I arrived at Tim’s party, my heart sank. The tables were covered with empty plates and cups, and most of the decorations had already been taken down. Everyone had left except Tim, who was clearing the tables alone. “I’m so sorry, Tim!” I panted, hanging my head in shame. “I fell asleep and forgot to set an alarm. Here is the birthday present I prepared for you.” Tim looked surprised before giving me a small smile. “It’s okay, Johnson. I thought you weren’t coming. I’m just glad you came.” Guilt washed over me. To make up for my mistake, I stayed behind and helped Tim clean up.',
'Although Tim forgave me, I still felt terrible for missing his special celebration. As I walked home that evening, I kept thinking about what had happened. I had promised my friend that I would attend his birthday party, yet my carelessness had almost caused me to break that promise.',
'My thoughts returned to the present as I stared at the birthday invitation in my hand. A faint smile appeared on my face. That mistake had taught me a lesson I would never forget: never take a promise lightly and always manage my time carefully. Even a small careless mistake can disappoint someone we care about.'],map:[['Hook','A birthday invitation returns the narrator to one unforgettable mistake.'],['Set-up','Homework, then a happy invitation and a clear condition from Mum.'],['Build-up','The narrator feels safe because there seems to be plenty of time.'],['Turning point','The clock reads 3:50 p.m.; the consequences become urgent.'],['Resolution','The narrator apologises, sees the friend alone and helps to clean up.'],['Reflection','The promise and the lesson give the ending weight.']],moves:[['A strong hook','“Whenever I see…” creates a present-day trigger, then opens the memory.'],['Time pressure','Exact times such as “two o’clock” and “3:50 p.m.” make the mistake believable.'],['Show the feeling','Use body reactions: “My eyes widened in horror” and “My heart was pounding”.'],['Meaningful ending','Return to the opening object and state a lesson connected to the event.']]}];
function getState(){try{return Object.assign({studied:{}},JSON.parse(localStorage.getItem(STORE)||'{}'))}catch(e){return{studied:{}}}}function save(s){localStorage.setItem(STORE,JSON.stringify(s))}function esc(t){return String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function current(){return COMPOSITIONS.find(x=>x.id===activeId)||COMPOSITIONS[0]}
function render(){const s=getState(),x=current();tabs.innerHTML=COMPOSITIONS.map(c=>`<button class="tab ${c.id===x.id?'active':''}" onclick="selectModel('${c.id}')"><strong>📖 ${esc(c.title)}</strong><small>${esc(c.type)}</small></button>`).join('');screen.innerHTML=`<div class="layout"><article class="paper"><div class="meta"><span class="chip">${esc(x.type)}</span><span class="chip">${esc(x.theme)}</span></div><h2>${esc(x.title)}</h2><p>${esc(x.source)}</p><div class="actions"><button class="primary" onclick="markStudied()">${s.studied[x.id]?'Studied ✓':'Mark as studied'}</button><button class="secondary" onclick="speakEssay()">🔊 Listen to model</button></div><div class="essay">${x.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}</div></article><aside><section class="panel"><h3>Story map</h3>${x.map.map((m,i)=>`<div class="step"><span class="n">${i+1}</span><div><strong>${esc(m[0])}</strong><span>${esc(m[1])}</span></div></div>`).join('')}</section><section class="panel"><h3>Writing moves to borrow</h3>${x.moves.map(m=>`<div class="move"><strong>${esc(m[0])}</strong><span>${esc(m[1])}</span></div>`).join('')}</section>${s.studied[x.id]?'<div class="done">✓ This model is saved as studied. Its place and your record will remain when more models are added.</div>':''}</aside></div>`}
function selectModel(id){activeId=id;window.speechSynthesis?.cancel();render();scrollTo(0,0)}function markStudied(){const s=getState();s.studied[current().id]=new Date().toISOString();save(s);render()}function speakEssay(){if(muted||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(current().paragraphs.join(' '));u.lang='en-SG';u.rate=.88;speechSynthesis.speak(u)}sound.onclick=()=>{muted=!muted;if(muted)speechSynthesis?.cancel();sound.textContent=muted?'🔇 Sound off':'🔊 Read aloud'};addEventListener('message',e=>{if(e.data?.type==='johnson-hub-sound'){muted=!e.data.value;if(muted)speechSynthesis?.cancel();sound.textContent=muted?'🔇 Sound off':'🔊 Read aloud'}});render();
</script></body></html>
