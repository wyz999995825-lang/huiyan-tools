<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>EYO 备考作战室 · Johnson</title>
<style>
:root{--bg:#f5fafe;--bg2:#e9f4fc;--card:#fff;--line:#cfe6f7;--ink:#183b4d;--ink2:#5c7e93;
--pri:#3f8fd0;--pri2:#2a6fa8;--go:#2fae82;--go2:#e3f6ee;--warn:#e8823c;--warn2:#fdf0e4;
--gold:#d9a22b;--r:16px;--sh:0 3px 14px rgba(24,59,77,.09)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;
background:var(--bg);color:var(--ink);font-size:17px;line-height:1.65;padding-bottom:40px}
.wrap{max-width:900px;margin:0 auto;padding:0 14px}
header{background:linear-gradient(135deg,#4e9ad8,#2a6fa8);color:#fff;padding:16px 0 14px}
header .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:21px;font-weight:800;letter-spacing:.3px}
.sub{font-size:13px;opacity:.9}
.tabs{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.tab{background:rgba(255,255,255,.18);border:0;color:#fff;padding:11px 15px;border-radius:12px;
font-size:14px;font-weight:700;cursor:pointer;min-height:46px}
.tab.on{background:#fff;color:var(--pri2)}
.cd{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;-webkit-overflow-scrolling:touch}
.cdi{flex:0 0 auto;background:var(--card);border:1.5px solid var(--line);border-radius:14px;
padding:9px 13px;box-shadow:var(--sh);min-width:132px}
.cdi b{display:block;font-size:14px}
.cdi .n{font-size:24px;font-weight:900;color:var(--pri2);line-height:1.1}
.cdi .d{font-size:12px;color:var(--ink2)}
.cdi.soon{border-color:var(--warn);background:var(--warn2)}
.cdi.done{opacity:.45}
.phase{background:linear-gradient(90deg,#fff6e0,var(--bg2));border:1.5px dashed var(--gold);
border-radius:14px;padding:11px 15px;margin:14px 0;font-size:14px;font-weight:700;color:#8a6a1e}
.day{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);
padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.dayhd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.dayhd h2{font-size:19px;font-weight:800}
.pill{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--bg2);color:var(--pri2)}
.pill.exam{background:#ffe9e0;color:#c4522a}
.bar{height:9px;border-radius:99px;background:var(--bg2);overflow:hidden;margin:10px 0 4px}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--go));transition:width .4s}
.tk{border:1.5px solid var(--line);border-radius:14px;padding:13px;margin-top:11px;background:#fcfeff}
.tk.ok{border-color:var(--go);background:var(--go2)}
.tkhd{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:800;padding:4px 9px;border-radius:8px;background:var(--bg2);color:var(--pri2);flex:0 0 auto}
.tkname{font-size:18px;font-weight:800;flex:1;min-width:150px}
.mins{font-size:12px;color:var(--ink2);font-weight:700}
.det{font-size:15px;color:var(--ink2);margin:7px 0 0;line-height:1.7}
.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:11px;align-items:center}
.btn{border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:800;cursor:pointer;min-height:46px}
.btn.p{background:var(--pri);color:#fff}
.btn.p:active{background:var(--pri2)}
.btn.g{background:var(--go);color:#fff}
.btn.o{background:#fff;color:var(--pri2);border:1.5px solid var(--pri)}
.btn.s{background:var(--bg2);color:var(--ink2)}
.tmr{font-variant-numeric:tabular-nums;font-weight:900;font-size:20px;color:var(--pri2);min-width:74px;text-align:center}
.note{font-size:13px;color:var(--warn);font-weight:700}
.cal{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);margin-bottom:16px}
.crow{display:grid;grid-template-columns:92px 1fr 64px;gap:8px;padding:11px 13px;border-top:1px solid var(--bg2);align-items:center;cursor:pointer}
.crow:first-child{border-top:0}
.crow:active{background:var(--bg2)}
.crow .dt{font-size:13px;font-weight:800;color:var(--ink2)}
.crow .ts{font-size:14px;line-height:1.5}
.crow .st{text-align:right;font-size:13px;font-weight:800;color:var(--ink2)}
.crow.full{background:var(--go2)}
.crow.exday{background:#fff4ee}
.crow.today{outline:3px solid var(--warn);outline-offset:-3px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:11px;margin:12px 0}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px;text-align:center;box-shadow:var(--sh)}
.stat b{display:block;font-size:27px;font-weight:900;color:var(--pri2);line-height:1.15}
.stat span{font-size:12px;color:var(--ink2)}
.hm{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.hmc{width:34px;height:34px;border-radius:9px;background:var(--bg2);display:flex;align-items:center;
justify-content:center;font-size:11px;font-weight:800;color:var(--ink2);border:1px solid var(--line)}
.hmc.p1{background:#dff0e8}.hmc.p2{background:#bce6d3}.hmc.p3{background:var(--go);color:#fff}
h3{font-size:17px;margin:16px 0 6px}
.tip{font-size:14px;color:var(--ink2);background:var(--bg2);border-radius:12px;padding:11px 13px;margin-top:10px}
.cf{position:fixed;pointer-events:none;z-index:99;border-radius:50%}
footer{text-align:center;font-size:12px;color:#9ab6c8;padding:18px 0 4px}
@media(max-width:560px){.crow{grid-template-columns:76px 1fr 52px}.tkname{font-size:17px}}
</style></head><body>
<header><div class="wrap">
  <div><h1>🎯 EYO 备考作战室</h1><div class="sub">Johnson · P5 年终考 · 每天 3 件事 × 30 分钟</div></div>

</div></header>

const KEY="johnson_eyo_plan";
function ld(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
function sv(s){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
let S=ld(); S.done=S.done||{}; S.focus=S.focus||{};
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dayOf(k){return PLAN.days.find(d=>d.date===k)}
function diffDays(a,b){return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5)}
let view="today", viewDate=null;
function muted(){try{return localStorage.getItem("johnson_tts_on")==="0"||localStorage.getItem("jenny_tts_on")==="0"}catch(e){return false}}
function chime(ok){ if(muted())return; try{const c=new (window.AudioContext||window.webkitAudioContext)();
  [ok?660:440,ok?880:0].forEach((f,i)=>{if(!f)return;const o=c.createOscillator(),g=c.createGain();
  o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.001,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.16,c.currentTime+.02+i*.11);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.42+i*.11);
  o.start(c.currentTime+i*.11);o.stop(c.currentTime+.5+i*.11)});}catch(e){} }
function boom(){const C=["#3f8fd0","#2fae82","#d9a22b","#e8823c","#7db8e8"];
 for(let i=0;i<34;i++){const e=document.createElement("div");e.className="cf";

  document.body.appendChild(e);requestAnimationFrame(()=>{e.style.top=(5+Math.random()*80)+"%";e.style.left=(5+Math.random()*90)+"%";e.style.opacity="0";e.style.transform="scale("+(1+Math.random()*2.4)+") rotate("+(Math.random()*360)+"deg)"});
  setTimeout(()=>e.remove(),1000)} }

/* ===== 倒计时条 ===== */
function renderCD(){
  const t=today();
  document.getElementById("cd").innerHTML=PLAN.exams.map(e=>{
    const n=diffDays(t,e.date);
    const cls=n<0?"done":(n<=3?"soon":"");
    const label=n<0?"已考完":(n===0?"就是今天":n+" 天");
    return '<div class="cdi '+cls+'"><b>'+e.name+'</b><div class="n">'+label+'</div><div class="d">'+e.date.slice(5).replace("-","/")+'</div></div>';
  }).join("");
}

    +'<span class="mins" style="margin-left:auto">'+done+'/3 完成 · 今日专注 '+fmt(S.focus[k]||0)+'</span></div>';
  h+='<div class="bar"><span style="width:'+(done/3*100)+'%"></span></div>';
  if(d.exam)h+='<div class="tip">📝 '+(k===today()?'今天有考试':'这天有考试')+'（'+d.exam+'）。'+(PLAN.exams.every(e=>e.date<=k)?'这是<b>最后一场</b>！考完下面三件事都是放松任务。':(k===today()?'先安心考完，任务是为<b>下一场</b>做准备，做不完没关系。':'考试日任务量已自动调轻。'))+'</div>';
  d.tasks.forEach((t,i)=>{
    const ok=!!S.done[t.id], tl=TOOLS[t.tool]||["",""];
    h+='<div class="tk'+(ok?' ok':'')+'" id="tk'+i+'"><div class="tkhd"><span class="badge">'+t.subj+'</span>'
      +'<span class="tkname">'+(ok?'✅ ':'')+t.name+'</span><span class="mins">⏱ '+t.min+' 分钟</span></div>'
      +'<div class="det">'+t.detail+'</div><div class="row">';
    if(!ok){
      h+='<span class="tmr" id="tm'+i+'">'+fmt(0)+'</span>'
        +'<button class="btn p" id="go'+i+'" onclick="tgl('+i+')">▶ 开始专注</button>'
        +'<button class="btn g" onclick="fin(\''+t.id+'\','+i+')">✓ 完成</button>';
    }else{
      h+='<button class="btn s" onclick="undo(\''+t.id+'\')">↩ 撤销完成</button>';
    }
    if(tl[0])h+='<button class="btn o" onclick="open2(\''+tl[0]+'\')">'+tl[1]+'</button>';
    if(t.tool==="paper")h+='<span class="note">需要妈妈提供练习卷/真题</span>';
    h+='</div></div>';
  });
  h+='</div>';
  if(done===3)h+='<div class="day" style="border-color:var(--go);background:var(--go2)"><h2>🏅 今天三件事全部完成！</h2><p class="det">连续完成 '+streak()+' 天。想加练就点「全程」挑一天提前做，考前每一次加练都在拉开差距。</p></div>';
  app.innerHTML=h;
  tickAll();
}
function fmt(s){s=Math.max(0,s|0);return String((s/60)|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
/* 计时器 */
let tmr={},raf=null;
function tgl(i){
  if(tmr[i]){clearInterval(tmr[i].h);delete tmr[i];const b=document.getElementById("go"+i);if(b)b.textContent="▶ 继续专注";return}
  const b=document.getElementById("go"+i); if(b)b.textContent="⏸ 暂停";
  tmr[i]={s:tmr[i]?tmr[i].s:0,h:setInterval(()=>{
    const k=viewDate||today(); S.focus[k]=(S.focus[k]||0)+1; sv(S);
    const el=document.getElementById("tm"+i);
    const cur=(+(el&&el.dataset.s||0))+1; if(el){el.dataset.s=cur;el.textContent=fmt(cur);
      if(cur===1800){chime(true);el.style.color="var(--go)";el.textContent="30:00 ✓"}}
  },1000)};
}
function tickAll(){Object.keys(tmr).forEach(i=>{const el=document.getElementById("tm"+i);if(el&&tmr[i])el.dataset.s=el.dataset.s||0})}
function fin(id,i){
  if(tmr[i]){clearInterval(tmr[i].h);delete tmr[i]}
  S.done[id]={ts:Date.now()}; sv(S); chime(true);
  const k=viewDate||today(); const d=dayOf(k);
  if(d&&d.tasks.every(t=>S.done[t.id])){boom();setTimeout(boom,320)}
  renderToday(); renderCD();
}
function undo(id){delete S.done[id];sv(S);renderToday()}
function open2(u){try{window.open(u,"_blank","noopener")}catch(e){location.href=u}}
/* ===== 全程 ===== */
function renderCal(){
  const t=today();
  let h="";
  PLAN.phases.forEach(p=>{
    const ds=PLAN.days.filter(d=>d.phase===p.id);
    const tot=ds.length*3, dn=ds.reduce((a,d)=>a+d.tasks.filter(x=>S.done[x.id]).length,0);
    h+='<div class="phase">'+p.icon+' 阶段 '+p.id+'｜'+p.name+' · '+p.from.slice(5)+' ~ '+p.to.slice(5)+' · 完成 '+dn+'/'+tot+'</div><div class="cal">';
    ds.forEach(d=>{
      const n=d.tasks.filter(x=>S.done[x.id]).length;
      h+='<div class="crow'+(n===3?" full":"")+(d.exam?" exday":"")+(d.date===t?" today":"")+'" onclick="pick(\''+d.date+'\')">'
        +'<div class="dt">'+d.date.slice(5).replace("-","/")+' 周'+d.dow+(d.exam?'<br><span style="color:#c4522a">📝考试</span>':'')+'</div>'
        +'<div class="ts">'+d.tasks.map(x=>'<span class="badge" style="margin-right:5px">'+x.subj+'</span>'+x.name).join('<br>')+'</div>'
        +'<div class="st">'+(n===3?"✅":n+"/3")+'</div></div>';
    });
    h+='</div>';
  });
  document.getElementById("app").innerHTML=h;
}
function pick(k){viewDate=k;go("today")}
/* ===== 妈妈看板 ===== */
function renderParent(){
  const t=today();
  const total=PLAN.days.length*3, dn=Object.keys(S.done).length;
  const past=PLAN.days.filter(d=>d.date<=t);
  const pastTot=past.length*3, pastDn=past.reduce((a,d)=>a+d.tasks.filter(x=>S.done[x.id]).length,0);
  const bySubj={}; PLAN.days.forEach(d=>d.tasks.forEach(x=>{if(S.done[x.id]){const k=x.subj.split("·")[0];bySubj[k]=(bySubj[k]||0)+1}}));
  const focusTot=Object.values(S.focus).reduce((a,b)=>a+b,0);
  let h='<div class="grid2">'
   +'<div class="stat"><b>'+pastDn+'/'+pastTot+'</b><span>至今应做/已做</span></div>'
   +'<div class="stat"><b>'+(pastTot?Math.round(pastDn/pastTot*100):0)+'%</b><span>执行率</span></div>'
   +'<div class="stat"><b>'+streak()+'</b><span>连续全勤天</span></div>'
   +'<div class="stat"><b>'+Math.round(focusTot/60)+'</b><span>累计专注(分钟)</span></div>'
   +'<div class="stat"><b>'+dn+'/'+total+'</b><span>全程进度</span></div></div>';
  h+='<h3>最近 14 天</h3><div class="cal" style="padding:12px 13px"><div class="hm">';
  for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);
    const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    const dd=dayOf(k); const n=dd?dd.tasks.filter(x=>S.done[x.id]).length:0;
    h+='<div class="hmc '+(n>=3?"p3":n===2?"p2":n===1?"p1":"")+'" title="'+k+'">'+k.slice(8)+'</div>';}
  h+='</div></div>';
  h+='<h3>各科已完成任务数</h3><div class="cal" style="padding:12px 13px">'
   +(Object.keys(bySubj).length?Object.entries(bySubj).sort((a,b)=>b[1]-a[1]).map(x=>'<span class="badge" style="margin:4px 6px 4px 0;display:inline-block">'+x[0]+' · '+x[1]+'</span>').join(""):'<span class="det">还没有完成记录</span>')+'</div>';
  const miss=past.filter(d=>d.tasks.filter(x=>S.done[x.id]).length<3&&!d.exam).slice(-5);
  h+='<h3>可以补做的日子</h3><div class="cal">'+(miss.length?miss.map(d=>{
    const n=d.tasks.filter(x=>S.done[x.id]).length;
    return '<div class="crow" onclick="pick(\''+d.date+'\')"><div class="dt">'+d.date.slice(5)+'</div><div class="ts">'+d.tasks.filter(x=>!S.done[x.id]).map(x=>x.subj+"·"+x.name).join("；")+'</div><div class="st">'+n+'/3</div></div>';
  }).join(""):'<div class="crow"><div class="dt">👍</div><div class="ts">没有欠账，全部跟上了</div><div class="st">✅</div></div>')+'</div>';
  h+='<div class="tip">📌 四科重点（按诊断）：英文=理解定位证据+作文细节；华文=看图作文开头/转折/收束；数学=分数剩余量、转移与逆推、终检；科学=OEQ 完整因果链与 2 分得分点。</div>';
  document.getElementById("app").innerHTML=h;
}
function streak(){
  let n=0; const d=new Date();
  for(;;){const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    const dd=dayOf(k); if(!dd)break;
    if(dd.tasks.every(x=>S.done[x.id])){n++;d.setDate(d.getDate()-1)}else break; if(n>200)break}
  return n;
}
function go(v){
  view=v; if(v!=="today")viewDate=null;
  ["today","cal","parent"].forEach(x=>{const b=document.getElementById("tb-"+x);if(b)b.className="tab"+(x===v?" on":"")});
  if(v==="today")renderToday(); else if(v==="cal")renderCal(); else renderParent();
  window.scrollTo(0,0);
}
renderCD(); go("today");
window.addEventListener("storage",()=>{S=ld();S.done=S.done||{};S.focus=S.focus||{};go(view)});
</script></body></html>
