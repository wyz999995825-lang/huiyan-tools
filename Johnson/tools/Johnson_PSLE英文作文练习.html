  'Being Thankful': {
    text: '<p><span class="hl-technique">"I hate you! You are the worst teacher ever!"</span> I screamed silently in my head as Mrs Lim handed back my composition, covered in red ink. It was the third time that month she had made me rewrite my essay. While my classmates were playing during recess, I sat at my desk, <span class="hl-vocab">seething</span> with frustration.</p><me-comment>Strong opening with inner dialogue showing raw emotion. The contrast between classmates playing and the narrator working creates sympathy.</me-comment><p>Mrs Lim was my Primary Five English teacher, and she was <span class="hl-vocab">notoriously</span> strict. She would circle every weak verb, underline every boring phrase, and write comments like "You can do better than this, Johnson" in her neat handwriting. I <span class="hl-technique">dreaded her lessons the way one dreads a visit to the dentist</span> \u2014 necessary, but painful.</p><p>One afternoon, she kept me back after class. My heart sank as I <span class="hl-vocab">trudged</span> to her desk. "Johnson," she said, her voice surprisingly gentle, "do you know why I push you so hard?" I shook my head, staring at my shoes. "Because I can see something in your writing that you cannot see yet. You have a voice. But right now, it is buried under lazy words and careless mistakes."</p><me-comment>Dialogue reveals the teacher\'s true motivation. The gentle tone contrasts with her strict reputation, creating a turning point.</me-comment><p>Her words planted a seed in my mind, though I did not realise it then. Slowly, I began to notice changes in my writing. The verbs I chose were sharper. My descriptions <span class="hl-technique">painted pictures instead of just filling lines</span>. When the mid-year examinations arrived, I stared at my composition paper with a strange feeling \u2014 not dread, but <span class="hl-vocab">anticipation</span>.</p><p>The day the results were returned, Mrs Lim walked towards me with an expression I had never seen before \u2014 <span class="hl-technique">a small smile tugging at the corners of her lips</span>. "Band One," she said quietly, placing the paper on my desk. My eyes widened. <span class="hl-technique">A warmth spread through my chest, melting away months of resentment like snow under the morning sun.</span></p><p>I looked up at her and whispered, "Thank you, Mrs Lim." She nodded and walked away, but I noticed her eyes glistening slightly.</p><p><span class="hl-technique">Even now, whenever I pick up a pen to write, I hear her voice in my head: "You can do better than this."</span> And I smile, because I finally understand that the people who push us the hardest are often the ones who believe in us the most. That day, I learnt that being thankful does not always mean thanking someone for being kind \u2014 sometimes, it means thanking them for being tough.</p><me-comment>The sensory callback ending links present-day writing to the teacher\'s words. The final reflection redefines "thankful" in a mature, unexpected way.</me-comment>',
    wordCount: 430
  },
  'Something That Was Lost': {
    text: '<p><span class="hl-technique">The moment I looked down at my bare wrist, my world stopped spinning.</span> Grandfather\'s watch \u2014 the one he had pressed into my palm on his last birthday, the one with the tiny scratch on its face from "an adventure in 1965" \u2014 was gone.</p><me-comment>Opening with a moment of discovery. The detail about the scratch and 1965 makes the watch feel precious and irreplaceable.</me-comment><p>I <span class="hl-vocab">frantically</span> retraced my steps, my eyes scanning every inch of the ground. The school canteen. The basketball court. The library. Each empty surface felt like a punch to my stomach. <span class="hl-technique">My hands trembled as I turned my bag inside out for the fifth time, as if the watch might magically appear between my textbooks.</span></p><p>"What are you looking for?" my best friend, Wei Jie, asked. When I told him, his face fell. He knew what that watch meant to me. Without a word, he began searching alongside me, checking under tables and behind bookshelves.</p><p>As the afternoon <span class="hl-vocab">wore on</span>, hope began to fade. I sat on the bench outside the general office, <span class="hl-technique">my head in my hands, the weight of loss pressing down on my shoulders like a heavy blanket</span>. I thought of Grandfather\'s wrinkled hands fastening the strap around my wrist. "Take care of it," he had said with a wink. "It has kept perfect time for fifty years. Don\'t let it down."</p><me-comment>Inner thoughts and flashback to Grandfather add emotional depth. The dialogue makes the memory vivid and personal.</me-comment><p><span class="hl-technique">A lump formed in my throat.</span> I had let him down.</p><p>Just then, the school janitor, Uncle Ahmad, appeared. "Excuse me, son. Are you the boy who lost a watch?" My head shot up. He held out his weathered palm, and there it was \u2014 <span class="hl-vocab">glinting</span> under the corridor light, still ticking faithfully. He had found it near the water cooler.</p><p>I thanked Uncle Ahmad so many times that he laughed and patted my shoulder. As I fastened the watch back onto my wrist, <span class="hl-technique">I could almost hear Grandfather chuckling from somewhere far away</span>. That evening, I held the watch to my ear and listened to its steady tick-tick-tick. It sounded like a heartbeat \u2014 small, constant, and infinitely precious.</p><p>From that day on, I understood that some things cannot be measured in dollars. <span class="hl-technique">The watch was not valuable because it was expensive \u2014 it was valuable because it carried a piece of someone I loved.</span> And I made a promise to myself: I would guard it with my life, just as Grandfather had guarded it for fifty years before me.</p><me-comment>The ending redefines value (not money, but love). The promise creates closure and growth.</me-comment>',
    wordCount: 440
  },
  'A Long Wait': {
    text: '<p><span class="hl-technique">Tick. Tock. Tick. Tock.</span> The clock on the wall seemed to mock me as I sat in the school hall, waiting for my PSLE results. Every second felt like an hour. Around me, two hundred students fidgeted in their seats, their faces a mixture of hope and dread.</p><me-comment>Onomatopoeia opening with personification (clock "mocking"). Sets the tense atmosphere immediately.</me-comment><p>I wiped my <span class="hl-vocab">clammy</span> palms on my school uniform for the tenth time. My mother sat in the parents\' gallery above, and I could feel her eyes on me even without looking up. She had watched me study late into the night for months. She had made me warm Milo at midnight and left encouraging notes on my desk. <span class="hl-technique">The thought of disappointing her was heavier than any exam paper.</span></p><p>The principal stepped onto the stage, and <span class="hl-technique">the hall fell so silent I could hear my own heartbeat</span>. She spoke about hard work and resilience, but her words washed over me like background noise. All I could think was: did I do enough?</p><p>When our form teacher finally called us to collect our results, my legs felt like they were made of jelly. I watched my classmates walk back to their seats \u2014 some <span class="hl-vocab">beaming</span>, others with tears streaming down their cheeks. Each reaction made my heart beat faster.</p><p>Then it was my turn. Mrs Wong handed me the envelope with a gentle smile. My fingers shook as I tore it open. The numbers blurred before my eyes for a moment before snapping into focus. <span class="hl-technique">A wave of relief crashed over me, so powerful that my knees nearly buckled.</span> I had done it. Not perfectly, but enough. More than enough.</p><p>I looked up at the gallery. My mother was already on her feet, tears rolling down her cheeks, her hands clasped together. <span class="hl-technique">In that moment, the months of sacrifice, the late nights, and the moments of doubt all dissolved into a single feeling: gratitude.</span></p><p>"Thank you, Mum," I mouthed from across the hall. She nodded, unable to speak, but her smile said everything words could not.</p><p>That long wait taught me something no textbook ever could: <span class="hl-technique">the things worth having are always the things worth waiting for.</span> And the people who wait alongside us \u2014 silently, patiently, lovingly \u2014 are the greatest treasures of all.</p><me-comment>Universal truth ending elevates the personal story. The focus shifts from grades to gratitude for family.</me-comment>',
    wordCount: 380
  },
  'Trying Something New': {
    text: '<p>"You want me to do WHAT?" I stared at my father in disbelief as he held up a pair of roller skates. I had never been particularly <span class="hl-vocab">coordinated</span>, and the thought of balancing on wheels terrified me.</p><p>"Trust me," Dad said with a grin. "You will love it." I was not convinced. But that Saturday morning, I found myself standing at the East Coast Park skating rink, my knees already shaking before I had even put the skates on.</p><p>The first hour was a disaster. I fell so many times that a little girl stopped to ask if I was okay. <span class="hl-technique">My pride hurt more than my bruised knees.</span> I wanted to give up, to rip off the skates and retreat to the safety of the bench.</p><p>But Dad kept skating circles around me, his laughter echoing in the morning air. "Fall seven times, stand up eight," he called out. Gritting my teeth, I pushed myself up once more. And then something clicked. My feet found a rhythm. The wind brushed against my face. <span class="hl-technique">For the first time, I was gliding instead of stumbling.</span></p><p>By the end of the day, I could skate from one end of the rink to the other without falling. It was not graceful, but it was progress. As we drove home, I leaned my head against the car window, tired but strangely proud.</p><p>That day taught me that the scariest step is always the first one. But once you take it, you might just discover something wonderful about yourself that you never knew existed.</p>',
    wordCount: 250
  },
  'A Change for the Better': {
    text: '<p>For as long as I could remember, I had been the quiet kid \u2014 the one who sat in the back row, hoping the teacher would never call my name. Speaking up in class felt like standing on the edge of a cliff. <span class="hl-technique">My voice would shrink to a whisper whenever more than three people were listening.</span></p><p>Everything changed when Mrs Goh announced the class presentation project. "Every student will present," she said firmly. There was no escape. For two weeks, I practised my speech in front of my bedroom mirror, my stuffed animals serving as my audience. My mother would sometimes peek in and give me a thumbs up.</p><p>On presentation day, my name was called third. I walked to the front of the class on legs that felt like they belonged to someone else. <span class="hl-technique">The faces of my classmates blurred into a wall of expectation.</span> I opened my mouth, and for a horrible moment, nothing came out.</p><p>Then I remembered my mother\'s words: "Brave does not mean not scared. Brave means scared but doing it anyway." I took a deep breath and began. My voice shook at first, but word by word, sentence by sentence, it grew steadier. When I finished, the class clapped \u2014 and I realised I was smiling.</p><p>That small moment changed everything. I was still quiet, but I was no longer afraid. Sometimes, the biggest changes begin with the smallest acts of courage.</p>',
    wordCount: 230

  'A Promise': {
    text: '<p>"I promise I will take care of it," I said, cradling the tiny hamster in my palms. Its whiskers twitched as it looked up at me with round, trusting eyes. My parents exchanged a doubtful glance, but they let me bring Biscuit home.</p><p>For the first two weeks, I was the perfect pet owner. I cleaned Biscuit\'s cage daily, refilled his water bottle, and even read him bedtime stories. But as school got busier, my <span class="hl-vocab">enthusiasm</span> began to fade. I started forgetting to change his water. The cage went uncleaned for days. <span class="hl-technique">Biscuit\'s once-bright eyes seemed to lose their sparkle.</span></p><p>One evening, my mother sat beside me. "Do you remember your promise?" she asked gently. I looked at Biscuit, huddled in the corner of his dirty cage, and <span class="hl-technique">shame washed over me like a cold wave</span>. He had trusted me, and I had let him down.</p><p>That night, I cleaned his cage until it shone. I whispered, "I am sorry, Biscuit." From that day on, I kept my promise \u2014 not because anyone was watching, but because I understood that a promise is not just words. It is a bond between you and the one who trusts you. And breaking it breaks something inside you too.</p>',

  'A Celebration': {
    text: '<p>The school hall was transformed. <span class="hl-technique">Red and gold banners draped across the ceiling like rivers of fire</span>, and the smell of fried noodles and curry puffs drifted through the air. It was Racial Harmony Day, and for the first time, our class was in charge of the food stall.</p><p>We had spent weeks preparing. Priya taught us how to fold <span class="hl-vocab">samosas</span>, Wei Liang demonstrated the art of rolling popiah, and I contributed my grandmother\'s famous pineapple tarts. Working together, we discovered that our differences were not barriers \u2014 they were ingredients.</p><p>When the celebration began, our stall was <span class="hl-vocab">swarming</span> with students. We served, laughed, and even danced to the music playing from the speakers. At one point, our form teacher joined in, her sari swaying as she attempted a hip-hop move. <span class="hl-technique">The whole class erupted in laughter, and in that moment, we were not Malay, Chinese, Indian, or Eurasian \u2014 we were simply friends.</span></p><p>As the day ended and we cleaned up our stall, I looked around at my classmates\' tired but happy faces. That celebration taught me that the best way to understand someone different from you is to share a meal, share a laugh, and share a story. Unity is not about being the same \u2014 it is about celebrating what makes each of us unique.</p>',

  'Teamwork': {
    text: '<p>The dragon boat sat in the water like a sleeping giant. Our school team of twenty students stared at it nervously. We had only three weeks of training before the race, and half of us had never held a paddle before.</p><p>Coach Tan blew his whistle. "In a dragon boat, one weak link sinks everyone. You paddle together, or you lose together." His words were blunt, but they were true. During the first practice, our strokes were <span class="hl-vocab">chaotic</span> \u2014 paddles clashing, water splashing everywhere, and the boat zigzagging like a confused snake.</p><p>But day by day, something changed. We began to listen to the drummer\'s beat. We watched the person in front and matched their rhythm. <span class="hl-technique">Twenty individual paddlers slowly became one breathing, moving machine.</span> Even Xiao Wei, the smallest boy in our team, found his strength when he saw the rest of us counting on him.</p><p>On race day, <span class="hl-technique">my arms burned and my lungs screamed for air</span>, but I did not stop. I could hear my teammates grunting with effort beside me, and their determination fuelled mine. We crossed the finish line in third place \u2014 not first, but it felt like victory.</p><p>As we lifted our paddles in celebration, I understood what Coach Tan had meant. Teamwork is not about having the strongest individuals. It is about ordinary people choosing to move in the same direction, at the same time, for the same goal.</p>',

MODEL_ESSAYS['An Act of Kindness'] = {
  text: '<p>It was a sweltering afternoon, and I was trudging home from school when I noticed an elderly woman struggling to carry her groceries across the road. <span class="hl-technique">Two heavy bags hung from her frail arms like anchors dragging her down.</span> The traffic light was already blinking, but she had only made it halfway.</p><me-comment>Opens with a vivid scene. The simile "like anchors" immediately shows the struggle.</me-comment><p>Without thinking, I rushed forward. "Auntie, let me help you!" I took one bag from her and guided her across. She looked up at me with <span class="hl-vocab">grateful</span> eyes and said, "Thank you, boy. My son is overseas and I have no one to help me."</p><p>Her words hit me like a <span class="hl-technique">stone in my chest</span>. I thought of my own grandmother, living alone in Toa Payoh. How many times had strangers helped her without me knowing? I walked the auntie to her block, carried her bags to the lift, and even pressed the button for her floor.</p><p>As the lift doors closed, she smiled and said, "You remind me of my son." <span class="hl-technique">Those six words stayed with me long after I had walked away.</span> That evening, I called my grandmother. "Ah Ma, I am coming to visit you this Saturday," I said. Her laughter on the other end of the phone was the sweetest sound I had heard all week.</p><p>That small act of kindness taught me something important: <span class="hl-technique">helping others does not just change their day \u2014 it changes yours.</span> Sometimes, the person you help is a mirror, reflecting back someone you love.</p>',

MODEL_ESSAYS['A Lesson in Honesty'] = {
  text: '<p>"It was not me!" The lie slipped out before I could stop it. My teacher, Mrs Chen, looked at me with eyes that seemed to see straight through my words. <span class="hl-technique">I felt as if she could read the truth written in invisible ink across my forehead.</span></p><me-comment>Opens with dialogue and immediate conflict. The metaphor about invisible ink is creative.</me-comment><p>It had started as an accident. During art class, I had knocked over a bottle of paint, and it had splattered across Wei Ming\'s project \u2014 the one he had spent three weeks on. When he returned and saw the mess, his face <span class="hl-technique">crumpled like a piece of paper being crushed</span>. "Who did this?" he whispered.</p><p>I should have owned up immediately. But fear <span class="hl-vocab">paralysed</span> me. What if Wei Ming hated me? What if Mrs Chen called my parents? So I stayed silent, letting the blame float in the air like dust.</p><p>For three days, guilt followed me everywhere. It sat beside me during lessons. It whispered in my ear at night. <span class="hl-technique">It was heavier than any school bag I had ever carried.</span></p><p>On Thursday, I could not take it anymore. I approached Wei Ming during recess. "It was me," I said quietly. "I am really sorry." I braced myself for anger, but instead, he looked at me and said, "I know. I saw the paint on your sleeve that day." My eyes widened. "Then why didn\'t you say anything?" He shrugged. "I wanted you to do the right thing yourself."</p><p>That afternoon, I helped Wei Ming redo his project. As we painted side by side, I understood that honesty is not just about telling the truth \u2014 <span class="hl-technique">it is about freeing yourself from the weight of the lie.</span></p>',

MODEL_ESSAYS['An Unexpected Visitor'] = {
  text: '<p>The doorbell rang at exactly 7:15 on a rainy Tuesday evening. I was not expecting anyone. When I opened the door, <span class="hl-technique">my jaw dropped so far I thought it might hit the floor</span>. Standing in the corridor, drenched from head to toe, was Uncle Ah Huat \u2014 my father\'s brother whom we had not seen in five years.</p><me-comment>Hyperbole in the reaction creates humour. The detail "five years" creates intrigue.</me-comment><p>"Surprise!" he said, water <span class="hl-vocab">dripping</span> from his nose. Behind him stood a little girl clutching a teddy bear. "This is Mei Mei, your cousin."</p><p>The house erupted into chaos. My mother rushed to get towels. My father stood frozen in the kitchen doorway, a spatula still in his hand. <span class="hl-technique">For a moment, nobody moved \u2014 then my father crossed the room in three strides and wrapped his brother in a bear hug, spatula and all.</span></p><p>"Why didn\'t you call?" my mother asked, half-laughing, half-scolding. Uncle Ah Huat grinned sheepishly. "I wanted to see your faces. And I was not disappointed."</p><p>That evening, we squeezed around our small dining table, sharing stories and laughter over reheated curry. Mei Mei, who was shy at first, eventually warmed up and showed me her drawings. <span class="hl-technique">The house, usually quiet with just the three of us, felt alive with warmth and noise.</span></p><p>As I lay in bed that night, listening to my father and uncle talking softly in the living room, I realised something: <span class="hl-technique">the best moments in life are the ones you never plan for.</span> Sometimes, happiness arrives unannounced, dripping wet, with a teddy bear.</p>',

MODEL_ESSAYS['A Difficult Decision'] = {
  text: '<p>I stared at the two envelopes on my desk, my stomach churning. The first was an invitation to Ryan\'s birthday party \u2014 the event everyone in class was talking about. The second was a note from Xiao Li, my neighbour, asking if I could help him study for the science test on Monday. Xiao Li had recently moved from China and <span class="hl-vocab">struggled</span> with English instructions.</p><me-comment>Sets up a moral dilemma clearly. Two competing priorities create tension.</me-comment><p>The choice should have been easy. Ryan\'s party had a swimming pool, a bouncy castle, and a chocolate fountain. Helping Xiao Li meant sitting at a desk for three hours explaining photosynthesis. <span class="hl-technique">My brain screamed "party!" but something in my heart whispered "Xiao Li needs you."</span></p><p>I thought about the time Xiao Li had shared his lunch with me when I forgot mine. I remembered how he waited for me every morning at the bus stop, even when I was late. He never asked for anything in return. And now, the one time he needed help, was I going to choose a chocolate fountain over him?</p><p>I picked up my phone and texted Ryan: "Sorry, I can\'t make it. Happy birthday!" Then I walked next door. When Xiao Li opened the door and saw my science textbook, <span class="hl-technique">his face lit up like a light bulb being switched on</span>.</p><p>Three hours later, Xiao Li could explain the water cycle perfectly. "Thank you, Johnson," he said, bowing slightly. I smiled. The party would be over by now, but the feeling in my chest \u2014 warm, full, right \u2014 was better than any chocolate fountain.</p><p>That day, I learnt that <span class="hl-technique">doing the right thing does not always feel exciting, but it always feels right.</span></p>',

MODEL_ESSAYS['Getting into Trouble'] = {

MODEL_ESSAYS['A Family Outing Gone Wrong'] = {
  text: '<p>It was supposed to be the perfect day. Dad had planned a family cycling trip at Coney Island, complete with a picnic basket packed by Mum. Even my teenage sister, who usually preferred her phone to fresh air, seemed excited. <span class="hl-technique">The morning sun painted the sky in shades of orange and gold as we loaded our bicycles into the car.</span></p><me-comment>Ironic opening ("supposed to be perfect") signals that something will go wrong, creating suspense.</me-comment><p>Everything went smoothly until we reached the narrow trail through the mangrove area. My sister, cycling too fast as usual, hit a patch of mud and <span class="hl-vocab">swerved</span> sharply. Her front wheel caught mine, and suddenly we were both on the ground in a tangle of limbs and bicycle chains.</p><p>"OW! You idiot!" my sister screamed, clutching her knee. "ME? You were the one speeding!" I shouted back. Within seconds, we were arguing so loudly that a nearby <span class="hl-vocab">heron</span> took flight in alarm.</p><p>Dad pulled us apart, his face tight with disappointment. Mum knelt beside my sister and cleaned her wound silently. The picnic basket lay on its side, our sandwiches scattered in the dirt. <span class="hl-technique">The perfect day lay in ruins, and we had only ourselves to blame.</span></p><p>We sat on a bench in heavy silence. Then my sister did something unexpected \u2014 she started laughing. "We look ridiculous," she said, pointing at my mud-covered shirt. I looked at her bleeding knee, her tangled hair, and the squashed sandwich stuck to Dad\'s shoe. <span class="hl-technique">A giggle escaped my lips, then another, until all four of us were laughing so hard that tears ran down our faces.</span></p><p>We never made it to the picnic spot. Instead, we shared crushed sandwiches on that bench, swatting mosquitoes and telling stories. It was messy, imperfect, and absolutely wonderful.</p><p><span class="hl-technique">That day I learnt that the best family memories are not the ones that go according to plan \u2014 they are the ones where everything falls apart and you put it back together, one laugh at a time.</span></p>',

MODEL_ESSAYS['Helping a Stranger'] = {
  text: '<p>The MRT was packed that evening, and I was lucky to have found a seat. I plugged in my earphones and closed my eyes, ready to enjoy the ride home. Then I heard it \u2014 <span class="hl-technique">a soft sniffling sound, barely audible above the rumble of the train</span>.</p><me-comment>Quiet, observational opening. The contrast between the narrator\'s comfort and the stranger\'s distress creates tension.</me-comment><p>A few seats away, a woman was crying. She was trying to hide it, dabbing her eyes with a crumpled tissue, but her shoulders shook with every breath. Nobody else seemed to notice. Or perhaps they noticed but looked away, the way we Singaporeans sometimes do \u2014 <span class="hl-technique">politely pretending that other people\'s pain is invisible</span>.</p><p>I hesitated. What could I possibly do? I was just a Primary Five student. But my grandmother\'s voice echoed in my head: "If you can help, you must help. Even a small kindness can save someone\'s day."</p><p>I pulled out the packet of tissue from my bag \u2014 the one Mum always insisted I carry \u2014 and walked over. "Auntie, do you need some tissue?" I asked quietly. She looked up, surprised. Then she took the packet and whispered, "Thank you, boy."</p><p>We did not exchange another word. She got off two stops later, giving me a small nod as she left. I never learnt her name or why she was crying.</p><p>But that evening, as I walked home under a sky full of stars, I felt something I could not quite explain \u2014 <span class="hl-technique">a quiet warmth, like a candle flame burning steadily in my chest</span>. It was not pride. It was something simpler and deeper: the knowledge that I had chosen to see someone when the world had chosen to look away.</p><p><span class="hl-technique">Sometimes, helping a stranger does not require grand gestures. Sometimes, all it takes is a packet of tissue and the courage to care.</span></p>',

e bullies to sit down.</span></p>'

// =============================================
// QUIZ ENGINE
// =============================================
function startQuiz(questions) {
  state.questions = questions;
  state.currentQ = 0;
  state.hearts = 5;
  state.streak = 0;
  state.maxStreak = 0;
  state.score = 0;
  state.totalQ = questions.length;
  state.xpTotal = 0;
  document.getElementById('topBar').style.display = 'flex';
  document.getElementById('bottomBar').style.display = 'flex';
  updateTopBar();
  showScreen('questionScreen');
  renderQuestion();
}

function updateTopBar() {
  var pct = Math.round((state.currentQ / state.totalQ) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('heartsDisplay').innerHTML = '\u2764\ufe0f ' + state.hearts;
  document.getElementById('streakDisplay').innerHTML = '\ud83d\udd25 ' + state.streak;
}

function renderQuestion() {
  if (state.currentQ >= state.totalQ) { showResults(); return; }
  var q = state.questions[state.currentQ];
  state.selectedAnswer = null;
  state.answered = false;
  document.getElementById('feedback').classList.remove('show');
  setCheckBtn('disabled', 'CHECK');

  var excerptHtml = q.excerpt ? '<div class="essay-excerpt"><div class="essay-label">\ud83d\udcc4 From your essay</div>' + q.excerpt + '</div>' : '';
  var scenarioHtml = '';
  if (q.scenario) {
    scenarioHtml = '<div class="scenario-box"><div class="scenario-label">\ud83d\udccb Scenario</div><p>' + q.scenario.text + '</p>';
    if (q.scenario.underlined) {
      scenarioHtml += '<p style="margin-top:8px"><strong style="color:var(--orange)">\u2605 Underlined:</strong> <span class="underlined">' + q.scenario.underlined + '</span></p>';
    }
    scenarioHtml += '</div>';
  }

  var optionsHtml = '';
  for (var i = 0; i < q.options.length; i++) {
    optionsHtml += '<button class="option-btn" data-idx="' + i + '" onclick="selectOption(' + i + ')"><span class="option-num">' + String.fromCharCode(65 + i) + '</span><span>' + q.options[i] + '</span></button>';
  }

  document.getElementById('questionContent').innerHTML =
    '<div class="q-header"><div class="q-type">' + q.qType + '</div><h2>' + q.question + '</h2></div>' +
    excerptHtml + scenarioHtml +
    '<div class="options">' + optionsHtml + '</div>';
  window.scrollTo(0, 0);
}

function selectOption(idx) {
  if (state.answered) return;
  playClick();
  state.selectedAnswer = idx;
  var btns = document.querySelectorAll('.option-btn');
  for (var i = 0; i < btns.length; i++) btns[i].classList.remove('selected');
  document.querySelector('.option-btn[data-idx="' + idx + '"]').classList.add('selected');
  setCheckBtn('ready', 'CHECK');
}

function onCheck() {
  var btn = document.getElementById('checkBtn');
  if (btn.classList.contains('disabled')) return;
  if (btn.classList.contains('next')) { nextQuestion(); return; }

  var q = state.questions[state.currentQ];
  var isCorrect = state.selectedAnswer === q.correct;
  state.answered = true;

  var btns = document.querySelectorAll('.option-btn');
  for (var i = 0; i < btns.length; i++) {
    var idx = parseInt(btns[i].dataset.idx);
    if (idx === q.correct) btns[i].classList.add('correct');
    else if (idx === state.selectedAnswer && !isCorrect) btns[i].classList.add('wrong');
  }

  if (isCorrect) {
    playCorrect();
    state.score++;
    state.streak++;
    if (state.streak > state.maxStreak) state.maxStreak = state.streak;
    var xp = 10 + (state.streak >= 3 ? 5 : 0);
    state.xpTotal += xp;
    showXP('+' + xp + ' XP');
    if (state.streak === 3) showComboAnim('Good! \ud83d\udd25', 'good');
    if (state.streak === 5) { showComboAnim('Great!! \ud83d\udd25\ud83d\udd25', 'great'); playCombo(); }
    if (state.streak >= 7) { showComboAnim('AMAZING!!! \ud83d\udd25\ud83d\udd25\ud83d\udd25', 'amazing'); playCombo(); spawnConfetti(15); }
    showFeedback(true, '\u2705 Correct!', q.explain);
  } else {
    playWrong();
    state.streak = 0;
    state.hearts--;
    showFeedback(false, '\u274c Not quite!', q.explain);
    if (state.hearts <= 0) { setTimeout(function() { showResults(); }, 1500); return; }
  }
  updateTopBar();
  setCheckBtn('next', 'CONTINUE');
}

function nextQuestion() {
  state.currentQ++;
  document.getElementById('feedback').classList.remove('show');
  if (state.currentQ >= state.totalQ) showResults();
  else { renderQuestion(); updateTopBar(); }
}

var currentEssayIdx = 0;

function openReaderMenu() {
  playClick();
  currentEssayIdx = 0;
  renderReader();

function renderReader() {
  var essay = ESSAYS[currentEssayIdx];
  var text = essay.text;
  var sorted = essay.highlights.slice().sort(function(a, b) { return b.text.length - a.text.length; });
  for (var i = 0; i < sorted.length; i++) {
    var h = sorted[i];
    var cls = h.type === 'grammar' ? 'hl-grammar' : h.type === 'vocab' ? 'hl-vocab' : 'hl-technique';
    var hlIdx = essay.highlights.indexOf(h);
    var escaped = h.text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    text = text.replace(new RegExp(escaped), '<span class="' + cls + '" onclick="showTooltip(event,' + currentEssayIdx + ',' + hlIdx + ')">' + h.text + '</span>');
  }

  var paragraphs = text.split('\n\n');
  var pHtml = '';
  for (var pi = 0; pi < paragraphs.length; pi++) {
    pHtml += '<p data-pidx="' + pi + '" onclick="readParagraph(this)" style="margin-bottom:14px;">' + paragraphs[pi] + '</p>';
  }

  var tabsHtml = '';
  for (var ti = 0; ti < ESSAYS.length; ti++) {
    tabsHtml += '<button class="essay-tab ' + (ti === currentEssayIdx ? 'active' : '') + '" onclick="switchEssay(' + ti + ')">' + ESSAYS[ti].titleZh + '</button>';
  }

  document.getElementById('readerScreen').innerHTML =
    '<div class="back-row"><button class="back-btn" onclick="goHome()">\u2190 Back</button></div>' +
    '<h2 style="font-size:22px;font-weight:900;margin-bottom:12px;">\ud83d\udcd6 Essay Explorer</h2>' +
    '<div class="essay-nav">' + tabsHtml + '</div>' +
    '<div class="hl-legend">' +
      '<span><span class="dot" style="background:#F8B500"></span> Good vocabulary</span>' +
      '<span><span class="dot" style="background:#74B9FF"></span> Writing technique</span>' +
      '<span><span class="dot" style="background:#FF7675"></span> Grammar issue</span>' +
      '<span style="color:var(--text3);font-size:11px;">\ud83d\udc46 Click highlighted text for details</span>' +
    '</div>' +
    '<button class="read-all-btn" onclick="readAllParagraphs()">\ud83d\udd0a Read All</button>' +
    '<div class="reader-container">' +
      '<div class="reader-title">' + essay.title + '</div>' +
      '<div class="reader-meta">' + essay.titleZh + ' \u00b7 ' + essay.source + ' \u00b7 ' + essay.highlights.length + ' annotations</div>' +
      '<div class="reader-text">' + pHtml + '</div>' +
    '</div>';
}

function switchEssay(idx) {
  playClick();
  stopSpeaking();
  currentEssayIdx = idx;
  renderReader();
}

function readParagraph(el) {
  stopSpeaking();
  var paras = document.querySelectorAll('.reader-text p');
  for (var i = 0; i < paras.length; i++) paras[i].classList.remove('reading');
  el.classList.add('reading');
  var plainText = el.textContent || el.innerText;
  var u = speak(plainText);
  if (u) {
    u.onend = function() {
      el.classList.remove('reading');
    };
  }
}

function readAllParagraphs() {
  stopSpeaking();
  var paras = document.querySelectorAll('.reader-text p');
  var idx = 0;
  function readNext() {
    if (idx >= paras.length) return;
    for (var i = 0; i < paras.length; i++) paras[i].classList.remove('reading');
    paras[idx].classList.add('reading');
    paras[idx].scrollIntoView({behavior: 'smooth', block: 'center'});
    var plainText = paras[idx].textContent || paras[idx].innerText;
    var u = speak(plainText);
    if (u) {
      u.onend = function() {
        if (idx < paras.length) paras[idx].classList.remove('reading');
        idx++;
        readNext();
      };
    } else {
      idx++;
      readNext();
    }
  }
  readNext();
}

function showTooltip(event, essayIdx, hlIdx) {
  event.stopPropagation();
  var hl = ESSAYS[essayIdx].highlights[hlIdx];
  var popup = document.getElementById('tooltipPopup');
  var body = document.getElementById('tooltipBody');

  var typeLabel = hl.type === 'grammar' ? '\u26a0\ufe0f Grammar Note' : hl.type === 'vocab' ? '\ud83d\udcd7 Vocabulary' : '\u2728 Writing Technique';
  body.innerHTML = '<div class="tp-title">' + typeLabel + '</div><div>' + hl.note + '</div>';

  popup.style.display = 'block';
  var rect = event.target.getBoundingClientRect();
  var top = rect.bottom + 8;
  var left = Math.min(rect.left, window.innerWidth - 320);
  if (top + 200 > window.innerHeight) top = rect.top - 160;
  if (left < 10) left = 10;
  popup.style.top = top + 'px';
  popup.style.left = left + 'px';
  playClick();
}

function closeTooltip() {
  document.getElementById('tooltipPopup').style.display = 'none';
}

document.addEventListener('click', function(e) {
  if (!e.target.closest('.tooltip-popup') && !e.target.classList.contains('hl-vocab') && !e.target.classList.contains('hl-technique') && !e.target.classList.contains('hl-grammar')) {
    closeTooltip();
  }
});

    for (i = 0; i < TOOLBOX.showDontTell.length; i++) {
      item = TOOLBOX.showDontTell[i];
      contentHtml += '<div class="toolbox-card"><div class="tc-category">' + item.emotion + '</div>' +
        '<div style="display:flex;gap:8px;margin:8px 0;">' +
          '<div style="flex:1;padding:10px;background:var(--red-light);border-radius:10px;font-size:13px;">' +
            '<div style="font-size:10px;font-weight:800;color:var(--red);margin-bottom:4px;">\u274c TELL</div>' + item.tell +
          '</div>' +
          '<div style="flex:1;padding:10px;background:var(--green-light);border-radius:10px;font-size:13px;">' +
            '<div style="font-size:10px;font-weight:800;color:var(--green);margin-bottom:4px;">\u2705 SHOW</div>' + item.show + makeTTSBtn(item.show) +
          '</div>' +
        '</div>' +
        '<div class="tc-tip">\ud83d\udcd6 Source: ' + item.source + '</div></div>';
    }
  } else if (currentToolboxTab === 'phrases') {
    for (i = 0; i < TOOLBOX.goldenPhrases.length; i++) {
      var cat = TOOLBOX.goldenPhrases[i];
      var phrasesHtml = '';
      for (var j = 0; j < cat.phrases.length; j++) {
        phrasesHtml += '<div class="tc-example" style="margin:6px 0;padding:8px 14px;">' + cat.phrases[j] + makeTTSBtn(cat.phrases[j]) + '</div>';
      }
      contentHtml += '<div class="toolbox-card"><div class="tc-category">' + cat.category + '</div>' + phrasesHtml + '</div>';
    }
  } else if (currentToolboxTab === 'transitions') {
    for (i = 0; i < TOOLBOX.transitions.length; i++) {
      var tc = TOOLBOX.transitions[i];
      var tpHtml = '';
      for (var j = 0; j < tc.phrases.length; j++) {
        tpHtml += '<div class="tc-example" style="margin:6px 0;padding:8px 14px;">' + tc.phrases[j] + '</div>';
      }
      contentHtml += '<div class="toolbox-card"><div class="tc-category">' + tc.category + '</div>' + tpHtml + '</div>';
    }
  } else if (currentToolboxTab === 'dialogue') {
    for (i = 0; i < TOOLBOX.dialogueEnhancers.length; i++) {
      item = TOOLBOX.dialogueEnhancers[i];
      contentHtml += '<div class="toolbox-card"><div class="tc-category">' + item.name + '</div>' +
        '<div class="tc-example">' + item.example + makeTTSBtn(item.example) + '</div>' +
        '<div class="tc-tip">\ud83d\udca1 ' + item.tip + '</div></div>';
    }
  } else if (currentToolboxTab === 'settings') {
    for (i = 0; i < TOOLBOX.settingDescriptions.length; i++) {
      var loc = TOOLBOX.settingDescriptions[i];
      var locHtml = '';
      for (var j = 0; j < loc.examples.length; j++) {
        locHtml += '<div class="tc-example" style="margin:6px 0;padding:8px 14px;">' + loc.examples[j] + makeTTSBtn(loc.examples[j]) + '</div>';
      }
      contentHtml += '<div class="toolbox-card"><div class="tc-category">' + loc.location + '</div>' + locHtml + '</div>';
    }
  } else if (currentToolboxTab === 'reactions') {
    for (i = 0; i < TOOLBOX.characterReactions.length; i++) {
      var cr = TOOLBOX.characterReactions[i];
      var crHtml = '';
      for (var j = 0; j < cr.reactions.length; j++) {
        crHtml += '<div class="tc-example" style="margin:6px 0;padding:8px 14px;">' + cr.reactions[j] + '</div>';
      }
      contentHtml += '<div class="toolbox-card"><div class="tc-category">' + cr.emotion + '</div>' + crHtml +
        '<div class="tc-tip">\ud83d\udca1 Use these physical reactions instead of telling the reader the emotion. See "Show Don\'t Tell" tab for full examples.</div></div>';
    }
  }

  var tabsHtml = '';
  for (i = 0; i < tabs.length; i++) {
    tabsHtml += '<button class="toolbox-tab ' + (currentToolboxTab === tabs[i].id ? 'active' : '') + '" onclick="switchToolboxTab(\'' + tabs[i].id + '\')">' + tabs[i].label + '</button>';
  }

  document.getElementById('toolboxScreen').innerHTML =
    '<div class="back-row"><button class="back-btn" onclick="goHome()">\u2190 Back</button></div>' +
    '<h2 style="font-size:22px;font-weight:900;margin-bottom:12px;">\u2728 Writing Toolbox</h2>' +
    '<div class="toolbox-tabs">' + tabsHtml + '</div>' +
    contentHtml;
}

function switchToolboxTab(tab) {
  playClick();
  currentToolboxTab = tab;
  renderToolbox();
}

// =============================================
// STORY SPINNER
// =============================================
function openSpinner() {
  playClick();
  spinnerState = {step: 1, selectedTopic: null, skeleton: {}, essayText: '', rubricChecked: []};
  renderSpinnerStep();
  showScreen('spinnerScreen');
}

function renderSpinnerStep() {
  var html = '<div class="back-row"><button class="back-btn" onclick="goHome()">\u2190 Back</button></div>' +
    '<h2 style="font-size:22px;font-weight:900;margin-bottom:12px;">\ud83c\udfb0 PSLE Story Spinner</h2>';

  if (spinnerState.step === 1) {
    html += renderSpinStep1();
  } else if (spinnerState.step === 2) {
    html += renderSpinStep2();
  } else if (spinnerState.step === 3) {
    html += renderSpinStep3();
  } else if (spinnerState.step === 4) {
    html += renderSpinStep4();
  } else if (spinnerState.step === 5) {
    html += renderSpinStep5();
  }

  document.getElementById('spinnerScreen').innerHTML = html;
}

function renderSpinStep1() {
  var segAngle = 360 / SPINNER_TOPICS.length;
  var gradParts = [];
  for (var i = 0; i < SPINNER_TOPICS.length; i++) {
    var start = i * segAngle;
    var end = (i + 1) * segAngle;
    gradParts.push(SPINNER_TOPICS[i].color + ' ' + start + 'deg ' + end + 'deg');
  }
  var gradient = 'conic-gradient(' + gradParts.join(', ') + ')';

  var labelsHtml = '';
  for (var i = 0; i < SPINNER_TOPICS.length; i++) {
    var angle = i * segAngle + segAngle / 2 - 90;
    var lbl = SPINNER_TOPICS[i].cat === 'Prelim' ? 'P' : ("'" + String(SPINNER_TOPICS[i].year).slice(-2));
    labelsHtml += '<div style="position:absolute;top:50%;left:50%;transform:rotate(' + angle + 'deg) translateX(70px);transform-origin:0 0;font-size:8px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,0.7);white-space:nowrap;">' + lbl + '</div>';
  }

  return '<div class="spinner-container">' +
    '<div class="wheel-wrapper">' +
      '<div class="wheel-pointer">\u25bc</div>' +
      '<div class="wheel" id="spinWheel" style="background:' + gradient + ';">' + labelsHtml + '</div>' +
    '</div>' +
    '<button class="spin-btn" id="spinBtn" onclick="spinWheel()">SPIN!</button>' +
    '<div style="margin-top:16px;text-align:center;">' +
      '<p style="color:var(--text2);font-size:13px;">8 PSLE topics (2018\u20132025) + 8 Prelim topics</p>' +
    '</div>' +
  '</div>';
}

var wheelRotation = 0;
function spinWheel() {
  var btn = document.getElementById('spinBtn');
  if (btn.disabled) return;
  btn.disabled = true;
  ensureAudio();
  playSpinSound();

  var idx = Math.floor(Math.random() * SPINNER_TOPICS.length);
  var segAngle = 360 / SPINNER_TOPICS.length;
  // Calculate rotation to land on the selected segment (pointer at top)
  var targetAngle = 360 - (idx * segAngle + segAngle / 2);
  var spins = 5 + Math.floor(Math.random() * 3);
  var totalRotation = spins * 360 + targetAngle;
  wheelRotation += totalRotation;

  var wheel = document.getElementById('spinWheel');
  wheel.style.transition = 'transform ' + (3 + Math.random() * 2) + 's cubic-bezier(0.17,0.67,0.12,0.99)';
  wheel.style.transform = 'rotate(' + wheelRotation + 'deg)';

  spinnerState.selectedTopic = SPINNER_TOPICS[idx].topic;
  spinnerState.selectedCat = SPINNER_TOPICS[idx].cat || 'PSLE';
  spinnerState.selectedYear = SPINNER_TOPICS[idx].year;

  setTimeout(function() {
    playLandSound();
    spawnConfetti(20);
    spinnerState.step = 2;
    renderSpinnerStep();
  }, 4000);
}

function renderSpinStep2() {
  var topic = spinnerState.selectedTopic;
  return '<div style="text-align:center;margin:20px 0;">' +
    '<div style="font-size:48px;margin-bottom:12px;">\ud83c\udfaf</div>' +
    '<h3 style="font-size:20px;font-weight:900;color:var(--green);">Your Topic:</h3>' +
    '<div style="font-size:24px;font-weight:900;margin:8px 0;color:var(--text);">"' + topic + '"</div>' +
    '<div style="font-size:12px;color:var(--text2);margin-top:4px;">' + (spinnerState.selectedCat === 'Prelim' ? '\ud83c\udfeb Prelim Topic' : '\ud83c\udfa8 PSLE ' + spinnerState.selectedYear) + '</div>' +
  '</div>' +
  '<div style="background:var(--card);border-radius:16px;padding:24px;border:2px solid var(--border);">' +
    '<h3 style="font-size:16px;font-weight:800;margin-bottom:16px;">\ud83d\uddd3 Build Your Story Skeleton</h3>' +
    '<div class="skeleton-field"><label>\ud83d\udccd Setting: Where and when does your story take place?</label><input type="text" id="sk-setting" placeholder="e.g. At school, on a rainy Monday morning"></div>' +
    '<div class="skeleton-field"><label>\ud83d\udc64 Characters: Who is in your story?</label><input type="text" id="sk-chars" placeholder="e.g. Me, my best friend Wei Jie, Mrs Lim"></div>' +
    '<div class="skeleton-field"><label>\ud83c\udfac Opening Hook: How will your story begin? (1 sentence)</label><input type="text" id="sk-opening" placeholder="e.g. CRASH! The sound echoed through the hall..."></div>' +
    '<div class="skeleton-field"><label>\u2b06\ufe0f Rising Action: What happens that leads to the main event?</label><input type="text" id="sk-rising" placeholder="e.g. I discovered that my project partner had not done his part"></div>' +
    '<div class="skeleton-field"><label>\ud83d\udca5 Climax: What is the most exciting/dramatic moment?</label><input type="text" id="sk-climax" placeholder="e.g. I confronted him and we had a heated argument"></div>' +
    '<div class="skeleton-field"><label>\u2b07\ufe0f Resolution: How does the problem get resolved?</label><input type="text" id="sk-resolution" placeholder="e.g. We talked it out and decided to share the work"></div>' +
    '<div class="skeleton-field"><label>\ud83d\udca1 Lesson/Ending: What did the character learn?</label><input type="text" id="sk-lesson" placeholder="e.g. I learnt that communication is key to teamwork"></div>' +
    '<div class="tip-box"><strong>\ud83d\udca1 PSLE Tip:</strong> Your composition should be 150\u2013300 words. Focus on ONE main event. Use dialogue and show-don\'t-tell!</div>' +
  '</div>' +
  '<div style="text-align:center;margin-top:16px;">' +
    '<button class="step-btn step-btn-primary" onclick="goToSpinStep3()">Start Writing \u2192</button>' +
  '</div>';
}

function goToSpinStep3() {
  playClick();
  spinnerState.skeleton = {
    setting: (document.getElementById('sk-setting') || {}).value || '',
    chars: (document.getElementById('sk-chars') || {}).value || '',
    opening: (document.getElementById('sk-opening') || {}).value || '',
    rising: (document.getElementById('sk-rising') || {}).value || '',
    climax: (document.getElementById('sk-climax') || {}).value || '',
    resolution: (document.getElementById('sk-resolution') || {}).value || '',
    lesson: (document.getElementById('sk-lesson') || {}).value || ''
  };
  spinnerState.step = 3;
  renderSpinnerStep();
}

function renderSpinStep3() {
  return '<div style="background:var(--card);border-radius:16px;padding:24px;border:2px solid var(--border);">' +
    '<h3 style="font-size:16px;font-weight:800;margin-bottom:4px;">\u270d\ufe0f Write Your Essay</h3>' +
    '<p style="color:var(--text2);font-size:13px;margin-bottom:12px;">Topic: "' + spinnerState.selectedTopic + '"</p>' +
    '<textarea id="spinEssayArea" style="width:100%;min-height:300px;padding:16px;border:2px solid var(--border);border-radius:14px;font-family:Nunito;font-size:14px;line-height:2;resize:vertical;" placeholder="Write your composition here..." oninput="updateWordCount()">' + spinnerState.essayText + '</textarea>' +
    '<div id="wordCountDisplay" class="word-counter wc-red">0 words</div>' +
  '</div>' +
  '<div style="text-align:center;margin-top:16px;">' +
    '<button class="step-btn step-btn-secondary" onclick="goBackToStep2()">\u2190 Back to Plan</button> ' +
    '<button class="step-btn step-btn-primary" onclick="goToSpinStep4()">\u2705 I\'m Done!</button>' +
  '</div>';
}

function updateWordCount() {
  var area = document.getElementById('spinEssayArea');
  if (!area) return;
  var text = area.value.trim();
  var words = text.length === 0 ? 0 : text.split(/\s+/).length;
  var el = document.getElementById('wordCountDisplay');
  if (!el) return;
  var cls = 'word-counter ';
  if (words < 100) cls += 'wc-red';
  else if (words < 150) cls += 'wc-yellow';
  else if (words <= 300) cls += 'wc-green';
  else cls += 'wc-orange';
  el.className = cls;
  el.textContent = words + ' words';
}

function goBackToStep2() {
  playClick();
  var area = document.getElementById('spinEssayArea');
  if (area) spinnerState.essayText = area.value;
  spinnerState.step = 2;
  renderSpinnerStep();
  // Restore skeleton values
  setTimeout(function() {
    var fields = ['setting', 'chars', 'opening', 'rising', 'climax', 'resolution', 'lesson'];
    for (var i = 0; i < fields.length; i++) {
      var el = document.getElementById('sk-' + fields[i]);
      if (el && spinnerState.skeleton[fields[i]]) el.value = spinnerState.skeleton[fields[i]];
    }
  }, 50);
}

function goToSpinStep4() {
  playClick();
  var area = document.getElementById('spinEssayArea');
  if (area) spinnerState.essayText = area.value;
  spinnerState.step = 4;
  spinnerState.rubricChecked = [];
  renderSpinnerStep();
}

function renderSpinStep4() {
  var contentItems = [
    'My story is relevant to the topic (3 marks)',
    'I have a clear beginning, middle, and end (3 marks)',
    'I included interesting details and descriptions (3 marks)',
    'I used dialogue to bring characters to life (3 marks)',
    'I showed emotions using "show don\'t tell" (3 marks)',
    'My ending includes a lesson or reflection (3 marks)'
  ];
  var langItems = [
    'I used a variety of sentence structures (3 marks)',
    'My grammar and spelling are correct (3 marks)',
    'I used good vocabulary (not just "happy/sad/good") (3 marks)',
    'My paragraphs are well-organised (3 marks)',
    'I used appropriate linking words/transitions (3 marks)',
    'My punctuation is correct (commas, full stops, speech marks) (3 marks)'
  ];

  var allItems = contentItems.concat(langItems);
  var html = '<div style="background:var(--card);border-radius:16px;padding:24px;border:2px solid var(--border);">' +
    '<h3 style="font-size:16px;font-weight:800;margin-bottom:4px;">\ud83d\udccb PSLE Continuous Writing Rubric (36 marks)</h3>' +
    '<p style="color:var(--text2);font-size:13px;margin-bottom:16px;">Check each item honestly to see your estimated band.</p>' +
    '<div class="rubric-section"><h4>\ud83d\udcd6 Content (18 marks)</h4>';

  for (var i = 0; i < contentItems.length; i++) {
    var checked = spinnerState.rubricChecked.indexOf(i) >= 0;
    html += '<div class="rubric-item ' + (checked ? 'checked' : '') + '" onclick="toggleRubric(' + i + ')">' +
      '<div class="rubric-check">' + (checked ? '\u2713' : '') + '</div>' +
      '<div class="rubric-label">' + contentItems[i] + '</div></div>';
  }

  html += '</div><div class="rubric-section"><h4>\ud83d\udcdd Language & Organisation (18 marks)</h4>';

  for (var i = 0; i < langItems.length; i++) {
    var idx = contentItems.length + i;
    var checked = spinnerState.rubricChecked.indexOf(idx) >= 0;
    html += '<div class="rubric-item ' + (checked ? 'checked' : '') + '" onclick="toggleRubric(' + idx + ')">' +
      '<div class="rubric-check">' + (checked ? '\u2713' : '') + '</div>' +
      '<div class="rubric-label">' + langItems[i] + '</div></div>';
  }

  html += '</div>';

  var score = spinnerState.rubricChecked.length * 3;
  var grade, gradeIcon;
  if (score >= 30) { grade = 'Band 1 (Excellent!)'; gradeIcon = '\u2b50'; }
  else if (score >= 24) { grade = 'Band 2 (Very Good)'; gradeIcon = '\ud83c\udf1f'; }
  else if (score >= 18) { grade = 'Band 3 (Good Effort)'; gradeIcon = '\ud83d\udcaa'; }
  else { grade = 'Keep Practising!'; gradeIcon = '\ud83d\udcda'; }

  html += '<div class="rubric-score">' +
    '<div class="rs-num" style="color:' + (score >= 30 ? 'var(--green)' : score >= 24 ? 'var(--blue)' : score >= 18 ? 'var(--orange)' : 'var(--red)') + '">' + score + '/36</div>' +
    '<div class="rs-grade">' + gradeIcon + ' ' + grade + '</div>' +
  '</div></div>' +
  '<div style="text-align:center;margin-top:16px;">' +
    '<button class="step-btn step-btn-secondary" onclick="backToStep3()">\u2190 Edit Essay</button> ' +
    '<button class="step-btn step-btn-primary" onclick="goToSpinStep5()">\ud83d\udcd6 View Model Essay</button>' +
  '</div>';

  return html;
}

function toggleRubric(idx) {
  playClick();
  var pos = spinnerState.rubricChecked.indexOf(idx);
  if (pos >= 0) spinnerState.rubricChecked.splice(pos, 1);
  else spinnerState.rubricChecked.push(idx);
  renderSpinnerStep();
}

function backToStep3() {
  playClick();
  spinnerState.step = 3;
  renderSpinnerStep();
  setTimeout(function() { updateWordCount(); }, 50);
}

function goToSpinStep5() {
  playClick();
  spinnerState.step = 5;
  renderSpinnerStep();
}

function renderSpinStep5() {
  var topic = spinnerState.selectedTopic;
  var essay = MODEL_ESSAYS[topic];
  if (!essay) {
    return '<p style="color:var(--text2);">Model essay not available for this topic.</p>' +
      '<div style="text-align:center;margin-top:16px;"><button class="step-btn step-btn-primary" onclick="openSpinner()">\ud83c\udfb0 Spin Again</button></div>';
  }

  // Process comment tags
  var text = essay.text;
  text = text.replace(/<me-comment>/g, '<div class="me-comment">\ud83d\udcac ');
  text = text.replace(/<\/me-comment>/g, '</div>');

  return '<div class="model-essay">' +
    '<div class="me-title">\ud83d\udcda Model Essay: "' + topic + '"</div>' +
    '<div class="hl-legend" style="margin-bottom:12px;">' +
      '<span><span class="dot" style="background:#F8B500"></span> Good vocabulary</span>' +
      '<span><span class="dot" style="background:#74B9FF"></span> Writing technique</span>' +
    '</div>' +
    '<div class="me-text">' + text + '</div>' +
    '<p style="color:var(--text3);font-size:12px;margin-top:12px;">\u2248' + essay.wordCount + ' words</p>' +
  '</div>' +
  '<div style="text-align:center;margin-top:16px;">' +
    '<button class="step-btn step-btn-secondary" onclick="spinnerState.step=4;renderSpinnerStep()">\u2190 Back to Rubric</button> ' +
    '<button class="step-btn step-btn-primary" onclick="openSpinner()">\ud83c\udfb0 Spin Again</button> ' +
    '<button class="step-btn step-btn-secondary" onclick="goHome()">\ud83c\udfe0 Home</button>' +
  '</div>';
}

// =============================================
// OUTLINE BUILDER
// =============================================
var obState = {
  step: 1,
  topic: '',
  customTopic: '',
  templateId: null,
  sectionIdx: 0,
  notes: {},
  essayText: '',
  savedOutlines: []
};

function loadSavedOutlines() {
  try {
    var saved = localStorage.getItem('ob_outlines');
    if (saved) obState.savedOutlines = JSON.parse(saved);
  } catch(e) {}
}
function saveOutlineToStorage() {
  try {
    var outline = {
      id: Date.now(),
      topic: obState.topic || obState.customTopic,
      templateId: obState.templateId,
      notes: JSON.parse(JSON.stringify(obState.notes)),
      essayText: obState.essayText,
      date: new Date().toLocaleDateString()
    };
    obState.savedOutlines.push(outline);
    localStorage.setItem('ob_outlines', JSON.stringify(obState.savedOutlines));
  } catch(e) {}
}
function loadOutline(idx) {
  var o = obState.savedOutlines[idx];
  if (!o) return;
  obState.topic = o.topic;
  obState.customTopic = '';
  obState.templateId = o.templateId;
  obState.notes = JSON.parse(JSON.stringify(o.notes));
  obState.essayText = o.essayText || '';
  obState.step = 4;
  obState.sectionIdx = 0;
  renderOutlineBuilder();
}
function deleteOutline(idx) {
  obState.savedOutlines.splice(idx, 1);
  try { localStorage.setItem('ob_outlines', JSON.stringify(obState.savedOutlines)); } catch(e) {}
  renderOutlineBuilder();
}

function openOutlineBuilder() {
  playClick();
  loadSavedOutlines();
  obState.step = 1;
  obState.topic = '';
  obState.customTopic = '';
  obState.templateId = null;
  obState.sectionIdx = 0;
  obState.notes = {};
  obState.essayText = '';
  renderOutlineBuilder();
  showScreen('outlineScreen');
}

function renderOutlineBuilder() {
  var html = '<div class="back-row"><button class="back-btn" onclick="goHome()">\u2190 Back</button></div>' +
    '<h2 style="font-size:22px;font-weight:900;margin-bottom:4px;">\ud83c\udfd7\ufe0f Outline Builder</h2>' +
    '<p style="color:var(--text2);font-size:13px;margin-bottom:16px;">Plan your essay step by step before writing</p>';

  if (obState.step === 1) html += renderOBStep1();
  else if (obState.step === 2) html += renderOBStep2();
  else if (obState.step === 3) html += renderOBStep3();
  else if (obState.step === 4) html += renderOBStep4();
  else if (obState.step === 5) html += renderOBStep5();

  document.getElementById('outlineScreen').innerHTML = html;
}

function renderOBStep1() {
  var html = '<h3 style="font-size:16px;font-weight:800;margin-bottom:12px;">Step 1: Choose a Topic</h3>';

  // Saved outlines
  if (obState.savedOutlines.length > 0) {
    html += '<div style="margin-bottom:16px;"><h4 style="font-size:14px;font-weight:800;color:var(--green);margin-bottom:8px;">\ud83d\udcc2 Saved Outlines</h4>';
    for (var s = 0; s < obState.savedOutlines.length; s++) {
      var so = obState.savedOutlines[s];
      html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">' +
        '<button class="ob-topic-btn" style="flex:1;" onclick="loadOutline(' + s + ')">' + so.topic + '<span class="ob-year">' + so.date + '</span></button>' +
        '<button onclick="deleteOutline(' + s + ')" style="background:none;border:none;cursor:pointer;font-size:16px;color:var(--red);" title="Delete">\u2717</button>' +
      '</div>';
    }
    html += '</div>';
  }

  // PSLE topics
  html += '<h4 style="font-size:13px;font-weight:800;color:var(--blue);margin-bottom:8px;">PSLE Past Year Topics</h4>' +
    '<div class="ob-topic-grid">';
  for (var i = 0; i < OUTLINE_TOPICS.length; i++) {
    var t = OUTLINE_TOPICS[i];
    if (t.cat !== 'PSLE') continue;
    var sel = obState.topic === t.topic ? ' selected' : '';
    html += '<button class="ob-topic-btn' + sel + '" onclick="obSelectTopic(\'' + t.topic.replace(/'/g, "\\'") + '\')">' + t.topic + '<span class="ob-year">PSLE ' + t.year + '</span></button>';
  }
  html += '</div>';

  html += '<h4 style="font-size:13px;font-weight:800;color:var(--purple);margin:12px 0 8px;">Common Practice Topics</h4>' +
    '<div class="ob-topic-grid">';
  for (var i = 0; i < OUTLINE_TOPICS.length; i++) {
    var t = OUTLINE_TOPICS[i];
    if (t.cat !== 'Common') continue;
    var sel = obState.topic === t.topic ? ' selected' : '';
    html += '<button class="ob-topic-btn' + sel + '" onclick="obSelectTopic(\'' + t.topic.replace(/'/g, "\\'") + '\')">' + t.topic + '</button>';
  }
  html += '</div>';

  html += '<h4 style="font-size:13px;font-weight:800;color:var(--orange);margin:12px 0 8px;">Or Type Your Own Topic</h4>' +
    '<div class="skeleton-field"><input type="text" id="ob-custom-topic" placeholder="e.g. A Narrow Escape" value="' + (obState.customTopic || '').replace(/"/g, '&quot;') + '" oninput="obState.customTopic=this.value;obState.topic=\'\'"></div>';

  html += '<div style="text-align:center;margin-top:16px;">' +
    '<button class="step-btn step-btn-primary" onclick="obGoStep2()">Choose Template \u2192</button></div>';
  return html;
}

function obSelectTopic(topic) {
  playClick();
  obState.topic = topic;
  obState.customTopic = '';
  renderOutlineBuilder();
}

function obGoStep2() {
  playClick();
  var cust = document.getElementById('ob-custom-topic');
  if (cust && cust.value.trim()) obState.customTopic = cust.value.trim();
  if (!obState.topic && !obState.customTopic) { alert('Please choose or type a topic first.'); return; }
  obState.step = 2;
  renderOutlineBuilder();
}

function renderOBStep2() {
  var topicName = obState.topic || obState.customTopic;
  var html = '<p style="font-size:14px;margin-bottom:12px;">Topic: <strong>"' + topicName + '"</strong></p>' +
    '<h3 style="font-size:16px;font-weight:800;margin-bottom:12px;">Step 2: Choose a Story Template</h3>';

  for (var i = 0; i < OUTLINE_TEMPLATES.length; i++) {
    var t = OUTLINE_TEMPLATES[i];
    var sel = obState.templateId === t.id ? ' selected' : '';
    html += '<div class="ob-template-card' + sel + '" onclick="obSelectTemplate(\'' + t.id + '\')">' +
      '<h4>' + t.name + '</h4>' +
      '<p>' + t.desc + '</p></div>';
  }

  html += '<div class="ob-nav">' +
    '<button class="step-btn step-btn-secondary" onclick="obState.step=1;renderOutlineBuilder()">\u2190 Back</button>' +
    '<button class="step-btn step-btn-primary" onclick="obGoStep3()">Start Planning \u2192</button></div>';
  return html;
}

function obSelectTemplate(id) {
  playClick();
  obState.templateId = id;
  renderOutlineBuilder();
}

function obGoStep3() {
  playClick();
  if (!obState.templateId) { alert('Please choose a template first.'); return; }
  obState.step = 3;
  obState.sectionIdx = 0;
  renderOutlineBuilder();
}

function getOBTemplate() {
  for (var i = 0; i < OUTLINE_TEMPLATES.length; i++) {
    if (OUTLINE_TEMPLATES[i].id === obState.templateId) return OUTLINE_TEMPLATES[i];
  }
  return null;
}

function renderOBStep3() {
  var tmpl = getOBTemplate();
  if (!tmpl) return '<p>Template not found.</p>';
  var sec = tmpl.sections[obState.sectionIdx];
  var topicName = obState.topic || obState.customTopic;
  var totalSections = tmpl.sections.length;

  // Save any text in current textarea before re-render
  var html = '<p style="font-size:14px;margin-bottom:4px;">Topic: <strong>"' + topicName + '"</strong> \u00b7 ' + tmpl.name + '</p>';

  // Progress dots
  html += '<div class="ob-progress">';
  for (var d = 0; d < totalSections; d++) {
    var dotCls = d < obState.sectionIdx ? 'done' : d === obState.sectionIdx ? 'active' : '';
    html += '<div class="ob-progress-dot ' + dotCls + '"></div>';
  }
  html += '</div>';

  html += '<h3 style="font-size:16px;font-weight:800;margin-bottom:8px;">Step 3: ' + sec.title + ' (' + (obState.sectionIdx + 1) + '/' + totalSections + ')</h3>';

  html += '<div class="ob-section-card">' +
    '<h4>' + sec.title + '</h4>' +
    '<div class="ob-prompt">' + sec.prompt + '</div>';

  // Tips
  html += '<div class="ob-tips"><strong>\ud83d\udca1 Tips:</strong><ul style="margin:4px 0 0 16px;">';
  for (var t = 0; t < sec.tips.length; t++) {
    html += '<li>' + sec.tips[t] + '</li>';
  }
  html += '</ul></div>';

  // Examples
  html += '<div class="ob-examples"><div style="font-size:12px;font-weight:800;color:var(--blue);margin-bottom:6px;">EXAMPLES FROM MODEL ESSAYS:</div>';
  for (var e = 0; e < sec.examples.length; e++) {
    html += '<div class="ob-example-item">' + sec.examples[e] + '</div>';
  }
  html += '</div>';

  // Textarea
  var savedNote = obState.notes[obState.templateId + '_' + obState.sectionIdx] || '';
  html += '<label style="font-size:13px;font-weight:700;display:block;margin-top:10px;">Your plan for this section (bullet points or notes):</label>' +
    '<textarea id="ob-section-note" placeholder="Write your ideas here...">' + savedNote.replace(/</g, '&lt;') + '</textarea>';

  html += '</div>';

  html += '<div class="ob-nav">';
  if (obState.sectionIdx > 0) {
    html += '<button class="step-btn step-btn-secondary" onclick="obPrevSection()">\u2190 Previous</button>';
  } else {
    html += '<button class="step-btn step-btn-secondary" onclick="obState.step=2;renderOutlineBuilder()">\u2190 Templates</button>';
  }
  if (obState.sectionIdx < totalSections - 1) {
    html += '<button class="step-btn step-btn-primary" onclick="obNextSection()">Next \u2192</button>';
  } else {
    html += '<button class="step-btn step-btn-primary" onclick="obGoStep4()">Review Outline \u2192</button>';
  }
  html += '</div>';
  return html;
}

function obSaveCurrentNote() {
  var area = document.getElementById('ob-section-note');
  if (area) obState.notes[obState.templateId + '_' + obState.sectionIdx] = area.value;
}

function obNextSection() {
  playClick();
  obSaveCurrentNote();
  obState.sectionIdx++;
  renderOutlineBuilder();
}

function obPrevSection() {
  playClick();
  obSaveCurrentNote();
  obState.sectionIdx--;
  renderOutlineBuilder();
}

function obGoStep4() {
  playClick();
  obSaveCurrentNote();
  obState.step = 4;
  renderOutlineBuilder();
}

function renderOBStep4() {
  var tmpl = getOBTemplate();
  if (!tmpl) return '<p>Template not found.</p>';
  var topicName = obState.topic || obState.customTopic;

  var html = '<h3 style="font-size:16px;font-weight:800;margin-bottom:12px;">Step 4: Review Your Outline</h3>' +
    '<p style="font-size:14px;margin-bottom:12px;">Topic: <strong>"' + topicName + '"</strong> \u00b7 ' + tmpl.name + '</p>';

  html += '<div style="background:var(--card);border-radius:16px;padding:20px;border:2px solid var(--border);">';
  for (var i = 0; i < tmpl.sections.length; i++) {
    var note = obState.notes[obState.templateId + '_' + i] || '(not filled in yet)';
    html += '<div class="ob-review-section">' +
      '<h5>' + (i + 1) + '. ' + tmpl.sections[i].title + '</h5>' +
      '<p>' + note.replace(/</g, '&lt;') + '</p>' +
      '<button style="font-size:11px;color:var(--blue);background:none;border:none;cursor:pointer;font-weight:700;margin-top:4px;" onclick="obEditSection(' + i + ')">\u270f\ufe0f Edit</button>' +
    '</div>';
  }
  html += '</div>';

  html += '<div style="text-align:center;margin-top:16px;">' +
    '<button class="step-btn step-btn-secondary" onclick="obState.step=3;obState.sectionIdx=' + (tmpl.sections.length - 1) + ';renderOutlineBuilder()">\u2190 Back</button> ' +
    '<button class="step-btn step-btn-secondary" onclick="saveOutlineToStorage();alert(\'Outline saved!\')">\ud83d\udcbe Save</button> ' +
    '<button class="step-btn step-btn-primary" onclick="obGoStep5()">Write Full Essay \u2192</button></div>';
  return html;
}

function obEditSection(idx) {
  playClick();
  obState.sectionIdx = idx;
  obState.step = 3;
  renderOutlineBuilder();
}

function obGoStep5() {
  playClick();
  obState.step = 5;
  renderOutlineBuilder();
}

function renderOBStep5() {
  var tmpl = getOBTemplate();
  if (!tmpl) return '<p>Template not found.</p>';
  var topicName = obState.topic || obState.customTopic;

  // Outline reference
  var refHtml = '<div class="ob-outline-ref"><h4>Your Outline: "' + topicName + '"</h4>';
  for (var i = 0; i < tmpl.sections.length; i++) {
    var note = obState.notes[obState.templateId + '_' + i] || '';
    refHtml += '<div class="ob-ref-item"><strong>' + tmpl.sections[i].title + ':</strong> ' + (note || '(empty)').replace(/</g, '&lt;') + '</div>';
  }
  refHtml += '</div>';

  var html = '<h3 style="font-size:16px;font-weight:800;margin-bottom:12px;">Step 5: Write Your Full Essay</h3>' +
    '<p style="font-size:14px;margin-bottom:12px;">Topic: <strong>"' + topicName + '"</strong></p>';

  html += '<div class="ob-write-layout">' + refHtml +
    '<div style="background:var(--card);border-radius:16px;padding:20px;border:2px solid var(--border);">' +
      '<textarea id="ob-essay-area" style="width:100%;min-height:350px;padding:16px;border:2px solid var(--border);border-radius:14px;font-family:Nunito;font-size:14px;line-height:2;resize:vertical;" placeholder="Write your full essay here. Use your outline as a guide..." oninput="obUpdateWC()">' + (obState.essayText || '').replace(/</g, '&lt;') + '</textarea>' +
      '<div id="ob-wc" class="word-counter wc-red">0 words</div>' +
      '<div style="font-size:11px;color:var(--text3);margin-top:4px;">Target: 200\u2013300 words for PSLE</div>' +
    '</div>' +
  '</div>';

  html += '<div style="text-align:center;margin-top:16px;">' +
    '<button class="step-btn step-btn-secondary" onclick="obSaveEssay();obState.step=4;renderOutlineBuilder()">\u2190 Back to Outline</button> ' +
    '<button class="step-btn step-btn-secondary" onclick="obSaveEssay();saveOutlineToStorage();alert(\'Saved!\')">\ud83d\udcbe Save All</button> ' +
    '<button class="step-btn step-btn-primary" onclick="obSaveEssay();saveOutlineToStorage();alert(\'Saved! Great job!\');goHome()">\u2705 Finish</button></div>';

  // Trigger word count after render
  setTimeout(function() { obUpdateWC(); }, 50);
  return html;
}

function obSaveEssay() {
  var area = document.getElementById('ob-essay-area');
  if (area) obState.essayText = area.value;
}

function obUpdateWC() {
  var area = document.getElementById('ob-essay-area');
  if (!area) return;
  var text = area.value.trim();
  var words = text.length === 0 ? 0 : text.split(/\s+/).length;
  var el = document.getElementById('ob-wc');
  if (!el) return;
  var cls = 'word-counter ';
  if (words < 100) cls += 'wc-red';
  else if (words < 200) cls += 'wc-yellow';
  else if (words <= 300) cls += 'wc-green';
  else cls += 'wc-orange';
  el.className = cls;
  el.textContent = words + ' words';
}

// =============================================
// ESSAY LIBRARY
// =============================================
var libCurrentEssay = -1;

function openLibrary() {
  playClick();
  libCurrentEssay = -1;
  renderLibrary();
  showScreen('libraryScreen');
}

function renderLibrary() {
  var html = '<div class="back-row"><button class="back-btn" onclick="goHome()">\u2190 Back</button></div>' +
    '<h2 style="font-size:22px;font-weight:900;margin-bottom:4px;">\ud83d\udcda Essay Library</h2>' +
    '<p style="color:var(--text2);font-size:13px;margin-bottom:16px;">10 model essays with highlighted techniques and teacher comments</p>';

  if (libCurrentEssay < 0) {
    // List view
    for (var i = 0; i < LIBRARY_ESSAYS.length; i++) {
      var e = LIBRARY_ESSAYS[i];
      var stars = '';
      for (var s = 1; s <= 5; s++) {
        stars += '<span class="lib-star' + (s > e.difficulty ? ' dim' : '') + '">\u2605</span>';
      }
      var tags = '';
      for (var t = 0; t < e.techniques.length; t++) {
        tags += '<span class="lib-tag">' + e.techniques[t] + '</span>';
      }
      html += '<div class="lib-card" onclick="openLibEssay(' + i + ')">' +
        '<h4>' + e.title + '</h4>' +
        '<div class="lib-meta">' + e.topic + ' \u00b7 ' + e.wordCount + ' words <span class="lib-difficulty">' + stars + '</span></div>' +
        '<div class="lib-tags">' + tags + '</div>' +
      '</div>';
    }
  } else {
    // Detail view
    var e = LIBRARY_ESSAYS[libCurrentEssay];
    var stars = '';
    for (var s = 1; s <= 5; s++) {
      stars += '<span class="lib-star' + (s > e.difficulty ? ' dim' : '') + '">\u2605</span>';
    }
    var text = e.text;
    text = text.replace(/<me-comment>/g, '<div class="me-comment">\ud83d\udcac ');
    text = text.replace(/<\/me-comment>/g, '</div>');

    html += '<button class="back-btn" onclick="libCurrentEssay=-1;renderLibrary()" style="margin-bottom:12px;">\u2190 Back to Library</button>' +
      '<div class="model-essay">' +
        '<div class="me-title">' + e.title + '</div>' +
        '<div style="font-size:12px;color:var(--text2);margin-bottom:4px;">' + e.topic + ' \u00b7 ' + e.wordCount + ' words \u00b7 Difficulty: ' + stars + '</div>' +
        '<div class="hl-legend" style="margin-bottom:12px;">' +
          '<span><span class="dot" style="background:#F8B500"></span> Good vocabulary</span>' +
          '<span><span class="dot" style="background:#74B9FF"></span> Writing technique</span>' +
        '</div>' +
        '<div class="me-text" style="font-size:14px;line-height:2.2;">' + text + '</div>' +
      '</div>';

    // Navigation
    html += '<div style="display:flex;justify-content:space-between;margin-top:16px;">';
    if (libCurrentEssay > 0) {
      html += '<button class="step-btn step-btn-secondary" onclick="openLibEssay(' + (libCurrentEssay - 1) + ')">\u2190 Previous</button>';
    } else {
      html += '<div></div>';
    }
    if (libCurrentEssay < LIBRARY_ESSAYS.length - 1) {
      html += '<button class="step-btn step-btn-primary" onclick="openLibEssay(' + (libCurrentEssay + 1) + ')">Next \u2192</button>';
    }
    html += '</div>';
  }

  document.getElementById('libraryScreen').innerHTML = html;
}

function openLibEssay(idx) {
  playClick();
  libCurrentEssay = idx;
  renderLibrary();
}

// =============================================
// INIT
// =============================================
renderHome();
</script>
</body>
</html>
