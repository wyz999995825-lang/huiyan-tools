<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Johnson's Writing Lab v3</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#F7F3EB;--bg2:#EDE8DC;--card:#FFFFFF;--card2:#FBF9F4;
  --border:#E0D8C8;--border2:#D4C9B4;
  --text:#2D3436;--text2:#636E72;--text3:#95A0A5;
  --green:#00B894;--green-dark:#00A07D;--green-light:#E8F8F3;
  --blue:#0984E3;--blue-light:#E3F2FD;
  --red:#E17055;--red-light:#FDECEA;
  --orange:#F39C12;--orange-light:#FFF3E0;
  --purple:#6C5CE7;--purple-light:#F0EDFF;
  --gold:#F1C40F;--gold-light:#FFFDE7;
  --pink:#FD79A8;
  --shadow:0 2px 12px rgba(0,0,0,0.06);
  --shadow2:0 4px 20px rgba(0,0,0,0.1);
}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

.top-bar{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--bg);border-bottom:2px solid var(--border);display:none;}
.top-bar .close-btn{font-size:20px;color:var(--text2);cursor:pointer;background:none;border:none;}
.progress-bar{flex:1;height:14px;background:var(--bg2);border-radius:10px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--green),#7AC943);border-radius:10px;transition:width 0.5s ease;}
.hearts{display:flex;align-items:center;gap:4px;font-size:16px;font-weight:800;color:var(--red);}
.streak-display{display:flex;align-items:center;gap:4px;font-size:16px;font-weight:800;color:var(--orange);}

.main{max-width:680px;margin:0 auto;padding:20px 16px 100px;}

.screen{display:none;animation:fadeSlideIn 0.4s ease;}.screen.active{display:block;}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}

.home-hero{text-align:center;padding:30px 0 16px;}
.home-hero .mascot{font-size:64px;animation:bounce 2.5s infinite;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
.home-hero h1{font-size:26px;font-weight:900;margin:12px 0 6px;color:var(--text);}
.home-hero p{color:var(--text2);font-size:14px;}
.home-stats{display:flex;justify-content:center;gap:24px;margin:16px 0;}
.home-stat{text-align:center;}
.home-stat .hs-val{font-size:22px;font-weight:900;}
.home-stat .hs-label{font-size:11px;color:var(--text2);}

.module-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:20px;}
.module-card{display:flex;align-items:center;gap:16px;background:var(--card);border:2px solid var(--border);border-radius:16px;padding:18px 20px;cursor:pointer;transition:all 0.2s;box-shadow:var(--shadow);}
.module-card:hover{transform:translateY(-2px);box-shadow:var(--shadow2);border-color:var(--green);}
.module-card:active{transform:translateY(0);}
.module-icon{font-size:36px;flex-shrink:0;}
.module-info{flex:1;}
.module-info .mod-name{font-size:16px;font-weight:800;}
.module-info .mod-desc{font-size:12px;color:var(--text2);margin-top:2px;}
.module-badge{background:var(--green-light);color:var(--green);font-size:11px;font-weight:800;padding:4px 10px;border-radius:10px;white-space:nowrap;}

.skill-list{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
.skill-btn{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:all 0.15s;text-align:left;width:100%;font-family:'Nunito';font-size:14px;font-weight:700;color:var(--text);}
.skill-btn:hover{border-color:var(--green);background:var(--green-light);}
.skill-btn .sb-icon{font-size:24px;}
.skill-btn .sb-badge{margin-left:auto;font-size:11px;color:var(--text2);font-weight:800;}

.q-header{margin-bottom:20px;}
.q-header .q-type{color:var(--green);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px;}
.q-header h2{font-size:18px;font-weight:800;margin-top:6px;line-height:1.5;}
.q-header .q-hint{color:var(--text2);font-size:13px;margin-top:8px;line-height:1.6;}

.scenario-box{background:var(--card2);border:2px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;}
.scenario-box .scenario-label{color:var(--orange);font-size:11px;font-weight:800;text-transform:uppercase;margin-bottom:6px;}
.scenario-box p{font-size:13px;line-height:1.8;color:var(--text);}
.scenario-box .underlined{text-decoration:underline wavy var(--orange);text-underline-offset:4px;}

.essay-excerpt{background:var(--card2);border:2px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;font-size:14px;line-height:1.9;color:var(--text);}
.essay-excerpt .essay-label{color:var(--purple);font-size:11px;font-weight:800;text-transform:uppercase;margin-bottom:8px;}
.essay-excerpt .error-highlight{background:var(--red-light);color:var(--red);padding:2px 6px;border-radius:4px;font-weight:700;border-bottom:2px solid var(--red);}
.essay-excerpt .good-highlight{background:var(--green-light);color:var(--green-dark);padding:2px 6px;border-radius:4px;font-weight:700;border-bottom:2px solid var(--green);}

.options{display:flex;flex-direction:column;gap:8px;}
.option-btn{display:flex;align-items:flex-start;gap:12px;background:var(--card);border:2px solid var(--border);border-radius:14px;padding:14px 16px;cursor:pointer;transition:all 0.15s;font-size:14px;font-weight:600;color:var(--text);text-align:left;width:100%;font-family:'Nunito';line-height:1.5;}
.option-btn:hover{border-color:var(--blue);background:var(--blue-light);}
.option-btn.selected{border-color:var(--blue);background:var(--blue-light);}
.option-btn.correct{border-color:var(--green);background:var(--green-light);animation:correctPulse 0.4s;}
.option-btn.wrong{border-color:var(--red);background:var(--red-light);animation:shake 0.4s;}
.option-num{width:28px;height:28px;border-radius:8px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;margin-top:1px;}
@keyframes correctPulse{0%{transform:scale(1);}50%{transform:scale(1.02);}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}

.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:2px solid var(--border);padding:14px;display:none;justify-content:center;}
.check-btn{width:100%;max-width:680px;padding:14px;border:none;border-radius:14px;font-family:'Nunito';font-size:15px;font-weight:800;cursor:pointer;transition:all 0.15s;text-transform:uppercase;letter-spacing:1px;}
.check-btn.ready{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark);}
.check-btn.ready:hover{filter:brightness(1.08);}
.check-btn.ready:active{box-shadow:none;transform:translateY(4px);}
.check-btn.disabled{background:var(--bg2);color:var(--text3);cursor:not-allowed;}
.check-btn.next{background:var(--blue);color:#fff;box-shadow:0 4px 0 #0670C2;}

.feedback{position:fixed;bottom:66px;left:0;right:0;padding:14px 20px;text-align:center;font-weight:800;font-size:15px;transform:translateY(120%);transition:transform 0.3s ease;z-index:50;}
.feedback.show{transform:translateY(0);}
.feedback.correct-fb{background:var(--green-light);color:var(--green-dark);border-top:2px solid var(--green);}
.feedback.wrong-fb{background:var(--red-light);color:var(--red);border-top:2px solid var(--red);}
.feedback .fb-explain{font-size:12px;font-weight:600;color:var(--text2);margin-top:6px;line-height:1.6;}

.results{text-align:center;padding:30px 0;}
.results .trophy{font-size:64px;animation:bounce 2s infinite;}
.results h1{font-size:26px;font-weight:900;margin:12px 0;}
.results .score-ring{width:140px;height:140px;margin:16px auto;border-radius:50%;border:8px solid var(--bg2);display:flex;align-items:center;justify-content:center;background:var(--card);}
.results .score-num{font-size:32px;font-weight:900;}
.stat-row{display:flex;justify-content:center;gap:24px;margin:20px 0;}
.stat-item{text-align:center;}
.stat-item .stat-val{font-size:24px;font-weight:900;}
.stat-item .stat-label{font-size:11px;color:var(--text2);}
.restart-btn{padding:14px 40px;background:var(--green);color:#fff;border:none;border-radius:14px;font-family:'Nunito';font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 var(--green-dark);text-transform:uppercase;letter-spacing:1px;margin-top:12px;}
.restart-btn:active{box-shadow:none;transform:translateY(4px);}

.reader-container{background:var(--card);border-radius:16px;padding:24px;border:2px solid var(--border);box-shadow:var(--shadow);}
.reader-title{font-size:20px;font-weight:900;margin-bottom:4px;}
.reader-meta{font-size:12px;color:var(--text2);margin-bottom:16px;}
.reader-text{font-size:15px;line-height:2.2;color:var(--text);}
.reader-text .hl-vocab{background:linear-gradient(120deg,#FCEABB 0%,#F8B500 100%);background-size:100% 40%;background-repeat:no-repeat;background-position:0 88%;cursor:pointer;padding:0 2px;border-radius:2px;transition:background-size 0.2s;}
.reader-text .hl-vocab:hover{background-size:100% 100%;}
.reader-text .hl-technique{background:linear-gradient(120deg,#C3E8FF 0%,#74B9FF 100%);background-size:100% 40%;background-repeat:no-repeat;background-position:0 88%;cursor:pointer;padding:0 2px;border-radius:2px;transition:background-size 0.2s;}
.reader-text .hl-technique:hover{background-size:100% 100%;}
.reader-text .hl-grammar{background:linear-gradient(120deg,#FFD6D6 0%,#FF7675 100%);background-size:100% 40%;background-repeat:no-repeat;background-position:0 88%;cursor:pointer;padding:0 2px;border-radius:2px;transition:background-size 0.2s;}
.reader-text .hl-grammar:hover{background-size:100% 100%;}

.hl-legend{display:flex;gap:16px;margin:16px 0;flex-wrap:wrap;}
.hl-legend span{font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px;}
.hl-legend .dot{width:12px;height:12px;border-radius:3px;}

.tooltip-popup{position:fixed;z-index:300;background:var(--card);border:2px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow2);max-width:300px;font-size:13px;line-height:1.6;display:none;animation:fadeSlideIn 0.2s;}
.tooltip-popup .tp-title{font-weight:800;color:var(--green);font-size:12px;text-transform:uppercase;margin-bottom:4px;}
.tooltip-popup .tp-close{position:absolute;top:8px;right:10px;cursor:pointer;font-size:14px;color:var(--text2);background:none;border:none;}

.essay-nav{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.essay-tab{padding:8px 14px;border-radius:10px;border:2px solid var(--border);background:var(--card);font-family:'Nunito';font-size:12px;font-weight:700;cursor:pointer;transition:all 0.15s;color:var(--text2);}
.essay-tab:hover{border-color:var(--green);}
.essay-tab.active{border-color:var(--green);background:var(--green-light);color:var(--green-dark);}

.toolbox-section{margin-bottom:20px;}
.toolbox-section h3{font-size:16px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.toolbox-card{background:var(--card);border:2px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px;box-shadow:var(--shadow);}
.toolbox-card .tc-category{font-size:11px;font-weight:800;color:var(--purple);text-transform:uppercase;margin-bottom:6px;}
.toolbox-card .tc-example{font-size:14px;line-height:1.8;color:var(--text);margin:8px 0;padding:10px 14px;background:var(--card2);border-radius:10px;border-left:4px solid var(--green);}
.toolbox-card .tc-tip{font-size:12px;color:var(--text2);line-height:1.6;margin-top:6px;}

.toolbox-tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px;}
.toolbox-tab{padding:8px 14px;border-radius:10px;border:2px solid var(--border);background:var(--card);font-family:'Nunito';font-size:12px;font-weight:700;cursor:pointer;transition:all 0.15s;color:var(--text2);white-space:nowrap;}
.toolbox-tab:hover{border-color:var(--purple);}
.toolbox-tab.active{border-color:var(--purple);background:var(--purple-light);color:var(--purple);}

.xp-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:40px;font-weight:900;color:var(--gold);text-shadow:0 4px 20px rgba(241,196,15,0.4);pointer-events:none;z-index:200;transition:all 0.5s ease;}
.xp-popup.show{transform:translate(-50%,-50%) scale(1);opacity:1;}
.xp-popup.hide{transform:translate(-50%,-100%) scale(0.5);opacity:0;}
.combo-text{position:fixed;top:38%;left:50%;transform:translateX(-50%);font-size:28px;font-weight:900;pointer-events:none;z-index:200;opacity:0;transition:all 0.5s ease;}
.combo-text.show{opacity:1;transform:translateX(-50%) scale(1.15);}
.combo-text.amazing{color:var(--purple);}.combo-text.great{color:var(--green);}.combo-text.good{color:var(--blue);}
.confetti-piece{position:fixed;top:-10px;width:10px;height:10px;z-index:200;pointer-events:none;border-radius:2px;animation:confettiFall 2s ease forwards;}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1;}100%{transform:translateY(100vh) rotate(720deg);opacity:0;}}

.back-row{margin-bottom:16px;}
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:10px;border:2px solid var(--border);background:var(--card);font-family:'Nunito';font-size:13px;font-weight:700;cursor:pointer;color:var(--text2);transition:all 0.15s;}
.back-btn:hover{border-color:var(--green);color:var(--text);}

/* TTS */
.tts-btn{background:none;border:none;cursor:pointer;font-size:16px;padding:2px 6px;border-radius:6px;transition:background 0.15s;vertical-align:middle;}
.tts-btn:hover{background:var(--blue-light);}
.reader-text p{cursor:pointer;padding:4px 8px;border-left:4px solid transparent;border-radius:4px;transition:all 0.3s;}
.reader-text p.reading{border-left:4px solid var(--green);background:var(--green-light);}
.read-all-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:10px;border:2px solid var(--blue);background:var(--blue-light);font-family:'Nunito';font-size:13px;font-weight:700;cursor:pointer;color:var(--blue);margin-bottom:12px;}
.read-all-btn:hover{background:var(--blue);color:#fff;}

/* Spinner */
.spinner-container{display:flex;flex-direction:column;align-items:center;margin:20px 0;}
.wheel-wrapper{position:relative;width:300px;height:300px;margin:0 auto 20px;}
.wheel{width:300px;height:300px;border-radius:50%;border:6px solid var(--border2);transition:transform 4s cubic-bezier(0.17,0.67,0.12,0.99);position:relative;overflow:hidden;}
.wheel-pointer{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:28px;z-index:10;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.2));}
.spin-btn{padding:16px 48px;background:linear-gradient(135deg,var(--orange),var(--red));color:#fff;border:none;border-radius:16px;font-family:'Nunito';font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #C0392B;text-transform:uppercase;letter-spacing:2px;transition:all 0.15s;}
.spin-btn:hover{filter:brightness(1.1);}
.spin-btn:active{box-shadow:none;transform:translateY(4px);}
.spin-btn:disabled{opacity:0.5;cursor:not-allowed;}

.skeleton-field{margin-bottom:14px;}
.skeleton-field label{display:block;font-size:14px;font-weight:700;margin-bottom:4px;color:var(--text);}
.skeleton-field input,.skeleton-field textarea{width:100%;padding:12px;border:2px solid var(--border);border-radius:12px;font-family:'Nunito';font-size:14px;color:var(--text);background:var(--card);resize:vertical;}
.skeleton-field input:focus,.skeleton-field textarea:focus{outline:none;border-color:var(--blue);}

.tip-box{background:var(--gold-light);border:2px solid var(--gold);border-radius:14px;padding:16px;margin:16px 0;font-size:13px;line-height:1.7;}
.tip-box strong{color:var(--orange);}

.word-counter{font-size:13px;font-weight:800;padding:6px 12px;border-radius:8px;display:inline-block;margin-top:8px;}
.word-counter.wc-red{background:var(--red-light);color:var(--red);}
.word-counter.wc-yellow{background:var(--orange-light);color:var(--orange);}
.word-counter.wc-green{background:var(--green-light);color:var(--green);}
.word-counter.wc-orange{background:var(--orange-light);color:var(--orange);}

.rubric-section{margin:16px 0;}
.rubric-section h4{font-size:15px;font-weight:800;margin-bottom:10px;color:var(--purple);}
.rubric-item{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;background:var(--card);border:2px solid var(--border);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:all 0.15s;}
.rubric-item:hover{border-color:var(--green);}
.rubric-item.checked{border-color:var(--green);background:var(--green-light);}
.rubric-check{width:24px;height:24px;border-radius:6px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;transition:all 0.15s;}
.rubric-item.checked .rubric-check{background:var(--green);border-color:var(--green);color:#fff;}
.rubric-label{font-size:13px;font-weight:600;line-height:1.5;}
.rubric-score{margin:20px 0;text-align:center;padding:20px;background:var(--card);border-radius:16px;border:2px solid var(--border);}
.rubric-score .rs-num{font-size:48px;font-weight:900;}
.rubric-score .rs-grade{font-size:18px;font-weight:800;margin-top:8px;}

.model-essay{background:var(--card);border-radius:16px;padding:24px;border:2px solid var(--border);box-shadow:var(--shadow);margin-top:16px;}
.model-essay .me-title{font-size:18px;font-weight:900;margin-bottom:12px;}
.model-essay .me-text{font-size:14px;line-height:2.2;}
.me-text .hl-vocab{background:linear-gradient(120deg,#FCEABB 0%,#F8B500 100%);background-size:100% 40%;background-repeat:no-repeat;background-position:0 88%;padding:0 2px;border-radius:2px;}
.me-text .hl-technique{background:linear-gradient(120deg,#C3E8FF 0%,#74B9FF 100%);background-size:100% 40%;background-repeat:no-repeat;background-position:0 88%;padding:0 2px;border-radius:2px;}
.me-comment{background:var(--purple-light);border-left:4px solid var(--purple);border-radius:0 10px 10px 0;padding:10px 14px;margin:10px 0;font-size:12px;line-height:1.6;color:var(--purple);}

/* Info Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:400;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.active{display:flex;}
.modal-box{background:var(--card);border-radius:20px;padding:28px;max-width:500px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:var(--shadow2);position:relative;}
.modal-box h3{font-size:18px;font-weight:900;margin-bottom:12px;}
.modal-box p{font-size:13px;line-height:1.8;color:var(--text2);margin-bottom:8px;}
.modal-close{position:absolute;top:12px;right:16px;font-size:20px;cursor:pointer;background:none;border:none;color:var(--text2);}
.info-btn{background:none;border:none;font-size:24px;cursor:pointer;vertical-align:middle;padding:4px;}

.step-btn{padding:14px 32px;border:none;border-radius:14px;font-family:'Nunito';font-size:15px;font-weight:800;cursor:pointer;margin:8px;transition:all 0.15s;}
.step-btn-primary{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark);}
.step-btn-primary:active{box-shadow:none;transform:translateY(4px);}
.step-btn-secondary{background:var(--bg2);color:var(--text2);}

/* Outline Builder */
.ob-topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0;}
.ob-topic-btn{padding:12px;border:2px solid var(--border);border-radius:12px;background:var(--card);font-family:'Nunito';font-size:13px;font-weight:700;cursor:pointer;text-align:left;transition:all 0.15s;color:var(--text);}
.ob-topic-btn:hover{border-color:var(--green);background:var(--green-light);}
.ob-topic-btn.selected{border-color:var(--green);background:var(--green-light);color:var(--green-dark);}
.ob-topic-btn .ob-year{font-size:10px;color:var(--text3);display:block;margin-top:2px;}
.ob-template-card{background:var(--card);border:2px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px;cursor:pointer;transition:all 0.15s;}
.ob-template-card:hover{border-color:var(--purple);background:var(--purple-light);}
.ob-template-card.selected{border-color:var(--purple);background:var(--purple-light);}
.ob-template-card h4{font-size:15px;font-weight:800;margin-bottom:4px;}
.ob-template-card p{font-size:12px;color:var(--text2);line-height:1.5;}
.ob-section-card{background:var(--card);border:2px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);}
.ob-section-card h4{font-size:16px;font-weight:800;color:var(--purple);margin-bottom:6px;}
.ob-section-card .ob-prompt{font-size:14px;color:var(--text);margin-bottom:10px;line-height:1.6;}
.ob-examples{margin:10px 0;}

// =============================================
// AUDIO ENGINE
// =============================================
var audioCtx = null;
function ensureAudio() {
  if (!audioCtx) try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  if (audioCtx && audioCtx.state === 'suspended') try { audioCtx.resume(); } catch(e) {}
}
function playTone(freq, type, dur, vol) {
  ensureAudio(); if (!audioCtx) return;
  var o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination); o.type = type;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
  o.frequency.setValueAtTime(freq, audioCtx.currentTime);
  o.start(); o.stop(audioCtx.currentTime + dur + 0.05);
}
function playCorrect() {
  ensureAudio(); if (!audioCtx) return;
  var freqs = [523, 659, 784];
  for (var i = 0; i < freqs.length; i++) {
    (function(f, idx) { setTimeout(function() { playTone(f, 'sine', 0.15, 0.25); }, idx * 80); })(freqs[i], i);
  }
}
function playWrong() { playTone(200, 'sawtooth', 0.35, 0.15); setTimeout(function() { playTone(150, 'sawtooth', 0.25, 0.12); }, 150); }
function playClick() { playTone(800, 'sine', 0.06, 0.12); }
function playLevelUp() {
  var freqs = [523, 587, 659, 784, 880, 1047];
  for (var i = 0; i < freqs.length; i++) {
    (function(f, idx) { setTimeout(function() { playTone(f, 'sine', 0.12, 0.18); }, idx * 70); })(freqs[i], i);
  }
}
function playCombo() {
  var freqs = [660, 880, 1100];
  for (var i = 0; i < freqs.length; i++) {
    (function(f, idx) { setTimeout(function() { playTone(f, 'triangle', 0.1, 0.15); }, idx * 50); })(freqs[i], i);
  }
}
function playSpinSound() {
  var freqs = [400, 500, 600, 700, 800, 900, 1000];
  for (var i = 0; i < freqs.length; i++) {
    (function(f, idx) { setTimeout(function() { playTone(f, 'sine', 0.08, 0.1); }, idx * 120); })(freqs[i], i);
  }
}
function playLandSound() {
  var freqs = [523, 659, 784, 1047];
  for (var i = 0; i < freqs.length; i++) {
    (function(f, idx) { setTimeout(function() { playTone(f, 'sine', 0.2, 0.2); }, idx * 100); })(freqs[i], i);
  }
}

// =============================================
// TTS ENGINE
// =============================================
function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.rate = 0.85;
  u.lang = 'en-GB';
  window.speechSynthesis.speak(u);
  return u;
}

function stopSpeaking() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
}

// =============================================
// CONFETTI
// =============================================
function spawnConfetti(n) {
  if (!n) n = 25;
  var cols = ['#00B894', '#0984E3', '#F39C12', '#6C5CE7', '#F1C40F', '#E17055'];
  for (var i = 0; i < n; i++) {
    var el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.background = cols[Math.floor(Math.random() * cols.length)];
    el.style.animationDelay = Math.random() * 0.5 + 's';
    el.style.animationDuration = (1.5 + Math.random()) + 's';
    el.style.width = (6 + Math.random() * 8) + 'px';
    el.style.height = (6 + Math.random() * 8) + 'px';
    document.body.appendChild(el);
    (function(e) { setTimeout(function() { e.remove(); }, 3000); })(el);
  }
}

    text: 'The sun hung low in the sky, casting long shadows over the playground as I swung with great agility from bar to bar. I kicked my legs to propel myself forward. The wind whipping my hair throughout the playground and my laughter resounding.\n\n"Johnson, time to go back home!" my dad bellowed, his sharp and insistent voice reaching my ears from the void deck where he was stationed with his book in hand.\n\n"It\'s going to pour!" Dad shouted loudly.\n\nI ignored him, gripping the cold metal bars while swinging from left to right.\n\nAll of a sudden, the rain came crashing down. The bars became slick. My hand slipped and fell down.\n\nAt that moment, I heard a loud "crack" sound coming from my legs. Tears streamed down my cheeks ,as my blood flew out as fast as wind. I reached for my phone to call my father. I tried calling him again and again, but there was no reply. Just when I was about to pass out from the pain, my call finally went through and I told him what had happened.\n\nHe dashed over as fast as he could. After ensuring that I didn\'t break any bones, he called the ambulance.\n\nSoon the ambulance arrived. The paramedics lifted me into the ambulance and drove me to the hospital.\n\nFrom that day on. Lessons are learnt when they are least expected. I finally understood that sometimes listening to those who care for you is not a sign of weakness, but wisdom. As the saying goes, "An ounce of prevention is worth a pound of cure."',

    id: 'classroom', title: 'Trouble in the Classroom', titleZh: '\u8bfe\u5ba4\u98ce\u6ce2', source: 'P5 \u9ad8\u534e\u4f5c\u6587 English',
    text: 'One morning, Xiaoming and Dahua were playing basketball in the classroom. They tossed the ball to one another and were having great fun. At that moment, Mr Huang was walking towards the classroom.\n\nHowever, Xiaoming and Dahua were so engrossed in their game that they did not notice Mr Huang approaching the door.\n\n"Come on! Pass me the ball!" Dahua shouted excitedly as he waved his hands.\n\n"Watch this!" Xiaoming said proudly. With that, he threw the basketball towards Dahua with all his strength. The ball shot through the air like a runaway horse, tracing an arc across the classroom. Dahua quickly stretched out his arms to catch it, but the ball was moving too fast. Before he knew it, he had missed it completely.\n\nThere was a loud crash.\n\nThe basketball flew straight into the window. Instantly, shards of glass shattered and scattered all over the floor. The classroom, which had been filled with laughter just a moment ago, fell so silent that even a pin drop could have been heard.\n\nXiaoming and Dahua froze on the spot. The smiles on their faces vanished at once. The two boys stared at each other in shock, utterly dumbfounded. It felt as though a huge stone was pressing heavily on their hearts. Cold sweat broke out on Xiaoming\'s palms as he thought anxiously, "Oh no! We are in serious trouble now! What if the broken glass hurts someone?" Dahua was equally terrified. His legs turned weak, and he wished that the ground would open up and swallow him whole.\n\nJust then, Mr Huang stepped into the classroom. At one glance, she saw the broken glass on the floor and the basketball lying in the corner. Her eyebrows knitted together immediately, and her face darkened. She strode to the window, examined the shattered glass carefully, then turned to look at Xiaoming and Dahua. Her expression was as stern as the sky before a storm.\n\n"Xiaoming! Dahua! What exactly happened here?" Mr Huang demanded in a raised voice.\n\nHearing the teacher\'s question, the two boys were so frightened that they hardly dared to breathe. With their heads lowered and faces flushed red with shame, they stood rooted to the spot. After what felt like a long while, Xiaoming finally plucked up his courage and said softly, "T-Teacher, I\'m sorry. We should not have been playing basketball in the classroom. We accidentally broke the window."\n\nDahua quickly added, "Teacher, it was our fault. Please forgive us."\n\nAfter listening to her words, Mr Huang did not speak immediately. She only let out a soft sigh. Then she said earnestly, "The classroom is a place for learning, not a place for playing ball. What you did could not only damage school property, but also hurt yourselves or your classmates. What if the glass had flown onto someone? The consequences would have been too dreadful to imagine. Do you understand?"\n\nAfter listening to her words, Xiaoming and Dahua were so ashamed that they could not even lift their heads. Only then did they realise that they had been so carried away by fun that they had never stopped to think about the serious consequences of their actions.\n\nTogether, they said, "Teacher, we really know we were wrong. We will never do it again."\n\nSeeing their sincere attitude, Mr Huang\'s tone softened. She said, "It is good to admit your mistakes and change for the better. First, clean up the broken glass carefully. After that, come with me to report this to the school caretaker and discuss the matter of compensation. In future, if you want to play basketball, go to the basketball court. Never fool around in the classroom again."\n\nThe two boys immediately fetched a broom and a dustpan and carefully swept up the broken glass. As they looked at the glittering shards on the floor, their hearts were filled with regret. Later, they even used the pocket money they had saved and, together with their parents, paid for the broken window.\n\nThrough this lesson, Xiaoming and Dahua understood deeply that one should never think only about having fun for the moment, nor should one do dangerous things in unsuitable places. Safety must always come first, and public property must be cared for.',

  {
    id: 'sea', title: 'An Encounter with the Sea', titleZh: '\u4e00\u6b21\u548c\u6d77\u7684\u76f8\u9047', source: 'P5 \u9ad8\u534e\u4f5c\u6587 English',
    text: 'Early in the morning in Kota Kinabalu, the sky was only beginning to brighten. The air by the sea was fresh and moist, carrying a faint salty smell. A gentle sea breeze blew towards me, instantly making me feel refreshed. In the distance, the surface of the sea shimmered under the morning light, while wave after wave lapped softly against the shore, as if playing a gentle morning melody.\n\nWe first did some warm-up exercises on the beach. The fine sand beneath my feet felt soft and warm. As I stretched my body, the stiffness in my muscles gradually disappeared, and even the nervousness in my heart slowly faded away. After breakfast, the coach asked us to practise holding our breath. At first, I thought it was not too difficult, but after a while, my chest began to tighten and breathing became harder. I endured the discomfort and counted the seconds silently in my heart.\n\nSoon, we boarded a small boat and headed for the training area. The boat rocked gently on the sea, and the wind was stronger than before. I lowered my head and looked at the water beside the boat. It gradually changed from light blue to deep blue, becoming more mysterious the longer I stared at it.\n\nAt last, it was time to enter the water. I first floated on the surface and slowly adjusted my breathing according to the coach\'s instructions, trying my best to relax. After taking a deep breath, I plucked up my courage and performed a duck dive into the sea. At the beginning of the descent, my heart tightened at once. Everything around me became especially quiet, and all I could feel was the seawater gently surrounding me.\n\nAfter a while, I gradually adapted to the underwater environment and finally saw the scenery beneath the sea. Sunlight streamed through the water in golden rays, swaying gently on the seabed. Colourful corals spread across the ocean floor. Some looked like branching trees, some resembled blooming flowers, while others looked like soft clusters of mushrooms. Schools of fish darted in and out among the corals, moving swiftly and gracefully.\n\nAs I descended to a depth of about two to three metres, I gradually felt my ears becoming blocked, as though something was pressing tightly against them. It was very uncomfortable. I quickly followed the method the coach had taught us \u2014 I pinched my nose and gently equalised the pressure in my ears.\n\nWhen I tried to dive even deeper, the discomfort did not lessen. In those few short seconds, countless thoughts ran through my mind. In the end, I decided not to force myself. Instead, I turned around and swam back up at once. At that moment, I suddenly understood that true courage was not about blindly forcing oneself onward. It was about staying clear-headed in the face of danger and knowing when to persist and when to stop in order to protect oneself.',

      {text: 'shimmered under the morning light', type: 'vocab', note: '"Shimmered" = shone with a soft, flickering light. Much more vivid than "was bright". Great descriptive verb.'},

    text: 'Night had fallen, and a crescent moon hung high in the sky. Soft moonlight bathed the campsite. The school camping activity was in full swing \u2014 students gathered around the campfire singing, clapping and dancing, all in high spirits. The blazing flames crackled from time to time, painting everyone\'s faces red.\n\nAfter the activities ended, the teacher led the students back to the dormitory to rest. Before bed, the teacher specially reminded everyone that it was late, and after washing up they should go to sleep immediately \u2014 no making noise, and absolutely no secretly playing with phones. Everyone nodded in agreement, and the dormitory quickly fell silent.\n\nOutside the window, insects chirped softly and a cool breeze drifted into the room. Many students had already fallen asleep. Just then, a student on the top bunk glanced down and suddenly discovered that Xiaowen\'s bed was empty \u2014 even her blanket was gone. The previously quiet dormitory was thrown into commotion at once. Everyone sat up, looking around nervously, their faces showing confusion and unease.\n\nAs time passed, the students grew more and more anxious. Some worried that Xiaowen had gone out alone; others feared she might be in danger in the dark night. The atmosphere in the dormitory became tense, as if the very air had frozen solid. Finally, one student could not hold back any longer and rushed to tell the teacher.\n\nThe teacher\'s expression turned serious at once. She immediately took a few students and searched along the corridor. In the dead of night, the corridor was eerily quiet \u2014 only their hurried footsteps could be heard. The dim yellow lights cast everyone\'s shadows long on the floor. My heart pounded wildly, and frightening thoughts kept flashing through my mind.\n\nWhen everyone reached the door of Room 3, the teacher suddenly stopped. From inside the room came faint rustling sounds and, upon listening closely, what seemed like soft giggles. The teacher frowned and gently pushed the door open. The room was pitch dark, and most students appeared to be asleep. But one bed\'s blanket was bulging up like a little mountain, looking highly suspicious. Even more telling was a faint glow leaking through the gaps in the blanket.\n\nSuddenly, the teacher pulled back the blanket in one swift motion. There were Xiaowen and another student, huddled under the covers, clutching a phone with the screen still glowing. They had never been missing at all \u2014 they had been secretly hiding under the blanket playing with their phone. Caught red-handed, their faces turned white with shock and they froze completely, as if a spell had been cast on them.\n\nThe teacher\'s face darkened, her eyes filled with disappointment and sternness. Xiaowen lowered her head, gripping the corner of the blanket tightly, her face alternating between red and white, wishing the ground would open up and swallow her. She had only wanted to have a little fun, sneaking a look at her phone after everyone fell asleep. She never imagined it would cause such a storm \u2014 not only breaking the rules but also causing the teacher and classmates tremendous worry.\n\nThis incident taught me that in group life, nobody should think only of their own momentary pleasure while ignoring others\' feelings. Following rules is not a small matter, because one person\'s selfishness and mischief can bring unnecessary worry and trouble to everyone. Xiaowen\'s moment of greed for fun ended with her being caught red-handed and alarming everyone \u2014 she truly reaped what she sowed.',

    text: 'When I open the box of memories, it is filled with many colourful moments from the past. Some have long drifted away with the wind, while others remain deeply engraved in my mind. The one I can never forget is that hair-raising camping experience.\n\nIt was a bright and sunny Sunday morning. Xiaobao, Xiaobai, Xiaole and I followed the campsite supervisor to go camping deep in the mountains. Along the way, the sky was clear and blue, and white clouds floated lazily across it. A gentle breeze brushed against our faces, making us feel cool and refreshed.\n\nThe moment we reached our destination, everyone became busy with excitement. Some pitched the tents, some carried the luggage, while others collected branches to make a fire for the night. Xiaole was the youngest among us, yet she was also the liveliest.\n\nTime flew by, and before we knew it, night fell quietly. The surroundings gradually darkened, and only the faint glow of the campfire lit up the area, casting our shadows long on the ground. The forest was strangely silent. Occasionally, the chirping of insects could be heard, which made the place seem even more eerie. Suddenly, a low and terrifying sound came from the woods not far away. At the same time, the bushes began shaking violently.\n\n"W-What\u2026 what was that sound?" Xiaobai stammered, his face turning pale at once.\n\nBefore the supervisor could reply, a huge dark shadow appeared in the bushes. At once, all of us turned pale with fright and trembled from head to toe. My heart leapt into my throat, and my mind went blank.\n\n"Run!" someone shouted.\n\nWithout another thought, we took to our heels. I ran until I was breathless. All I could hear were hurried footsteps and the panicked cries of my friends. Suddenly, there was a loud thud behind me, followed by a heart-rending scream. Xiaole had tripped over a tree root because she was running too fast, and she fell heavily onto the ground.\n\nAt the sight of this, I was as anxious as an ant on a hot pan and did not know what to do. Just as all of us were panicking, a strong beam of torchlight suddenly shone towards us. It was the campsite supervisor.\n\nIn a low and serious voice, he said, "Don\'t panic, and don\'t shout. That is not a fierce wild beast. It is only an elephant passing by. Stay close to me and slowly move back to the campsite."\n\nAlthough this incident happened a long time ago, I still feel a shiver down my spine whenever I think of that dark night. From this terrifying camping experience, I learnt an important lesson: when danger strikes, we must never panic. Only by staying calm and listening to the instructions of adults can we get out of danger safely.',

      {text: 'hair-raising', type: 'vocab', note: '"Hair-raising" = extremely frightening. Literally means so scary your hair stands up. Vivid and dramatic.'},
      {text: 'night fell quietly', type: 'technique', note: 'Personification \u2014 night "falling quietly" gives time a gentle, creeping quality. Builds the transition to danger.'},
      {text: 'My heart leapt into my throat', type: 'technique', note: 'Idiom for extreme fear \u2014 the physical sensation of your heart jumping. Much better than writing "I was very scared."'},

      {text: 'as anxious as an ant on a hot pan', type: 'technique', note: 'Simile from Chinese (\u70ed\u9505\u4e0a\u7684\u8682\u8681). Creates a vivid image of frantic, helpless anxiety. Cross-cultural idioms add flavour!'},
      {text: 'W-What\u2026 what was that sound?', type: 'technique', note: 'Stammering in dialogue \u2014 the "W-What" shows fear through HOW the character speaks. Advanced characterisation technique.'},

  {
    id: 'maldives', title: 'My Heart Remains in That Ocean \u2014 Maldives', titleZh: '\u9A6C\u5C14\u4EE3\u592B\u6E38\u8BB0', source: 'P5 \u9ad8\u534e\u4f5c\u6587 English',
    text: 'On a bright Saturday morning, my mother, brother, grandmother and I finally set off for the long-awaited September holiday trip to the Maldives. At around eight o\u2019clock, we arrived at the airport and gathered at the boarding gate. From afar, I spotted the well-known top student, Yunyun. Her father, Uncle Xiaocai, was the organiser of this trip. Compared to what I had seen in videos, Yunyun looked slimmer, while her father appeared strong and energetic. Their warm smiles and friendly greetings immediately made everyone feel at ease.\n\nSoon, the boarding announcement sounded, and we got onto the plane. To my delight, our seats were surprisingly close to theirs. As I settled down, I began observing the other children. A boy seated in front of me caught my attention. He looked gentle and composed, wearing glasses and writing diligently in a notebook by the window. While most passengers were watching movies, he remained completely focused, as if he had forgotten he was travelling. I could not help but admire his concentration.\n\nAfter a four-and-a-half-hour flight, we arrived at Velana International Airport in Mal\u00e9. From there, we took a speedboat to our yacht. The breathtaking scenery instantly captivated me. The sea shimmered like a blanket of diamonds under the sunlight. What amazed me most was that the ocean was not a single shade of blue \u2014 it stretched from crystal-clear turquoise near the shore to deep, mysterious blue in the distance, resembling a magnificent palette painted by nature itself. A gentle sea breeze greeted us, and everyone exclaimed in awe at the beauty before our eyes.\n\nAfter boarding the yacht, we eagerly explored its four levels. It was my first time staying on a boat. Although I had been slightly worried about seasickness, my father reassured me that larger boats were more stable, and I soon felt at ease.\n\nLater, Uncle Xiaocai introduced our first activity \u2014 fishing. To my surprise, we did not use fishing rods but simple fishing lines. Following the crew\u2019s instructions, I lowered the line into the sea and waited patiently. At first, I felt confident and even imagined catching a huge fish. However, as time passed, my excitement gradually turned into impatience. I suddenly recalled my grandfather\u2019s words: fishing requires both patience and focus. If one becomes restless or distracted, the fish will simply swim away.\n\nJust as I was about to lose hope, I felt a slight tug on my line. I held my breath and focused. The pulling grew stronger. With the help of a crew member, I quickly reeled it in, and to my amazement, a large fish leapt out of the water! My heart raced with excitement as I cheered loudly. That evening, the fish was steamed and served for dinner. The tender, flavourful meat tasted especially delicious, perhaps because it was the fruit of my own effort.\n\nThat night, my friends and I lay on the deck, enjoying the cool sea breeze and gazing at the vast Indian Ocean beneath a sky full of stars. At that moment, I felt both small and deeply connected to the universe. Soon after, we returned to our rooms and drifted off to sleep.\n\nThe next day, we went snorkelling. Surrounded by vibrant marine life, I was amazed by the diversity of the underwater world. Colourful fish swam gracefully among the coral reefs, like tiny living jewels. A majestic manta ray glided past us, moving effortlessly like a kite in the water. Time seemed to pass in an instant, and I felt reluctant to leave.\n\nIn the evening, we went to an uninhabited island to catch crabs. At first, I missed several opportunities and felt frustrated. However, I refused to give up. After observing carefully and learning from others, I finally managed to catch one. The sense of achievement filled me with joy. As more crabs appeared, we became more confident, and by the end of the night, everyone returned with smiles and a sense of satisfaction.\n\nOne of the most unforgettable experiences was deep-sea diving. Standing at the edge of the boat, I hesitated. The ocean looked vast and intimidating. Yet, I encouraged myself \u2014 if I did not try, I would never know what I was capable of. Gathering my courage, I jumped into the water. At first, the pressure in my ears was uncomfortable, but I followed the instructor\u2019s guidance and gradually adjusted my breathing. As I descended, the water grew colder, yet I soon adapted.\n\nSuddenly, a school of brightly coloured fish appeared before my eyes, moving together like a flowing painting. Sunlight filtered through the water, illuminating the ocean floor and creating a dreamlike scene. In that moment, all my fear disappeared, replaced by pure wonder. Even after returning to the surface, I felt as though a part of me had remained beneath the sea.\n\nAnother highlight was dolphin watching. At first, we saw nothing but endless blue, and disappointment crept in. Just as I was about to give up, a dolphin suddenly leapt out of the water, forming a graceful arc in the air before diving back into the sea. I was overwhelmed with excitement. It felt like a magical gift from nature.\n\nHowever, the most thrilling moment of the entire trip was swimming with nurse sharks. At first, only a few appeared. Then, as the crew fed them, dozens of sharks gathered around us. I was both frightened and fascinated. Their powerful bodies brushed against me, and my heart pounded wildly. Despite my fear, I remained calm and focused, eventually making my way safely back to the boat. It was an experience I will never forget.\n\nAlthough the trip lasted only a few days, the memories of the Maldives \u2014 the crystal-clear waters, the vibrant marine life, and the laughter shared with friends \u2014 will stay with me forever. On the flight back to Singapore, I closed my eyes and replayed every moment in my mind. This journey was not only filled with joy but also enriched my life with new experiences and friendships.\n\nI look forward to the next adventure, where even more unforgettable memories await.',
    highlights: [
      {text: 'shimmered like a blanket of diamonds', type: 'technique', note: 'Simile \u2014 the sea as "a blanket of diamonds" creates a vivid, sparkling image. Engages the reader\u2019s visual imagination.'},
      {text: 'resembling a magnificent palette painted by nature itself', type: 'technique', note: 'Metaphor \u2014 comparing layered ocean colours to an artist\u2019s palette. Poetic and original!'},

      {text: 'moving together like a flowing painting', type: 'technique', note: 'Simile \u2014 fish as a "flowing painting" merges art and nature. Creates a dreamy, poetic atmosphere.'},
      {text: 'I felt as though a part of me had remained beneath the sea', type: 'technique', note: 'Emotional reflection \u2014 shows how deeply the experience affected the narrator. This kind of introspection scores top marks.'},
      {text: 'a magical gift from nature', type: 'vocab', note: 'Metaphor \u2014 the dolphin sighting as a "gift" emphasises its unexpected, precious quality.'},
      {text: 'I was both frightened and fascinated', type: 'technique', note: 'Contrasting emotions in one sentence \u2014 "frightened AND fascinated" shows complex feelings. Much better than just "I was scared."'},
      {text: 'enriched my life with new experiences and friendships', type: 'technique', note: 'Reflective ending \u2014 elevates the trip from fun to personal growth. Shows the narrator learned something lasting.'}

var Q_GRAMMAR = [
  {qType:'Grammar \u00b7 A Lesson Learnt', question:'"My hand slipped and fell down." What is wrong?', options:['Nothing \u2014 it\'s correct','The subject is confusing \u2014 it sounds like the HAND fell, not the person','It needs a full stop','The tense is wrong'], correct:1, explain:'"My hand slipped and I fell down" \u2014 without "I", it reads as if the hand itself fell. Always check your subject matches the action.', excerpt:'"My hand slipped and <span class="error-highlight">fell down</span>."'},
  {qType:'Grammar \u00b7 A Lesson Learnt', question:'"my blood flew out as fast as wind." Which word is wrong?', options:['"blood"\u2192"wound"','"flew"\u2192"flowed"','"fast"\u2192"quickly"','"wind"\u2192"lightning"'], correct:1, explain:'Blood "flows", not "flies". "Flew" is past tense of "fly" (birds). "Flowed" is past tense of "flow" (liquids).', excerpt:'"my blood <span class="error-highlight">flew</span> out as fast as wind"'},
  {qType:'Grammar \u00b7 A Lesson Learnt', question:'"The wind whipping my hair throughout the playground and my laughter resounding." Find TWO errors.', options:['Wrong tense only','Missing space + sentence fragment (no main verb)','Too many adjectives','Spelling error only'], correct:1, explain:'"playgroundand" \u2192 "playground and" (missing space). Also this is a fragment \u2014 no main verb. Fix: "The wind whipped my hair and my laughter resounded."'},
  {qType:'Grammar \u00b7 A Lesson Learnt', question:'"Tears streamed down my cheeks ,as my blood flew out." What punctuation error?', options:['Missing full stop','Extra space before the comma \u2014 should be "cheeks, as"','Needs a semicolon','Missing question mark'], correct:1, explain:'Commas go directly after the word: "cheeks, as" not "cheeks ,as". No space before commas in English!'},
  {qType:'Grammar \u00b7 A Lesson Learnt', question:'"From that day on. Lessons are learnt when they are least expected." What\'s wrong?', options:['"From that day on" is a fragment \u2014 the period should be a comma','"Learnt" should be "learned"','The sentence is too long','Nothing is wrong'], correct:0, explain:'"From that day on." has no verb or complete thought. Fix: "From that day on, I learnt that lessons come when least expected."'},
  {qType:'Grammar \u00b7 A Lesson Learnt', question:'"I heard a loud crack sound coming from my legs." How can this be improved?', options:['Add more adjectives','Change to "I heard a loud \'crack!\' \u2014 a sickening sound from my leg" for more impact','Remove "loud"','Change "legs" to "leg"'], correct:1, explain:'Using onomatopoeia with exclamation and a dash creates drama. Also "leg" (singular) is more natural unless both legs were injured.'},
  {qType:'Grammar \u00b7 A Lesson Learnt', question:'The essay says "as fast as wind." What\'s missing?', options:['An exclamation mark','The article "the" \u2014 should be "as fast as the wind"','A comma','Nothing'], correct:1, explain:'In English, we say "as fast as THE wind" with the definite article. Missing articles are a common error in compositions.'},
  {qType:'Grammar \u00b7 A Lesson Learnt', question:'Which sentence from the essay best shows "show, don\'t tell"?', options:['"I was in pain"','"Tears streamed down my cheeks"','"I felt bad"','"It hurt a lot"'], correct:1, explain:'"Tears streamed down my cheeks" SHOWS pain through a physical reaction. The other options just TELL the reader. Always show!'},
  {qType:'Grammar \u00b7 Classroom Storm', question:'The essay uses "Mr Huang" then "she/her" as pronouns. Is this a problem?', options:['No \u2014 the essay establishes Mr Huang is female; pronouns match','Yes \u2014 "Mr" usually refers to a male, creating confusion','Only in formal writing','Pronouns don\'t matter'], correct:1, explain:'Using "Mr Huang" then "she" can confuse readers. If Mr Huang is female, use "Mrs/Ms/Mdm Huang". If male, use "he". Consistency matters!'},
  {qType:'Grammar \u00b7 Classroom Storm', question:'"He threw the basketball towards Dahua with all his strength." Which is a stronger version?', options:['"He threw the ball really hard"','"He hurled the basketball at Dahua with every ounce of strength"','"He passed the ball"','"He threw the basketball towards Dahua quickly"'], correct:1, explain:'"Hurled" is more powerful than "threw". "Every ounce of strength" is more vivid than "all his strength". Strong verbs + specific details = higher marks.'},
  {qType:'Grammar \u00b7 Classroom Storm', question:'"The classroom fell so silent that even a pin drop could have been heard." Identify the technique:', options:['Metaphor','Hyperbole (exaggeration for effect)','Personification','Onomatopoeia'], correct:1, explain:'You can\'t literally hear a pin drop \u2014 this is hyperbole to emphasize the extreme, sudden silence after the crash.'},
  {qType:'Grammar \u00b7 Classroom Storm', question:'"Cold sweat broke out on Xiaoming\'s palms." This demonstrates:', options:['Listing facts','Show don\'t tell \u2014 using physical reactions to show emotions','Using dialogue','Background information'], correct:1, explain:'Instead of "He was scared", we SEE cold sweat. Physical details let the reader FEEL the character\'s emotions. Top technique!'},
  {qType:'Grammar \u00b7 Classroom Storm', question:'The essay repeats "After listening to her words" twice in nearby paragraphs. How should this be fixed?', options:['It\'s fine to repeat','Vary the phrasing: use "Upon hearing this" or "The teacher\'s words struck deep" for the second instance','Delete one paragraph','Change the subject'], correct:1, explain:'Repetition of the same phrase sounds careless. Varying your transitions shows vocabulary range and gets higher L&O marks.'},
  {qType:'Grammar \u00b7 Classroom Storm', question:'Which transition word could improve flow between the basketball scene and the silence?', options:['"However"','"In an instant" or "Without warning"','"Furthermore"','"For example"'], correct:1, explain:'"In an instant" shows the sudden change from action to stillness. Good transition words connect scenes and improve pacing.'},
  {qType:'Grammar \u00b7 Encounter with the Sea', question:'The opening uses three senses: touch (moist air, breeze), smell (salty), and feeling (refreshed). Why is this effective?', options:['It makes the essay longer','Multi-sensory openings immerse the reader in the scene immediately','Teachers like long descriptions','It follows a formula'], correct:1, explain:'Using 3+ senses in your opening is like switching on a movie for the reader. They can feel, smell, and see the scene!'},
  {qType:'Grammar \u00b7 Encounter with the Sea', question:'The essay is very long and covers many events. For a timed PSLE composition, what should change?', options:['Keep everything','Focus on 1-2 key events and develop them deeply','Remove all descriptions','Only write dialogue'], correct:1, explain:'Depth beats breadth! In PSLE, pick the most dramatic event (the dive) and develop it fully.'},
  {qType:'Grammar \u00b7 Encounter with the Sea', question:'"Corals like branching trees, resembled blooming flowers, looked like soft clusters of mushrooms." What is the risk?', options:['More similes are always better','Stacking too many similes feels like a list and slows pacing; keep 2 best ones','Similes are not allowed','The examiner will think you copied'], correct:1, explain:'Quality over quantity. Pick your 2 strongest comparisons and develop them.'},
  {qType:'Grammar \u00b7 Encounter with the Sea', question:'"true courage was not about blindly forcing oneself onward." Why does this score well?', options:['It uses big words','It challenges a common belief and shows mature, reflective thinking','It\'s the longest sentence','It quotes someone famous'], correct:1, explain:'Redefining courage as wisdom (not just bravery) shows growth and maturity. PSLE markers award top marks for deep, original reflections.'},
  {qType:'Grammar \u00b7 Encounter with the Sea', question:'"wave after wave lapped softly against the shore, as if playing a gentle morning melody." Identify the technique:', options:['Simile only','Personification \u2014 waves "playing" a melody gives nature human qualities','Alliteration','Onomatopoeia'], correct:1, explain:'Waves can\'t literally "play" music \u2014 this is personification. It makes the scene feel poetic and alive.'},
  {qType:'Grammar \u00b7 Encounter with the Sea', question:'How could the freediving section be improved with dialogue?', options:['Remove the coach entirely','Add the coach\'s specific instructions: "Breathe in through your nose, hold for 4 counts..."','Add unrelated small talk','Make the narrator talk to fish'], correct:1, explain:'Adding the coach\'s actual words makes the scene feel more real and builds trust between characters.'},
  {qType:'Grammar \u00b7 Reap What You Sow', question:'The story reveals Xiaowen was just playing her phone. This technique is called:', options:['Flashback','Misdirection \u2014 the reader assumes the worst, but the truth is less dramatic','Foreshadowing','Epilogue'], correct:1, explain:'Misdirection builds suspense by leading readers to expect one thing, then surprising them.'},
  {qType:'Grammar \u00b7 Reap What You Sow', question:'The essay uses an emotional arc: worry \u2192 panic \u2192 search \u2192 discovery \u2192 relief \u2192 anger \u2192 reflection. Why is this important?', options:['It\'s not important','Each emotional shift creates a wave of interest that keeps readers hooked','It makes the essay sad','Teachers only care about grammar'], correct:1, explain:'An emotional arc is the backbone of great narrative writing. Plan your character\'s emotional journey BEFORE you start writing.'},
  {qType:'Grammar \u00b7 Reap What You Sow', question:'Why does silence BEFORE a dramatic moment work?', options:['It fills word count','The contrast between silence and sudden action creates maximum dramatic impact','Silence is always good','It shows good vocabulary'], correct:1, explain:'Silence before action = amplified impact. Like the pause before a thunder crack. Use this technique before your story\'s climax!'},
  {qType:'Grammar \u00b7 Reap What You Sow', question:'The title "Reap What You Sow" appears as the moral at the end. If writing in English, which title would be most effective?', options:['"A Story About Phones"','"A Midnight Discovery" \u2014 creates mystery without spoiling the plot','"What Happened at Camp"','"Phone"'], correct:1, explain:'A good title creates intrigue. "A Midnight Discovery" makes the reader wonder.'},
  {qType:'Grammar \u00b7 Reap What You Sow', question:'"Her face alternating between red and white" describes embarrassment. What technique is this?', options:['Dialogue','Physical description showing emotions (show don\'t tell)','Flashback','Listing'], correct:1, explain:'Face colour changes SHOW embarrassment without saying "she was embarrassed".'},
  {qType:'Grammar \u00b7 Reap What You Sow', question:'How could dialogue improve the scene where Xiaowen is caught?', options:['It can\'t','Adding Xiaowen stammering an excuse: "I-I was just... checking the time..." shows her panic more vividly','Add a long speech','Have everyone talk at once'], correct:1, explain:'Short, stammered dialogue captures the moment perfectly.'},
  {qType:'Grammar \u00b7 Camping Scare', question:'"When I open the box of memories" uses present tense. The rest is past tense. Is this a mistake?', options:['Yes \u2014 all tenses should match','No \u2014 the "frame" (present) wraps around the "story" (past). This is a valid narrative technique.','Only past tense is allowed','It doesn\'t matter'], correct:1, explain:'Using present tense for the opening frame and past tense for the story is a sophisticated technique called "framing".'},
  {qType:'Grammar \u00b7 Camping Scare', question:'"as anxious as an ant on a hot pan" \u2014 this Chinese-origin simile is:', options:['Too informal for PSLE','Effective \u2014 cross-cultural idioms add flavour and show bilingual awareness','A grammar error','Too long'], correct:1, explain:'This idiom from Chinese works beautifully in English too. Bilingual idioms are a strength!'},
  {qType:'Grammar \u00b7 Camping Scare', question:'The essay builds suspense with: sound \u2192 shaking bushes \u2192 dark shadow \u2192 reveal (elephant). Which element is MOST critical?', options:['The sound','Delaying the reveal \u2014 keeping the reader guessing creates maximum tension','The dark shadow','The elephant'], correct:1, explain:'Suspense = delayed information. By not naming the elephant immediately, the reader\'s imagination fills in something scarier.'},
  {qType:'Grammar \u00b7 Camping Scare', question:'"W-What\u2026 what was that sound?" The stammering shows:', options:['A spelling mistake','Fear through HOW the character speaks, not just what they say','Poor vocabulary','The character is cold'], correct:1, explain:'Stammering in dialogue is advanced characterisation.'},
  {qType:'Grammar \u00b7 Camping Scare', question:'"My heart leapt into my throat, and my mind went blank." Identify BOTH techniques:', options:['Two metaphors','Idiom (heart in throat) + metaphor (mind went blank) \u2014 both show extreme fear physically','Two similes','Alliteration'], correct:1, explain:'"Heart leapt into my throat" is an idiom for extreme fear. "Mind went blank" is a metaphor for shock.'},
  {qType:'Grammar \u00b7 Camping Scare', question:'The ending says: "when danger strikes, we must never panic." How could this be made stronger?', options:['Make it shorter','Connect it to a specific moment: "If I had panicked and run blindly, Xiaole might not have been found in time"','Add more facts','Remove the moral entirely'], correct:1, explain:'Linking the moral to a specific story event makes it concrete and personal.'},
  {qType:'Grammar \u00b7 Maldives', question:'"The sea shimmered like a blanket of diamonds under the sunlight." Identify the technique:', options:['Metaphor','Simile \u2014 uses "like" to compare the sea to diamonds','Personification','Alliteration'], correct:1, explain:'The word "like" signals a simile. Comparing shimmering sea to diamonds creates a vivid, sparkling image.', excerpt:'"The sea <span class="hl-technique">shimmered like a blanket of diamonds</span> under the sunlight."'},
  {qType:'Grammar \u00b7 Maldives', question:'"resembling a magnificent palette painted by nature itself" \u2014 what makes this effective?', options:['It uses big words','It combines a metaphor (palette) with personification (nature as painter)','It is very long','It has alliteration'], correct:1, explain:'The ocean colours are compared to a painter\'s palette (metaphor), and nature is given the human ability to paint (personification). Double technique!', excerpt:'"...resembling a <span class="hl-technique">magnificent palette painted by nature itself</span>"'},
  {qType:'Grammar \u00b7 Maldives', question:'"I was both frightened and fascinated." Why is this more effective than "I was scared"?', options:['It has more words','Contrasting emotions (frightened + fascinated) show complex, realistic feelings','It sounds more formal','Alliteration makes it better'], correct:1, explain:'Real emotions are rarely simple. Showing CONFLICTING feelings ("both...and") makes characters feel three-dimensional and authentic.', excerpt:'"I was <span class="hl-technique">both frightened and fascinated</span>."'},
  {qType:'Grammar \u00b7 Maldives', question:'"I felt as though a part of me had remained beneath the sea." This sentence demonstrates:', options:['Exaggeration for humour','Deep emotional reflection \u2014 the narrator feels permanently changed by the experience','A factual statement','Foreshadowing'], correct:1, explain:'This is introspective writing at its best. It shows the experience was so profound it left a lasting impact. Examiners love this depth!', excerpt:'"I felt as though <span class="hl-technique">a part of me had remained beneath the sea</span>."'},
  {qType:'Grammar \u00b7 Maldives', question:'The Maldives essay covers many activities across several days. For a timed PSLE exam, what would improve it?', options:['Add even more activities','Focus on 2-3 key moments and develop them with dialogue and sensory details','Remove all descriptions','Write only about the flight'], correct:1, explain:'Depth over breadth! Pick 2-3 most dramatic moments (e.g., the dive + nurse sharks) and add dialogue, senses, and inner thoughts.'},
  {qType:'Grammar \u00b7 Maldives', question:'"fishing requires both patience and focus. If one becomes restless or distracted, the fish will simply swim away." How does the grandfather\'s advice function in the narrative?', options:['It fills word count','It adds wisdom and foreshadows the narrator\'s eventual success through patience','It is irrelevant','It shows the grandfather is a fisherman'], correct:1, explain:'Quoting an elder\'s wisdom serves dual purpose: it adds depth to the narrative AND foreshadows the lesson the narrator learns. Excellent technique!'}
];

var Q_PSLE = [
  {qType:'PSLE \u00b7 PAC Analysis', question:'You are writing to the school principal about a broken playground slide. What is the PURPOSE?', options:['To entertain with a story','To complain and request a repair','To describe your favourite game','To invite the principal to play'], correct:1, explain:'The purpose is to inform about the problem and request action (repair).'},
  {qType:'PSLE \u00b7 PAC Analysis', question:'Your friend Sarah missed the school carnival. You are emailing her. Who is the AUDIENCE?', options:['Your teacher','The school principal','Your friend Sarah','All students'], correct:2, explain:'Sarah is your audience \u2014 a friend. Tone should be informal and warm.'},
  {qType:'PSLE \u00b7 PAC Analysis', question:'"You are the Head Prefect. Write a formal letter to parents inviting them to Sports Day." What is your CONTEXT?', options:['A regular student','A parent','The Head Prefect','The PE teacher'], correct:2, explain:'Context tells you WHO you are writing as. As Head Prefect, your tone should be respectful and authoritative.'},
  {qType:'PSLE \u00b7 PAC Analysis', question:'Writing an article for the school newsletter about saving water. What type of audience?', options:['A specific friend','One teacher','A wider/general audience','Just yourself'], correct:2, explain:'An article targets a wide audience. Use an engaging, lively tone!'},
  {qType:'PSLE \u00b7 PAC Analysis', question:'A prompt asks you to write a report about a class outing to the zoo. What is the purpose?', options:['To persuade people to visit','To inform about what happened','To apologize','To invite friends'], correct:1, explain:'A report\'s purpose is to inform \u2014 describe what took place, including key details.'},
  {qType:'PSLE \u00b7 Format', question:'For an ARTICLE on a school website, which opening is BEST?', options:['Dear students and teachers,','Have you ever wondered how small actions can make a BIG difference?','Dear Sir/Madam,','Hi everyone!'], correct:1, explain:'Articles grab attention with a hook \u2014 a question, fun fact, or bold statement.'},
  {qType:'PSLE \u00b7 Format', question:'In an informal email to your friend, which sign-off fits?', options:['Yours faithfully,','Yours sincerely,','See you soon!','Best regards, (full name)'], correct:2, explain:'"See you soon!" is warm and casual \u2014 perfect for a friend.'},
  {qType:'PSLE \u00b7 Format', question:'When writing "Yours sincerely", which capitalisation is correct?', options:['"Yours Sincerely" (both caps)','"yours sincerely" (both lower)','"Yours sincerely" (only Y cap)','"YOURS SINCERELY"'], correct:2, explain:'Only "Yours" is capitalised. The "s" in "sincerely" must be lowercase.'},
  {qType:'PSLE \u00b7 Format', question:'You know the recipient\'s name is Mr Tan. Which combination is correct?', options:['Dear Sir + Yours faithfully','Dear Mr Tan + Yours sincerely','Dear Mr Tan + Yours faithfully','Hey Mr Tan + Yours sincerely'], correct:1, explain:'Know the name \u2192 "Dear Mr Tan" + "Yours sincerely".'},
  {qType:'PSLE \u00b7 Format', question:'What is special about the 2025/2026 PSLE article format?', options:['It needs a greeting','It\'s for a wider audience and needs an engaging tone','It must be handwritten','It\'s always informal'], correct:1, explain:'Articles target a broader readership. Use a lively, engaging or persuasive style.'},
  {qType:'PSLE \u00b7 Tone', question:'Which sentence uses FORMAL tone correctly?', options:['Hey, the food court is super gross!','I would like to highlight a hygiene concern regarding the school canteen.','OMG the canteen food is terrible lol','Yo, can someone clean the canteen?'], correct:1, explain:'Formal tone is polite, respectful, and uses complete sentences.'},
  {qType:'PSLE \u00b7 Tone', question:'Emailing your best friend about a birthday party. Which opening fits?', options:['Dear Sir/Madam, I am writing to inform you...','To Whom It May Concern,','Hey Mei Ling! Guess what?','I wish to bring to your attention...'], correct:2, explain:'For a friend, be warm and casual!'},
  {qType:'PSLE \u00b7 Tone', question:'You are the class monitor writing a report to the teacher. Which phrase fits?', options:['So basically what happened was...','I would like to report that...','OMG you won\'t believe this...','Guess what happened today!'], correct:1, explain:'A report to a teacher needs a respectful, formal tone.'},
  {qType:'PSLE \u00b7 Tone', question:'Which sign-off MISMATCHES a formal letter to a company?', options:['"Yours faithfully, John"','"Yours sincerely, John"','"Cheers! John"','"Thank you for your attention."'], correct:2, explain:'"Cheers!" is far too casual for a formal letter.'},
  {qType:'PSLE \u00b7 Tone', question:'For a school magazine article, which style is BEST?', options:['Very formal with complex vocabulary','Casual with lots of emojis','Engaging and lively, like talking to peers','Academic like a research paper'], correct:2, explain:'Articles for a school audience should be engaging and relatable.'},
  {qType:'PSLE \u00b7 Critical Thinking', question:'The underlined content point in PSLE requires you to:', options:['Copy from the visual stimulus','Think of an answer yourself \u2014 it\'s not given in the stimulus','Skip it','Write anything random'], correct:1, explain:'The underlined point requires CRITICAL THINKING \u2014 the answer is NOT in the stimulus.'},
  {qType:'PSLE \u00b7 Critical Thinking', question:'Beach cleanup poster. Underlined: "Suggest what volunteers should bring." Best answer?', options:['Favourite toys','Gloves, water bottles, sunscreen \u2014 since it\'s an outdoor beach activity','Homework','A blanket for a picnic'], correct:1, explain:'Hunt clues: outdoor + beach + picking up litter \u2192 gloves, water, sunscreen.'},
  {qType:'PSLE \u00b7 Critical Thinking', question:'What is the 3-step method for the underlined critical thinking point?', options:['Read \u2192 Write \u2192 Check','Star the Point \u2192 Hunt for Clues \u2192 Draw a Logical Conclusion','Copy \u2192 Paste \u2192 Edit','Skip \u2192 Guess \u2192 Hope'], correct:1, explain:'Star it, Hunt clues from the stimulus, then Draw a logical conclusion.'},
  {qType:'PSLE \u00b7 Critical Thinking', question:'Eco-Week poster. Underlined: "Suggest how to continue being eco-friendly." Best answer?', options:['Cancel all future events','Set up recycling bins in every classroom and appoint eco-monitors','Buy more air conditioners','Let students skip school'], correct:1, explain:'Your answer should be sustainable and ongoing. Recycling bins + monitors = practical + lasting.'},
  {qType:'PSLE \u00b7 Call-to-Action', question:'Formal complaint about a faulty product. Which CTA ending is BEST?', options:['Fix it now or else!','I hope you will look into this matter and arrange for a replacement at your earliest convenience.','Whatever, I give up.','Please reply ASAP!!!'], correct:1, explain:'A formal CTA should be polite but clear.'},
  {qType:'PSLE \u00b7 Call-to-Action', question:'Inviting your friend to a study group via email. Which CTA fits?', options:['Yours faithfully, I await your response.','Hope you can join us \u2014 it will be so much more fun with you there!','You MUST come. No excuses.','I would like to request your attendance.'], correct:1, explain:'For an informal email to a friend, the CTA should be warm and enthusiastic.'},
  {qType:'PSLE \u00b7 Call-to-Action', question:'An article about healthy eating. Which CTA ending works best?', options:['So, what are you waiting for? Start making healthier choices today!','The end.','Yours sincerely, Tom.','I hope the principal approves this.'], correct:0, explain:'Articles end with an inspiring CTA directed at readers.'},
  {qType:'PSLE \u00b7 GSP', question:'Which sentence has a grammar ERROR?', options:['The students enjoyed their trip.','She have been waiting for an hour.','We are looking forward to the concert.','The teacher reminded us to bring our materials.'], correct:1, explain:'"She have" \u2192 "She has". Subject-verb agreement!'},
  {qType:'PSLE \u00b7 GSP', question:'Which sentence has correct punctuation?', options:['Dear Mr Tan. I am writing to inform you.','Dear Mr Tan, I am writing to inform you.','Dear Mr Tan: I am writing, to inform you','Dear mr tan, i am writing to inform you.'], correct:1, explain:'After the salutation, use a COMMA. Proper nouns need capitals.'},
  {qType:'PSLE \u00b7 GSP', question:'Spot the spelling mistake:', options:['The environment needs our protection.','We should conserve water and electricty.','Recycling helps reduce waste.','Students can make a difference.'], correct:1, explain:'"Electricty" \u2192 "electricity".'},
