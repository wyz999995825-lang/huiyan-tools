{id:"x16",weak:"water-cycle",q:"Which of the following does NOT speed up evaporation?",opts:["Increasing humidity of surrounding air","Increasing temperature of the liquid","Increasing wind speed over the liquid","Increasing surface area of the liquid"],ans:0,hints:["💡 Think about what makes it HARDER for water to escape into the air.","🔑 If the air already has lots of water vapour (high humidity), it's harder for more water to evaporate into it."],explain:"High humidity means the air already contains a lot of water vapour, making it harder for more liquid water to evaporate. Temperature, wind, and surface area all SPEED UP evaporation."},
{id:"x17",weak:"matter-states",q:"During boiling, the temperature of water stays at 100°C even though heat is still being supplied. Why?",opts:["The heat energy is used to overcome forces between particles, not to raise temperature","The thermometer is broken at 100°C","Heat escapes to the surroundings at the same rate","Water cannot absorb more heat energy above 100°C"],ans:0,hints:["💡 The energy is going somewhere — if not into temperature, then what?","🔑 Energy is needed to break the bonds/forces between liquid particles to turn them into gas particles."],explain:"During boiling, the heat energy supplied is used entirely to overcome the attractive forces between water particles (changing them from liquid to gas), not to increase the kinetic energy of particles. So temperature remains constant."},
{id:"x18",weak:"water-cycle",q:"In the water cycle, what provides the main source of energy that drives evaporation from oceans and lakes?",opts:["The Sun","The Moon","Wind","Earth's core"],ans:0,hints:["💡 What is the biggest source of heat energy on Earth's surface?","🔑 The Sun heats the surface of water bodies, giving water particles enough energy to escape as vapour."],explain:"The Sun is the primary energy source driving the water cycle. Solar energy heats water in oceans, lakes, and rivers, providing particles with enough energy to evaporate and enter the atmosphere."},
{id:"x19",weak:"heat-transfer",q:"A metal spoon and a wooden spoon are both placed in a cup of hot water. After 2 minutes, the metal spoon feels much hotter. Why?",opts:["Metal is a better conductor of heat than wood","Metal absorbs more heat from the water","Wood does not allow any heat to pass through","Metal has a higher temperature than wood"],ans:0,hints:["💡 Both spoons are in the same hot water — think about how quickly heat travels through each material.","🔑 Conductors allow heat to travel through them quickly. Insulators slow heat transfer down."],explain:"Metal is a good conductor of heat, so heat from the hot water travels quickly through the metal spoon to your hand. Wood is a poor conductor (insulator), so heat travels much more slowly through the wooden spoon."},
{id:"x20",weak:"heat-transfer",q:"On a cold morning, a metal railing and a wooden bench are both at the same temperature (20°C). Why does the metal railing feel colder than the wooden bench when you touch them?",opts:["Metal conducts heat away from your hand faster than wood","Metal is actually at a lower temperature than wood","Your hand is confused by the shiny surface","Metal absorbs cold from the air better"],ans:0,hints:["💡 Both are the same temperature! So the difference must be about how fast heat LEAVES your hand.","🔑 Metal conducts heat away from your warm hand quickly, making your hand lose heat fast = feels cold."],explain:"Both are at 20°C, but metal is a better conductor than wood. When you touch metal, it conducts heat away from your warm hand (37°C) much faster than wood does. The rapid heat loss from your hand makes the metal FEEL colder, even though both objects are the same temperature."},
{id:"x21",weak:"fraction-parts",q:"Kelly spent 3/7 of her money and had $120 left. How much money did she have at first?",opts:["$280","$210","$180","$360"],ans:1,hints:["💡 If she spent 3/7, how many parts are LEFT?","🔑 She has 4/7 left. 4 units = $120. 1 unit = $30. Total = 7 × $30 = $210."],explain:"Spent 3/7, so 4/7 left = $120. 1 unit = $120 ÷ 4 = $30. Original = 7 × $30 = $210."},
{id:"x22",weak:"fraction-parts",q:"2/9 of the pupils in a school are in Primary 5. There are 54 pupils in Primary 5. How many pupils are there in the school altogether?",opts:["108","243","216","162"],ans:1,hints:["💡 2/9 of the school = 54 pupils. Find the value of 1 unit first.","🔑 2 units = 54. 1 unit = 27. Total = 9 × 27 = 243."],explain:"2 units = 54, so 1 unit = 27. Whole school = 9 × 27 = 243 pupils."},
{id:"x23",weak:"fraction-parts",q:"A rope is 180 cm long. It is cut into 4 equal pieces. What is the length of 3 such pieces? (in cm)",opts:["135","45","120","90"],ans:0,hints:["💡 Find the length of 1 piece first: 180 ÷ 4.","🔑 1 piece = 45 cm. 3 pieces = 3 × 45 = 135 cm."],explain:"1 piece = 180 ÷ 4 = 45 cm. 3 pieces = 3 × 45 = 135 cm."},
{id:"x24",weak:"fraction-parts",q:"4/5 of a number is 60. What is 3/4 of the same number?",opts:["56.25","75","45","80"],ans:0,hints:["💡 Step 1: Find the whole number. 4 units = 60, so 1 unit = 15, whole = 75.","🔑 Step 2: Find 3/4 of 75. 75 ÷ 4 = 18.75. 3 × 18.75 = 56.25."],explain:"4 units = 60, 1 unit = 15, whole = 5 × 15 = 75. Then 3/4 of 75: 75 ÷ 4 = 18.75, × 3 = 56.25."},
{id:"x25",weak:"fraction-parts",q:"Mrs Lee bought some eggs. She used 5/12 of them to bake cakes and had 42 eggs left. How many eggs did she buy?",opts:["72","60","84","96"],ans:0,hints:["💡 If she used 5/12, she has 7/12 left. 7/12 = 42 eggs.","🔑 7 units = 42. 1 unit = 6. Total = 12 × 6 = 72 eggs."],explain:"Used 5/12, so 7/12 left = 42. 1 unit = 42 ÷ 7 = 6. Total = 12 × 6 = 72 eggs."},
{id:"x26",weak:"spelling",q:"Choose the correct spelling:\nThe teacher asked us to bring the ________ supplies for art class.",opts:["neccessary","necessary","necesary","neccesary"],ans:1,hints:["💡 One 'c', double 's': ne-CES-sa-ry.","🔑 Remember: 1 Collar, 2 Socks → 1 c, 2 s's."],explain:"'Necessary' — one 'c' and double 's'. Mnemonic: 1 collar, 2 socks."},
{id:"x27",weak:"spelling",q:"Choose the correct spelling:\nThe school will be having a special ________ next Friday.",opts:["ocassion","occassion","occasion","ocasion"],ans:2,hints:["💡 Double 'c', single 's': oc-CA-sion.","🔑 2 c's but only 1 s: oc-ca-sion."],explain:"'Occasion' — double 'c', single 's'. Common mistake is doubling the 's' instead."},
{id:"x28",weak:"spelling",q:"Choose the correct spelling:\nWe visited an old ________ during our school trip.",opts:["cemetary","cematery","cemetery","cemetry"],ans:2,hints:["💡 It has three 'e's: c-E-m-E-t-E-ry.","🔑 Remember: three e's in a row separated by consonants."],explain:"'Cemetery' — c-e-m-e-t-e-r-y. All three vowels are 'e'."},
{id:"x29",weak:"spelling",q:"Choose the correct spelling:\nShe showed great ________ by finishing the marathon despite the heat.",opts:["perseverence","perseverance","persaverance","perserverance"],ans:1,hints:["💡 The ending is '-ance' not '-ence'.","🔑 per-se-VER-ance. The root is 'severe' + per- and -ance."],explain:"'Perseverance' ends in '-ance'. The middle part comes from 'severe'."},
{id:"x30",weak:"spelling",q:"Choose the correct spelling:\nThe ________ of the new playground made everyone happy.",opts:["developement","development","devlopment","devellopment"],ans:1,hints:["💡 'Develop' does NOT add an extra 'e' before '-ment'.","🔑 develop + ment = development. No extra letter in between!"],explain:"'Development' — develop + -ment directly. No extra 'e' in the middle."},
{id:"x31",weak:"water-cycle",q:"When you breathe out on a cold day, you can see a white mist. This happens because:",opts:["Water vapour in your breath condenses in the cold air","Your breath contains smoke particles","Cold air turns into water","The air outside is evaporating"],ans:0,hints:["💡 Your warm breath contains water vapour. What happens when warm water vapour meets cold air?","🔑 The cold air cools the water vapour below its dew point → condensation → visible mist."],explain:"Your warm breath contains water vapour. When it meets the cold surrounding air, the vapour cools rapidly and condenses into tiny water droplets, forming the visible mist."},
{id:"x32",weak:"water-cycle",q:"Which of these is the correct ORDER of processes in the water cycle?",opts:["Condensation → Evaporation → Precipitation","Evaporation → Condensation → Precipitation","Precipitation → Condensation → Evaporation","Evaporation → Precipitation → Condensation"],ans:1,hints:["💡 First water must go UP (become gas), then form clouds, then fall down.","🔑 Evaporation (liquid→gas) → Condensation (gas→liquid droplets/clouds) → Precipitation (water falls)."],explain:"Water evaporates from surfaces (liquid → gas), rises and condenses into clouds (gas → liquid droplets), then falls as precipitation (rain/snow). The correct order is Evaporation → Condensation → Precipitation."},
{id:"x33",weak:"water-cycle",q:"Why does a puddle of water disappear on a hot, windy day but stays for a long time on a cool, still day?",opts:["The wind blows the water away to another place","Heat and wind both speed up evaporation","The ground absorbs all the water on hot days","Cool air freezes the puddle so it stays longer"],ans:1,hints:["💡 What two factors affect how fast water evaporates?","🔑 Higher temperature gives water particles more energy to escape. Wind blows away humid air above the surface, allowing more evaporation."],explain:"Both high temperature and wind speed up evaporation. Heat gives water molecules more kinetic energy to escape as vapour, and wind removes the humid air layer above the puddle, allowing more molecules to escape."},
{id:"x34",weak:"water-cycle",q:"Transpiration is part of the water cycle. What is transpiration?",opts:["Rain falling from clouds onto land","Water flowing from rivers into the ocean","Loss of water vapour from plant leaves through stomata","Underground water rising to the surface"],ans:2,hints:["💡 'Trans-' relates to plants. Think about what plants release through their leaves.","🔑 Stomata are tiny pores on leaves. Water evaporates out through them = transpiration."],explain:"Transpiration is the process where water is absorbed by plant roots, travels up through the plant, and evaporates as water vapour from tiny pores (stomata) on the leaves into the atmosphere."},
{id:"x35",weak:"water-cycle",q:"A student covers a beaker of hot water with a cold glass plate. After a few minutes, water droplets appear on the underside of the plate. What caused this?",opts:["Water leaked through the glass plate","Water vapour from the hot water condensed on the cold plate surface","The glass plate melted and formed droplets","The cold plate attracted water from the air around it"],ans:1,hints:["💡 Hot water produces water vapour (steam). What happens when that vapour touches a cold surface?","🔑 Gas meets cold surface → cools down → changes back to liquid = condensation."],explain:"Water vapour (gas) rising from the hot water touches the cold glass plate. The cold surface cools the vapour, causing it to condense (change from gas to liquid) and form water droplets on the underside of the plate."},
{id:"x36",weak:"matter-states",q:"Which statement about LIQUIDS is correct?",opts:["Particles are far apart and move freely in all directions","Particles are closely packed and vibrate in fixed positions","Particles are close together but can slide over each other","Particles are arranged in a fixed, regular pattern"],ans:2,hints:["💡 Liquids have a definite volume but take the shape of their container. What does this tell you about the particles?","🔑 Close together (definite volume) but can move around (no fixed shape) = slide over each other."],explain:"In a liquid, particles are close together (giving definite volume) but are NOT in fixed positions — they can slide and move past each other, which is why liquids flow and take the shape of their container."},
{id:"x37",weak:"matter-states",q:"A student observes that ice cubes left on a table slowly become water, and later the water disappears. What are the TWO changes of state in order?",opts:["Condensation then evaporation","Melting then evaporation","Evaporation then condensation","Boiling then condensation"],ans:1,hints:["💡 Ice (solid) → water (liquid) → disappears (gas). Name each change.","🔑 Solid to liquid = melting. Liquid to gas = evaporation."],explain:"Ice cubes melt (solid → liquid) on the table, then the water evaporates (liquid → gas) into the air. The two changes are melting followed by evaporation."},
{id:"x38",weak:"matter-states",q:"Why does a gas fill the entire container it is placed in?",opts:["Gas particles are very heavy and sink to fill the space","Gas particles are far apart and move quickly in all directions","Gas particles are attracted to the walls of the container","Gas particles are arranged in a regular pattern that expands"],ans:1,hints:["💡 Think about the arrangement and movement of gas particles compared to solids and liquids.","🔑 Gas particles have lots of energy, are far apart, and move randomly in all directions — filling every corner."],explain:"Gas particles are far apart with weak attractive forces between them. They have high kinetic energy and move randomly in all directions, spreading out to fill the entire volume of any container they are placed in."},
{id:"x39",weak:"matter-states",q:"Naphthalene mothballs become smaller over time without melting. This change of state is called:",opts:["Evaporation","Condensation","Sublimation","Boiling"],ans:2,hints:["💡 The mothball goes from solid directly to gas, skipping the liquid stage. What is this called?","🔑 Solid → Gas directly (without becoming liquid first) = sublimation."],explain:"Sublimation is the change of state from solid directly to gas without passing through the liquid state. Naphthalene mothballs sublimate — the solid slowly turns into gas, making the mothball smaller over time."},
{id:"x40",weak:"matter-states",q:"A sealed plastic bottle is crushed when taken from a warm room to a freezer. Why?",opts:["The plastic becomes weaker in cold temperatures","The air particles inside slow down and move closer, reducing pressure inside the bottle","The freezer pushes the bottle from the outside","Cold air is heavier and crushes the bottle"],ans:1,hints:["💡 What happens to gas particles when they are cooled? Do they move faster or slower?","🔑 Cooled particles → less energy → move slower → hit walls less hard → lower pressure inside → outside air pressure crushes the bottle."],explain:"When cooled, the air particles inside the bottle lose kinetic energy and move slower. They collide with the bottle walls less frequently and with less force, reducing the internal pressure. The higher outside air pressure then crushes the bottle inward."},
{id:"x41",weak:"fraction-parts",fillin:true,q:"A farmer has some chickens and ducks. 3/8 of the birds are ducks. There are 50 more chickens than ducks. How many birds are there altogether?",opts:["200"],ans:0,hints:["💡 If 3/8 are ducks, then 5/8 are chickens. Difference = 5/8 - 3/8 = 2/8 of total.","🔑 2 units = 50. 1 unit = 25. Total = 8 × 25 = 200."],explain:"Ducks = 3/8, Chickens = 5/8. Difference = 5 units - 3 units = 2 units = 50. 1 unit = 25. Total birds = 8 × 25 = 200."},
{id:"x42",weak:"fraction-parts",fillin:true,q:"Ryan had some marbles. He gave 2/5 of them to Tom and 1/3 of the remainder to Sam. He then had 60 marbles left. How many marbles did Ryan have at first?",opts:["150"],ans:0,hints:["💡 After giving 2/5 to Tom, 3/5 remain. Sam gets 1/3 of the remainder, so 2/3 of remainder is left.","🔑 Left = 2/3 × 3/5 of original = 2/5 of original = 60. Original = 60 ÷ 2 × 5 = 150."],explain:"Tom: 2/5 of original. Remainder = 3/5. Sam: 1/3 of remainder = 1/3 × 3/5 = 1/5. Left = remainder - Sam = 3/5 - 1/5 = 2/5 = 60 marbles. Original = 60 ÷ 2 × 5 = 150."},
{id:"x43",weak:"fraction-parts",fillin:true,q:"A tank is 3/4 full of water. After pouring out 30 litres, it becomes 1/2 full. What is the full capacity of the tank in litres?",opts:["120"],ans:0,hints:["💡 The difference between 3/4 full and 1/2 full is the 30 litres poured out.","🔑 3/4 - 1/2 = 1/4 of the tank = 30 litres. Full capacity = 30 × 4 = 120 litres."],explain:"3/4 - 1/2 = 3/4 - 2/4 = 1/4 of tank capacity. 1/4 of capacity = 30 litres. Full capacity = 30 × 4 = 120 litres."},
{id:"x44",weak:"strategy",fillin:true,q:"A triangle has a base of 16 cm and a height of 9 cm. What is its area in cm²?",opts:["72"],ans:0,hints:["💡 Area of triangle = 1/2 × base × height.","🔑 1/2 × 16 × 9 = 72 cm²."],explain:"Area of triangle = 1/2 × base × height = 1/2 × 16 × 9 = 72 cm²."},
{id:"x45",weak:"strategy",fillin:true,q:"A rectangular tank measures 40 cm by 25 cm by 30 cm. It is filled with water to a height of 20 cm. What is the volume of water in the tank in cm³?",opts:["20000"],ans:0,hints:["💡 Volume = length × width × height of water (not full height!).","🔑 40 × 25 × 20 = 20000 cm³."],explain:"Volume of water = 40 × 25 × 20 = 20,000 cm³. Note: we use 20 cm (water height), not 30 cm (tank height)."},
{id:"x46",weak:"strategy",fillin:true,q:"A cube has a volume of 125 cm³. What is the length of one edge of the cube in cm?",opts:["5"],ans:0,hints:["💡 Volume of cube = edge × edge × edge. What number cubed gives 125?","🔑 5 × 5 × 5 = 125. So edge = 5 cm."],explain:"Volume of cube = edge³. Since 5³ = 5 × 5 × 5 = 125, the edge length is 5 cm."},
{id:"x47",weak:"spelling",fillin:true,fillinText:true,q:"Fill in the correct spelling:\nThe students showed great ________ when they completed the difficult project without giving up.\n(Hint: starts with 'p', means never giving up)",opts:["perseverance"],ans:0,hints:["💡 per-se-VER-ance. The ending is '-ance' not '-ence'.","🔑 Think of 'severe' in the middle: per-SEVERE-ance."],explain:"'Perseverance' means continued effort despite difficulties. Remember: per-se-ver-ance (ending in -ance)."},
{id:"x48",weak:"spelling",fillin:true,fillinText:true,q:"Fill in the correct spelling:\nWe need to buy all the ________ ingredients before we start baking.\n(Hint: means 'needed/required', has 1 'c' and 2 's')",opts:["necessary"],ans:0,hints:["💡 ne-CES-sa-ry. One 'c', double 's'.","🔑 Memory trick: a shirt has 1 Collar and 2 Sleeves = 1c, 2s."],explain:"'Necessary' — one 'c' and double 's'. Mnemonic: 1 collar (c), 2 sleeves (ss)."},
{id:"x49",weak:"spelling",fillin:true,fillinText:true,q:"Fill in the correct spelling:\nThe school is planning a special ________ for National Day.\n(Hint: a special event, has 2 'c' and 1 's')",opts:["occasion"],ans:0,hints:["💡 oc-CA-sion. Double 'c' but only one 's'.","🔑 2 c's, 1 s. Don't double the 's'!"],explain:"'Occasion' — double 'c', single 's'. The common mistake is writing 'occassion' (double s)."},
{id:"x50",weak:"synthesis",q:"Combine using 'not only...but also':\n'The food was delicious. The service was excellent.'",opts:["Not only was the food delicious, but the service was also excellent.","Not only the food was delicious, but also the service was excellent.","The food was not only delicious but also the service was excellent.","Not only was the food delicious but also excellent service."],ans:0,hints:["💡 'Not only' at the start causes inversion: Not only + was + subject + adjective.","🔑 Pattern: Not only was [first thing], but [second thing] was also [adjective]."],explain:"When 'Not only' starts a sentence, inversion occurs (was comes before subject). 'But also' introduces the second positive point."},
{id:"x51",weak:"synthesis",q:"Rewrite using 'too...to':\n'The box was very heavy. The boy could not carry it.'",opts:["The box was too heavy for the boy to carry.","The box was too heavy for the boy to carry it.","The boy was too heavy to carry the box.","The box was too heavy that the boy could not carry."],ans:0,hints:["💡 'too + adjective + for someone + to + verb'. No need to repeat 'it' at the end.","🔑 The box was too heavy for the boy to carry. (Drop 'it' — it's understood.)"],explain:"'Too...to' pattern: Subject + was + too + adjective + for + person + to + verb. We drop 'it' at the end because it's redundant (the box is already the subject)."},
{id:"x52",weak:"cloze",fillin:true,fillinText:true,q:"Fill in ONE word:\nThe students were ________ to hear that the school trip had been cancelled due to the heavy rain.\n(Hint: feeling unhappy/let down)",opts:["disappointed"],ans:0,hints:["💡 They expected the trip but it was cancelled — how would they feel?","🔑 Dis-ap-POINT-ed: feeling let down when something expected doesn't happen."],explain:"'Disappointed' — feeling unhappy because something hoped for didn't happen. The cancellation of an expected trip causes disappointment."},
{id:"x53",weak:"water-cycle",fillin:true,fillinText:true,q:"Name the process: Water vapour in the air changes into tiny water droplets when it cools. This process is called ________.",opts:["condensation"],ans:0,hints:["💡 Gas → liquid. This is the reverse of evaporation.","🔑 Con-den-SA-tion. Water vapour condenses into droplets."],explain:"Condensation is the process where water vapour (gas) cools and changes into liquid water droplets. This forms clouds in the sky and dew on surfaces."},
{id:"x54",weak:"water-cycle",fillin:true,fillinText:true,q:"Name the process: Water from plant leaves escapes into the air as water vapour through tiny pores. This is called ________.",opts:["transpiration"],ans:0,hints:["💡 This is how plants release water — through stomata on their leaves.","🔑 Trans-pir-A-tion. 'Trans' = through, from plants."],explain:"Transpiration is the loss of water vapour from plant leaves through stomata (tiny pores). It is part of the water cycle."},
{id:"x55",weak:"matter-states",fillin:true,fillinText:true,q:"Name the process: A solid changes directly into a gas without first becoming a liquid. This is called ________.",opts:["sublimation"],ans:0,hints:["💡 Solid → Gas directly, skipping liquid. Like mothballs getting smaller.","🔑 Sub-lim-A-tion. Example: dry ice (solid CO₂) turning into gas."],explain:"Sublimation is the process where a solid changes directly into a gas without passing through the liquid state. Examples: mothballs, dry ice."},
{id:"x56",weak:"water-cycle",q:"A student notices that clothes dry faster on a windy day than on a still day. Which explanation is correct?",opts:["Wind carries away the water vapour near the clothes, allowing more water to evaporate","Wind heats up the clothes","Wind turns water directly into ice","Wind pushes water back into the clothes"],ans:0,hints:["💡 What does wind do to the layer of humid air near the wet clothes?","🔑 Wind removes saturated air → more room for water molecules to escape → faster evaporation."],explain:"Wind blows away the layer of water vapour (humid air) that forms above the wet clothes. This allows more water molecules to escape from the surface of the clothes into the drier air, speeding up evaporation."},
{id:"x57",weak:"matter-states",q:"Which row correctly shows the properties of the three states of matter?",opts:["Solid: fixed shape, fixed volume | Liquid: no fixed shape, fixed volume | Gas: no fixed shape, no fixed volume","Solid: no fixed shape, fixed volume | Liquid: fixed shape, no fixed volume | Gas: no fixed shape, fixed volume","Solid: fixed shape, no fixed volume | Liquid: no fixed shape, fixed volume | Gas: fixed shape, no fixed volume","Solid: fixed shape, fixed volume | Liquid: fixed shape, fixed volume | Gas: no fixed shape, fixed volume"],ans:0,hints:["💡 Solids keep their shape and volume. Liquids keep volume but flow into container shape. Gases fill everything.","🔑 Only solids have BOTH fixed shape AND fixed volume. Gases have NEITHER."],explain:"Solid = fixed shape + fixed volume (particles locked in place). Liquid = no fixed shape + fixed volume (particles slide). Gas = no fixed shape + no fixed volume (particles fly everywhere)."},
{id:"x58",weak:"matter-states",q:"Why can you smell perfume from across the room even though no one sprayed it near you?",opts:["Perfume particles in the gas state move freely and spread out in all directions (diffusion)","The air pushes perfume towards you","Perfume is magnetic and attracts your nose","Perfume changes from liquid to solid in the air"],ans:0,hints:["💡 The perfume evaporates into gas particles. What do gas particles do?","🔑 Gas particles move randomly in all directions and spread out — this is called diffusion."],explain:"Perfume evaporates into gas particles which have high kinetic energy and move randomly in all directions. They spread from an area of high concentration to low concentration (diffusion), eventually reaching your nose across the room."},
{id:"x59",weak:"heat-transfer",q:"A Thermos flask keeps hot drinks hot and cold drinks cold. How does it reduce heat loss by conduction?",opts:["It uses a vacuum between the inner and outer walls — no particles means no conduction","It is painted in dark colours to absorb heat","It uses metal walls which are good conductors","The lid is made of glass to reflect heat"],ans:0,hints:["💡 Conduction needs particles touching each other to transfer heat. What has NO particles?","🔑 A vacuum = empty space = no particles = heat cannot conduct through it."],explain:"Conduction requires particles to be in contact to transfer heat energy. The vacuum (empty space) between the double walls of a Thermos flask contains no particles, so heat cannot be conducted across the gap."},
{id:"x60",weak:"heat-transfer",q:"On a sunny day, a car parked in the sun gets extremely hot inside even with all windows closed. How does the heat get INSIDE the car?",opts:["By radiation — heat from the sun travels through the glass as infrared waves","By conduction — heat travels through the air outside into the car","By convection — hot air rises and enters through gaps","By evaporation — the sun evaporates water into the car"],ans:0,hints:["💡 The sun's heat travels through space and glass. What type of heat transfer doesn't need particles?","🔑 Radiation can travel through glass and empty space. It's how the sun heats Earth."],explain:"The sun's heat reaches the car by radiation (infrared waves), which can travel through glass. Once inside, the heat is trapped because glass blocks infrared from escaping back out, making the car interior very hot."}
]
};

var STORAGE_KEY = 'j-wa2-r4';
var state;
function loadState() {
  try { state = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch(e) { state = null; }
  if (!state) state = { errBook:[], hearts:5, xp:0, streak:0, dayScores:{}, soundOn:true, eyeCare:false, qLog:{}, errRedo:{} };
  if (!state.qLog) state.qLog = {};
  if (!state.errRedo) state.errRedo = {};
  // 数据迁移：统一旧weak标签名
  var _tagMap = {'sci-water-cycle':'water-cycle','sci-states-of-matter':'matter-states','sci-heat-transfer':'heat-transfer','eng-synthesis':'synthesis','eng-cloze':'cloze','math-of-remainder':'of-confusion'};
  var _migrated = false;
  for(var _k in state.qLog) { var _w = state.qLog[_k].weak; if(_tagMap[_w]) { state.qLog[_k].weak = _tagMap[_w]; _migrated = true; } }
  if(_migrated) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){} }
  // 回填：如果有dayScores但qLog为空，从errBook+PLAN重建记录
  if (Object.keys(state.qLog).length === 0 && Object.keys(state.dayScores).length > 0) {
    var allQs = Q.math.concat(Q.eng).concat(Q.sci).concat(Q.sprint||[]);
    var qMap = {};
    for(var a=0;a<allQs.length;a++) qMap[allQs[a].id] = allQs[a];
    var errIds = {};
    for(var e=0;e<state.errBook.length;e++) errIds[state.errBook[e].id] = true;
    for(var p=0;p<PLAN.length;p++){
      var dKey = 'd'+PLAN[p].day;
      if(!state.dayScores[dKey]) continue;
      var qs = PLAN[p].qs;
      for(var qi=0;qi<qs.length;qi++){
        var qid = qs[qi];
        var qData = qMap[qid];
        var wasWrong = !!errIds[qid];
        state.qLog[qid] = {ok:!wasWrong, attempts:wasWrong?3:1, day:PLAN[p].day, weak:qData?qData.weak:'unknown', ts:0};
      }
    }
    saveState();
  }
}
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
loadState();

var audioCtx;
function getAudioCtx() { if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function playTone(freq, dur, type) {
  if(!state.soundOn) return;
  try {
    var ctx = getAudioCtx(); var o = ctx.createOscillator(); var g = ctx.createGain();
    o.type = type||'sine'; o.frequency.value = freq; g.gain.value = 0.12;
    o.connect(g); g.connect(ctx.destination); o.start(); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur); o.stop(ctx.currentTime+dur);
  } catch(e){}
}

function fireConfetti() {
  var canvas = document.getElementById('confetti');
  var ctx2 = canvas.getContext('2d');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  var particles = [];
  var colors = ['#58CC02','#1CB0F6','#FFC800','#FF4B4B','#A560E8','#FF9600'];
  for(var i=0;i<150;i++) {
    particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height-canvas.height,vx:(Math.random()-0.5)*8,vy:Math.random()*4+2,color:colors[Math.floor(Math.random()*colors.length)],size:Math.random()*8+4,rot:Math.random()*360});
  }
  var frames=0;
  function animate() {
    ctx2.clearRect(0,0,canvas.width,canvas.height);
    for(var j=0;j<particles.length;j++){
      var p=particles[j];
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.1; p.rot+=3;
      ctx2.save(); ctx2.translate(p.x,p.y); ctx2.rotate(p.rot*Math.PI/180);
      ctx2.fillStyle=p.color; ctx2.fillRect(-p.size/2,-p.size/2,p.size,p.size);
      ctx2.restore();
    }
    frames++;
    if(frames<120) requestAnimationFrame(animate);
    else ctx2.clearRect(0,0,canvas.width,canvas.height);
  }
  animate();
}

function exportReport() {
  var lines = [];
  lines.push('=== Johnson WA2 R3 学习报告 ===');
  lines.push('导出时间: ' + new Date().toLocaleString());
  lines.push('');

  // Day scores
  lines.push('--- 每日成绩 ---');
  for(var i=0;i<PLAN.length;i++){
    var d = PLAN[i];
    var sc = state.dayScores['d'+d.day];
    if(sc) lines.push('Day '+d.day+' ('+d.title+'): '+sc.correct+'/'+sc.total+' = '+sc.pct+'%');
    else lines.push('Day '+d.day+' ('+d.title+'): 未完成');
  }
  lines.push('');

  // Error book redo
  if(state.errRedo && state.errRedo.total) {
    lines.push('--- 错题本重做 ---');
    lines.push('结果: '+state.errRedo.correct+'/'+state.errRedo.total+' = '+state.errRedo.pct+'%');
    lines.push('');
  }

  // Per-question detail by weakness
  lines.push('--- 按弱点分类详情 ---');
  var byWeak = {};
  var keys = Object.keys(state.qLog);
  for(var k=0;k<keys.length;k++){
    var entry = state.qLog[keys[k]];
    var w = entry.weak || 'unknown';
    if(!byWeak[w]) byWeak[w] = {right:[], wrong:[]};
    if(entry.ok) byWeak[w].right.push(keys[k]+'('+entry.attempts+'次)');
    else byWeak[w].wrong.push(keys[k]+'('+entry.attempts+'次)');
  }
  var weakKeys = Object.keys(byWeak);
  for(var w=0;w<weakKeys.length;w++){
    var wk = weakKeys[w];
    var data = byWeak[wk];
    var total2 = data.right.length + data.wrong.length;
    var pct2 = total2>0 ? Math.round(data.right.length/total2*100) : 0;
    lines.push(wk+': '+data.right.length+'/'+total2+' ('+pct2+'%)');
    if(data.wrong.length>0) lines.push('  错: '+data.wrong.join(', '));
  }
  lines.push('');

  // Current error book
  lines.push('--- 当前错题本 ('+state.errBook.length+'题) ---');
  for(var e=0;e<state.errBook.length;e++){
    lines.push(state.errBook[e].id+': '+state.errBook[e].q.split('\n')[0].substring(0,60));
  }
  lines.push('');

  // Raw state for deep analysis
  lines.push('--- RAW DATA ---');
  lines.push(JSON.stringify({dayScores:state.dayScores, errRedo:state.errRedo, qLog:state.qLog, errBookIds:state.errBook.map(function(e){return e.id;}), xp:state.xp}));

  var report = lines.join('\n');
  try {
    navigator.clipboard.writeText(report).then(function(){
      showToast('已复制! 粘贴给Claude即可分析');
    });
  } catch(e) {
    // Fallback for older browsers
    var ta = document.createElement('textarea');
    ta.value = report;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('已复制! 粘贴给Claude即可分析');
  }
}

function showQuestion() {
  if(curIdx >= curQs.length) { showResults(); return; }
  var qData = getQ(curQs[curIdx]);
  if(!qData) { curIdx++; showQuestion(); return; }
  answered = false; selectedOpt = -1; curHintIdx = 0; curAttempts = 0;

  var pct = Math.round((curIdx/curQs.length)*100);
  var html = '<div class="topbar">';
  html += '<button class="back" onclick="confirmExit()">←</button>';
  html += '<span class="title">Q'+(curIdx+1)+'/'+curQs.length+'</span>';
  html += '<div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%"></div></div>';
  html += '<span class="hearts">❤️ '+state.hearts+'</span>';
  html += '<span class="xp">⭐ '+state.xp+'</span>';
  html += '</div>';

  html += '<div class="practice">';
  html += '<div class="q-card">';
  html += '<div class="q-label">'+qData.weak+' · '+qData.id+'</div>';
  html += '<div class="q-text">'+qData.q.replace(/\n/g,'<br>')+'</div>';

  if(qData.fillin) {
    var _ph = qData.fillinText ? 'Type the word...' : 'Type your answer (number)...';
    html += '<div class="fill-group"><input type="text" class="fill-input" id="fillInput" placeholder="'+_ph+'" autocomplete="off"></div>';
  } else {
    html += '<div class="mcq-options">';
    var keys = ['A','B','C','D'];
    for(var i=0;i<qData.opts.length;i++){
      html += '<div class="mcq-opt" id="opt'+i+'" onclick="selectOpt('+i+')">';
      html += '<span class="key">'+keys[i]+'</span>';
      html += '<span>'+qData.opts[i]+'</span></div>';
    }
    html += '</div>';
  }
  html += '</div>';

  html += '<div id="hintArea">';
  for(var h=0;h<qData.hints.length;h++){
    html += '<div class="hint-box" id="hint'+h+'">'+qData.hints[h]+'</div>';
  }
  html += '</div>';

  html += '<div id="feedbackArea"></div>';
  html += '<button class="check-btn primary" id="checkBtn" onclick="checkAnswer()" disabled>Check Answer <span class="kbd">Enter</span></button>';
  html += '</div>';
  app.innerHTML = html;

  if(qData.fillin) {
    var inp = document.getElementById('fillInput');
    inp.addEventListener('input', function(){ document.getElementById('checkBtn').disabled = !inp.value.trim(); });
    inp.focus();
  }
}

function selectOpt(i) {
  if(answered) return;
  sfxClick();
  selectedOpt = i;
  var opts = document.querySelectorAll('.mcq-opt');
  for(var j=0;j<opts.length;j++) opts[j].classList.remove('selected');
  document.getElementById('opt'+i).classList.add('selected');
  document.getElementById('checkBtn').disabled = false;
}

function checkAnswer() {
  var qData = getQ(curQs[curIdx]);
  if(!qData || answered) return;
  curAttempts++;
  var isCorrect = false;

  if(qData.fillin) {
    var userAns = document.getElementById('fillInput').value.trim();
    var correctAns = qData.opts[qData.ans];
    if(qData.fillinText) {
      isCorrect = (userAns.toLowerCase() === correctAns.toLowerCase());
    } else {
      isCorrect = (userAns.replace(/[^0-9.]/g,'') === correctAns.replace(/[^0-9.]/g,''));
    }
    var inp = document.getElementById('fillInput');
    inp.classList.add(isCorrect ? 'correct' : 'wrong');
  } else {
    isCorrect = (selectedOpt === qData.ans);
    if(isCorrect) document.getElementById('opt'+selectedOpt).classList.add('correct');
    else {
      document.getElementById('opt'+selectedOpt).classList.add('wrong');
    }
  }

  var canRetry = (!isCorrect && curAttempts < 3 && curHintIdx < qData.hints.length);

  if(isCorrect) {
    answered = true;
    sfxCorrect();
    state.xp += 10;
    curCorrect++;
    state.qLog[qData.id] = {ok:true, attempts:curAttempts, day:curDay, weak:qData.weak, ts:Date.now()};
    showFeedback(true, qData);
    showNextBtn();
  } else if(canRetry) {
    document.getElementById('hint'+curHintIdx).classList.add('show');
    curHintIdx++;
    sfxWrong();
    state.hearts = Math.max(0, state.hearts-1);
    document.getElementById('checkBtn').disabled = true;
    if(!qData.fillin) {
      selectedOpt = -1;
      setTimeout(function(){
        var os = document.querySelectorAll('.mcq-opt');
        for(var k=0;k<os.length;k++) os[k].classList.remove('selected','wrong','correct');
      }, 600);
    } else {
      setTimeout(function(){
        var inp2 = document.getElementById('fillInput');
        if(inp2){inp2.classList.remove('wrong'); inp2.value=''; inp2.focus();}
      },600);
    }
    showFeedback(false, qData, true);
  } else {
    answered = true;
    sfxWrong();
    state.hearts = Math.max(0, state.hearts-1);
    state.qLog[qData.id] = {ok:false, attempts:curAttempts, day:curDay, weak:qData.weak, ts:Date.now()};
    if(!qData.fillin) document.getElementById('opt'+qData.ans).classList.add('correct');
    var found=false;
    for(var e=0;e<state.errBook.length;e++){if(state.errBook[e].id===qData.id){found=true;break;}}
    if(!found) {
      state.errBook.push({id:qData.id, q:qData.q, correctAns:qData.opts[qData.ans], explain:qData.explain});
    }
    showFeedback(false, qData, false);
    showNextBtn();
  }
  saveState();
}

function showFeedback(correct, qData, canRetry) {
  var area = document.getElementById('feedbackArea');
  if(correct) {
    area.innerHTML = '<div class="feedback-box correct"><h4>✅ Correct!</h4><div class="explain">'+qData.explain.replace(/\n/g,'<br>')+'</div></div>';
  } else if(canRetry) {
    area.innerHTML = '<div class="feedback-box wrong"><h4>❌ Not quite — try again!</h4></div>';
  } else {
    area.innerHTML = '<div class="feedback-box wrong"><h4>❌ Incorrect</h4><p>Correct answer: <b>'+qData.opts[qData.ans]+'</b></p><div class="explain">'+qData.explain.replace(/\n/g,'<br>')+'</div></div>';
  }
}

function showResults() {

  var emoji = pct>=90?'🌟':pct>=70?'🎉':pct>=50?'👍':'💪';

  if(curDay>0) state.dayScores['d'+curDay] = {correct:curCorrect, total:total, pct:pct};
  if(curDay===0) state.errRedo = {correct:curCorrect, total:total, pct:pct, ts:Date.now()};
  saveState();

  if(pct >= 70) { sfxFanfare(); setTimeout(fireConfetti, 300); }

  var html = '<div class="results">';
  html += '<div class="emoji">'+emoji+'</div>';
  html += '<h2>'+(pct>=90?'Outstanding!':pct>=70?'Well Done!':pct>=50?'Good Effort!':'Keep Practicing!')+'</h2>';
  html += '<div class="pct" style="color:'+(pct>=70?'var(--green)':'var(--red)')+'">'+pct+'%</div>';
  html += '<div class="detail">'+curCorrect+' / '+total+' correct</div>';
  html += '<div class="btn-row">';
  if(curDay>0) html += '<button class="btn" onclick="startDay('+curDay+')">Retry</button>';
  html += '<button class="btn primary" onclick="showHome()">Home</button>';
  html += '</div></div>';
  app.innerHTML = html;
}

function showErrBook() {
  sfxClick();
  var html = '<div class="topbar"><button class="back" onclick="showHome()">←</button><span class="title">错题本 ('+state.errBook.length+')</span></div>';
  html += '<div class="errbook">';
  html += '<h2>错题本</h2>';
  if(state.errBook.length === 0) {
    html += '<p style="color:var(--text2);margin-top:20px">No wrong answers yet!</p>';
  } else {
    html += '<button class="check-btn primary" style="margin-bottom:16px;max-width:300px" onclick="redoErrBook()">Redo All Wrong Questions</button>';
    for(var i=0;i<state.errBook.length;i++){
      var item=state.errBook[i];
      html += '<div class="err-item">';
      html += '<div class="eq">'+item.q.replace(/\n/g,'<br>')+'</div>';
      html += '<div class="ea">✅ '+item.correctAns+'</div>';
      html += '</div>';
    }
  }
  html += '</div>';
  app.innerHTML = html;
}

function redoErrBook() {
  sfxClick();
  curDay = 0;
  curQs = [];
  for(var i=0;i<state.errBook.length;i++) curQs.push(state.errBook[i].id);
  curIdx = 0; curCorrect = 0; curAttempts = 0;
  state.hearts = 5;
  showQuestion();
}

// ═══════════════ KEYBOARD SHORTCUTS ═══════════════
document.addEventListener('keydown', function(e) {
  if(e.key === 'Escape') { if(curDay !== null && curQs.length) confirmExit(); }
  if(e.key === 'Enter') {
    e.preventDefault();
    var checkBtn = document.querySelector('.check-btn');
    if(checkBtn && !checkBtn.disabled) { checkBtn.click(); return; }
    var startBtn = document.querySelector('.start-btn');
    if(startBtn) { startBtn.click(); return; }
  }
  if(!answered && curQs.length && curIdx < curQs.length) {
    var qData = getQ(curQs[curIdx]);
    if(qData && !qData.fillin) {
      if(e.key >= '1' && e.key <= '4') selectOpt(parseInt(e.key)-1);
    }
  }
});

// ═══════════════ INIT ═══════════════
showHome();
</script>
</body>
</html>
