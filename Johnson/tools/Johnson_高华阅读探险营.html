<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🐾 高华阅读探险营 · Johnson</title>
<style>
/* ============ THEME: 护眼浅蓝 ============ */
:root{
  --bg:#eaf3fa; --bg2:#f2f8fd; --card:#ffffff;
  --primary:#4a90c2; --primary-dark:#2e6da4;
  --green:#3aa876; --green-pale:#e3f4ec;
  --warm:#f0a94b; --warm-pale:#fdf1e0;
  --orange-soft:#fbeedd; --orange-text:#b0742a;
  --text:#2b3a46; --muted:#6b8299;
  --line:#d7e6f2;
  --radius:18px;
  --shadow:0 4px 14px rgba(74,144,194,.12);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:linear-gradient(180deg,var(--bg2),var(--bg));
  color:var(--text);
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:17px; line-height:1.7;
  min-height:100vh;
}
button{font-family:inherit; cursor:pointer;}
#app{max-width:680px;margin:0 auto;padding:0 14px 60px;}

/* ============ TOP BAR ============ */
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(242,248,253,.92);backdrop-filter:blur(8px);
  display:flex;align-items:center;gap:10px;
  padding:10px 4px;border-bottom:1px solid var(--line);
  margin:0 -14px 12px;padding-left:16px;padding-right:16px;
}
.topbar .stat{
  display:flex;align-items:center;gap:5px;
  background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:6px 13px;font-weight:700;font-size:15px;
  box-shadow:var(--shadow);min-height:44px;
}
.stat .num{color:var(--primary-dark);}
.stat.warm .num{color:var(--warm);}
.spacer{flex:1;}
.toolbox-btn{
  position:relative;background:var(--card);border:1px solid var(--line);
  border-radius:999px;min-width:48px;min-height:44px;font-size:20px;
  box-shadow:var(--shadow);
}
.toolbox-btn .badge{
  position:absolute;top:-6px;right:-6px;background:var(--warm);color:#fff;
  font-size:12px;font-weight:800;border-radius:999px;min-width:20px;height:20px;
  display:flex;align-items:center;justify-content:center;padding:0 5px;
}

/* ============ HOME ============ */
.hero{text-align:center;margin:6px 0 4px;}
.hero h1{font-size:24px;margin:6px 0 2px;color:var(--primary-dark);}
.hero .sub{color:var(--muted);font-size:15px;margin:0;}
.mascot-row{
  display:flex;align-items:flex-start;gap:10px;
  margin:14px 0 6px;
}
.mascot{font-size:44px;line-height:1;flex-shrink:0;animation:bob 2.6s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.bubble{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  border-top-left-radius:4px;padding:10px 15px;box-shadow:var(--shadow);
  font-size:15.5px;flex:1;
}

/* adventure path */
.path{position:relative;margin:22px 0 10px;padding:8px 0;}
.path-line{
  position:absolute;left:50%;top:0;bottom:0;width:6px;transform:translateX(-50%);
  background:repeating-linear-gradient(180deg,var(--line) 0 14px,transparent 14px 26px);
  border-radius:3px;
}
.node-row{position:relative;display:flex;margin:16px 0;min-height:92px;align-items:center;}
.node-row.left{justify-content:flex-start;padding-left:6%;}
.node-row.right{justify-content:flex-end;padding-right:6%;}
.node{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  background:none;border:none;padding:4px;min-width:96px;
}
.node .circle{
  width:74px;height:74px;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;color:#fff;
  box-shadow:0 5px 0 rgba(0,0,0,.10), var(--shadow);
  transition:transform .15s;position:relative;
}
.node:active .circle{transform:scale(.94);}
.node.locked .circle{background:#c3d2df;color:#7d93a6;box-shadow:0 5px 0 rgba(0,0,0,.06);}
.node.current .circle{background:linear-gradient(160deg,var(--primary),var(--primary-dark));}
.node.current .circle::after{
  content:"";position:absolute;inset:-8px;border-radius:50%;
  border:3px solid var(--primary);opacity:.6;animation:pulse 1.6s ease-out infinite;
}
@keyframes pulse{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.18);opacity:0}}
.node.done .circle{background:linear-gradient(160deg,#53bb8c,var(--green));}
.node .emoji{font-size:20px;line-height:1;}
.node .dnum{font-size:13px;line-height:1.2;}
.node .stars{font-size:13px;letter-spacing:1px;height:16px;color:var(--warm);}
.node .ntitle{
  font-size:13px;color:var(--muted);max-width:150px;text-align:center;line-height:1.35;
}
.node.current .ntitle{color:var(--primary-dark);font-weight:700;}

/* skill thermometer */
.panel{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:16px 18px;margin:18px 0;
}
.panel h3{margin:0 0 10px;font-size:17px;color:var(--primary-dark);}
.skill-row{display:flex;align-items:center;gap:10px;margin:9px 0;}
.skill-name{width:110px;font-size:14.5px;flex-shrink:0;}
.skill-bar{flex:1;height:12px;background:var(--bg);border-radius:999px;overflow:hidden;}
.skill-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#7db8de,var(--primary));transition:width .6s;}
.skill-pct{width:52px;text-align:right;font-size:13px;color:var(--muted);flex-shrink:0;}
.footer-note{text-align:center;color:var(--muted);font-size:13.5px;margin-top:22px;}

/* ============ LESSON ============ */
.lesson-top{display:flex;align-items:center;gap:10px;margin:8px 0 14px;}
.back-btn{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  min-width:44px;min-height:44px;font-size:18px;color:var(--muted);box-shadow:var(--shadow);
}
.progress-wrap{flex:1;height:14px;background:#d9e8f4;border-radius:999px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,#66d19e,var(--green));border-radius:999px;transition:width .45s;}
.kicker{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.type-badge{
  background:var(--primary);color:#fff;font-size:13.5px;font-weight:700;
  border-radius:999px;padding:3px 12px;
}
.type-badge.build{background:#8a6fc8;}
.type-badge.write{background:var(--warm);}
.kicker .count{color:var(--muted);font-size:14px;font-weight:700;}
.ribbon{
  background:linear-gradient(90deg,var(--warm-pale),#fff8ec);
  border:1.5px dashed var(--warm);border-radius:14px;
  padding:10px 15px;margin:12px 0;font-size:16px;
}
.ribbon b{color:var(--orange-text);}
.passage{
  background:var(--card);border-left:5px solid var(--primary);
  border-radius:12px;padding:13px 16px;margin:10px 0 14px;
  font-size:17px;line-height:1.9;box-shadow:var(--shadow);
}
.qtext{font-size:18.5px;font-weight:700;margin:12px 0 14px;line-height:1.75;}

/* mcq options */
.opt{
  display:block;width:100%;text-align:left;
  background:var(--card);border:2px solid var(--line);border-radius:16px;
  padding:13px 16px;margin:10px 0;font-size:16.5px;line-height:1.65;color:var(--text);
  min-height:52px;box-shadow:var(--shadow);transition:transform .1s,border-color .15s,background .2s;
}
.opt:active{transform:scale(.985);}
.opt.sel-correct{border-color:var(--green);background:var(--green-pale);}
.opt.sel-wrong{border-color:var(--warm);background:var(--orange-soft);opacity:.85;}
.opt.reveal-correct{border-color:var(--green);background:var(--green-pale);}
.opt:disabled{cursor:default;}
.opt .letter{
  display:inline-flex;width:26px;height:26px;border-radius:50%;
  background:var(--bg);color:var(--primary-dark);font-weight:800;font-size:14px;
  align-items:center;justify-content:center;margin-right:9px;vertical-align:-6px;
}

/* build */
.assembly{
  min-height:64px;background:var(--card);border:2px dashed var(--primary);
  border-radius:16px;padding:10px;margin:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
}
.assembly .placeholder{color:var(--muted);font-size:14.5px;padding:6px 8px;}
.chunk-pool{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0;}
.chunk{
  background:var(--card);border:2px solid var(--line);border-radius:14px;
  padding:10px 15px;font-size:16.5px;min-height:46px;box-shadow:var(--shadow);
  color:var(--text);transition:transform .1s;
}
.chunk:active{transform:scale(.95);}
.chunk.in-zone{border-color:var(--primary);background:#eef6fc;}
.chunk.ghost{visibility:hidden;}
.shake{animation:shake .45s;}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* write */
.field-cards{display:flex;flex-direction:column;gap:8px;margin:12px 0;}
.field-card{
  background:var(--card);border:2px solid var(--line);border-radius:14px;
  padding:9px 14px;font-size:15.5px;display:flex;align-items:center;gap:9px;
  transition:border-color .25s,background .25s;
}
.field-card .mark{
  width:24px;height:24px;border-radius:50%;flex-shrink:0;
  background:var(--bg);display:flex;align-items:center;justify-content:center;
  font-size:14px;color:var(--muted);font-weight:800;
}
.field-card.pass{border-color:var(--green);background:var(--green-pale);}
.field-card.pass .mark{background:var(--green);color:#fff;animation:pop .35s;}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.chips-label{font-size:14px;color:var(--muted);margin:12px 0 6px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.chip{
  background:#eef6fc;border:1.5px solid #bcd9ee;color:var(--primary-dark);
  border-radius:999px;padding:8px 15px;font-size:15.5px;font-weight:600;min-height:40px;
  transition:transform .1s;
}
.chip:active{transform:scale(.92);}
textarea.answer{
  width:100%;min-height:120px;border:2px solid var(--line);border-radius:16px;
  padding:13px 15px;font-size:17px;line-height:1.85;font-family:inherit;color:var(--text);
  background:var(--card);resize:vertical;box-shadow:var(--shadow);
}
textarea.answer:focus{outline:none;border-color:var(--primary);}

/* action buttons */
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0;}
.btn{
  border:none;border-radius:16px;padding:13px 22px;font-size:16.5px;font-weight:700;
  min-height:50px;transition:transform .1s,opacity .2s;
}
.btn:active{transform:scale(.96);}
.btn.primary{background:linear-gradient(160deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:0 4px 0 #24587f;}
.btn.green{background:linear-gradient(160deg,#53bb8c,var(--green));color:#fff;box-shadow:0 4px 0 #2b8a5e;}
.btn.ghost{background:var(--card);border:2px solid var(--line);color:var(--primary-dark);}
.btn.warm{background:var(--warm-pale);border:2px solid var(--warm);color:var(--orange-text);}
.btn:disabled{opacity:.45;cursor:default;}

/* feedback banners */
.banner{
  border-radius:16px;padding:13px 17px;margin:14px 0;font-size:16px;line-height:1.7;
  animation:slideup .3s;
}
@keyframes slideup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.banner.good{background:var(--green-pale);border:2px solid var(--green);color:#1f6b4a;}
.banner.soft{background:var(--orange-soft);border:2px solid var(--warm);color:var(--orange-text);}
.banner.info{background:#eef6fc;border:2px solid #bcd9ee;color:var(--primary-dark);}
.banner .btitle{font-weight:800;font-size:17px;display:block;margin-bottom:3px;}
.hint-box,.model-box{
  border-radius:14px;padding:11px 15px;margin:10px 0;font-size:15.5px;animation:slideup .3s;
}
.hint-box{background:var(--warm-pale);border:1.5px dashed var(--warm);}
.model-box{background:#eef6fc;border:1.5px solid #bcd9ee;}
.model-box b{color:var(--primary-dark);}

/* intro & complete screens */
.center-card{
  background:var(--card);border:1px solid var(--line);border-radius:22px;
  box-shadow:var(--shadow);padding:26px 22px;text-align:center;margin:24px 0;
}
.center-card .big-emoji{font-size:64px;line-height:1.1;}
.center-card h2{color:var(--primary-dark);margin:10px 0 4px;font-size:22px;}
.center-card .sub{color:var(--muted);font-size:15.5px;margin:0 0 8px;}
.star-line{font-size:38px;letter-spacing:6px;margin:8px 0;}
.star-line .on{color:var(--warm);}
.star-line .off{color:#d8e4ee;}
.reward-line{font-size:17px;margin:6px 0;}
.reward-line b{color:var(--primary-dark);}

/* xp float + confetti */
.xp-float{
  position:fixed;left:50%;top:38%;transform:translateX(-50%);
  font-size:26px;font-weight:800;color:var(--warm);z-index:200;pointer-events:none;
  animation:xpfloat 1.2s ease-out forwards;text-shadow:0 2px 6px rgba(255,255,255,.9);
}
@keyframes xpfloat{0%{opacity:0;transform:translate(-50%,10px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-70px)}}
.confetti-piece{
  position:fixed;top:-14px;z-index:190;pointer-events:none;border-radius:3px;
  animation:cfall linear forwards;
}
@keyframes cfall{
  0%{transform:translateY(0) rotate(0deg);opacity:1}
  85%{opacity:1}
  100%{transform:translateY(105vh) rotate(560deg);opacity:0}
}

/* repair box */
.mistake-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:15px 17px;margin:12px 0;
}
.mistake-card.fixed{border-color:var(--green);background:var(--green-pale);}
.mistake-card .mq{font-weight:700;font-size:16px;margin-bottom:5px;}
.mistake-card .mrow{font-size:14.5px;color:var(--muted);margin:3px 0;line-height:1.6;}
.mistake-card .mrow b{color:var(--text);}
.fixed-tag{color:var(--green);font-weight:800;font-size:14.5px;}
.empty-box{text-align:center;color:var(--muted);padding:30px 10px;font-size:16px;}

@media (max-width:768px){
  #app{padding:0 10px 50px;}
  .node .circle{width:66px;height:66px;}
  .skill-name{width:96px;font-size:13.5px;}
}
</style>
</head>

function isYesterday(dateStr){
  if(!dateStr) return false;
  const y = new Date(); y.setDate(y.getDate()-1);
  const ys = y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
  return dateStr === ys;
}
function bumpStreak(){
  const t = todayStr();
  if(S.streak.lastDate === t) return;
  S.streak.count = isYesterday(S.streak.lastDate) ? S.streak.count+1 : 1;
  S.streak.lastDate = t;
}
function recordSkill(skill, firstTryCorrect){
  if(!S.skillStats[skill]) S.skillStats[skill] = {attempted:0, correct:0};
  S.skillStats[skill].attempted++;
  if(firstTryCorrect) S.skillStats[skill].correct++;
}
function addMistake(day, item, userAnswer){
  const entry = {
    key:item.id, dayId:day.id, prompt:item.prompt,
    passage:item.passage||"", answer:userAnswer||"（未作答）",
    model:item.model||"", why:item.why||"", skill:day.skill,
    type:item.type, repaired:false
  };
  const i = S.mistakes.findIndex(m=>m.key===item.id);
  if(i>=0){ entry.repaired=false; S.mistakes[i]=entry; } else S.mistakes.push(entry);
}
function findItemByKey(key){
  for(const d of DAYS) for(const it of d.items) if(it.id===key) return {day:d,item:it};
  return null;
}
function unrepairedCount(){ return S.mistakes.filter(m=>!m.repaired).length; }

function esc(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")

}

/* ================================================================
   EFFECTS — confetti, XP float
   ================================================================ */
function confetti(n){
  const colors = ["#4a90c2","#3aa876","#f0a94b","#8a6fc8","#7db8de","#f4c877"];
  n = n||36;
  for(let i=0;i<n;i++){
    const p = document.createElement("div");
    p.className = "confetti-piece";
    const size = 6+Math.random()*8;
    p.style.width = size+"px";
    p.style.height = (size*0.6)+"px";
    p.style.left = (Math.random()*100)+"vw";
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDuration = (1.4+Math.random()*1.4)+"s";
    p.style.animationDelay = (Math.random()*0.35)+"s";
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 3400);
  }
}
function xpFloat(text){
  const el = document.createElement("div");
  el.className = "xp-float";
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1300);
}

let session = null;
/* session = { day, idx, answered, firstTryResults:[], mode:"day"|"repair",
               repairKey, itemState:{} (per-question scratch) } */

function startDay(day){
  session = { day, idx:0, firstTryResults:[], mode:"day", itemState:null };
  renderIntro();
}
function startRepair(mkey){
  const found = findItemByKey(mkey);
  if(!found) return;
  session = { day:found.day, idx:found.day.items.indexOf(found.item),
              firstTryResults:[], mode:"repair", repairKey:mkey, itemState:null };
  renderLesson();
}

function currentDayId(){
  for(const d of DAYS) if(!S.completedDays[d.id]) return d.id;
  return null;
}
function topbarHTML(){
  const mc = unrepairedCount();
  return `<div class="topbar">
    <div class="stat">🔥 <span class="num">${S.streak.count}</span></div>
    <div class="stat">⭐ <span class="num">${S.xp}</span></div>

  </div>`;
}
function renderHome(){

    const label = st && st.attempted ? pct+"%" : "—";
    therm += `<div class="skill-row">
      <div class="skill-name">${SKILL_EMOJI[sk]} ${esc(sk)}</div>
      <div class="skill-bar"><div class="skill-fill" style="width:${pct}%"></div></div>

  app.innerHTML = topbarHTML() + `
    <div class="hero">
      <h1>🐾 高华阅读探险营 · Johnson</h1>
      <p class="sub">14 天阅读理解闯关地图</p>
    </div>

      <h3>🌡️ 能力温度计</h3>
      ${therm}
    </div>
    <p class="footer-note">进度保存在本设备 · 每天 15 分钟</p>`;
  app.querySelectorAll(".node").forEach(btn=>{

/* ================================================================
   RENDER_LESSON — question shell, dispatch by type
   ================================================================ */
function lessonShellHTML(item){
  const d = session.day;
  const total = d.items.length;
  const doneCount = session.mode==="repair" ? 0 : session.idx;
  const pct = Math.round(doneCount/total*100);
  const kicker = session.mode==="repair"
    ? `<span class="type-badge ${item.type}">${TYPE_LABEL[item.type]}</span><span class="count">🧰 修补练习</span>`
    : `<span class="type-badge ${item.type}">${TYPE_LABEL[item.type]}</span><span class="count">第 ${session.idx+1} / ${total} 题</span>`;
  return `
    <div class="lesson-top">
      <button class="back-btn" id="btn-back">←</button>
      <div class="progress-wrap"><div class="progress-fill" id="pbar" style="width:${session.mode==="repair"?50:pct}%"></div></div>
    </div>
    <div class="kicker">${kicker}</div>
    ${item.passage?`<div class="passage">📖 ${esc(item.passage)}</div>`:""}
    <div class="qtext">${esc(item.prompt)}</div>
    <div id="q-body"></div>
    <div id="fb-zone"></div>
    <div id="aux-zone"></div>
    <div class="btn-row" id="action-zone"></div>`;
}
function renderLesson(){
  const item = session.day.items[session.idx];
  session.itemState = { attempts:0, firstDone:false, hintShown:false, modelShown:false, solved:false };
  app.innerHTML = topbarHTML() + lessonShellHTML(item);
  document.getElementById("btn-back").addEventListener("click", ()=>{
    if(session.mode==="repair") renderRepairBox(); else renderHome();
  });
  if(item.type==="mcq") renderMCQ(item);
  else if(item.type==="build") renderBuild(item);
  else renderWrite(item);
  window.scrollTo(0,0);
}

/* record first-try outcome once per item */
function markFirstTry(item, correct){
  const st = session.itemState;
  if(st.firstDone) return;
  st.firstDone = true;
  recordSkill(session.day.skill, correct);
  if(session.mode==="day") session.firstTryResults.push(!!correct);
  saveState();
}
function rewardCorrect(xp){
  S.xp += xp; saveState();
  confetti(30); xpFloat("+"+xp+" XP");
}
function fbZone(){ return document.getElementById("fb-zone"); }
function auxZone(){ return document.getElementById("aux-zone"); }
function actionZone(){ return document.getElementById("action-zone"); }

function goodBanner(extra){
  return `<div class="banner good"><span class="btitle">🎉 ${esc(pick(BARKS_GOOD))}</span>${extra||""}</div>`;
}
function softBanner(extra){
  return `<div class="banner soft"><span class="btitle">🐾 ${esc(pick(BARKS_SOFT))}</span>${extra||""}</div>`;
}
function continueBtnHTML(){
  const last = session.mode==="repair" || session.idx >= session.day.items.length-1;
  return `<button class="btn green" id="btn-next">${session.mode==="repair"?"完成修补 ✓":(last?"完成今天！🏁":"下一题 →")}</button>`;
}
function bindContinue(wasCorrect){
  const b = document.getElementById("btn-next");
  if(!b) return;
  b.addEventListener("click", ()=>{
    if(session.mode==="repair"){ finishRepair(wasCorrect); return; }
    session.idx++;
    if(session.idx >= session.day.items.length) renderComplete();
    else renderLesson();
  });
}
function finishRepair(correct){
  if(correct){
    const m = S.mistakes.find(m=>m.key===session.repairKey);
    if(m) m.repaired = true;
    saveState();
  }
  renderRepairBox();
}
function hintModelButtonsHTML(){
  return `<button class="btn warm" id="btn-hint">💡 提示</button>`;
}
function bindHintModel(item, opts){
  opts = opts||{};
  const hb = document.getElementById("btn-hint");
  if(!hb) return;
  hb.addEventListener("click", ()=>{
    const st = session.itemState;
    if(!st.hintShown){
      st.hintShown = true;
      auxZone().insertAdjacentHTML("beforeend",
        `<div class="hint-box">💡 <b>提示：</b>${esc(item.hint||"再读一遍文段，圈出关键词。")}</div>`);
      hb.innerHTML = "📖 看范例";
    } else if(!st.modelShown){
      st.modelShown = true;
      auxZone().insertAdjacentHTML("beforeend",
        `<div class="model-box">📖 <b>范例答案：</b>${esc(item.model||"")}<br><span style="color:var(--muted);font-size:14px;">看懂后，试着用自己的话写／选出来，再继续！</span></div>`);
      hb.disabled = true;
      if(opts.onModel) opts.onModel();
    }
  });
}

/* ================================================================
   CHECKERS — MCQ
   ================================================================ */
function renderMCQ(item){
  const body = document.getElementById("q-body");
  const letters = ["A","B","C","D","E","F"];
  body.innerHTML = item.options.map((o,i)=>
    `<button class="opt" data-i="${i}"><span class="letter">${letters[i]}</span>${esc(o)}</button>`).join("");
  actionZone().innerHTML = hintModelButtonsHTML();
  bindHintModel(item);
  const st = session.itemState;
  body.querySelectorAll(".opt").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(st.solved) return;
      const i = Number(btn.dataset.i);
      st.attempts++;
      const correct = (i === item.correct);
      markFirstTry(item, correct && st.attempts===1);
      if(correct){
        st.solved = true;
        btn.classList.add("sel-correct");
        body.querySelectorAll(".opt").forEach(b=>b.disabled=true);
        const firstTry = st.attempts===1;
        if(!firstTry || session.mode==="repair"){ /* mistake already logged if 2nd try */ }
        rewardCorrect(10);
        fbZone().innerHTML = goodBanner(`<div>${esc(item.why||"")}</div>`);
        actionZone().innerHTML = continueBtnHTML();
        bindContinue(true);
      } else {
        btn.classList.add("sel-wrong");
        btn.disabled = true;
        const fbText = (item.feedback && item.feedback[i]) || "";
        if(st.attempts===1){
          addMistake(session.day, item, item.options[i]); saveState();
          fbZone().innerHTML = softBanner(`<div>${esc(fbText)}</div><div style="margin-top:4px;">再试一次，你可以的！</div>`);
        } else {
          /* second wrong: reveal answer */
          st.solved = true;
          body.querySelectorAll(".opt").forEach(b=>{
            b.disabled = true;
            if(Number(b.dataset.i)===item.correct) b.classList.add("reveal-correct");
          });
          fbZone().innerHTML = softBanner(`<div>${esc(fbText)}</div>`) +
            `<div class="banner info"><span class="btitle">✅ 正确答案是 ${letters[item.correct]}</span>
             <div>${esc(item.why||"")}</div>
             <div style="margin-top:4px;"><b>范例：</b>${esc(item.model||"")}</div></div>`;
          actionZone().innerHTML = continueBtnHTML();
          bindContinue(false);
        }
      }
    });
  });
}

/* ================================================================
   CHECKERS — BUILD (tap to assemble)
   ================================================================ */
function renderBuild(item){
  const body = document.getElementById("q-body");
  const st = session.itemState;
  st.zone = []; /* indexes into item.chunks */
  body.innerHTML = `
    <div class="assembly" id="assembly"><span class="placeholder">👇 点击下面的答案块，按顺序放进来</span></div>
    <div class="chunk-pool" id="pool">
      ${item.chunks.map((c,i)=>`<button class="chunk" data-i="${i}">${esc(c)}</button>`).join("")}
    </div>`;
  actionZone().innerHTML = `<button class="btn primary" id="btn-check">✅ 检查</button>` + hintModelButtonsHTML();
  bindHintModel(item);

  const zoneEl = document.getElementById("assembly");
  const poolEl = document.getElementById("pool");
  function redraw(){
    zoneEl.innerHTML = st.zone.length
      ? st.zone.map(i=>`<button class="chunk in-zone" data-i="${i}">${esc(item.chunks[i])}</button>`).join("")
      : `<span class="placeholder">👇 点击下面的答案块，按顺序放进来</span>`;
    poolEl.querySelectorAll(".chunk").forEach(b=>{
      b.classList.toggle("ghost", st.zone.includes(Number(b.dataset.i)));
    });
    zoneEl.querySelectorAll(".chunk").forEach(b=>{
      b.addEventListener("click", ()=>{
        if(st.solved) return;
        st.zone = st.zone.filter(x=>x!==Number(b.dataset.i));
        redraw();
      });
    });
  }
  poolEl.querySelectorAll(".chunk").forEach(b=>{
    b.addEventListener("click", ()=>{
      if(st.solved) return;
      const i = Number(b.dataset.i);
      if(!st.zone.includes(i)){ st.zone.push(i); redraw(); }
    });
  });
  redraw();

  document.getElementById("btn-check").addEventListener("click", ()=>{
    if(st.solved) return;
    if(st.zone.length !== item.chunks.length){
      fbZone().innerHTML = `<div class="banner info">先把所有答案块都放进拼装区哦！</div>`;
      return;
    }
    st.attempts++;
    const userSeq = st.zone.map(i=>item.chunks[i]);
    const ok = userSeq.join("␟") === item.correctOrder.join("␟");
    markFirstTry(item, ok && st.attempts===1);
    if(ok){
      st.solved = true;
      rewardCorrect(10);
      fbZone().innerHTML = goodBanner(`<div>${esc(item.why||"")}</div>`);
      actionZone().innerHTML = continueBtnHTML();
      bindContinue(true);
    } else {
      if(st.attempts===1){ addMistake(session.day, item, userSeq.join("")); saveState(); }
      zoneEl.classList.add("shake");
      setTimeout(()=>zoneEl.classList.remove("shake"), 500);
      fbZone().innerHTML = softBanner(`<div>顺序还不对——想想：应该先说什么，再说什么？（可点 💡 提示）</div>`);
      if(st.attempts>=3 && !st.modelShown){
        fbZone().insertAdjacentHTML("beforeend",
          `<div class="banner info"><b>正确顺序：</b>${item.correctOrder.map(esc).join(" → ")}<br>照着拼一次，再按检查！</div>`);
      }
    }
  });
}

/* ================================================================
   CHECKERS — WRITE (OEQ scaffold: field cards + keyword chips)
   ================================================================ */
function renderWrite(item){
  const body = document.getElementById("q-body");
  const st = session.itemState;
  const chipsSet = [];
  item.fields.forEach(f=>(f.keywords||[]).forEach(k=>{ if(!chipsSet.includes(k)) chipsSet.push(k); }));
  body.innerHTML = `
    <div class="field-cards">
      ${item.fields.map((f,i)=>`<div class="field-card" id="fc-${i}"><span class="mark">${i+1}</span><span>${esc(f.label)}</span></div>`).join("")}
    </div>
    <div class="chips-label">🔤 提示词（点一下就放进答案里）：</div>
    <div class="chips">${chipsSet.map(k=>`<button class="chip" data-w="${esc(k)}">${esc(k)}</button>`).join("")}</div>
    <textarea class="answer" id="answer" placeholder="在这里写下你的答案……"></textarea>`;
  actionZone().innerHTML = `<button class="btn primary" id="btn-check">✅ 检查</button>` + hintModelButtonsHTML();

  const ta = document.getElementById("answer");
  body.querySelectorAll(".chip").forEach(ch=>{
    ch.addEventListener("click", ()=>{
      const w = ch.dataset.w;
      const start = ta.selectionStart!=null ? ta.selectionStart : ta.value.length;
      const end = ta.selectionEnd!=null ? ta.selectionEnd : ta.value.length;
      ta.value = ta.value.slice(0,start) + w + ta.value.slice(end);
      const pos = start + w.length;
      ta.focus(); try{ ta.setSelectionRange(pos,pos); }catch(e){}
    });
  });

  let modelContinueShown = false;
  function showModelContinue(){
    if(modelContinueShown || st.solved) return;
    modelContinueShown = true;
    actionZone().insertAdjacentHTML("beforeend",
      `<button class="btn ghost" id="btn-skip">参考范例后继续 →</button>`);
    document.getElementById("btn-skip").addEventListener("click", ()=>{
      if(st.solved) return;
      st.solved = true;
      markFirstTry(item, false);
      if(!S.mistakes.find(m=>m.key===item.id)){ addMistake(session.day, item, ta.value.trim()); }
      S.xp += 5; saveState();
      xpFloat("+5 XP");
      fbZone().innerHTML = `<div class="banner info"><span class="btitle">👍 看懂范例也是学习！</span>下次试着自己写出来。</div>`;
      actionZone().innerHTML = continueBtnHTML();
      bindContinue(false);
    });
  }
  bindHintModel(item, {onModel: showModelContinue});

  document.getElementById("btn-check").addEventListener("click", ()=>{
    if(st.solved) return;
    const text = ta.value.trim();
    if(text.length < 5){
      fbZone().innerHTML = `<div class="banner info">先写至少 5 个字，再按检查哦！可以用上面的提示词。</div>`;
      return;
    }
    st.attempts++;
    let passCount = 0;
    const missing = [];
    item.fields.forEach((f,i)=>{
      const ok = (f.keywords||[]).some(k=>text.includes(k));
      const card = document.getElementById("fc-"+i);
      if(ok){ passCount++; card.classList.add("pass"); card.querySelector(".mark").textContent="✓"; }
      else { card.classList.remove("pass"); card.querySelector(".mark").textContent=String(i+1); missing.push(f.label); }
    });
    const allPass = passCount === item.fields.length;
    markFirstTry(item, allPass && st.attempts===1);
    if(allPass){
      st.solved = true;
      rewardCorrect(10);
      fbZone().innerHTML = goodBanner(`<div>${item.fields.length} 个得分点全部拿下！</div><div style="margin-top:4px;"><b>范例参考：</b>${esc(item.model||"")}</div>`);
      actionZone().innerHTML = continueBtnHTML();
      bindContinue(true);
    } else {
      if(st.attempts===1){ addMistake(session.day, item, text); saveState(); }
      fbZone().innerHTML = softBanner(
        `<div>已经有 <b>${passCount}/${item.fields.length}</b> 个得分点了！再加上：${missing.map(m=>`「${esc(m)}」`).join("、")}</div>
         <div style="margin-top:4px;">改一改再检查，不限次数！</div>`);
      showModelContinue();
    }
  });
}

/* ================================================================
   RENDER_COMPLETE — celebration
   ================================================================ */
function starsFromAccuracy(acc){
  if(acc >= 0.99) return 3;
  if(acc >= 0.5) return 2;
  return 1;
}
function renderComplete(){
  const d = session.day;
  const total = session.firstTryResults.length || d.items.length;
  const correct = session.firstTryResults.filter(Boolean).length;
  const acc = total ? correct/total : 0;
  const stars = starsFromAccuracy(acc);
  const firstTime = !S.completedDays[d.id];
  const prev = S.completedDays[d.id];
  S.completedDays[d.id] = {
    stars: prev ? Math.max(prev.stars, stars) : stars,
    accuracy: prev ? Math.max(prev.accuracy, acc) : acc
  };
  if(firstTime) S.bones += 1;
  bumpStreak();
  saveState();
  confetti(70);
  setTimeout(()=>confetti(40), 600);
  app.innerHTML = topbarHTML() + `
    <div class="center-card">
      <div class="big-emoji">🐶</div>
      <h2>第 ${d.id} 天完成！</h2>
      <p class="sub">${esc(d.title)}</p>
      <div class="star-line">
        ${[1,2,3].map(i=>`<span class="${i<=stars?"on":"off"}">★</span>`).join("")}
      </div>
      <div class="reward-line">一次答对：<b>${correct} / ${total}</b></div>
      <div class="reward-line">⭐ 总 XP：<b>${S.xp}</b>${firstTime?` &nbsp;·&nbsp; 🦴 +1 饼干奖励`:""}</div>
      <div class="mascot-row">
        <div class="mascot" style="font-size:34px;">💬</div>
        <div class="bubble">汪！今天的探险结束啦，明天见！</div>
      </div>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn primary" id="btn-map">🗺️ 返回地图</button>
        <button class="btn ghost" id="btn-again">🔁 再练一次</button>
      </div>
    </div>`;
  document.getElementById("btn-map").addEventListener("click", renderHome);
  document.getElementById("btn-again").addEventListener("click", ()=>startDay(d));
  window.scrollTo(0,0);
}

/* ================================================================
   REPAIR BOX (修补箱)
   ================================================================ */
function renderRepairBox(){
  const list = S.mistakes.slice().reverse();
  let inner;
  if(!list.length){
    inner = `<div class="empty-box">🧰 修补箱是空的！<br>答错的题目会存到这里，方便重练。</div>`;
  } else {
    inner = list.map(m=>{
      const found = findItemByKey(m.key);
      return `<div class="mistake-card ${m.repaired?"fixed":""}">
        <div class="mq">${SKILL_EMOJI[m.skill]||"📖"} ${esc(m.prompt)}</div>
        <div class="mrow">我的答案：<b>${esc(m.answer)}</b></div>
        <div class="mrow">范例：<b>${esc(m.model)}</b></div>
        ${m.why?`<div class="mrow">为什么：${esc(m.why)}</div>`:""}
        <div class="btn-row" style="margin:10px 0 0;">
          ${m.repaired
            ? `<span class="fixed-tag">✅ 已修补</span>`
            : (found?`<button class="btn primary" data-rekey="${esc(m.key)}" style="padding:9px 18px;min-height:44px;">🔧 重练</button>`:"")}
        </div>
      </div>`;
    }).join("");
  }
  app.innerHTML = topbarHTML() + `
    <div class="lesson-top">
      <button class="back-btn" id="btn-back">←</button>
      <div style="font-weight:700;color:var(--primary-dark);">🧰 修补箱（${unrepairedCount()} 个待修补）</div>
    </div>
    <div class="mascot-row">
      <div class="mascot">🐶</div>
      <div class="bubble">错题不是敌人，是宝藏！修好一个，本领＋1！</div>
    </div>
    ${inner}`;
  document.getElementById("btn-back").addEventListener("click", renderHome);
  document.getElementById("btn-toolbox").addEventListener("click", renderRepairBox);
  app.querySelectorAll("[data-rekey]").forEach(b=>{
    b.addEventListener("click", ()=>startRepair(b.dataset.rekey));
  });
  window.scrollTo(0,0);
}

/* ================================================================
   BOOT
   ================================================================ */
renderHome();
</script>
</body>
</html>
