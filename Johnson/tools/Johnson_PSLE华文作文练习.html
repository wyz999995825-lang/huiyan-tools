<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Johnson 华文作文练习</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#FDF8F0;--bg2:#F5EDE0;--card:#FFFFFF;--card2:#FBF7F0;
  --border:#E8DCC8;--border2:#D4C5A8;
  --text:#2D2A26;--text2:#6B6560;--text3:#A09890;
  --red:#E74C3C;--red-dark:#C0392B;--red-light:#FDEDEC;
  --blue:#2980B9;--blue-light:#EBF5FB;
  --green:#27AE60;--green-dark:#1E8449;--green-light:#E8F8F0;
  --orange:#E67E22;--orange-light:#FEF5E7;
  --purple:#8E44AD;--purple-light:#F4ECF7;
  --gold:#F1C40F;--gold-light:#FFFDE7;
  --pink:#E91E63;
  --shadow:0 2px 12px rgba(0,0,0,0.06);
  --shadow2:0 4px 20px rgba(0,0,0,0.1);
}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

.top-bar{position:sticky;top:0;z-index:100;display:none;align-items:center;gap:12px;padding:12px 20px;background:var(--bg);border-bottom:2px solid var(--border);}
.top-bar .close-btn{font-size:20px;color:var(--text2);cursor:pointer;background:none;border:none;}
.progress-bar{flex:1;height:14px;background:var(--bg2);border-radius:10px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--red),#E74C3C);border-radius:10px;transition:width 0.5s ease;}
.hearts{display:flex;align-items:center;gap:4px;font-size:16px;font-weight:900;color:var(--red);}
.streak-display{display:flex;align-items:center;gap:4px;font-size:16px;font-weight:900;color:var(--orange);}

.main{max-width:680px;margin:0 auto;padding:20px 16px 100px;}
.screen{display:none;animation:fadeIn 0.4s ease;}.screen.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}

/* Home */
.home-hero{text-align:center;padding:30px 0 16px;}
.home-hero .mascot{font-size:64px;animation:bounce 2.5s infinite;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
.home-hero h1{font-size:26px;font-weight:900;margin:12px 0 6px;}
.home-hero p{color:var(--text2);font-size:14px;}
.home-stats{display:flex;justify-content:center;gap:24px;margin:16px 0;}
.home-stat{text-align:center;}.home-stat .hs-val{font-size:22px;font-weight:900;}.home-stat .hs-label{font-size:11px;color:var(--text2);}

.module-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:20px;}
.module-card{display:flex;align-items:center;gap:16px;background:var(--card);border:2px solid var(--border);border-radius:16px;padding:18px 20px;cursor:pointer;transition:all 0.2s;box-shadow:var(--shadow);}
.module-card:hover{transform:translateY(-2px);box-shadow:var(--shadow2);border-color:var(--red);}
.module-card:active{transform:translateY(0);}
.module-icon{font-size:36px;flex-shrink:0;}
.module-info{flex:1;}.module-info .mod-name{font-size:16px;font-weight:900;}.module-info .mod-desc{font-size:12px;color:var(--text2);margin-top:2px;}
.module-badge{background:var(--red-light);color:var(--red);font-size:11px;font-weight:900;padding:4px 10px;border-radius:10px;white-space:nowrap;}

/* Back Button */
.back-row{margin-bottom:16px;}
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:10px;border:2px solid var(--border);background:var(--card);font-family:'Noto Sans SC';font-size:13px;font-weight:700;cursor:pointer;color:var(--text2);}
.back-btn:hover{border-color:var(--red);color:var(--text);}

/* Spinner */
.spinner-container{display:flex;flex-direction:column;align-items:center;margin:20px 0;}
.wheel-wrapper{position:relative;width:300px;height:300px;margin:0 auto 20px;}
.wheel{width:300px;height:300px;border-radius:50%;border:6px solid var(--border2);transition:transform 4s cubic-bezier(0.17,0.67,0.12,0.99);position:relative;overflow:hidden;}
.wheel-pointer{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:28px;z-index:10;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.2));}
.spin-btn{padding:16px 48px;background:linear-gradient(135deg,var(--red),var(--pink));color:#fff;border:none;border-radius:16px;font-family:'Noto Sans SC';font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 var(--red-dark);letter-spacing:2px;transition:all 0.15s;}
.spin-btn:hover{filter:brightness(1.1);}
.spin-btn:active{box-shadow:none;transform:translateY(4px);}
.spin-btn:disabled{opacity:0.5;cursor:not-allowed;}
.spin-result{text-align:center;margin-top:20px;padding:20px;background:var(--card);border:2px solid var(--border);border-radius:16px;box-shadow:var(--shadow);display:none;}
.spin-result .sr-emoji{font-size:40px;margin-bottom:8px;}
.spin-result .sr-title{font-size:18px;font-weight:900;margin-bottom:4px;}
.spin-result .sr-type{font-size:13px;color:var(--red);font-weight:700;margin-bottom:12px;}
.spin-result .sr-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.sr-btn{padding:10px 20px;border-radius:12px;border:none;font-family:'Noto Sans SC';font-size:14px;font-weight:700;cursor:pointer;transition:all 0.15s;}
.sr-btn-primary{background:var(--red);color:#fff;box-shadow:0 3px 0 var(--red-dark);}
.sr-btn-primary:active{box-shadow:none;transform:translateY(3px);}
.sr-btn-secondary{background:var(--bg2);color:var(--text2);border:2px solid var(--border);}

/* Essay Reader */
.reader-container{background:var(--card);border-radius:16px;padding:24px;border:2px solid var(--border);box-shadow:var(--shadow);}
.reader-title{font-size:20px;font-weight:900;margin-bottom:4px;}
.reader-meta{font-size:12px;color:var(--text2);margin-bottom:16px;}
.reader-text{font-size:16px;line-height:2.4;color:var(--text);}
.reader-text p{margin-bottom:16px;text-indent:2em;}
.reader-text .hl-good{background:linear-gradient(120deg,#C3E8FF 0%,#74B9FF 100%);background-size:100% 40%;background-repeat:no-repeat;background-position:0 88%;padding:0 2px;border-radius:2px;cursor:pointer;}
.reader-text .hl-good:hover{background-size:100% 100%;}
.reader-text .hl-vocab{background:linear-gradient(120deg,#FCEABB 0%,#F8B500 100%);background-size:100% 40%;background-repeat:no-repeat;background-position:0 88%;padding:0 2px;border-radius:2px;cursor:pointer;}
.reader-text .hl-vocab:hover{background-size:100% 100%;}

.hl-legend{display:flex;gap:16px;margin:16px 0;flex-wrap:wrap;}
.hl-legend span{font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px;}
.hl-legend .dot{width:12px;height:12px;border-radius:3px;}

.essay-nav{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.essay-tab{padding:8px 14px;border-radius:10px;border:2px solid var(--border);background:var(--card);font-family:'Noto Sans SC';font-size:12px;font-weight:700;cursor:pointer;color:var(--text2);}
.essay-tab:hover{border-color:var(--red);}
.essay-tab.active{border-color:var(--red);background:var(--red-light);color:var(--red);}

/* Comment Box */
.comment-box{background:var(--purple-light);border-left:4px solid var(--purple);border-radius:0 12px 12px 0;padding:14px 16px;margin:16px 0;font-size:13px;line-height:1.8;color:var(--purple);}
.comment-box strong{font-weight:900;}

/* Quiz */
.q-header{margin-bottom:20px;}
.q-header .q-type{color:var(--red);font-size:12px;font-weight:900;letter-spacing:1px;}
.q-header h2{font-size:18px;font-weight:900;margin-top:6px;line-height:1.6;}
.q-header .q-hint{color:var(--text2);font-size:13px;margin-top:8px;line-height:1.6;}

.options{display:flex;flex-direction:column;gap:8px;}
.option-btn{display:flex;align-items:flex-start;gap:12px;background:var(--card);border:2px solid var(--border);border-radius:14px;padding:14px 16px;cursor:pointer;transition:all 0.15s;font-size:14px;font-weight:600;color:var(--text);text-align:left;width:100%;font-family:'Noto Sans SC';line-height:1.6;}
.option-btn:hover{border-color:var(--blue);background:var(--blue-light);}
.option-btn.selected{border-color:var(--blue);background:var(--blue-light);}
.option-btn.correct{border-color:var(--green);background:var(--green-light);animation:correctPulse 0.4s;}
.option-btn.wrong{border-color:var(--red);background:var(--red-light);animation:shake 0.4s;}
.option-num{width:28px;height:28px;border-radius:8px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex-shrink:0;}
@keyframes correctPulse{0%{transform:scale(1);}50%{transform:scale(1.02);}100%{transform:scale(1);}}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}

.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:2px solid var(--border);padding:14px;display:none;justify-content:center;}
.check-btn{width:100%;max-width:680px;padding:14px;border:none;border-radius:14px;font-family:'Noto Sans SC';font-size:15px;font-weight:900;cursor:pointer;transition:all 0.15s;letter-spacing:2px;}
.check-btn.ready{background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red-dark);}
.check-btn.ready:active{box-shadow:none;transform:translateY(4px);}
.check-btn.disabled{background:var(--bg2);color:var(--text3);cursor:not-allowed;}
.check-btn.next{background:var(--blue);color:#fff;box-shadow:0 4px 0 #2471A3;}

.feedback{position:fixed;bottom:66px;left:0;right:0;padding:14px 20px;text-align:center;font-weight:900;font-size:15px;transform:translateY(120%);transition:transform 0.3s ease;z-index:50;}
.feedback.show{transform:translateY(0);}
.feedback.correct-fb{background:var(--green-light);color:var(--green-dark);border-top:2px solid var(--green);}
.feedback.wrong-fb{background:var(--red-light);color:var(--red);border-top:2px solid var(--red);}
.feedback .fb-explain{font-size:12px;font-weight:500;color:var(--text2);margin-top:6px;line-height:1.6;}

.results{text-align:center;padding:30px 0;}
.results .trophy{font-size:64px;animation:bounce 2s infinite;}
.results h1{font-size:26px;font-weight:900;margin:12px 0;}
.results .score-ring{width:140px;height:140px;margin:16px auto;border-radius:50%;border:8px solid var(--bg2);display:flex;align-items:center;justify-content:center;background:var(--card);}
.results .score-num{font-size:32px;font-weight:900;}
.stat-row{display:flex;justify-content:center;gap:24px;margin:20px 0;}
.stat-item{text-align:center;}.stat-item .stat-val{font-size:24px;font-weight:900;}.stat-item .stat-label{font-size:11px;color:var(--text2);}
.restart-btn{padding:14px 40px;background:var(--red);color:#fff;border:none;border-radius:14px;font-family:'Noto Sans SC';font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 var(--red-dark);letter-spacing:1px;margin-top:12px;}
.restart-btn:active{box-shadow:none;transform:translateY(4px);}

/* Toolbox */
.toolbox-section{margin-bottom:20px;}
.toolbox-section h3{font-size:16px;font-weight:900;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.toolbox-card{background:var(--card);border:2px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px;box-shadow:var(--shadow);}
.toolbox-card .tc-cat{font-size:11px;font-weight:900;color:var(--purple);margin-bottom:6px;}
.toolbox-card .tc-example{font-size:14px;line-height:2;color:var(--text);margin:8px 0;padding:10px 14px;background:var(--card2);border-radius:10px;border-left:4px solid var(--red);}
.toolbox-card .tc-tip{font-size:12px;color:var(--text2);line-height:1.6;margin-top:6px;}
.toolbox-tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px;}
.toolbox-tab{padding:8px 14px;border-radius:10px;border:2px solid var(--border);background:var(--card);font-family:'Noto Sans SC';font-size:12px;font-weight:700;cursor:pointer;color:var(--text2);white-space:nowrap;}
.toolbox-tab:hover{border-color:var(--purple);}
.toolbox-tab.active{border-color:var(--purple);background:var(--purple-light);color:var(--purple);}

/* Writing Practice */
.writing-area{margin-top:16px;}
.writing-area textarea{width:100%;min-height:300px;padding:16px;border:2px solid var(--border);border-radius:14px;font-family:'Noto Sans SC';font-size:16px;line-height:2.2;color:var(--text);background:var(--card);resize:vertical;}
.writing-area textarea:focus{outline:none;border-color:var(--red);}
.char-counter{font-size:13px;font-weight:900;padding:6px 12px;border-radius:8px;display:inline-block;margin-top:8px;}
.char-counter.cc-red{background:var(--red-light);color:var(--red);}
.char-counter.cc-green{background:var(--green-light);color:var(--green);}
.char-counter.cc-orange{background:var(--orange-light);color:var(--orange);}

.tip-box{background:var(--gold-light);border:2px solid var(--gold);border-radius:14px;padding:16px;margin:16px 0;font-size:13px;line-height:1.8;}
.tip-box strong{color:var(--orange);}

.xp-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:40px;font-weight:900;color:var(--gold);text-shadow:0 4px 20px rgba(241,196,15,0.4);pointer-events:none;z-index:200;transition:all 0.5s ease;}
.xp-popup.show{transform:translate(-50%,-50%) scale(1);opacity:1;}
.xp-popup.hide{transform:translate(-50%,-100%) scale(0.5);opacity:0;}

.tooltip-popup{position:fixed;z-index:300;background:var(--card);border:2px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow2);max-width:320px;font-size:13px;line-height:1.7;display:none;animation:fadeIn 0.2s;}
.tooltip-popup .tp-title{font-weight:900;color:var(--red);font-size:12px;margin-bottom:4px;}
.tooltip-popup .tp-close{position:absolute;top:8px;right:10px;cursor:pointer;font-size:14px;color:var(--text2);background:none;border:none;}

/* Outline Builder */
.ob-step-indicator{display:flex;align-items:center;justify-content:center;gap:4px;margin-bottom:20px;flex-wrap:wrap;}
.ob-step-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;border:2px solid var(--border);background:var(--card);color:var(--text3);transition:all 0.3s;}
.ob-step-dot.active{border-color:var(--red);background:var(--red);color:#fff;}
.ob-step-dot.done{border-color:var(--green);background:var(--green-light);color:var(--green);}
.ob-step-line{width:24px;height:2px;background:var(--border);}
.ob-topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.ob-topic-card{background:var(--card);border:2px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;text-align:center;transition:all 0.2s;}
.ob-topic-card:hover{border-color:var(--red);transform:translateY(-2px);}
.ob-topic-card.selected{border-color:var(--red);background:var(--red-light);}
.ob-topic-card .otc-emoji{font-size:28px;margin-bottom:4px;}
.ob-topic-card .otc-title{font-size:13px;font-weight:900;}
.ob-topic-card .otc-type{font-size:11px;color:var(--text2);}
.ob-template-card{background:var(--card);border:2px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px;cursor:pointer;transition:all 0.2s;}
.ob-template-card:hover{border-color:var(--red);transform:translateY(-1px);}
.ob-template-card.selected{border-color:var(--red);background:var(--red-light);}
.ob-template-card .ot-name{font-size:15px;font-weight:900;margin-bottom:4px;}
.ob-template-card .ot-flow{font-size:12px;color:var(--text2);line-height:1.6;}
.ob-section-card{background:var(--card);border:2px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow);}
.ob-section-card .os-num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;font-size:12px;font-weight:900;margin-right:8px;}
.ob-section-card .os-title{font-size:15px;font-weight:900;display:inline;}
.ob-section-card .os-question{font-size:13px;color:var(--blue);font-weight:700;margin:10px 0 8px;line-height:1.6;}
.ob-section-card .os-tips{font-size:12px;color:var(--text2);line-height:1.8;margin-bottom:10px;padding:10px 12px;background:var(--gold-light);border-radius:8px;}
.ob-section-card .os-examples{margin-bottom:10px;}
.ob-section-card .os-example{font-size:12px;line-height:1.8;padding:8px 12px;background:var(--blue-light);border-radius:8px;border-left:3px solid var(--blue);margin-bottom:6px;color:var(--text);}
.ob-section-card textarea{width:100%;min-height:80px;padding:12px;border:2px solid var(--border);border-radius:10px;font-family:'Noto Sans SC';font-size:14px;line-height:1.8;color:var(--text);background:var(--card2);resize:vertical;}
.ob-section-card textarea:focus{outline:none;border-color:var(--red);}
.ob-nav{display:flex;gap:10px;justify-content:center;margin-top:20px;}
.ob-nav-btn{padding:12px 28px;border-radius:12px;border:none;font-family:'Noto Sans SC';font-size:14px;font-weight:900;cursor:pointer;transition:all 0.15s;}
.ob-nav-btn.primary{background:var(--red);color:#fff;box-shadow:0 3px 0 var(--red-dark);}
.ob-nav-btn.primary:active{box-shadow:none;transform:translateY(3px);}
.ob-nav-btn.secondary{background:var(--bg2);color:var(--text2);border:2px solid var(--border);}
.ob-nav-btn:disabled{opacity:0.4;cursor:not-allowed;}
.ob-outline-review{background:var(--card);border:2px solid var(--border);border-radius:14px;padding:20px;margin:16px 0;box-shadow:var(--shadow);}
.ob-outline-review .or-section{margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border);}
.ob-outline-review .or-section:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.ob-outline-review .or-label{font-size:13px;font-weight:900;color:var(--red);margin-bottom:4px;}
.ob-outline-review .or-content{font-size:14px;line-height:1.8;color:var(--text);white-space:pre-wrap;}
.ob-outline-review .or-empty{font-size:13px;color:var(--text3);font-style:italic;}
.ob-outline-ref{background:var(--gold-light);border:2px solid var(--gold);border-radius:14px;padding:16px;margin-bottom:16px;max-height:200px;overflow-y:auto;}
.ob-outline-ref .or-ref-title{font-size:13px;font-weight:900;color:var(--orange);margin-bottom:8px;}
.ob-outline-ref .or-ref-item{font-size:12px;line-height:1.6;color:var(--text);margin-bottom:4px;}

/* Model Essay Library */
.mel-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:16px;}
.mel-card{background:var(--card);border:2px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:all 0.2s;box-shadow:var(--shadow);}
.mel-card:hover{border-color:var(--red);transform:translateY(-2px);box-shadow:var(--shadow2);}
.mel-card .mc-top{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
.mel-card .mc-emoji{font-size:28px;}
.mel-card .mc-info{flex:1;}
.mel-card .mc-title{font-size:15px;font-weight:900;}
.mel-card .mc-meta{font-size:11px;color:var(--text2);margin-top:2px;}
.mel-card .mc-tags{display:flex;gap:6px;flex-wrap:wrap;}
.mel-card .mc-tag{font-size:10px;padding:2px 8px;border-radius:6px;font-weight:700;}
.mel-card .mc-tag-type{background:var(--red-light);color:var(--red);}
.mel-card .mc-tag-count{background:var(--blue-light);color:var(--blue);}

@media(max-width:480px){
  .home-hero h1{font-size:22px;}
  .wheel-wrapper,.wheel{width:260px;height:260px;}
  .reader-text{font-size:15px;line-height:2.2;}
  .ob-topic-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="top-bar" id="topBar">
  <button class="close-btn" onclick="goHome()">&#10005;</button>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="hearts" id="heartsDisplay">&#10084;&#65039; 5</div>
  <div class="streak-display" id="streakDisplay">&#128293; 0</div>
</div>

<div class="main">
  <div class="screen active" id="homeScreen"></div>
  <div class="screen" id="menuScreen"></div>
  <div class="screen" id="spinnerScreen"></div>
  <div class="screen" id="readerScreen"></div>
  <div class="screen" id="questionScreen"><div id="questionContent"></div></div>
  <div class="screen" id="resultsScreen"><div class="results" id="resultsContent"></div></div>
  <div class="screen" id="toolboxScreen"></div>
  <div class="screen" id="writingScreen"></div>
  <div class="screen" id="outlineScreen"></div>
  <div class="screen" id="modelLibScreen"></div>
</div>

<div class="bottom-bar" id="bottomBar">
  <button class="check-btn disabled" id="checkBtn" onclick="onCheck()">检查答案</button>
</div>
<div class="feedback" id="feedback"></div>
<div class="xp-popup" id="xpPopup"></div>
<div class="tooltip-popup" id="tooltipPopup"><button class="tp-close" onclick="closeTooltip()">&#10005;</button><div id="tooltipBody"></div></div>

<script>
// =========================================================
// DATA: 5 Model Essays from Johnson's actual compositions
// =========================================================
var ESSAYS = [
  {

      '周六早上，妈妈、哥哥、外婆和我终于前往机场，去参加期待已久的\u201C九月假期马尔代夫之旅\u201D。8点钟左右，我们到达了机场，走向登机口集合。远处，我就看到了传说中的学霸\u2014\u2014云云。她的爸爸就是这次活动的发起人\u2014\u2014小菜叔叔。我发现，云云比视频里更清瘦，而小菜叔叔略显强壮。他们一家人都看起来很和善，热情地和大家打招呼。很快，广播通知大家登机。登上飞机后，我惊讶地发现，我们两家的座位居然特别近，真幸运！坐下后，我开始扫视四周，观察团里的其它的孩子。在我的左前方坐着一个很特别的男孩子\u2014\u2014他外表很绅士温文尔雅，戴着一副眼镜，拿着一本笔记本在窗户旁奋笔疾书。他刷刷的写字声让我觉得他仿佛已经忘了这是在一场旅途中。我不时好奇的盯着他，心想：他的妈妈和飞机上90%的人都在看电影，而他这是怎么做到的专注力，我心生敬佩。',
      '经过4.5小时的飞行我们到达了首都马累维拉纳国际机场，下飞机后就是码头。我们拿着行李登上托尼船前往母船。引入眼帘的蓝天让我彻底沉醉，清新的海风柔软的云朵，海面上波光粼粼像钻石一样闪耀。远处的海水层次分明，我惊讶的发现海水不是单一的颜色，而是层层铺开，就像上帝打翻的蓝色系颜料盘。近处透明的像玻璃隐约可以见底；再远些变成宁静的蓝；最远处则是颜色浓重的深蓝。海风迎面吹来，仿佛在和每一个远道而来的客人招手，瞬间让大家不禁感叹，\u201C这里真美啊！\u201D很快，我们到达自己的游艇，并登上船。船员们早早就准备好了冰镇果汁和新鲜的大串香蕉。放好行李后，在好奇心的驱使下，我们把整条船的四层逛了个遍。这是我第一次在船上住宿，虽然我有点担心会晕船，但是听见爸爸说越大的船会越稳后，我马上松了一口气。',
      '小菜叔叔说，第一天，我们先和大家熟悉一下，然后可以叫上好朋友一起来钓鱼。幸运的话，晚上还能加个餐。听到这句话，我们每个人脸上都洋溢着开心地笑容。我本以为我们要使用鱼竿钓鱼，却发现我们居然只需要一卷鱼线！船员帮我们挂上鱼饵后，我因为不熟练便马马虎虎，模仿着大人们扔鱼饵钓鱼。我发现并不需要把鱼饵扔得很远，可以直接把它垂直地放入海里。船员说，先把鱼线放到海底，再把线往下拉个四五圈，最后静等鱼儿上钩。刚开始，我觉得钓鱼很简单，还在脑补被大鱼拉进海里的场景。我心想，我有没有可能会跟着它冲起浪来？我越想越好笑，不禁笑出声音来。事实上，漫长的等待让我慢慢失去信心。但是我突然想起爷爷说的话，钓鱼不是一件简单的事，需要有足够的耐心和经验。如果你老是玩弄鱼线，被惊动的鱼儿就不会上钩；如果你分心了，鱼饵就会被鱼偷偷吃掉，只能功亏一篑。不知不觉的，一个小时过去了。我看着同伴们一条接一条的收获，我心里非常沮丧。突然我的线微微地动了几下，我揉揉眼睛，集中注意力。我谨慎地握着我手中的线，这时幅动越来越大，拉扯感非常强！我赶紧迅速收线。船员发现了，赶快过来帮忙。我们俩用力一拽，一条大鱼飞出了水面！只听啪啪几声，大鱼的鱼尾拍着甲板，让我兴奋极了，开心地喊道：\u201C今天可以加餐了！\u201D晚餐时间，新鲜的清蒸东星斑鱼已经端上餐桌，我迫不及待地拿起餐具，大家都狼吞虎咽地开吃了起来。我夹了一块鱼肚子上的肉，沾了一点汤汁，放到嘴巴里。那条鱼肉质嫩滑，味道鲜美，大家都纷纷赞不绝口！',
      '晚上，我和朋友们躺在船上的甲板上，享受着凉爽的海风。我们仰望着星空，看着无边无际的印度洋海峡，不禁感叹人类的渺小宇宙的浩瀚。随后，我们回去了各自的房间躺到床上慢慢地闭上眼睛。',
      '三个小时的时差让我第二天早早就起床了。吃完早餐后，我们坐上快艇去长尾沙滩做简单的浮潜练习。下午，我们去了一个很多断崖式的水域，让我初步感受到海底生物的多样性。身边一条条鱼儿川流不息，有的身体细长，颜色亮得发光；有的长着尖尖嘴巴，往前伸出去，好像一支小管子。这些鱼的样子看起来十分独特。我忍不住跟着它的方向游去，只见它在珊瑚丛中钻来钻去，像一只调皮的小精灵。在不远处，我看见一只魔鬼鱼潜伏在海底，它的身体很宽，好像一只展开的大风筝，轻轻摆动就能在水里自由自在地滑行。看见我们拿摄像机来拍摄它居然玩起了杂技，不停地在我们面前翻滚，仿佛像一个自由的舞者找到了知音。在水下的一个小时过的异常快，被潜导带上来的那一刻我依依不舍。海底的画面已经牢牢的刻入我的心里！',
      '夕阳西下，经过短暂的休息我们整装待发去无人岛抓螃蟹，上岛后大家迫不及待地拎着桶，先侦查地形，然后分成多个小组开始行动。我选择和一个看上去很有经验的叔叔一起组队，他带着我去海滩边礁石比较多的地方找，于是，我弯下腰手忙脚乱地翻起各种石头，眼睛还死死地盯着石缝，望眼欲穿地盯着小螃蟹的踪影，我心里像有一只小鼓在\u201C咚咚\u201D在跳，生怕慢一步就错过了。只见石头刚一掀起，我眼睁睁地看着一只沙蟹\u201C嗖\u201D的一声窜进沙洞里，失之交臂，我的心猛地一沉，刚才的兴奋像泄了气的气球，瞬间瘪下去，我生气的在原地直跺脚。叔叔安慰我说，别泄气那只是一只小沙蟹，我们再去找更大的，明天早上煮海鲜粥。就在这时又有一只幽灵蟹探头探脑从洞里爬出，我拿起长长的尖嘴钳毫不犹豫地冲上去夹住它的外壳。我兴奋地一蹦三尺高，结果煮熟的鸭子又飞了。我恨不得立刻钻进沙洞里，把那只螃蟹亲自拽出来。我重振旗鼓，屏住呼吸，目不转睛地盯着沙滩，不敢再像之前一样大意，果然，又有一只更大的幽灵蟹慢慢吞吞地从沙洞里爬出，这时我小心翼翼地弯下腰，不敢打草惊蛇，动作轻地连沙子都不敢惊动，手指缓缓靠近，心\u201C砰砰\u201D直响，仿佛下一秒就要跳出胸口，终于，机会来了，我猛合十双手，把螃蟹牢牢地抓在掌心。那一刻我的心从嗓子眼掉到胸口，终于松了一口气，我的手心又热又痒，但我却舍不得松开，怕又重蹈覆辙，看着张牙舞爪的小家伙，我兴奋地几乎要跳起来，心里乐开了花，慢慢的有成就感。之后我熟练掌握了技巧，夜幕降临很快也退潮了，海滩上的螃蟹也开始越来越多，看着小伙伴们都洋溢着开心地笑容满载而归，真的是意犹未尽。',
      '昨天在海滩上，我和螃蟹们斗智斗勇，收获满满，而今天我们要换一种方式去接近大海，潜导带着我们穿上潜水装备，背上沉甸甸的氧气罐去体验十米左右的深潜，开启一场新的冒险。我站在船舷上，看着一望无际的大海，感觉开始心里有点慢慢打退堂鼓犹豫不决。一面想着不愿损失这么好的机会，毕竟那可是美金，应该是笔不小的费用；一面又在逼自己向前，如果不尝试怎么知道自己会不会成功呢！终于我还是硬着头皮跳入深不见底的海水中，那一瞬间，我克服了心理巨大的障碍，一股自豪涌上心头\u2014\u2014我竟然做到了，心里既惊又喜。我刚潜下去的时候，耳膜被海水压的非常刺疼，于是，我按照潜导教的方法捏住鼻子做耳压，瞬间，耳朵像打了气一样慢慢鼓起来。随着教练的手势提醒，我慢慢调整呼吸，用嘴一吸一呼，渐渐找到节奏。刚开始下水时，还有一丝温热，每下潜一米海水就会冰一分。阵阵寒意直逼我的骨头里，四五米之后，当身体习惯这股冷意，冰凉感反而成了一种刺激，整个神经都被唤醒，感觉自己已经属于海洋的一部分。忽然眼前闪过一群五彩斑斓的鱼在珊瑚丛中轻轻摇曳，宛如一幅流动的水彩画。时而钻进缝隙，时而又成群结队地游出来。阳光透过水面洒在深海，照得它们的鳞片闪闪发亮，把海底装点成一座梦幻的花园。此刻的画面让我忘记所有的紧张和不适都。在那一刻通通抛入脑后，忘记时间的流逝。教练拍了拍我的肩膀，示意我上浮。我依依不舍地抬头，随着身体一点点上升，阳光越来越耀眼，耳边渐渐传来船上的喧闹声\u2014\u2014我回到了现实。登上船我的心情久久不能平复，感觉人虽然在船上但是心却还留在海底了。那一晚我带着海底的回忆进入梦乡。',
      '第二天清晨，又有新的惊喜在等着我\u2014\u2014追逐海豚。我一直想着能不能真的看到这些海洋精灵。潜导说海豚常常会出现在这一片海域，但也要看运气。我满怀期待，不停望着远方的海面，眼睛几乎都舍不得眨。船渐渐开远，我看见的只是无边的渐变蓝。海浪轻轻拍打船身，发出\u201C隆隆隆\u201D的声音。我有点失望，心想：也许今天真的没有机会了。周围那么安静，只有风吹过和水声。我开始慢慢泄气，时间一分一秒地过去，我几乎想要放弃继续寻找。看着空荡荡的海面，我心里叹了口气，告诉自己：\u201C算了，可能今天见不到海豚了。\u201D可就在这时，海面溅起一大团水花！我猛地抬起头，正好看到一只海豚高高地跃出海面。它的身体在阳光下闪着亮光，像一条弯弯的弧线，然后\u201C扑通\u201D一声落回水里。那一刻，我整个人都惊呆了，心脏跳得特别快。我兴奋得大声喊出来，感觉刚才所有的失望一下子都被冲走了。海豚的出现就像一份意外的礼物，我们发现海豚喜欢在船头的甲板地下游泳。最幸运的是，我们竟然看到了一个海豚跃出水面，并且在空中华丽地转了一个圈，再跳回水里！我觉得今天简直是运气爆棚！',
      '当然如果你要问我，整个旅程最刺激的点是在哪里？我会义无反顾地告诉你一定是和护士鲨一起自由潜！起初刚下水时，我们并没有意识到有很多大家伙，只有潜到水底才稀疏看到几条护士鲨。过了一会儿，当船员拿来几条新鲜的鱼，切碎后不停地在海里摇摆来吸引护士鲨。不一会儿，这一举动吸引了几十条鲨鱼过来，瞬间就包围了我们。我又害怕又激动，我仔细地看着这些大家伙，它的皮肤灰白色，身长大约两米左右。当它们蜂拥而上抢鱼吃的时候，场面太壮观，仿佛像春运火车站一样繁忙。于是，弱小的我被护士鲨庞大的身躯撞来撞去。我第一次跟这么大鱼类动物有肢体接触。它的嘴巴旁边有2个细长的胡须，远远看去像牙齿一样。但他们真正的牙齿并不像普通的鲨鱼一样，又尖又锋利。它们并不会张着血盆大口。但由于数量的庞大，我的心一直全程悬着。我怕我的脚蹼不小心伤害到它，因为它们都纷纷簇拥聚集在围船尾等投喂导致我们无法回船，我一心只想拼出一条上岸的路。场面一度混乱。也不知道哪里来的力气，我奋勇而上，居然让我杀出一条\u201C血路\u201D能够独自虎口脱险，我不得不佩服自己的勇气，上岸后站在船尾看着那在蜂拥抢食的护士鲨仍旧心有余悸！这样刻骨铭心的记忆实在让人难以忘怀！',
      '短短几天的马尔代夫之旅虽然结束了，但那片碧海蓝天已经深深刻在我心里。踏上回新加坡的飞机上我闭上眼睛脑海里不时的回忆起浮在水里的画面和小伙伴们玩\u201C兔人杀\u201D的场景，这趟旅行，不只是快乐的回忆，更是收获了更多的友谊，也丰富了我的人生经历！期待下一个假期和小伙伴们的美好相遇！'

      '看到这一幕，我的鼻子一酸，眼泪差点夺眶而出。我连忙走上前，轻声说："妈妈，我来帮你吧。"妈妈抬起头，先是一愣，然后露出了疲倦但欣慰的笑容。',

function renderOutlineStep() {
  var h = '<div class="back-row"><button class="back-btn" onclick="goHome()">\u2190 返回首页</button></div>';
  h += '<h2 style="font-size:20px;font-weight:900;margin-bottom:4px;">\uD83C\uDFD7\uFE0F 列骨架 \u2014\u2014 作文骨架搭建器</h2>';
  h += '<p style="font-size:12px;color:var(--text2);margin-bottom:16px;">一步一步搭建你的作文骨架，写作不再迷路！</p>';

  // Step indicator
  var stepNames = ['选题', '选模板', '填骨架', '查看骨架', '写作'];
  h += '<div class="ob-step-indicator">';
  for (var i = 0; i < stepNames.length; i++) {
    if (i > 0) h += '<div class="ob-step-line"></div>';
    var cls = i < obStep ? 'done' : (i === obStep ? 'active' : '');
    h += '<div class="ob-step-dot ' + cls + '">' + (i + 1) + '</div>';
  }
  h += '</div>';

  if (obStep === 0) h += renderOBStep0();
  else if (obStep === 1) h += renderOBStep1();
  else if (obStep === 2) h += renderOBStep2();
  else if (obStep === 3) h += renderOBStep3();
  else if (obStep === 4) h += renderOBStep4();

  document.getElementById('outlineScreen').innerHTML = h;
}

function obGetTopic() {

function obSelectTemplate(idx) {

}
function obSaveNote(idx) {

function obSaveAllNotes() {
  var tmpl = OB_TEMPLATES[obSelectedTemplate];

  for (var i = 0; i < tmpl.sections.length; i++) {
    var el = document.getElementById('obNote' + i);

function obNextStep() {
  if (obStep === 0) {
    var ci = document.getElementById('obCustomInput');
    if (ci && ci.value.trim()) obCustomTopic = ci.value.trim();
    if (!obGetTopic() || obGetTopic() === '（未选择）') { alert('请先选择或输入一个题目！'); return; }
  }
  if (obStep === 1 && obSelectedTemplate < 0) { alert('请先选择一个模板！'); return; }
  obStep++;
  renderOutlineStep();
  window.scrollTo(0, 0);
}
function obPrevStep() {
  if (obStep > 0) obStep--;
  renderOutlineStep();
  window.scrollTo(0, 0);
}
function obUpdateCharCount() {
  var el = document.getElementById('obWritingInput');
  var counter = document.getElementById('obCharCounter');
  if (!el || !counter) return;
  var text = el.value.replace(/\s/g, '');
  var count = text.length;
  counter.textContent = count + ' / 300-500 字';
  if (count < 200) counter.className = 'char-counter cc-red';
  else if (count < 300) counter.className = 'char-counter cc-orange';
  else counter.className = 'char-counter cc-green';
}
function obSaveDraft() {
  var el = document.getElementById('obWritingInput');
  if (!el) return;
  try { localStorage.setItem('ob_draft_' + obGetTopic(), el.value); } catch(e) {}
}
function obSaveToStorage() {
  try {
    var data = { topic: obGetTopic(), template: OB_TEMPLATES[obSelectedTemplate].name, notes: obSectionNotes, timestamp: new Date().toISOString() };
    localStorage.setItem('ob_outline_' + obGetTopic(), JSON.stringify(data));
  } catch(e) {}
}

var spinning = false, spinAngle = 0;
function openSpinner() {
  showScreen('spinnerScreen');
  renderSpinner();
}
function renderSpinner() {
  var h = '<div class="back-row"><button class="back-btn" onclick="goHome()">\u2190 返回首页</button></div>';
  h += '<h2 style="text-align:center;font-size:20px;font-weight:900;margin-bottom:8px;">\uD83C\uDFB0 作文转盘</h2>';

  h += '<div class="spinner-container">';
  h += '<div class="wheel-wrapper"><div class="wheel-pointer">\u25BC</div><canvas id="wheelCanvas" width="300" height="300"></canvas></div>';
  h += '<button class="spin-btn" id="spinBtn" onclick="doSpin()">转一转！</button>';
  h += '</div>';
  h += '<div class="spin-result" id="spinResult"></div>';
  document.getElementById('spinnerScreen').innerHTML = h;
  drawWheel(0);
}
function drawWheel(angle) {
  var canvas = document.getElementById('wheelCanvas');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var cx = 150, cy = 150, r = 144;
  var n = TOPICS.length;
  var sliceAngle = 2 * Math.PI / n;
  ctx.clearRect(0, 0, 300, 300);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle * Math.PI / 180);
  for (var i = 0; i < n; i++) {
    var startA = i * sliceAngle - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, r, startA, startA + sliceAngle);
    ctx.closePath();
    ctx.fillStyle = TOPICS[i].color;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.save();
    ctx.rotate(startA + sliceAngle / 2);
    ctx.translate(r * 0.55, 0);
    ctx.rotate(Math.PI / 2);
    ctx.fillStyle = '#fff';
    ctx.font = '900 13px "Noto Sans SC"';
    ctx.textAlign = 'center';
    ctx.fillText(TOPICS[i].emoji, 0, -6);
    ctx.font = '700 11px "Noto Sans SC"';
    var title = TOPICS[i].title;
    if (title.length > 6) title = title.substring(0, 6) + '\u2026';
    ctx.fillText(title, 0, 10);
    ctx.restore();
  }
  ctx.restore();
}
function doSpin() {
  if (spinning) return;
  spinning = true;
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('spinResult').style.display = 'none';
  var extraSpins = 5 + Math.floor(Math.random() * 3);
  var targetIdx = Math.floor(Math.random() * TOPICS.length);
  var sliceDeg = 360 / TOPICS.length;
  var targetAngle = 360 - (targetIdx * sliceDeg + sliceDeg / 2);
  var totalAngle = spinAngle + extraSpins * 360 + targetAngle;
  spinAngle = totalAngle;
  var startTime = null;
  var duration = 4000;
  var startA = spinAngle - extraSpins * 360 - targetAngle;
  function animate(timestamp) {
    if (!startTime) startTime = timestamp;
    var elapsed = timestamp - startTime;
    var progress = Math.min(elapsed / duration, 1);
    var ease = 1 - Math.pow(1 - progress, 3);
    var currentAngle = startA + (totalAngle - startA) * ease;
    drawWheel(currentAngle);
    if (progress < 1) { requestAnimationFrame(animate); }
    else {
      spinning = false;
      document.getElementById('spinBtn').disabled = false;
      showSpinResult(TOPICS[targetIdx]);
    }
  }
  requestAnimationFrame(animate);
}
function showSpinResult(topic) {
  var box = document.getElementById('spinResult');
  var h = '<div class="sr-emoji">' + topic.emoji + '</div>';
  h += '<div class="sr-title">' + topic.title + '</div>';
  h += '<div class="sr-type">' + topic.type + '</div>';
  h += '<div class="sr-btns">';
  if (topic.essayId) {
    h += '<button class="sr-btn sr-btn-primary" onclick="openEssay(\'' + topic.essayId + '\')">\uD83D\uDCD6 看范文</button>';
  }
  h += '<button class="sr-btn sr-btn-secondary" onclick="openWriting(\'' + topic.title + '\')">\u270D\uFE0F 练写作</button>';
  h += '</div>';
  box.innerHTML = h;
  box.style.display = 'block';
}

function openQuiz() {
  quizQueue = QUESTIONS.slice().sort(function() { return Math.random() - 0.5; });
  currentQ = 0; correctCount = 0; hearts = 5; streak = 0;
  showScreen('questionScreen');
  document.getElementById('topBar').style.display = 'flex';
  document.getElementById('bottomBar').style.display = 'flex';
  renderQuestion();
}
function renderQuestion() {
  if (currentQ >= quizQueue.length) { showResults(); return; }
  var q = quizQueue[currentQ];
  selectedOption = -1; answered = false;
  document.getElementById('progressFill').style.width = Math.round((currentQ / quizQueue.length) * 100) + '%';
  document.getElementById('heartsDisplay').innerHTML = '\u2764\uFE0F ' + hearts;
  document.getElementById('streakDisplay').innerHTML = '\uD83D\uDD25 ' + streak;
  var btn = document.getElementById('checkBtn');
  btn.className = 'check-btn disabled';
  btn.textContent = '检查答案';
  document.getElementById('feedback').className = 'feedback';

  var h = '<div class="q-header"><div class="q-type">\uD83D\uDCDD ' + q.type + ' \u00B7 第 ' + (currentQ + 1) + '/' + quizQueue.length + ' 题</div>';
  h += '<h2>' + q.q + '</h2></div>';
  h += '<div class="options">';
  var labels = ['A', 'B', 'C', 'D'];
  q.options.forEach(function(opt, i) {
    h += '<div class="option-btn" onclick="selectOpt(' + i + ')" id="opt' + i + '"><div class="option-num">' + labels[i] + '</div><span>' + opt + '</span></div>';
  });
  h += '</div>';
  document.getElementById('questionContent').innerHTML = h;
}
function selectOpt(i) {
  if (answered) return;
  selectedOption = i;
  document.querySelectorAll('.option-btn').forEach(function(b, idx) {
    b.classList.toggle('selected', idx === i);
  });
  var btn = document.getElementById('checkBtn');
  btn.className = 'check-btn ready';
}
function onCheck() {
  var btn = document.getElementById('checkBtn');
  if (btn.classList.contains('disabled')) return;
  if (answered) { nextQuestion(); return; }
  answered = true;
  var q = quizQueue[currentQ];
  var correct = selectedOption === q.answer;
  document.getElementById('opt' + q.answer).classList.add('correct');
  if (!correct) document.getElementById('opt' + selectedOption).classList.add('wrong');

  var fb = document.getElementById('feedback');
  if (correct) {
    fb.className = 'feedback correct-fb show';
    fb.innerHTML = '\u2705 答对了！<div class="fb-explain">' + q.explain + '</div>';
    xp += 10; streak++; correctCount++;
    showXP('+10 XP');
  } else {
    fb.className = 'feedback wrong-fb show';
    fb.innerHTML = '\u274C 答错了<div class="fb-explain">' + q.explain + '</div>';
    hearts--; streak = 0;
    document.getElementById('heartsDisplay').innerHTML = '\u2764\uFE0F ' + hearts;
  }
  questionsAnswered++;
  btn.className = 'check-btn next';
  btn.textContent = '下一题 \u2192';
  if (hearts <= 0) { setTimeout(showResults, 1500); }
}
function nextQuestion() {
  currentQ++;
  document.getElementById('feedback').className = 'feedback';
  if (currentQ >= quizQueue.length || hearts <= 0) showResults();
  else renderQuestion();
}
function showResults() {
  showScreen('resultsScreen');
  document.getElementById('topBar').style.display = 'none';
  document.getElementById('bottomBar').style.display = 'none';
  document.getElementById('feedback').className = 'feedback';
  var pct = quizQueue.length > 0 ? Math.round((correctCount / quizQueue.length) * 100) : 0;
  var grade = pct >= 90 ? '\uD83C\uDF1F 太棒了！' : pct >= 70 ? '\uD83D\uDC4D 很不错！' : pct >= 50 ? '\uD83D\uDCAA 继续加油' : '\uD83D\uDCDA 多读范文再来';
  var h = '<div class="trophy">' + (pct >= 70 ? '\uD83C\uDFC6' : '\uD83D\uDCD6') + '</div>';
  h += '<h1>闯关完成！</h1>';
  h += '<div class="score-ring"><div class="score-num">' + pct + '%</div></div>';
  h += '<div style="font-size:18px;font-weight:900;margin:8px 0;">' + grade + '</div>';
  h += '<div class="stat-row">';
  h += '<div class="stat-item"><div class="stat-val" style="color:var(--green);">' + correctCount + '</div><div class="stat-label">答对</div></div>';
  h += '<div class="stat-item"><div class="stat-val" style="color:var(--red);">' + (quizQueue.length - correctCount) + '</div><div class="stat-label">答错</div></div>';
  h += '<div class="stat-item"><div class="stat-val" style="color:var(--gold);">+' + (correctCount * 10) + '</div><div class="stat-label">XP</div></div>';
  h += '</div>';
  h += '<button class="restart-btn" onclick="goHome()">返回首页</button>';
  document.getElementById('resultsContent').innerHTML = h;
}

// =========================================================
// TOOLBOX
// =========================================================
var currentToolTab = '好词好句';
function openToolbox() {
  showScreen('toolboxScreen');
  renderToolbox();
}
function renderToolbox() {
  var h = '<div class="back-row"><button class="back-btn" onclick="goHome()">\u2190 返回首页</button></div>';
  h += '<h2 style="font-size:20px;font-weight:900;margin-bottom:16px;">\uD83E\uDDF0 写作工具箱</h2>';
  h += '<div class="toolbox-tabs">';
  Object.keys(TOOLBOX).forEach(function(tab) {
    h += '<button class="toolbox-tab' + (tab === currentToolTab ? ' active' : '') + '" onclick="switchToolTab(\'' + tab + '\')">' + tab + '</button>';
  });
  h += '</div>';
  var items = TOOLBOX[currentToolTab];
  items.forEach(function(item) {
    h += '<div class="toolbox-card"><div class="tc-cat">\uD83D\uDCCC ' + item.cat + '</div>';
    item.examples.forEach(function(ex) {
      h += '<div class="tc-example">' + ex + '</div>';
    });
    h += '<div class="tc-tip">\uD83D\uDCA1 ' + item.tip + '</div></div>';
  });
  document.getElementById('toolboxScreen').innerHTML = h;
}
function switchToolTab(tab) { currentToolTab = tab; renderToolbox(); }

// =========================================================
// WRITING PRACTICE
// =========================================================
function openWriting(topic) {
  showScreen('writingScreen');
  var savedDraft = '';
  try { savedDraft = localStorage.getItem('writing_draft_' + topic) || ''; } catch(e) {}
  var h = '<div class="back-row"><button class="back-btn" onclick="goHome()">\u2190 返回首页</button></div>';
  h += '<h2 style="font-size:20px;font-weight:900;margin-bottom:8px;">\u270D\uFE0F 写作练习</h2>';
  h += '<p style="font-size:14px;color:var(--text2);margin-bottom:16px;">题目：<strong style="color:var(--red);">' + topic + '</strong></p>';
  h += '<div class="tip-box"><strong>\uD83D\uDCA1 写作提醒：</strong><br>';
  h += '1. 开头要有环境描写或回忆引入<br>';
  h += '2. 中间要有转折和高潮<br>';
  h += '3. 多用比喻、拟人等修辞手法<br>';
  h += '4. 结尾扣题 + 写出感悟<br>';
  h += '5. 目标字数：300-500字</div>';
  h += '<div class="writing-area">';
  h += '<textarea id="writingInput" placeholder="在这里写作文\u2026\u2026" oninput="updateCharCount()" onblur="saveWritingDraft(\'' + topic.replace(/'/g, "\\'") + '\')">' + savedDraft + '</textarea>';
  h += '<div class="char-counter cc-red" id="charCounter">0 / 300-500 字</div>';
  h += '</div>';
  document.getElementById('writingScreen').innerHTML = h;
}
function updateCharCount() {
  var text = document.getElementById('writingInput').value.replace(/\s/g, '');
  var count = text.length;
  var el = document.getElementById('charCounter');
  el.textContent = count + ' / 300-500 字';
  if (count < 200) { el.className = 'char-counter cc-red'; }
  else if (count < 300) { el.className = 'char-counter cc-orange'; }
  else { el.className = 'char-counter cc-green'; }
}
function saveWritingDraft(topic) {
  var el = document.getElementById('writingInput');
  if (!el) return;
  try { localStorage.setItem('writing_draft_' + topic, el.value); } catch(e) {}
}

// =========================================================
// XP ANIMATION
// =========================================================
function showXP(text) {
  var el = document.getElementById('xpPopup');
  el.textContent = text;
  el.className = 'xp-popup show';
  setTimeout(function() { el.className = 'xp-popup hide'; }, 800);
  setTimeout(function() { el.className = 'xp-popup'; }, 1300);
}

// =========================================================
// INIT
// =========================================================
renderHome();
</script>
</body>
</html>
