<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSLE Vocabulary Trainer</title>
<style>
/* ============ THEME SYSTEM ============ */
:root {
  --hue: 145; /* green default */
  --primary: hsl(var(--hue), 55%, 48%);
  --primary-light: hsl(var(--hue), 50%, 94%);
  --primary-dark: hsl(var(--hue), 55%, 38%);
  --primary-glow: hsl(var(--hue), 60%, 55%);
  --bg: #f5f7fa;
  --bg2: #ffffff;
  --card: #ffffff;
  --card-border: hsl(var(--hue), 18%, 88%);
  --text: #3c3c3c;
  --text2: #777;
  --text3: #aaa;
  --correct: #58cc02;
  --correct-bg: #d7ffb8;
  --wrong: #ff6b6b;
  --wrong-bg: #ffeaea;
  --shadow: 0 2px 0 hsl(var(--hue), 25%, 84%);
  --shadow-lg: 0 4px 0 hsl(var(--hue), 25%, 82%);
  --radius: 16px;
  --font: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
}
[data-theme="ocean"] {
  --hue: 200;
  --primary: hsl(200, 55%, 52%);
  --primary-dark: hsl(200, 55%, 42%);
  --primary-glow: hsl(200, 50%, 60%);
}
[data-theme="sunset"] {
  --hue: 280;
  --primary: hsl(280, 45%, 58%);
  --primary-dark: hsl(280, 45%, 48%);
  --primary-glow: hsl(280, 40%, 65%);
}
[data-theme="dark"] {
  --hue: 145;
  --bg: #1b1d2a;
  --bg2: #232538;
  --card: #2a2d42;
  --card-border: #3d4060;
  --text: #f0f0f5;
  --text2: #b0b3c5;
  --text3: #7e8199;
  --primary: hsl(145, 50%, 50%);
  --primary-light: hsl(145, 30%, 22%);
  --primary-dark: hsl(145, 50%, 38%);
  --primary-glow: hsl(145, 50%, 55%);
  --correct: #66d44a;
  --correct-bg: rgba(102, 212, 74, 0.15);
  --wrong: #ff7070;
  --wrong-bg: rgba(255, 112, 112, 0.15);
  --shadow: 0 2px 0 rgba(0,0,0,0.3);
  --shadow-lg: 0 4px 0 rgba(0,0,0,0.35);
}

@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
  transition: background 0.3s, color 0.3s;
}

/* ============ LAYOUT ============ */
.app { max-width: 680px; margin: 0 auto; padding: 12px 16px 80px; }

/* ============ TOP BAR ============ */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0; margin-bottom: 8px;
}
.topbar-left { display: flex; align-items: center; gap: 8px; }
.topbar-logo {
  font-size: 1.4em; font-weight: 900; color: var(--primary);
  letter-spacing: -0.5px;
}
.topbar-logo span { font-size: 0.7em; }
.topbar-right { display: flex; align-items: center; gap: 6px; }

/* Theme pills */
.theme-btn {
  width: 28px; height: 28px; border-radius: 50%; border: 3px solid transparent;
  cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center;
  font-size: 0.7em; font-weight: 800;
}
.theme-btn:hover { transform: scale(1.15); }
.theme-btn.active { border-color: var(--text); box-shadow: 0 0 0 2px var(--bg); }
.theme-green { background: hsl(145, 55%, 48%); }
.theme-ocean { background: hsl(200, 55%, 52%); }
.theme-sunset { background: hsl(280, 45%, 58%); }
.theme-dark { background: #2a2d42; border: 2px solid #555; }

/* Streak & XP */
.streak-badge {
  display: flex; align-items: center; gap: 4px;
  background: var(--primary-light); padding: 4px 10px; border-radius: 20px;
  font-weight: 800; font-size: 0.85em; color: var(--primary);
}

/* ============ TABS ============ */
.tabs {
  display: flex; gap: 0; background: var(--bg2); border-radius: 14px;
  padding: 4px; margin-bottom: 20px; box-shadow: var(--shadow);
}
.tab {
  flex: 1; text-align: center; padding: 10px 8px; border-radius: 10px;
  font-weight: 700; font-size: 0.9em; cursor: pointer; color: var(--text2);
  transition: all 0.2s; border: none; background: transparent;
}
.tab.active {
  background: var(--primary); color: white; box-shadow: 0 2px 0 var(--primary-dark);
}
.tab:hover:not(.active) { color: var(--text); }

/* ============ HOME SCREEN ============ */
.section-title {
  font-size: 1.1em; font-weight: 800; color: var(--text);
  margin: 20px 0 10px; display: flex; align-items: center; gap: 8px;
}
.section-title .emoji { font-size: 1.2em; }

/* Category cards - Duolingo skill tree style */
.cat-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px;
}
.cat-card {
  background: var(--card); border: 2px solid var(--card-border);
  border-radius: var(--radius); padding: 16px; cursor: pointer;
  transition: all 0.15s; position: relative; overflow: hidden;
  box-shadow: var(--shadow);
}
.cat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.cat-card:active { transform: translateY(1px); box-shadow: none; }
.cat-icon { font-size: 1.8em; margin-bottom: 6px; }
.cat-name { font-weight: 800; font-size: 0.95em; margin-bottom: 4px; }
.cat-count { font-size: 0.8em; color: var(--text2); margin-bottom: 8px; }
.cat-progress { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.cat-progress-fill {
  height: 100%; border-radius: 4px; transition: width 0.4s;
  background: linear-gradient(90deg, var(--primary), var(--primary-glow));
}
.cat-pct {
  position: absolute; top: 10px; right: 12px;
  font-size: 0.75em; font-weight: 800; color: var(--primary);
}
.cat-card.mastered { border-color: var(--correct); }
.cat-card.mastered .cat-pct { color: var(--correct); }

/* Quick action buttons */
.quick-actions { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.action-btn {
  flex: 1; min-width: 140px; padding: 14px 12px; border: 2px solid var(--card-border);
  border-radius: var(--radius); background: var(--card); cursor: pointer;
  font-family: var(--font); font-weight: 700; font-size: 0.88em;
  color: var(--text); transition: all 0.15s; text-align: center;
  box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; gap: 6px;
}
.action-btn:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-1px); }
.action-btn:active { transform: translateY(1px); box-shadow: none; }
.action-btn.primary {
  background: var(--primary); color: white; border-color: var(--primary-dark);
  box-shadow: 0 4px 0 var(--primary-dark);
}
.action-btn.primary:hover { filter: brightness(1.05); }

/* Overall stats */
.stats-row {
  display: flex; justify-content: space-around; gap: 8px;
  background: var(--card); border-radius: var(--radius); padding: 16px;
  margin-bottom: 16px; box-shadow: var(--shadow); border: 2px solid var(--card-border);
}
.stat-item { text-align: center; }
.stat-val { font-size: 1.6em; font-weight: 900; color: var(--primary); }
.stat-label { font-size: 0.72em; color: var(--text2); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }

/* Paper list */
.paper-list { display: flex; flex-direction: column; gap: 8px; }
.paper-row {
  display: flex; align-items: center; gap: 12px; padding: 12px 16px;
  background: var(--card); border: 2px solid var(--card-border); border-radius: 12px;
  cursor: pointer; transition: all 0.15s; box-shadow: var(--shadow);
}
.paper-row:hover { border-color: var(--primary); transform: translateY(-1px); }
.paper-row:active { transform: translateY(1px); box-shadow: none; }
.paper-icon { font-size: 1.3em; }
.paper-info { flex: 1; }
.paper-name { font-weight: 700; font-size: 0.9em; }
.paper-meta { font-size: 0.78em; color: var(--text2); }
.paper-prog { width: 48px; text-align: right; font-weight: 800; font-size: 0.85em; color: var(--primary); }

/* ============ QUIZ SCREEN ============ */
.quiz-header {
  display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
}
.quiz-close {
  width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--card-border);
  background: var(--card); display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 1.1em; color: var(--text2); font-weight: 700;
  transition: all 0.15s;
}
.quiz-close:hover { border-color: var(--wrong); color: var(--wrong); }
.progress-track {
  flex: 1; height: 14px; background: var(--bg2); border-radius: 7px; overflow: hidden;
  border: 2px solid var(--card-border);
}
.progress-fill {
  height: 100%; border-radius: 5px; transition: width 0.5s ease-out;
  background: linear-gradient(90deg, var(--primary), var(--primary-glow));
}
.quiz-score {
  font-weight: 800; font-size: 0.85em; color: var(--primary);
  min-width: 50px; text-align: right;
}

/* Question card */
.q-card {
  background: var(--card); border: 2px solid var(--card-border);
  border-radius: var(--radius); padding: 24px 20px; margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.q-badges { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.q-badge {
  padding: 3px 10px; border-radius: 20px; font-size: 0.72em; font-weight: 800;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.q-badge-type { background: var(--primary-light); color: var(--primary); }
.q-badge-cat { background: #fff3e0; color: #e65100; }
.q-badge-src { background: var(--bg); color: var(--text2); }

.q-passage {
  background: var(--bg); border-left: 4px solid var(--primary);
  padding: 14px 16px; margin-bottom: 16px; border-radius: 0 12px 12px 0;
  font-size: 0.9em; line-height: 1.7; color: var(--text2);
}
.q-passage .target { font-weight: 800; color: var(--primary); text-decoration: underline; }

.q-instruction { font-size: 0.82em; color: var(--text3); margin-bottom: 10px; font-weight: 600; }

.q-sentence {
  font-size: 1.05em; font-weight: 700; margin-bottom: 20px; line-height: 1.6;
}
.q-sentence .blank {
  display: inline-block; min-width: 90px; border-bottom: 3px solid var(--primary);
  margin: 0 4px; vertical-align: bottom;
}

/* Options */
.options { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border: 2px solid var(--card-border);
  border-radius: 14px; background: var(--card); cursor: pointer;
  font-size: 0.95em; font-weight: 600; transition: all 0.1s;
  box-shadow: 0 2px 0 var(--card-border);
  font-family: var(--font);
  width: 100%; text-align: left;
}
.opt:hover:not(.disabled) {
  border-color: var(--primary); background: var(--primary-light);
  box-shadow: 0 2px 0 var(--primary-dark);
}
.opt:active:not(.disabled) { transform: translateY(1px); box-shadow: none; }
.opt-letter {
  width: 30px; height: 30px; border-radius: 8px; border: 2px solid var(--card-border);
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 0.85em; flex-shrink: 0; background: var(--bg);
  color: var(--text2);
}
[data-theme="dark"] .opt { border-color: #4a4d6a; color: #e8e9f0; }
[data-theme="dark"] .opt-letter { border-color: #4a4d6a; background: #343750; color: #c5c8da; }
[data-theme="dark"] .opt:hover:not(.disabled) { border-color: var(--primary); background: rgba(88, 204, 2, 0.08); }
[data-theme="dark"] .q-passage { background: #232538; border-left-color: var(--primary); }
[data-theme="dark"] .explanation { background: #232538; border-color: #3d4060; }
[data-theme="dark"] .q-badge-cat { background: rgba(255, 152, 0, 0.15); }
[data-theme="dark"] .q-badge-type { background: rgba(88, 204, 2, 0.12); }
[data-theme="dark"] .q-badge-src { background: #343750; }
[data-theme="dark"] .cat-progress { background: #343750; }
[data-theme="dark"] .progress-track { background: #343750; border-color: #3d4060; }
.opt.correct {
  border-color: var(--correct); background: var(--correct-bg);
  box-shadow: 0 2px 0 #3fa301; animation: correctPop 0.3s ease;
}
.opt.correct .opt-letter { background: var(--correct); color: white; border-color: #3fa301; }
.opt.wrong {
  border-color: var(--wrong); background: var(--wrong-bg);
  box-shadow: 0 2px 0 #d63131; animation: shake 0.4s ease;
}
.opt.wrong .opt-letter { background: var(--wrong); color: white; border-color: #d63131; }
.opt.disabled { cursor: default; }
.opt.dimmed { opacity: 0.45; }

@keyframes correctPop {
  0% { transform: scale(1); }
  50% { transform: scale(1.03); }
  100% { transform: scale(1); }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

/* Explanation panel */
.explanation {
  margin-top: 16px; padding: 18px; border-radius: 14px;
  border: 2px solid var(--card-border); background: var(--bg);
  animation: slideUp 0.3s ease;
}
.explanation.hidden { display: none; }
.exp-header {
  font-weight: 800; font-size: 1em; margin-bottom: 12px;
  display: flex; align-items: center; gap: 6px;
}
.exp-header.right { color: var(--correct); }
.exp-header.wrong-h { color: var(--wrong); }
.exp-item {
  padding: 8px 0; font-size: 0.88em; line-height: 1.5;
  border-bottom: 1px solid var(--card-border);
}
.exp-item:last-child { border-bottom: none; }
.exp-word { font-weight: 800; }
.exp-correct-word { color: var(--correct); }
.exp-wrong-word { color: var(--text2); }

@keyframes slideUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Continue button (Duolingo-style bottom bar) */
.bottom-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  padding: 12px 16px; background: var(--bg);
  border-top: 2px solid var(--card-border);
  display: flex; justify-content: center;
  z-index: 100;
}
.bottom-bar.hidden { display: none; }
.continue-btn {
  width: 100%; max-width: 648px; padding: 16px; border: none;
  border-radius: 14px; font-family: var(--font); font-weight: 800;
  font-size: 1em; cursor: pointer; text-transform: uppercase;
  letter-spacing: 1px; transition: all 0.1s;
}
.continue-btn.check {
  background: var(--primary); color: white;
  box-shadow: 0 4px 0 var(--primary-dark);
}
.continue-btn.check:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--primary-dark); }
.continue-btn.correct-btn {
  background: var(--correct); color: white;
  box-shadow: 0 4px 0 #3fa301;
}
.continue-btn.wrong-btn {
  background: var(--wrong); color: white;
  box-shadow: 0 4px 0 #d63131;
}

/* ============ RESULTS SCREEN ============ */
.results { text-align: center; padding: 30px 0; }
.results-emoji { font-size: 4em; margin-bottom: 12px; animation: bounce 0.6s ease; }
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-20px); }
}
.results h2 { font-size: 1.5em; font-weight: 900; margin-bottom: 4px; }
.results-sub { color: var(--text2); margin-bottom: 20px; }

.score-ring {
  width: 140px; height: 140px; margin: 0 auto 20px; position: relative;
}
.score-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.score-ring circle {
  fill: none; stroke-width: 10; stroke-linecap: round;
}
.score-ring .bg-ring { stroke: var(--bg2); }
.score-ring .fg-ring {
  stroke: var(--primary); transition: stroke-dashoffset 1s ease;
}
.score-ring .score-text {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  font-size: 2em; font-weight: 900; color: var(--primary);
}
.score-ring .score-pct {
  position: absolute; top: 62%; left: 50%; transform: translate(-50%, 0);
  font-size: 0.85em; font-weight: 700; color: var(--text2);
}

.xp-gain {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--primary-light); padding: 8px 20px; border-radius: 20px;
  font-weight: 800; color: var(--primary); margin-bottom: 20px;
}

.results-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 24px; }

.review-list { text-align: left; margin-top: 16px; }
.review-header { font-weight: 800; font-size: 0.95em; margin-bottom: 8px; }
.review-item {
  padding: 10px 14px; background: var(--card); border-radius: 10px;
  margin-bottom: 6px; border-left: 4px solid var(--wrong);
  font-size: 0.85em; cursor: pointer; transition: all 0.15s;
}
.review-item:hover { background: var(--bg2); }

/* ============ STREAK POPUP ============ */
.streak-popup {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: var(--card); border-radius: 20px; padding: 30px 40px;
  text-align: center; z-index: 200; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  animation: popIn 0.4s ease;
}
.streak-popup.hidden { display: none; }
.streak-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5); z-index: 199;
}
.streak-overlay.hidden { display: none; }
.streak-popup .emoji { font-size: 3em; }
.streak-popup h3 { font-size: 1.3em; font-weight: 900; margin: 8px 0; color: var(--primary); }
.streak-popup p { color: var(--text2); font-weight: 600; }

@keyframes popIn {
  from { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
  to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}

/* ============ RESPONSIVE ============ */
@media (max-width: 500px) {
  .cat-grid { grid-template-columns: 1fr; }
  .q-card { padding: 18px 14px; }
  .topbar-logo { font-size: 1.2em; }
}
</style>
</head>
<body>

<div class="app" id="app"></div>

<!-- Streak popup -->
<div class="streak-overlay hidden" id="streakOverlay" onclick="closeStreak()"></div>
<div class="streak-popup hidden" id="streakPopup">
  <div class="emoji" id="streakEmoji"></div>
  <h3 id="streakTitle"></h3>
  <p id="streakText"></p>
</div>

<script>
// ============ DATA ============
const ALL_QUESTIONS = [{"id": "psle2024_eng_q11", "source": "PSLE 2024 English", "section": "Vocabulary MCQ", "qNum": 11, "sentence": "Li Ting went back to work when the ____________ of her health improved.", "options": ["state", "form", "level", "shape"], "answerIndex": 1, "answer": "state", "option_explanations": [{"key": "A", "value": "state", "Explanation": "Correct. 'State' refers to the particular condition that someone or something is in at a specific time. 'State of health' is a natural collocation."}, {"key": "B", "value": "form", "Explanation": "'Form' can mean condition (e.g., in good form), but 'the form of her health' is not a natural collocation."}, {"key": "C", "value": "level", "Explanation": "'Level of health' is less natural than 'state of health'. 'Level' is better used with measurable quantities."}, {"key": "D", "value": "shape", "Explanation": "'Shape' can mean condition (e.g., in good shape), but 'the shape of her health improved' is unnatural."}], "category": "Nouns"}, {"id": "psle2024_eng_q12", "source": "PSLE 2024 English", "section": "Vocabulary MCQ", "qNum": 12, "sentence": "The guest speaker spoke in a ____________ tone that bored the students to tears.", "options": ["stuffy", "tedious", "repetitious", "monotonous"], "answerIndex": 4, "answer": "monotonous", "option_explanations": [{"key": "A", "value": "stuffy", "Explanation": "'Stuffy' means lacking fresh air or overly formal. It doesn't describe a tone of voice that causes boredom."}, {"key": "B", "value": "tedious", "Explanation": "'Tedious' means boring and tiring, but it typically describes tasks or processes, not a tone of voice."}, {"key": "C", "value": "repetitious", "Explanation": "'Repetitious' means containing repetition. While repetitive speech can be boring, it doesn't specifically describe a tone."}, {"key": "D", "value": "monotonous", "Explanation": "Correct. 'Monotonous' means lacking in variety and interest — it perfectly describes a flat, unchanging tone that would bore listeners."}], "category": "Adjectives"}, {"id": "psle2024_eng_q13", "source": "PSLE 2024 English", "section": "Vocabulary MCQ", "qNum": 13, "sentence": "Much bigger than the lift of a residential building, a hospital lift can ____________ a trolley bed and a few people comfortably.", "options": ["enclose", "comprise", "incorporate", "accommodate"], "answerIndex": 4, "answer": "accommodate", "option_explanations": [{"key": "A", "value": "enclose", "Explanation": "'Enclose' means to surround or close in. While a lift encloses people, it doesn't mean 'have room for'."}, {"key": "B", "value": "comprise", "Explanation": "'Comprise' means to consist of or be made up of. A lift doesn't 'comprise' people and beds."}, {"key": "C", "value": "incorporate", "Explanation": "'Incorporate' means to include as part of something. It doesn't fit the idea of having space for people."}, {"key": "D", "value": "accommodate", "Explanation": "Correct. 'Accommodate' means to provide with a place to live or to have room for. The hospital lift can accommodate (fit) a trolley bed and people."}], "category": "Precise Verbs"}, {"id": "psle2024_eng_q14", "source": "PSLE 2024 English", "section": "Vocabulary MCQ", "qNum": 14, "sentence": "In this cooking competition, contestants will be ____________ on the taste and visual presentation of their dishes.", "options": ["analysed", "evaluated", "inspected", "measured"], "answerIndex": 2, "answer": "evaluated", "option_explanations": [{"key": "A", "value": "analysed", "Explanation": "'Analysed' means to examine in detail. While dishes can be analysed, it's not the natural word for judging competition entries."}, {"key": "B", "value": "evaluated", "Explanation": "Correct. 'Evaluated' means to judge or calculate the quality, importance, or value of something. Contestants are evaluated (judged) on their dishes."}, {"key": "C", "value": "inspected", "Explanation": "'Inspected' means to look at closely, typically for faults. It suggests a more official or regulatory check, not a competition judging."}, {"key": "D", "value": "measured", "Explanation": "'Measured' means to determine the size or amount. It doesn't fit the context of judging taste and presentation."}], "category": "Precise Verbs"}, {"id": "psle2024_eng_q15", "source": "PSLE 2024 English", "section": "Vocabulary MCQ", "qNum": 15, "sentence": "The class voted ____________ for Hassan to be the monitor as everyone thought that he would be able to do a good job.", "options": ["agreeably", "thoroughly", "consistently", "unanimously"], "answerIndex": 4, "answer": "unanimously", "option_explanations": [{"key": "A", "value": "agreeably", "Explanation": "'Agreeably' means in a pleasant manner. It doesn't describe how the class voted."}, {"key": "B", "value": "thoroughly", "Explanation": "'Thoroughly' means completely or in detail. 'Voted thoroughly' doesn't make sense in this context."}, {"key": "C", "value": "consistently", "Explanation": "'Consistently' means in the same way over time. One vote doesn't involve consistency."}, {"key": "D", "value": "unanimously", "Explanation": "Correct. 'Unanimously' means with the agreement of everyone. Since 'everyone thought he would do a good job', the class voted unanimously."}], "category": "Adverbs"}, {"id": "psle2024_eng_q16", "source": "PSLE 2024 English", "section": "Vocabulary Cloze", "qNum": 16, "passage": "I was watching, ready to jump into action. My prey moved gingerly, as if it was keenly(16) aware of my presence. With my gaze fixed on it, I followed stealthily. All of a sudden, the quietness(17) was broken by a rustling sound when I stepped on a plastic bag. Instinctively, I lunged forward(18) as my prey scurried away. I was fast and caught it in no time(19). Staring down at it, I decided to offer it as a gift to my masters. With a great leap, I got up the royal bed and placed it between the two sleeping masters. I crouched down and called out my greetings reverently(20). They woke up and were about to respond when they saw my gift. 'Fluffy left a huge lizard on our bed!' Mrs Tan screamed. 'Naughty cat!'", "sentence": "My prey moved gingerly, as if it was keenly aware of my presence.", "targetWord": "keenly", "options": ["slowly", "sharply", "steadily", "suddenly"], "answerIndex": 2, "answer": "sharply", "option_explanations": [{"key": "A", "value": "slowly", "Explanation": "'Keenly' doesn't mean slowly. 'Keenly aware' means acutely or intensely aware."}, {"key": "B", "value": "sharply", "Explanation": "Correct. 'Keenly' means in an acute, sharp, or intense manner. 'Sharply aware' captures the same meaning of heightened awareness."}, {"key": "C", "value": "steadily", "Explanation": "'Steadily' means in a regular, even manner. It doesn't capture the intensity of 'keenly'."}, {"key": "D", "value": "suddenly", "Explanation": "'Suddenly' means quickly and unexpectedly. 'Keenly' refers to intensity, not timing."}], "full_passage": "I was watching, ready to jump into action. My prey moved gingerly, as if it was keenly(16) aware of my presence. With my gaze fixed on it, I followed stealthily. All of a sudden, the quietness(17) was broken by a rustling sound when I stepped on a plastic bag. Instinctively, I lunged forward(18) as my prey scurried away. I was fast and caught it in no time(19). Staring down at it, I decided to offer it as a gift to my masters. With a great leap, I got up the royal bed and placed it between the two sleeping masters. I crouched down and called out my greetings reverently(20). They woke up and were about to respond when they saw my gift. 'Fluffy left a huge lizard on our bed!' Mrs Tan screamed. 'Naughty cat!'", "category": "Adverbs"}, {"id": "psle2024_eng_q17", "source": "PSLE 2024 English", "section": "Vocabulary Cloze", "qNum": 17, "passage": "I was watching, ready to jump into action. My prey moved gingerly, as if it was keenly(16) aware of my presence. With my gaze fixed on it, I followed stealthily. All of a sudden, the quietness(17) was broken by a rustling sound when I stepped on a plastic bag. Instinctively, I lunged forward(18) as my prey scurried away. I was fast and caught it in no time(19). Staring down at it, I decided to offer it as a gift to my masters. With a great leap, I got up the royal bed and placed it between the two sleeping masters. I crouched down and called out my greetings reverently(20). They woke up and were about to respond when they saw my gift. 'Fluffy left a huge lizard on our bed!' Mrs Tan screamed. 'Naughty cat!'", "sentence": "All of a sudden, the quietness was broken by a rustling sound when I stepped on a plastic bag.", "targetWord": "quietness", "options": ["silence", "privacy", "secrecy", "atmosphere"], "answerIndex": 1, "answer": "silence", "option_explanations": [{"key": "A", "value": "silence", "Explanation": "Correct. 'Quietness' means the state of being quiet — a period without any sound. 'Silence' is the closest synonym."}, {"key": "B", "value": "privacy", "Explanation": "'Privacy' means being free from public attention. It doesn't relate to sound or quietness."}, {"key": "C", "value": "secrecy", "Explanation": "'Secrecy' means the state of keeping something hidden. It's unrelated to the absence of sound."}, {"key": "D", "value": "atmosphere", "Explanation": "'Atmosphere' means the mood or feeling of a place. While a quiet atmosphere is possible, 'atmosphere' doesn't mean quietness."}], "full_passage": "I was watching, ready to jump into action. My prey moved gingerly, as if it was keenly(16) aware of my presence. With my gaze fixed on it, I followed stealthily. All of a sudden, the quietness(17) was broken by a rustling sound when I stepped on a plastic bag. Instinctively, I lunged forward(18) as my prey scurried away. I was fast and caught it in no time(19). Staring down at it, I decided to offer it as a gift to my masters. With a great leap, I got up the royal bed and placed it between the two sleeping masters. I crouched down and called out my greetings reverently(20). They woke up and were about to respond when they saw my gift. 'Fluffy left a huge lizard on our bed!' Mrs Tan screamed. 'Naughty cat!'", "category": "Nouns"}, {"id": "psle2024_eng_q18", "source": "PSLE 2024 English", "section": "Vocabulary Cloze", "qNum": 18, "passage": "I was watching, ready to jump into action. My prey moved gingerly, as if it was keenly(16) aware of my presence. With my gaze fixed on it, I followed stealthily. All of a sudden, the quietness(17) was broken by a rustling sound when I stepped on a plastic bag. Instinctively, I lunged forward(18) as my prey scurried away. I was fast and caught it in no time(19). Staring down at it, I decided to offer it as a gift to my masters. With a great leap, I got up the royal bed and placed it between the two sleeping masters. I crouched down and called out my greetings reverently(20). They woke up and were about to respond when they saw my gift. 'Fluffy left a huge lizard on our bed!' Mrs Tan screamed. 'Naughty cat!'", "sentence": "Instinctively, I lunged forward as my prey scurried away.", "targetWord": "lunged forward", "options": ["pounced", "bounced", "launched", "advanced"], "answerIndex": 1, "answer": "pounced", "option_explanations": [{"key": "A", "value": "pounced", "Explanation": "Correct. 'Pounced' means to jump or move quickly in order to catch or take hold of something. It's the closest match to 'lunged forward'."}, {"key": "B", "value": "bounced", "Explanation": "'Bounced' means to spring back after hitting a surface. It doesn't convey the aggressive forward motion of 'lunged forward'."}, {"key": "C", "value": "launched", "Explanation": "'Launched' means to propel something or start. It doesn't specifically capture the quick, predatory movement."}, {"key": "D", "value": "advanced", "Explanation": "'Advanced' means to move forward, but it implies a slower, more deliberate movement, not the sudden spring of 'lunged forward'."}], "full_passage": "I was watching, ready to jump into action. My prey moved gingerly, as if it was keenly(16) aware of my presence. With my gaze fixed on it, I followed stealthily. All of a sudden, the quietness(17) was broken by a rustling sound when I stepped on a plastic bag. Instinctively, I lunged forward(18) as my prey scurried away. I was fast and caught it in no time(19). Staring down at it, I decided to offer it as a gift to my masters. With a great leap, I got up the royal bed and placed it between the two sleeping masters. I crouched down and called out my greetings reverently(20). They woke up and were about to respond when they saw my gift. 'Fluffy left a huge lizard on our bed!' Mrs Tan screamed. 'Naughty cat!'", "category": "Precise Verbs"}, {"id": "psle2024_eng_q19", "source": "PSLE 2024 English", "section": "Vocabulary Cloze", "qNum": 19, "passage": "I was watching, ready to jump into action. My prey moved gingerly, as if it was keenly(16) aware of my presence. With my gaze fixed on it, I followed stealthily. All of a sudden, the quietness(17) was broken by a rustling sound when I stepped on a plastic bag. Instinctively, I lunged forward(18) as my prey scurried away. I was fast and caught it in no time(19). Staring down at it, I decided to offer it as a gift to my masters. With a great leap, I got up the royal bed and placed it between the two sleeping masters. I crouched down and called out my greetings reverently(20). They woke up and were about to respond when they saw my gift. 'Fluffy left a huge lizard on our bed!' Mrs Tan screamed. 'Naughty cat!'", "sentence": "I was fast and caught it in no time.", "targetWord": "in no time", "options": ["briefly", "urgently", "instantly", "hurriedly"], "answerIndex": 3, "answer": "instantly", "option_explanations": [{"key": "A", "value": "briefly", "Explanation": "'Briefly' means for a short time, but it describes duration, not speed. 'In no time' emphasises how quickly something happened."}, {"key": "B", "value": "urgently", "Explanation": "'Urgently' means with great importance or pressing need. It doesn't mean 'very quickly'."}, {"key": "C", "value": "instantly", "Explanation": "Correct. 'Instantly' means immediately, without delay. 'In no time' means very quickly, and 'instantly' is the closest synonym."}, {"key": "D", "value": "hurriedly", "Explanation": "'Hurriedly' means in a rushed manner. While related to speed, it emphasises being in a rush rather than the immediacy of 'in no time'."}], "full_passage": "I was watching, ready to jump into action. My prey moved gingerly, as if it was keenly(16) aware of my presence. With my gaze fixed on it, I followed stealthily. All of a sudden, the quietness(17) was broken by a rustling sound when I stepped on a plastic bag. Instinctively, I lunged forward(18) as my prey scurried away. I was fast and caught it in no time(19). Staring down at it, I decided to offer it as a gift to my masters. With a great leap, I got up the royal bed and placed it between the two sleeping masters. I crouched down and called out my greetings reverently(20). They woke up and were about to respond when they saw my gift. 'Fluffy left a huge lizard on our bed!' Mrs Tan screamed. 'Naughty cat!'", "category": "Adverbs"}, {"id": "psle2024_eng_q20", "source": "PSLE 2024 English", "section": "Vocabulary Cloze", "qNum": 20, "passage": "I was watching, ready to jump into action. My prey moved gingerly, as if it was keenly(16) aware of my presence. With my gaze fixed on it, I followed stealthily. All of a sudden, the quietness(17) was broken by a rustling sound when I stepped on a plastic bag. Instinctively, I lunged forward(18) as my prey scurried away. I was fast and caught it in no time(19). Staring down at it, I decided to offer it as a gift to my masters. With a great leap, I got up the royal bed and placed it between the two sleeping masters. I crouched down and called out my greetings reverently(20). They woke up and were about to respond when they saw my gift. 'Fluffy left a huge lizard on our bed!' Mrs Tan screamed. 'Naughty cat!'", "sentence": "I crouched down and called out my greetings reverently.", "targetWord": "reverently", "options": ["in wonder", "with respect", "in humbleness", "with enthusiasm"], "answerIndex": 2, "answer": "with respect", "option_explanations": [{"key": "A", "value": "in wonder", "Explanation": "'In wonder' means with amazement or awe. 'Reverently' is closer to respect and admiration than wonder."}, {"key": "B", "value": "with respect", "Explanation": "Correct. 'Reverently' means in a way that shows great respect and admiration. 'With respect' is the closest synonym."}, {"key": "C", "value": "in humbleness", "Explanation": "'In humbleness' means with modesty. While reverence can involve humility, the primary meaning is deep respect."}, {"key": "D", "value": "with enthusiasm", "Explanation": "'With enthusiasm' means with eager enjoyment. Reverence implies respect, not excitement."}], "full_passage": "I was watching, ready to jump into action. My prey moved gingerly, as if it was keenly(16) aware of my presence. With my gaze fixed on it, I followed stealthily. All of a sudden, the quietness(17) was broken by a rustling sound when I stepped on a plastic bag. Instinctively, I lunged forward(18) as my prey scurried away. I was fast and caught it in no time(19). Staring down at it, I decided to offer it as a gift to my masters. With a great leap, I got up the royal bed and placed it between the two sleeping masters. I crouched down and called out my greetings reverently(20). They woke up and were about to respond when they saw my gift. 'Fluffy left a huge lizard on our bed!' Mrs Tan screamed. 'Naughty cat!'", "category": "Collocations & Idioms"}, {"id": "psle2023_eng_q11", "source": "PSLE 2023 English", "section": "Vocabulary MCQ", "qNum": 11, "sentence": "The expiry date on the carton tells people if the milk is still safe for ____________.", "options": ["digestion", "preservation", "conservation", "consumption"], "answerIndex": 4, "answer": "consumption", "option_explanations": [{"key": "A", "value": "digestion", "Explanation": "'Digestion' is the process of breaking down food in the body. The expiry date indicates whether milk is safe to drink, not whether it's easy to digest."}, {"key": "B", "value": "preservation", "Explanation": "'Preservation' means keeping something in its original state. The expiry date indicates when the product is no longer safe to use, not about preserving it."}, {"key": "C", "value": "conservation", "Explanation": "'Conservation' means protecting natural resources. It is unrelated to whether milk is safe to drink."}, {"key": "D", "value": "consumption", "Explanation": "Correct. 'Consumption' means the act of eating or drinking something. 'Safe for consumption' is a common collocation meaning safe to eat or drink."}], "category": "Nouns"}, {"id": "psle2023_eng_q12", "source": "PSLE 2023 English", "section": "Vocabulary MCQ", "qNum": 12, "sentence": "My plans for overseas travel ____________ when I became ill.", "options": ["blew up", "fell through", "broke down", "dropped out"], "answerIndex": 2, "answer": "fell through", "option_explanations": [{"key": "A", "value": "blew up", "Explanation": "'Blew up' means exploded or became very angry. Plans don't 'blow up' in the sense of failing."}, {"key": "B", "value": "fell through", "Explanation": "Correct. 'Fell through' means failed to happen or was not completed. The travel plans fell through (didn't materialise) because of the illness."}, {"key": "C", "value": "broke down", "Explanation": "'Broke down' usually refers to machines failing or a person becoming very emotional. It is not typically used for plans."}, {"key": "D", "value": "dropped out", "Explanation": "'Dropped out' means to withdraw from participation (e.g., dropped out of school). Plans cannot 'drop out'."}], "category": "Phrasal Verbs"}, {"id": "psle2023_eng_q13", "source": "PSLE 2023 English", "section": "Vocabulary MCQ", "qNum": 13, "sentence": "Aminah bought a blouse to ____________ the skirt she was planning to wear to the party.", "options": ["partner", "complete", "supplement", "complement"], "answerIndex": 4, "answer": "complement", "option_explanations": [{"key": "A", "value": "partner", "Explanation": "'Partner' as a verb means to be a partner to someone. It is not commonly used for matching clothing items."}, {"key": "B", "value": "complete", "Explanation": "'Complete' means to finish or make whole. While a blouse can complete an outfit, it doesn't convey the idea of matching or going well together."}, {"key": "C", "value": "supplement", "Explanation": "'Supplement' means to add to something to improve it (e.g., dietary supplements). It doesn't fit the idea of clothing items going well together."}, {"key": "D", "value": "complement", "Explanation": "Correct. 'Complement' means to go well with or enhance something. A blouse that complements a skirt matches it well and creates a pleasing outfit."}], "category": "Precise Verbs"}, {"id": "psle2023_eng_q14", "source": "PSLE 2023 English", "section": "Vocabulary MCQ", "qNum": 14, "sentence": "\"You should avoid strenuous exercises for the next few weeks so as not to ____________ your injury,\" said the doctor.", "options": ["aggravate", "intensify", "agitate", "stress"], "answerIndex": 1, "answer": "aggravate", "option_explanations": [{"key": "A", "value": "aggravate", "Explanation": "Correct. 'Aggravate' means to make a condition or situation worse. 'Aggravate an injury' is a common collocation — exercise could make the injury worse."}, {"key": "B", "value": "intensify", "Explanation": "'Intensify' means to become stronger or more extreme. While pain can intensify, we don't typically say 'intensify an injury'."}, {"key": "C", "value": "agitate", "Explanation": "'Agitate' means to make someone anxious or to stir up. It doesn't collocate naturally with 'injury'."}, {"key": "D", "value": "stress", "Explanation": "'Stress' as a verb means to emphasise or to put strain on. While you can 'stress a joint', 'aggravate' is the more precise word for making an injury worse."}], "category": "Precise Verbs"}, {"id": "psle2023_eng_q15", "source": "PSLE 2023 English", "section": "Vocabulary MCQ", "qNum": 15, "sentence": "My brother's lack of confidence ____________ his ability to speak well in front of the audience.", "options": ["discouraged", "prevented", "impeded", "ceased"], "answerIndex": 3, "answer": "impeded", "option_explanations": [{"key": "A", "value": "discouraged", "Explanation": "'Discouraged' means to make someone less determined. While lack of confidence discourages a person, it doesn't directly collocate with 'ability'."}, {"key": "B", "value": "prevented", "Explanation": "'Prevented' means to stop completely. 'Prevented his ability' is grammatically awkward — 'prevented him from speaking' would be correct, but that's a different structure."}, {"key": "C", "value": "impeded", "Explanation": "Correct. 'Impeded' means to hinder or obstruct. 'Impeded his ability' means his lack of confidence got in the way of his ability to speak well."}, {"key": "D", "value": "ceased", "Explanation": "'Ceased' means to stop. 'Ceased his ability' doesn't make grammatical sense — you can't cease someone's ability."}], "category": "Precise Verbs"}, {"id": "psle2023_eng_q16", "source": "PSLE 2023 English", "section": "Vocabulary Cloze", "qNum": 16, "passage": "I was alone at the bus stop. While sitting on a bench, I took small bites of(16) a candy bar. Suddenly, I heard a soft whining sound coming from beneath the bench. I looked under the bench and saw a box. As I reached for it, the box moved suddenly. Startled, I quickly drew(17) my hand back and stared at the box for a while. My curiosity soon got the better of(18) me. Cautiously, I reached for it again. \"Is it an animal or...a baby inside?\" My mind was racing feverishly(19) as I lifted the flaps of the box gingerly. It stared at me with big bright eyes that melted(20) my heart. Tucked next to it was a note appealing to whoever that found it to look after it. A year has passed since the day I found it. Mochi, my pet cat, is now the joy of my life.", "sentence": "While sitting on a bench, I took small bites of a candy bar.", "targetWord": "took small bites of", "options": ["nibbled", "chewed", "sampled", "savoured"], "answerIndex": 1, "answer": "nibbled", "option_explanations": [{"key": "A", "value": "nibbled", "Explanation": "Correct. 'Nibbled' means to take small bites of something. It directly matches 'took small bites of'."}, {"key": "B", "value": "chewed", "Explanation": "'Chewed' means to crush food with the teeth. It describes the action of processing food, not taking small bites."}, {"key": "C", "value": "sampled", "Explanation": "'Sampled' means to try a small amount to test it. It implies trying something new, not casually snacking."}, {"key": "D", "value": "savoured", "Explanation": "'Savoured' means to enjoy food slowly, appreciating the taste. While it involves eating slowly, it emphasises enjoyment rather than the small bites."}], "full_passage": "I was alone at the bus stop. While sitting on a bench, I took small bites of(16) a candy bar. Suddenly, I heard a soft whining sound coming from beneath the bench. I looked under the bench and saw a box. As I reached for it, the box moved suddenly. Startled, I quickly drew(17) my hand back and stared at the box for a while. My curiosity soon got the better of(18) me. Cautiously, I reached for it again. \"Is it an animal or...a baby inside?\" My mind was racing feverishly(19) as I lifted the flaps of the box gingerly. It stared at me with big bright eyes that melted(20) my heart. Tucked next to it was a note appealing to whoever that found it to look after it. A year has passed since the day I found it. Mochi, my pet cat, is now the joy of my life.", "category": "Precise Verbs"}, {"id": "psle2023_eng_q17", "source": "PSLE 2023 English", "section": "Vocabulary Cloze", "qNum": 17, "passage": "I was alone at the bus stop. While sitting on a bench, I took small bites of(16) a candy bar. Suddenly, I heard a soft whining sound coming from beneath the bench. I looked under the bench and saw a box. As I reached for it, the box moved suddenly. Startled, I quickly drew(17) my hand back and stared at the box for a while. My curiosity soon got the better of(18) me. Cautiously, I reached for it again. \"Is it an animal or...a baby inside?\" My mind was racing feverishly(19) as I lifted the flaps of the box gingerly. It stared at me with big bright eyes that melted(20) my heart. Tucked next to it was a note appealing to whoever that found it to look after it. A year has passed since the day I found it. Mochi, my pet cat, is now the joy of my life.", "sentence": "Startled, I quickly drew my hand back and stared at the box for a while.", "targetWord": "quickly drew", "options": ["lugged", "yanked", "retreated", "extracted"], "answerIndex": 2, "answer": "yanked", "option_explanations": [{"key": "A", "value": "lugged", "Explanation": "'Lugged' means to carry something heavy with difficulty. It doesn't convey the quick, startled pulling motion."}, {"key": "B", "value": "yanked", "Explanation": "Correct. 'Yanked' means to pull something quickly and forcefully. 'Quickly drew my hand back' describes a sudden pulling motion, which matches 'yanked'."}, {"key": "C", "value": "retreated", "Explanation": "'Retreated' means to move back or withdraw. While the hand moved back, 'retreated' typically describes a person moving away, not a hand being pulled."}, {"key": "D", "value": "extracted", "Explanation": "'Extracted' means to remove something carefully. It implies precision and effort, not the quick, startled motion described."}], "full_passage": "I was alone at the bus stop. While sitting on a bench, I took small bites of(16) a candy bar. Suddenly, I heard a soft whining sound coming from beneath the bench. I looked under the bench and saw a box. As I reached for it, the box moved suddenly. Startled, I quickly drew(17) my hand back and stared at the box for a while. My curiosity soon got the better of(18) me. Cautiously, I reached for it again. \"Is it an animal or...a baby inside?\" My mind was racing feverishly(19) as I lifted the flaps of the box gingerly. It stared at me with big bright eyes that melted(20) my heart. Tucked next to it was a note appealing to whoever that found it to look after it. A year has passed since the day I found it. Mochi, my pet cat, is now the joy of my life.", "category": "Precise Verbs"}, {"id": "psle2023_eng_q18", "source": "PSLE 2023 English", "section": "Vocabulary Cloze", "qNum": 18, "passage": "I was alone at the bus stop. While sitting on a bench, I took small bites of(16) a candy bar. Suddenly, I heard a soft whining sound coming from beneath the bench. I looked under the bench and saw a box. As I reached for it, the box moved suddenly. Startled, I quickly drew(17) my hand back and stared at the box for a while. My curiosity soon got the better of(18) me. Cautiously, I reached for it again. \"Is it an animal or...a baby inside?\" My mind was racing feverishly(19) as I lifted the flaps of the box gingerly. It stared at me with big bright eyes that melted(20) my heart. Tucked next to it was a note appealing to whoever that found it to look after it. A year has passed since the day I found it. Mochi, my pet cat, is now the joy of my life.", "sentence": "My curiosity soon got the better of me.", "targetWord": "got the better of", "options": ["overtook", "outwitted", "outweighed", "overwhelmed"], "answerIndex": 4, "answer": "overwhelmed", "option_explanations": [{"key": "A", "value": "overtook", "Explanation": "'Overtook' means to pass or surpass. While curiosity can overtake someone, 'got the better of' implies being overcome, not surpassed."}, {"key": "B", "value": "outwitted", "Explanation": "'Outwitted' means to outsmart. Curiosity doesn't outsmart a person — it overcomes their caution or resistance."}, {"key": "C", "value": "outweighed", "Explanation": "'Outweighed' means to be greater in importance or influence. While curiosity may outweigh fear, the phrase 'got the better of' means to overcome or overpower."}, {"key": "D", "value": "overwhelmed", "Explanation": "Correct. 'Overwhelmed' means to overpower or overcome. 'Got the better of me' means curiosity overwhelmed the narrator's caution, causing them to reach for the box again."}], "full_passage": "I was alone at the bus stop. While sitting on a bench, I took small bites of(16) a candy bar. Suddenly, I heard a soft whining sound coming from beneath the bench. I looked under the bench and saw a box. As I reached for it, the box moved suddenly. Startled, I quickly drew(17) my hand back and stared at the box for a while. My curiosity soon got the better of(18) me. Cautiously, I reached for it again. \"Is it an animal or...a baby inside?\" My mind was racing feverishly(19) as I lifted the flaps of the box gingerly. It stared at me with big bright eyes that melted(20) my heart. Tucked next to it was a note appealing to whoever that found it to look after it. A year has passed since the day I found it. Mochi, my pet cat, is now the joy of my life.", "category": "Adjectives"}, {"id": "psle2023_eng_q19", "source": "PSLE 2023 English", "section": "Vocabulary Cloze", "qNum": 19, "passage": "I was alone at the bus stop. While sitting on a bench, I took small bites of(16) a candy bar. Suddenly, I heard a soft whining sound coming from beneath the bench. I looked under the bench and saw a box. As I reached for it, the box moved suddenly. Startled, I quickly drew(17) my hand back and stared at the box for a while. My curiosity soon got the better of(18) me. Cautiously, I reached for it again. \"Is it an animal or...a baby inside?\" My mind was racing feverishly(19) as I lifted the flaps of the box gingerly. It stared at me with big bright eyes that melted(20) my heart. Tucked next to it was a note appealing to whoever that found it to look after it. A year has passed since the day I found it. Mochi, my pet cat, is now the joy of my life.", "sentence": "My mind was racing feverishly as I lifted the flaps of the box gingerly.", "targetWord": "feverishly", "options": ["heatedly", "excitedly", "hysterically", "desperately"], "answerIndex": 2, "answer": "excitedly", "option_explanations": [{"key": "A", "value": "heatedly", "Explanation": "'Heatedly' means in an angry or passionate manner (e.g., argued heatedly). The narrator isn't angry — they're curious and nervous."}, {"key": "B", "value": "excitedly", "Explanation": "Correct. 'Feverishly' means with nervous excitement or great energy. The narrator's mind was racing with anticipation and curiosity about what was in the box."}, {"key": "C", "value": "hysterically", "Explanation": "'Hysterically' means in an uncontrollably emotional way. The narrator is curious and slightly nervous, not in a state of hysteria."}, {"key": "D", "value": "desperately", "Explanation": "'Desperately' means in a way showing hopelessness or urgency. The narrator isn't desperate — they're driven by curiosity and excitement."}], "full_passage": "I was alone at the bus stop. While sitting on a bench, I took small bites of(16) a candy bar. Suddenly, I heard a soft whining sound coming from beneath the bench. I looked under the bench and saw a box. As I reached for it, the box moved suddenly. Startled, I quickly drew(17) my hand back and stared at the box for a while. My curiosity soon got the better of(18) me. Cautiously, I reached for it again. \"Is it an animal or...a baby inside?\" My mind was racing feverishly(19) as I lifted the flaps of the box gingerly. It stared at me with big bright eyes that melted(20) my heart. Tucked next to it was a note appealing to whoever that found it to look after it. A year has passed since the day I found it. Mochi, my pet cat, is now the joy of my life.", "category": "Adverbs"}, {"id": "psle2023_eng_q20", "source": "PSLE 2023 English", "section": "Vocabulary Cloze", "qNum": 20, "passage": "I was alone at the bus stop. While sitting on a bench, I took small bites of(16) a candy bar. Suddenly, I heard a soft whining sound coming from beneath the bench. I looked under the bench and saw a box. As I reached for it, the box moved suddenly. Startled, I quickly drew(17) my hand back and stared at the box for a while. My curiosity soon got the better of(18) me. Cautiously, I reached for it again. \"Is it an animal or...a baby inside?\" My mind was racing feverishly(19) as I lifted the flaps of the box gingerly. It stared at me with big bright eyes that melted(20) my heart. Tucked next to it was a note appealing to whoever that found it to look after it. A year has passed since the day I found it. Mochi, my pet cat, is now the joy of my life.", "sentence": "It stared at me with big bright eyes that melted my heart.", "targetWord": "melted", "options": ["calmed", "touched", "changed", "lightened"], "answerIndex": 2, "answer": "touched", "option_explanations": [{"key": "A", "value": "calmed", "Explanation": "'Calmed' means to make peaceful. While the kitten's eyes might have a calming effect, 'melted my heart' means being deeply moved emotionally, not calmed."}, {"key": "B", "value": "touched", "Explanation": "Correct. 'Touched' means to affect emotionally, to move someone's feelings. 'Melted my heart' means the kitten's big bright eyes deeply moved or touched the narrator."}, {"key": "C", "value": "changed", "Explanation": "'Changed' means to make different. While the kitten changed the narrator's life, 'melted my heart' specifically means being emotionally moved."}, {"key": "D", "value": "lightened", "Explanation": "'Lightened' means to make less heavy or serious. 'Melted my heart' conveys a deeper emotional response than simply lightening one's mood."}], "full_passage": "I was alone at the bus stop. While sitting on a bench, I took small bites of(16) a candy bar. Suddenly, I heard a soft whining sound coming from beneath the bench. I looked under the bench and saw a box. As I reached for it, the box moved suddenly. Startled, I quickly drew(17) my hand back and stared at the box for a while. My curiosity soon got the better of(18) me. Cautiously, I reached for it again. \"Is it an animal or...a baby inside?\" My mind was racing feverishly(19) as I lifted the flaps of the box gingerly. It stared at me with big bright eyes that melted(20) my heart. Tucked next to it was a note appealing to whoever that found it to look after it. A year has passed since the day I found it. Mochi, my pet cat, is now the joy of my life.", "category": "Precise Verbs"}, {"id": "psle2022_eng_q11", "source": "PSLE 2022 English", "section": "Vocabulary MCQ", "qNum": 11, "sentence": "The water in the pond was so ____________ that we could not see the fish clearly.", "options": ["dim", "dull", "misty", "murky"], "answerIndex": 4, "answer": "murky", "option_explanations": [{"key": "A", "value": "dim", "Explanation": "'Dim' means not bright (usually for light). It doesn't naturally describe water quality."}, {"key": "B", "value": "dull", "Explanation": "'Dull' means lacking brightness or interest. It can describe colours or surfaces but is not typically used to describe water clarity."}, {"key": "C", "value": "misty", "Explanation": "'Misty' describes air or weather with fine water droplets. It is not used to describe water in a pond."}, {"key": "D", "value": "murky", "Explanation": "Correct. 'Murky' means dark and dirty, especially of water. 'Murky water' is a common collocation meaning water so cloudy you cannot see through it."}], "category": "Adjectives"}, {"id": "psle2022_eng_q12", "source": "PSLE 2022 English", "section": "Vocabulary MCQ", "qNum": 12, "sentence": "His new restaurant ____________ because he had no idea how to run a business.", "options": ["paid off", "sold out", "backed off", "went under"], "answerIndex": 4, "answer": "went under", "option_explanations": [{"key": "A", "value": "paid off", "Explanation": "'Paid off' means to be successful or worthwhile. This contradicts 'had no idea how to run a business' which implies failure."}, {"key": "B", "value": "sold out", "Explanation": "'Sold out' means all items were sold (positive) or to compromise one's principles. Neither fits the context of a failing restaurant."}, {"key": "C", "value": "backed off", "Explanation": "'Backed off' means to withdraw or retreat from a confrontation. It doesn't describe a business failing."}, {"key": "D", "value": "went under", "Explanation": "Correct. 'Went under' means to fail, especially financially. The restaurant went under (closed/failed) because of poor management."}], "category": "Phrasal Verbs"}, {"id": "psle2022_eng_q13", "source": "PSLE 2022 English", "section": "Vocabulary MCQ", "qNum": 13, "sentence": "The singer performed with such emotional ____________ that we were all spellbound.", "options": ["clarity", "density", "intensity", "specialty"], "answerIndex": 3, "answer": "intensity", "option_explanations": [{"key": "A", "value": "clarity", "Explanation": "'Clarity' means clearness. 'Emotional clarity' doesn't convey the power that would leave an audience spellbound."}, {"key": "B", "value": "density", "Explanation": "'Density' means thickness or concentration. It doesn't naturally combine with 'emotional' to describe a performance."}, {"key": "C", "value": "intensity", "Explanation": "Correct. 'Emotional intensity' means strong, powerful emotions. A performance with such intensity would captivate and leave the audience spellbound."}, {"key": "D", "value": "specialty", "Explanation": "'Specialty' means a particular area of expertise. 'Emotional specialty' is not a natural or meaningful collocation."}], "category": "Nouns"}, {"id": "psle2022_eng_q14", "source": "PSLE 2022 English", "section": "Vocabulary MCQ", "qNum": 14, "sentence": "My sister encourages me to read ____________ by sharing different types of books with me.", "options": ["greatly", "extensively", "exceedingly", "tremendously"], "answerIndex": 2, "answer": "extensively", "option_explanations": [{"key": "A", "value": "greatly", "Explanation": "'Greatly' means to a large degree, but 'read greatly' is not a natural collocation. We say 'read widely' or 'read extensively'."}, {"key": "B", "value": "extensively", "Explanation": "Correct. 'Read extensively' means to read widely and in large amounts. Sharing different types of books encourages reading across many genres."}, {"key": "C", "value": "exceedingly", "Explanation": "'Exceedingly' means extremely. 'Read exceedingly' is not a standard collocation."}, {"key": "D", "value": "tremendously", "Explanation": "'Tremendously' means very greatly. 'Read tremendously' is not natural English."}], "category": "Adverbs"}, {"id": "psle2022_eng_q15", "source": "PSLE 2022 English", "section": "Vocabulary MCQ", "qNum": 15, "sentence": "After trekking the entire day, the pupils could not wait to ____________ for the night.", "options": ["retire", "revive", "retreat", "restore"], "answerIndex": 1, "answer": "retire", "option_explanations": [{"key": "A", "value": "retire", "Explanation": "Correct. 'Retire for the night' means to go to bed or rest for the night. It's a common expression, especially after a tiring day."}, {"key": "B", "value": "revive", "Explanation": "'Revive' means to bring back to life or consciousness. It implies recovery, not going to bed."}, {"key": "C", "value": "retreat", "Explanation": "'Retreat' means to withdraw, usually from a dangerous situation. 'Retreat for the night' is not the standard expression."}, {"key": "D", "value": "restore", "Explanation": "'Restore' means to bring back to a former condition. You cannot 'restore for the night' — the expression is 'retire for the night'."}], "category": "Precise Verbs"}, {"id": "psle2022_eng_q16", "source": "PSLE 2022 English", "section": "Vocabulary Cloze", "qNum": 16, "passage": "\"Ladies and gentlemen, we have spotted a pod of killer whales in front of our cruise ship,\" the captain announced halfway through lunch. I was on the trip of a lifetime, feasting my eyes on(16) the wilderness of Alaska on a cruise. The announcement came during lunch time, but no one had second thoughts(17) about leaving lunch behind. Like other excited passengers, I grabbed my camera and dashed to the deck. I watched closely as eight killer whales glided through the water right before my eyes, taking turns to elegantly(18) break the water surface to display their characteristic(19) black and white colours. I was about to take photographs when I discovered that my camera battery had gone flat. I threw my hands up in exasperation(20). There was nothing I could do but watch the majestic creatures. I hoped to get another sighting of the killer whales during the trip.", "sentence": "I was on the trip of a lifetime, feasting my eyes on the wilderness of Alaska on a cruise.", "targetWord": "feasting my eyes on", "options": ["relishing", "capturing", "observing", "discovering"], "answerIndex": 1, "answer": "relishing", "option_explanations": [{"key": "A", "value": "relishing", "Explanation": "Correct. 'Feasting my eyes on' means to look at something with great pleasure and enjoyment. 'Relishing' means to enjoy greatly, which captures this sense of visual delight."}, {"key": "B", "value": "capturing", "Explanation": "'Capturing' means to record or seize. It doesn't convey the enjoyment and pleasure associated with 'feasting my eyes on'."}, {"key": "C", "value": "observing", "Explanation": "'Observing' means watching carefully. While related to looking, it lacks the sense of deep enjoyment that 'feasting my eyes on' conveys."}, {"key": "D", "value": "discovering", "Explanation": "'Discovering' means finding something new. 'Feasting my eyes on' is about savouring what you see, not about finding it for the first time."}], "full_passage": "\"Ladies and gentlemen, we have spotted a pod of killer whales in front of our cruise ship,\" the captain announced halfway through lunch. I was on the trip of a lifetime, feasting my eyes on(16) the wilderness of Alaska on a cruise. The announcement came during lunch time, but no one had second thoughts(17) about leaving lunch behind. Like other excited passengers, I grabbed my camera and dashed to the deck. I watched closely as eight killer whales glided through the water right before my eyes, taking turns to elegantly(18) break the water surface to display their characteristic(19) black and white colours. I was about to take photographs when I discovered that my camera battery had gone flat. I threw my hands up in exasperation(20). There was nothing I could do but watch the majestic creatures. I hoped to get another sighting of the killer whales during the trip.", "category": "Precise Verbs"}, {"id": "psle2022_eng_q17", "source": "PSLE 2022 English", "section": "Vocabulary Cloze", "qNum": 17, "passage": "\"Ladies and gentlemen, we have spotted a pod of killer whales in front of our cruise ship,\" the captain announced halfway through lunch. I was on the trip of a lifetime, feasting my eyes on(16) the wilderness of Alaska on a cruise. The announcement came during lunch time, but no one had second thoughts(17) about leaving lunch behind. Like other excited passengers, I grabbed my camera and dashed to the deck. I watched closely as eight killer whales glided through the water right before my eyes, taking turns to elegantly(18) break the water surface to display their characteristic(19) black and white colours. I was about to take photographs when I discovered that my camera battery had gone flat. I threw my hands up in exasperation(20). There was nothing I could do but watch the majestic creatures. I hoped to get another sighting of the killer whales during the trip.", "sentence": "The announcement came during lunch time, but no one had second thoughts about leaving lunch behind.", "targetWord": "had second thoughts", "options": ["fussed", "hesitated", "pondered", "wondered"], "answerIndex": 2, "answer": "hesitated", "option_explanations": [{"key": "A", "value": "fussed", "Explanation": "'Fussed' means to show unnecessary or excessive concern. 'Had second thoughts' is about doubting a decision, not about fussing."}, {"key": "B", "value": "hesitated", "Explanation": "Correct. 'Had second thoughts' means to doubt or reconsider a decision. 'Hesitated' means to pause due to uncertainty — the closest match."}, {"key": "C", "value": "pondered", "Explanation": "'Pondered' means to think deeply about something. While related to thinking, it implies calm reflection rather than the doubt or wavering of 'second thoughts'."}, {"key": "D", "value": "wondered", "Explanation": "'Wondered' means to be curious about something. 'Had second thoughts' is about doubt, not curiosity."}], "full_passage": "\"Ladies and gentlemen, we have spotted a pod of killer whales in front of our cruise ship,\" the captain announced halfway through lunch. I was on the trip of a lifetime, feasting my eyes on(16) the wilderness of Alaska on a cruise. The announcement came during lunch time, but no one had second thoughts(17) about leaving lunch behind. Like other excited passengers, I grabbed my camera and dashed to the deck. I watched closely as eight killer whales glided through the water right before my eyes, taking turns to elegantly(18) break the water surface to display their characteristic(19) black and white colours. I was about to take photographs when I discovered that my camera battery had gone flat. I threw my hands up in exasperation(20). There was nothing I could do but watch the majestic creatures. I hoped to get another sighting of the killer whales during the trip.", "category": "Precise Verbs"}, {"id": "psle2022_eng_q18", "source": "PSLE 2022 English", "section": "Vocabulary Cloze", "qNum": 18, "passage": "\"Ladies and gentlemen, we have spotted a pod of killer whales in front of our cruise ship,\" the captain announced halfway through lunch. I was on the trip of a lifetime, feasting my eyes on(16) the wilderness of Alaska on a cruise. The announcement came during lunch time, but no one had second thoughts(17) about leaving lunch behind. Like other excited passengers, I grabbed my camera and dashed to the deck. I watched closely as eight killer whales glided through the water right before my eyes, taking turns to elegantly(18) break the water surface to display their characteristic(19) black and white colours. I was about to take photographs when I discovered that my camera battery had gone flat. I threw my hands up in exasperation(20). There was nothing I could do but watch the majestic creatures. I hoped to get another sighting of the killer whales during the trip.", "sentence": "...taking turns to elegantly break the water surface to display their characteristic black and white colours.", "targetWord": "elegantly", "options": ["lightly", "steadily", "gradually", "gracefully"], "answerIndex": 4, "answer": "gracefully", "option_explanations": [{"key": "A", "value": "lightly", "Explanation": "'Lightly' means with little weight or force. 'Elegantly' emphasises beauty and grace in movement, not lightness."}, {"key": "B", "value": "steadily", "Explanation": "'Steadily' means in a stable, even manner. It doesn't capture the beauty and grace of 'elegantly'."}, {"key": "C", "value": "gradually", "Explanation": "'Gradually' means slowly over time. 'Elegantly' is about the quality of movement (beautiful), not the speed."}, {"key": "D", "value": "gracefully", "Explanation": "Correct. 'Gracefully' means in an elegant, smooth, and attractive manner. It is the closest synonym to 'elegantly'."}], "full_passage": "\"Ladies and gentlemen, we have spotted a pod of killer whales in front of our cruise ship,\" the captain announced halfway through lunch. I was on the trip of a lifetime, feasting my eyes on(16) the wilderness of Alaska on a cruise. The announcement came during lunch time, but no one had second thoughts(17) about leaving lunch behind. Like other excited passengers, I grabbed my camera and dashed to the deck. I watched closely as eight killer whales glided through the water right before my eyes, taking turns to elegantly(18) break the water surface to display their characteristic(19) black and white colours. I was about to take photographs when I discovered that my camera battery had gone flat. I threw my hands up in exasperation(20). There was nothing I could do but watch the majestic creatures. I hoped to get another sighting of the killer whales during the trip.", "category": "Adverbs"}, {"id": "psle2022_eng_q19", "source": "PSLE 2022 English", "section": "Vocabulary Cloze", "qNum": 19, "passage": "\"Ladies and gentlemen, we have spotted a pod of killer whales in front of our cruise ship,\" the captain announced halfway through lunch. I was on the trip of a lifetime, feasting my eyes on(16) the wilderness of Alaska on a cruise. The announcement came during lunch time, but no one had second thoughts(17) about leaving lunch behind. Like other excited passengers, I grabbed my camera and dashed to the deck. I watched closely as eight killer whales glided through the water right before my eyes, taking turns to elegantly(18) break the water surface to display their characteristic(19) black and white colours. I was about to take photographs when I discovered that my camera battery had gone flat. I threw my hands up in exasperation(20). There was nothing I could do but watch the majestic creatures. I hoped to get another sighting of the killer whales during the trip.", "sentence": "...to display their characteristic black and white colours.", "targetWord": "characteristic", "options": ["regular", "particular", "distinctive", "significant"], "answerIndex": 3, "answer": "distinctive", "option_explanations": [{"key": "A", "value": "regular", "Explanation": "'Regular' means normal or occurring at fixed intervals. It doesn't capture the idea of being uniquely identifiable."}, {"key": "B", "value": "particular", "Explanation": "'Particular' means specific. While 'characteristic' involves specificity, 'distinctive' better captures the idea of being uniquely recognisable."}, {"key": "C", "value": "distinctive", "Explanation": "Correct. 'Distinctive' means easily recognisable and unique. 'Characteristic' colours are the distinctive markings that identify killer whales — their unique black and white pattern."}, {"key": "D", "value": "significant", "Explanation": "'Significant' means important or meaningful. 'Characteristic' is about being typical or recognisable, not about importance."}], "full_passage": "\"Ladies and gentlemen, we have spotted a pod of killer whales in front of our cruise ship,\" the captain announced halfway through lunch. I was on the trip of a lifetime, feasting my eyes on(16) the wilderness of Alaska on a cruise. The announcement came during lunch time, but no one had second thoughts(17) about leaving lunch behind. Like other excited passengers, I grabbed my camera and dashed to the deck. I watched closely as eight killer whales glided through the water right before my eyes, taking turns to elegantly(18) break the water surface to display their characteristic(19) black and white colours. I was about to take photographs when I discovered that my camera battery had gone flat. I threw my hands up in exasperation(20). There was nothing I could do but watch the majestic creatures. I hoped to get another sighting of the killer whales during the trip.", "category": "Adjectives"}, {"id": "psle2022_eng_q20", "source": "PSLE 2022 English", "section": "Vocabulary Cloze", "qNum": 20, "passage": "\"Ladies and gentlemen, we have spotted a pod of killer whales in front of our cruise ship,\" the captain announced halfway through lunch. I was on the trip of a lifetime, feasting my eyes on(16) the wilderness of Alaska on a cruise. The announcement came during lunch time, but no one had second thoughts(17) about leaving lunch behind. Like other excited passengers, I grabbed my camera and dashed to the deck. I watched closely as eight killer whales glided through the water right before my eyes, taking turns to elegantly(18) break the water surface to display their characteristic(19) black and white colours. I was about to take photographs when I discovered that my camera battery had gone flat. I threw my hands up in exasperation(20). There was nothing I could do but watch the majestic creatures. I hoped to get another sighting of the killer whales during the trip.", "sentence": "I threw my hands up in exasperation.", "targetWord": "exasperation", "options": ["distress", "frustration", "harassment", "dissatisfaction"], "answerIndex": 2, "answer": "frustration", "option_explanations": [{"key": "A", "value": "distress", "Explanation": "'Distress' means extreme anxiety or suffering. While the narrator is upset, 'exasperation' is more about annoyance and frustration than deep suffering."}, {"key": "B", "value": "frustration", "Explanation": "Correct. 'Exasperation' means a feeling of intense irritation or annoyance. 'Frustration' — the feeling of being upset because you cannot do what you want — is the closest match."}, {"key": "C", "value": "harassment", "Explanation": "'Harassment' means aggressive pressure or intimidation. It is unrelated to the narrator's annoyance at the dead battery."}, {"key": "D", "value": "dissatisfaction", "Explanation": "'Dissatisfaction' means a lack of satisfaction. While related, it's milder than 'exasperation', which implies stronger annoyance."}], "full_passage": "\"Ladies and gentlemen, we have spotted a pod of killer whales in front of our cruise ship,\" the captain announced halfway through lunch. I was on the trip of a lifetime, feasting my eyes on(16) the wilderness of Alaska on a cruise. The announcement came during lunch time, but no one had second thoughts(17) about leaving lunch behind. Like other excited passengers, I grabbed my camera and dashed to the deck. I watched closely as eight killer whales glided through the water right before my eyes, taking turns to elegantly(18) break the water surface to display their characteristic(19) black and white colours. I was about to take photographs when I discovered that my camera battery had gone flat. I threw my hands up in exasperation(20). There was nothing I could do but watch the majestic creatures. I hoped to get another sighting of the killer whales during the trip.", "category": "Nouns"}, {"id": "psle2021_eng_q11", "source": "PSLE 2021 English", "section": "Vocabulary MCQ", "qNum": 11, "sentence": "Wei Ming was ____________ ashamed of himself when he realised that he had knocked over an old lady.", "options": ["utterly", "entirely", "extensively", "significantly"], "answerIndex": 1, "answer": "utterly", "option_explanations": [{"key": "A", "value": "utterly", "Explanation": "Correct. 'Utterly ashamed' means completely and totally ashamed. 'Utterly' is commonly used to intensify negative emotions."}, {"key": "B", "value": "entirely", "Explanation": "'Entirely' means completely, but 'entirely ashamed' is less natural than 'utterly ashamed' as a collocation."}, {"key": "C", "value": "extensively", "Explanation": "'Extensively' means to a large extent or widely. It doesn't collocate naturally with 'ashamed'."}, {"key": "D", "value": "significantly", "Explanation": "'Significantly' means to a large or important degree. 'Significantly ashamed' is not a natural collocation."}], "category": "Adverbs"}, {"id": "psle2021_eng_q12", "source": "PSLE 2021 English", "section": "Vocabulary MCQ", "qNum": 12, "sentence": "The device was dropped many times during the experiment but remained undamaged, so it was proved to be ____________.", "options": ["stable", "sturdy", "steady", "secure"], "answerIndex": 2, "answer": "sturdy", "option_explanations": [{"key": "A", "value": "stable", "Explanation": "'Stable' means not likely to change or move. It doesn't describe physical toughness against being dropped."}, {"key": "B", "value": "sturdy", "Explanation": "Correct. 'Sturdy' means strongly and solidly built. A device that survives being dropped many times is proven to be sturdy (physically tough)."}, {"key": "C", "value": "steady", "Explanation": "'Steady' means firmly held or not shaking. It describes stability of position, not physical durability."}, {"key": "D", "value": "secure", "Explanation": "'Secure' means safe from threat or firmly fastened. It doesn't describe the ability to withstand physical impact."}], "category": "Adjectives"}, {"id": "psle2021_eng_q13", "source": "PSLE 2021 English", "section": "Vocabulary MCQ", "qNum": 13, "sentence": "\"Your parents are busy at work. Do not bother them with ____________ matters such as delivering your books to school,\" the teacher told her class.", "options": ["trivial", "urgent", "shallow", "essential"], "answerIndex": 1, "answer": "trivial", "option_explanations": [{"key": "A", "value": "trivial", "Explanation": "Correct. 'Trivial' means of little importance. Delivering forgotten books is a minor matter that shouldn't interrupt busy parents at work."}, {"key": "B", "value": "urgent", "Explanation": "'Urgent' means requiring immediate action. This contradicts 'do not bother them' — urgent matters would warrant bothering parents."}, {"key": "C", "value": "shallow", "Explanation": "'Shallow' means not deep, physically or intellectually. It doesn't describe the importance of a matter."}, {"key": "D", "value": "essential", "Explanation": "'Essential' means absolutely necessary. Essential matters would justify contacting busy parents, contradicting the teacher's advice."}], "category": "Adjectives"}, {"id": "psle2021_eng_q14", "source": "PSLE 2021 English", "section": "Vocabulary MCQ", "qNum": 14, "sentence": "Although there was a lot of ____________ that Ronald would receive the award, no one knew for sure till the results were announced.", "options": ["suspicion", "conclusion", "speculation", "consideration"], "answerIndex": 3, "answer": "speculation", "option_explanations": [{"key": "A", "value": "suspicion", "Explanation": "'Suspicion' implies doubt about wrongdoing. Receiving an award is positive, making 'suspicion' inappropriate."}, {"key": "B", "value": "conclusion", "Explanation": "'Conclusion' means a final decision. 'No one knew for sure' contradicts having reached a conclusion."}, {"key": "C", "value": "speculation", "Explanation": "Correct. 'Speculation' means forming opinions without firm evidence. People speculated (guessed) Ronald would win, but nobody knew for certain."}, {"key": "D", "value": "consideration", "Explanation": "'Consideration' means careful thought. 'A lot of consideration that he would receive' doesn't naturally fit the sentence structure."}], "category": "Nouns"}, {"id": "psle2021_eng_q15", "source": "PSLE 2021 English", "section": "Vocabulary MCQ", "qNum": 15, "sentence": "Jenny ____________ the challenge of not knowing the language by engaging a local guide to accompany her.", "options": ["got by", "got off", "got round", "got beyond"], "answerIndex": 3, "answer": "got round", "option_explanations": [{"key": "A", "value": "got by", "Explanation": "'Got by' means to manage with difficulty. While related, it doesn't capture the idea of overcoming a specific challenge through a solution."}, {"key": "B", "value": "got off", "Explanation": "'Got off' means to leave or escape punishment. It doesn't mean overcoming a challenge."}, {"key": "C", "value": "got round", "Explanation": "Correct. 'Got round' means to overcome or find a way to deal with a problem. Jenny found a way around the language barrier by hiring a guide."}, {"key": "D", "value": "got beyond", "Explanation": "'Got beyond' means to pass or surpass. It doesn't naturally describe overcoming a practical challenge."}], "category": "Phrasal Verbs"}, {"id": "psle2021_eng_q16", "source": "PSLE 2021 English", "section": "Vocabulary Cloze", "qNum": 16, "passage": "At the pet store, a fluffy white rab
