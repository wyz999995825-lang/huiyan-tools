key": "B", "value": "dragged", "Explanation": "Correct. 'Dragged' means to pull something along forcefully or with difficulty. 'Hauled' and 'dragged' both describe pulling heavy items with effort."}, {"key": "C", "value": "removed", "Explanation": "'Removed' means to take away. While items were being moved, 'hauled' specifically emphasises the difficulty of pulling heavy things, which 'dragged' captures better."}, {"key": "D", "value": "extracted", "Explanation": "'Extracted' means to remove or pull out carefully. It is more precise and clinical, not matching the heavy, effortful pulling of 'hauled'."}], "full_passage": "James and I signed up for a beach clean-up programme. We wanted to see in person(16) how serious the littering problem was. As soon as we arrived at the beach, we armed ourselves with gloves and tongs, all charged up(17) to pick up litter on the beach. Although the beach looked somewhat(18) clean, the littering issue was more severe than we had thought. To our surprise, within a short time, we collected about 5 kilogrammes of litter. We had to leave behind bulky items which could not be hauled(19) to the disposal point, and there were light pieces of litter that were swept away by the retreating waves. Before we left the beach, we made the commitment(20) to participate in more of such programmes. We also hoped to rope in our friends in the next beach clean-up activity.", "category": "Precise Verbs"}, {"id": "psle2025_eng_q20", "source": "PSLE 2025 English", "section": "Vocabulary Cloze", "qNum": 20, "passage": "James and I signed up for a beach clean-up programme. We wanted to see in person(16) how serious the littering problem was. As soon as we arrived at the beach, we armed ourselves with gloves and tongs, all charged up(17) to pick up litter on the beach. Although the beach looked somewhat(18) clean, the littering issue was more severe than we had thought. To our surprise, within a short time, we collected about 5 kilogrammes of litter. We had to leave behind bulky items which could not be hauled(19) to the disposal point, and there were light pieces of litter that were swept away by the retreating waves. Before we left the beach, we made the commitment(20) to participate in more of such programmes. We also hoped to rope in our friends in the next beach clean-up activity.", "sentence": "Before we left the beach, we made the commitment to participate in more of such programmes.", "targetWord": "commitment", "options": ["resolution", "guarantee", "dedication", "arrangement"], "answerIndex": 1, "answer": "resolution", "option_explanations": [{"key": "A", "value": "resolution", "Explanation": "Correct. 'Resolution' means a firm decision to do something. 'Made the commitment' and 'made the resolution' both mean making a firm decision to act."}, {"key": "B", "value": "guarantee", "Explanation": "'Guarantee' means a formal promise or assurance. It implies a binding obligation, while 'commitment' here is more about personal determination."}, {"key": "C", "value": "dedication", "Explanation": "'Dedication' means devotion to a task or purpose. While related, 'made the dedication' is not a natural expression the way 'made the commitment' is."}, {"key": "D", "value": "arrangement", "Explanation": "'Arrangement' means a plan or preparation. It doesn't convey the sense of firm personal resolve that 'commitment' carries."}], "full_passage": "James and I signed up for a beach clean-up programme. We wanted to see in person(16) how serious the littering problem was. As soon as we arrived at the beach, we armed ourselves with gloves and tongs, all charged up(17) to pick up litter on the beach. Although the beach looked somewhat(18) clean, the littering issue was more severe than we had thought. To our surprise, within a short time, we collected about 5 kilogrammes of litter. We had to leave behind bulky items which could not be hauled(19) to the disposal point, and there were light pieces of litter that were swept away by the retreating waves. Before we left the beach, we made the commitment(20) to participate in more of such programmes. We also hoped to rope in our friends in the next beach clean-up activity.", "category": "Nouns"}, {"id": "southview2025_eng_q11", "source": "Prelim 2025 South View", "section": "Vocabulary MCQ", "qNum": 11, "sentence": "The teacher had to ____________ in the group's argument as they were not able to get any work done.", "options": ["intrude", "interact", "interfere", "intervene"], "answerIndex": 4, "answer": "intervene", "option_explanations": [{"key": "A", "value": "intrude", "Explanation": "'Intrude' means to enter without permission or welcome. The teacher had a reason to step in, so it wasn't an unwelcome intrusion."}, {"key": "B", "value": "interact", "Explanation": "'Interact' means to communicate or engage with others. It is too neutral and doesn't convey stepping in to resolve a problem."}, {"key": "C", "value": "interfere", "Explanation": "'Interfere' means to get involved in something that is not one's concern, often with a negative connotation. The teacher had a valid reason to step in."}, {"key": "D", "value": "intervene", "Explanation": "Correct. 'Intervene' means to come between parties in a dispute to help resolve it. The teacher intervened because the group could not work due to their argument."}], "category": "Precise Verbs"}, {"id": "southview2025_eng_q12", "source": "Prelim 2025 South View", "section": "Vocabulary MCQ", "qNum": 12, "sentence": "Upon seeing their favourite singer suddenly appearing on stage, the audience ____________ stood up and cheered for her.", "options": ["naturally", "hesitantly", "cautiously", "spontaneously"], "answerIndex": 4, "answer": "spontaneously", "option_explanations": [{"key": "A", "value": "naturally", "Explanation": "'Naturally' means in a natural manner or as expected. While the reaction was natural, 'spontaneously' better captures the sudden, unplanned nature of the response."}, {"key": "B", "value": "hesitantly", "Explanation": "'Hesitantly' means with reluctance or uncertainty. The audience was enthusiastic, not hesitant."}, {"key": "C", "value": "cautiously", "Explanation": "'Cautiously' means in a careful manner. The audience's reaction was excited and immediate, not cautious."}, {"key": "D", "value": "spontaneously", "Explanation": "Correct. 'Spontaneously' means in an unplanned, natural, and immediate way. The audience reacted spontaneously — without planning — upon seeing the singer."}], "category": "Adverbs"}, {"id": "southview2025_eng_q13", "source": "Prelim 2025 South View", "section": "Vocabulary MCQ", "qNum": 13, "sentence": "We felt relaxed and really enjoyed our stay at the ____________ countryside, away from the hustle and bustle of the city.", "options": ["still", "idyllic", "silent", "chaotic"], "answerIndex": 2, "answer": "idyllic", "option_explanations": [{"key": "A", "value": "still", "Explanation": "'Still' means not moving or calm. While the countryside may be still, it doesn't capture the full sense of a peaceful, charming, and pleasant setting."}, {"key": "B", "value": "idyllic", "Explanation": "Correct. 'Idyllic' means extremely peaceful, beautiful, and pleasant. It perfectly describes a countryside setting that contrasts with the hustle and bustle of the city."}, {"key": "C", "value": "silent", "Explanation": "'Silent' means making no sound. A countryside is not completely silent and the word doesn't convey the beauty and charm of the setting."}, {"key": "D", "value": "chaotic", "Explanation": "'Chaotic' means completely disordered and confused. This is the opposite of what the sentence describes — a relaxing countryside."}], "category": "Adjectives"}, {"id": "southview2025_eng_q14", "source": "Prelim 2025 South View", "section": "Vocabulary MCQ", "qNum": 14, "sentence": "\"We must all agree before we make a decision. We have to be ____________,\" the group leader said.", "options": ["in the loop", "out of the woods", "on the same page", "hitting the nail on the head"], "answerIndex": 3, "answer": "on the same page", "option_explanations": [{"key": "A", "value": "in the loop", "Explanation": "'In the loop' means to be informed about something. The leader wants agreement, not just information sharing."}, {"key": "B", "value": "out of the woods", "Explanation": "'Out of the woods' means no longer in danger or difficulty. It doesn't relate to agreeing on a decision."}, {"key": "C", "value": "on the same page", "Explanation": "Correct. 'On the same page' means to be in agreement or have a shared understanding. The leader wants everyone to agree before making a decision."}, {"key": "D", "value": "hitting the nail on the head", "Explanation": "'Hitting the nail on the head' means to describe exactly what is causing a situation. It doesn't mean to be in agreement."}], "category": "Collocations & Idioms"}, {"id": "southview2025_eng_q15", "source": "Prelim 2025 South View", "section": "Vocabulary MCQ", "qNum": 15, "sentence": "Recently, Jill has discovered that painting is one of her ____________ to relieve stress.", "options": ["routes", "courses", "avenues", "directions"], "answerIndex": 3, "answer": "avenues", "option_explanations": [{"key": "A", "value": "routes", "Explanation": "'Routes' refers to paths or ways of travel. While it can be used figuratively, 'avenues' is more natural in the context of options or means to achieve something."}, {"key": "B", "value": "courses", "Explanation": "'Courses' refers to classes or the direction of movement. 'Courses to relieve stress' is not a natural expression."}, {"key": "C", "value": "avenues", "Explanation": "Correct. 'Avenues' figuratively means options, methods, or means of pursuing something. Painting is an avenue (a way or means) for Jill to relieve stress."}, {"key": "D", "value": "directions", "Explanation": "'Directions' refers to the course along which something moves. It doesn't naturally describe a method or option for stress relief."}], "category": "Nouns"}, {"id": "southview2025_eng_q16", "source": "Prelim 2025 South View", "section": "Vocabulary Cloze", "qNum": 16, "passage": "My father had become more and more forgetful in his late 70s. On one occasion(16), he asked me three or four times in a single day if I had eaten. I raised my voice and replied exasperatedly(17) at him, \"Pa, how many times do you want to ask me the same question?\", to which he reacted with great surprise. Eventually, it was a friend who pointed out that he might have dementia. After suffering a bad fall in 2018, he had to be admitted to hospital. I took the chance to ask doctors at the hospital to test him for dementia. He was eventually diagnosed with Alzheimer's Disease, which explained why he had become more forgetful than before. My mother complained(18) about him offending customers at their stall because he made mistakes counting money and had forgotten social norms(19) of politeness. In November 2019, my father suffered a major stroke which exacerbated(20) his condition. He needed to be hospitalised again, and my family started to look into home care for him.", "sentence": "On one occasion, he asked me three or four times in a single day if I had eaten.", "targetWord": "occasion", "options": ["event", "festivity", "instance", "celebration"], "answerIndex": 3, "answer": "instance", "option_explanations": [{"key": "A", "value": "event", "Explanation": "'Event' refers to a planned or significant happening. The father asking a question repeatedly is not a special event."}, {"key": "B", "value": "festivity", "Explanation": "'Festivity' refers to celebrations or festivities. This is completely unrelated to the context."}, {"key": "C", "value": "instance", "Explanation": "Correct. 'Instance' means a particular case or example of something happening. 'On one occasion' and 'on one instance' both refer to one particular time something happened."}, {"key": "D", "value": "celebration", "Explanation": "'Celebration' refers to a joyful event. This doesn't fit the context of the father's forgetfulness."}], "full_passage": "My father had become more and more forgetful in his late 70s. On one occasion(16), he asked me three or four times in a single day if I had eaten. I raised my voice and replied exasperatedly(17) at him, \"Pa, how many times do you want to ask me the same question?\", to which he reacted with great surprise. Eventually, it was a friend who pointed out that he might have dementia. After suffering a bad fall in 2018, he had to be admitted to hospital. I took the chance to ask doctors at the hospital to test him for dementia. He was eventually diagnosed with Alzheimer's Disease, which explained why he had become more forgetful than before. My mother complained(18) about him offending customers at their stall because he made mistakes counting money and had forgotten social norms(19) of politeness. In November 2019, my father suffered a major stroke which exacerbated(20) his condition. He needed to be hospitalised again, and my family started to look into home care for him.", "category": "Nouns"}, {"id": "southview2025_eng_q17", "source": "Prelim 2025 South View", "section": "Vocabulary Cloze", "qNum": 17, "passage": "My father had become more and more forgetful in his late 70s. On one occasion(16), he asked me three or four times in a single day if I had eaten. I raised my voice and replied exasperatedly(17) at him, \"Pa, how many times do you want to ask me the same question?\", to which he reacted with great surprise. Eventually, it was a friend who pointed out that he might have dementia. After suffering a bad fall in 2018, he had to be admitted to hospital. I took the chance to ask doctors at the hospital to test him for dementia. He was eventually diagnosed with Alzheimer's Disease, which explained why he had become more forgetful than before. My mother complained(18) about him offending customers at their stall because he made mistakes counting money and had forgotten social norms(19) of politeness. In November 2019, my father suffered a major stroke which exacerbated(20) his condition. He needed to be hospitalised again, and my family started to look into home care for him.", "sentence": "I raised my voice and replied exasperatedly at him.", "targetWord": "exasperatedly", "options": ["helplessly", "vulnerably", "frustratingly", "overwhelmingly"], "answerIndex": 3, "answer": "frustratingly", "option_explanations": [{"key": "A", "value": "helplessly", "Explanation": "'Helplessly' means in a way that shows inability to help oneself. While the narrator felt helpless, 'exasperatedly' specifically conveys irritation and frustration."}, {"key": "B", "value": "vulnerably", "Explanation": "'Vulnerably' means in a way that shows weakness or susceptibility. The narrator was frustrated, not vulnerable."}, {"key": "C", "value": "frustratingly", "Explanation": "Correct. 'Frustratingly' means in a manner showing annoyance and impatience. 'Exasperatedly' and 'frustratingly' both describe responding with irritation."}, {"key": "D", "value": "overwhelmingly", "Explanation": "'Overwhelmingly' means to an overpowering degree. It doesn't specifically convey the irritation and annoyance of 'exasperatedly'."}], "full_passage": "My father had become more and more forgetful in his late 70s. On one occasion(16), he asked me three or four times in a single day if I had eaten. I raised my voice and replied exasperatedly(17) at him, \"Pa, how many times do you want to ask me the same question?\", to which he reacted with great surprise. Eventually, it was a friend who pointed out that he might have dementia. After suffering a bad fall in 2018, he had to be admitted to hospital. I took the chance to ask doctors at the hospital to test him for dementia. He was eventually diagnosed with Alzheimer's Disease, which explained why he had become more forgetful than before. My mother complained(18) about him offending customers at their stall because he made mistakes counting money and had forgotten social norms(19) of politeness. In November 2019, my father suffered a major stroke which exacerbated(20) his condition. He needed to be hospitalised again, and my family started to look into home care for him.", "category": "Adverbs"}, {"id": "southview2025_eng_q18", "source": "Prelim 2025 South View", "section": "Vocabulary Cloze", "qNum": 18, "passage": "My father had become more and more forgetful in his late 70s. On one occasion(16), he asked me three or four times in a single day if I had eaten. I raised my voice and replied exasperatedly(17) at him, \"Pa, how many times do you want to ask me the same question?\", to which he reacted with great surprise. Eventually, it was a friend who pointed out that he might have dementia. After suffering a bad fall in 2018, he had to be admitted to hospital. I took the chance to ask doctors at the hospital to test him for dementia. He was eventually diagnosed with Alzheimer's Disease, which explained why he had become more forgetful than before. My mother complained(18) about him offending customers at their stall because he made mistakes counting money and had forgotten social norms(19) of politeness. In November 2019, my father suffered a major stroke which exacerbated(20) his condition. He needed to be hospitalised again, and my family started to look into home care for him.", "sentence": "My mother complained about him offending customers at their stall.", "targetWord": "complained", "options": ["reported", "mourned", "lamented", "grumbled"], "answerIndex": 4, "answer": "grumbled", "option_explanations": [{"key": "A", "value": "reported", "Explanation": "'Reported' means to give a formal account. The mother was expressing frustration, not making a formal report."}, {"key": "B", "value": "mourned", "Explanation": "'Mourned' means to grieve or feel sorrow. While sad, the mother was expressing displeasure, not mourning."}, {"key": "C", "value": "lamented", "Explanation": "'Lamented' means to express sorrow or regret. While close, 'complained' is more about expressing dissatisfaction, which 'grumbled' captures better."}, {"key": "D", "value": "grumbled", "Explanation": "Correct. 'Grumbled' means to complain in a quiet, discontented way. Both 'complained' and 'grumbled' describe expressing unhappiness or dissatisfaction about a situation."}], "full_passage": "My father had become more and more forgetful in his late 70s. On one occasion(16), he asked me three or four times in a single day if I had eaten. I raised my voice and replied exasperatedly(17) at him, \"Pa, how many times do you want to ask me the same question?\", to which he reacted with great surprise. Eventually, it was a friend who pointed out that he might have dementia. After suffering a bad fall in 2018, he had to be admitted to hospital. I took the chance to ask doctors at the hospital to test him for dementia. He was eventually diagnosed with Alzheimer's Disease, which explained why he had become more forgetful than before. My mother complained(18) about him offending customers at their stall because he made mistakes counting money and had forgotten social norms(19) of politeness. In November 2019, my father suffered a major stroke which exacerbated(20) his condition. He needed to be hospitalised again, and my family started to look into home care for him.", "category": "Precise Verbs"}, {"id": "southview2025_eng_q19", "source": "Prelim 2025 South View", "section": "Vocabulary Cloze", "qNum": 19, "passage": "My father had become more and more forgetful in his late 70s. On one occasion(16), he asked me three or four times in a single day if I had eaten. I raised my voice and replied exasperatedly(17) at him, \"Pa, how many times do you want to ask me the same question?\", to which he reacted with great surprise. Eventually, it was a friend who pointed out that he might have dementia. After suffering a bad fall in 2018, he had to be admitted to hospital. I took the chance to ask doctors at the hospital to test him for dementia. He was eventually diagnosed with Alzheimer's Disease, which explained why he had become more forgetful than before. My mother complained(18) about him offending customers at their stall because he made mistakes counting money and had forgotten social norms(19) of politeness. In November 2019, my father suffered a major stroke which exacerbated(20) his condition. He needed to be hospitalised again, and my family started to look into home care for him.", "sentence": "He had forgotten social norms of politeness.", "targetWord": "norms", "options": ["ways", "customs", "measures", "standards"], "answerIndex": 4, "answer": "standards", "option_explanations": [{"key": "A", "value": "ways", "Explanation": "'Ways' is too general. It doesn't convey the established, expected nature of social rules."}, {"key": "B", "value": "customs", "Explanation": "'Customs' refers to traditional practices of a society. While close, 'norms' specifically refers to accepted standards of behaviour, which 'standards' captures better."}, {"key": "C", "value": "measures", "Explanation": "'Measures' refers to actions taken to achieve something, or units of measurement. It doesn't describe social expectations."}, {"key": "D", "value": "standards", "Explanation": "Correct. 'Standards' refers to accepted levels of quality or behaviour. 'Social norms' and 'social standards' both describe the expected, accepted rules of behaviour in society."}], "full_passage": "My father had become more and more forgetful in his late 70s. On one occasion(16), he asked me three or four times in a single day if I had eaten. I raised my voice and replied exasperatedly(17) at him, \"Pa, how many times do you want to ask me the same question?\", to which he reacted with great surprise. Eventually, it was a friend who pointed out that he might have dementia. After suffering a bad fall in 2018, he had to be admitted to hospital. I took the chance to ask doctors at the hospital to test him for dementia. He was eventually diagnosed with Alzheimer's Disease, which explained why he had become more forgetful than before. My mother complained(18) about him offending customers at their stall because he made mistakes counting money and had forgotten social norms(19) of politeness. In November 2019, my father suffered a major stroke which exacerbated(20) his condition. He needed to be hospitalised again, and my family started to look into home care for him.", "category": "Nouns"}, {"id": "southview2025_eng_q20", "source": "Prelim 2025 South View", "section": "Vocabulary Cloze", "qNum": 20, "passage": "My father had become more and more forgetful in his late 70s. On one occasion(16), he asked me three or four times in a single day if I had eaten. I raised my voice and replied exasperatedly(17) at him, \"Pa, how many times do you want to ask me the same question?\", to which he reacted with great surprise. Eventually, it was a friend who pointed out that he might have dementia. After suffering a bad fall in 2018, he had to be admitted to hospital. I took the chance to ask doctors at the hospital to test him for dementia. He was eventually diagnosed with Alzheimer's Disease, which explained why he had become more forgetful than before. My mother complained(18) about him offending customers at their stall because he made mistakes counting money and had forgotten social norms(19) of politeness. In November 2019, my father suffered a major stroke which exacerbated(20) his condition. He needed to be hospitalised again, and my family started to look into home care for him.", "sentence": "My father suffered a major stroke which exacerbated his condition.", "targetWord": "exacerbated", "options": ["troubled", "worsened", "magnified", "exaggerated"], "answerIndex": 2, "answer": "worsened", "option_explanations": [{"key": "A", "value": "troubled", "Explanation": "'Troubled' means to cause worry or distress. While the stroke was troubling, 'exacerbated' specifically means made worse, not just caused worry."}, {"key": "B", "value": "worsened", "Explanation": "Correct. 'Worsened' means to make or become worse. 'Exacerbated' means to make a problem or situation worse, which is exactly what 'worsened' means."}, {"key": "C", "value": "magnified", "Explanation": "'Magnified' means to make larger or more significant. While close, 'exacerbated' specifically means to make worse, not just bigger."}, {"key": "D", "value": "exaggerated", "Explanation": "'Exaggerated' means to overstate or make something seem larger than it is. This is about perception, while 'exacerbated' is about actual worsening."}], "full_passage": "My father had become more and more forgetful in his late 70s. On one occasion(16), he asked me three or four times in a single day if I had eaten. I raised my voice and replied exasperatedly(17) at him, \"Pa, how many times do you want to ask me the same question?\", to which he reacted with great surprise. Eventually, it was a friend who pointed out that he might have dementia. After suffering a bad fall in 2018, he had to be admitted to hospital. I took the chance to ask doctors at the hospital to test him for dementia. He was eventually diagnosed with Alzheimer's Disease, which explained why he had become more forgetful than before. My mother complained(18) about him offending customers at their stall because he made mistakes counting money and had forgotten social norms(19) of politeness. In November 2019, my father suffered a major stroke which exacerbated(20) his condition. He needed to be hospitalised again, and my family started to look into home care for him.", "category": "Precise Verbs"}];

// ============ SOUND SYSTEM ============
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function ensureAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }

function playCorrect() {
  ensureAudio();
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.type = 'sine';
  const t = audioCtx.currentTime;
  o.frequency.setValueAtTime(523, t);
  o.frequency.setValueAtTime(659, t + 0.08);
  o.frequency.setValueAtTime(784, t + 0.16);
  g.gain.setValueAtTime(0.3, t);
  g.gain.exponentialRampToValueAtTime(0.01, t + 0.35);
  o.start(t); o.stop(t + 0.35);
}

function playWrong() {
  ensureAudio();
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.type = 'square';
  const t = audioCtx.currentTime;
  o.frequency.setValueAtTime(200, t);
  o.frequency.setValueAtTime(180, t + 0.15);
  g.gain.setValueAtTime(0.15, t);
  g.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
  o.start(t); o.stop(t + 0.3);
}

function playStreak() {
  ensureAudio();
  const notes = [523, 659, 784, 1047];
  notes.forEach((freq, i) => {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sine';
    const t = audioCtx.currentTime + i * 0.1;
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.25, t);
    g.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
    o.start(t); o.stop(t + 0.25);
  });
}

function playLevelUp() {
  ensureAudio();
  const notes = [523, 659, 784, 880, 1047];
  notes.forEach((freq, i) => {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'triangle';
    const t = audioCtx.currentTime + i * 0.08;
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.3, t);
    g.gain.exponentialRampToValueAtTime(0.01, t + 0.35);
    o.start(t); o.stop(t + 0.4);
  });
}

// ============ STATE ============
const CATS = {
  'Precise Verbs':       { icon: '🎯', color: '#e53935' },
  'Phrasal Verbs':       { icon: '🔗', color: '#8e24aa' },
  'Adjectives':          { icon: '🎨', color: '#fb8c00' },
  'Adverbs':             { icon: '⚡', color: '#1e88e5' },
  'Nouns':               { icon: '📦', color: '#43a047' },
  'Collocations & Idioms': { icon: '💬', color: '#00897b' },
};

const SECTIONS = {
  'Vocabulary MCQ': { label: 'Fill in the Blank', short: 'FIB', icon: '✏️' },
  'Vocabulary Cloze': { label: 'Closest in Meaning', short: 'CIM', icon: '🔍' },
};

let state = {
  screen: 'home',   // home, quiz, results
  tab: 'categories', // categories, papers
  filter: { section: 'all', category: null, source: null },
  questions: [],
  currentIdx: 0,
  answers: {},
  streak: 0,
  totalXP: 0,
  history: {},
};

// Load saved state
try {
  const saved = localStorage.getItem('vocabTrainerV2');
  if (saved) {
    const s = JSON.parse(saved);
    state.history = s.history || {};
    state.totalXP = s.totalXP || 0;
    state.streak = 0; // reset per session
  }
} catch(e) {}

function saveState() {
  try {
    localStorage.setItem('vocabTrainerV2', JSON.stringify({
      history: state.history,
      totalXP: state.totalXP,
    }));
  } catch(e) {}
}

// Theme
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('vocabTheme', t);
  render();
}
try {
  const t = localStorage.getItem('vocabTheme');
  if (t) document.documentElement.setAttribute('data-theme', t);
} catch(e) {}

function getCurrentTheme() {
  return document.documentElement.getAttribute('data-theme') || 'green';
}

// ============ HELPERS ============
function getStats() {
  let attempted = 0, correct = 0;
  for (const id in state.history) {
    attempted++;
    if (state.history[id].correct) correct++;
  }
  return { attempted, correct, total: ALL_QUESTIONS.length };
}

function getCatQuestions(section, category) {
  return ALL_QUESTIONS.filter(q => {
    if (section !== 'all' && q.section !== section) return false;
    if (category && q.category !== category) return false;
    return true;
  });
}

function getCatStats(section, category) {
  const qs = getCatQuestions(section, category);
  let done = 0, correct = 0;
  qs.forEach(q => {
    if (state.history[q.id]) {
      done++;
      if (state.history[q.id].correct) correct++;
    }
  });
  return { total: qs.length, done, correct, pct: qs.length ? Math.round(done / qs.length * 100) : 0 };
}

function getSourceQuestions(source) {
  return ALL_QUESTIONS.filter(q => q.source === source);
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ============ RENDER ============
function render() {
  const app = document.getElementById('app');
  if (state.screen === 'home') renderHome(app);
  else if (state.screen === 'quiz') renderQuiz(app);
  else if (state.screen === 'results') renderResults(app);
}

function renderHome(app) {
  const stats = getStats();
  const theme = getCurrentTheme();

  // Topbar
  let html = `
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-logo">Vocab<span>Trainer</span></div>
      </div>
      <div class="topbar-right">
        <div class="streak-badge">⚡ ${state.totalXP} XP</div>
        <button class="theme-btn theme-green ${!theme || theme==='green' ? 'active':''}" onclick="setTheme('green')"></button>
        <button class="theme-btn theme-ocean ${theme==='ocean' ? 'active':''}" onclick="setTheme('ocean')"></button>
        <button class="theme-btn theme-sunset ${theme==='sunset' ? 'active':''}" onclick="setTheme('sunset')"></button>
        <button class="theme-btn theme-dark ${theme==='dark' ? 'active':''}" onclick="setTheme('dark')"></button>
      </div>
    </div>`;

  // Stats row
  html += `
    <div class="stats-row">
      <div class="stat-item"><div class="stat-val">${stats.total}</div><div class="stat-label">Questions</div></div>
      <div class="stat-item"><div class="stat-val">${stats.attempted}</div><div class="stat-label">Attempted</div></div>
      <div class="stat-item"><div class="stat-val">${stats.correct}</div><div class="stat-label">Correct</div></div>
      <div class="stat-item"><div class="stat-val">${stats.attempted ? Math.round(stats.correct/stats.attempted*100) : 0}%</div><div class="stat-label">Accuracy</div></div>
    </div>`;

  // Tabs
  html += `
    <div class="tabs">
      <button class="tab ${state.tab==='categories' ? 'active':''}" onclick="switchTab('categories')">📚 Categories</button>
      <button class="tab ${state.tab==='papers' ? 'active':''}" onclick="switchTab('papers')">📄 Papers</button>
    </div>`;

  if (state.tab === 'categories') {
    html += renderCategoriesTab();
  } else {
    html += renderPapersTab();
  }

  app.innerHTML = html;
  // Remove bottom bar on home
  document.querySelector('.bottom-bar')?.classList.add('hidden');
}

function renderCategoriesTab() {
  let html = '';

  // Quick actions
  html += `
    <div class="quick-actions">
      <button class="action-btn primary" onclick="startMix('all')">🎲 Mix All (${ALL_QUESTIONS.length})</button>
      <button class="action-btn" onclick="startWrong()">🔄 Retry Mistakes</button>
      <button class="action-btn" onclick="startUnattempted()">🆕 Unattempted</button>
    </div>`;

  // For each section (FIB / CIM)
  for (const [sectionKey, sInfo] of Object.entries(SECTIONS)) {
    const sectionQs = ALL_QUESTIONS.filter(q => q.section === sectionKey);
    const sStats = getCatStats(sectionKey, null);
    html += `<div class="section-title"><span class="emoji">${sInfo.icon}</span> ${sInfo.label} <span style="font-weight:600;color:var(--text2);font-size:0.8em;">(${sectionQs.length} questions, ${sStats.pct}% done)</span></div>`;

    html += '<div class="cat-grid">';
    // Get categories that exist for this section
    const catsInSection = {};
    sectionQs.forEach(q => {
      if (!catsInSection[q.category]) catsInSection[q.category] = 0;
      catsInSection[q.category]++;
    });

    for (const [catName, catInfo] of Object.entries(CATS)) {
      if (!catsInSection[catName]) continue;
      const cs = getCatStats(sectionKey, catName);
      const mastered = cs.pct === 100 && cs.total > 0;
      html += `
        <div class="cat-card ${mastered ? 'mastered':''}" onclick="startCategory('${sectionKey}','${catName}')">
          <div class="cat-pct">${cs.pct}%</div>
          <div class="cat-icon">${catInfo.icon}</div>
          <div class="cat-name">${catName}</div>
          <div class="cat-count">${catsInSection[catName]} questions · ${cs.correct}/${cs.total} correct</div>
          <div class="cat-progress"><div class="cat-progress-fill" style="width:${cs.pct}%"></div></div>
        </div>`;
    }
    html += '</div>';
  }

  return html;
}

function renderPapersTab() {
  let html = '';

  // Group sources
  const psle = [];
  const prelim = [];
  const sources = [...new Set(ALL_QUESTIONS.map(q => q.source))];
  sources.forEach(s => {
    if (s.startsWith('Prelim') || s.startsWith('South')) prelim.push(s);
    else psle.push(s);
  });

  // Sort
  psle.sort((a,b) => {
    const ya = parseInt(a.match(/\d{4}/)?.[0] || '0');
    const yb = parseInt(b.match(/\d{4}/)?.[0] || '0');
    return yb - ya;
  });
  prelim.sort();

  function renderPaperGroup(title, papers) {
    let h = `<div class="section-title">${title}</div><div class="paper-list">`;
    papers.forEach(src => {
      const qs = getSourceQuestions(src);
      let done = 0, correct = 0;
      qs.forEach(q => {
        if (state.history[q.id]) { done++; if (state.history[q.id].correct) correct++; }
      });
      const pct = qs.length ? Math.round(done / qs.length * 100) : 0;
      const shortName = src.replace('PSLE ', '').replace(' English', '').replace('Prelim 2025 ', '');
      h += `
        <div class="paper-row" onclick="startPaper('${src.replace(/'/g,"\\'")}')">
          <div class="paper-icon">📝</div>
          <div class="paper-info">
            <div class="paper-name">${shortName}</div>
            <div class="paper-meta">${qs.length} questions · ${correct}/${done} correct</div>
          </div>
          <div class="paper-prog">${pct}%</div>
        </div>`;
    });
    h += '</div>';
    return h;
  }

  html += renderPaperGroup('📋 PSLE Papers', psle);
  html += renderPaperGroup('🏫 Prelim Papers', prelim);
  return html;
}

// ============ QUIZ RENDERING ============
function renderQuiz(app) {
  const total = state.questions.length;
  const q = state.questions[state.currentIdx];
  const answered = state.answers[state.currentIdx] !== undefined;
  const chosenIdx = state.answers[state.currentIdx];
  const correctIdx = q.answerIndex - 1;
  const isCorrect = answered && chosenIdx === correctIdx;

  let answeredCount = Object.keys(state.answers).length;
  let correctCount = 0;
  for (const idx in state.answers) {
    if (state.answers[idx] === state.questions[idx].answerIndex - 1) correctCount++;
  }

  const pct = Math.round((state.currentIdx + (answered ? 1 : 0)) / total * 100);
  const sInfo = SECTIONS[q.section] || { short: '?', icon: '?' };
  const catInfo = CATS[q.category] || { icon: '?', color: '#888' };

  // Passage for CIM
  let passageHtml = '';
  if (q.section === 'Vocabulary Cloze' && q.passage) {
    let pass = q.passage;
    if (q.targetWord) {
      const re = new RegExp('(' + q.targetWord.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'i');
      pass = pass.replace(re, '<span class="target">$1</span>');
    }
    passageHtml = `<div class="q-passage">${pass}</div>`;
  }

  // Sentence
  let sentenceHtml = q.sentence || '';
  if (q.section === 'Vocabulary MCQ') {
    sentenceHtml = sentenceHtml.replace(/_{3,}/g, '<span class="blank"></span>');
  }

  const instruction = q.section === 'Vocabulary Cloze'
    ? `Choose the word closest in meaning to "<strong>${q.targetWord || ''}</strong>".`
    : 'Choose the best word to fill in the blank.';

  const letters = ['A', 'B', 'C', 'D'];
  let optionsHtml = q.options.map((opt, i) => {
    let cls = 'opt';
    if (answered) {
      cls += ' disabled';
      if (i === correctIdx) cls += ' correct';
      else if (i === chosenIdx && i !== correctIdx) cls += ' wrong';
      else cls += ' dimmed';
    }
    return `<button class="${cls}" ${answered ? '' : 'onclick="selectAnswer('+i+')"'}>
      <span class="opt-letter">${letters[i]}</span>
      <span>${opt}</span>
    </button>`;
  }).join('');

  // Explanation
  let expHtml = '';
  if (answered && q.option_explanations && q.option_explanations.length === 4) {
    const expItems = q.option_explanations.map((exp, i) => {
      const isAns = i === correctIdx;
      return `<div class="exp-item">
        <span class="exp-word ${isAns ? 'exp-correct-word':'exp-wrong-word'}">(${letters[i]}) ${exp.value}</span>
        <div style="margin-top:2px;color:var(--text2)">${exp.Explanation}</div>
      </div>`;
    }).join('');
    expHtml = `<div class="explanation">
      <div class="exp-header ${isCorrect ? 'right':'wrong-h'}">
        ${isCorrect ? '✅ Correct!' : '❌ The answer is (' + letters[correctIdx] + ') ' + q.options[correctIdx]}
      </div>
      ${expItems}
    </div>`;
  }

  app.innerHTML = `
    <div class="quiz-header">
      <button class="quiz-close" onclick="confirmExit()">✕</button>
      <div class="progress-track">
        <div class="progress-fill" style="width:${pct}%"></div>
      </div>
      <div class="quiz-score">${correctCount}/${answeredCount}</div>
    </div>
    <div class="q-card">
      <div class="q-badges">
        <span class="q-badge q-badge-type">${sInfo.icon} ${sInfo.short}</span>
        <span class="q-badge q-badge-cat">${catInfo.icon} ${q.category}</span>
        <span class="q-badge q-badge-src">${q.source} Q${q.qNum}</span>
      </div>
      ${passageHtml}
      <div class="q-instruction">${instruction}</div>
      <div class="q-sentence">${sentenceHtml}</div>
      <div class="options">${optionsHtml}</div>
      ${expHtml}
    </div>`;

  // Bottom bar
  let bottomBar = document.getElementById('bottomBar');
  if (!bottomBar) {
    bottomBar = document.createElement('div');
    bottomBar.className = 'bottom-bar hidden';
    bottomBar.id = 'bottomBar';
    document.body.appendChild(bottomBar);
  }

  if (answered) {
    const btnClass = isCorrect ? 'correct-btn' : 'wrong-btn';
    const isLast = state.currentIdx === total - 1;
    bottomBar.innerHTML = `<button class="continue-btn ${btnClass}" onclick="${isLast ? 'showResults()' : 'nextQuestion()'}">${isLast ? 'See Results' : 'Continue'}</button>`;
    bottomBar.classList.remove('hidden');
  } else {
    bottomBar.classList.add('hidden');
  }
}

// ============ RESULTS ============
function renderResults(app) {
  const total = state.questions.length;
  let correct = 0;
  const wrongList = [];
  for (let i = 0; i < total; i++) {
    const q = state.questions[i];
    const chosen = state.answers[i];
    const correctIdx = q.answerIndex - 1;
    if (chosen === correctIdx) correct++;
    else if (chosen !== undefined) wrongList.push({ idx: i, q, chosen, correctIdx });
  }
  const pct = Math.round(correct / total * 100);
  const xpEarned = correct * 10;
  state.totalXP += xpEarned;
  saveState();

  const emoji = pct >= 90 ? '🏆' : pct >= 70 ? '🌟' : pct >= 50 ? '💪' : '📖';
  const msg = pct >= 90 ? 'Outstanding!' : pct >= 70 ? 'Great job!' : pct >= 50 ? 'Keep going!' : 'Keep practising!';
  const circumference = 2 * Math.PI * 54;
  const offset = circumference - (pct / 100) * circumference;

  const letters = ['A', 'B', 'C', 'D'];
  let wrongHtml = '';
  if (wrongList.length > 0) {
    wrongHtml = `<div class="review-list">
      <div class="review-header">📋 Questions to Review (${wrongList.length})</div>
      ${wrongList.map(w => `
        <div class="review-item" onclick="reviewQuestion(${w.idx})">
          <strong>${w.q.source} Q${w.q.qNum}:</strong>
          ${w.q.section === 'Vocabulary Cloze' ? w.q.targetWord : w.q.options[w.correctIdx]}
          <div style="font-size:0.8em;color:var(--text2);margin-top:2px;">
            You: (${letters[w.chosen]}) ${w.q.options[w.chosen]} → Answer: (${letters[w.correctIdx]}) ${w.q.options[w.correctIdx]}
          </div>
        </div>
      `).join('')}
    </div>`;
  }

  app.innerHTML = `
    <div class="results">
      <div class="results-emoji">${emoji}</div>
      <h2>${msg}</h2>
      <p class="results-sub">You completed ${total} questions</p>
      <div class="score-ring">
        <svg viewBox="0 0 120 120">
          <circle class="bg-ring" cx="60" cy="60" r="54"/>
          <circle class="fg-ring" cx="60" cy="60" r="54"
            stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"/>
        </svg>
        <div class="score-text">${correct}/${total}</div>
        <div class="score-pct">${pct}%</div>
      </div>
      <div class="xp-gain">⚡ +${xpEarned} XP</div>
      <div class="results-actions">
        <button class="action-btn primary" onclick="goHome()">🏠 Home</button>
        ${wrongList.length > 0 ? '<button class="action-btn" onclick="retryWrong()">🔄 Retry Mistakes</button>' : ''}
      </div>
      ${wrongHtml}
    </div>`;

  // Hide bottom bar
  const bb = document.getElementById('bottomBar');
  if (bb) bb.classList.add('hidden');

  // Level up sound
  if (pct >= 80) playLevelUp();
}

// ============ ACTIONS ============
function switchTab(t) { state.tab = t; render(); }

function startCategory(section, category) {
  let qs = getCatQuestions(section, category);
  qs = shuffle(qs);
  startSession(qs);
}

function startPaper(source) {
  let qs = ALL_QUESTIONS.filter(q => q.source === source);
  qs.sort((a,b) => a.qNum - b.qNum);
  startSession(qs);
}

function startMix(mode) {
  let qs = shuffle([...ALL_QUESTIONS]);
  if (qs.length > 30) qs = qs.slice(0, 30); // cap at 30 for mix
  startSession(qs);
}

function startWrong() {
  const wrong = ALL_QUESTIONS.filter(q => state.history[q.id] && !state.history[q.id].correct);
  if (wrong.length === 0) { alert('No mistakes to review yet!'); return; }
  startSession(shuffle(wrong));
}

function startUnattempted() {
  const fresh = ALL_QUESTIONS.filter(q => !state.history[q.id]);
  if (fresh.length === 0) { alert('All questions attempted!'); return; }
  let qs = shuffle(fresh);
  if (qs.length > 30) qs = qs.slice(0, 30);
  startSession(qs);
}

function startSession(qs) {
  if (qs.length === 0) { alert('No questions found.'); return; }
  state.questions = qs;
  state.currentIdx = 0;
  state.answers = {};
  state.streak = 0;
  state.screen = 'quiz';
  render();
  window.scrollTo(0, 0);
}

function selectAnswer(optIdx) {
  if (state.answers[state.currentIdx] !== undefined) return;
  state.answers[state.currentIdx] = optIdx;

  const q = state.questions[state.currentIdx];
  const isCorrect = optIdx === q.answerIndex - 1;

  // Update history
  state.history[q.id] = { correct: isCorrect, lastAttempt: Date.now() };
  saveState();

  // Streak
  if (isCorrect) {
    state.streak++;
    playCorrect();
    // Streak milestones
    if (state.streak === 5 || state.streak === 10 || state.streak === 15 || state.streak === 20) {
      setTimeout(() => showStreak(state.streak), 400);
    }
  } else {
    state.streak = 0;
    playWrong();
  }

  render();
  // Scroll explanation into view
  setTimeout(() => {
    const exp = document.querySelector('.explanation');
    if (exp) exp.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 150);
}

function nextQuestion() {
  state.currentIdx++;
  render();
  window.scrollTo(0, 0);
}

function showResults() {
  state.screen = 'results';
  render();
  window.scrollTo(0, 0);
}

function goHome() {
  state.screen = 'home';
  state.tab = 'categories';
  render();
  window.scrollTo(0, 0);
}

function confirmExit() {
  if (Object.keys(state.answers).length > 0) {
    if (!confirm('Leave this session? Your progress will be saved.')) return;
  }
  goHome();
}

function retryWrong() {
  const wrong = [];
  for (let i = 0; i < state.questions.length; i++) {
    const q = state.questions[i];
    const chosen = state.answers[i];
    if (chosen !== undefined && chosen !== q.answerIndex - 1) {
      wrong.push(q);
    }
  }
  if (wrong.length === 0) { goHome(); return; }
  startSession(shuffle(wrong));
}

function reviewQuestion(idx) {
  state.currentIdx = idx;
  state.screen = 'quiz';
  render();
  window.scrollTo(0, 0);
}

// Streak popup
function showStreak(count) {
  playStreak();
  const emojis = { 5: '🔥', 10: '⚡', 15: '🌟', 20: '🏆' };
  const titles = { 5: 'On Fire!', 10: 'Unstoppable!', 15: 'Superstar!', 20: 'Legendary!' };
  const texts = { 5: '5 in a row!', 10: '10 streak — incredible!', 15: '15 straight — amazing!', 20: '20 streak — you\'re a champion!' };
  document.getElementById('streakEmoji').textContent = emojis[count] || '🔥';
  document.getElementById('streakTitle').textContent = titles[count] || 'Streak!';
  document.getElementById('streakText').textContent = texts[count] || count + ' in a row!';
  document.getElementById('streakPopup').classList.remove('hidden');
  document.getElementById('streakOverlay').classList.remove('hidden');
  setTimeout(closeStreak, 2000);
}

function closeStreak() {
  document.getElementById('streakPopup').classList.add('hidden');
  document.getElementById('streakOverlay').classList.add('hidden');
}

// ============ INIT ============
render();
</script>
