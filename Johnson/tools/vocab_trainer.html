of worry or interest, fitting 'a major concern for the school community'."}, {"key": "C", "value": "obstruction", "Explanation": "Incorrect. 'obstruction' means a physical blockage, not an abstract problem or worry."}, {"key": "D", "value": "interference", "Explanation": "Incorrect. 'interference' means unwanted involvement or disturbance, not a primary community concern."}], "category": "Nouns"}, {"id": "prelim2025_taonan_eng_q14", "source": "Prelim 2025 TaoNan", "section": "Vocabulary MCQ", "qNum": 14, "sentence": "My little nephew ________ when he saw blood trickling down his grazed knee.", "options": ["passed up", "passed off", "passed out", "passed over"], "answerIndex": 3, "answer": "passed out", "option_explanations": [{"key": "A", "value": "passed up", "Explanation": "Incorrect. 'passed up' means declined an opportunity or missed a chance."}, {"key": "B", "value": "passed off", "Explanation": "Incorrect. 'passed off' means disguised as something else or dismissed as acceptable."}, {"key": "C", "value": "passed out", "Explanation": "Correct. 'passed out' means fainted or lost consciousness, the natural reaction to seeing blood from an injury."}, {"key": "D", "value": "passed over", "Explanation": "Incorrect. 'passed over' means overlooked or not chosen for consideration."}], "category": "Phrasal Verbs"}, {"id": "prelim2025_taonan_eng_q15", "source": "Prelim 2025 TaoNan", "section": "Vocabulary MCQ", "qNum": 15, "sentence": "The students were hesitant to speak ________ in front of the discipline master for fear of being reprimanded.", "options": ["eagerly", "tactfully", "candidly", "deliberately"], "answerIndex": 3, "answer": "candidly", "option_explanations": [{"key": "A", "value": "eagerly", "Explanation": "Incorrect. 'eagerly' means enthusiastically or keenly, not relevant to fear of reprimand."}, {"key": "B", "value": "tactfully", "Explanation": "Incorrect. 'tactfully' means diplomatically or with sensitivity, but doesn't explain the fear."}, {"key": "C", "value": "candidly", "Explanation": "Correct. 'candidly' means openly, honestly, and straightforwardly. Students feared speaking candidly would get them reprimanded."}, {"key": "D", "value": "deliberately", "Explanation": "Incorrect. 'deliberately' means intentionally or on purpose, not the manner of speech in this context."}], "category": "Adverbs"}, {"id": "prelim2025_taonan_eng_q16", "source": "Prelim 2025 TaoNan", "section": "Vocabulary Cloze", "qNum": 16, "sentence": "Kiri was on a trip to Cambodia with his granddaughter, Sophea. After months of planning, their dream was finally realised (16) as they travelled to Kampong Thom, where he grew up. Entranced (17) by the beautiful fields and the distant clamour of roosters crowing, Sophea walked to the river where her grandfather had once spent hours fishing.", "options": ["released", "revealed", "manifested", "materialised"], "answerIndex": 4, "answer": "materialised", "option_explanations": [{"key": "A", "value": "released", "Explanation": "Incorrect. 'released' means set free or made available, not about a dream coming into reality."}, {"key": "B", "value": "revealed", "Explanation": "Incorrect. 'revealed' means made known or disclosed, not the same as a dream becoming real."}, {"key": "C", "value": "manifested", "Explanation": "Incorrect. 'manifested' means showed or displayed, but is less precise than 'materialised' for a dream coming true."}, {"key": "D", "value": "materialised", "Explanation": "Correct. 'materialised' means came into being or became real, capturing the idea that their dream became reality."}], "full_passage": "Kiri was on a trip to Cambodia with his granddaughter, Sophea. After months of planning, their dream was finally realised (16) as they travelled to Kampong Thom, where he grew up. Entranced (17) by the beautiful fields and the distant clamour of roosters crowing, Sophea walked to the river where her grandfather had once spent hours fishing.\n\nThe duo trekked laboriously (18) up the hill, perspiration dotting their brows. They could see the vast countryside stretching before them from the summit. The view mirrored to a great extent (19) the stories Kiri had told her of his childhood — untouched, vivid, and full of quiet wonder. Kiri was confident that although time had passed, the bond he shared with Sophea would stand the test of time (20) with each cherished memory. This trip would be etched in their hearts and minds forever.", "category": "Precise Verbs"}, {"id": "prelim2025_taonan_eng_q17", "source": "Prelim 2025 TaoNan", "section": "Vocabulary Cloze", "qNum": 17, "sentence": "Kiri was on a trip to Cambodia with his granddaughter, Sophea. After months of planning, their dream was finally realised (16) as they travelled to Kampong Thom, where he grew up. Entranced (17) by the beautiful fields and the distant clamour of roosters crowing, Sophea walked to the river where her grandfather had once spent hours fishing.", "options": ["Gratified", "Energised", "Captivated", "Unaffected"], "answerIndex": 3, "answer": "Captivated", "option_explanations": [{"key": "A", "value": "Gratified", "Explanation": "Incorrect. 'Gratified' means pleased or satisfied, but doesn't capture the deep fascination shown."}, {"key": "B", "value": "Energised", "Explanation": "Incorrect. 'Energised' means given energy or vitality, not the emotional absorption shown by Sophea."}, {"key": "C", "value": "Captivated", "Explanation": "Correct. 'Captivated' means charmed or fascinated, matching 'Entranced' and the description of Sophea's absorption in the beautiful surroundings."}, {"key": "D", "value": "Unaffected", "Explanation": "Incorrect. 'Unaffected' means not influenced or unmoved, opposite to the fascination shown."}], "full_passage": "Kiri was on a trip to Cambodia with his granddaughter, Sophea. After months of planning, their dream was finally realised (16) as they travelled to Kampong Thom, where he grew up. Entranced (17) by the beautiful fields and the distant clamour of roosters crowing, Sophea walked to the river where her grandfather had once spent hours fishing.\n\nThe duo trekked laboriously (18) up the hill, perspiration dotting their brows. They could see the vast countryside stretching before them from the summit. The view mirrored to a great extent (19) the stories Kiri had told her of his childhood — untouched, vivid, and full of quiet wonder. Kiri was confident that although time had passed, the bond he shared with Sophea would stand the test of time (20) with each cherished memory. This trip would be etched in their hearts and minds forever.", "category": "Adjectives"}, {"id": "prelim2025_taonan_eng_q18", "source": "Prelim 2025 TaoNan", "section": "Vocabulary Cloze", "qNum": 18, "sentence": "The duo trekked laboriously (18) up the hill, perspiration dotting their brows. They could see the vast countryside stretching before them from the summit. The view mirrored to a great extent (19) the stories Kiri had told her of his childhood — untouched, vivid, and full of quiet wonder. Kiri was confident that although time had passed, the bond he shared with Sophea would stand the test of time (20) with each cherished memory. This trip would be etched in their hearts and minds forever.", "options": ["hastily", "tirelessly", "strenuously", "purposefully"], "answerIndex": 3, "answer": "strenuously", "option_explanations": [{"key": "A", "value": "hastily", "Explanation": "Incorrect. 'hastily' means quickly or hurriedly, not capturing the physical effort mentioned."}, {"key": "B", "value": "tirelessly", "Explanation": "Incorrect. 'tirelessly' means without getting tired, but the 'perspiration dotting their brows' suggests fatigue."}, {"key": "C", "value": "strenuously", "Explanation": "Correct. 'strenuously' means with great physical effort, matching 'laboriously' and the image of perspiration."}, {"key": "D", "value": "purposefully", "Explanation": "Incorrect. 'purposefully' means with determination or intent, not specifically about physical effort."}], "full_passage": "Kiri was on a trip to Cambodia with his granddaughter, Sophea. After months of planning, their dream was finally realised (16) as they travelled to Kampong Thom, where he grew up. Entranced (17) by the beautiful fields and the distant clamour of roosters crowing, Sophea walked to the river where her grandfather had once spent hours fishing.\n\nThe duo trekked laboriously (18) up the hill, perspiration dotting their brows. They could see the vast countryside stretching before them from the summit. The view mirrored to a great extent (19) the stories Kiri had told her of his childhood — untouched, vivid, and full of quiet wonder. Kiri was confident that although time had passed, the bond he shared with Sophea would stand the test of time (20) with each cherished memory. This trip would be etched in their hearts and minds forever.", "category": "Adverbs"}, {"id": "prelim2025_taonan_eng_q19", "source": "Prelim 2025 TaoNan", "section": "Vocabulary Cloze", "qNum": 19, "sentence": "The duo trekked laboriously (18) up the hill, perspiration dotting their brows. They could see the vast countryside stretching before them from the summit. The view mirrored to a great extent (19) the stories Kiri had told her of his childhood — untouched, vivid, and full of quiet wonder. Kiri was confident that although time had passed, the bond he shared with Sophea would stand the test of time (20) with each cherished memory. This trip would be etched in their hearts and minds forever.", "options": ["briefly", "visibly", "purely", "mainly"], "answerIndex": 4, "answer": "mainly", "option_explanations": [{"key": "A", "value": "briefly", "Explanation": "Incorrect. 'briefly' means for a short time, not about extent or degree."}, {"key": "B", "value": "visibly", "Explanation": "Incorrect. 'visibly' means noticeably or obviously, but doesn't capture 'to a great extent' meaning."}, {"key": "C", "value": "purely", "Explanation": "Incorrect. 'purely' means entirely or solely, too absolute for the comparison being made."}, {"key": "D", "value": "mainly", "Explanation": "Correct. 'mainly' means to a large degree or for the most part, closest to 'to a great extent'."}], "full_passage": "Kiri was on a trip to Cambodia with his granddaughter, Sophea. After months of planning, their dream was finally realised (16) as they travelled to Kampong Thom, where he grew up. Entranced (17) by the beautiful fields and the distant clamour of roosters crowing, Sophea walked to the river where her grandfather had once spent hours fishing.\n\nThe duo trekked laboriously (18) up the hill, perspiration dotting their brows. They could see the vast countryside stretching before them from the summit. The view mirrored to a great extent (19) the stories Kiri had told her of his childhood — untouched, vivid, and full of quiet wonder. Kiri was confident that although time had passed, the bond he shared with Sophea would stand the test of time (20) with each cherished memory. This trip would be etched in their hearts and minds forever.", "category": "Adverbs"}, {"id": "prelim2025_taonan_eng_q20", "source": "Prelim 2025 TaoNan", "section": "Vocabulary Cloze", "qNum": 20, "sentence": "The duo trekked laboriously (18) up the hill, perspiration dotting their brows. They could see the vast countryside stretching before them from the summit. The view mirrored to a great extent (19) the stories Kiri had told her of his childhood — untouched, vivid, and full of quiet wonder. Kiri was confident that although time had passed, the bond he shared with Sophea would stand the test of time (20) with each cherished memory. This trip would be etched in their hearts and minds forever.", "options": ["last", "endure", "sustain", "deepen"], "answerIndex": 1, "answer": "last", "option_explanations": [{"key": "A", "value": "last", "Explanation": "Correct. 'last' means to continue to exist or persist over time, matching 'stand the test of time'."}, {"key": "B", "value": "endure", "Explanation": "Incorrect. While 'endure' can mean persist, it also carries meaning of suffering through, which is less fitting."}, {"key": "C", "value": "sustain", "Explanation": "Incorrect. 'sustain' means to maintain or support, not specifically about lasting through time."}, {"key": "D", "value": "deepen", "Explanation": "Incorrect. 'deepen' means to become more intense or profound, not the meaning of 'stand the test of time'."}], "full_passage": "Kiri was on a trip to Cambodia with his granddaughter, Sophea. After months of planning, their dream was finally realised (16) as they travelled to Kampong Thom, where he grew up. Entranced (17) by the beautiful fields and the distant clamour of roosters crowing, Sophea walked to the river where her grandfather had once spent hours fishing.\n\nThe duo trekked laboriously (18) up the hill, perspiration dotting their brows. They could see the vast countryside stretching before them from the summit. The view mirrored to a great extent (19) the stories Kiri had told her of his childhood — untouched, vivid, and full of quiet wonder. Kiri was confident that although time had passed, the bond he shared with Sophea would stand the test of time (20) with each cherished memory. This trip would be etched in their hearts and minds forever.", "category": "Precise Verbs"}, {"id": "psle2015_eng_q11", "source": "PSLE 2015 English", "section": "Vocabulary MCQ", "qNum": 11, "sentence": "Hamid realised something was ____________ when he saw two suspicious-looking persons loitering along the corridor.", "options": ["amiss", "astray", "incorrect", "inappropriate"], "answerIndex": 1, "answer": "amiss", "option_explanations": [{"key": "A", "value": "amiss", "Explanation": "Correct. 'Amiss' means wrong or not quite right. 'Something was amiss' is a common collocation meaning something was wrong or out of place."}, {"key": "B", "value": "astray", "Explanation": "'Astray' means away from the correct path or direction (e.g., go astray). It does not fit the pattern 'something was ___'."}, {"key": "C", "value": "incorrect", "Explanation": "'Incorrect' means not correct or right, but 'something was incorrect' would need a specific thing to be wrong, not a general sense of unease."}, {"key": "D", "value": "inappropriate", "Explanation": "'Inappropriate' means not suitable or proper. It doesn't convey the sense of something being wrong or suspicious."}], "category": "Adjectives"}, {"id": "psle2015_eng_q12", "source": "PSLE 2015 English", "section": "Vocabulary MCQ", "qNum": 12, "sentence": "The king's birthday party was not ____________ because he wished to save money for the country.", "options": ["abundant", "modest", "scanty", "lavish"], "answerIndex": 4, "answer": "lavish", "option_explanations": [{"key": "A", "value": "abundant", "Explanation": "'Abundant' means plentiful in quantity. It describes amounts, not events or celebrations."}, {"key": "B", "value": "modest", "Explanation": "'Modest' means moderate or humble. The sentence says 'was not ___' to contrast with saving money, so 'not modest' would mean it was extravagant — the opposite of the intended meaning."}, {"key": "C", "value": "scanty", "Explanation": "'Scanty' means insufficient or meagre. 'Not scanty' would mean the party was sufficient, which doesn't relate to saving money."}, {"key": "D", "value": "lavish", "Explanation": "Correct. 'Lavish' means luxurious and extravagant. 'Not lavish' means the party was simple and not extravagant, which fits the reason of saving money."}], "category": "Adjectives"}, {"id": "psle2015_eng_q13", "source": "PSLE 2015 English", "section": "Vocabulary MCQ", "qNum": 13, "sentence": "The pupils are to obey the new school rules which will be ____________ the next day.", "options": ["started", "conducted", "discharged", "implemented"], "answerIndex": 4, "answer": "implemented", "option_explanations": [{"key": "A", "value": "started", "Explanation": "'Started' means to begin. While rules can 'start', the more precise word for putting rules into effect is 'implemented'."}, {"key": "B", "value": "conducted", "Explanation": "'Conducted' means to carry out or organise (e.g., conduct an experiment). Rules are not 'conducted'."}, {"key": "C", "value": "discharged", "Explanation": "'Discharged' means to release or dismiss (e.g., discharged from hospital). It is not used with rules."}, {"key": "D", "value": "implemented", "Explanation": "Correct. 'Implemented' means to put into effect or carry out. Rules, policies, and plans are 'implemented'."}], "category": "Precise Verbs"}, {"id": "psle2015_eng_q14", "source": "PSLE 2015 English", "section": "Vocabulary MCQ", "qNum": 14, "sentence": "After ____________ gluing together the broken pieces of the toy, Jim was tired out.", "options": ["warily", "vigilantly", "consciously", "painstakingly"], "answerIndex": 4, "answer": "painstakingly", "option_explanations": [{"key": "A", "value": "warily", "Explanation": "'Warily' means in a cautious or careful manner due to potential danger. It doesn't fit the context of careful repair work."}, {"key": "B", "value": "vigilantly", "Explanation": "'Vigilantly' means in a watchful and alert manner, usually for danger. It doesn't describe the careful, laborious nature of the task."}, {"key": "C", "value": "consciously", "Explanation": "'Consciously' means in a deliberate or aware manner. It doesn't convey the effort and fatigue involved in the task."}, {"key": "D", "value": "painstakingly", "Explanation": "Correct. 'Painstakingly' means with great care and effort. Jim was tired because the gluing required a lot of detailed, careful work."}], "category": "Adverbs"}, {"id": "psle2015_eng_q15", "source": "PSLE 2015 English", "section": "Vocabulary MCQ", "qNum": 15, "sentence": "Jeremy ____________ with his sister over a misunderstanding but they made up after he apologised.", "options": ["fell through", "fell apart", "fell out", "fell in"], "answerIndex": 3, "answer": "fell out", "option_explanations": [{"key": "A", "value": "fell through", "Explanation": "'Fell through' means a plan or arrangement failed to happen (e.g., the deal fell through). It is not used for quarrels between people."}, {"key": "B", "value": "fell apart", "Explanation": "'Fell apart' means to break into pieces or to collapse. It is not used to describe a disagreement between people."}, {"key": "C", "value": "fell out", "Explanation": "Correct. 'Fell out with' means to have a quarrel or disagreement with someone. Jeremy quarrelled with his sister but they reconciled."}, {"key": "D", "value": "fell in", "Explanation": "'Fell in' means to collapse inward or to line up in formation. It does not mean to quarrel."}], "category": "Phrasal Verbs"}, {"id": "psle2015_eng_q16", "source": "PSLE 2015 English", "section": "Vocabulary Cloze", "qNum": 16, "passage": "The pupils of Cranberry Primary School craned their necks to get a good view of the trophy on the stage. The annual Courtesy Award would be given out in a little while(16). Due to the school's emphasis on character development, the award was regarded(17) as the most prestigious prize a pupil could win. Finally, the announcement was made. As Gary Goh made his way to the stage to receive(18) the trophy, the pupils clapped enthusiastically. Everyone agreed that Gary was deserving(19) of the award. He was polite to all, including the security guards and canteen staff. He was also very humble, often brushing aside(20) any praise from his teachers by saying that he was only doing what he had been taught to do. He attributed his behaviour to the good example set by his parents.", "sentence": "The annual Courtesy Award would be given out in a little while.", "targetWord": "in a little while", "options": ["punctually", "instantly", "shortly", "briefly"], "answerIndex": 3, "answer": "shortly", "option_explanations": [{"key": "A", "value": "punctually", "Explanation": "'Punctually' means exactly on time. 'In a little while' refers to a short period of time, not punctuality."}, {"key": "B", "value": "instantly", "Explanation": "'Instantly' means immediately, without any delay. 'In a little while' implies a short wait, not immediate action."}, {"key": "C", "value": "shortly", "Explanation": "Correct. 'Shortly' means in a short time or soon. 'In a little while' means within a short period of time."}, {"key": "D", "value": "briefly", "Explanation": "'Briefly' means for a short duration. It describes how long something lasts, not when it will happen."}], "full_passage": "The pupils of Cranberry Primary School craned their necks to get a good view of the trophy on the stage. The annual Courtesy Award would be given out in a little while(16). Due to the school's emphasis on character development, the award was regarded(17) as the most prestigious prize a pupil could win. Finally, the announcement was made. As Gary Goh made his way to the stage to receive(18) the trophy, the pupils clapped enthusiastically. Everyone agreed that Gary was deserving(19) of the award. He was polite to all, including the security guards and canteen staff. He was also very humble, often brushing aside(20) any praise from his teachers by saying that he was only doing what he had been taught to do. He attributed his behaviour to the good example set by his parents.", "category": "Adverbs"}, {"id": "psle2015_eng_q17", "source": "PSLE 2015 English", "section": "Vocabulary Cloze", "qNum": 17, "passage": "The pupils of Cranberry Primary School craned their necks to get a good view of the trophy on the stage. The annual Courtesy Award would be given out in a little while(16). Due to the school's emphasis on character development, the award was regarded(17) as the most prestigious prize a pupil could win. Finally, the announcement was made. As Gary Goh made his way to the stage to receive(18) the trophy, the pupils clapped enthusiastically. Everyone agreed that Gary was deserving(19) of the award. He was polite to all, including the security guards and canteen staff. He was also very humble, often brushing aside(20) any praise from his teachers by saying that he was only doing what he had been taught to do. He attributed his behaviour to the good example set by his parents.", "sentence": "The award was regarded as the most prestigious prize a pupil could win.", "targetWord": "regarded", "options": ["viewed", "favoured", "observed", "approved"], "answerIndex": 1, "answer": "viewed", "option_explanations": [{"key": "A", "value": "viewed", "Explanation": "Correct. 'Viewed' means considered or seen as. 'Regarded as' and 'viewed as' have the same meaning — to consider something in a particular way."}, {"key": "B", "value": "favoured", "Explanation": "'Favoured' means preferred or supported. It doesn't mean to consider or think of something in a certain way."}, {"key": "C", "value": "observed", "Explanation": "'Observed' means to watch carefully or to notice. It doesn't convey the meaning of considering something as something."}, {"key": "D", "value": "approved", "Explanation": "'Approved' means to officially agree to or accept. It doesn't mean to consider or think of."}], "full_passage": "The pupils of Cranberry Primary School craned their necks to get a good view of the trophy on the stage. The annual Courtesy Award would be given out in a little while(16). Due to the school's emphasis on character development, the award was regarded(17) as the most prestigious prize a pupil could win. Finally, the announcement was made. As Gary Goh made his way to the stage to receive(18) the trophy, the pupils clapped enthusiastically. Everyone agreed that Gary was deserving(19) of the award. He was polite to all, including the security guards and canteen staff. He was also very humble, often brushing aside(20) any praise from his teachers by saying that he was only doing what he had been taught to do. He attributed his behaviour to the good example set by his parents.", "category": "Precise Verbs"}, {"id": "psle2015_eng_q18", "source": "PSLE 2015 English", "section": "Vocabulary Cloze", "qNum": 18, "passage": "The pupils of Cranberry Primary School craned their necks to get a good view of the trophy on the stage. The annual Courtesy Award would be given out in a little while(16). Due to the school's emphasis on character development, the award was regarded(17) as the most prestigious prize a pupil could win. Finally, the announcement was made. As Gary Goh made his way to the stage to receive(18) the trophy, the pupils clapped enthusiastically. Everyone agreed that Gary was deserving(19) of the award. He was polite to all, including the security guards and canteen staff. He was also very humble, often brushing aside(20) any praise from his teachers by saying that he was only doing what he had been taught to do. He attributed his behaviour to the good example set by his parents.", "sentence": "As Gary Goh made his way to the stage to receive the trophy, the pupils clapped enthusiastically.", "targetWord": "receive", "options": ["redeem", "secure", "accept", "obtain"], "answerIndex": 3, "answer": "accept", "option_explanations": [{"key": "A", "value": "redeem", "Explanation": "'Redeem' means to exchange for something or to recover. It is not a synonym for 'receive' in the context of collecting a prize."}, {"key": "B", "value": "secure", "Explanation": "'Secure' means to obtain with effort or to make safe. While one can 'secure' a win, it doesn't match the simple act of receiving a trophy."}, {"key": "C", "value": "accept", "Explanation": "Correct. 'Accept' means to receive willingly or to take something offered. 'Receive' and 'accept' are closest in meaning here — Gary accepted the trophy on stage."}, {"key": "D", "value": "obtain", "Explanation": "'Obtain' means to get or acquire, often through effort. 'Receive' implies being given something, which 'accept' captures better than 'obtain'."}], "full_passage": "The pupils of Cranberry Primary School craned their necks to get a good view of the trophy on the stage. The annual Courtesy Award would be given out in a little while(16). Due to the school's emphasis on character development, the award was regarded(17) as the most prestigious prize a pupil could win. Finally, the announcement was made. As Gary Goh made his way to the stage to receive(18) the trophy, the pupils clapped enthusiastically. Everyone agreed that Gary was deserving(19) of the award. He was polite to all, including the security guards and canteen staff. He was also very humble, often brushing aside(20) any praise from his teachers by saying that he was only doing what he had been taught to do. He attributed his behaviour to the good example set by his parents.", "category": "Precise Verbs"}, {"id": "psle2015_eng_q19", "source": "PSLE 2015 English", "section": "Vocabulary Cloze", "qNum": 19, "passage": "The pupils of Cranberry Primary School craned their necks to get a good view of the trophy on the stage. The annual Courtesy Award would be given out in a little while(16). Due to the school's emphasis on character development, the award was regarded(17) as the most prestigious prize a pupil could win. Finally, the announcement was made. As Gary Goh made his way to the stage to receive(18) the trophy, the pupils clapped enthusiastically. Everyone agreed that Gary was deserving(19) of the award. He was polite to all, including the security guards and canteen staff. He was also very humble, often brushing aside(20) any praise from his teachers by saying that he was only doing what he had been taught to do. He attributed his behaviour to the good example set by his parents.", "sentence": "Everyone agreed that Gary was deserving of the award.", "targetWord": "deserving", "options": ["proud", "worthy", "needful", "appreciative"], "answerIndex": 2, "answer": "worthy", "option_explanations": [{"key": "A", "value": "proud", "Explanation": "'Proud' means feeling pleasure or satisfaction. 'Proud of' is different from 'deserving of' — one can be proud without being deserving."}, {"key": "B", "value": "worthy", "Explanation": "Correct. 'Worthy of' means deserving of. Both words indicate that someone merits or has earned something."}, {"key": "C", "value": "needful", "Explanation": "'Needful' means necessary or needed. It doesn't mean deserving."}, {"key": "D", "value": "appreciative", "Explanation": "'Appreciative' means feeling or showing gratitude. Being grateful is different from being deserving."}], "full_passage": "The pupils of Cranberry Primary School craned their necks to get a good view of the trophy on the stage. The annual Courtesy Award would be given out in a little while(16). Due to the school's emphasis on character development, the award was regarded(17) as the most prestigious prize a pupil could win. Finally, the announcement was made. As Gary Goh made his way to the stage to receive(18) the trophy, the pupils clapped enthusiastically. Everyone agreed that Gary was deserving(19) of the award. He was polite to all, including the security guards and canteen staff. He was also very humble, often brushing aside(20) any praise from his teachers by saying that he was only doing what he had been taught to do. He attributed his behaviour to the good example set by his parents.", "category": "Adjectives"}, {"id": "psle2015_eng_q20", "source": "PSLE 2015 English", "section": "Vocabulary Cloze", "qNum": 20, "passage": "The pupils of Cranberry Primary School craned their necks to get a good view of the trophy on the stage. The annual Courtesy Award would be given out in a little while(16). Due to the school's emphasis on character development, the award was regarded(17) as the most prestigious prize a pupil could win. Finally, the announcement was made. As Gary Goh made his way to the stage to receive(18) the trophy, the pupils clapped enthusiastically. Everyone agreed that Gary was deserving(19) of the award. He was polite to all, including the security guards and canteen staff. He was also very humble, often brushing aside(20) any praise from his teachers by saying that he was only doing what he had been taught to do. He attributed his behaviour to the good example set by his parents.", "sentence": "He was also very humble, often brushing aside any praise from his teachers.", "targetWord": "brushing aside", "options": ["dismissing", "removing", "repelling", "denying"], "answerIndex": 1, "answer": "dismissing", "option_explanations": [{"key": "A", "value": "dismissing", "Explanation": "Correct. 'Dismissing' means to treat as unworthy of consideration. 'Brushing aside' praise means dismissing it or not taking it seriously."}, {"key": "B", "value": "removing", "Explanation": "'Removing' means to take away physically. You don't 'remove' praise — you dismiss or deflect it."}, {"key": "C", "value": "repelling", "Explanation": "'Repelling' means to drive away or push back forcefully. It is too strong for the gentle act of deflecting praise."}, {"key": "D", "value": "denying", "Explanation": "'Denying' means to refuse to acknowledge. While close, 'brushing aside' is about not giving importance to something, not outright denying it."}], "full_passage": "The pupils of Cranberry Primary School craned their necks to get a good view of the trophy on the stage. The annual Courtesy Award would be given out in a little while(16). Due to the school's emphasis on character development, the award was regarded(17) as the most prestigious prize a pupil could win. Finally, the announcement was made. As Gary Goh made his way to the stage to receive(18) the trophy, the pupils clapped enthusiastically. Everyone agreed that Gary was deserving(19) of the award. He was polite to all, including the security guards and canteen staff. He was also very humble, often brushing aside(20) any praise from his teachers by saying that he was only doing what he had been taught to do. He attributed his behaviour to the good example set by his parents.", "category": "Precise Verbs"}, {"id": "psle2016_eng_q11", "source": "PSLE 2016 English", "section": "Vocabulary MCQ", "qNum": 11, "sentence": "Granny Wong's top ____________ is to look after her grandchildren well because she loves them dearly.", "options": ["priority", "urgency", "importance", "requirement"], "answerIndex": 1, "answer": "priority", "option_explanations": [{"key": "A", "value": "priority", "Explanation": "Correct. 'Priority' means something that is regarded as more important than others. 'Top priority' is a common collocation meaning the most important thing."}, {"key": "B", "value": "urgency", "Explanation": "'Urgency' means the quality of requiring immediate action. 'Top urgency' is not a natural collocation."}, {"key": "C", "value": "importance", "Explanation": "'Importance' means the state of being important. While similar in meaning, 'top importance' is not as natural a collocation as 'top priority'."}, {"key": "D", "value": "requirement", "Explanation": "'Requirement' means something that is needed or demanded. 'Top requirement' is not a standard expression."}], "category": "Nouns"}, {"id": "psle2016_eng_q12", "source": "PSLE 2016 English", "section": "Vocabulary MCQ", "qNum": 12, "sentence": "The response to the charity event was ____________, with many people turning up to support it.", "options": ["excessive", "extravagant", "overpowering", "overwhelming"], "answerIndex": 4, "answer": "overwhelming", "option_explanations": [{"key": "A", "value": "excessive", "Explanation": "'Excessive' means more than necessary or normal, often with a negative connotation. The sentence has a positive tone about the large response."}, {"key": "B", "value": "extravagant", "Explanation": "'Extravagant' means spending or costing too much, or excessively elaborate. It doesn't describe a large response or turnout."}, {"key": "C", "value": "overpowering", "Explanation": "'Overpowering' means too strong or intense, often referring to smells or feelings. It doesn't naturally describe a response to an event."}, {"key": "D", "value": "overwhelming", "Explanation": "Correct. 'Overwhelming' means very great in amount or degree. An 'overwhelming response' means a very large and impressive response, fitting the context of many people showing support."}], "category": "Adjectives"}, {"id": "psle2016_eng_q13", "source": "PSLE 2016 English", "section": "Vocabulary MCQ", "qNum": 13, "sentence": "\"I rarely see Charles so ____________. He's usually in a happy mood,\" Gopal observed.", "options": ["jovial", "obstinate", "optimistic", "downcast"], "answerIndex": 4, "answer": "downcast", "option_explanations": [{"key": "A", "value": "jovial", "Explanation": "'Jovial' means cheerful and friendly. Since Charles is 'usually in a happy mood', seeing him jovial would not be rare."}, {"key": "B", "value": "obstinate", "Explanation": "'Obstinate' means stubbornly refusing to change. It describes behaviour, not a mood that contrasts with being happy."}, {"key": "C", "value": "optimistic", "Explanation": "'Optimistic' means hopeful about the future. This is similar to being happy, not a contrast to it."}, {"key": "D", "value": "downcast", "Explanation": "Correct. 'Downcast' means feeling sad or dejected. Since Charles is usually happy, seeing him downcast (unhappy) would be rare."}], "category": "Adjectives"}, {"id": "psle2016_eng_q14", "source": "PSLE 2016 English", "section": "Vocabulary MCQ", "qNum": 14, "sentence": "The soldiers ____________ the enemy and won the battle.", "options": ["subdued", "impeded", "hindered", "suppressed"], "answerIndex": 1, "answer": "subdued", "option_explanations": [{"key": "A", "value": "subdued", "Explanation": "Correct. 'Subdued' means to overcome, bring under control, or defeat. The soldiers subdued (defeated) the enemy and won the battle."}, {"key": "B", "value": "impeded", "Explanation": "'Impeded' means to delay or prevent by obstructing. It means to slow down, not to defeat."}, {"key": "C", "value": "hindered", "Explanation": "'Hindered' means to make it difficult for something to happen. Like 'impeded', it means to obstruct, not to overcome or defeat."}, {"key": "D", "value": "suppressed", "Explanation": "'Suppressed' means to forcibly put an end to or to restrain. While close, 'subdued' is more appropriate for defeating an enemy in battle."}], "category": "Adjectives"}, {"id": "psle2016_eng_q15", "source": "PSLE 2016 English", "section": "Vocabulary MCQ", "qNum": 15, "sentence": "The heavy rain did not ____________ even after two hours.", "options": ["let up", "let off", "let out", "let down"], "answerIndex": 1, "answer": "let up", "option_explanations": [{"key": "A", "value": "let up", "Explanation": "Correct. 'Let up' means to become less strong or intense. The rain did not let up means it continued raining heavily without stopping or easing."}, {"key": "B", "value": "let off", "Explanation": "'Let off' means to excuse from punishment or to release (e.g., let off fireworks). It is not used for weather."}, {"key": "C", "value": "let out", "Explanation": "'Let out' means to release or to allow to leave (e.g., let out a scream, let out of school). It is not used for rain."}, {"key": "D", "value": "let down", "Explanation": "'Let down' means to disappoint or to lower something. It is not used to describe rain stopping."}], "category": "Phrasal Verbs"}, {"id": "psle2016_eng_q16", "source": "PSLE 2016 English", "section": "Vocabulary Cloze", "qNum": 16, "passage": "One day, Cindy's father brought home a plant. It had so many white flowers that most of the leaves were covered up(16). Cindy loved the fragrant scent of the flowers. Noticing that every day some flowers would fall from the plant, she became worried and anxious(17). Looking closely at the plant, Cindy saw that it was growing in a pot of filthy soil. \"How unhygienic! No wonder the plant is ill!\" she thought in alarm. She was determined(18) to save the plant from its unhealthy environment. Cindy gingerly(19) pulled out the plant, making sure she did not injure it. Then, she washed its roots before placing it in a clean pot filled with pebbles. To her surprise, the plant failed to thrive(20). Almost all the flowers fell and the leaves looked wilted. Realising her mistake, she quickly restored the plant to its original environment.", "sentence": "It had so many white flowers that most of the leaves were covered up.", "targetWord": "covered up", "options": ["protected", "disguised", "concealed", "camouflaged"], "answerIndex": 3, "answer": "concealed", "option_explanations": [{"key": "A", "value": "protected", "Explanation": "'Protected' means to keep safe from harm. The flowers weren't keeping the leaves safe; they were hiding them from view."}, {"key": "B", "value": "disguised", "Explanation": "'Disguised' means to change appearance to prevent recognition. The leaves weren't made to look like something else."}, {"key": "C", "value": "concealed", "Explanation": "Correct. 'Concealed' means hidden from sight. The flowers covered up (concealed) the leaves, making them hard to see."}, {"key": "D", "value": "camouflaged", "Explanation": "'Camouflaged' means to hide by blending with surroundings. It implies blending in, not simply being covered over."}], "full_passage": "One day, Cindy's father brought home a plant. It had so many white flowers that most of the leaves were covered up(16). Cindy loved the fragrant scent of the flowers. Noticing that every day some flowers would fall from the plant, she became worried and anxious(17). Looking closely at the plant, Cindy saw that it was growing in a pot of filthy soil. \"How unhygienic! No wonder the plant is ill!\" she thought in alarm. She was determined(18) to save the plant from its unhealthy environment. Cindy gingerly(19) pulled out the plant, making sure she did not injure it. Then, she washed its roots before placing it in a clean pot filled with pebbles. To her surprise, the plant failed to thrive(20). Almost all the flowers fell and the leaves looked wilted. Realising her mistake, she quickly restored the plant to its original environment.", "category": "Precise Verbs"}, {"id": "psle2016_eng_q17", "source": "PSLE 2016 English", "section": "Vocabulary Cloze", "qNum": 17, "passage": "One day, Cindy's father brought home a plant. It had so many white flowers that most of the leaves were covered up(16). Cindy loved the fragrant scent of the flowers. Noticing that every day some flowers would fall from the plant, she became worried and anxious(17). Looking closely at the plant, Cindy saw that it was growing in a pot of filthy soil. \"How unhygienic! No wonder the plant is ill!\" she thought in alarm. She was determined(18) to save the plant from its unhealthy environment. Cindy gingerly(19) pulled out the plant, making sure she did not injure it. Then, she washed its roots before placing it in a clean pot filled with pebbles. To her surprise, the plant failed to thrive(20). Almost all the flowers fell and the leaves looked wilted. Realising her mistake, she quickly restored the plant to its original environment.", "sentence": "She became worried and anxious.", "targetWord": "worried and anxious", "options": ["troubled", "annoyed", "sorrowful", "discouraged"], "answerIndex": 1, "answer": "troubled", "option_explanations": [{"key": "A", "value": "troubled", "Explanation": "Correct. 'Troubled' means worried or anxious. It captures the combined meaning of being both worried and anxious about the plant."}, {"key": "B", "value": "annoyed", "Explanation": "'Annoyed' means slightly angry or irritated. Cindy was concerned about the plant's health, not irritated."}, {"key": "C", "value": "sorrowful", "Explanation": "'Sorrowful' means feeling or showing deep sadness. The passage describes worry and concern, not deep sadness."}, {"key": "D", "value": "discouraged", "Explanation": "'Discouraged' means having lost confidence or enthusiasm. Cindy was worried but still determined to help the plant."}], "full_passage": "One day, Cindy's father brought home a plant. It had so many white flowers that most of the leaves were covered up(16). Cindy loved the fragrant scent of the flowers. Noticing that every day some flowers would fall from the plant, she became worried and anxious(17). Looking closely at the plant, Cindy saw that it was growing in a pot of filthy soil. \"How unhygienic! No wonder the plant is ill!\" she thought in alarm. She was determined(18) to save the plant from its unhealthy environment. Cindy gingerly(19) pulled out the plant, making sure she did not injure it. Then, she washed its roots before placing it in a clean pot filled with pebbles. To her surprise, the plant failed to thrive(20). Almost all the flowers fell and the leaves looked wilted. Realising her mistake, she quickly restored the plant to its original environment.", "category": "Adjectives"}, {"id": "psle2016_eng_q18", "source": "PSLE 2016 English", "section": "Vocabulary Cloze", "qNum": 18, "passage": "One day, Cindy's father brought home a plant. It had so many white flowers that most of the leaves were covered up(16). Cindy loved the fragrant scent of the flowers. Noticing that every day some flowers would fall from the plant, she became worried and anxious(17). Looking closely at the plant, Cindy saw that it was growing in a pot of filthy soil. \"How unhygienic! No wonder the plant is ill!\" she thought in alarm. She was determined(18) to save the plant from its unhealthy environment. Cindy gingerly(19) pulled out the plant, making sure she did not injure it. Then, she washed its roots before placing it in a clean pot filled with pebbles. To her surprise, the plant failed to thrive(20). Almost all the flowers fell and the leaves looked wilted. Realising her mistake, she quickly restored the plant to its original environment.", "sentence": "She was determined to save the plant from its unhealthy environment.", "targetWord": "was determined", "options": ["chose", "aspired", "decided", "resolved"], "answerIndex": 4, "answer": "resolved", "option_explanations": [{"key": "A", "value": "chose", "Explanation": "'Chose' means to select from options. 'Was determined' conveys a stronger sense of firm commitment than simply choosing."}, {"key": "B", "value": "aspired", "Explanation": "'Aspired' means to have a strong desire or ambition. It usually refers to long-term goals, not immediate actions."}, {"key": "C", "value": "decided", "Explanation": "'Decided' means to make a choice. While close, 'resolved' better captures the firmness and determination implied by 'was determined'."}, {"key": "D", "value": "resolved", "Explanation": "Correct. 'Resolved' means to decide firmly. 'Was determined to' and 'resolved to' both convey a strong, firm decision to do something."}], "full_passage": "One day, Cindy's father brought home a plant. It had so many white flowers that most of the leaves were covered up(16). Cindy loved the fragrant scent of the flowers. Noticing that every day some flowers would fall from the plant, she became worried and anxious(17). Looking closely at the plant, Cindy saw that it was growing in a pot of filthy soil. \"How unhygienic! No wonder the plant is ill!\" she thought in alarm. She was determined(18) to save the plant from its unhealthy environment. Cindy gingerly(19) pulled out the plant, making sure she did not injure it. Then, she washed its roots before placing it in a clean pot filled with pebbles. To her surprise, the plant failed to thrive(20). Almost all the flowers fell and the leaves looked wilted. Realising her mistake, she quickly restored the plant to its original environment.", "category": "Precise Verbs"}, {"id": "psle2016_eng_q19", "source": "PSLE 2016 English", "section": "Vocabulary Cloze", "qNum": 19, "passage": "One day, Cindy's father brought home a plant. It had so many white flowers that most of the leaves were covered up(16). Cindy loved the fragrant scent of the flowers. Noticing that every day some flowers would fall from the plant, she became worried and anxious(17). Looking closely at the plant, Cindy saw that it was growing in a pot of filthy soil. \"How unhygienic! No wonder the plant is ill!\" she thought in alarm. She was determined(18) to save the plant from its unhealthy environment. Cindy gingerly(19) pulled out the plant, making sure she did not injure it. Then, she washed its roots before placing it in a clean pot filled with pebbles. To her surprise, the plant failed to thrive(20). Almost all the flowers fell and the leaves looked wilted. Realising her mistake, she quickly restored the plant to its original environment.", "sentence": "Cindy gingerly pulled out the plant, making sure she did not injure it.", "targetWord": "gingerly", "options": ["thoughtfully", "cautiously", "gradually", "seriously"], "answerIndex": 2, "answer": "cautiously", "option_explanations": [{"key": "A", "value": "thoughtfully", "Explanation": "'Thoughtfully' means in a considerate or reflective manner. 'Gingerly' specifically refers to careful, cautious physical movement."}, {"key": "B", "value": "cautiously", "Explanation": "Correct. 'Cautiously' means in a careful way to avoid problems. 'Gingerly' means in a careful or cautious manner, especially to avoid causing harm."}, {"key": "C", "value": "gradually", "Explanation": "'Gradually' means slowly over time. 'Gingerly' is about being careful and delicate, not about speed."}, {"key": "D", "value": "seriously", "Explanation": "'Seriously' means in a solemn or earnest manner. It doesn't describe careful physical handling."}], "full_passage": "One day, Cindy's father brought home a plant. It had so many white flowers that most of the leaves were covered up(16). Cindy loved the fragrant scent of the flowers. Noticing that every day some flowers would fall from the plant, she became worried and anxious(17). Looking closely at the plant, Cindy saw that it was growing in a pot of filthy soil. \"How unhygienic! No wonder the plant is ill!\" she thought in alarm. She was determined(18) to save the plant from its unhealthy environment. Cindy gingerly(19) pulled out the plant, making sure she did not injure it. Then, she washed its roots before placing it in a clean pot filled with pebbles. To her surprise, the plant failed to thrive(20). Almost all the flowers fell and the leaves looked wilted. Realising her mistake, she quickly restored the plant to its original environment.", "category": "Adverbs"}, {"id": "psle2016_eng_q20", "source": "PSLE 2016 English", "section": "Vocabulary Cloze", "qNum": 20, "passage": "One day, Cindy's father brought home a plant. It had so many white flowers that most of the leaves were covered up(16). Cindy loved the fragrant scent of the flowers. Noticing that every day some flowers would fall from the plant, she became worried and anxious(17). Looking closely at the plant, Cindy saw that it was growing in a pot of filthy soil. \"How unhygienic! No wonder the plant is ill!\" she thought in alarm. She was determined(18) to save the plant from its unhealthy environment. Cindy gingerly(19) pulled out the plant, making sure she did not injure it. Then, she washed its roots before placing it in a clean pot filled with pebbles. To her surprise, the plant failed to thrive(20). Almost all the flowers fell and the leaves looked wilted. Realising her mistake, she quickly restored the plant to its original environment.", "sentence": "To her surprise, the plant failed to thrive.", "targetWord": "thrive", "options": ["succeed", "develop", "flourish", "bloom"], "answerIndex": 3, "answer": "flourish", "option_explanations": [{"key": "A", "value": "succeed", "Explanation": "'Succeed' means to achieve a goal. 'Thrive' specifically means to grow or develop well, especially for plants."}, {"key": "B", "value": "develop", "Explanation": "'Develop' means to grow or change over time. It is too general and doesn't capture the healthy, vigorous growth implied by 'thrive'."}, {"key": "C", "value": "flourish", "Explanation": "Correct. 'Flourish' means to grow or develop in a healthy way. Both 'thrive' and 'flourish' describe prosperous, healthy growth."}, {"key": "D", "value": "bloom", "Explanation": "'Bloom' specifically means to produce flowers. 'Thrive' is broader, referring to overall healthy growth, not just flowering."}], "full_passage": "One day, Cindy's father brought home a plant. It had so many white flowers that most of the leaves were covered up(16). Cindy loved the fragrant scent of the flowers. Noticing that every day some flowers would fall from the plant, she became worried and anxious(17). Looking closely at the plant, Cindy saw that it was growing in a pot of filthy soil. \"How unhygienic! No wonder the plant is ill!\" she thought in alarm. She was determined(18) to save the plant from its unhealthy environment. Cindy gingerly(19) pulled out the plant, making sure she did not injure it. Then, she washed its roots before placing it in a clean pot filled with pebbles. To her surprise, the plant failed to thrive(20). Almost all the flowers fell and the leaves looked wilted. Realising her mistake, she quickly restored the plant to its original environment.", "category": "Precise Verbs"}, {"id": "psle2025_eng_q11", "source": "PSLE 2025 English", "section": "Vocabulary MCQ", "qNum": 11, "sentence": "The soccer fans were disappointed to see a ____________ drop in the fitness level of their favourite player due to his injury.", "options": ["hefty", "drastic", "vigorous", "desperate"], "answerIndex": 2, "answer": "drastic", "option_explanations": [{"key": "A", "value": "hefty", "Explanation": "'Hefty' means large and heavy, often used for amounts or prices. While it can describe a 'hefty sum', 'drastic drop' is the more natural collocation."}, {"key": "B", "value": "drastic", "Explanation": "Correct. 'Drastic' means extreme in effect or action. A 'drastic drop' means a severe, significant decline in fitness."}, {"key": "C", "value": "vigorous", "Explanation": "'Vigorous' means strong, healthy, and full of energy. It has a positive meaning and doesn't describe a decline."}, {"key": "D", "value": "desperate", "Explanation": "'Desperate' means feeling hopeless or extremely urgent. It describes a state of mind, not the degree of a drop."}], "category": "Adjectives"}, {"id": "psle2025_eng_q12", "source": "PSLE 2025 English", "section": "Vocabulary MCQ", "qNum": 12, "sentence": "As I was late for school, I hurriedly ____________ a note for my mother before I left the house.", "options": ["scripted", "sketched", "scribbled", "summarised"], "answerIndex": 3, "answer": "scribbled", "option_explanations": [{"key": "A", "value": "scripted", "Explanation": "'Scripted' means written as a script or planned in advance. It implies careful preparation, which contradicts the hurried situation."}, {"key": "B", "value": "sketched", "Explanation": "'Sketched' means to draw roughly. While it can mean to outline briefly, it is more associated with drawing than writing."}, {"key": "C", "value": "scribbled", "Explanation": "Correct. 'Scribbled' means to write something quickly and carelessly. It fits the hurried context perfectly — writing a quick note before rushing to school."}, {"key": "D", "value": "summarised", "Explanation": "'Summarised' means to give a brief account. It implies condensing information, not writing in a hurry."}], "category": "Precise Verbs"}, {"id": "psle2025_eng_q13", "source": "PSLE 2025 English", "section": "Vocabulary MCQ", "qNum": 13, "sentence": "Despite being ____________ by a toothache, my sister refused to see a dentist until it became unbearable.", "options": ["plagued", "provoked", "penalised", "pressured"], "answerIndex": 1, "answer": "plagued", "option_explanations": [{"key": "A", "value": "plagued", "Explanation": "Correct. 'Plagued' means to cause persistent trouble or distress over a period of time. A toothache that persists until it becomes unbearable 'plagues' the person."}, {"key": "B", "value": "provoked", "Explanation": "'Provoked' means to stimulate a reaction or to deliberately annoy. A toothache is not something that provokes a person."}, {"key": "C", "value": "penalised", "Explanation": "'Penalised' means to punish for breaking a rule. A toothache is not a penalty or punishment."}, {"key": "D", "value": "pressured", "Explanation": "'Pressured' means to be put under pressure to do something. While the toothache created discomfort, 'plagued' better describes persistent, ongoing suffering."}], "category": "Precise Verbs"}, {"id": "psle2025_eng_q14", "source": "PSLE 2025 English", "section": "Vocabulary MCQ", "qNum": 14, "sentence": "Mrs Tan was ____________ cleaning up the mess in the kitchen until her limbs started aching.", "options": ["forcibly", "roughly", "restlessly", "laboriously"], "answerIndex": 4, "answer": "laboriously", "option_explanations": [{"key": "A", "value": "forcibly", "Explanation": "'Forcibly' means using physical force or compulsion. It doesn't describe the tiring, effortful nature of the cleaning."}, {"key": "B", "value": "roughly", "Explanation": "'Roughly' means in a harsh or violent manner, or approximately. It doesn't convey hard, tiring work."}, {"key": "C", "value": "restlessly", "Explanation": "'Restlessly' means in an uneasy or unable-to-rest manner. It describes agitation, not hard physical work."}, {"key": "D", "value": "laboriously", "Explanation": "Correct. 'Laboriously' means in a way that requires a lot of time and effort. Mrs Tan worked so hard that her limbs ached."}], "category": "Adverbs"}, {"id": "psle2025_eng_q15", "source": "PSLE 2025 English", "section": "Vocabulary MCQ", "qNum": 15, "sentence": "After a month in Singapore, Mrs Smith has become ____________ to the weather and spends more time outdoors.", "options": ["inclined", "immune", "adaptable", "accustomed"], "answerIndex": 4, "answer": "accustomed", "option_explanations": [{"key": "A", "value": "inclined", "Explanation": "'Inclined' means having a tendency or willingness. 'Inclined to the weather' is not a natural expression."}, {"key": "B", "value": "immune", "Explanation": "'Immune' means resistant or not affected by. 'Immune to the weather' would mean not affected at all, which is too strong."}, {"key": "C", "value": "adaptable", "Explanation": "'Adaptable' means able to adjust. However, 'become adaptable to' is not as natural as 'become accustomed to'."}, {"key": "D", "value": "accustomed", "Explanation": "Correct. 'Accustomed to' means familiar with through experience. Mrs Smith has become used to Singapore's weather after living there for a month."}], "category": "Precise Verbs"}, {"id": "psle2025_eng_q16", "source": "PSLE 2025 English", "section": "Vocabulary Cloze", "qNum": 16, "passage": "James and I signed up for a beach clean-up programme. We wanted to see in person(16) how serious the littering problem was. As soon as we arrived at the beach, we armed ourselves with gloves and tongs, all charged up(17) to pick up litter on the beach. Although the beach looked somewhat(18) clean, the littering issue was more severe than we had thought. To our surprise, within a short time, we collected about 5 kilogrammes of litter. We had to leave behind bulky items which could not be hauled(19) to the disposal point, and there were light pieces of litter that were swept away by the retreating waves. Before we left the beach, we made the commitment(20) to participate in more of such programmes. We also hoped to rope in our friends in the next beach clean-up activity.", "sentence": "We wanted to see in person how serious the littering problem was.", "targetWord": "in person", "options": ["straightaway", "specially", "firsthand", "closely"], "answerIndex": 3, "answer": "firsthand", "option_explanations": [{"key": "A", "value": "straightaway", "Explanation": "'Straightaway' means immediately. 'In person' is about direct, personal experience, not timing."}, {"key": "B", "value": "specially", "Explanation": "'Specially' means for a particular purpose. It doesn't capture the meaning of witnessing something personally."}, {"key": "C", "value": "firsthand", "Explanation": "Correct. 'Firsthand' means directly, from personal experience. 'In person' and 'firsthand' both mean experiencing something directly rather than hearing about it."}, {"key": "D", "value": "closely", "Explanation": "'Closely' means in a detailed or careful manner. It describes how you look at something, not that you experience it personally."}], "full_passage": "James and I signed up for a beach clean-up programme. We wanted to see in person(16) how serious the littering problem was. As soon as we arrived at the beach, we armed ourselves with gloves and tongs, all charged up(17) to pick up litter on the beach. Although the beach looked somewhat(18) clean, the littering issue was more severe than we had thought. To our surprise, within a short time, we collected about 5 kilogrammes of litter. We had to leave behind bulky items which could not be hauled(19) to the disposal point, and there were light pieces of litter that were swept away by the retreating waves. Before we left the beach, we made the commitment(20) to participate in more of such programmes. We also hoped to rope in our friends in the next beach clean-up activity.", "category": "Adjectives"}, {"id": "psle2025_eng_q17", "source": "PSLE 2025 English", "section": "Vocabulary Cloze", "qNum": 17, "passage": "James and I signed up for a beach clean-up programme. We wanted to see in person(16) how serious the littering problem was. As soon as we arrived at the beach, we armed ourselves with gloves and tongs, all charged up(17) to pick up litter on the beach. Although the beach looked somewhat(18) clean, the littering issue was more severe than we had thought. To our surprise, within a short time, we collected about 5 kilogrammes of litter. We had to leave behind bulky items which could not be hauled(19) to the disposal point, and there were light pieces of litter that were swept away by the retreating waves. Before we left the beach, we made the commitment(20) to participate in more of such programmes. We also hoped to rope in our friends in the next beach clean-up activity.", "sentence": "We armed ourselves with gloves and tongs, all charged up to pick up litter on the beach.", "targetWord": "charged up", "options": ["raring", "earnest", "prepared", "activated"], "answerIndex": 1, "answer": "raring", "option_explanations": [{"key": "A", "value": "raring", "Explanation": "Correct. 'Raring' means very eager and enthusiastic. 'Charged up' means excited and full of energy, which matches 'raring to go'."}, {"key": "B", "value": "earnest", "Explanation": "'Earnest' means sincere and serious. While they were serious about the task, 'charged up' emphasises energy and eagerness, not sincerity."}, {"key": "C", "value": "prepared", "Explanation": "'Prepared' means ready. While they were prepared, 'charged up' specifically conveys enthusiasm and eagerness, not just readiness."}, {"key": "D", "value": "activated", "Explanation": "'Activated' means to make active or to switch on. It is more mechanical and doesn't capture the emotional enthusiasm of 'charged up'."}], "full_passage": "James and I signed up for a beach clean-up programme. We wanted to see in person(16) how serious the littering problem was. As soon as we arrived at the beach, we armed ourselves with gloves and tongs, all charged up(17) to pick up litter on the beach. Although the beach looked somewhat(18) clean, the littering issue was more severe than we had thought. To our surprise, within a short time, we collected about 5 kilogrammes of litter. We had to leave behind bulky items which could not be hauled(19) to the disposal point, and there were light pieces of litter that were swept away by the retreating waves. Before we left the beach, we made the commitment(20) to participate in more of such programmes. We also hoped to rope in our friends in the next beach clean-up activity.", "category": "Adjectives"}, {"id": "psle2
