options": ["exit", "retreat", "vacate", "relocate"], "answerIndex": 2, "answer": "retreat", "option_explanations": [{"key": "A", "value": "exit", "Explanation": "'Exit' means to leave a place entirely. 'Move away' in this context means to step back or create distance, not to leave the location."}, {"key": "B", "value": "retreat", "Explanation": "Correct. 'Move away' means to withdraw or step back from a position. 'Retreat' means to move back or withdraw, which matches the idea of Mrs Lim wanting to move away from the neighbour."}, {"key": "C", "value": "vacate", "Explanation": "'Vacate' means to leave a place empty, typically a room or position. It is too formal and specific for the casual act of moving away from someone."}, {"key": "D", "value": "relocate", "Explanation": "'Relocate' means to move to a new place permanently. Mrs Lim simply wanted to move away from the neighbour temporarily, not relocate."}], "full_passage": "Late one evening, Mrs Wendy Lim saw her new neighbour at his door. 'Hello! I'm Wendy. You are...?' Mrs Lim stretched out her hand as a welcoming gesture(16). The neighbour, however, shook his head and mumbled something that did not make sense(17) before scuttling into his apartment. His strange behaviour left Mrs Lim feeling bewildered(18) and she wondered what was wrong. A week later, Mrs Lim met the neighbour again at the lift lobby. Unable to move away(19) without looking suspicious, she stood awkwardly(20) at a distance. To her pleasant surprise, the man said, 'Hi, I'm Teck Huat. So sorry for my rude behaviour the other day. I was having a terrible flu and didn't want to pass it to you.' Mrs Lim smiled.", "category": "Nouns"}, {"id": "psle2017_eng_q20", "source": "PSLE 2017", "section": "Vocabulary Cloze", "qNum": 20, "sentence": "Late one evening, Mrs Wendy Lim saw her new neighbour at his door. 'Hello! I'm Wendy. You are...?' Mrs Lim stretched out her hand as a welcoming gesture(16). The neighbour, however, shook his head and mumbled something that did not make sense(17) before scuttling into his apartment. His strange behaviour left Mrs Lim feeling bewildered(18) and she wondered what was wrong. A week later, Mrs Lim met the neighbour again at the lift lobby. Unable to move away(19) without looking suspicious, she stood awkwardly(20) at a distance. To her pleasant surprise, the man said, 'Hi, I'm Teck Huat. So sorry for my rude behaviour the other day. I was having a terrible flu and didn't want to pass it to you.' Mrs Lim smiled.", "options": ["uneasily", "unhappily", "anxiously", "nervously"], "answerIndex": 1, "answer": "uneasily", "option_explanations": [{"key": "A", "value": "uneasily", "Explanation": "Correct. 'Awkwardly' means in an uncomfortable or uneasy manner. 'Uneasily' means in a way that shows discomfort or unease, which is the closest synonym to 'awkwardly' in this context."}, {"key": "B", "value": "unhappily", "Explanation": "'Unhappily' means in a sad or displeased manner. 'Awkwardly' describes discomfort in a social situation, not sadness."}, {"key": "C", "value": "anxiously", "Explanation": "'Anxiously' means in a worried manner. While close, 'awkwardly' specifically refers to social discomfort or lack of grace, not general worry."}, {"key": "D", "value": "nervously", "Explanation": "'Nervously' means in an anxious or apprehensive manner. 'Awkwardly' emphasises the uncomfortable social situation rather than nervous feelings."}], "full_passage": "Late one evening, Mrs Wendy Lim saw her new neighbour at his door. 'Hello! I'm Wendy. You are...?' Mrs Lim stretched out her hand as a welcoming gesture(16). The neighbour, however, shook his head and mumbled something that did not make sense(17) before scuttling into his apartment. His strange behaviour left Mrs Lim feeling bewildered(18) and she wondered what was wrong. A week later, Mrs Lim met the neighbour again at the lift lobby. Unable to move away(19) without looking suspicious, she stood awkwardly(20) at a distance. To her pleasant surprise, the man said, 'Hi, I'm Teck Huat. So sorry for my rude behaviour the other day. I was having a terrible flu and didn't want to pass it to you.' Mrs Lim smiled.", "category": "Adverbs"}, {"id": "prelim2025_acsj_eng_q11", "source": "Prelim 2025 ACSJ", "section": "Vocabulary MCQ", "qNum": 11, "sentence": "The Ministry of Environment officers shut down that restaurant when it was found to be ________ with cockroaches.", "options": ["inflated", "inflicted", "infected", "infested"], "answerIndex": 4, "answer": "infested", "option_explanations": [{"key": "A", "value": "inflated", "Explanation": "Incorrect. 'Inflated' means expanded or swollen, typically referring to balloons, prices, or exaggerated claims ('inflated ego'). It describes physical enlargement or overstatement, not an infestation. Cockroaches do not 'inflate' or swell; this word is semantically unrelated to pest problems."}, {"key": "B", "value": "inflicted", "Explanation": "Incorrect. 'Inflicted' means imposed or caused harm intentionally ('inflicted pain', 'inflicted punishment'). While cockroaches cause problems, the word 'inflict' requires a sense of intentional harm-doing. Additionally, the correct preposition with 'inflict' is 'on/upon', not 'with'. The structure doesn't fit: 'inflicted with cockroaches' is grammatically incorrect."}, {"key": "C", "value": "infected", "Explanation": "Incorrect. 'Infected' refers to contamination by disease-causing organisms (bacteria, viruses). While cockroaches can carry diseases, the word 'infected' typically describes a state of disease rather than the presence of pests themselves. The specific term for pest invasion is 'infested', not 'infected'. A restaurant is 'infested with pests', not 'infected with pests'."}, {"key": "D", "value": "infested", "Explanation": "Correct. 'Infested' specifically means invaded or overrun by pests, insects, or parasites ('infested with cockroaches', 'infested with termites'). This is the precise term for describing spaces occupied by unwanted creatures. The structure 'infested with + pest' is the standard idiom, making this the only appropriate choice for describing a cockroach-filled restaurant."}], "category": "Adjectives"}, {"id": "prelim2025_acsj_eng_q12", "source": "Prelim 2025 ACSJ", "section": "Vocabulary MCQ", "qNum": 12, "sentence": "The passers-by ________ how the accident could have happened since they did not witness it.", "options": ["reflected", "estimated", "concluded", "speculated"], "answerIndex": 4, "answer": "speculated", "option_explanations": [{"key": "A", "value": "reflected", "Explanation": "Incorrect. 'Reflected' means pondered or thought carefully about something. While it implies thinking, 'reflected' suggests personal contemplation and internal consideration. The context emphasizes people discussing/theorizing about an accident they didn't see, which involves conjecture about causes, not personal introspection. 'Reflected' doesn't capture the sense of hazarding a guess."}, {"key": "B", "value": "estimated", "Explanation": "Incorrect. 'Estimated' means calculated or approximated, typically involving numerical or quantifiable assessments ('estimated the cost', 'estimated the time'). The sentence discusses how an accident happened (causation), not a quantitative measurement. 'Estimated' doesn't fit the meaning of theorizing about causes or making educated guesses about events."}, {"key": "C", "value": "concluded", "Explanation": "Incorrect. 'Concluded' means reached a definite decision or final judgment based on evidence or reasoning. The sentence explicitly states the passers-by 'did not witness it', so they lack the direct evidence needed to reach firm conclusions. 'Concluded' implies certainty, whereas the context requires a word meaning to guess or propose possibilities without certainty."}, {"key": "D", "value": "speculated", "Explanation": "Correct. 'Speculated' means conjectured, theorized, or made educated guesses about something without certain knowledge. The sentence indicates the passers-by didn't witness the accident but still discussed how it happened, which is precisely speculating—forming ideas about events based on limited or indirect information. 'Speculated about' is the perfect fit for this context of uncertain theorizing."}], "category": "Precise Verbs"}, {"id": "prelim2025_acsj_eng_q13", "source": "Prelim 2025 ACSJ", "section": "Vocabulary MCQ", "qNum": 13, "sentence": "Although he is the chairman's son, his dishonest act should not be ________.", "options": ["endorsed", "instigated", "condoned", "prohibited"], "answerIndex": 3, "answer": "condoned", "option_explanations": [{"key": "A", "value": "endorsed", "Explanation": "Incorrect. 'Endorsed' means officially approved, supported, or recommended ('endorsed a product', 'endorsed a candidate'). While it's tempting because dishonesty should not be endorsed, the sentence structure is awkward. 'Should not be endorsed' is less concise than the correct option, and 'endorse' typically requires active approval, whereas 'condone' specifically means overlooking/ignoring wrongdoing."}, {"key": "B", "value": "instigated", "Explanation": "Incorrect. 'Instigated' means initiated, started, or provoked (usually trouble). The sentence discusses the Chairman's son committing dishonesty, not initiating or starting wrongdoing elsewhere. The sentence addresses whether his action should be overlooked/permitted, not whether he started it. 'Instigated' is semantically mismatched to the context."}, {"key": "C", "value": "condoned", "Explanation": "Correct. 'Condoned' means accepted, tolerated, or overlooked (wrongdoing) without protest or punishment. The sentence's logic is: although his family status might typically grant him privileges, his dishonest act should not be 'condoned' (forgiven/overlooked). This captures the idea that privilege doesn't excuse dishonesty. 'Condone' specifically fits situations where wrong actions might be ignored due to favoritism or status."}, {"key": "D", "value": "prohibited", "Explanation": "Incorrect. 'Prohibited' means forbidden or banned. The sentence reads awkwardly as 'his act should not be prohibited', which suggests the opposite of the intended meaning—it would imply the dishonest act should be allowed. The sentence requires a word meaning overlooked/excused, not banned. The logic demands 'condoned' (not overlooked), not 'prohibited' (not banned)."}], "category": "Precise Verbs"}, {"id": "prelim2025_acsj_eng_q14", "source": "Prelim 2025 ACSJ", "section": "Vocabulary MCQ", "qNum": 14, "sentence": "I have decided to ________ my grandparents who are living in Johor to surprise them before I continue my drive to Malacca.", "options": ["call in", "call on", "call over", "call upon"], "answerIndex": 2, "answer": "call on", "option_explanations": [{"key": "A", "value": "call in", "Explanation": "Incorrect. 'Call in' means summon someone for a specific service or purpose ('call in an expert', 'call in sick'). It doesn't mean to visit someone. The sentence describes surprising grandparents with a visit, not summoning them for a particular task or service. 'Call in' doesn't fit the context of visiting someone."}, {"key": "B", "value": "call on", "Explanation": "Correct. 'Call on' (or 'call upon') means to visit someone, especially to see them at their home ('I'll call on you tomorrow'). The sentence describes visiting grandparents in Johor to surprise them before continuing to Malacca. 'Call on' idiomatically expresses making a social visit. This is the standard phrasal verb for visiting someone."}, {"key": "C", "value": "call over", "Explanation": "Incorrect. 'Call over' means to summon someone to come to a specific location or to invite them closer ('Call the dog over'). It suggests beckoning someone to approach, not visiting them at their home. The sentence requires visiting them in Johor, not calling them to a different location."}, {"key": "D", "value": "call upon", "Explanation": "Incorrect. While 'call upon' can mean to visit (more formal variant of 'call on'), it more commonly means to request or appeal to someone ('call upon someone for help'). In modern usage, especially for the context of visiting, 'call on' is more standard. Additionally, 'call upon' more frequently suggests making a request rather than a social visit."}], "category": "Phrasal Verbs"}, {"id": "prelim2025_acsj_eng_q15", "source": "Prelim 2025 ACSJ", "section": "Vocabulary MCQ", "qNum": 15, "sentence": "After the fire at the shopping mall, most of the shops were ________ beyond recognition.", "options": ["sizzled", "charred", "scalded", "incinerated"], "answerIndex": 2, "answer": "charred", "option_explanations": [{"key": "A", "value": "sizzled", "Explanation": "Incorrect. 'Sizzled' refers to a sound or action (like food cooking, making a hissing/crackling sound). While fires might sizzle, 'sizzled' describes the sound or process, not the resulting physical condition. The sentence describes the state of shops after fire ('were sizzled' is grammatically awkward), not the sound or cooking process. This doesn't appropriately describe fire damage."}, {"key": "B", "value": "charred", "Explanation": "Correct. 'Charred' means blackened or burnt by exposure to fire, leaving char (burnt residue). After a shopping mall fire, structures and contents would be charred—blackened, burnt beyond recognition. 'Charred' is the precise term for describing the visible effect of fire damage on buildings and objects. It directly indicates the transformation caused by intense heat."}, {"key": "C", "value": "scalded", "Explanation": "Incorrect. 'Scalded' refers to burning caused by hot liquid (steam or boiling water), not fire ('scalded hand from boiling water'). While scalding involves heat, it's fundamentally different from fire damage. A shopping mall wouldn't be 'scalded' by a fire; that term applies to skin or materials injured by hot liquids, not to structural fire damage."}, {"key": "D", "value": "incinerated", "Explanation": "Incorrect. While 'incinerated' means completely burnt to ash, it's too extreme and final for this context. The phrase 'beyond recognition' suggests damage so extensive that identification is difficult, but shops after a fire would still have recognizable remains (structures, fixtures). 'Incinerated' implies complete reduction to ashes, which overstates typical fire damage. 'Charred' better describes partially destroyed but still identifiable structures."}], "category": "Adjectives"}, {"id": "prelim2025_acsj_eng_q16", "source": "Prelim 2025 ACSJ", "section": "Vocabulary Cloze", "qNum": 16, "sentence": "With a twinkle in his eye, Father declared that the most worthy of us all would get a spot in the spectator's seat for the upcoming Liverstool versus Manpester City football friendly match. That spurred(16) us to put on our best behaviour that week. As the week drew to a close, my two brothers began to drift away(17) from their goal. I kept up my good behaviour and went to dispose the rubbish into the big bin outside our house. As I began to replace the lid on the bin, a flash of white on the back of the black lid caught my attention. I wavered(18) for a moment, unsure of what to make of it. Then, I lifted the flap of the envelope. To my utter(19) disbelief, I saw a ticket to the dream match; my hard work had been duly(20) rewarded! This was a life lesson in responsibility that had stuck with me till today.", "options": ["compelled", "persuaded", "encouraged", "commanded"], "answerIndex": 3, "answer": "encouraged", "option_explanations": [{"key": "A", "value": "compelled", "Explanation": "Incorrect. 'Compelled' suggests being forced or obligated to do something against one's will ('compelled to leave'). While it could theoretically fit, it implies coercion rather than motivation. The context shows Father's promise motivated the children positively to behave well, not forced them against their wishes. This understates the voluntary nature of their response."}, {"key": "B", "value": "persuaded", "Explanation": "Incorrect. 'Persuaded' means convinced through argument or reasoning. The context shows Father's declaration about the reward; this isn't presented as an argument aimed at changing minds. 'Persuaded' typically involves discussion or debate, whereas the sentence simply describes a motivating offer that inspired behavior. The verb doesn't capture the immediate motivational aspect."}, {"key": "C", "value": "encouraged", "Explanation": "Correct. 'Encouraged' means inspired, motivated, or gave confidence to do something ('encouraged them to try'). Father's promise of a reward for the best behavior 'spurred' (encouraged) the children to put on their best behavior. The word 'spurred' idiomatically means to encourage or motivate by providing incentive. This captures both the motivational aspect and the voluntary nature of their response."}, {"key": "D", "value": "commanded", "Explanation": "Incorrect. 'Commanded' means ordered or demanded obedience. While the outcome (better behavior) is similar, 'commanded' implies authority-based coercion rather than incentive-driven motivation. Father's promise was an incentive, not a direct command. 'Commanded' overlooks the carrot-and-stick motivational dynamic of offering a reward."}], "full_passage": "With a twinkle in his eye, Father declared that the most worthy of us all would get a spot in the spectator's seat for the upcoming Liverstool versus Manpester City football friendly match. That spurred(16) us to put on our best behaviour that week. As the week drew to a close, my two brothers began to drift away(17) from their goal. I kept up my good behaviour and went to dispose the rubbish into the big bin outside our house. As I began to replace the lid on the bin, a flash of white on the back of the black lid caught my attention. I wavered(18) for a moment, unsure of what to make of it. Then, I lifted the flap of the envelope. To my utter(19) disbelief, I saw a ticket to the dream match; my hard work had been duly(20) rewarded! This was a life lesson in responsibility that had stuck with me till today.", "category": "Precise Verbs"}, {"id": "prelim2025_acsj_eng_q17", "source": "Prelim 2025 ACSJ", "section": "Vocabulary Cloze", "qNum": 17, "sentence": "With a twinkle in his eye, Father declared that the most worthy of us all would get a spot in the spectator's seat for the upcoming Liverstool versus Manpester City football friendly match. That spurred(16) us to put on our best behaviour that week. As the week drew to a close, my two brothers began to drift away(17) from their goal. I kept up my good behaviour and went to dispose the rubbish into the big bin outside our house. As I began to replace the lid on the bin, a flash of white on the back of the black lid caught my attention. I wavered(18) for a moment, unsure of what to make of it. Then, I lifted the flap of the envelope. To my utter(19) disbelief, I saw a ticket to the dream match; my hard work had been duly(20) rewarded! This was a life lesson in responsibility that had stuck with me till today.", "options": ["lose", "stray", "leave", "depart"], "answerIndex": 2, "answer": "stray", "option_explanations": [{"key": "A", "value": "lose", "Explanation": "Incorrect. 'Lose' means to misplace or suffer the loss of something ('lose your keys', 'lose the game'). The sentence says the brothers 'began to drift away from their goal'. This isn't about misplacing or losing the goal; it's about moving away from it. 'Lose' doesn't capture the gradual wandering or deviation from the goal."}, {"key": "B", "value": "stray", "Explanation": "Correct. 'Stray' means to wander away from or deviate from a path or objective ('stray from the path', 'stray from the point'). The sentence indicates the brothers gradually moved away from maintaining their goal of good behavior. 'Drift away' and 'stray' both capture gradual, wandering movement away from a course of action. This perfectly expresses their loss of focus and effort."}, {"key": "C", "value": "leave", "Explanation": "Incorrect. 'Leave' means to depart from a place ('leave the room'). While 'leave their goal' could theoretically mean abandoning it, the phrase 'drift away from' emphasizes gradual wandering, not deliberate departure. The brothers didn't suddenly quit their goal; they gradually lost focus. 'Leave' doesn't convey this gradual, wandering aspect as well as 'stray'."}, {"key": "D", "value": "depart", "Explanation": "Incorrect. 'Depart' means to leave or set out from ('depart from the city'). Like 'leave', it emphasizes deliberate movement away from a place. However, 'drift away' describes gradual wandering or loss of focus, not intentional departure. 'Depart' is too formal and doesn't capture the sense of gradually losing commitment to a goal."}], "full_passage": "With a twinkle in his eye, Father declared that the most worthy of us all would get a spot in the spectator's seat for the upcoming Liverstool versus Manpester City football friendly match. That spurred(16) us to put on our best behaviour that week. As the week drew to a close, my two brothers began to drift away(17) from their goal. I kept up my good behaviour and went to dispose the rubbish into the big bin outside our house. As I began to replace the lid on the bin, a flash of white on the back of the black lid caught my attention. I wavered(18) for a moment, unsure of what to make of it. Then, I lifted the flap of the envelope. To my utter(19) disbelief, I saw a ticket to the dream match; my hard work had been duly(20) rewarded! This was a life lesson in responsibility that had stuck with me till today.", "category": "Precise Verbs"}, {"id": "prelim2025_acsj_eng_q18", "source": "Prelim 2025 ACSJ", "section": "Vocabulary Cloze", "qNum": 18, "sentence": "With a twinkle in his eye, Father declared that the most worthy of us all would get a spot in the spectator's seat for the upcoming Liverstool versus Manpester City football friendly match. That spurred(16) us to put on our best behaviour that week. As the week drew to a close, my two brothers began to drift away(17) from their goal. I kept up my good behaviour and went to dispose the rubbish into the big bin outside our house. As I began to replace the lid on the bin, a flash of white on the back of the black lid caught my attention. I wavered(18) for a moment, unsure of what to make of it. Then, I lifted the flap of the envelope. To my utter(19) disbelief, I saw a ticket to the dream match; my hard work had been duly(20) rewarded! This was a life lesson in responsibility that had stuck with me till today.", "options": ["thought", "decided", "trembled", "hesitated"], "answerIndex": 4, "answer": "hesitated", "option_explanations": [{"key": "A", "value": "thought", "Explanation": "Incorrect. 'Thought' means considered or had a thought ('I thought about it'). While the narrator was thinking about the white object, the sentence specifically indicates hesitation and uncertainty: 'unsure of what to make of it'. The emphasis is on uncertainty and hesitation, not the mere act of thinking. 'Wavered' suggests indecision, not just thinking."}, {"key": "B", "value": "decided", "Explanation": "Incorrect. 'Decided' means made a firm choice or determination. The narrative explicitly states the narrator was 'unsure of what to make of it', showing a lack of decision. The opposite of deciding is wavering/hesitating. 'Decided' contradicts the context of uncertainty and indecision that characterizes the moment."}, {"key": "C", "value": "trembled", "Explanation": "Incorrect. 'Trembled' means shook slightly, usually from emotion or physical cause ('trembled with fear'). While it can metaphorically suggest emotional instability, the sentence provides no indication of physical shaking or fear. The context emphasizes mental uncertainty and hesitation, not physical trembling or emotional turmoil."}, {"key": "D", "value": "hesitated", "Explanation": "Correct. 'Hesitated' means paused or showed uncertainty before acting, exactly matching 'wavered'. The sentence states the narrator was 'unsure of what to make of' the white object and 'wavered for a moment'. This clearly expresses a moment of indecision and uncertainty—pausing before deciding what to do. 'Hesitated' perfectly captures this uncertainty."}], "full_passage": "With a twinkle in his eye, Father declared that the most worthy of us all would get a spot in the spectator's seat for the upcoming Liverstool versus Manpester City football friendly match. That spurred(16) us to put on our best behaviour that week. As the week drew to a close, my two brothers began to drift away(17) from their goal. I kept up my good behaviour and went to dispose the rubbish into the big bin outside our house. As I began to replace the lid on the bin, a flash of white on the back of the black lid caught my attention. I wavered(18) for a moment, unsure of what to make of it. Then, I lifted the flap of the envelope. To my utter(19) disbelief, I saw a ticket to the dream match; my hard work had been duly(20) rewarded! This was a life lesson in responsibility that had stuck with me till today.", "category": "Precise Verbs"}, {"id": "prelim2025_acsj_eng_q19", "source": "Prelim 2025 ACSJ", "section": "Vocabulary Cloze", "qNum": 19, "sentence": "With a twinkle in his eye, Father declared that the most worthy of us all would get a spot in the spectator's seat for the upcoming Liverstool versus Manpester City football friendly match. That spurred(16) us to put on our best behaviour that week. As the week drew to a close, my two brothers began to drift away(17) from their goal. I kept up my good behaviour and went to dispose the rubbish into the big bin outside our house. As I began to replace the lid on the bin, a flash of white on the back of the black lid caught my attention. I wavered(18) for a moment, unsure of what to make of it. Then, I lifted the flap of the envelope. To my utter(19) disbelief, I saw a ticket to the dream match; my hard work had been duly(20) rewarded! This was a life lesson in responsibility that had stuck with me till today.", "options": ["huge", "great", "entire", "complete"], "answerIndex": 4, "answer": "complete", "option_explanations": [{"key": "A", "value": "huge", "Explanation": "Incorrect. 'Huge' means very large in size or extent. While 'utter disbelief' could theoretically mean disbelief of huge magnitude, 'utter' in this context is an intensifier meaning absolute, not a size descriptor. 'Huge' emphasizes scale/size rather than the totality/absoluteness conveyed by 'utter disbelief'."}, {"key": "B", "value": "great", "Explanation": "Incorrect. 'Great' means large in degree or importance ('great joy', 'great difficulty'). While it intensifies the noun, it still emphasizes magnitude or importance rather than totality. The context of the narrator's astonishment at finding the prize ticket suggests a comprehensive, absolute state of shock, not merely a 'great' amount of disbelief."}, {"key": "C", "value": "entire", "Explanation": "Incorrect. 'Entire' means whole or complete in spatial or quantitative terms ('the entire room'). While it conveys wholeness, it's typically used for physical objects or groups. 'Utter disbelief' refers to the absolute, total emotional state, not physical wholeness. 'Entire' doesn't fit the intensifying adjective role as well as 'complete' or 'utter'."}, {"key": "D", "value": "complete", "Explanation": "Correct. 'Complete' means total, absolute, or unreserved. 'Utter disbelief' means absolute, total disbelief—an unqualified state of shock. 'Utter' and 'complete' are near-synonyms when used as intensifying adjectives before nouns describing states ('utter/complete darkness', 'utter/complete shock'). Both convey that the disbelief is total and unreserved."}], "full_passage": "With a twinkle in his eye, Father declared that the most worthy of us all would get a spot in the spectator's seat for the upcoming Liverstool versus Manpester City football friendly match. That spurred(16) us to put on our best behaviour that week. As the week drew to a close, my two brothers began to drift away(17) from their goal. I kept up my good behaviour and went to dispose the rubbish into the big bin outside our house. As I began to replace the lid on the bin, a flash of white on the back of the black lid caught my attention. I wavered(18) for a moment, unsure of what to make of it. Then, I lifted the flap of the envelope. To my utter(19) disbelief, I saw a ticket to the dream match; my hard work had been duly(20) rewarded! This was a life lesson in responsibility that had stuck with me till today.", "category": "Precise Verbs"}, {"id": "prelim2025_acsj_eng_q20", "source": "Prelim 2025 ACSJ", "section": "Vocabulary Cloze", "qNum": 20, "sentence": "With a twinkle in his eye, Father declared that the most worthy of us all would get a spot in the spectator's seat for the upcoming Liverstool versus Manpester City football friendly match. That spurred(16) us to put on our best behaviour that week. As the week drew to a close, my two brothers began to drift away(17) from their goal. I kept up my good behaviour and went to dispose the rubbish into the big bin outside our house. As I began to replace the lid on the bin, a flash of white on the back of the black lid caught my attention. I wavered(18) for a moment, unsure of what to make of it. Then, I lifted the flap of the envelope. To my utter(19) disbelief, I saw a ticket to the dream match; my hard work had been duly(20) rewarded! This was a life lesson in responsibility that had stuck with me till today.", "options": ["fittingly", "honestly", "peculiarly", "surprisingly"], "answerIndex": 1, "answer": "fittingly", "option_explanations": [{"key": "A", "value": "fittingly", "Explanation": "Correct. 'Fittingly' means in a way that is appropriate or suitable. 'Duly' means properly or as expected, and 'fittingly' captures this sense of something being done appropriately."}, {"key": "B", "value": "honestly", "Explanation": "Incorrect. 'Honestly' means truthfully, without deception. The sentence doesn't emphasize truthfulness or honesty; it emphasizes that the reward was given as properly promised. 'Duly' has nothing to do with honesty or truthfulness. This interpretation misses the meaning of the word entirely."}, {"key": "C", "value": "peculiarly", "Explanation": "Incorrect. 'Peculiarly' means in an unusual, odd, or distinctive manner. The sentence doesn't suggest the reward was given in an unusual way. 'Duly' actually suggests the opposite—that things happened properly and according to expectations, not in any peculiar or unusual manner. This is semantically contradictory."}, {"key": "D", "value": "surprisingly", "Explanation": "'Surprisingly' means in an unexpected manner. 'Duly' implies something done properly and as expected, which is the opposite of surprisingly."}], "full_passage": "With a twinkle in his eye, Father declared that the most worthy of us all would get a spot in the spectator's seat for the upcoming Liverstool versus Manpester City football friendly match. That spurred(16) us to put on our best behaviour that week. As the week drew to a close, my two brothers began to drift away(17) from their goal. I kept up my good behaviour and went to dispose the rubbish into the big bin outside our house. As I began to replace the lid on the bin, a flash of white on the back of the black lid caught my attention. I wavered(18) for a moment, unsure of what to make of it. Then, I lifted the flap of the envelope. To my utter(19) disbelief, I saw a ticket to the dream match; my hard work had been duly(20) rewarded! This was a life lesson in responsibility that had stuck with me till today.", "category": "Adverbs"}, {"id": "prelim2025_aitong_eng_q11", "source": "Prelim 2025 AiTong", "section": "Vocabulary MCQ", "qNum": 11, "sentence": "After getting a standing ovation, the actress ________ in the limelight, her eyes gleaming with joy.", "options": ["shone", "basked", "radiated", "absorbed"], "answerIndex": 2, "answer": "basked", "option_explanations": [{"key": "A", "value": "shone", "Explanation": "Incorrect. 'Shone' refers to emitting light physically, not the idiom of enjoying attention."}, {"key": "B", "value": "basked", "Explanation": "Correct. 'Basked in the limelight' is an idiom meaning to enjoy attention and admiration."}, {"key": "C", "value": "radiated", "Explanation": "Incorrect. While 'radiated joy' works, 'radiated in the limelight' is not idiomatic."}, {"key": "D", "value": "absorbed", "Explanation": "Incorrect. 'Absorbed in the limelight' is awkward and doesn't convey the intended meaning of enjoying attention."}], "category": "Precise Verbs"}, {"id": "prelim2025_aitong_eng_q12", "source": "Prelim 2025 AiTong", "section": "Vocabulary MCQ", "qNum": 12, "sentence": "Maya showed ________ when she said not to gossip, then talked about June behind her back.", "options": ["discrimination", "hypocrisy", "rudeness", "authority"], "answerIndex": 2, "answer": "hypocrisy", "option_explanations": [{"key": "A", "value": "discrimination", "Explanation": "Incorrect. Discrimination refers to unfair treatment based on characteristics, not the contradiction shown here."}, {"key": "B", "value": "hypocrisy", "Explanation": "Correct. Hypocrisy means claiming to have standards one does not follow; Maya contradicted her own stated principle."}, {"key": "C", "value": "rudeness", "Explanation": "Incorrect. While talking behind someone's back is rude, it doesn't specifically describe the contradiction of stated values."}, {"key": "D", "value": "authority", "Explanation": "Incorrect. Authority is not relevant to the contradiction between what Maya said and what she did."}], "category": "Nouns"}, {"id": "prelim2025_aitong_eng_q13", "source": "Prelim 2025 AiTong", "section": "Vocabulary MCQ", "qNum": 13, "sentence": "The ________ mother gives her only son anything he wants even when it is not good for him.", "options": ["devoted", "indulgent", "supportive", "extravagant"], "answerIndex": 2, "answer": "indulgent", "option_explanations": [{"key": "A", "value": "devoted", "Explanation": "Incorrect. Devoted means dedicated to someone's welfare, not necessarily giving whatever they want despite harm."}, {"key": "B", "value": "indulgent", "Explanation": "Correct. Indulgent means allowing someone to have whatever they want, often excessively, fitting the scenario."}, {"key": "C", "value": "supportive", "Explanation": "Incorrect. Supportive means helpful and encouraging, but doesn't imply giving whatever someone wants."}, {"key": "D", "value": "extravagant", "Explanation": "Incorrect. Extravagant means spending lavishly, but doesn't specifically describe the over-permissiveness shown here."}], "category": "Adjectives"}, {"id": "prelim2025_aitong_eng_q14", "source": "Prelim 2025 AiTong", "section": "Vocabulary MCQ", "qNum": 14, "sentence": "When I told Josh he was being too aggressive, he finally ________ and stopped yelling.", "options": ["backed into", "backed out", "backed off", "backed up"], "answerIndex": 3, "answer": "backed off", "option_explanations": [{"key": "A", "value": "backed into", "Explanation": "Incorrect. 'Backed into' means to enter something by backing up or reluctantly, not to reduce aggression."}, {"key": "B", "value": "backed out", "Explanation": "Incorrect. 'Backed out' means to withdraw or abandon something, not to reduce intensity."}, {"key": "C", "value": "backed off", "Explanation": "Correct. 'Backed off' means to reduce intensity or aggression, fitting the context of stopping yelling."}, {"key": "D", "value": "backed up", "Explanation": "Incorrect. 'Backed up' means to support or to reverse, not to reduce aggression."}], "category": "Phrasal Verbs"}, {"id": "prelim2025_aitong_eng_q15", "source": "Prelim 2025 AiTong", "section": "Vocabulary MCQ", "qNum": 15, "sentence": "When asked about the new school rules, Mark replied ________, showing little interest in the changes.", "options": ["casually", "arrogantly", "unfeelingly", "indifferently"], "answerIndex": 4, "answer": "indifferently", "option_explanations": [{"key": "A", "value": "casually", "Explanation": "Incorrect. Casually means in a relaxed manner, but doesn't necessarily convey lack of interest."}, {"key": "B", "value": "arrogantly", "Explanation": "Incorrect. Arrogantly means with excessive pride or self-importance, not shown by the little interest."}, {"key": "C", "value": "unfeelingly", "Explanation": "Incorrect. Unfeelingly suggests a lack of emotion, but the context emphasizes lack of interest specifically."}, {"key": "D", "value": "indifferently", "Explanation": "Correct. Indifferently means with lack of interest or concern, directly matching 'showing little interest'."}], "category": "Adverbs"}, {"id": "prelim2025_aitong_eng_q16", "source": "Prelim 2025 AiTong", "section": "Vocabulary Cloze", "qNum": 16, "sentence": "As a student, I find the POSB Smart Buddy programme helpful. Rolled out in 2017, it is now expanding to all schools in Singapore. With Smart Buddy, making payments in school has become so convenient. I just tap my smartwatch or EZ-Link card to pay for meals or items at the canteen and bookstore. My parents like it too. Using the free Smart Buddy app, they can track my spendings each day, set daily spending limits and even help me create savings goals. Whenever I am low on money, they can top up my account through the mobile app remotely, no matter the location, without delay. I also like that the programme is more than just about spending — it teaches me how to use digital payments safely and manage my money wisely.", "options": ["Originated", "Embarked", "Launched", "Founded"], "answerIndex": 3, "answer": "Launched", "option_explanations": [{"key": "A", "value": "Originated", "Explanation": "Incorrect. 'Originated' means came into existence, but doesn't convey the sense of the programme being put into action or made available."}, {"key": "B", "value": "Embarked", "Explanation": "Incorrect. 'Embarked' is used with 'on', as in 'embarked on', and means to start a journey or venture."}, {"key": "C", "value": "Launched", "Explanation": "Correct. 'Launched' means to introduce a new product or programme to the public, fitting the context of the POSB programme being rolled out/made available."}, {"key": "D", "value": "Founded", "Explanation": "Incorrect. 'Founded' typically refers to establishing an organization, not introducing a specific programme."}], "category": "Precise Verbs"}, {"id": "prelim2025_aitong_eng_q17", "source": "Prelim 2025 AiTong", "section": "Vocabulary Cloze", "qNum": 17, "sentence": "As a student, I find the POSB Smart Buddy programme helpful. Rolled out in 2017, it is now expanding to all schools in Singapore. With Smart Buddy, making payments in school has become so convenient. I just tap my smartwatch or EZ-Link card to pay for meals or items at the canteen and bookstore. My parents like it too. Using the free Smart Buddy app, they can track my spendings each day, set daily spending limits and even help me create savings goals. Whenever I am low on money, they can top up my account through the mobile app remotely, no matter the location, without delay. I also like that the programme is more than just about spending — it teaches me how to use digital payments safely and manage my money wisely.", "options": ["advanced", "creative", "efficient", "flexible"], "answerIndex": 3, "answer": "efficient", "option_explanations": [{"key": "A", "value": "advanced", "Explanation": "Incorrect. Advanced refers to sophisticated or cutting-edge, but the passage emphasizes ease and convenience, not technological sophistication."}, {"key": "B", "value": "creative", "Explanation": "Incorrect. Creative means involving imagination or originality, which is not the focus of the passage."}, {"key": "C", "value": "efficient", "Explanation": "Correct. Efficient means accomplishing tasks with minimal effort or time. 'Convenient' synonymously describes an efficient payment method."}, {"key": "D", "value": "flexible", "Explanation": "Incorrect. While flexibility might be implied, 'efficient' better captures the sense of ease and simplicity in making payments."}], "category": "Adjectives"}, {"id": "prelim2025_aitong_eng_q18", "source": "Prelim 2025 AiTong", "section": "Vocabulary Cloze", "qNum": 18, "sentence": "As a student, I find the POSB Smart Buddy programme helpful. Rolled out in 2017, it is now expanding to all schools in Singapore. With Smart Buddy, making payments in school has become so convenient. I just tap my smartwatch or EZ-Link card to pay for meals or items at the canteen and bookstore. My parents like it too. Using the free Smart Buddy app, they can track my spendings each day, set daily spending limits and even help me create savings goals. Whenever I am low on money, they can top up my account through the mobile app remotely, no matter the location, without delay. I also like that the programme is more than just about spending — it teaches me how to use digital payments safely and manage my money wisely.", "options": ["barriers", "guidelines", "restrictions", "allowances"], "answerIndex": 3, "answer": "restrictions", "option_explanations": [{"key": "A", "value": "barriers", "Explanation": "Incorrect. Barriers are obstacles, but spending limits are more specific constraints than general obstacles."}, {"key": "B", "value": "guidelines", "Explanation": "Incorrect. Guidelines are recommendations or suggestions, but spending limits are definite constraints, not suggestions."}, {"key": "C", "value": "restrictions", "Explanation": "Correct. Restrictions are limitations or constraints. 'Set daily spending limits' means establishing restrictions on how much can be spent daily."}, {"key": "D", "value": "allowances", "Explanation": "Incorrect. Allowances refer to amounts granted (like pocket money), not to the act of setting limits."}], "category": "Nouns"}, {"id": "prelim2025_aitong_eng_q19", "source": "Prelim 2025 AiTong", "section": "Vocabulary Cloze", "qNum": 19, "sentence": "As a student, I find the POSB Smart Buddy programme helpful. Rolled out in 2017, it is now expanding to all schools in Singapore. With Smart Buddy, making payments in school has become so convenient. I just tap my smartwatch or EZ-Link card to pay for meals or items at the canteen and bookstore. My parents like it too. Using the free Smart Buddy app, they can track my spendings each day, set daily spending limits and even help me create savings goals. Whenever I am low on money, they can top up my account through the mobile app remotely, no matter the location, without delay. I also like that the programme is more than just about spending — it teaches me how to use digital payments safely and manage my money wisely.", "options": ["supplement", "replenish", "increase", "boost"], "answerIndex": 2, "answer": "replenish", "option_explanations": [{"key": "A", "value": "supplement", "Explanation": "Incorrect. Supplement means to add to something existing, but 'top up' specifically means to fill again to full capacity."}, {"key": "B", "value": "replenish", "Explanation": "Correct. Replenish means to fill again or restore to a full level, exactly matching 'top up' in the context of adding money to an account."}, {"key": "C", "value": "increase", "Explanation": "Incorrect. Increase means to make larger, but 'top up' implies restoring to a level, not just making larger."}, {"key": "D", "value": "boost", "Explanation": "Incorrect. Boost means to improve or increase, but lacks the specific sense of refilling to capacity like 'top up' does."}], "category": "Precise Verbs"}, {"id": "prelim2025_aitong_eng_q20", "source": "Prelim 2025 AiTong", "section": "Vocabulary Cloze", "qNum": 20, "sentence": "As a student, I find the POSB Smart Buddy programme helpful. Rolled out in 2017, it is now expanding to all schools in Singapore. With Smart Buddy, making payments in school has become so convenient. I just tap my smartwatch or EZ-Link card to pay for meals or items at the canteen and bookstore. My parents like it too. Using the free Smart Buddy app, they can track my spendings each day, set daily spending limits and even help me create savings goals. Whenever I am low on money, they can top up my account through the mobile app remotely, no matter the location, without delay. I also like that the programme is more than just about spending — it teaches me how to use digital payments safely and manage my money wisely.", "options": ["readily", "virtually", "indirectly", "effortlessly"], "answerIndex": 2, "answer": "virtually", "option_explanations": [{"key": "A", "value": "readily", "Explanation": "'Readily' means willingly or easily. While parents can easily add money, 'readily' doesn't capture the 'from anywhere' meaning of the original, which is about virtual/remote access."}, {"key": "B", "value": "virtually", "Explanation": "Correct. 'Virtually' means nearly or almost, or by means of virtual technology. It captures the sense that parents can add money from anywhere using digital/online means."}, {"key": "C", "value": "indirectly", "Explanation": "Incorrect. Indirectly means in an indirect manner, but the passage emphasizes the ability to do so remotely/from a distance."}, {"key": "D", "value": "effortlessly", "Explanation": "Incorrect. While 'effortlessly' implies ease, it doesn't capture the sense of doing something from a remote location."}], "category": "Adverbs"}, {"id": "prelim2025_catholichigh_eng_q11", "section": "Vocabulary MCQ", "options": ["banter", "quibble", "dispute", "dialogue"], "answerIndex": 3, "source": "Prelim 2025 Catholic High", "option_explanations": [{"key": "A", "value": "banter", "Explanation": "Incorrect. 'Banter' is playful, teasing conversation, not a serious argument."}, {"key": "B", "value": "quibble", "Explanation": "Incorrect. 'Quibble' means a minor objection, not an intense argument that 'breaks out'."}, {"key": "C", "value": "dispute", "Explanation": "CORRECT. 'Dispute' means a serious disagreement or quarrel, fitting the intensity described by 'loud' and 'angry boys'."}, {"key": "D", "value": "dialogue", "Explanation": "Incorrect. 'Dialogue' is neutral conversation, not a heated argument."}], "sentence": "A loud ________ broke out between the two angry boys about who should get a bigger piece of the pie.", "answer": "dispute", "qNum": 11, "category": "Nouns"}, {"id": "prelim2025_catholichigh_eng_q12", "section": "Vocabulary MCQ", "options": ["cautiously", "accusingly", "incredulously", "disapprovingly"], "answerIndex": 3, "source": "Prelim 2025 Catholic High", "option_explanations": [{"key": "A", "value": "cautiously", "Explanation": "Incorrect. 'Cautiously' means carefully/warily, not expressing doubt about the claim."}, {"key": "B", "value": "accusingly", "Explanation": "Incorrect. 'Accusingly' implies blame, but Asha is expressing disbelief, not accusation."}, {"key": "C", "value": "incredulously", "Explanation": "CORRECT. 'Incredulously' means with disbelief or skepticism, fitting her raised eyebrows and doubt about finishing in 30 minutes."}, {"key": "D", "value": "disapprovingly", "Explanation": "Incorrect. 'Disapprovingly' expresses moral judgment, not doubt about the claim's truthfulness."}], "sentence": "Asha raised her eyebrows and looked at her brother ________ when he claimed that he had finished the 1000-piece puzzle in 30 minutes.", "answer": "incredulously", "qNum": 12, "category": "Adverbs"}, {"id": "prelim2025_catholichigh_eng_q13", "section": "Vocabulary MCQ", "options": ["impaired", "defamed", "vandalised", "demolished"], "answerIndex": 3, "source": "Prelim 2025 Catholic High", "option_explanations": [{"key": "A", "value": "impaired", "Explanation": "Incorrect. 'Impaired' means weakened in function, not describing deliberate defacement."}, {"key": "B", "value": "defamed", "Explanation": "Incorrect. 'Defamed' means damaged reputation (of people), not applicable to art."}, {"key": "C", "value": "vandalised", "Explanation": "CORRECT. 'Vandalised' means intentionally destroyed or damaged property, fitting spray-painting over a mural."}, {"key": "D", "value": "demolished", "Explanation": "Incorrect. 'Demolished' means completely destroyed/torn down, too extreme for spray-painting over something."}], "sentence": "The principal was upset to find out that someone had ________ the newly painted mural by spray-painting over it.", "answer": "vandalised", "qNum": 13, "category": "Precise Verbs"}, {"id": "prelim2025_catholichigh_eng_q14", "section": "Vocabulary MCQ", "options": ["certified", "talented", "renowned", "empowered"], "answerIndex": 1, "source": "Prelim 2025 Catholic High", "option_explanations": [{"key": "A", "value": "certified", "Explanation": "CORRECT. 'Certified' means officially qualified and licensed, directly related to 'passing tests and getting an official licence'."}, {"key": "B", "value": "talented", "Explanation": "Incorrect. While talent may help, 'talented' doesn't convey official qualification."}, {"key": "C", "value": "renowned", "Explanation": "Incorrect. 'Renowned' means famous, not qualified through official licensing."}, {"key": "D", "value": "empowered", "Explanation": "Incorrect. 'Empowered' means given authority, not officially certified through tests and licensing."}], "sentence": "To fly a passenger plane, Deyi had to become a/an ________ pilot by passing many tests and getting an official licence.", "answer": "certified", "qNum": 14, "category": "Adjectives"}, {"id": "prelim2025_catholichigh_eng_q15", "section": "Vocabulary MCQ", "options": ["brought in", "brought up", "brought on", "brought out"], "answerIndex": 2, "source": "Prelim 2025 Catholic High", "option_explanations": [{"key": "A", "value": "brought in", "Explanation": "Incorrect. 'Brought in' means introduced something external (like an expert), not proposing an idea."}, {"key": "B", "va  up' means to establish or arrange. It doesn't fit the meaning of being discouraged by a smell."}, {"key": "B", "value": "put ... off", "Explanation": "Correct. 'Put off' means to discourage or make someone reluctant. The smell 'put me off' from working, meaning it discouraged me from doing so."}, {"key": "C", "value": "take ... off", "Explanation": "Incorrect. 'Take off' means to remove or depart. It doesn't convey the meaning of being discouraged by a smell."}, {"key": "D", "value": "break ... up", "Explanation": "Incorrect. 'Break up' means to end or separate. It does not fit the context of being discouraged by a paint smell."}], "category": "Phrasal Verbs"}, {"id": "prelim2025_henrypark_eng_q12", "source": "Prelim 2025 Henry Park", "section": "Vocabulary MCQ", "qNum": 12, "sentence": "To ________ your vocabulary, you need to spend time reading every day.", "options": ["diminish", "assemble", "strengthen", "undermine"], "answerIndex": 3, "answer": "strengthen", "grammarTopic": "Vocabulary - verbs", "option_explanations": [{"key": "A", "value": "diminish", "Explanation": "Incorrect. 'Diminish' means to make smaller or weaker. Reading improves vocabulary; it doesn't weaken it."}, {"key": "B", "value": "assemble", "Explanation": "Incorrect. 'Assemble' means to put together or gather. While vocabulary growth involves accumulating words, 'assemble' is not the correct word choice here."}, {"key": "C", "value": "strengthen", "Explanation": "Correct. 'Strengthen' means to make stronger or more robust. Reading helps to strengthen or improve vocabulary by exposing you to new words."}, {"key": "D", "value": "undermine", "Explanation": "Incorrect. 'Undermine' means to weaken or damage. Reading strengthens rather than undermines vocabulary."}], "category": "Precise Verbs"}, {"id": "prelim2025_henrypark_eng_q13", "source": "Prelim 2025 Henry Park", "section": "Vocabulary MCQ", "qNum": 13, "sentence": "After the heavy thunderstorm, the river's water level rose ________, causing a flood in no time.", "options": ["rapidly", "slightly", "silently", "roughly"], "answerIndex": 1, "answer": "rapidly", "grammarTopic": "Vocabulary - adverbs", "option_explanations": [{"key": "A", "value": "rapidly", "Explanation": "Correct. 'Rapidly' means very quickly. This fits the context where the water level rose so quickly it caused a flood 'in no time'."}, {"key": "B", "value": "slightly", "Explanation": "Incorrect. 'Slightly' means a little bit. If the water rose only slightly, it wouldn't cause a flood 'in no time'."}, {"key": "C", "value": "silently", "Explanation": "Incorrect. 'Silently' refers to making no sound. Water rising cannot be described as 'silent' or 'noisy' in this context. The adverb doesn't fit."}, {"key": "D", "value": "roughly", "Explanation": "Incorrect. 'Roughly' means approximately or in a rough manner. It doesn't describe the speed of the water rising effectively."}], "category": "Adverbs"}, {"id": "prelim2025_henrypark_eng_q14", "source": "Prelim 2025 Henry Park", "section": "Vocabulary MCQ", "qNum": 14, "sentence": "The head prefect nominee's speech was ________ with unclear statements that made his position hard to understand.", "options": ["factual", "concise", "ambiguous", "straightforward"], "answerIndex": 3, "answer": "ambiguous", "grammarTopic": "Vocabulary - adjectives", "option_explanations": [{"key": "A", "value": "factual", "Explanation": "Incorrect. 'Factual' means based on facts. The issue is not whether statements are factual, but that they are unclear and hard to understand."}, {"key": "B", "value": "concise", "Explanation": "Incorrect. 'Concise' means brief and to the point. The problem is not length but clarity; the statements are unclear, not just unclear."}, {"key": "C", "value": "ambiguous", "Explanation": "Correct. 'Ambiguous' means unclear, having more than one possible meaning. The speech had unclear statements that made his position hard to understand."}, {"key": "D", "value": "straightforward", "Explanation": "Incorrect. 'Straightforward' means clear and easy to understand. The opposite is true — the statements were unclear and confusing."}], "category": "Adjectives"}, {"id": "prelim2025_henrypark_eng_q15", "source": "Prelim 2025 Henry Park", "section": "Vocabulary MCQ", "qNum": 15, "sentence": "She wore sunglasses to ________ her tired eyes.", "options": ["block", "shade", "conceal", "disguise"], "answerIndex": 3, "answer": "conceal", "grammarTopic": "Vocabulary - verbs", "option_explanations": [{"key": "A", "value": "block", "Explanation": "Incorrect. 'Block' means to obstruct or prevent passage. While sunglasses do block light, this is not the intended meaning here."}, {"key": "B", "value": "shade", "Explanation": "Incorrect. 'Shade' can mean to protect from light or to darken, but 'shade her eyes' is not the correct collocation."}, {"key": "C", "value": "conceal", "Explanation": "Correct. 'Conceal' means to hide or keep out of sight. Wearing sunglasses conceals her tired eyes from view."}, {"key": "D", "value": "disguise", "Explanation": "Incorrect. 'Disguise' means to give a false appearance to hide identity. While similar to 'conceal', 'conceal' is the more appropriate word for hiding tired eyes."}], "category": "Precise Verbs"}, {"id": "prelim2025_henrypark_eng_q16", "source": "Prelim 2025 Henry Park", "section": "Vocabulary Cloze", "qNum": 16, "sentence": "Abel Mutai, a Kenyan runner, was just a few metres from the finish line. Suddenly, he became bewildered(16) by the signage and stopped, thinking he had completed the race. A Spanish runner, Ivan Fernandez, was right behind him. He noticed the situation and signalled(17) the Kenyan to continue running. However, Mutai could not comprehend(18) the language. Seeing the situation, Fernandez gently nudged(19) Mutai forward, ensuring he crossed the finish line first. When asked by a journalist why he acted this way, Fernandez said, 'If I had taken advantage of the situation, I wouldn't have earned the medal honesty( ng he crossed the finish line."}, {"key": "C", "value": "tapped", "Explanation": "Incorrect. 'Tapped' means to strike lightly. While gentle, it doesn't convey the active guiding that happened."}, {"key": "D", "value": "pushed", "Explanation": "Incorrect. Although 'pushed' could describe a forward motion, it doesn't capture the gentle, respectful guidance that Fernandez provided."}], "full_passage": "Abel Mutai, a Kenyan runner, was just a few metres from the finish line. Suddenly, he became bewildered(16) by the signage and stopped, thinking he had completed the race. A Spanish runner, Ivan Fernandez, was right behind him. He noticed the situation and signalled(17) the Kenyan to continue running. However, Mutai could not comprehend(18) the language. Seeing the situation, Fernandez gently nudged(19) Mutai forward, ensuring he crossed the finish line first. When asked by a journalist why he acted this way, Fernandez said, 'If I had taken advantage of the situation, I wouldn't have earned the medal honesty(20). My mother has always taught me to make choices that I can be proud of.'", "category": "Precise Verbs"}, {"id": "prelim2025_henrypark_eng_q20", "source": "Prelim 2025 Henry Park", "section": "Vocabulary Cloze", "qNum": 20, "sentence": "Abel Mutai, a Kenyan runner, was just a few metres from the finish line. Suddenly, he became bewildered by the signage and stopped, thinking he had completed the race. A Spanish runner, Ivan Fernandez, was right behind him. He noticed the situation and signalled the Kenyan to continue running. However, Mutai could not comprehend the language. Seeing the situation, Fernandez gently nudged Mutai forward, ensuring he crossed the finish line first. When asked by a journalist why he acted this way, Fernandez said, 'If I had taken advantage of the situation, I wouldn't have earned the medal honesty(20). My mother has always taught me to make choices that I can be proud of.'", "options": ["easily", "eagerly", "rightfully", "reluctantly"], "value": "delighted", "Explanation": "Incorrect. While hikers might be happy to reach the summit, 'delighted' doesn't describe the physical state caused by a long trek."}, {"key": "B", "value": "refreshed", "Explanation": "Incorrect. 'Refreshed' means energized or revived, which is the opposite of what would result from a strenuous climb."}, {"key": "C", "value": "energised", "Explanation": "Incorrect. 'Energised' means full of energy, but a long trek would deplete energy, not provide it."}, {"key": "D", "value": "exhausted", "Explanation": "Correct. 'Exhausted' means extremely tired, which is the natural result of a long and strenuous trek up a mountain."}], "category": "Adjectives"}, {"id": "prelim2025_mgs_eng_q12", "source": "Prelim 2025 MGS", "section": "Vocabulary MCQ", "qNum": 12, "sentence": "The magician's trick was so ________ that the audience gasped in amazement.", "options": ["ordinary", "common", "familiar", "spectacular"], "answerIndex": 4, "answer": "spectacular", "grammarTopic": "Vocabulary - adjectives of quality", "option_explanations": [{"key": "A", "value": "ordinary", "Explanation": "Incorrect. An ordinary trick would not cause amazement or gasping from the audience."}, {"key": "B", "value": "common", "Explanation": "Incorrect. 'Common' means frequent or typical. A common trick would not surprise or impress an audience."}, {"key": "C", "value": "familiar", "Explanation": "Incorrect. If the trick were familiar, the audience would not be amazed or gasp."}, {"key": "D", "value": "spectacular", "Explanation": "Correct. 'Spectacular' means impressive and striking. This explains why the audience was amazed and gasped."}], "category": "Adjectives"}, {"id": "prelim2025_mgs_eng_q13", "source": "Prelim 2025 MGS", "section": "Vocabulary MCQ", "qNum": 13, "sentence": "Please ________ your shoes before entering the house.", "options": ["put on", "remove", "wear", "carry"], "answerIndex": 2, "answer": "remove", "grammarTopic": "Vocabulary - verbs related to clothing", "option_explanations": [{"key": "A", "value": "put on", "Explanation": "Incorrect. 'Put on' means to wear or dress in, which is the opposite of what is needed before entering a house where shoes are removed."}, {"key": "B", "value": "remove", "Explanation": "Correct. 'Remove' means to take off. This is the standard action of taking off shoes before entering a house."}, {"key": "C", "value": "wear", "Explanation": "Incorrect. 'Wear' means to have on one's body. Taking off shoes is the opposite action."}, {"key": "D", "value": "carry", "Explanation": "Incorrect. 'Carry' means to hold and transport. While you could carry shoes, it's not the standard practice when entering a house."}], "category": "Precise Verbs"}, {"id": "prelim2025_mgs_eng_q14", "source": "Prelim 2025 MGS", "section": "Vocabulary MCQ", "qNum": 14, "sentence": "She spoke with such ________ that everyone in the room believed her story.", "options": ["fear", "doubt", "hesitation", "conviction"], "answerIndex": 4, "answer": "conviction", "grammarTopic": "Vocabulary - nouns expressing manner of speaking", "option_explanations": [{"key": "A", "value": "fear", "Explanation": "Incorrect. Speaking with fear would make people doubt her, not believe her story."}, {"key": "B", "value": "doubt", "Explanation": "Incorrect. Speaking with doubt would also make people skeptical, not believing."}, {"key": "C", "value": "hesitation", "Explanation": "Incorrect. Hesitation suggests uncertainty, which would prevent people from believing her story."}, {"key": "D", "value": "conviction", "Explanation": "Correct. 'Conviction' means firm belief or certainty. Speaking with conviction makes her story credible and convincing."}], "category": "Nouns"}, {"id": "prelim2025_mgs_eng_q15", "source": "Prelim 2025 MGS", "section": "Vocabulary MCQ", "qNum": 15, "sentence": "The company decided to ________ its operations to other countries.", "options": ["reduce", "expand", "limit", "restrict"], "answerIndex": 2, "answer": "expand", "grammarTopic": "Vocabulary - verbs of business growth", "option_explanations": [{"key": "A", "value": "reduce", "Explanation": "Incorrect. 'Reduce' means to make smaller. If the company is extending to other countries, it is growing, not shrinking."}, {"key": "B", "value": "expand", "Explanation": "Correct. 'Expand' means to grow or extend. Taking operations to other countries represents business expansion."}, {"key": "C", "value": "limit", "Explanation": "Incorrect. 'Limit' means to restrict or reduce scope, which contradicts the action of opening to new countries."}, {"key": "D", "value": "restrict", "Explanation": "Incorrect. 'Restrict' means to limit or confine. Expanding to other countries is the opposite of restricting."}], "category": "Precise Verbs"}, {"id": "prelim2025_mgs_eng_q16", "source": "Prelim 2025 MGS", "section": "Vocabulary Cloze", "qNum": 16, "sentence": "Too much screen time is bad for children. Social media may be one of the reasons that mental health among young people seems to be getting worse(16). Additionally(17), children who use electronic devices for long periods of time may develop poor posture. They also risk suffering from headaches and eye problems. This is especially(18) concerning for very young children. Furthermore, it is easy for young children to be targeted by criminals who take advantage of(19) them online. For all these reasons, younger children are prone(20) to screen addiction and its damaging effects.", "options": ["dissipating", "depreciating", "deteriorating", "disintegrating"], "answerIndex": 3, "answer": "deteriorating", "grammarTopic": "Vocabulary in context", "option_explanations": [{"key": "A", "value": "dissipating", "Explanation": "Incorrect. 'Dissipating' means disappearing or dispersing. Mental health is not disappearing; it is becoming worse."}, {"key": "B", "value": "depreciating", "Explanation": "Incorrect. 'Depreciating' typically refers to a decrease in value (often used for assets). It's not the righ ": ["mainly", "usually", "commonly", "particularly"], "answerIndex": 4, "answer": "particularly", "grammarTopic": "Vocabulary in context - adverbs of emphasis", "option_explanations": [{"key": "A", "value": "mainly", "Explanation": "Incorrect. 'Mainly' means chiefly or primarily, but the context requires emphasis on significance rather than proportion."}, {"key": "B", "value": "usually", "Explanation": "Incorrect. 'Usually' means commonly or normally, but the context is emphasizing special concern, not typical occurrence."}, {"key": "C", "value": "commonly", "Explanation": "Incorrect. 'Commonly' means frequently or regularly, but the emphasis here is on special worry, not frequency."}, {"key": "D", "value": "particularly", "Explanation": "Correct. 'Particularly' means 'especially' or 'to a notable degree', emphasizing special concern for very young children."}], "full_passage": "Too much screen time is bad for children. Social media may be one of the reasons that mental health among young people seems to be getting worse(16). Additionally(17), children who use electronic devices for long periods of time may develop poor posture. They also risk suffering from headaches and eye problems. This is especially(18) concerning for very young children. Furthermore, it is easy for young children to be targeted by criminals who take advantage of(19) them online. For all these reasons, younger children are prone(20) to screen addiction and its damaging effects.", "category": "Adverbs"}, {"id": "prelim2025_mgs_eng_q19", "source": "Prelim 2025 MGS", "section": "Vocabulary Cloze", "qNum": 19, "sentence": "Too much screen time is bad for children. Social media may be one of the reasons that mental health among young people seems to be getting worse(16). Additionally(17), children who use electronic devices for long periods of time may develop poor posture. They also risk suffering from headaches and eye problems. This is especially(18) concerning for very young children. Furthermore, it is easy for young children to be targeted by criminals who take advantage of(19) them online. For all these reasons, younger children are prone(20) to screen addiction and its damaging effects.", "options": ["exploit", "misuse", "swindle", "deceive"], "answerIndex": 1, "answer": "exploit", "grammarTopic": "Vocabulary in context - verb synonyms", "option_explanations": [{"key": "A", "value": "exploit", "Explanation": "Correct. 'Exploit' means to take unfair advantage of someone. Criminals exploit young children's vulnerability online."}, {"key": "B", "value": "misuse", "Explanation": "Incorrect. 'Misuse' means to use incorrectly or for the wrong purpose. It doesn't capture the predatory aspect of criminals targeting children."}, {"key": "C", "value": "swindle", "Explanation": "Incorrect. 'Swindle' specifically means to cheat someone out of money or property, which is too narrow for the context."}, {"key": "D", "value": "deceive", "Explanation": "Incorrect. While 'deceive' relates to criminals' actions, 'exploit' better captures the full meaning of taking unfair advantage."}], "full_passage": "Too much screen time is bad for children. Social media may be one of the reasons that mental health among young people seems to be getting worse(16). Additionally(17), children who use electronic devices for long periods of time may develop poor posture. They also risk suffering from headaches and eye problems. This is especially(18) concerning for very young children. Furthermore, it is easy for young children to be targeted by criminals who take advantage of(19) them online. For all these reasons, younger children are prone(20) to screen addiction and its damaging effects.", "category": "Precise Verbs"}, {"id": "prelim2025_mgs_eng_q20", "source": "Prelim 2025 MGS", "section": "Vocabulary Cloze", "qNum": 20, "sentence": "Too much screen time is bad for children. Social media may be one of the reasons that mental health among young people seems to be getting worse(16). Additionally(17), children who use electronic devices for long periods of time may develop poor posture. They also risk suffering from headaches and eye problems. This is especially(18) concerning for very young children. Furthermore, it is easy for young children to be targeted by criminals who take advantage of(19) them online. For all these reasons, younger children are prone(20) to screen addiction and its damaging effects.", "options": ["averse", "exposed", "responsive", "susceptible"], "answerIndex": 4, "answer": "susceptible", "grammarTopic": "Vocabulary in context - adjectives describing vulnerability", "option_explanations": [{"key": "A", "value": "averse", "Explanation": "Incorrect. 'Averse' means having a strong dislike for something. The context is about vulnerability to addiction, not dislike."}, {"key": "B", "value": "exposed", "Explanation": "Incorrect. 'Exposed' means unprotected or revealed, but 'susceptible' better conveys the meaning of being vulnerable to developing an addiction."}, {"key": "C", "value": "responsive", "Explanation": "Incorrect. 'Responsive' means reacting quickly or showing response, which doesn't fit the context of addiction vulnerability."}, {"key": "D", "value": "susceptible", "Explanation": "Correct. 'Susceptible' means easily affected or vulnerable to something. Younger children are susceptible to screen addiction."}], "full_passage": "Too much screen time is bad for children. Social media may be one of the reasons that mental health among young people seems to be getting worse(16). Additionally(17), children who use electronic devices for long periods of time may develop poor posture. They also risk suffering from headaches and eye problems. This is especially(18) concerning for very young children. Furthermore, it is easy for young children to be targeted by criminals who take advantage of(19) them online. For all these reasons, younger children are prone(20) to screen addiction and its damaging effects.", "category": "Adjectives"}, {"id": "prelim2025_nanhua_eng_q11", "source": "Prelim 2025 NanHua", "section": "Vocabulary MCQ", "qNum": 11, "sentence": "The athlete's ________ to succeed was evident from her rigorous training schedule.", "options": ["ability", "courage", "ambition", "determination"], "answerIndex": 4, "answer": "determination", "grammarTopic": "Vocabulary - nouns describing drive", "option_explanations": [{"key": "A", "value": "ability", "Explanation": "Incorrect. 'Ability' refers to a skill or capacity to do something, not the drive or resolve to succeed."}, {"key": "B", "value": "courage", "Explanation": "Incorrect. 'Courage' means bravery, which doesn't directly relate to rigorous training for success."}, {"key": "C", "value": "ambition", "Explanation": "Incorrect. While 'ambition' (desire to achieve) is related, 'determination' (firm resolve) better describes the strong commitment shown by rigorous training."}, {"key": "D", "value": "determination", "Explanation": "Correct. 'Determination' means firm resolve and commitment. A rigorous training schedule clearly demonstrates determination to succeed."}], "category": "Nouns"}, {"id": "prelim2025_nanhua_eng_q12", "source": "Prelim 2025 NanHua", "section": "Vocabulary MCQ", "qNum": 12, "sentence": "The chef prepared the dish ________, ensuring that every ingredient was measured perfectly.", "options": ["hastily", "carelessly", "generously", "meticulously"], "answerIndex": 4, "answer": "meticulously", "grammarTopic": "Vocabulary - adverbs of manner", "option_explanations": [{"key": "A", "value": "hastily", "Explanation": "Incorrect. 'Hastily' means hurriedly, which contradicts the careful measurement implied by 'perfectly'."}, {"key": "B", "value": "carelessly", "Explanation": "Incorrect. 'Carelessly' means without care, but the sentence emphasizes precision in measurement."}, {"key": "C", "value": "generously", "Explanation": "Incorrect. 'Generously' refers to giving large amounts, not to careful attention to detail."}, {"key": "D", "value": "meticulously", "Explanation": "Correct. 'Meticulously' means with great attention to detail. It perfectly describes careful, precise measurement of ingredients."}], "category": "Adverbs"}, {"id": "prelim2025_nanhua_eng_q13", "source": "Prelim 2025 NanHua", "section": "Vocabulary MCQ", "qNum": 13, "sentence": "The documentary about ocean life was ________ and held the audience's attention throughout.", "options": ["boring", "lengthy", "captivating", "predictable"], "answerIndex": 3, "answer": "captivating", "grammarTopic": "Vocabulary - adjectives", "option_explanations": [{"key": "A", "value": "boring", "Explanation": "Incorrect. 'Boring' means dull, which contradicts holding the audience's attention."}, {"key": "B", "value": "lengthy", "Explanation": "Incorrect. 'Lengthy' refers to length, but the sentence emphasizes holding attention, not duration."}, {"key": "C", "value": "captivating", "Explanation": "Correct. 'Captivating' means fascinating and holding attention. It perfectly explains why the documentary held the audience's attention throughout."}, {"key": "D", "value": "predictable", "Explanation": "Incorrect. 'Predictable' means easily guessed in advance, which would not necessarily hold attention."}], "category": "Adjectives"}, {"id": "prelim2025_nanhua_eng_q14", "source": "Prelim 2025 NanHua", "section": "Vocabulary MCQ", "qNum": 14, "sentence": "Before submitting the report, please ________ it to check for any errors.", "options": ["write up", "look over", "hand out", "put aside"], "answerIndex": 2, "answer": "look over", "grammarTopic": "Phrasal verbs", "option_explanations": [{"key": "A", "value": "write up", "Explanation": "Incorrect. 'Write up' means to compose or create a document, not to review it."}, {"key": "B", "value": "look over", "Explanation": "Correct. 'Look over' means to review or examine carefully. It's the idiomatic phrasal verb for checking a report for errors."}, {"key": "C", "value": "hand out", "Explanation": "Incorrect. 'Hand out' means to distribute or give to people, not to review a document."}, {"key": "D", "value": "put aside", "Explanation": "Incorrect. 'Put aside' means to set something away temporarily, not to review it."}], "category": "Phrasal Verbs"}, {"id": "prelim2025_nanhua_eng_q15", "source": "Prelim 2025 NanHua", "section": "Vocabulary MCQ", "qNum": 15, "sentence": "The small box could not ________ all the toys that the children wanted to keep.", "options": ["hold", "contain", "include", "support"], "answerIndex": 2, "answer": "contain", "grammarTopic": "Vocabulary - verbs", "option_explanations": [{"key": "A", "value": "hold", "Explanation": "Incorrect. While 'hold' could work, it's less precise than 'contain' for describing what a container can fit."}, {"key": "B", "value": "contain", "Explanation": "Correct. 'Contain' means to be able to hold or include within limits. It's the appropriate word for describing what a box can fit inside."}, {"key": "C", "value": "include", "Explanation": "Incorrect. 'Include' typically refers to being part of a group or list, not to physical capacity."}, {"key": "D", "value": "support", "Explanation": "Incorrect. 'Support' means to hold up or provide assistance, not to fit items inside a container."}], "category": "Precise Verbs"}, {"id": "prelim2025_nanhua_eng_q16", "source": "Prelim 2025 NanHua", "section": "Vocabulary Cloze", "qNum": 16, "sentence": "When we first brought Marley home, he was a tiny puppy with oversized paws and endless energy. He fitted into our hearts in the blink of an eye(16), becoming a part of our daily routines. Every morning, Marley would wait by the door, his tail wagging back and forth, eager for his walk.", "options": ["instantly", "regularly", "gradually", "eventually"], "answerIndex": 1, "answer": "instantly", "grammarTopic": "Vocabulary in context", "option_explanations": [{"key": "A", "value": "instantly", "Explanation": "Correct. 'In the blink of an eye' is an idiom meaning very quickly or instantly. Marley became part of their family immediately."}, {"key": "B", "value": "regularly", "Explanation": "Incorrect. 'Regularly' means repeatedly at intervals, not immediately upon arrival."}, {"key": "C", "value": "gradually", "Explanation": "Incorrect. 'Gradually' means slowly over time, but the phrase 'in the blink of an eye' emphasizes speed and immediacy."}, {"key": "D", "value": "eventually", "Explanation": "Incorrect. 'Eventually' means finally after a long time, contradicting the immediacy of 'in the blink of an eye'."}], "full_passage": "When we first brought Marley home, he was a tiny puppy with oversized paws and endless energy. He fitted into our hearts in the blink of an eye(16), becoming a part of our daily routines. Every morning, Marley would wait by the door, his tail wagging back and forth, eager for his walk.\n\n'Marley, you always know how to cheer me up,' I said one morning as I put on his leash. He looked up at me with his big eyes, as if he comprehended(17) every word. Despite his mischievous nature, Marley had a knack for finding the most comfortable spot in the house, usually our favourite couch. His playful antics and boundless(18) enthusiasm brought both chaos and joy to our lives. Marley was undeniably(19) clumsy, often knocking over vases and scattering newspapers around the house.\n\nYet, in the evenings, he would curl up beside us, breathing quietly, offering a sense of lasting companionship(20) that words couldn't describe. Through all the ups and downs, Marley remained by our side, teaching us about loyalty and love.", "category": "Adverbs"}, {"id": "prelim2025_nanhua_eng_q17", "source": "Prelim 2025 NanHua", "section": "Vocabulary Cloze", "qNum": 17, "sentence": "'Marley, you always know how to cheer me up,' I said one morning as I put on his leash. He looked up at me with his big eyes, as if he comprehended(17) every word. Despite his mischievous nature, Marley had a knack for finding the most comfortable spot in the house, usually our favourite couch. His playful antics and boundless(18) enthusiasm brought both chaos and joy to our lives. Marley was undeniably(19) clumsy, often knocking over vases and scattering newspapers around the house.", "options": ["felt", "anticipated", "recognised", "understood"], "answerIndex": 4, "answer": "understood", "grammarTopic": "Vocabulary in context", "option_explanations": [{"key": "A", "value": "felt", "Explanation": "Incorrect. 'Felt' refers to emotional or physical sensations, but the sentence is about understanding language."}, {"key": "B", "value": "anticipated", "Explanation": "Incorrect. 'Anticipated' means to expect something in advance, not to understand spoken words."}, {"key": "C", "value": "recognised", "Explanation": "Incorrect. 'Recognised' means to identify or know, but doesn't capture the meaning of understanding language."}, {"key": "D", "value": "understood", "Explanation": "Correct. 'Comprehended' and 'understood' are synonymous. The sentence suggests the puppy understood the speaker's words."}], "full_passage": "When we first brought Marley home, he was a tiny puppy with oversized paws and endless energy. He fitted into our hearts in the blink of an eye(16), becoming a part of our daily routines. Every morning, Marley would wait by the door, his tail wagging back and forth, eager for his walk.\n\n'Marley, you always know how to cheer me up,' I said one morning as I put on his leash. He looked up at me with his big eyes, as if he comprehended(17) every word. Despite his mischievous nature, Marley had a knack for finding the most comfortable spot in the house, usually our favourite couch. His playful antics and boundless(18) enthusiasm brought both chaos and joy to our lives. Marley was undeniably(19) clumsy, often knocking over vases and scattering newspapers around the house.\n\nYet, in the evenings, he would curl up beside us, breathing quietly, offering a sense of lasting companionship(20) that words couldn't describe. Through
