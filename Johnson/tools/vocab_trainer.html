bit caught Lisa's eye and stole her heart. \"Please, Mum! I promise I'll take good care of it!\" Lisa pleaded(16), clasping her hands. Mrs Loh thought Lisa was old enough to take on the task(17) of caring for a pet and approached the store assistant to make some enquiries. The conversation led to him asking them if they had owned pets before and if they knew about caring for rabbits. \"It's for the sake(18) of the animals,\" explained the store assistant. He had to ensure potential(19) pet owners know what was involved so that people would not buy pets on a whim(20). Then he patiently went through some tips on caring for a rabbit. Mrs Loh and Lisa thought it over before they purchased the rabbit that day.", "sentence": "\"Please, Mum! I promise I'll take good care of it!\" Lisa pleaded, clasping her hands.", "targetWord": "pleaded", "options": ["declared", "asserted", "appealed", "emphasised"], "answerIndex": 3, "answer": "appealed", "option_explanations": [{"key": "A", "value": "declared", "Explanation": "'Declared' means to state firmly or officially. 'Pleaded' conveys begging, not a firm statement."}, {"key": "B", "value": "asserted", "Explanation": "'Asserted' means to state confidently. 'Pleaded' is much softer and more desperate than asserting."}, {"key": "C", "value": "appealed", "Explanation": "Correct. 'Appealed' means to make an earnest request. 'Pleaded' and 'appealed' both convey asking desperately, with clasped hands showing desperation."}, {"key": "D", "value": "emphasised", "Explanation": "'Emphasised' means to stress or give importance to. It doesn't capture the begging quality of 'pleaded'."}], "full_passage": "At the pet store, a fluffy white rabbit caught Lisa's eye and stole her heart. \"Please, Mum! I promise I'll take good care of it!\" Lisa pleaded(16), clasping her hands. Mrs Loh thought Lisa was old enough to take on the task(17) of caring for a pet and approached the store assistant to make some enquiries. The conversation led to him asking them if they had owned pets before and if they knew about caring for rabbits. \"It's for the sake(18) of the animals,\" explained the store assistant. He had to ensure potential(19) pet owners know what was involved so that people would not buy pets on a whim(20). Then he patiently went through some tips on caring for a rabbit. Mrs Loh and Lisa thought it over before they purchased the rabbit that day.", "category": "Precise Verbs"}, {"id": "psle2021_eng_q17", "source": "PSLE 2021 English", "section": "Vocabulary Cloze", "qNum": 17, "passage": "At the pet store, a fluffy white rabbit caught Lisa's eye and stole her heart. \"Please, Mum! I promise I'll take good care of it!\" Lisa pleaded(16), clasping her hands. Mrs Loh thought Lisa was old enough to take on the task(17) of caring for a pet and approached the store assistant to make some enquiries. The conversation led to him asking them if they had owned pets before and if they knew about caring for rabbits. \"It's for the sake(18) of the animals,\" explained the store assistant. He had to ensure potential(19) pet owners know what was involved so that people would not buy pets on a whim(20). Then he patiently went through some tips on caring for a rabbit. Mrs Loh and Lisa thought it over before they purchased the rabbit that day.", "sentence": "Mrs Loh thought Lisa was old enough to take on the task of caring for a pet.", "targetWord": "task", "options": ["mission", "obligation", "assignment", "responsibility"], "answerIndex": 4, "answer": "responsibility", "option_explanations": [{"key": "A", "value": "mission", "Explanation": "'Mission' implies a special or important purpose, often with a sense of duty. Caring for a pet is more of a day-to-day responsibility than a mission."}, {"key": "B", "value": "obligation", "Explanation": "'Obligation' means something you must do, often legally or morally. While caring for a pet involves obligation, 'task' here is about the practical work involved."}, {"key": "C", "value": "assignment", "Explanation": "'Assignment' means a piece of work given by someone else. Lisa chose to want the pet — it wasn't assigned to her."}, {"key": "D", "value": "responsibility", "Explanation": "Correct. 'Responsibility' means a duty or task you are expected to carry out. Taking on the 'task' of caring for a pet means taking on the responsibility."}], "full_passage": "At the pet store, a fluffy white rabbit caught Lisa's eye and stole her heart. \"Please, Mum! I promise I'll take good care of it!\" Lisa pleaded(16), clasping her hands. Mrs Loh thought Lisa was old enough to take on the task(17) of caring for a pet and approached the store assistant to make some enquiries. The conversation led to him asking them if they had owned pets before and if they knew about caring for rabbits. \"It's for the sake(18) of the animals,\" explained the store assistant. He had to ensure potential(19) pet owners know what was involved so that people would not buy pets on a whim(20). Then he patiently went through some tips on caring for a rabbit. Mrs Loh and Lisa thought it over before they purchased the rabbit that day.", "category": "Nouns"}, {"id": "psle2021_eng_q18", "source": "PSLE 2021 English", "section": "Vocabulary Cloze", "qNum": 18, "passage": "At the pet store, a fluffy white rabbit caught Lisa's eye and stole her heart. \"Please, Mum! I promise I'll take good care of it!\" Lisa pleaded(16), clasping her hands. Mrs Loh thought Lisa was old enough to take on the task(17) of caring for a pet and approached the store assistant to make some enquiries. The conversation led to him asking them if they had owned pets before and if they knew about caring for rabbits. \"It's for the sake(18) of the animals,\" explained the store assistant. He had to ensure potential(19) pet owners know what was involved so that people would not buy pets on a whim(20). Then he patiently went through some tips on caring for a rabbit. Mrs Loh and Lisa thought it over before they purchased the rabbit that day.", "sentence": "\"It's for the sake of the animals,\" explained the store assistant.", "targetWord": "sake", "options": ["welfare", "support", "concern", "defence"], "answerIndex": 1, "answer": "welfare", "option_explanations": [{"key": "A", "value": "welfare", "Explanation": "Correct. 'For the sake of' means for the benefit or wellbeing of. 'Welfare' means health, happiness, and wellbeing — the closest match."}, {"key": "B", "value": "support", "Explanation": "'Support' means to help or assist. 'For the sake of' is about benefit and wellbeing, not providing support."}, {"key": "C", "value": "concern", "Explanation": "'Concern' means worry or interest. While related, 'sake' specifically means benefit or wellbeing."}, {"key": "D", "value": "defence", "Explanation": "'Defence' means protection from attack. The store assistant is talking about the animals' wellbeing, not defending them from threats."}], "full_passage": "At the pet store, a fluffy white rabbit caught Lisa's eye and stole her heart. \"Please, Mum! I promise I'll take good care of it!\" Lisa pleaded(16), clasping her hands. Mrs Loh thought Lisa was old enough to take on the task(17) of caring for a pet and approached the store assistant to make some enquiries. The conversation led to him asking them if they had owned pets before and if they knew about caring for rabbits. \"It's for the sake(18) of the animals,\" explained the store assistant. He had to ensure potential(19) pet owners know what was involved so that people would not buy pets on a whim(20). Then he patiently went through some tips on caring for a rabbit. Mrs Loh and Lisa thought it over before they purchased the rabbit that day.", "category": "Nouns"}, {"id": "psle2021_eng_q19", "source": "PSLE 2021 English", "section": "Vocabulary Cloze", "qNum": 19, "passage": "At the pet store, a fluffy white rabbit caught Lisa's eye and stole her heart. \"Please, Mum! I promise I'll take good care of it!\" Lisa pleaded(16), clasping her hands. Mrs Loh thought Lisa was old enough to take on the task(17) of caring for a pet and approached the store assistant to make some enquiries. The conversation led to him asking them if they had owned pets before and if they knew about caring for rabbits. \"It's for the sake(18) of the animals,\" explained the store assistant. He had to ensure potential(19) pet owners know what was involved so that people would not buy pets on a whim(20). Then he patiently went through some tips on caring for a rabbit. Mrs Loh and Lisa thought it over before they purchased the rabbit that day.", "sentence": "He had to ensure potential pet owners know what was involved.", "targetWord": "potential", "options": ["suitable", "possible", "interested", "successful"], "answerIndex": 2, "answer": "possible", "option_explanations": [{"key": "A", "value": "suitable", "Explanation": "'Suitable' means appropriate or fitting. 'Potential' doesn't judge suitability — it means they might become pet owners."}, {"key": "B", "value": "possible", "Explanation": "Correct. 'Potential' means having the possibility to become something. 'Potential pet owners' = possible future pet owners."}, {"key": "C", "value": "interested", "Explanation": "'Interested' means showing curiosity. While potential owners may be interested, 'potential' specifically means possible/future."}, {"key": "D", "value": "successful", "Explanation": "'Successful' means achieving a desired result. 'Potential' doesn't imply success, just possibility."}], "full_passage": "At the pet store, a fluffy white rabbit caught Lisa's eye and stole her heart. \"Please, Mum! I promise I'll take good care of it!\" Lisa pleaded(16), clasping her hands. Mrs Loh thought Lisa was old enough to take on the task(17) of caring for a pet and approached the store assistant to make some enquiries. The conversation led to him asking them if they had owned pets before and if they knew about caring for rabbits. \"It's for the sake(18) of the animals,\" explained the store assistant. He had to ensure potential(19) pet owners know what was involved so that people would not buy pets on a whim(20). Then he patiently went through some tips on caring for a rabbit. Mrs Loh and Lisa thought it over before they purchased the rabbit that day.", "category": "Adjectives"}, {"id": "psle2021_eng_q20", "source": "PSLE 2021 English", "section": "Vocabulary Cloze", "qNum": 20, "passage": "At the pet store, a fluffy white rabbit caught Lisa's eye and stole her heart. \"Please, Mum! I promise I'll take good care of it!\" Lisa pleaded(16), clasping her hands. Mrs Loh thought Lisa was old enough to take on the task(17) of caring for a pet and approached the store assistant to make some enquiries. The conversation led to him asking them if they had owned pets before and if they knew about caring for rabbits. \"It's for the sake(18) of the animals,\" explained the store assistant. He had to ensure potential(19) pet owners know what was involved so that people would not buy pets on a whim(20). Then he patiently went through some tips on caring for a rabbit. Mrs Loh and Lisa thought it over before they purchased the rabbit that day.", "sentence": "...so that people would not buy pets on a whim.", "targetWord": "on a whim", "options": ["impulsively", "compulsively", "unexpectedly", "uncontrollably"], "answerIndex": 1, "answer": "impulsively", "option_explanations": [{"key": "A", "value": "impulsively", "Explanation": "Correct. 'On a whim' means without careful thought, acting on a sudden desire. 'Impulsively' means acting without thinking, which is the closest match."}, {"key": "B", "value": "compulsively", "Explanation": "'Compulsively' means driven by an irresistible urge, often repeated. 'On a whim' is about a single spontaneous decision, not a compulsive pattern."}, {"key": "C", "value": "unexpectedly", "Explanation": "'Unexpectedly' means without warning. 'On a whim' is about the buyer's spontaneous decision, not about something being unexpected."}, {"key": "D", "value": "uncontrollably", "Explanation": "'Uncontrollably' means without control. 'On a whim' suggests a casual, spontaneous choice, not an uncontrollable urge."}], "full_passage": "At the pet store, a fluffy white rabbit caught Lisa's eye and stole her heart. \"Please, Mum! I promise I'll take good care of it!\" Lisa pleaded(16), clasping her hands. Mrs Loh thought Lisa was old enough to take on the task(17) of caring for a pet and approached the store assistant to make some enquiries. The conversation led to him asking them if they had owned pets before and if they knew about caring for rabbits. \"It's for the sake(18) of the animals,\" explained the store assistant. He had to ensure potential(19) pet owners know what was involved so that people would not buy pets on a whim(20). Then he patiently went through some tips on caring for a rabbit. Mrs Loh and Lisa thought it over before they purchased the rabbit that day.", "category": "Adverbs"}, {"id": "psle2020_eng_q11", "source": "PSLE 2020", "section": "Vocabulary MCQ", "qNum": 11, "sentence": "Usha had to ________ more responsibilities when she became the leader of the debate team.", "options": ["take in", "take to", "take on", "take after"], "answerIndex": 3, "answer": "take on", "option_explanations": [{"key": "A", "value": "take in", "Explanation": "'Take in' means to absorb information or to provide shelter. It does not mean to accept responsibilities."}, {"key": "B", "value": "take to", "Explanation": "'Take to' means to develop a liking for something. It does not mean to accept or acquire responsibilities."}, {"key": "C", "value": "take on", "Explanation": "Correct. The phrasal verb 'take on' means to acquire or accept something, such as responsibilities or a new role."}, {"key": "D", "value": "take after", "Explanation": "'Take after' means to resemble a family member in appearance or character. It does not relate to responsibilities."}], "category": "Phrasal Verbs"}, {"id": "psle2020_eng_q12", "source": "PSLE 2020", "section": "Vocabulary MCQ", "qNum": 12, "sentence": "By sharing their ideas with one another, the pupils ________ that there were different ways of looking at the problem to solve it.", "options": ["assumed", "presumed", "discovered", "anticipated"], "answerIndex": 3, "answer": "discovered", "option_explanations": [{"key": "A", "value": "assumed", "Explanation": "'Assumed' means to suppose something without proof. The pupils did not guess — they became aware through sharing ideas."}, {"key": "B", "value": "presumed", "Explanation": "'Presumed' means to suppose based on probability. The pupils actually found out about different ways, not just presumed."}, {"key": "C", "value": "discovered", "Explanation": "Correct. 'Discovered' means to become aware of something new. By sharing ideas, the pupils found out that there were different ways to solve the problem."}, {"key": "D", "value": "anticipated", "Explanation": "'Anticipated' means to expect or predict something. The pupils did not predict the different approaches; they found them through sharing."}], "category": "Precise Verbs"}, {"id": "psle2020_eng_q13", "source": "PSLE 2020", "section": "Vocabulary MCQ", "qNum": 13, "sentence": "The news report provided a short ________ of the incident before going into the details of what happened.", "options": ["draft", "extract", "briefing", "summary"], "answerIndex": 4, "answer": "summary", "option_explanations": [{"key": "A", "value": "draft", "Explanation": "'Draft' refers to a preliminary version of a document. A news report would not provide a 'draft' of an incident."}, {"key": "B", "value": "extract", "Explanation": "'Extract' means a passage taken from a text. It does not mean a short overview of an incident."}, {"key": "C", "value": "briefing", "Explanation": "'Briefing' is a meeting or session where information is given. It does not fit as a noun describing a short written description."}, {"key": "D", "value": "summary", "Explanation": "Correct. A 'summary' is a short description that gives the main idea of something. The news report gave a summary before the details."}], "category": "Nouns"}, {"id": "psle2020_eng_q14", "source": "PSLE 2020", "section": "Vocabulary MCQ", "qNum": 14, "sentence": "Few soccer players can ________ Yong Han in his ability to dribble and score a goal.", "options": ["rival", "defend", "oppose", "obstruct"], "answerIndex": 1, "answer": "rival", "option_explanations": [{"key": "A", "value": "rival", "Explanation": "Correct. 'Rival' means to compete with or match someone. Few players can rival (match or compete with) Yong Han's skill."}, {"key": "B", "value": "defend", "Explanation": "'Defend' means to protect against attack. It does not mean to match someone's ability."}, {"key": "C", "value": "oppose", "Explanation": "'Oppose' means to resist or be against something. It does not convey the idea of matching someone's skill level."}, {"key": "D", "value": "obstruct", "Explanation": "'Obstruct' means to block or hinder. It does not mean to equal someone in ability."}], "category": "Precise Verbs"}, {"id": "psle2020_eng_q15", "source": "PSLE 2020", "section": "Vocabulary MCQ", "qNum": 15, "sentence": "A whale was spotted near the ship, so the passengers ________ their lunch midway and rushed off to see it.", "options": ["abolished", "discarded", "dismissed", "abandoned"], "answerIndex": 4, "answer": "abandoned", "option_explanations": [{"key": "A", "value": "abolished", "Explanation": "'Abolished' means to formally put an end to a system or practice (e.g., abolish slavery). It is too formal and does not apply to leaving a meal."}, {"key": "B", "value": "discarded", "Explanation": "'Discarded' means to throw away something unwanted. The passengers did not throw away their lunch; they simply left it."}, {"key": "C", "value": "dismissed", "Explanation": "'Dismissed' means to send someone away or reject an idea. It does not mean to leave something behind."}, {"key": "D", "value": "abandoned", "Explanation": "Correct. 'Abandoned' means to give up something completely. The passengers abandoned their lunch to rush off and see the whale."}], "category": "Precise Verbs"}, {"id": "psle2020_eng_q16", "source": "PSLE 2020", "section": "Vocabulary Cloze", "qNum": 16, "sentence": "The late afternoon sun beat down at the stadium. Mike, a professional athlete, crouched on the ground with his feet against the starting blocks, similar to(16) a panther about to pounce. He had practised the push-off position countless(17) times just so his reaction to the starting call would become second nature(18) and he would not waste precious seconds. Earlier that day, he had gone through his usual activities(19) before a race – having light meals, resting and chatting with friends on the phone. Before the race, he did his warm-up with some mental preparation, picturing in his head in slow motion how he would run the race. Now in position, Mike calmed his nerves and willed(20) himself to focus on the race, chanting, “It’s now or never! I can do it!” The race would be over in less than a minute.", "options": ["signifying", "illustrating", "suggesting", "resembling"], "answerIndex": 4, "answer": "resembling", "option_explanations": [{"key": "A", "value": "signifying", "Explanation": "'Signifying' means to be a sign of or represent something. It does not mean to look like or be comparable to."}, {"key": "B", "value": "illustrating", "Explanation": "'Illustrating' means to explain or make clear by examples. It does not mean to look like something."}, {"key": "C", "value": "suggesting", "Explanation": "'Suggesting' means to put forward an idea or hint at something. It does not mean to look like or be comparable to."}, {"key": "D", "value": "resembling", "Explanation": "Correct. 'Similar to' means looking like or comparable to. 'Resembling' means to look like or be similar to, so it is the closest in meaning."}], "full_passage": "The late afternoon sun beat down at the stadium. Mike, a professional athlete, crouched on the ground with his feet against the starting blocks, similar to(16) a panther about to pounce. He had practised the push-off position countless(17) times just so his reaction to the starting call would become second nature(18) and he would not waste precious seconds. Earlier that day, he had gone through his usual activities(19) before a race – having light meals, resting and chatting with friends on the phone. Before the race, he did his warm-up with some mental preparation, picturing in his head in slow motion how he would run the race. Now in position, Mike calmed his nerves and willed(20) himself to focus on the race, chanting, “It’s now or never! I can do it!” The race would be over in less than a minute.", "category": "Precise Verbs"}, {"id": "psle2020_eng_q17", "source": "PSLE 2020", "section": "Vocabulary Cloze", "qNum": 17, "sentence": "The late afternoon sun beat down at the stadium. Mike, a professional athlete, crouched on the ground with his feet against the starting blocks, similar to(16) a panther about to pounce. He had practised the push-off position countless(17) times just so his reaction to the starting call would become second nature(18) and he would not waste precious seconds. Earlier that day, he had gone through his usual activities(19) before a race – having light meals, resting and chatting with friends on the phone. Before the race, he did his warm-up with some mental preparation, picturing in his head in slow motion how he would run the race. Now in position, Mike calmed his nerves and willed(20) himself to focus on the race, chanting, “It’s now or never! I can do it!” The race would be over in less than a minute.", "options": ["numerous", "abundant", "frequent", "various"], "answerIndex": 1, "answer": "numerous", "option_explanations": [{"key": "A", "value": "numerous", "Explanation": "Correct. 'Countless' means too many to be counted. 'Numerous' means very many, which is the closest in meaning."}, {"key": "B", "value": "abundant", "Explanation": "'Abundant' means existing in large quantities, often used for resources or supplies. It does not naturally collocate with 'times'."}, {"key": "C", "value": "frequent", "Explanation": "'Frequent' means happening often. While related, it describes regularity rather than a very large number, which is what 'countless' emphasises."}, {"key": "D", "value": "various", "Explanation": "'Various' means of different kinds. 'Countless' emphasises quantity (very many), not variety."}], "full_passage": "The late afternoon sun beat down at the stadium. Mike, a professional athlete, crouched on the ground with his feet against the starting blocks, similar to(16) a panther about to pounce. He had practised the push-off position countless(17) times just so his reaction to the starting call would become second nature(18) and he would not waste precious seconds. Earlier that day, he had gone through his usual activities(19) before a race – having light meals, resting and chatting with friends on the phone. Before the race, he did his warm-up with some mental preparation, picturing in his head in slow motion how he would run the race. Now in position, Mike calmed his nerves and willed(20) himself to focus on the race, chanting, “It’s now or never! I can do it!” The race would be over in less than a minute.", "category": "Adjectives"}, {"id": "psle2020_eng_q18", "source": "PSLE 2020", "section": "Vocabulary Cloze", "qNum": 18, "sentence": "The late afternoon sun beat down at the stadium. Mike, a professional athlete, crouched on the ground with his feet against the starting blocks, similar to(16) a panther about to pounce. He had practised the push-off position countless(17) times just so his reaction to the starting call would become second nature(18) and he would not waste precious seconds. Earlier that day, he had gone through his usual activities(19) before a race – having light meals, resting and chatting with friends on the phone. Before the race, he did his warm-up with some mental preparation, picturing in his head in slow motion how he would run the race. Now in position, Mike calmed his nerves and willed(20) himself to focus on the race, chanting, “It’s now or never! I can do it!” The race would be over in less than a minute.", "options": ["interior", "urgent", "instinctive", "quickened"], "answerIndex": 3, "answer": "instinctive", "option_explanations": [{"key": "A", "value": "interior", "Explanation": "'Interior' means relating to the inside. It does not capture the meaning of 'second nature', which is about something being automatic."}, {"key": "B", "value": "urgent", "Explanation": "'Urgent' means requiring immediate attention. 'Second nature' means something done automatically, not urgently."}, {"key": "C", "value": "instinctive", "Explanation": "Correct. 'Second nature' means something so familiar it can be done without thinking. 'Instinctive' means done automatically without conscious thought."}, {"key": "D", "value": "quickened", "Explanation": "'Quickened' means made faster. 'Second nature' is about automaticity, not speed."}], "full_passage": "The late afternoon sun beat down at the stadium. Mike, a professional athlete, crouched on the ground with his feet against the starting blocks, similar to(16) a panther about to pounce. He had practised the push-off position countless(17) times just so his reaction to the starting call would become second nature(18) and he would not waste precious seconds. Earlier that day, he had gone through his usual activities(19) before a race – having light meals, resting and chatting with friends on the phone. Before the race, he did his warm-up with some mental preparation, picturing in his head in slow motion how he would run the race. Now in position, Mike calmed his nerves and willed(20) himself to focus on the race, chanting, “It’s now or never! I can do it!” The race would be over in less than a minute.", "category": "Adjectives"}, {"id": "psle2020_eng_q19", "source": "PSLE 2020", "section": "Vocabulary Cloze", "qNum": 19, "sentence": "The late afternoon sun beat down at the stadium. Mike, a professional athlete, crouched on the ground with his feet against the starting blocks, similar to(16) a panther about to pounce. He had practised the push-off position countless(17) times just so his reaction to the starting call would become second nature(18) and he would not waste precious seconds. Earlier that day, he had gone through his usual activities(19) before a race – having light meals, resting and chatting with friends on the phone. Before the race, he did his warm-up with some mental preparation, picturing in his head in slow motion how he would run the race. Now in position, Mike calmed his nerves and willed(20) himself to focus on the race, chanting, “It’s now or never! I can do it!” The race would be over in less than a minute.", "options": ["plan", "cycle", "routine", "sequence"], "answerIndex": 3, "answer": "routine", "option_explanations": [{"key": "A", "value": "plan", "Explanation": "'Plan' refers to a set of intended actions. 'Usual activities' implies actions done regularly as a habit, not a one-time plan."}, {"key": "B", "value": "cycle", "Explanation": "'Cycle' refers to a series of events that repeats in the same order. While activities may repeat, 'routine' better captures the idea of habitual actions."}, {"key": "C", "value": "routine", "Explanation": "Correct. 'Usual activities' refers to a series of actions that are done regularly. A 'routine' is a regular series of actions or habits."}, {"key": "D", "value": "sequence", "Explanation": "'Sequence' refers to the order of events. It emphasises arrangement rather than the habitual nature of the activities."}], "full_passage": "The late afternoon sun beat down at the stadium. Mike, a professional athlete, crouched on the ground with his feet against the starting blocks, similar to(16) a panther about to pounce. He had practised the push-off position countless(17) times just so his reaction to the starting call would become second nature(18) and he would not waste precious seconds. Earlier that day, he had gone through his usual activities(19) before a race – having light meals, resting and chatting with friends on the phone. Before the race, he did his warm-up with some mental preparation, picturing in his head in slow motion how he would run the race. Now in position, Mike calmed his nerves and willed(20) himself to focus on the race, chanting, “It’s now or never! I can do it!” The race would be over in less than a minute.", "category": "Nouns"}, {"id": "psle2020_eng_q20", "source": "PSLE 2020", "section": "Vocabulary Cloze", "qNum": 20, "sentence": "The late afternoon sun beat down at the stadium. Mike, a professional athlete, crouched on the ground with his feet against the starting blocks, similar to(16) a panther about to pounce. He had practised the push-off position countless(17) times just so his reaction to the starting call would become second nature(18) and he would not waste precious seconds. Earlier that day, he had gone through his usual activities(19) before a race – having light meals, resting and chatting with friends on the phone. Before the race, he did his warm-up with some mental preparation, picturing in his head in slow motion how he would run the race. Now in position, Mike calmed his nerves and willed(20) himself to focus on the race, chanting, “It’s now or never! I can do it!” The race would be over in less than a minute.", "options": ["directed", "managed", "reassured", "organised"], "answerIndex": 1, "answer": "directed", "option_explanations": [{"key": "A", "value": "directed", "Explanation": "Correct. 'Willed' means to intentionally make something happen through determination. 'Directed' means to guide or aim, which is the closest in meaning — Mike directed himself to focus."}, {"key": "B", "value": "managed", "Explanation": "'Managed' means to succeed in doing something difficult. While Mike did manage to focus, 'willed' specifically emphasises the act of determination, which 'directed' captures better."}, {"key": "C", "value": "reassured", "Explanation": "'Reassured' means to say or do something to remove doubt. 'Willed' is about using willpower to make something happen, not about removing doubt."}, {"key": "D", "value": "organised", "Explanation": "'Organised' means to arrange systematically. It does not capture the meaning of intentionally making something happen through determination."}], "full_passage": "The late afternoon sun beat down at the stadium. Mike, a professional athlete, crouched on the ground with his feet against the starting blocks, similar to(16) a panther about to pounce. He had practised the push-off position countless(17) times just so his reaction to the starting call would become second nature(18) and he would not waste precious seconds. Earlier that day, he had gone through his usual activities(19) before a race – having light meals, resting and chatting with friends on the phone. Before the race, he did his warm-up with some mental preparation, picturing in his head in slow motion how he would run the race. Now in position, Mike calmed his nerves and willed(20) himself to focus on the race, chanting, “It’s now or never! I can do it!” The race would be over in less than a minute.", "category": "Precise Verbs"}, {"id": "psle2019_eng_q11", "source": "PSLE 2019", "section": "Vocabulary MCQ", "qNum": 11, "sentence": "When Irfan ________ to Secondary One, it took him some time to get used to the new school routine.", "options": ["moved in", "moved up", "moved over", "moved along"], "answerIndex": 2, "answer": "moved up", "option_explanations": [{"key": "A", "value": "moved in", "Explanation": "'Moved in' means to start living in a new place. It does not mean to progress to a higher level."}, {"key": "B", "value": "moved up", "Explanation": "Correct. The phrasal verb 'move up' means to go to a higher level. Irfan moved up to Secondary One from primary school."}, {"key": "C", "value": "moved over", "Explanation": "'Moved over' means to shift position to make room. It does not relate to progressing to a higher school level."}, {"key": "D", "value": "moved along", "Explanation": "'Moved along' means to continue moving or to make progress in a general sense. It does not specifically mean to advance to a higher school level."}], "category": "Phrasal Verbs"}, {"id": "psle2019_eng_q12", "source": "PSLE 2019", "section": "Vocabulary MCQ", "qNum": 12, "sentence": "The speaker should use the microphone to ________ her voice as the audience at the back can hardly hear her.", "options": ["fortify", "amplify", "magnify", "intensify"], "answerIndex": 2, "answer": "amplify", "option_explanations": [{"key": "A", "value": "fortify", "Explanation": "'Fortify' means to strengthen or protect, often used for defences or nutrition. It does not mean to make a sound louder."}, {"key": "B", "value": "amplify", "Explanation": "Correct. To 'amplify' means to make something louder. A microphone is used to amplify (increase the volume of) a speaker’s voice."}, {"key": "C", "value": "magnify", "Explanation": "'Magnify' means to make something appear larger, usually visually (e.g., a magnifying glass). It is not used for sound."}, {"key": "D", "value": "intensify", "Explanation": "'Intensify' means to increase in degree or strength. While it can apply to various things, 'amplify' is the specific term for making sound louder."}], "category": "Precise Verbs"}, {"id": "psle2019_eng_q13", "source": "PSLE 2019", "section": "Vocabulary MCQ", "qNum": 13, "sentence": "No one knew who donated the huge amount of money as the donor chose to be ________.", "options": ["obscure", "indistinct", "ambiguous", "anonymous"], "answerIndex": 4, "answer": "anonymous", "option_explanations": [{"key": "A", "value": "obscure", "Explanation": "'Obscure' means not well known or hard to understand. It describes things or ideas, not a person's choice to hide their identity."}, {"key": "B", "value": "indistinct", "Explanation": "'Indistinct' means not clear or not easy to see/hear. It describes perception, not a deliberate choice to remain unnamed."}, {"key": "C", "value": "ambiguous", "Explanation": "'Ambiguous' means having more than one possible meaning. It does not mean choosing to hide one's identity."}, {"key": "D", "value": "anonymous", "Explanation": "Correct. To be 'anonymous' is to be made or done by someone whose name is unknown or not made public. The donor chose to remain anonymous."}], "category": "Adjectives"}, {"id": "psle2019_eng_q14", "source": "PSLE 2019", "section": "Vocabulary MCQ", "qNum": 14, "sentence": "Margaret feels that the greatest ________ of living in a big city is the pollution.", "options": ["burden", "obstacle", "drawback", "weakness"], "answerIndex": 3, "answer": "drawback", "option_explanations": [{"key": "A", "value": "burden", "Explanation": "'Burden' means a heavy load or responsibility. While pollution is burdensome, 'drawback' better fits as a disadvantage of living somewhere."}, {"key": "B", "value": "obstacle", "Explanation": "'Obstacle' means something that blocks progress. Pollution is a disadvantage, not necessarily an obstacle to living in a city."}, {"key": "C", "value": "drawback", "Explanation": "Correct. A 'drawback' is a disadvantage or negative aspect. Pollution is the greatest drawback (disadvantage) of living in a big city."}, {"key": "D", "value": "weakness", "Explanation": "'Weakness' refers to a lack of strength or a flaw in character/design. It does not naturally describe a disadvantage of living somewhere."}], "category": "Nouns"}, {"id": "psle2019_eng_q15", "source": "PSLE 2019", "section": "Vocabulary MCQ", "qNum": 15, "sentence": "The shopkeeper ________ the customer’s request for an exchange as the product was defective.", "options": ["acceded to", "conceded to", "proceeded with", "succeeded with"], "answerIndex": 1, "answer": "acceded to", "option_explanations": [{"key": "A", "value": "acceded to", "Explanation": "Correct. The phrasal verb 'accede to' means to agree to do what people have asked you to do. The shopkeeper agreed to the customer’s request."}, {"key": "B", "value": "conceded to", "Explanation": "'Concede to' means to admit defeat or yield a point in an argument. It does not mean to agree to a request for an exchange."}, {"key": "C", "value": "proceeded with", "Explanation": "'Proceeded with' means to continue with an action. It does not capture the meaning of agreeing to a customer’s request."}, {"key": "D", "value": "succeeded with", "Explanation": "'Succeeded with' means to achieve success. It does not mean to agree to or grant someone’s request."}], "category": "Phrasal Verbs"}, {"id": "psle2019_eng_q16", "source": "PSLE 2019", "section": "Vocabulary Cloze", "qNum": 16, "sentence": "Mrs Li stared at the gift from her grandson. She could not figure out(16) what it was. It was the size of her thumb, black and rectangular. Handling it gingerly, Mrs Li tried to no avail to open it. She placed the device back on the table, sceptical(17) that it was of any use. Mrs Li was once daunted(18) by technology, but ever since she found out how she could use her mobile phone to take photos, she had been snapping away. A few days ago, Mrs Li told her grandson that she was facing(19) trouble storing her many photos which added up to at least(20) a few thousands. “Grandma, let me show you what this is!” Peter plugged the device into his laptop, and with a few clicks, Mrs Li’s photos appeared on the screen. Mrs Li’s eyes widened.", "options": ["reveal", "unravel", "interpret", "recognise"], "answerIndex": 2, "answer": "unravel", "option_explanations": [{"key": "A", "value": "reveal", "Explanation": "'Reveal' means to make something known or visible. 'Figure out' emphasises the process of understanding, not just making visible."}, {"key": "B", "value": "unravel", "Explanation": "Correct. The phrasal verb 'figure out' means to understand or solve something. 'Unravel' means to investigate and solve, which is the closest in meaning."}, {"key": "C", "value": "interpret", "Explanation": "'Interpret' means to explain the meaning of something. 'Figure out' is about discovering or understanding what something is, not explaining it."}, {"key": "D", "value": "recognise", "Explanation": "'Recognise' means to identify from prior knowledge. Mrs Li was trying to understand what the gift was, not recognise something familiar."}], "full_passage": "Mrs Li stared at the gift from her grandson. She could not figure out(16) what it was. It was the size of her thumb, black and rectangular. Handling it gingerly, Mrs Li tried to no avail to open it. She placed the device back on the table, sceptical(17) that it was of any use. Mrs Li was once daunted(18) by technology, but ever since she found out how she could use her mobile phone to take photos, she had been snapping away. A few days ago, Mrs Li told her grandson that she was facing(19) trouble storing her many photos which added up to at least(20) a few thousands. “Grandma, let me show you what this is!” Peter plugged the device into his laptop, and with a few clicks, Mrs Li’s photos appeared on the screen. Mrs Li’s eyes widened.", "category": "Precise Verbs"}, {"id": "psle2019_eng_q17", "source": "PSLE 2019", "section": "Vocabulary Cloze", "qNum": 17, "sentence": "Mrs Li stared at the gift from her grandson. She could not figure out(16) what it was. It was the size of her thumb, black and rectangular. Handling it gingerly, Mrs Li tried to no avail to open it. She placed the device back on the table, sceptical(17) that it was of any use. Mrs Li was once daunted(18) by technology, but ever since she found out how she could use her mobile phone to take photos, she had been snapping away. A few days ago, Mrs Li told her grandson that she was facing(19) trouble storing her many photos which added up to at least(20) a few thousands. “Grandma, let me show you what this is!” Peter plugged the device into his laptop, and with a few clicks, Mrs Li’s photos appeared on the screen. Mrs Li’s eyes widened.", "options": ["wary", "doubtful", "suspicious", "incredulous"], "answerIndex": 2, "answer": "doubtful", "option_explanations": [{"key": "A", "value": "wary", "Explanation": "'Wary' means cautious about possible dangers. Mrs Li’s feeling was about doubting the device’s usefulness, not about being cautious of danger."}, {"key": "B", "value": "doubtful", "Explanation": "Correct. To be 'sceptical' is to doubt that something is true or useful. 'Doubtful' means having doubt, which matches the meaning."}, {"key": "C", "value": "suspicious", "Explanation": "'Suspicious' implies distrust or a belief that something is wrong or dishonest. 'Sceptical' is about doubting usefulness, not suspecting wrongdoing."}, {"key": "D", "value": "incredulous", "Explanation": "'Incredulous' means unable to believe something. 'Sceptical' is about doubting, which is less extreme than total disbelief."}], "full_passage": "Mrs Li stared at the gift from her grandson. She could not figure out(16) what it was. It was the size of her thumb, black and rectangular. Handling it gingerly, Mrs Li tried to no avail to open it. She placed the device back on the table, sceptical(17) that it was of any use. Mrs Li was once daunted(18) by technology, but ever since she found out how she could use her mobile phone to take photos, she had been snapping away. A few days ago, Mrs Li told her grandson that she was facing(19) trouble storing her many photos which added up to at least(20) a few thousands. “Grandma, let me show you what this is!” Peter plugged the device into his laptop, and with a few clicks, Mrs Li’s photos appeared on the screen. Mrs Li’s eyes widened.", "category": "Adjectives"}, {"id": "psle2019_eng_q18", "source": "PSLE 2019", "section": "Vocabulary Cloze", "qNum": 18, "sentence": "Mrs Li stared at the gift from her grandson. She could not figure out(16) what it was. It was the size of her thumb, black and rectangular. Handling it gingerly, Mrs Li tried to no avail to open it. She placed the device back on the table, sceptical(17) that it was of any use. Mrs Li was once daunted(18) by technology, but ever since she found out how she could use her mobile phone to take photos, she had been snapping away. A few days ago, Mrs Li told her grandson that she was facing(19) trouble storing her many photos which added up to at least(20) a few thousands. “Grandma, let me show you what this is!” Peter plugged the device into his laptop, and with a few clicks, Mrs Li’s photos appeared on the screen. Mrs Li’s eyes widened.", "options": ["baffled", "defeated", "distressed", "intimidated"], "answerIndex": 4, "answer": "intimidated", "option_explanations": [{"key": "A", "value": "baffled", "Explanation": "'Baffled' means confused or puzzled. 'Daunted' specifically means frightened or worried, not confused."}, {"key": "B", "value": "defeated", "Explanation": "'Defeated' means to have lost. 'Daunted' means to feel frightened or worried, not to have been beaten."}, {"key": "C", "value": "distressed", "Explanation": "'Distressed' means to be very upset or worried about a problem. 'Daunted' specifically means to feel frightened, which is better captured by 'intimidated'."}, {"key": "D", "value": "intimidated", "Explanation": "Correct. To be 'daunted' is to be frightened or worried by something. 'Intimidated' means to feel frightened or overawed, which is the closest in meaning."}], "full_passage": "Mrs Li stared at the gift from her grandson. She could not figure out(16) what it was. It was the size of her thumb, black and rectangular. Handling it gingerly, Mrs Li tried to no avail to open it. She placed the device back on the table, sceptical(17) that it was of any use. Mrs Li was once daunted(18) by technology, but ever since she found out how she could use her mobile phone to take photos, she had been snapping away. A few days ago, Mrs Li told her grandson that she was facing(19) trouble storing her many photos which added up to at least(20) a few thousands. “Grandma, let me show you what this is!” Peter plugged the device into his laptop, and with a few clicks, Mrs Li’s photos appeared on the screen. Mrs Li’s eyes widened.", "category": "Adjectives"}, {"id": "psle2019_eng_q19", "source": "PSLE 2019", "section": "Vocabulary Cloze", "qNum": 19, "sentence": "Mrs Li stared at the gift from her grandson. She could not figure out(16) what it was. It was the size of her thumb, black and rectangular. Handling it gingerly, Mrs Li tried to no avail to open it. She placed the device back on the table, sceptical(17) that it was of any use. Mrs Li was once daunted(18) by technology, but ever since she found out how she could use her mobile phone to take photos, she had been snapping away. A few days ago, Mrs Li told her grandson that she was facing(19) trouble storing her many photos which added up to at least(20) a few thousands. “Grandma, let me show you what this is!” Peter plugged the device into his laptop, and with a few clicks, Mrs Li’s photos appeared on the screen. Mrs Li’s eyes widened.", "options": ["tackling", "addressing", "approaching", "encountering"], "answerIndex": 4, "answer": "encountering", "option_explanations": [{"key": "A", "value": "tackling", "Explanation": "'Tackling' means to make an effort to deal with a problem. 'Facing' in this context means experiencing or coming up against trouble, not actively dealing with it."}, {"key": "B", "value": "addressing", "Explanation": "'Addressing' means to deal with or speak about an issue. 'Facing' here means experiencing the trouble, not yet dealing with it."}, {"key": "C", "value": "approaching", "Explanation": "'Approaching' means to come near. It does not capture the meaning of experiencing or dealing with trouble."}, {"key": "D", "value": "encountering", "Explanation": "Correct. To 'face' trouble means to deal with or come up against it. 'Encountering' means to come across or experience, which is the closest in meaning."}], "full_passage": "Mrs Li stared at the gift from her grandson. She could not figure out(16) what it was. It was the size of her thumb, black and rectangular. Handling it gingerly, Mrs Li tried to no avail to open it. She placed the device back on the table, sceptical(17) that it was of any use. Mrs Li was once daunted(18) by technology, but ever since she found out how she could use her mobile phone to take photos, she had been snapping away. A few days ago, Mrs Li told her grandson that she was facing(19) trouble storing her many photos which added up to at least(20) a few thousands. “Grandma, let me show you what this is!” Peter plugged the device into his laptop, and with a few clicks, Mrs Li’s photos appeared on the screen. Mrs Li’s eyes widened.", "category": "Precise Verbs"}, {"id": "psle2019_eng_q20", "source": "PSLE 2019", "section": "Vocabulary Cloze", "qNum": 20, "sentence": "Mrs Li stared at the gift from her grandson. She could not figure out(16) what it was. It was the size of her thumb, black and rectangular. Handling it gingerly, Mrs Li tried to no avail to open it. She placed the device back on the table, sceptical(17) that it was of any use. Mrs Li was once daunted(18) by technology, but ever since she found out how she could use her mobile phone to take photos, she had been snapping away. A few days ago, Mrs Li told her grandson that she was facing(19) trouble storing her many photos which added up to at least(20) a few thousands. “Grandma, let me show you what this is!” Peter plugged the device into his laptop, and with a few clicks, Mrs Li’s photos appeared on the screen. Mrs Li’s eyes widened.", "options": ["slightly", "closely", "scarcely", "minimally"], "answerIndex": 4, "answer": "minimally", "option_explanations": [{"key": "A", "value": "slightly", "Explanation": "'Slightly' means to a small degree. 'At least' means not less than a certain amount, which is different from a small degree."}, {"key": "B", "value": "closely", "Explanation": "'Closely' means in a close manner. It does not convey the idea of 'not less than' a certain number."}, {"key": "C", "value": "scarcely", "Explanation": "'Scarcely' means barely or hardly. This is almost the opposite of 'at least', which indicates a minimum amount."}, {"key": "D", "value": "minimally", "Explanation": "Correct. 'At least' means not less than. 'Minimally' means at the minimum, which conveys a similar idea of the lowest possible amount."}], "full_passage": "Mrs Li stared at the gift from her grandson. She could not figure out(16) what it was. It was the size of her thumb, black and rectangular. Handling it gingerly, Mrs Li tried to no avail to open it. She placed the device back on the table, sceptical(17) that it was of any use. Mrs Li was once daunted(18) by technology, but ever since she found out how she could use her mobile phone to take photos, she had been snapping away. A few days ago, Mrs Li told her grandson that she was facing(19) trouble storing her many photos which added up to at least(20) a few thousands. “Grandma, let me show you what this is!” Peter plugged the device into his laptop, and with a few clicks, Mrs Li’s photos appeared on the screen. Mrs Li’s eyes widened.", "category": "Adverbs"}, {"id": "psle2018_eng_q11", "source": "PSLE 2018", "section": "Vocabulary MCQ", "qNum": 11, "sentence": "“There must be some misunderstanding as John is an honest boy and would not have told ________ lie,” John’s mother said to the teacher.", "options": ["an innocent", "a deliberate", "a suspected", "an expected"], "answerIndex": 2, "answer": "a deliberate", "option_explanations": [{"key": "A", "value": "an innocent", "Explanation": "'An innocent lie' is a white lie or harmless lie. The sentence implies John would not have lied at all, not that his lie was innocent."}, {"key": "B", "value": "a deliberate", "Explanation": "Correct. The adjective 'deliberate' means intentional. John’s mother is saying he would not have told an intentional lie."}, {"key": "C", "value": "a suspected", "Explanation": "'A suspected lie' does not make grammatical or logical sense in this context."}, {"key": "D", "value": "an expected", "Explanation": "'An expected lie' does not make logical sense. Lies are not typically described as 'expected' in this way."}], "category": "Adjectives"}, {"id": "psle2018_eng_q12", "source": "PSLE 2018", "section": "Vocabulary MCQ", "qNum": 12, "sentence": "Padma is willing to ________ her friend’s mistake since it did not do much damage.", "options": ["override", "overturn", "overlook", "overcome"], "answerIndex": 3, "answer": "overlook", "option_explanations": [{"key": "A", "value": "override", "Explanation": "'Override' means to overrule or cancel a decision. It does not mean to forgive a mistake."}, {"key": "B", "value": "overturn", "Explanation": "'Overturn' means to reverse a decision or turn something upside down. It does not mean to forgive."}, {"key": "C", "value": "overlook", "Explanation": "Correct. To 'overlook' means to forgive or disregard. Padma is willing to forgive her friend’s mistake since it did not cause much damage."}, {"key": "D", "value": "overcome", "Explanation": "'Overcome' means to succeed in dealing with a problem. It does not mean to forgive someone’s mistake."}], "category": "Precise Verbs"}, {"id": "psle2018_eng_q13", "source": "PSLE 2018", "section": "Vocabulary MCQ", "qNum": 13, "sentence": "The pupils decided to ________ Jamie’s idea for the group project and began work on it.", "options": ["adopt", "access", "appoint", "address"], "answerIndex": 1, "answer": "adopt", "option_explanations": [{"key": "A", "value": "adopt", "Explanation": "Correct. To 'adopt' means to accept and begin using an idea or plan. The pupils accepted Jamie’s idea and started working on it."}, {"key": "B", "value": "access", "Explanation": "'Access' means to gain entry to or obtain. It does not mean to accept and use an idea."}, {"key": "C", "value": "appoint", "Explanation": "'Appoint' means to assign someone to a position. It does not apply to ideas."}, {"key": "D", "value": "address", "Explanation": "'Address' means to deal with or speak about an issue. It does not mean to accept an idea for use."}], "category": "Precise Verbs"}, {"id": "psle2018_eng_q14", "source": "PSLE 2018", "section": "Vocabulary MCQ", "qNum": 14, "sentence": "After the drought wiped out the crops, life was hard and the farmer had to ________ with only one meal a day.", "options": ["get by", "get on", "get over", "get away"], "answerIndex": 1, "answer": "get by", "option_explanations": [{"key": "A", "value": "get by", "Explanation": "Correct. To 'get by' is to live or handle a situation with difficulty. The farmer had to manage with very little food."}, {"key": "B", "value": "get on", "Explanation": "'Get on' means to have a good relationship or to board a vehicle. It does not mean to survive with limited resources."}, {"key": "C", "value": "get over", "Explanation": "'Get over' means to recover from something (e.g., an illness or disappointment). It does not mean to manage with limited resources."}, {"key": "D", "value": "get away", "Explanation": "'Get away' means to escape. It does not mean to manage or survive with limited resources."}], "category": "Phrasal Verbs"}, {"id": "psle2018_eng_q15", "source": "PSLE 2018", "section": "Vocabulary MCQ", "qNum": 15, "sentence": "The film star’s popularity ________ after she acted in several movies that failed to appeal to viewers.", "options": ["waned", "departed", "vanished", "subsided"], "answerIndex": 1, "answer": "waned", "option_explanations": [{"key": "A", "value": "waned", "Explanation": "Correct. To 'wane' is to become weaker in strength or influence. The film star’s popularity gradually decreased."}, {"key": "B", "value": "departed", "Explanation": "'Departed' means to leave or go away. It is not used to describe a gradual decrease in popularity."}, {"key": "C", "value": "vanished", "Explanation": "'Vanished' means to disappear completely and suddenly. 'Waned' better describes a gradual decline in popularity."}, {"key": "D", "value": "subsided", "Explanation": "'Subsided' means to become less intense, usually for physical things like pain or flooding. 'Waned' is more appropriate for popularity."}], "category": "Precise Verbs"}, {"id": "psle2018_eng_q16", "source": "PSLE 2018", "section": "Vocabulary Cloze", "qNum": 16, "sentence": "Is a chef’s job only to cook? No, that is only part of his job. A chef also needs to supervise(16) kitchen staff and food preparation processes. For example, he has to ascertain(17) that all ingredients bought are fresh and have not gone beyond their expiry dates. In addition, a chef has to ensure that the kitchen runs like clockwork(18), especially during peak hours when it can become chaotic. However, an experienced chef would remain calm and collected(19). Often, a chef is asked to create new dishes for special events and distinguished(20) guests. He would thus need to spend time researching on creative dishes which would taste and look good.", "options": ["support", "manage", "examine", "command"], "answerIndex": 2, "answer": "manage", "option_explanations": [{"key": "A", "value": "support", "Explanation": "'Support' means to give assistance or encouragement. 'Supervise' means to oversee and be responsible for performance, which is more than just supporting."}, {"key": "B", "value": "manage", "Explanation": "Correct. To 'supervise' is to be responsible for the good performance of a job or activity. 'Manage' means to be in charge of, which is the closest in meaning."}, {"key": "C", "value": "examine", "Explanation": "'Examine' means to inspect or look at closely. 'Supervise' is about overseeing ongoing work, not examining it."}, {"key": "D", "value": "command", "Explanation": "'Command' means to give orders authoritatively. 'Supervise' is about overseeing, not just giving orders."}], "full_passage": "Is a chef’s job only to cook? No, that is only part of his job. A chef also needs to supervise(16) kitchen staff and food preparation processes. For example, he has to ascertain(17) that all ingredients bought are fresh and have not gone beyond their expiry dates. In addition, a chef has to ensure that the kitchen runs like clockwork(18), especially during peak hours when it can become chaotic. However, an experienced chef would remain calm and collected(19). Often, a chef is asked to create new dishes for special events and distinguished(20) guests. He would thus need to spend time researching on creative dishes which would taste and look good.", "category": "Precise Verbs"}, {"id": "psle2018_eng_q17", "source": "PSLE 2018", "section": "Vocabulary Cloze", "qNum": 17, "sentence": "Is a chef’s job only to cook? No, that is only part of his job. A chef also needs to supervise(16) kitchen staff and food preparation processes. For example, he has to ascertain(17) that all ingredients bought are fresh and have not gone beyond their expiry dates. In addition, a chef has to ensure that the kitchen runs like clockwork(18), especially during peak hours when it can become chaotic. However, an experienced chef would remain calm and collected(19). Often, a chef is asked to create new dishes for special events and distinguished(20) guests. He would thus need to spend time researching on creative dishes which would taste and look good.", "options": ["prove", "confirm", "promise", "reassure"], "answerIndex": 2, "answer": "confirm", "option_explanations": [{"key": "A", "value": "prove", "Explanation": "'Prove' means to demonstrate the truth of something with evidence. 'Ascertain' means to find out for certain, not to demonstrate to others."}, {"key": "B", "value": "confirm", "Explanation": "Correct. To 'ascertain' is to make sure of something or find out for certain. 'Confirm' means to verify or establish the truth of something."}, {"key": "C", "value": "promise", "Explanation": "'Promise' means to give an assurance about the future. 'Ascertain' is about verifying facts, not making promises."}, {"key": "D", "value": "reassure", "Explanation": "'Reassure' means to say or do something to remove doubts. 'Ascertain' is about finding out facts, not comforting someone."}], "full_passage": "Is a chef’s job only to cook? No, that is only part of his job. A chef also needs to supervise(16) kitchen staff and food preparation processes. For example, he has to ascertain(17) that all ingredients bought are fresh and have not gone beyond their expiry dates. In addition, a chef has to ensure that the kitchen runs like clockwork(18), especially during peak hours when it can become chaotic. However, an experienced chef would remain calm and collected(19). Often, a chef is asked to create new dishes for special events and distinguished(20) guests. He would thus need to spend time researching on creative dishes which would taste and look good.", "category": "Precise Verbs"}, {"id": "psle2018_eng_q18", "source": "PSLE 2018", "section": "Vocabulary Cloze", "qNum": 18, "sentence": "Is a chef’s job only to cook? No, that is only part of his job. A chef also needs to supervise(16) kitchen staff and food preparation processes. For example, he has to ascertain(17) that all ingredients bought are fresh and have not gone beyond their expiry dates. In addition, a chef has to ensure that the kitchen runs like clockwork(18), especially during peak hours when it can become chaotic. However, an experienced chef would remain calm and collected(19). Often, a chef is asked to create new dishes for special events and distinguished(20) guests. He would thus need to spend time researching on creative dishes which would taste and look good.", "options": ["strictly", "quickly", "smoothly", "constantly"], "answerIndex": 3, "answer": "smoothly", "option_explanations": [{"key": "A", "value": "strictly", "Explanation": "'Strictly' means in a strict manner with rigid rules. 'Like clockwork' means running regularly and without difficulty, not strictly."}, {"key": "B", "value": "quickly", "Explanation": "'Quickly' means at a fast speed. 'Like clockwork' emphasises regularity and efficiency, not speed."}, {"key": "C", "value": "smoothly", "Explanation": "Correct. The idiom 'like clockwork' means very regularly and without difficulty. 'Smoothly' means without problems or difficulties, which is the closest match."}, {"key": "D", "value": "constantly", "Explanation": "'Constantly' means continuously without stopping. 'Like clockwork' emphasises smooth, regular operation, not non-stop activity."}], "full_passage": "Is a chef’s job only to cook? No, that is only part of his job. A chef also needs to supervise(16) kitchen staff and food preparation processes. For example, he has to ascertain(17) that all ingredients bought are fresh and have not gone beyond their expiry dates. In addition, a chef has to ensure that the kitchen runs like clockwork(18), especially during peak hours when it can become chaotic. However, an experienced chef would remain calm and collected(19). Often, a chef is asked to create new dishes for special events and distinguished(20) guests. He would thus need to spend time researching on creative dishes which would taste and look good.", "category": "Adverbs"}, {"id": "psle2018_eng_q19", "source": "PSLE 2018", "section": "Vocabulary Cloze", "qNum": 19, "sentence": "Is a chef’s job only to cook? No, that is only part of his job. A chef also needs to supervise(16) kitchen staff and food preparation processes. For example, he has to ascertain(17) that all ingredients bought are fresh and have not gone beyond their expiry dates. In addition, a chef has to ensure that the kitchen runs like clockwork(18), especially during peak hours when it can become chaotic. However, an experienced chef would remain calm and collected(19). Often, a chef is asked to create new dishes for special events and distinguished(20) guests. He would thus need to spend time researching on creative dishes which would taste and look good.", "options": ["pleased", "peaceful", "confident", "composed"], "answerIndex": 4, "answer": "composed", "option_explanations": [{"key": "A", "value": "pleased", "Explanation": "'Pleased' means happy or satisfied. 'Collected' means having control over one’s emotions, not feeling happy."}, {"key": "B", "value": "peaceful", "Explanation": "'Peaceful' means free from disturbance. While calm relates to being peaceful, 'collected' specifically means having emotional control."}, {"key": "C", "value": "confident", "Explanation": "'Confident' means feeling sure of oneself. 'Collected' means calm and in control, not necessarily confident."}, {"key": "D", "value": "composed", "Explanation": "Correct. To be 'collected' is to have control over one’s feelings. 'Composed' means calm and in control of one’s emotions, which is the closest meaning."}], "full_passage": "Is a chef’s job only to cook? No, that is only part of his job. A chef also needs to supervise(16) kitchen staff and food preparation processes. For example, he has to ascertain(17) that all ingredients bought are fresh and have not gone beyond their expiry dates. In addition, a chef has to ensure that the kitchen runs like clockwork(18), especially during peak hours when it can become chaotic. However, an experienced chef would remain calm and collected(19). Often, a chef is asked to create new dishes for special events and distinguished(20) guests. He would thus need to spend time researching on creative dishes which would taste and look good.", "category": "Adjectives"}, {"id": "psle2018_eng_q20", "source": "PSLE 2018", "section": "Vocabulary Cloze", "qNum": 20, "sentence": "Is a chef’s job only to cook? No, that is only part of his job. A chef also needs to supervise(16) kitchen staff and food preparation processes. For example, he has to ascertain(17) that all ingredients bought are fresh and have not gone beyond their expiry dates. In addition, a chef has to ensure that the kitchen runs like clockwork(18), especially during peak hours when it can become chaotic. However, an experienced chef would remain calm and collected(19). Often, a chef is asked to create new dishes for special events and distinguished(20) guests. He would thus need to spend time researching on creative dishes which would taste and look good.", "options": ["elegant", "admirable", "distinctive", "esteemed"], "answerIndex": 4, "answer": "esteemed", "option_explanations": [{"key": "A", "value": "elegant", "Explanation": "'Elegant' means graceful and stylish. 'Distinguished' means respected and admired, not about style or grace."}, {"key": "B", "value": "admirable", "Explanation": "'Admirable' means deserving respect. While close, 'esteemed' is a closer synonym for 'distinguished' as both emphasise high status and respect."}, {"key": "C", "value": "distinctive", "Explanation": "'Distinctive' means unique or easily recognisable. 'Distinguished' in this context means respected, not unique."}, {"key": "D", "value": "esteemed", "Explanation": "Correct. To be 'distinguished' is to be respected or admired. 'Esteemed' means held in great respect, which is the closest in meaning."}], "full_passage": "Is a chef’s job only to cook? No, that is only part of his job. A chef also needs to supervise(16) kitchen staff and food preparation processes. For example, he has to ascertain(17) that all ingredients bought are fresh and have not gone beyond their expiry dates. In addition, a chef has to ensure that the kitchen runs like clockwork(18), especially during peak hours when it can become chaotic. However, an experienced chef would remain calm and collected(19). Often, a chef is asked to create new dishes for special events and distinguished(20) guests. He would thus need to spend time researching on creative dishes which would taste and look good.", "category": "Adjectives"}, {"id": "psle2017_eng_q11", "source": "PSLE 2017", "section": "Vocabulary MCQ", "qNum": 11, "sentence": "When her children quarrel, Mrs Jaya will ________ only if necessary.", "options": ["step in", "step up", "step out", "step down"], "answerIndex": 1, "answer": "step in", "option_explanations": [{"key": "A", "value": "step in", "Explanation": "Correct. 'Step in' means to intervene or get involved. Mrs Jaya will intervene in her children's quarrel only when it is necessary."}, {"key": "B", "value": "step up", "Explanation": "'Step up' means to increase effort or take responsibility. It does not fit the context of intervening in a quarrel."}, {"key": "C", "value": "step out", "Explanation": "'Step out' means to leave briefly. This is the opposite of what is needed — Mrs Jaya is getting involved, not leaving."}, {"key": "D", "value": "step down", "Explanation": "'Step down' means to resign or withdraw from a position. It does not relate to intervening in children's quarrels."}], "category": "Phrasal Verbs"}, {"id": "psle2017_eng_q12", "source": "PSLE 2017", "section": "Vocabulary MCQ", "qNum": 12, "sentence": "Sheri Lim was ________ with the title of “Most Inspiring Pupil” of the school.", "options": ["lavished", "honoured", "showered", "pampered"], "answerIndex": 2, "answer": "honoured", "option_explanations": [{"key": "A", "value": "lavished", "Explanation": "'Lavished' means given in great abundance. One is not 'lavished with a title'; the word typically collocates with praise, gifts, or attention."}, {"key": "B", "value": "honoured", "Explanation": "Correct. 'Honoured with a title' is the correct collocation. To be honoured means to be given recognition or distinction, which fits receiving a title."}, {"key": "C", "value": "showered", "Explanation": "'Showered' means given in large amounts. 'Showered with a title' is not a natural collocation; one is showered with praise, gifts, or compliments."}, {"key": "D", "value": "pampered", "Explanation": "'Pampered' means treated with excessive care and luxury. One cannot be 'pampered with a title'; the word does not collocate with awards or titles."}], "category": "Precise Verbs"}, {"id": "psle2017_eng_q13", "source": "PSLE 2017", "section": "Vocabulary MCQ", "qNum": 13, "sentence": "The policeman’s ________ thinking during the moment of crisis saved many lives.", "options": ["immediate", "sudden", "instant", "quick"], "answerIndex": 4, "answer": "quick", "option_explanations": [{"key": "A", "value": "immediate", "Explanation": "'Immediate' means happening without delay. While close in meaning, 'immediate thinking' is not a natural collocation. 'Quick thinking' is the standard expression."}, {"key": "B", "value": "sudden", "Explanation": "'Sudden' means happening unexpectedly. 'Sudden thinking' is not a natural expression in English and does not convey the intended meaning."}, {"key": "C", "value": "instant", "Explanation": "'Instant' means happening at once. 'Instant thinking' is not a standard collocation. The natural expression is 'quick thinking'."}, {"key": "D", "value": "quick", "Explanation": "Correct. 'Quick thinking' is a fixed expression meaning the ability to think and react rapidly, especially in a crisis. It is the standard collocation used in English."}], "category": "Adjectives"}, {"id": "psle2017_eng_q14", "source": "PSLE 2017", "section": "Vocabulary MCQ", "qNum": 14, "sentence": "The renovation ________ the old hotel to its former glory.", "options": ["renewed", "restored", "reclaimed", "recharged"], "answerIndex": 2, "answer": "restored", "option_explanations": [{"key": "A", "value": "renewed", "Explanation": "'Renewed' means made new again or extended. While close, 'restored to its former glory' is the standard expression, not 'renewed to its former glory'."}, {"key": "B", "value": "restored", "Explanation": "Correct. 'Restored to its former glory' is a fixed expression meaning to bring something back to its original impressive state. This is the natural collocation for renovations."}, {"key": "C", "value": "reclaimed", "Explanation": "'Reclaimed' means taken back or recovered, often used for land or materials. 'Reclaimed to its former glory' is not a standard expression."}, {"key": "D", "value": "recharged", "Explanation": "'Recharged' means to restore energy or power, typically for batteries or devices. It does not apply to renovating a building."}], "category": "Precise Verbs"}, {"id": "psle2017_eng_q15", "source": "PSLE 2017", "section": "Vocabulary MCQ", "qNum": 15, "sentence": "One huge wave after another crashed against the rocks in ________.", "options": ["addition", "repetition", "succession", "procession"], "answerIndex": 3, "answer": "succession", "option_explanations": [{"key": "A", "value": "addition", "Explanation": "'In addition' means 'also' or 'furthermore'. It does not describe the pattern of waves following one after another."}, {"key": "B", "value": "repetition", "Explanation": "'In repetition' is not a standard English expression. While 'repetition' means doing something again, the correct phrase for sequential events is 'in succession'."}, {"key": "C", "value": "succession", "Explanation": "Correct. 'In succession' means one after another in sequence. This perfectly describes waves crashing one after another against the rocks."}, {"key": "D", "value": "procession", "Explanation": "'In procession' refers to a formal march or parade of people. While it implies a sequence, it is used for people walking in a formal line, not for natural events like waves."}], "category": "Nouns"}, {"id": "psle2017_eng_q16", "source": "PSLE 2017", "section": "Vocabulary Cloze", "qNum": 16, "sentence": "Late one evening, Mrs Wendy Lim saw her new neighbour at his door. 'Hello! I'm Wendy. You are...?' Mrs Lim stretched out her hand as a welcoming gesture(16). The neighbour, however, shook his head and mumbled something that did not make sense(17) before scuttling into his apartment. His strange behaviour left Mrs Lim feeling bewildered(18) and she wondered what was wrong. A week later, Mrs Lim met the neighbour again at the lift lobby. Unable to move away(19) without looking suspicious, she stood awkwardly(20) at a distance. To her pleasant surprise, the man said, 'Hi, I'm Teck Huat. So sorry for my rude behaviour the other day. I was having a terrible flu and didn't want to pass it to you.' Mrs Lim smiled.", "options": ["sign", "show", "wave", "attempt"], "answerIndex": 1, "answer": "sign", "option_explanations": [{"key": "A", "value": "sign", "Explanation": "Correct. A 'gesture' is a movement of part of the body to express an idea or meaning. A 'sign' similarly refers to an action used to convey a message, like stretching out one's hand as a welcoming sign."}, {"key": "B", "value": "show", "Explanation": "'Show' means a display or performance. While a gesture can be a 'show of welcome', 'sign' more precisely matches 'gesture' as a physical action conveying meaning."}, {"key": "C", "value": "wave", "Explanation": "'Wave' is a specific hand movement. The passage says she 'stretched out her hand', which is not a wave but an offer to shake hands."}, {"key": "D", "value": "attempt", "Explanation": "'Attempt' means a try or effort. A gesture is not the same as an attempt; it is a deliberate action to convey a message, not merely an effort."}], "full_passage": "Late one evening, Mrs Wendy Lim saw her new neighbour at his door. 'Hello! I'm Wendy. You are...?' Mrs Lim stretched out her hand as a welcoming gesture(16). The neighbour, however, shook his head and mumbled something that did not make sense(17) before scuttling into his apartment. His strange behaviour left Mrs Lim feeling bewildered(18) and she wondered what was wrong. A week later, Mrs Lim met the neighbour again at the lift lobby. Unable to move away(19) without looking suspicious, she stood awkwardly(20) at a distance. To her pleasant surprise, the man said, 'Hi, I'm Teck Huat. So sorry for my rude behaviour the other day. I was having a terrible flu and didn't want to pass it to you.' Mrs Lim smiled.", "category": "Nouns"}, {"id": "psle2017_eng_q17", "source": "PSLE 2017", "section": "Vocabulary Cloze", "qNum": 17, "sentence": "Late one evening, Mrs Wendy Lim saw her new neighbour at his door. 'Hello! I'm Wendy. You are...?' Mrs Lim stretched out her hand as a welcoming gesture(16). The neighbour, however, shook his head and mumbled something that did not make sense(17) before scuttling into his apartment. His strange behaviour left Mrs Lim feeling bewildered(18) and she wondered what was wrong. A week later, Mrs Lim met the neighbour again at the lift lobby. Unable to move away(19) without looking suspicious, she stood awkwardly(20) at a distance. To her pleasant surprise, the man said, 'Hi, I'm Teck Huat. So sorry for my rude behaviour the other day. I was having a terrible flu and didn't want to pass it to you.' Mrs Lim smiled.", "options": ["insensitive", "incoherent", "inconsistent", "indescribable"], "answerIndex": 2, "answer": "incoherent", "option_explanations": [{"key": "A", "value": "insensitive", "Explanation": "'Insensitive' means lacking feeling or tact. 'Did not make sense' refers to speech being unclear or unintelligible, not to being unfeeling."}, {"key": "B", "value": "incoherent", "Explanation": "Correct. 'Did not make sense' means the speech was difficult to understand or illogical. 'Incoherent' means unclear, muddled, or impossible to understand, which matches perfectly."}, {"key": "C", "value": "inconsistent", "Explanation": "'Inconsistent' means not staying the same or contradictory. The passage describes speech that was hard to understand, not speech that was contradictory."}, {"key": "D", "value": "indescribable", "Explanation": "'Indescribable' means too extreme to describe in words. The passage says the mumbling did not make sense, meaning it was unclear, not beyond description."}], "full_passage": "Late one evening, Mrs Wendy Lim saw her new neighbour at his door. 'Hello! I'm Wendy. You are...?' Mrs Lim stretched out her hand as a welcoming gesture(16). The neighbour, however, shook his head and mumbled something that did not make sense(17) before scuttling into his apartment. His strange behaviour left Mrs Lim feeling bewildered(18) and she wondered what was wrong. A week later, Mrs Lim met the neighbour again at the lift lobby. Unable to move away(19) without looking suspicious, she stood awkwardly(20) at a distance. To her pleasant surprise, the man said, 'Hi, I'm Teck Huat. So sorry for my rude behaviour the other day. I was having a terrible flu and didn't want to pass it to you.' Mrs Lim smiled.", "category": "Adjectives"}, {"id": "psle2017_eng_q18", "source": "PSLE 2017", "section": "Vocabulary Cloze", "qNum": 18, "sentence": "Late one evening, Mrs Wendy Lim saw her new neighbour at his door. 'Hello! I'm Wendy. You are...?' Mrs Lim stretched out her hand as a welcoming gesture(16). The neighbour, however, shook his head and mumbled something that did not make sense(17) before scuttling into his apartment. His strange behaviour left Mrs Lim feeling bewildered(18) and she wondered what was wrong. A week later, Mrs Lim met the neighbour again at the lift lobby. Unable to move away(19) without looking suspicious, she stood awkwardly(20) at a distance. To her pleasant surprise, the man said, 'Hi, I'm Teck Huat. So sorry for my rude behaviour the other day. I was having a terrible flu and didn't want to pass it to you.' Mrs Lim smiled.", "options": ["afraid", "worried", "confused", "annoyed"], "answerIndex": 3, "answer": "confused", "option_explanations": [{"key": "A", "value": "afraid", "Explanation": "'Afraid' means scared or frightened. The passage says Mrs Lim was 'bewildered', which means confused or puzzled, not scared."}, {"key": "B", "value": "worried", "Explanation": "'Worried' means anxious about something. While Mrs Lim 'wondered what was wrong', 'bewildered' specifically means puzzled or confused, not anxious."}, {"key": "C", "value": "confused", "Explanation": "Correct. 'Bewildered' means completely puzzled or confused. Mrs Lim was confused by the neighbour's strange behaviour of shaking his head and mumbling."}, {"key": "D", "value": "annoyed", "Explanation": "'Annoyed' means slightly angry or irritated. 'Bewildered' describes confusion, not irritation. The passage suggests puzzlement rather than annoyance."}], "full_passage": "Late one evening, Mrs Wendy Lim saw her new neighbour at his door. 'Hello! I'm Wendy. You are...?' Mrs Lim stretched out her hand as a welcoming gesture(16). The neighbour, however, shook his head and mumbled something that did not make sense(17) before scuttling into his apartment. His strange behaviour left Mrs Lim feeling bewildered(18) and she wondered what was wrong. A week later, Mrs Lim met the neighbour again at the lift lobby. Unable to move away(19) without looking suspicious, she stood awkwardly(20) at a distance. To her pleasant surprise, the man said, 'Hi, I'm Teck Huat. So sorry for my rude behaviour the other day. I was having a terrible flu and didn't want to pass it to you.' Mrs Lim smiled.", "category": "Adjectives"}, {"id": "psle2017_eng_q19", "source": "PSLE 2017", "section": "Vocabulary Cloze", "qNum": 19, "sentence": "Late one evening, Mrs Wendy Lim saw her new neighbour at his door. 'Hello! I'm Wendy. You are...?' Mrs Lim stretched out her hand as a welcoming gesture(16). The neighbour, however, shook his head and mumbled something that did not make sense(17) before scuttling into his apartment. His strange behaviour left Mrs Lim feeling bewildered(18) and she wondered what was wrong. A week later, Mrs Lim met the neighbour again at the lift lobby. Unable to move away(19) without looking suspicious, she stood awkwardly(20) at a distance. To her pleasant surprise, the man said, 'Hi, I'm Teck Huat. So sorry for my rude behaviour the other day. I was having a terrible flu and didn't want to pass it to you.' Mrs Lim smiled.", "
