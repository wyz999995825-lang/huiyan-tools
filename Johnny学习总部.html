<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Johnny 学习总部</title>
<style>
:root{--bg:#f5f3ee;--panel:#fffdf8;--fg:#1f2421;--muted:#6f7670;--line:#e4e0d6;--accent:#2f6f5a;--accent-soft:#e2efe9;--warn:#a8650f;--bad:#b9382e;
  --serif:"Noto Serif SC","Songti SC",Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased}

/* ---------- 开场 ---------- */
#splash{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:var(--bg);padding:24px;text-align:center;transition:opacity .6s ease,visibility .6s}
#splash.out{opacity:0;visibility:hidden}
.sp-in{max-width:640px}
.sp-hi{font-family:var(--serif);font-size:clamp(30px,6vw,48px);font-weight:500;margin:0;letter-spacing:.04em;opacity:0;transform:translateY(8px);animation:rise .8s ease .15s forwards}
.sp-q{font-size:clamp(17px,3.2vw,21px);color:var(--muted);line-height:1.7;margin:16px 0 0;opacity:0;transform:translateY(8px);animation:rise .8s ease .75s forwards}
.sp-bar{width:180px;height:3px;border-radius:3px;background:var(--line);margin:34px auto 0;overflow:hidden;opacity:0;animation:fade .4s ease 1s forwards}
.sp-bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;animation:load 1.5s ease-in-out 1.05s forwards}
.sp-skip{margin-top:18px;font-size:12.5px;color:var(--muted);opacity:0;animation:fade .4s ease 1.4s forwards}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes load{to{width:100%}}

/* ---------- 主界面 ---------- */
.wrap{min-height:100%;max-width:980px;margin:0 auto;padding:max(40px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) 48px max(64px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:30px}
.head .kick{font-size:13px;letter-spacing:.18em;color:var(--accent);font-weight:600;margin:0}
.head h1{font-family:var(--serif);font-weight:500;font-size:clamp(28px,5vw,40px);margin:10px 0 0;letter-spacing:.03em}
.head p{margin:10px 0 0;font-size:clamp(16px,2.6vw,19px);color:var(--muted);line-height:1.7}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:16px}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 22px 20px;display:flex;flex-direction:column;gap:10px;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(40,50,40,.09);border-color:#d2cdbf}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.card .ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:24px;background:var(--c-soft)}
.card .no{font-size:12px;color:var(--muted);letter-spacing:.12em}
.card h2{margin:0;font-size:20px;font-weight:650}
.card .sub{margin:0;font-size:14.5px;color:var(--muted);line-height:1.65;flex:1}
.card .go{margin-top:6px;font-size:14px;font-weight:600;color:var(--c)}
.c1{--c:#2f6f5a;--c-soft:#e2efe9}
.c2{--c:#4b4fd6;--c-soft:#e7e8fb}
.c3{--c:#b0651c;--c-soft:#f8ebda}
.vsw{display:inline-flex;margin-top:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.vsw button{font:inherit;font-size:14px;font-weight:600;border:0;background:transparent;color:var(--fg);padding:8px 14px;cursor:pointer;touch-action:manipulation}
.vsw button.on{background:var(--fg);color:var(--bg)}
.vsw button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
body.v-phone.wide .wrap{max-width:460px}
body.v-phone.wide #view.on{background:#e7e4dc}
body.v-phone.wide #view iframe.show{box-shadow:0 0 0 1px rgba(0,0,0,.08),0 10px 40px rgba(0,0,0,.12)}
.foot{font-size:12.5px;color:var(--muted);text-align:center;margin-top:auto}

/* ---------- 三个端口（一直在后台开着，随时准备好） ---------- */
#view{position:fixed;inset:0;z-index:20;overflow:hidden;pointer-events:none}
#view.on{pointer-events:auto;background:#fff}
#view iframe{position:absolute;top:0;left:-300vw;width:100%;height:100%;border:0;display:block}
#view iframe.show{left:0}
#home{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));z-index:40;font:700 15px var(--sans);border:2px solid #fff;border-radius:999px;padding:10px 18px;background:#1f2421;color:#fff;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.28);display:flex;align-items:center;gap:6px;touch-action:none;user-select:none;-webkit-user-select:none}
#home:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- 总结 AI（左边侧拉） ---------- */
#aitab{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:30;border:0;border-radius:0 14px 14px 0;background:var(--accent);color:#fff;cursor:pointer;padding:16px 10px 16px 9px;font:700 15px var(--sans);writing-mode:vertical-rl;letter-spacing:.2em;box-shadow:2px 4px 16px rgba(0,0,0,.15);display:flex;align-items:center;gap:8px}
#aitab .dot{writing-mode:horizontal-tb;width:8px;height:8px;border-radius:50%;background:#9ff0c9}
#aitab:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
#aishade{position:fixed;inset:0;z-index:44;background:rgba(20,24,22,.32);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
#aishade.on{opacity:1;visibility:visible}
#ai{position:fixed;left:0;top:0;bottom:0;z-index:45;width:min(440px,94vw);background:var(--panel);border-right:1px solid var(--line);box-shadow:8px 0 30px rgba(0,0,0,.14);display:flex;flex-direction:column;transform:translateX(-102%);visibility:hidden;transition:transform .28s ease,visibility 0s linear .28s;padding:max(14px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
#ai.on{transform:none;visibility:visible;transition:transform .28s ease}
.ai-h{display:flex;align-items:center;gap:8px}
.ai-h b{font-size:18px;flex:1}
.ai-h button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:9px;padding:5px 10px;cursor:pointer}
.ai-src{display:grid;gap:6px;margin-top:12px}
.src{display:flex;align-items:flex-start;gap:9px;border:1px solid var(--line);border-radius:11px;padding:8px 10px;background:var(--bg);cursor:pointer}
.src input{margin:3px 0 0;accent-color:var(--accent);width:16px;height:16px;flex:none}
.src .t{font-size:14px;font-weight:600}
.src .s{display:block;font-size:12px;color:var(--muted);line-height:1.5;margin-top:1px}
.src .s.ok{color:var(--accent)}
.src.dis{cursor:default;opacity:.85}
.ai-quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ai-quick button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:5px 11px;cursor:pointer}
.ai-quick button:hover{border-color:var(--accent);color:var(--accent)}
.ai-log{flex:1;overflow:auto;margin-top:12px;display:flex;flex-direction:column;gap:10px;padding-right:2px}
.msg{font-size:14.5px;line-height:1.7;padding:9px 12px;border-radius:13px;max-width:94%;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent-soft);white-space:pre-wrap}
.msg.a{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.msg.a p{margin:0 0 6px}.msg.a p:last-child{margin:0}
.msg.a ul{margin:2px 0 6px;padding-left:1.2em}
.msg.a h4{margin:8px 0 4px;font-size:14.5px}
.msg.e{align-self:stretch;background:#fbe9e6;color:var(--bad);font-size:13.5px}
.msg.hint{align-self:stretch;color:var(--muted);font-size:13px;background:transparent;padding:4px 2px}
.ai-in{display:flex;gap:8px;margin-top:10px;align-items:flex-end}
.ai-in textarea{flex:1;min-width:0;resize:none;font:inherit;font-size:16px;line-height:1.5;border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:var(--bg);color:var(--fg);max-height:120px}
.ai-in textarea:focus-visible,.keybox input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ai-in button,.keybox button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px 15px;background:var(--accent);color:#fff;cursor:pointer}
.ai-in button:disabled{opacity:.5;cursor:default}
.keybox{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13px;color:var(--muted);display:grid;gap:8px}
.keybox .r{display:flex;gap:8px}
.keybox input{flex:1;min-width:0;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel);color:var(--fg)}
.ai-foot{font-size:11.5px;color:var(--muted);margin-top:6px}

@media (max-width:600px){
  #home{font-size:13.5px;padding:7px 13px;border-width:1.5px;opacity:.92}
  .wrap{padding-left:max(52px,env(safe-area-inset-left));gap:24px}
  #aitab{padding:13px 8px 13px 7px;font-size:14px}
  .card{padding:18px 18px 16px}
  .ai-quick button{font-size:13.5px;padding:6px 11px}
  #ai{width:100vw;border-right:0}
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,.card{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
@media (prefers-color-scheme:dark){
  :root{--bg:#151917;--panel:#1d2320;--fg:#e9ede9;--muted:#9ba59f;--line:#2d3632;--accent:#62bf98;--accent-soft:#1f3a2e;--bad:#ff8a7e}
  .c1{--c:#62bf98;--c-soft:#1f3a2e}.c2{--c:#9ea1ff;--c-soft:#2a2c52}.c3{--c:#e3a35a;--c-soft:#3d2f1c}
  #aitab,.ai-in button,.keybox button{color:#0f1a15}
  .msg.e{background:#3d1c1a}
}
@media (prefers-reduced-motion:reduce){.sp-hi,.sp-q,.sp-bar,.sp-skip{animation:none;opacity:1;transform:none}.sp-bar i{animation:none;width:100%}#ai,#aishade{transition:none}}
</style>
</head>
<body>

<div id="splash" role="status" aria-live="polite">
  <div class="sp-in">
    <h1 class="sp-hi">您好，WuYanzi</h1>
    <p class="sp-q">请问我们今天要查看 Johnny 的哪一个学习 HTML 端口？</p>
    <div class="sp-bar"><i></i></div>
    <div class="sp-skip">点一下直接进入</div>
  </div>
</div>

<main class="wrap" id="main">
  <header class="head">
    <p class="kick">JOHNNY 学习总部</p>
    <h1>您好，WuYanzi</h1>
    <p>请问我们今天要查看 Johnny 的哪一个学习 HTML 端口？</p>
    <div class="vsw" role="group" aria-label="显示方式"><button type="button" data-v="mac">💻 Mac版</button><button type="button" data-v="phone">📱 手机版</button></div>
  </header>

  <section class="cards" aria-label="选择学习端口">
    <button class="card c1" type="button" data-k="math">
      <span class="ic">📐</span>
      <span class="no">端口 1</span>
      <h2>学习课堂 · 学习日报</h2>
      <p class="sub">数学课堂家长端：今天学了几道题、老师评语、7 天学习时长，还能「👁 监视课堂」。</p>
      <span class="go">进入 →</span>
    </button>
    <button class="card c2" type="button" data-k="words">
      <span class="ic">🔤</span>
      <span class="no">端口 2</span>
      <h2>每日 20 词 · 学习看板</h2>
      <p class="sub">背单词家长看板：今天的小游戏、默写原样、错题本变化，还能「📺 监视背单词」。</p>
      <span class="go">进入 →</span>
    </button>
    <button class="card c3" type="button" data-k="writing">
      <span class="ic">✍️</span>
      <span class="no">端口 3</span>
      <h2>英文写作工作室 · 家长看板</h2>
      <p class="sub">写小说、写日记的家长看板：今天写了多少词、AI 批改分数和进步曲线，还能「监视工作室」。</p>
      <span class="go">进入 →</span>
    </button>
  </section>

  <p class="foot">左边「总结 AI」可以拉出来问 Johnny 的学习情况 · 进入端口后左下角「← 返回总部」随时回来</p>
</main>

<div id="view" aria-hidden="true"></div>
<button id="home" type="button" hidden title="返回总部（按住可以上下拖开，不挡画面）">← 返回总部</button>

<button id="aitab" type="button" aria-controls="ai" aria-expanded="false"><span class="dot" id="aidot"></span>总结 AI</button>
<div id="aishade"></div>
<aside id="ai" role="dialog" aria-label="总结 AI" aria-hidden="true">
  <div class="ai-h"><b>🤖 总结 AI</b><button type="button" id="ai-new">新对话</button><button type="button" id="ai-key">🔑</button><button type="button" id="ai-x" aria-label="收起">✕</button></div>
  <div class="ai-src" id="ai-src">
    <label class="src"><input type="checkbox" data-s="math" checked><span><span class="t">📐 学习课堂（数学等）</span><span class="s" id="st-math">正在连接…</span></span></label>
    <label class="src"><input type="checkbox" data-s="words" checked><span><span class="t">🔤 每日 20 词</span><span class="s" id="st-words">正在连接…</span></span></label>
    <label class="src"><input type="checkbox" data-s="writing" checked><span><span class="t">✍️ 英文写作工作室</span><span class="s" id="st-writing">正在连接…</span></span></label>
  </div>
  <div class="keybox" id="keybox" hidden>
    <span>第一次用：贴上 Claude 的 API Key（sk-ant- 开头，在 console.anthropic.com 申请）。只存在这台设备的浏览器里。</span>
    <div class="r"><input id="keyin" type="password" placeholder="sk-ant-…" autocomplete="off" aria-label="Claude API Key"><button type="button" id="keysave">保存</button></div>
  </div>
  <div class="ai-quick" id="ai-quick">
    <button type="button">📋 今天学得怎么样</button>
    <button type="button">📈 整体进度和程度</button>
    <button type="button">⚠️ 哪里需要加强</button>
    <button type="button">🗓 这一周的变化</button>
    <button type="button">💬 帮我写几句鼓励他的话</button>
  </div>
  <div class="ai-log" id="ai-log" aria-live="polite"></div>
  <div class="ai-in"><textarea id="ai-q" rows="2" placeholder="问问 Johnny 的学习情况…（Enter 发送，Shift+Enter 换行）"></textarea><button type="button" id="ai-send">发送</button></div>
  <p class="ai-foot">用 Claude 最省钱的 Haiku 模型；每次提问都读取最新的实时记录。</p>
</aside>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var NAMES = {math:"学习课堂 · 学习日报", words:"每日 20 词 · 学习看板", writing:"英文写作工作室 · 家长看板"};
  var has = function(k){ return Object.prototype.hasOwnProperty.call(NAMES, k); };
  var FR = {};
  var store = { get:function(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set:function(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };

  function page(k){
    var b64 = $("p-" + k).textContent.trim(), bin = atob(b64), u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return new TextDecoder("utf-8").decode(u);
  }
  // 每个端口只开一次，之后一直在后台运行（实时同步不中断，切换瞬间完成，总结 AI 随时能读）
  function frame(k){
    if (FR[k]) return FR[k];
    var f = document.createElement("iframe");
    f.title = NAMES[k];
    f.setAttribute("allow", "autoplay; fullscreen; clipboard-read; clipboard-write");
    f.srcdoc = page(k);
    $("view").append(f);
    return (FR[k] = f);
  }
  // 链接末尾带 #ws=连接码 时：存到这台设备（写作看板用），不把钥匙写进文件
  (function(){ var m = /[#&]ws=([^&]+)/.exec(location.hash || ""); if (m) store.set("ws_conn", m[1]); })();
  frame("math"); frame("words"); frame("writing");

  // ---------- 显示方式：Mac版 / 手机版（默认按设备自动选） ----------
  var PHONE_W = 430, MAC_W = 1280;
  function viewMode(){ var v = store.get("hub:view"); return v === "mac" || v === "phone" ? v : (innerWidth < 760 ? "phone" : "mac"); }
  function layout(){
    var v = viewMode(), W = innerWidth, H = innerHeight, b = document.body;
    b.classList.toggle("v-phone", v === "phone"); b.classList.toggle("v-mac", v === "mac"); b.classList.toggle("wide", W > PHONE_W + 40);
    document.querySelectorAll(".vsw button").forEach(function(x){ x.classList.toggle("on", x.dataset.v === v); x.setAttribute("aria-pressed", x.dataset.v === v); });
    Object.keys(FR).forEach(function(k){ var f = FR[k], s = f.style, show = f.classList.contains("show");
      s.transform = ""; s.transformOrigin = "0 0"; s.top = "0";
      if (v === "phone" && W > PHONE_W + 40) { s.width = PHONE_W + "px"; s.height = "100%"; s.left = show ? Math.round((W - PHONE_W) / 2) + "px" : "-300vw"; }
      else if (v === "mac" && W < MAC_W) { var k2 = W / MAC_W; s.width = MAC_W + "px"; s.height = Math.ceil(H / k2) + "px"; s.transform = "scale(" + k2 + ")"; s.left = show ? "0" : "-300vw"; }
      else { s.width = "100%"; s.height = "100%"; s.left = show ? "0" : "-300vw"; }
    });
  }
  document.querySelectorAll(".vsw button").forEach(function(x){ x.addEventListener("click", function(){ store.set("hub:view", x.dataset.v); layout(); }); });
  addEventListener("resize", layout); layout();

  // ---------- 开场 ----------
  var splash = $("splash"), done = false;
  function enter(){ if (done) return; done = true; splash.classList.add("out"); setTimeout(function(){ splash.hidden = true; }, 650); }
  splash.addEventListener("click", enter);
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  setTimeout(enter, reduce ? 1200 : 2800);

  // ---------- 打开 / 返回 ----------
  function open(k){
    if (!has(k)) return;
    closeAI();
    var f = frame(k);
    Object.keys(FR).forEach(function(x){ FR[x].classList.toggle("show", x === k); }); layout();
    $("view").classList.add("on"); $("view").setAttribute("aria-hidden", "false");
    $("home").hidden = false; $("main").hidden = true; $("aitab").hidden = true;
    document.title = NAMES[k] + " · Johnny 学习总部";
    enter();
    try { f.focus(); } catch(e) {}
  }
  function close(){
    Object.keys(FR).forEach(function(x){ FR[x].classList.remove("show"); }); layout();
    $("view").classList.remove("on"); $("view").setAttribute("aria-hidden", "true");
    $("home").hidden = true; $("main").hidden = false; $("aitab").hidden = false;
    document.title = "Johnny 学习总部";
  }
  function route(){ var k = location.hash.slice(1); if (has(k)) open(k); else close(); }
  function goHome(){
    close();                                   // 先回主界面，下面清网址失败也不影响
    if (!location.hash) return;
    try { history.replaceState(null, "", location.pathname + location.search); }
    catch (e) { try { location.hash = ""; } catch (e2) {} }   // 预览窗口等受限环境不许改网址，就只清 #
  }
  document.querySelectorAll(".card").forEach(function(b){
    b.addEventListener("click", function(){ if (location.hash === "#" + b.dataset.k) route(); else location.hash = b.dataset.k; });
  });
  addEventListener("hashchange", route);

  // 返回按钮：点一下回总部；按住上下拖可以挪开，免得挡住画面
  (function(){
    var h = $("home"), sy = 0, st = 0, moved = false, down = false;
    var y0 = parseFloat(store.get("hub:homeY") || "");
    function place(y){ y = Math.max(10, Math.min(innerHeight - 60, y)); h.style.top = y + "px"; h.style.bottom = "auto"; return y; }
    if (y0 >= 0) place(y0);
    h.addEventListener("pointerdown", function(e){ down = true; moved = false; sy = e.clientY; st = h.getBoundingClientRect().top; try{ h.setPointerCapture(e.pointerId); }catch(x){} });
    h.addEventListener("pointermove", function(e){ if (!down) return; if (Math.abs(e.clientY - sy) > 6) moved = true; if (moved) store.set("hub:homeY", String(place(st + e.clientY - sy))); });
    h.addEventListener("pointerup", function(){ down = false; });
    h.addEventListener("click", function(e){ if (moved) { e.preventDefault(); moved = false; return; } goHome(); });
  })();

  // ---------- 读取后台端口里的实时记录 ----------
  var pad = function(n){ return String(n).padStart(2, "0"); };
  var hm = function(t){ var d = new Date(t); return isNaN(d) ? "" : (d.getMonth()+1) + "/" + d.getDate() + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()); };
  var today = function(){ var n = new Date(); return n.getFullYear() + "-" + pad(n.getMonth()+1) + "-" + pad(n.getDate()); };
  function ev(k, code){ try { var w = FR[k] && FR[k].contentWindow; return w && w.eval ? w.eval(code) : undefined; } catch(e) { return undefined; } }
  function txt(k, id, n){ try { var el = FR[k].contentDocument.getElementById(id); return el ? el.innerText.replace(/\n{3,}/g, "\n\n").trim().slice(0, n || 4000) : ""; } catch(e) { return ""; } }
  var pick = function(o, ks){ var r = {}; ks.forEach(function(k){ if (o[k] != null && o[k] !== "") r[k] = o[k]; }); return r; };

  function mathData(){
    var d = ev("math", "typeof load==='function'?load():null"), NOW = ev("math", "typeof NOW!=='undefined'?NOW:null"), on = ev("math", "(function(){try{return !!onNow()}catch(e){return false}})()");
    if (!d) return null;
    var rows = d.rows || [], days = rows.filter(function(r){ return r.kind === "day"; }).sort(function(a,b){ return a.date < b.date ? -1 : 1; });
    var recent = days.slice(-3).map(function(x){ return x.date; });
    var learned = rows.filter(function(r){ return r.kind === "learned"; }).sort(function(a,b){ return a.date < b.date ? 1 : -1; });
    var bySub = {}; learned.forEach(function(r){ bySub[r.subject] = (bySub[r.subject] || 0) + 1; });
    return {
      updated: d.updated, on: on,
      now: NOW ? pick(NOW, ["subj","book","page","item","title"]) : null, nowAt: NOW && NOW.ts ? hm(NOW.ts) : "",
      days: days.map(function(x){ return pick(x, ["date","start","end","minutes","tried","done","right","said","asked","books","comment","hi","questions"]); }),
      bySubjectPerDay: rows.filter(function(r){ return r.kind === "dsub"; }).map(function(x){ return pick(x, ["date","subject","minutes","tried","done","right","said","asked"]); }),
      itemsRecent: rows.filter(function(r){ return r.kind === "item" && recent.indexOf(r.date) >= 0; }).sort(function(a,b){ return (a.date + a.time) < (b.date + b.time) ? -1 : 1; }).map(function(x){ return pick(x, ["date","time","subject","page","label","topic","tries","status"]); }),
      learnedTotalBySubject: bySub,
      learnedLatest: learned.slice(0, 60).map(function(x){ return pick(x, ["date","subject","chapter","topic","page","label","status"]); }),
      screen: txt("math", "take", 400)
    };
  }
  function wordsData(){
    var D = ev("words", "typeof D!=='undefined'?D:null");
    var online = txt("words", "online", 200);
    if (!D || !D.sess) return D === undefined ? null : {online: online, empty: true};
    var act = function(s){ var v = ev("words", "activeMs"); try { return Math.round(v(s) / 60000); } catch(e) { return null; } };
    var per = Object.keys(D.sess).sort().map(function(k){
      var s = D.sess[k], q = s.quiz || [], dc = s.dict || [];
      var g = q.filter(function(x){ return x.mode === "小游戏"; }), rv = q.filter(function(x){ return x.mode === "复习旧词" || x.mode === "单独复习"; });
      var d1 = dc.filter(function(x){ return !x.retry && x.mode === "默写"; });
      var cnt = function(a){ return a.filter(function(x){ return x.ok; }).length + "/" + a.length; };
      return { date: k, from: hm(s.start), to: hm(s.end), minutes: act(s), newWordDaysDone: (s.done || []).map(function(x){ return x.day; }),
        game: cnt(g), dictationFirstTry: cnt(d1), review: cnt(rv), errorBook: s.errStart + "→" + s.errEnd,
        newErrors: s.errNew || [], cleared: s.errCleared || [],
        wrongDictation: dc.filter(function(x){ return !x.ok; }).slice(0, 30).map(function(x){ return x.w + "（写成 " + (x.typed || "空") + "）"; }) };
    });
    var top = Object.entries(D.errors || {}).sort(function(a,b){ return b[1] - a[1]; }).slice(0, 15).map(function(e){ return e[0] + "×" + e[1]; });
    return { online: online, lastActive: D.exported ? hm(D.exported) : "", learnedCount: D.learnedCount || Object.keys(D.words || {}).length, totalWords: D.totalWords || 8171,
      streak: D.streak || 0, mostMissed: top, perDay: per, todayScreen: txt("words", "app", 4000) };
  }

  function writingData(){
    var S = ev("writing", "window.__WS?window.__WS.S:null");
    if (!S || !S.writers) return null;
    var dk = function(t){ var d = new Date(t); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); };
    var works = Array.from(S.works.values()), writers = Array.from(S.writers.values()), vocab = Array.from(S.vocab.values());
    return { writers: writers.map(function(w){
      var ws = works.filter(function(x){ return x.writerId === w.id; }).sort(function(a,b){ return (b.updatedAt||0) - (a.updatedAt||0); });
      var dayTotals = {}; ws.forEach(function(x){ var dw = x.dayWords || {}, ks = Object.keys(dw).sort(); ks.forEach(function(k, i){ var inc = Math.max(0, (dw[k]||0) - (i ? dw[ks[i-1]]||0 : 0)); dayTotals[k] = (dayTotals[k]||0) + inc; }); });
      var reviews = []; ws.forEach(function(x){ (x.reviews || []).forEach(function(r){ reviews.push({date: dk(r.at), work: x.title, chapter: r.chapterTitle, total40: r.total, scores: r.scores, words: r.wc}); }); });
      reviews.sort(function(a,b){ return a.date < b.date ? -1 : 1; });
      var latest = ws[0], lr = null;
      if (latest && latest.lastReviews) { var arr = Object.values(latest.lastReviews).sort(function(a,b){ return b.at - a.at; }); if (arr[0] && arr[0].data) { var d = arr[0].data; lr = {overall: d.overall_zh || d.overall, strengths: d.strengths, issues: (d.issues || []).slice(0, 8).map(function(i){ return i.type ? i.type + "：" + (i.original || i.text || "") + " → " + (i.fix || i.suggestion || "") : JSON.stringify(i).slice(0, 160); })}; } }
      return { name: w.name, level: w.level, worksCount: ws.length,
        works: ws.slice(0, 12).map(function(x){ return {title: x.title, kind: x.kind === "story" ? "小说" : "日记", date: x.date, words: x.wordCount, target: x.target, updated: x.updatedAt ? hm(x.updatedAt) : "", reviews: (x.reviews || []).length}; }),
        wordsPerDay: dayTotals, reviewHistory: reviews.slice(-15), latestReviewDetail: lr,
        latestText: latest ? (latest.chapters || []).map(function(c){ return c.text || ""; }).join("\n").slice(-1500) : "",
        vocabSaved: vocab.filter(function(v){ return v.writerId === w.id; }).length };
    }) };
  }

  // ---------- 状态灯：随时显示准备好了没有 ----------
  function status(){
    var m = mathData(), w = wordsData(), sm = $("st-math"), sw = $("st-words");
    if (m && m.days.length) { var last = m.days[m.days.length - 1];
      sm.textContent = "✓ 已同步 · " + m.days.length + " 天记录 · 最近 " + last.date.slice(5) + " 学了 " + (last.minutes || 0) + " 分钟" + (m.on ? " · 🔴 正在上 " + ((m.now && m.now.subj) || "课") : "");
      sm.className = "s ok"; }
    else { sm.textContent = m ? "已连上，还没有上课记录" : "正在连接实时记录…"; sm.className = "s"; }
    if (w && !w.empty) { var t = w.perDay.filter(function(x){ return x.date === today(); })[0];
      sw.textContent = "✓ 已同步 · 累计 " + w.learnedCount + " 词 · " + (t ? "今天学了 " + (t.minutes || 0) + " 分钟" : "今天还没学") + (w.online ? " · " + w.online.replace(/^[^\s]+\s/, "") : "");
      sw.className = "s ok"; }
    else { sw.textContent = w ? "还没收到单词记录" + (w.online ? "（" + w.online + "）" : "") : "正在连接实时记录…"; sw.className = "s"; }
    var g = writingData(), sg = $("st-writing");
    if (g && g.writers.length) { var tot = 0, tw = 0, td = today(); g.writers.forEach(function(x){ tot += x.worksCount; tw += x.wordsPerDay[td] || 0; });
      sg.textContent = "✓ 已同步 · " + g.writers.map(function(x){ return x.name; }).join("、") + " · 共 " + tot + " 篇 · 今天写了 " + tw + " 词"; sg.className = "s ok"; }
    else { sg.textContent = g ? "已连上，还没有写作者" : "正在连接实时记录…"; sg.className = "s"; }
    $("aidot").style.background = (m && m.days.length) || (w && !w.empty) || (g && g.writers.length) ? "#9ff0c9" : "#f3d27a";
  }
  setInterval(status, 5000); setTimeout(status, 1500);

  // ---------- 侧拉面板 ----------
  function openAI(){ $("ai").classList.add("on"); $("aishade").classList.add("on"); $("ai").setAttribute("aria-hidden", "false"); $("aitab").setAttribute("aria-expanded", "true"); status(); keyUI(); if (!$("ai-log").children.length) hint(); setTimeout(function(){ $("ai-q").focus(); }, 300); }
  function closeAI(){ $("ai").classList.remove("on"); $("aishade").classList.remove("on"); $("ai").setAttribute("aria-hidden", "true"); $("aitab").setAttribute("aria-expanded", "false"); }
  $("aitab").onclick = openAI; $("ai-x").onclick = closeAI; $("aishade").onclick = closeAI;
  addEventListener("keydown", function(e){ if (e.key === "Escape") closeAI(); });
  (function(){ // 手机：在主界面左半边往右划拉出来，往左划收回（避开屏幕最边上，那是 Safari 的「返回」手势）
    var x0 = null, y0 = 0, fromEdge = false;
    addEventListener("touchstart", function(e){ var t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; fromEdge = x0 > 24 && x0 < innerWidth * 0.45 && !$("main").hidden && !$("ai").classList.contains("on"); }, {passive: true});
    addEventListener("touchend", function(e){ if (x0 == null) return; var t = e.changedTouches[0], dx = t.clientX - x0, dy = Math.abs(t.clientY - y0);
      if (fromEdge && dx > 90 && dy < 50) openAI(); else if ($("ai").classList.contains("on") && dx < -70 && dy < 60) closeAI(); x0 = null; }, {passive: true});
  })();

  // ---------- 聊天 ----------
  var KEYK = "hub:anthropicKey", MODEL = "claude-haiku-5-5", HIST = [], busy = false;
  var key = function(){ return store.get(KEYK) || ""; };
  function keyUI(force){ $("keybox").hidden = !(force || !key()); }
  $("ai-key").onclick = function(){ $("keyin").value = ""; keyUI(true); $("keyin").focus(); };
  $("keysave").onclick = function(){ var v = $("keyin").value.trim(); if (!/^sk-ant-/.test(v)) { $("keyin").placeholder = "要 sk-ant- 开头的 Key"; $("keyin").value = ""; return; } store.set(KEYK, v); keyUI(); add("hint", "Key 已保存，可以提问了。"); };
  $("ai-new").onclick = function(){ HIST = []; $("ai-log").replaceChildren(); hint(); };
  function hint(){ add("hint", "选好上面要读的端口，点下面的快捷问题，或者直接问。每次提问都会读取最新的实时记录。"); }

  var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); };
  function md(s){
    var out = [], list = false;
    esc(s).split("\n").forEach(function(l){
      var b = l.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
      if (/^\s*[-•*]\s+/.test(l)) { if (!list) { out.push("<ul>"); list = true; } out.push("<li>" + b.replace(/^\s*[-•*]\s+/, "") + "</li>"); return; }
      if (list) { out.push("</ul>"); list = false; }
      if (/^#{1,4}\s/.test(l)) out.push("<h4>" + b.replace(/^#{1,4}\s/, "") + "</h4>");
      else if (l.trim()) out.push("<p>" + b + "</p>");
    });
    if (list) out.push("</ul>");
    return out.join("");
  }
  function add(cls, text){ var d = document.createElement("div"); d.className = "msg " + cls; if (cls === "a") d.innerHTML = md(text); else d.textContent = text; $("ai-log").append(d); $("ai-log").scrollTop = $("ai-log").scrollHeight; return d; }

  function snapshot(){
    var on = {}; document.querySelectorAll("#ai-src input[data-s]").forEach(function(i){ on[i.dataset.s] = i.checked && !i.disabled; });
    var parts = ["现在时间：" + new Date().toLocaleString("zh-CN") + "（新加坡）"];
    if (on.math) { var m = mathData(); parts.push("【学习课堂（语音上课：数学等）家长端的实时记录】\n" + (m ? JSON.stringify(m) : "暂时还没读到记录。")); }
    if (on.words) { var w = wordsData(); parts.push("【每日 20 词背单词家长看板的实时记录】\n" + (w ? JSON.stringify(w) : "暂时还没读到记录。")); }
    if (on.writing) { var g = writingData(); parts.push("【英文写作工作室家长看板的实时记录】（total40 是 AI 批改总分，满分 40；wordsPerDay 是每天新写的词数）\n" + (g ? JSON.stringify(g) : "暂时还没读到记录。")); }
    return parts.join("\n\n");
  }
  var SYS = "你是「Johnny 学习总部」里的总结助手，帮妈妈 WuYanzi 快速看懂儿子 Johnny（新加坡公立中学 Sec 2）的学习情况。\n" +
    "规则：\n1. 只根据下面给的实时记录回答；记录里没有的就直接说「记录里没有」，绝不编造数字、日期或内容。\n" +
    "2. 一律用简体中文，直接、简洁，先给结论再给依据；数字要和记录一致。\n" +
    "3. 说进度和程度时，分科目讲：学了什么（章节/知识点/单词/写了哪些小说日记）、做得怎么样（答对、默写正确率、错题本变化、写作批改分数和常见错误）、时长和专注情况、跟之前比的变化。\n" +
    "4. 指出需要加强的地方时要具体（哪一题、哪个知识点、哪些单词），并给 1–3 条家长能马上做的建议。\n" +
    "5. 语气客观温和，有进步就肯定，不夸大也不贬低。\n" +
    "6. 用简短的小标题和要点，别写长篇。";

  async function ask(q){
    q = String(q || "").trim(); if (!q || busy) return;
    if (!key()) { keyUI(true); add("e", "请先在上面贴上 Claude 的 API Key。"); return; }
    status();
    busy = true; $("ai-send").disabled = true;
    add("u", q); var a = add("a", "正在读取最新记录并思考…"), text = "";
    HIST.push({role: "user", content: q});
    var msgs = HIST.slice(-8); msgs = msgs.map(function(m, i){ return i === msgs.length - 1 ? {role: "user", content: snapshot() + "\n\n—— 妈妈的问题 ——\n" + m.content} : m; });
    try {
      var r = await fetch("https://api.anthropic.com/v1/messages", { method: "POST",
        headers: {"content-type": "application/json", "x-api-key": key(), "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true"},
        body: JSON.stringify({model: MODEL, max_tokens: 1500, system: SYS, messages: msgs, stream: true}) });
      if (!r.ok) {
        var err = ""; try { err = (await r.json()).error.message; } catch(e) {}
        throw new Error(r.status === 401 ? "API Key 不对或已失效，请点 🔑 重新贴一次。" : r.status === 429 ? "请求太频繁或额度用完了，稍等再试。" : r.status === 529 ? "Claude 现在太忙，稍等几秒再试。" : "出错了（" + r.status + "）" + (err ? "：" + err : ""));
      }
      var rd = r.body.getReader(), dec = new TextDecoder(), buf = "";
      while (true) {
        var c = await rd.read(); if (c.done) break;
        buf += dec.decode(c.value, {stream: true});
        var evs = buf.split("\n\n"); buf = evs.pop();
        evs.forEach(function(e){ e.split("\n").forEach(function(l){
          if (l.indexOf("data:") !== 0) return; var j; try { j = JSON.parse(l.slice(5)); } catch(x) { return; }
          if (j.type === "content_block_delta" && j.delta && j.delta.text) { text += j.delta.text; a.innerHTML = md(text); $("ai-log").scrollTop = $("ai-log").scrollHeight; }
          if (j.type === "error") throw new Error((j.error && j.error.message) || "出错了");
        }); });
      }
      if (!text) throw new Error("没有收到回答，请再试一次。");
      HIST.push({role: "assistant", content: text});
    } catch(e) {
      HIST.pop(); a.remove();
      add("e", e && e.message && !/Failed to fetch|NetworkError|Load failed/i.test(e.message) ? e.message : "连不上 Claude，请检查网络后再试。");
    } finally { busy = false; $("ai-send").disabled = false; }
  }
  $("ai-send").onclick = function(){ var v = $("ai-q").value; $("ai-q").value = ""; ask(v); };
  $("ai-q").addEventListener("keydown", function(e){ if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("ai-send").click(); } });
  document.querySelectorAll("#ai-quick button").forEach(function(b){ b.onclick = function(){ ask(b.textContent.replace(/^\S+\s/, "")); }; });

  if (matchMedia("(hover: none)").matches) $("ai-q").placeholder = "问问 Johnny 的学习情况…";
  addEventListener("error", function(e){ if (e && e.message === "Script error.") { e.preventDefault(); return true; } }, true);
  if (has(location.hash.slice(1))) { done = true; splash.hidden = true; route(); }
})();
</script>
