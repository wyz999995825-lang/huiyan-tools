<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Writing Studio 英文写作工作室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,750&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: slim top bar + one working surface; the editor is ruled notebook paper in the middle, the AI desk on the right */
  --bg:#eceff4; --surface:#ffffff; --surface-2:#f4f6fa; --ink:#18202e; --muted:#5b6578; --line:#d6dbe4;
  --accent:#2b48d6; --accent-soft:#e3e8fd; --on-accent:#ffffff;
  --paper:#ffffff; --rule:#dde5f2; --margin:#efb9b9;
  --marker:#ffe27a; --good:#17845a; --good-soft:#dcf3e8; --warn:#a86100; --warn-soft:#fbecd5; --bad:#c9372c; --bad-soft:#fbe2df;
  --t-grammar:#c9372c; --t-spelling:#8a3fd1; --t-punctuation:#a86100; --t-word:#2b48d6; --t-sentence:#17845a;
  --font-display:"Bricolage Grotesque","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --font-write:"Literata",Georgia,"Songti SC",serif;
  --radius:12px; --shadow:0 1px 2px rgba(20,30,60,.06),0 6px 20px rgba(20,30,60,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141b; --surface:#191d26; --surface-2:#20252f; --ink:#e7eaf1; --muted:#9aa3b6; --line:#2d3341;
    --accent:#8098ff; --accent-soft:#232c52; --on-accent:#0d1020;
    --paper:#1b202a; --rule:#272e3b; --margin:#5a2e33;
    --marker:rgba(255,214,90,.28); --good:#4cc792; --good-soft:#163428; --warn:#f0a94a; --warn-soft:#3a2a12; --bad:#ff7a6e; --bad-soft:#3d1c1a;
    --t-grammar:#ff7a6e; --t-spelling:#c08cff; --t-punctuation:#f0a94a; --t-word:#8098ff; --t-sentence:#4cc792;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11141b; --surface:#191d26; --surface-2:#20252f; --ink:#e7eaf1; --muted:#9aa3b6; --line:#2d3341;
  --accent:#8098ff; --accent-soft:#232c52; --on-accent:#0d1020;
  --paper:#1b202a; --rule:#272e3b; --margin:#5a2e33;
  --marker:rgba(255,214,90,.28); --good:#4cc792; --good-soft:#163428; --warn:#f0a94a; --warn-soft:#3a2a12; --bad:#ff7a6e; --bad-soft:#3d1c1a;
  --t-grammar:#ff7a6e; --t-spelling:#c08cff; --t-punctuation:#f0a94a; --t-word:#8098ff; --t-sentence:#4cc792;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:30px;font-weight:750;letter-spacing:-.01em}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
h4{font-size:14px;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}

/* top bar */
#top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{max-width:1440px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;cursor:pointer;background:none;border:0;padding:0}
.brand b{font-family:var(--font-display);font-size:19px;font-weight:750;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:13px}
.top-sp{flex:1}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);padding:4px 10px;border-radius:99px;background:var(--surface-2)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--good)}
.sync.local i{background:var(--warn)}
.net{max-width:1440px;margin:8px auto 0;padding:8px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13.5px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:700;font-size:14px;line-height:1.2;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:30px;height:30px;display:inline-grid;place-items:center;cursor:pointer;font-size:14px;padding:0;flex:none}
.icon-btn:hover{border-color:var(--accent)}
input[type=text],input[type=number],input[type=date],input[type=password],input:not([type]),select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;width:100%}
label{font-size:13px;color:var(--muted);font-weight:700}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--surface-2);color:var(--muted);border:1px solid transparent;white-space:nowrap}
button.chip{cursor:pointer}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:2px;background:var(--surface-2)}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:8px;cursor:pointer;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.note{padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13.5px}
.av{--c:#2b48d6;width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;background:var(--c);color:#fff;font-family:var(--font-display);font-weight:750;font-size:15px;flex:none}
.av.lg{width:56px;height:56px;font-size:24px}
.av.sm{width:26px;height:26px;font-size:12px}
.kind{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap}
.kind.story{background:var(--accent-soft);color:var(--accent)}
.kind.diary{background:var(--good-soft);color:var(--good)}
.bar{display:block;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.bar.done i{background:var(--good)}
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--accent-soft);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation-duration:3s}.bar i{transition:none}.pulse{animation:none!important}}

main#app{max-width:1440px;margin:0 auto;padding:22px 16px 60px}
.loading{padding:80px 0;text-align:center;color:var(--muted)}

/* home */
.home-head{display:grid;gap:6px;margin-bottom:20px}
.writer-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.writer-card{display:grid;justify-items:start;gap:6px;padding:18px;text-align:left;cursor:pointer;color:var(--ink)}
.writer-card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.wc-name{font-family:var(--font-display);font-size:20px;font-weight:750}
.wc-stats{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.wc-stats b{color:var(--ink)}
.add-writer{padding:18px;display:grid;gap:8px;align-content:start;border-style:dashed}
.home-intro{margin-top:26px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.home-intro div{padding:14px 16px;border-left:3px solid var(--accent);background:var(--surface);border-radius:0 10px 10px 0}
.home-intro b{display:block;margin-bottom:2px}

/* writer page */
.w-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.w-head .lvl{width:auto}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.tile{padding:14px 16px}
.tile b{display:block;font-family:var(--font-display);font-size:26px;font-weight:750;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.new-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.work-list{display:grid;gap:10px}
.work-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;text-align:left;cursor:pointer;width:100%;color:var(--ink)}
.work-row:hover{border-color:var(--accent)}
.wr-main{display:grid;gap:5px;min-width:0}
.wr-main b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wr-side{display:grid;justify-items:end;gap:4px;font-size:13px;color:var(--muted)}
.wr-side .num b{color:var(--ink);font-size:15px}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius)}
.vocab-list{display:grid;gap:8px}
.v-row{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) auto;gap:12px;align-items:center;padding:10px 14px}
.v-row .w{font-weight:700;font-size:16px}
.v-row .ipa{color:var(--muted);font-size:13px;margin-left:6px}
.v-row .acts{display:flex;gap:6px;align-items:center}
.boxes{display:inline-flex;gap:2px;margin-right:4px}
.boxes i{width:6px;height:12px;border-radius:2px;background:var(--line)}
.boxes i.on{background:var(--good)}
.prog-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px}
.prog-grid>.card{padding:16px}
.chart svg{width:100%;height:auto;display:block}
.hist{display:grid;gap:6px;margin-top:10px}
.hist div{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line)}

/* editor */
.ed-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ed-title{flex:1 1 260px;font-family:var(--font-display)!important;font-size:22px!important;font-weight:750;border:1px solid transparent!important;background:transparent!important;padding:4px 8px!important}
.ed-title:hover,.ed-title:focus{border-color:var(--line)!important;background:var(--surface)!important}
.wcbox{display:grid;gap:4px;min-width:150px;font-size:13px}
.save-state{font-size:12.5px;color:var(--muted);min-width:72px}
.save-state.err{color:var(--bad);font-weight:700}
.ed-grid{display:grid;grid-template-columns:220px minmax(0,1fr) 390px;gap:14px;align-items:start}
.ed-left{padding:14px;display:grid;gap:10px;position:sticky;top:70px}
.ch-list{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.ch-btn{width:100%;display:flex;justify-content:space-between;gap:6px;align-items:center;padding:7px 9px;border-radius:8px;border:1px solid transparent;background:none;cursor:pointer;text-align:left;font-size:14px;color:var(--ink)}
.ch-btn:hover{background:var(--surface-2)}
.ch-btn.on{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.ch-btn small{color:var(--muted);font-variant-numeric:tabular-nums}
.ch-item{display:flex;gap:4px;align-items:center}
.ch-del{border:0;background:none;color:var(--muted);cursor:pointer;padding:4px;font-size:15px;line-height:1}
.ch-del:hover{color:var(--bad)}
.moods{display:flex;flex-wrap:wrap;gap:6px}
.prompt-box{padding:10px 12px;border-radius:10px;background:var(--surface-2);display:grid;gap:6px;font-size:13.5px}
.teacher-note{padding:10px 12px;border-radius:10px;background:var(--warn-soft);display:grid;gap:4px;font-size:14px}
.teacher-note b{color:var(--warn)}
.ed-center{display:grid;gap:10px;min-width:0}
.ed-chead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ed-chead input{flex:1 1 200px;font-weight:700}
.paper{display:block;width:100%;min-height:560px;height:calc(100vh - 250px);font-family:var(--font-write);font-size:18px;line-height:34px;color:var(--ink);padding:17px 22px 34px 58px;border:1px solid var(--line);border-radius:var(--radius);
  background-color:var(--paper);
  background-image:linear-gradient(90deg,transparent 42px,var(--margin) 42px,var(--margin) 43px,transparent 43px),repeating-linear-gradient(to bottom,transparent 0,transparent 33px,var(--rule) 33px,var(--rule) 34px);
  background-position:0 0,0 17px;background-attachment:local;resize:vertical;box-shadow:var(--shadow)}
textarea.paper:focus{outline:none;border-color:var(--accent)}
.annot{overflow:auto;white-space:pre-wrap;word-wrap:break-word;resize:none}
.annot-empty{font-family:var(--font-body);color:var(--muted)}
mark.iss{background:transparent;color:inherit;border-bottom:2.5px solid var(--t-grammar);cursor:pointer;padding:0 1px;border-radius:2px}
mark.iss:hover,mark.iss:focus{background:var(--marker)}
mark.iss.t-spelling{border-bottom-color:var(--t-spelling)}
mark.iss.t-punctuation{border-bottom-color:var(--t-punctuation)}
mark.iss.t-word{border-bottom-color:var(--t-word)}
mark.iss.t-sentence{border-bottom-color:var(--t-sentence)}
mark.upm{background:transparent;color:inherit;border-bottom:2px dotted var(--accent);cursor:pointer}
mark.upm:hover,mark.upm:focus{background:var(--accent-soft)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:0;border-bottom:2.5px solid}
.ed-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.ed-right{position:sticky;top:70px;display:flex;flex-direction:column;max-height:calc(100vh - 90px)}
.ed-right .tabs{margin:0;padding:0 8px;flex:none}
.r-pane{padding:14px;overflow:auto;flex:1 1 auto;min-height:0;display:grid;gap:14px;align-content:start}
.dict-search{display:flex;gap:6px}
.dict-card{display:grid;gap:8px}
.dict-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.dict-head h3{font-size:24px}
.ipa{color:var(--muted);font-size:14px}
.dict-card .zh{font-size:16px;font-weight:700}
.ex{font-family:var(--font-write);font-style:italic;color:var(--muted)}
.ups{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ups li{padding:9px 10px;border:1px solid var(--line);border-radius:10px;display:grid;gap:4px}
.ups .uh{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ups .uh b{font-size:15px}
.recent{display:flex;gap:6px;flex-wrap:wrap}
.working{display:flex;gap:10px;align-items:center;padding:12px;border-radius:10px;background:var(--accent-soft)}
.working>div{flex:1}
.score-card{padding:14px;border-radius:12px;background:var(--surface-2);display:grid;gap:10px}
.score-big{display:flex;align-items:baseline;gap:4px}
.score-big b{font-family:var(--font-display);font-size:40px;font-weight:750;line-height:1;font-variant-numeric:tabular-nums}
.score-big span{color:var(--muted);font-weight:700}
.band{margin-left:auto;font-style:normal;font-weight:700;font-size:13px;padding:3px 10px;border-radius:99px}
.band.b4{background:var(--good-soft);color:var(--good)} .band.b3{background:var(--accent-soft);color:var(--accent)}
.band.b2{background:var(--warn-soft);color:var(--warn)} .band.b1{background:var(--bad-soft);color:var(--bad)}
.dims{display:grid;gap:6px}
.dim{display:grid;grid-template-columns:150px minmax(0,1fr) 22px;gap:8px;align-items:center;font-size:13px}
.dim b{text-align:right;font-variant-numeric:tabular-nums}
.dbar{height:8px;border-radius:99px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.dbar i{display:block;height:100%;background:var(--accent)}
.rv-sec{display:grid;gap:8px}
.rv-sec h4{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rv-sec ul{margin:0;padding-left:18px;display:grid;gap:4px}
.en-note{color:var(--muted);font-size:13.5px;font-style:italic}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.iss-card{border:1px solid var(--line);border-left:4px solid var(--t-grammar);border-radius:10px;padding:10px 12px;display:grid;gap:7px;scroll-margin:12px}
.iss-card.t-spelling{border-left-color:var(--t-spelling)} .iss-card.t-punctuation{border-left-color:var(--t-punctuation)}
.iss-card.t-word{border-left-color:var(--t-word)} .iss-card.t-sentence{border-left-color:var(--t-sentence)}
.iss-card.focus{box-shadow:0 0 0 2px var(--accent)}
.iss-card.applied{opacity:.75}
.iss-head{display:flex;gap:6px;align-items:center}
.tchip{font-size:12px;font-weight:700;padding:1px 8px;border-radius:6px;color:#fff;background:var(--t-grammar)}
.tchip.t-spelling{background:var(--t-spelling)} .tchip.t-punctuation{background:var(--t-punctuation)}
.tchip.t-word{background:var(--t-word)} .tchip.t-sentence{background:var(--t-sentence)}
:root[data-theme="dark"] .tchip{color:#111}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tchip{color:#111}}
.quote{font-family:var(--font-write);background:var(--marker);padding:2px 6px;border-radius:4px;justify-self:start}
.iss-card.applied .quote{text-decoration:line-through;background:var(--surface-2)}
.hint{font-size:14px}
.fix{font-family:var(--font-write);color:var(--good)}
.fixed{font-family:var(--font-write);color:var(--good);font-weight:600}
.why{font-size:13.5px;color:var(--muted)}
.try{display:grid;gap:6px}
.try input{font-family:var(--font-write)}
.ok{color:var(--good);font-size:13.5px;font-weight:700}
.no{color:var(--warn);font-size:13.5px;font-weight:700}
.up-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;scroll-margin:12px}
.up-row .from{font-family:var(--font-write);text-decoration:underline dotted var(--accent)}
.up-row.focus{background:var(--accent-soft);border-radius:8px;padding:7px 8px}
.model{padding:10px 12px;border-radius:10px;background:var(--surface-2);display:grid;gap:6px;font-size:14px}
.model .o{font-family:var(--font-write);color:var(--muted)}
.model .n{font-family:var(--font-write);font-weight:600}
.coach-intro{font-size:13.5px;color:var(--muted)}
.msgs{display:grid;gap:8px}
.msg{padding:9px 12px;border-radius:12px;font-size:14.5px;max-width:92%;white-space:normal}
.msg.u{justify-self:end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.msg.a{justify-self:start;background:var(--surface-2);border-bottom-left-radius:4px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.coach-form{display:grid;gap:6px}
.coach-form textarea{resize:vertical;min-height:58px}

/* vocab review */
.vr{max-width:620px;margin:0 auto;display:grid;gap:16px}
.vr-card{padding:26px;display:grid;gap:12px}
.vr-zh{font-size:26px;font-weight:700;font-family:var(--font-display)}
.vr-card input{font-size:22px;font-family:var(--font-write);padding:10px 14px}
.vr-res{padding:12px 14px;border-radius:10px;font-weight:700}
.vr-res.r{background:var(--good-soft);color:var(--good)} .vr-res.w{background:var(--bad-soft);color:var(--bad)}

/* dashboard */
.dash-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--good);font-weight:700}
.live i,.pulse{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block;animation:pl 1.6s ease-in-out infinite}
@keyframes pl{50%{opacity:.25}}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:24px}
.d-card{padding:16px;display:grid;gap:12px;cursor:pointer;text-align:left;color:var(--ink);width:100%}
.d-card:hover,.d-card.sel{border-color:var(--accent)}
.d-card.sel{box-shadow:0 0 0 2px var(--accent)}
.d-top{display:flex;gap:10px;align-items:center}
.d-top div{display:grid}
.d-status{font-size:13px;color:var(--muted)}
.d-status.on{color:var(--good);font-weight:700}
.d-nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.d-nums div{display:grid}
.d-nums b{font-family:var(--font-display);font-size:20px;font-variant-numeric:tabular-nums}
.d-nums span{font-size:12px;color:var(--muted)}
.d-score{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.d-score svg{flex:1;height:34px}
.feed{display:grid;gap:8px}
.f-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.f-row:hover{border-color:var(--accent)}
.f-main{display:grid;gap:3px;min-width:0}
.f-main b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f-side{display:grid;justify-items:end;gap:3px;font-size:13px;color:var(--muted)}
.pin-box{max-width:360px;margin:60px auto;padding:24px;display:grid;gap:12px}
.dash-settings{margin-top:28px;padding:14px 16px}
.dash-settings summary{cursor:pointer;font-weight:700}
.set-grid{display:grid;gap:14px;margin-top:12px}
.read-head{display:grid;gap:8px;margin-bottom:16px}
.read-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.read-ch{display:grid;gap:10px;margin-bottom:20px}
.read-ch .paper{height:auto;min-height:0;resize:none}
.read-side{position:sticky;top:70px;padding:14px;display:grid;gap:10px}

/* AI helper bubble */
.paper-wrap{position:relative}
.tipb{position:absolute;top:12px;z-index:5;max-width:min(320px,80%);display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--accent);box-shadow:0 8px 28px rgba(20,30,70,.18);font-size:14px;line-height:1.45;animation:tipIn .25s ease-out}
.tipb.r{right:12px} .tipb.l{left:12px}
.tipb .tl{font-size:11.5px;font-weight:700;color:var(--accent);display:block;margin-bottom:2px}
.tipb.t-grammar,.tipb.t-spelling{border-color:var(--t-grammar)} .tipb.t-grammar .tl,.tipb.t-spelling .tl{color:var(--t-grammar)}
.tipb.t-praise{border-color:var(--good)} .tipb.t-praise .tl{color:var(--good)}
.tipb button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:0 2px}
@keyframes tipIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.tipb{animation:none}}
.watch-tog{display:inline-flex;align-items:center;gap:6px}
.tip-hist{display:grid;gap:6px}
.tip-hist div{font-size:13.5px;padding:7px 10px;border-radius:8px;background:var(--surface-2)}

/* planner */
.plan{max-width:1100px;margin:0 auto;display:grid;gap:16px}
.plan-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.plan-q{padding:18px;display:grid;gap:12px}
.plan-q .q{display:grid;gap:4px}
.plan-q .q label{color:var(--ink);font-size:14px}
.plan-q .q span{font-size:12.5px;color:var(--muted)}
.plan-q textarea{resize:vertical;min-height:44px}
.plan-r{padding:18px;display:grid;gap:14px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.facts div{padding:10px 12px;border-radius:10px;background:var(--surface-2);display:grid;gap:2px;font-size:14px}
.facts b{font-size:12px;color:var(--muted)}
.outline{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:pt}
.outline li{padding:12px 14px 12px 46px;border:1px solid var(--line);border-radius:10px;position:relative;display:grid;gap:5px;counter-increment:pt}
.outline li::before{content:counter(pt);position:absolute;left:12px;top:12px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:13px}
.outline .pt{font-weight:700}
.words{display:flex;gap:6px;flex-wrap:wrap}
.missing{padding:10px 12px;border-radius:10px;background:var(--warn-soft);font-size:14px}
.missing b{color:var(--warn)}
@media (max-width:860px){.plan-grid{grid-template-columns:1fr}.facts{grid-template-columns:1fr}}

/* monitor studio */
.mon-panel{padding:16px;margin-bottom:20px;display:grid;gap:10px}
.mon-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.mon-row .grow{flex:1;min-width:140px;display:grid}
.mon-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.mon-stat{font-size:13.5px;color:var(--muted)}
.mon-stat b.ok{color:var(--good)} .mon-stat b.away{color:var(--warn)}
.mon-stage{position:relative;height:calc(100vh - 170px);min-height:320px;background:#0d1018;border-radius:12px;overflow:hidden}
.mon-scale{position:absolute;top:0;left:0;transform-origin:0 0;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.mon-scale iframe{display:block;border:0;background:#fff;pointer-events:none}
.mon-cur{position:absolute;width:22px;height:22px;pointer-events:none;z-index:3;transition:left .06s linear,top .06s linear;left:-40px;top:-40px}
.mon-ring{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid #ffb020;pointer-events:none;z-index:2;animation:ring .6s ease-out forwards}
@keyframes ring{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
.mon-msg{position:absolute;inset:0;display:grid;place-items:center;color:#c9cfdb;font-size:15px;text-align:center;padding:20px;z-index:4;background:rgba(13,16,24,.82)}
.mon-msg[hidden]{display:none}
@media (max-width:800px){.mon-stage{height:calc(100vh - 210px)}}
.mon-stage:fullscreen{height:100vh;border-radius:0}

/* parent sign-in */
.auth{max-width:920px;margin:30px auto;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;align-items:start}
.auth-intro{display:grid;gap:12px;padding-top:12px}
.auth-card{padding:20px;display:grid;gap:16px}
.auth-card .seg{justify-self:start}
.auth-form{display:grid;gap:8px}
.auth-form .btn{margin-top:6px}
.chk{display:flex;gap:8px;align-items:center;font-weight:400;color:var(--muted);margin-top:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:760px){.auth{grid-template-columns:1fr;margin-top:10px}}

/* delete buttons on cards */
.del-wrap{position:relative;display:grid}
.del-x{position:absolute;top:8px;right:8px;z-index:2;width:28px;height:28px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;opacity:.55}
.del-wrap:hover .del-x,.del-x:focus-visible{opacity:1;border-color:var(--line);background:var(--surface)}
.del-x:hover{color:var(--bad);border-color:var(--bad)!important}
@media (hover:none){.del-x{opacity:.8}}
.work-row{padding-right:44px}

.mon-row.off{opacity:.62}
.d-status.off{color:var(--muted)}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(10,14,25,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal-card{background:var(--surface);border-radius:14px;padding:20px;max-width:380px;width:100%;display:grid;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;display:grid;gap:8px;width:min(92vw,420px)}
.t{padding:11px 14px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.t.bad{background:var(--bad);color:#fff}

@media (max-width:1180px){
  .ed-grid{grid-template-columns:minmax(0,1fr) 360px}
  .ed-left{grid-column:1 / -1;position:static;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));align-items:start}
  .read-grid{grid-template-columns:1fr}
  .read-side{position:static}
}
@media (max-width:800px){
  .ed-grid{grid-template-columns:1fr}
  .ed-right{position:static;max-height:none}
  .paper{height:60vh;min-height:380px;font-size:17px;padding-left:46px;background-image:linear-gradient(90deg,transparent 32px,var(--margin) 32px,var(--margin) 33px,transparent 33px),repeating-linear-gradient(to bottom,transparent 0,transparent 33px,var(--rule) 33px,var(--rule) 34px)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .prog-grid{grid-template-columns:1fr}
  .v-row{grid-template-columns:1fr auto}
  .v-row .def{grid-column:1 / -1;grid-row:2}
  .dim{grid-template-columns:120px minmax(0,1fr) 22px}
  h1{font-size:25px}
}
@media (max-width:440px){
  .work-row,.f-row{grid-template-columns:minmax(0,1fr) auto}
  .work-row>.kind,.f-row>.av{display:none}
  .brand span{display:none}
}
</style>

<body>
<header id="top"></header>
<div id="netbar"></div>
<main id="app"><div class="loading">正在打开写作工作室…</div></main>
<div id="toast" aria-live="polite"></div>
<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escRe=s=>String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,'0');
const dayKey=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const countWords=t=>((t||'').match(/[A-Za-z0-9]+(?:['’\-][A-Za-z0-9]+)*/g)||[]).length;
const fmtNum=n=>Number(n||0).toLocaleString('en-US');
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(key){ if(!key) return ''; const p=key.split('-'); return `${+p[2]} ${MON[+p[1]-1]} ${p[0]}`; }
function relTime(ms){
  if(!ms) return '';
  const d=(Date.now()-ms)/1000;
  if(d<60) return '刚刚';
  if(d<3600) return Math.floor(d/60)+' 分钟前';
  if(d<86400 && dayKey(new Date(ms))===dayKey()) return Math.floor(d/3600)+' 小时前';
  const dt=new Date(ms); return (dt.getMonth()+1)+'月'+dt.getDate()+'日';
}
const safeId=s=>String(s).toLowerCase().replace(/[^a-z0-9\-]/g,'').slice(0,60)||'x';

const LEVELS={
  p12:{label:'P1–P2',desc:'lower primary (Primary 1-2, about age 7-8) in a Singapore school'},
  p34:{label:'P3–P4',desc:'middle primary (Primary 3-4, about age 9-10) in a Singapore school'},
  p56:{label:'P5–P6 (PSLE)',desc:'upper primary (Primary 5-6, preparing for PSLE) in a Singapore school'},
  s12:{label:'Sec 1–2',desc:'lower secondary (Secondary 1-2) in a Singapore school'},
  s34:{label:'Sec 3–4 (O-Level)',desc:'upper secondary (Secondary 3-4, O-Level / SEC) in a Singapore school'},
  adult:{label:'成人',desc:'adult learner of English'}
};
const levelKey=w=>(w&&LEVELS[w.level])?w.level:'s12';
const levelOf=w=>LEVELS[levelKey(w)];
const STORY_TARGET={p12:300,p34:800,p56:1200,s12:2000,s34:2000,adult:2000};
const DIARY_TARGET={p12:80,p34:150,p56:200,s12:250,s34:300,adult:300};
const COLORS=['#2b48d6','#c9372c','#17845a','#8a3fd1','#a86100','#0f7f99','#c2387a'];
const MOODS=[['happy','😀 开心'],['excited','🤩 兴奋'],['calm','😌 平静'],['tired','😪 累'],['sad','😢 难过'],['angry','😠 生气'],['worried','😟 担心']];
const ISSUE_TYPES={grammar:'语法',spelling:'拼写',punctuation:'标点',word:'用词',sentence:'句子'};
const DIMS=[['content','内容 Content'],['organisation','结构 Organisation'],['language','语言 Language'],['vocabulary','词汇 Vocabulary']];
const DIARY_PROMPTS=[
  '今天最难忘的一刻是什么？当时你看到、听到、闻到了什么？',
  '今天谁让你笑了？他／她说了什么、做了什么？',
  '今天有没有一件事让你不开心？如果重来一次，你会怎么做？',
  '描写今天吃过最好吃（或最难吃）的东西，用上味道和口感。',
  '今天学到了什么新东西？你是怎么学会的？',
  '如果把今天拍成电影，片名会叫什么？为什么？',
  '今天你帮了谁，或者谁帮了你？',
  '写一写窗外的天气，以及它让你有什么感觉。',
  '今天有没有一个让你紧张的时刻？你的身体有什么反应？',
  '明天你最期待什么？为什么？'
];
const INTERVALS=[0,1,2,4,7,15,30];

/* ---------------- store ---------------- */
const COLS=['writers','works','vocab','comments','settings','parents'];
const S={writers:new Map(),works:new Map(),vocab:new Map(),comments:new Map(),settings:new Map(),parents:new Map()};
const loaded=new Set();
let db=null, sample=null, cloud=false, ready=false, aiOff=false, netNote='';
const LS_KEY='writing_studio_v1';
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function ssGet(k){try{return sessionStorage.getItem(k)}catch(e){return null}}
function ssSet(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}
function loadLocal(){
  const raw=lsGet(LS_KEY); if(!raw) return;
  try{ const o=JSON.parse(raw); COLS.forEach(c=>{ S[c]=new Map(Object.entries(o[c]||{})); }); }catch(e){}
}
function persistLocal(){ const o={}; COLS.forEach(c=>{ o[c]=Object.fromEntries(S[c]); }); lsSet(LS_KEY,JSON.stringify(o)); }

const writeQ=new Map();
function saveDoc(col,id,data){
  S[col].set(id,data); onData(col);
  if(!cloud){ persistLocal(); setSave('saved'); return Promise.resolve(); }
  const key=col+'/'+id;
  let q=writeQ.get(key);
  if(!q){ q={busy:false,pending:null,done:Promise.resolve()}; writeQ.set(key,q); }
  q.pending=clone(data);
  if(!q.busy){
    q.busy=true;
    q.done=(async()=>{
      while(q.pending){ const d=q.pending; q.pending=null; setSave('saving'); await writeOnce(key,d); }
      q.busy=false;
    })();
  }
  return q.done;
}
async function writeOnce(key,d){
  try{ await db.doc(key).set(d); setSave('saved'); }
  catch(e){
    if(e&&e.code==='unavailable'){
      await sleep(600+Math.random()*900);
      try{ await db.doc(key).set(d); setSave('saved'); return; }catch(e2){ e=e2; }
    }
    setSave('error');
    const c=e&&e.code;
    toast(c==='quota_exceeded'?'云端空间满了，请删掉一些旧作品再保存。':c==='invalid_argument'?'这个账号在这里没有保存权限，内容没有存上。':'保存失败，请检查网络；继续输入会再次保存。','bad');
  }
}
function removeDoc(col,id){
  S[col].delete(id); onData(col);
  if(!cloud){ persistLocal(); return Promise.resolve(); }
  return db.doc(col+'/'+id).delete().catch(()=>toast('删除失败，请检查网络再试。','bad'));
}
function subscribe(col){
  let got=false;
  const t=setTimeout(()=>{ if(!got){ netNote='云端数据还没连上，显示的可能不是最新内容。'; renderNet(); } },10000);
  db.collection(col).onSnapshot(snap=>{
    if(!snap.metadata.fromCache && !got){ got=true; clearTimeout(t); }
    loaded.add(col);
    if(got && netNote && COLS.every(c=>loaded.has(c))){ netNote=''; renderNet(); }
    const m=new Map(); snap.docs.forEach(d=>{ if(d.exists) m.set(d.id,d.data()); });
    S[col]=m; onData(col);
  },err=>{
    got=true; clearTimeout(t); loaded.add(col);
    netNote='暂时连不上云端数据库，正在自动重试…如果一直显示这句：请确认电脑联网，并且是把文件下载下来、用 Chrome 或 Safari 打开的（在 Claude 聊天里直接预览是不能联网的）。'; renderNet(); onData(col);
  });
}

/* ---------------- helpers on data ---------------- */
const worksOf=id=>[...S.works.values()].filter(w=>w.writerId===id);
const vocabOf=id=>[...S.vocab.values()].filter(v=>v.writerId===id).sort((a,b)=>(b.addedAt||0)-(a.addedAt||0));
function todayWordsOf(work){
  const dw=work.dayWords||{}; const t=dayKey(); if(dw[t]==null) return 0;
  const prev=Object.keys(dw).filter(k=>k<t).sort();
  return Math.max(0,dw[t]-(prev.length?dw[prev[prev.length-1]]:0));
}
function reviewsOf(id){
  return worksOf(id).flatMap(w=>(w.reviews||[]).map(r=>Object.assign({},r,{workId:w.id,title:w.title}))).sort((a,b)=>a.at-b.at);
}
function streakOf(id){
  const days=new Set(); worksOf(id).forEach(w=>Object.keys(w.dayWords||{}).forEach(k=>days.add(k)));
  let n=0; const d=new Date(); if(!days.has(dayKey(d))) d.setDate(d.getDate()-1);
  while(days.has(dayKey(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
const sumScores=s=>DIMS.reduce((a,[k])=>a+(+(s&&s[k])||0),0);
function band(t){ return t>=34?['优秀 Excellent','b4']:t>=28?['良好 Good','b3']:t>=20?['合格 Fair','b2']:['加油 Keep going','b1']; }
function isActive(w){ return worksOf(w.id).some(x=>Date.now()-(x.updatedAt||0)<120000); }

/* ---------------- UI basics ---------------- */
function toast(msg,kind){
  if(!msg) return;
  const el=document.createElement('div'); el.className='t'+(kind?' '+kind:''); el.textContent=msg;
  $('#toast').append(el); setTimeout(()=>el.remove(),4200);
}
function confirmType(msg,need,okText){
  return new Promise(res=>{
    const d=document.createElement('div'); d.className='modal';
    d.innerHTML=`<form class="modal-card" role="dialog" aria-modal="true"><p>${esc(msg)}</p><label for="cfIn">请输入「${esc(need)}」确认</label><input id="cfIn" autocomplete="off"><div class="row end"><button class="btn ghost" type="button" data-r="0">取消</button><button class="btn danger" type="submit" disabled>${esc(okText||'删除')}</button></div></form>`;
    document.body.append(d);
    const inp=d.querySelector('#cfIn'), ok=d.querySelector('[type=submit]');
    inp.addEventListener('input',()=>{ ok.disabled=inp.value.trim()!==need; });
    const done=v=>{ d.remove(); res(v); };
    d.querySelector('form').addEventListener('submit',e=>{ e.preventDefault(); e.stopPropagation(); if(inp.value.trim()===need) done(true); });
    d.addEventListener('click',e=>{ if(e.target===d||e.target.closest('[data-r="0"]')) done(false); });
    inp.focus();
  });
}
async function deleteWriter(id){
  const w=S.writers.get(id); if(!w) return;
  const works=worksOf(w.id);
  if(!await confirmType(`删除作者「${w.name}」？TA 的 ${works.length} 篇作品、批改记录和生词本会全部删掉，不能恢复。`,w.name,'全部删除')) return;
  for(const x of works){ await removeDoc('works',x.id); if(S.comments.has(x.id)) await removeDoc('comments',x.id); }
  for(const v of vocabOf(w.id)) await removeDoc('vocab',v.id);
  await removeDoc('writers',w.id);
  if(V.writerId===id&&!PARENT){ V.writerId=null; V.view='home'; render(); }
  toast(`已删除「${w.name}」。`);
}
async function deleteWork(id){
  const x=S.works.get(id); if(!x) return;
  if(!await confirmBox(`删除${x.kind==='story'?'小说':'日记'}《${x.title}》（${fmtNum(x.wordCount)} 词）？删除后不能恢复。`,'删除')) return;
  if(draft&&draft.id===id){ dirty=false; clearTimeout(saveTimer); draft=null; }
  await removeDoc('works',id); if(S.comments.has(id)) await removeDoc('comments',id);
  toast(`已删除《${x.title}》。`);
}
function confirmBox(msg,okText){
  return new Promise(res=>{
    const d=document.createElement('div'); d.className='modal';
    d.innerHTML=`<div class="modal-card" role="dialog" aria-modal="true"><p>${esc(msg)}</p><div class="row end"><button class="btn ghost" data-r="0">取消</button><button class="btn danger" data-r="1">${esc(okText||'确定')}</button></div></div>`;
    document.body.append(d);
    d.addEventListener('click',e=>{ const b=e.target.closest('[data-r]'); if(b||e.target===d){ d.remove(); res(!!b&&b.dataset.r==='1'); } });
    d.querySelector('[data-r="1"]').focus();
  });
}

function levelOptions(sel){ return Object.entries(LEVELS).map(([k,v])=>`<option value="${k}"${k===sel?' selected':''}>${esc(v.label)}</option>`).join(''); }
function say(t){
  try{
    const synth=window.speechSynthesis; if(!synth) throw 0;
    const u=new SpeechSynthesisUtterance(t); u.lang='en-GB'; u.rate=.9;
    const vs=synth.getVoices(); const v=vs.find(x=>/en[-_]GB/i.test(x.lang))||vs.find(x=>/^en/i.test(x.lang)); if(v) u.voice=v;
    synth.cancel(); synth.speak(u);
  }catch(e){ toast('这台设备不能朗读。'); }
}
function fmtMsg(t){ return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>'); }

const clean=s=>String(s||'').replace(/"/g,"'").replace(/\s+/g,' ').trim();

function reviewPrompt(ch,idx){
  const kind=draft.kind==='story'
    ? `short story (narrative writing)${draft.chapters.length>1?`, chapter ${idx+1} of ${draft.chapters.length} ("${clean(ch.title)}")`:''}`
    : 'diary entry (personal recount)';
  return `You are an experienced, warm Singapore English teacher marking a piece of writing by a student at this level: ${lvDesc()}.
The piece is a ${kind}. Title: "${clean(draft.title)}".
Mark it the way a Singapore MOE English teacher would for this level, judging against what is expected at this level (not against adult writing). Be honest, specific and encouraging.

STUDENT'S TEXT (between the markers):
<<<TEXT
${ch.text}
TEXT>>>

Reply with ONLY one JSON object in exactly this shape:
{"scores":{"content":7,"organisation":6,"language":6,"vocabulary":5},
 "summary_en":"Two short sentences of overall feedback in simple English.",
 "summary_zh":"两三句中文总评。",
 "strengths":["具体指出写得好的地方（中文）"],
 "next_steps":["最重要的改进方向（中文）"],
 "issues":[{"quote":"exact words copied from the text","type":"grammar","hint_zh":"中文提示","fix":"corrected words","why_zh":"中文规则说明"}],
 "upgrades":[{"from":"plain word from the text","to":"better word","zh":"中文意思"}],
 "models":[{"original":"one sentence copied from the text","improved":"a rewritten version","tip_zh":"技巧说明"}]}

Rules:
- scores are whole numbers from 0 to 10. content = ideas, relevance, interest and development; organisation = structure, paragraphing and flow; language = accuracy of grammar, spelling and punctuation; vocabulary = word choice and expression.
- strengths: up to 3. next_steps: up to 3.
- issues: up to 20 real errors, most important first. "quote" must be copied character-for-character from the text (1 to 12 words) and contain the error. "type" is one of grammar, spelling, punctuation, word, sentence. "hint_zh" is a Socratic hint in Chinese that points the student to the problem WITHOUT giving the correct answer. "fix" is the corrected version of exactly the quoted words. "why_zh" explains the rule briefly in Chinese.
- Singapore uses British English: do not flag British spellings such as colour or realised.
- upgrades: up to 6 plain or repeated words from the text, each with a more precise or vivid word suitable for this level. "from" must appear in the text.
- models: up to 2 sentences that tell instead of show, each rewritten to show (senses, actions, feelings) at this level.
- If the text is short, give fewer items. Write nothing outside the JSON.`;
}
function dictPrompt(word,sentence){
  return `You are a learner's English dictionary for a Singapore student at this level: ${lvDesc()}.
Look up the word "${word}"${sentence?` as it is used in this sentence: "${clean(sentence).slice(0,300)}"`:''}.
Reply with ONLY a JSON object:
{"word":"the base form","ipa":"British IPA without slashes","pos":"part of speech, e.g. verb","zh":"简短中文释义${sentence?'（按句中的意思）':''}","en":"a simple English definition suited to the level","example":"one natural example sentence","forms":"other forms, e.g. ran, running (empty string if none)","upgrades":[{"word":"alternative","zh":"中文","note_zh":"什么时候用、语气差别（中文，一句话）"}]}
"upgrades": 3 to 5 more precise or vivid words this student could use instead${sentence?' in that sentence':''}; use an empty array if the word is already advanced or has no useful alternatives. If "${word}" is misspelled or not an English word, set "word" to the likely intended word and say so in "zh".`;
}
function attemptPrompt(it,attempt){
  return `A Singapore student (${lvDesc()}) is correcting an error in their own English writing.
Original words: "${clean(it.quote)}"
Problem type: ${it.type}. The teacher's corrected version: "${clean(it.fix)}"
The student's attempt: "${clean(attempt)}"
Is the attempt correct, natural English that fixes the problem? It does not need to match the teacher's version exactly.
Reply with ONLY JSON: {"ok":true,"feedback_zh":"一句中文。对的话表扬并说明为什么对；不对的话给一个新的提示，不要直接说出正确答案。"}`;
}
function coachRules(){
  const ch=draft.chapters[curCh]; const tail=(ch.text||'').slice(-1500);
  const k=draft.kind==='story'?'story':'diary entry';
  return `You are a warm, patient Socratic writing coach for a Singapore student at this level: ${lvDesc()}. The student is writing an English ${k} titled "${clean(draft.title)}".
Rules for every reply:
- Never write the ${k} for them and never give sentences to copy. When they ask about vocabulary you may offer single words or short phrases (at most 4 words each).
- Mainly ask 1 to 3 short guiding questions that help them find their own ideas (what happens next, the five senses, feelings, why characters act, one vivid detail).
- You may name one writing technique (for example "show, don't tell", "start with dialogue", "use the five senses") and explain it in one line.
- Reply in simple Simplified Chinese, keeping English key words in English. Under 120 words. Be encouraging.
${tail.trim()?`What they have written so far (end of the current ${draft.kind==='story'?'chapter':'entry'}):\n<<<\n${tail}\n>>>`:'They have not written anything yet.'}`;
}
function normReview(d,text){
  d=d&&typeof d==='object'?d:{};
  const sc={}; DIMS.forEach(([k])=>{ let v=Math.round(+((d.scores||{})[k])); sc[k]=isFinite(v)?Math.min(10,Math.max(0,v)):0; });
  const arr=(a,n)=>Array.isArray(a)?a.slice(0,n):[];
  const str=v=>String(v==null?'':v);
  return {
    scores:sc,
    summary_en:str(d.summary_en), summary_zh:str(d.summary_zh),
    strengths:arr(d.strengths,3).map(str).filter(Boolean),
    next_steps:arr(d.next_steps,3).map(str).filter(Boolean),
    issues:arr(d.issues,25).filter(x=>x&&x.quote).map(x=>({quote:str(x.quote),type:ISSUE_TYPES[x.type]?x.type:'grammar',hint_zh:str(x.hint_zh),fix:str(x.fix),why_zh:str(x.why_zh),applied:false})),
    upgrades:arr(d.upgrades,6).filter(x=>x&&x.from&&x.to).map(x=>({from:str(x.from),to:str(x.to),zh:str(x.zh),applied:false})),
    models:arr(d.models,2).filter(x=>x&&x.original&&x.improved).map(x=>({original:str(x.original),improved:str(x.improved),tip_zh:str(x.tip_zh)}))
  };
}
function normDict(d){
  d=d&&typeof d==='object'?d:{}; const s=v=>String(v==null?'':v);
  return {word:s(d.word),ipa:s(d.ipa).replace(/^\/|\/$/g,''),pos:s(d.pos),zh:s(d.zh),en:s(d.en),example:s(d.example),forms:s(d.forms),
    upgrades:(Array.isArray(d.upgrades)?d.upgrades:[]).slice(0,5).filter(u=>u&&u.word).map(u=>({word:s(u.word),zh:s(u.zh),note_zh:s(u.note_zh)}))};
}

let PARENT=false;
const PARENT_HASH='033ee3535ea33efd514da0e493edd897087d4ebf7da80aab12017ce0deee05fd';
async function checkParent(){ return IS_PARENT; const k=location.hash.slice(1); if(!/^p-[a-f0-9]{16}$/.test(k)) return false; try{ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(k)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')===PARENT_HASH; }catch(e){ return false; } }
const V={view:'home',writerId:null,workId:null,tab:'works',dashFilter:'today',dashWriter:null};
let pendingRender=false;
const inWork=v=>v==='editor'||v==='plan';
function setTitle(){ document.title=PARENT?'家长看板 · Writing Studio':'Writing Studio 英文写作工作室'; }
window.addEventListener('hashchange',async()=>{
  const p=await checkParent(); if(p===PARENT) return;
  if(inWork(V.view)) leaveEditor();
  PARENT=p; V.view=p?'dash':'home'; V.writerId=null; setTitle(); render();
});
function go(view,opts){
  if(PARENT&&!['dash','read','watch'].includes(view)) view='dash';
  if(!PARENT&&['dash','read','watch'].includes(view)) view='home';
  if(inWork(V.view)&&!inWork(view)) leaveEditor();
  Object.assign(V,{view},opts||{});

}
function isTyping(){ const a=document.activeElement; return !!a&&app.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); }

  if(isTyping()){ pendingRender=true; return; }

}

function vocabTab(w,vocab,due){

  const text=worksOf(w.id).map(x=>(x.chapters||[]).map(c=>c.text).join('\n')).join('\n').toLowerCase();
  const uses=word=>{ const m=text.match(new RegExp('(^|[^a-z])'+escRe(word.toLowerCase())+'(s|es|ed|d|ing|ly|er|est)?(?![a-z])','g')); return m?m.length:0; };
  return `<div class="new-row"><button class="btn primary" data-act="vocab-review" ${due?'':'disabled'}>开始复习（${due} 个到期）</button><span class="muted small" style="align-self:center">复习时看中文和英文解释，拼出单词。答对的词会隔更久再出现。</span></div>
  <div class="vocab-list">${vocab.map(v=>{ const n=uses(v.word); return `<div class="card v-row">
    <div><span class="w">${esc(v.word)}</span>${v.ipa?`<span class="ipa">/${esc(v.ipa)}/</span>`:''}</div>
    <div class="def"><b>${esc(v.zh)}</b> <span class="muted small">${esc(v.en)}</span></div>
    <div class="acts"><span class="boxes" title="熟悉程度">${[1,2,3,4,5,6].map(i=>`<i class="${(v.box||0)>=i?'on':''}"></i>`).join('')}</span>
      <span class="chip ${n?'good':''}">${n?`作文里用了 ${n} 次`:'还没用过'}</span>
      <button class="icon-btn" data-act="say" data-w="${esc(v.word)}" aria-label="朗读">🔊</button>
      <button class="icon-btn" data-act="vocab-del" data-id="${esc(v.id)}" aria-label="删除">×</button></div>
  </div>`; }).join('')}</div>`;
}
function progressTab(w){
  const rv=reviewsOf(w.id); const last=rv[rv.length-1];
  return `<div class="prog-grid">

function lineChart(rv,opt){
  opt=opt||{}; const small=!!opt.small;
  if(!rv.length) return small?'':'<p class="muted" style="margin-top:10px">还没有批改记录。写完一篇点「AI 批改」，分数会画在这里。</p>';
  const W=small?220:640, H=small?34:220, pl=small?2:34, pr=small?6:16, pt=small?4:14, pb=small?4:30;
  const iw=W-pl-pr, ih=H-pt-pb;
  const X=i=>pl+(rv.length===1?iw/2:i*iw/(rv.length-1)); const Y=v=>pt+ih-(v/40)*ih;
  const pts=rv.map((r,i)=>[X(i),Y(r.total)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L${pts[pts.length-1][0].toFixed(1)} ${pt+ih} L${pts[0][0].toFixed(1)} ${pt+ih} Z`;
  const lp=pts[pts.length-1];
  let g='';
  if(!small){
    [0,10,20,30,40].forEach(v=>{ g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`; });

    g+=`<text x="${pl}" y="${H-8}" font-size="11" fill="var(--muted)">${d0.getMonth()+1}/${d0.getDate()}</text>`;
    if(rv.length>1) g+=`<text x="${W-pr}" y="${H-8}" font-size="11" text-anchor="end" fill="var(--muted)">${d1.getMonth()+1}/${d1.getDate()}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="批改分数折线图">${g}
    <path d="${area}" fill="var(--accent)" opacity=".12"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="${small?1.6:2.4}" stroke-linejoin="round" stroke-linecap="round"/>
    ${small?'':pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>`).join('')}

    ${small?'':`<text x="${Math.min(lp[0],W-pr-4)}" y="${lp[1]-10}" text-anchor="${rv.length>1?'end':'middle'}" font-size="13" font-weight="700" fill="var(--ink)">${rv[rv.length-1].total}</text>`}
  </svg>`;
}

function annotateHTML(text,data,interactive){
  const marks=[]; const free=(s,e)=>!marks.some(m=>s<m.e&&e>m.s);
  (data.issues||[]).forEach((it,i)=>{
    if(it.applied||!it.quote) return; let from=0;
    for(;;){ const p=text.indexOf(it.quote,from); if(p<0) break; if(free(p,p+it.quote.length)){ marks.push({s:p,e:p+it.quote.length,k:'i',i,type:it.type,it}); break; } from=p+1; }
  });
  (data.upgrades||[]).forEach((u,i)=>{
    if(u.applied||!u.from) return;
    const re=new RegExp('(^|[^A-Za-z])('+escRe(u.from)+')(?![A-Za-z])','gi'); let m;
    while((m=re.exec(text))){ const s=m.index+m[1].length, e=s+m[2].length; if(free(s,e)){ marks.push({s,e,k:'u',i,u}); break; } re.lastIndex=m.index+1; }
  });
  marks.sort((a,b)=>a.s-b.s);
  let out='', pos=0;
  for(const m of marks){
    out+=esc(text.slice(pos,m.s)); const inner=esc(text.slice(m.s,m.e));
    if(m.k==='i') out+=interactive
      ? `<mark class="iss t-${m.type}" data-act="mark" data-i="${m.i}" tabindex="0" title="${esc(ISSUE_TYPES[m.type])}：点我看说明">${inner}</mark>`
      : `<mark class="iss t-${m.type}" title="${esc(ISSUE_TYPES[m.type]+'：'+m.it.quote+' → '+m.it.fix)}">${inner}</mark>`;
    else out+=interactive
      ? `<mark class="upm" data-act="mark-up" data-i="${m.i}" tabindex="0" title="可以换个更好的词">${inner}</mark>`
      : `<mark class="upm" title="${esc('可换成 '+m.u.to)}">${inner}</mark>`;
    pos=m.e;
  }
  return out+esc(text.slice(pos));
}

function issueCard(it,i,mode,ch){

function curReview(){ return draft.lastReviews[draft.chapters[curCh].id]; }
function selectionInfo(){
  const t=$('#txt'); if(!t) return null;
  let s=t.selectionStart, e=t.selectionEnd;
  if(s===e){ s=lastSel.s; e=lastSel.e; }
  if(s===e) return null;
  const v=t.value; let raw=v.slice(s,e);
  const lead=raw.length-raw.replace(/^[^A-Za-z]+/,'').length; s+=lead; raw=raw.slice(lead);
  const trail=raw.length-raw.replace(/[^A-Za-z]+$/,'').length; e-=trail; raw=raw.slice(0,raw.length-trail);
  if(!raw||raw.length>40||!/^[A-Za-z][A-Za-z'’\- ]*$/.test(raw)||raw.split(/\s+/).length>3) return null;
  let a=s; while(a>0&&!/[.!?\n]/.test(v[a-1])) a--;
  let b=e; while(b<v.length&&!/[.!?\n]/.test(v[b])) b++;
  return {word:raw,range:{s,e,word:raw},sentence:v.slice(a,Math.min(v.length,b+1)).trim()};
}
const isZh=t=>/[\u3400-\u9fff]/.test(t);
const zhKey=t=>'zh-'+[...new TextEncoder().encode(t)].map(b=>b.toString(16).padStart(2,'0')).join('');
function zhPrompt(q){

Reply with ONLY JSON: {"options":[{"en":"English word or short phrase","ipa":"British IPA without slashes (empty for phrases)","pos":"part of speech","zh":"中文意思和用法区别（一句话）","example":"one natural example sentence"}]}
Give 3 to 5 options suited to the level, most common first and more vivid ones last.`;
}
async function lookupZh(q){
  rightTab='dict'; dictQ=q; dictState={word:q,loading:true}; renderRight();
  if(!aiAvail()){ dictState={word:q,err:aiMsg()}; renderRight(); return; }

    if(!d){ d=await sample.json(zhPrompt(q),{modelTier:'quick'}); }
    const opts=(d&&Array.isArray(d.options)?d.options:[]).filter(o=>o&&o.en).slice(0,5).map(o=>({en:String(o.en),ipa:String(o.ipa||'').replace(/^\/|\/$/g,''),pos:String(o.pos||''),zh:String(o.zh||''),example:String(o.example||'')}));
    if(!opts.length) throw {code:'invalid_json'};
    if(cloud&&!(d&&d.cached)) db.doc('dict/'+cacheId).set({options:opts,cached:true}).catch(()=>{});

}
function insertAtCaret(w){

  const pre=before&&/[A-Za-z0-9,.!?;:'"”’)]$/.test(before)?' ':''; const post=after&&/^[A-Za-z0-9]/.test(after)?' ':'';

}
async function lookup(word,sentence,range){
  if(isZh(String(word||''))) return lookupZh(String(word).trim().slice(0,20));
  word=String(word||'').trim().replace(/^[^A-Za-z]+|[^A-Za-z'’\- ]+$/g,'').slice(0,40);
  if(!word) return;
  rightTab='dict'; dictQ=word;

  dictState={word,loading:true}; renderRight();
  if(!aiAvail()){ dictState={word,err:aiMsg()}; renderRight(); return; }
  const lk=levelKey(curWriter()); const cacheId=safeId(word)+'__'+lk;
  try{
    let data=null;
    if(!sentence&&cloud){ try{ const snap=await db.doc('dict/'+cacheId).get(); if(snap.exists) data=snap.data(); }catch(e){} }
    if(!data){
      data=normDict(await sample.json(dictPrompt(word,sentence),{modelTier:'quick'}));
      if(!data.zh&&!data.en) throw {code:'invalid_json'};
      if(!sentence&&cloud) db.doc('dict/'+cacheId).set(data).catch(()=>{});
    }else data=normDict(data);
    if(!dictState||dictState.word!==word) return;
    dictState={word,data,range,chId,sentence};
    const key=(data.word||word).toLowerCase(); dictRecent=[key,...dictRecent.filter(x=>x!==key)].slice(0,10);
  }catch(e){
    if(!dictState||dictState.word!==word) return;
    handleAiErr(e); dictState={word,err:aiErrMsg(e)};
  }
  if(V.view==='editor') renderRight();
}

function matchCase(orig,rep){ return /^[A-Z]/.test(orig)?rep.charAt(0).toUpperCase()+rep.slice(1):rep; }
function replaceSel(newWord){

async function runReview(){

/* ---------------- AI 小助手 (live watcher) ---------------- */
let tips=[], watchIdle=null, watchBusy=false, lastWatchAt=0, lastCheckWc=-1, tipHide=null, lastKeyAt=0, delChurn=[], tipShownAt=0, fastClose=0, quietUntil=0, callsLog=[];
const TIP_LABEL={grammar:'注意语法',spelling:'注意拼写',idea:'写作点子',word:'好词建议',praise:'写得好'};
function watchOn(){ const w=curWriter(); return !w||w.watch!==false; }
function resetWatch(){ clearTimeout(watchIdle); clearTimeout(tipHide); watchBusy=false; lastWatchAt=0; lastCheckWc=-1; lastKeyAt=Date.now(); delChurn=[]; quietUntil=0; fastClose=0; tipShownAt=0; }
function canAuto(){ return !!draft&&V.view==='editor'&&edMode==='write'&&!watchBusy&&aiAvail()&&watchOn()&&!document.hidden&&document.hasFocus()&&Date.now()>quietUntil&&!reviewing&&!coachBusy; }
function budgetOk(){ const h=Date.now()-3600000; callsLog=callsLog.filter(t=>t>h); return callsLog.length<20; }
/* called on every keystroke in the paper: never talk while the child is typing */
function watchSchedule(ev){
  lastKeyAt=Date.now();
  if(ev&&typeof ev.inputType==='string'&&ev.inputType.indexOf('delete')===0) delChurn.push(lastKeyAt);
  clearTimeout(watchIdle);
  if(aiAvail()&&watchOn()) watchIdle=setTimeout(()=>watchDecide(),5000);
}
/* decide whether this pause is worth a tip: finished a paragraph, keeps deleting, or stuck */
function watchDecide(){
  clearTimeout(watchIdle);
  if(!canAuto()) return;
  const now=Date.now(), text=draft.chapters[curCh].text, wc=countWords(text), idle=now-lastKeyAt;
  const gap=60000-(now-lastWatchAt);
  if(gap>0){ watchIdle=setTimeout(()=>watchDecide(),gap+50); return; }
  delChurn=delChurn.filter(t=>now-t<20000);
  const fresh=lastCheckWc<0?wc:wc-lastCheckWc;
  const blockEnd=/[.!?]["'”’)]?\s*$/.test(text)||/\n\s*$/.test(text);
  if(wc>=15&&fresh>=40&&blockEnd) return watchCall('check');
  if(delChurn.length>=25){ delChurn=[]; return watchCall('struggle'); }
  const stuckAfter=wc===0?40000:25000;
  if(idle<stuckAfter){ watchIdle=setTimeout(()=>watchDecide(),stuckAfter-idle+50); return; }
  if(tipShownAt>lastKeyAt) return;
  watchCall('stuck');
}
function watchPrompt(ch,mode,kind){
  const r=draft.plan&&draft.plan.result;
  const plan=r?`Their plan: ${r.outline.map(p=>clean(p.part)+': '+clean(p.focus_zh)).join(' | ')}`:'';
  const task={
    check:`Check ONLY the newest sentences for real mistakes. If there is a clear mistake, ${mode==='hint'?'point to where it is WITHOUT giving the correction':'give the correction briefly'} (type grammar or spelling). If there is no clear mistake, reply with an empty tip.`,
    stuck:`The student has stopped writing for a while and may be stuck. Ask ONE short guiding question that helps them continue${r?' (follow the next part of their plan)':''} (type idea).`,
    struggle:'The student keeps deleting and rewriting the newest sentence. Give ONE short hint about what to say or how to phrase it, without writing it for them (type idea or word).',
    ask:`The student asked for help. Give the single most useful tip right now: a mistake in the newest sentences (${mode==='hint'?'without the correction':'with the correction'}), an idea for what comes next, or a better word.`
  }[kind];
  return `You help a Singapore student (${lvDesc()}) writing an English ${draft.kind==='story'?'story':'diary'} titled "${clean(draft.title)}". ${plan}
Newest text (end of the current part):
<<<
${(ch.text||'').slice(-600)||'(nothing yet)'}
>>>
${tips.length?'Do not repeat: '+tips.slice(0,3).map(t=>clean(t.tip)).join(' / '):''}
${task}
The tip is simple Simplified Chinese (English words may stay English), at most 40 Chinese characters. Never write story sentences for them.
Reply with ONLY JSON: {"type":"grammar|spelling|idea|word|praise","tip":"..."}`;
}
async function watchCall(kind){
  if(!draft||!aiAvail()) return;
  if(kind!=='ask'&&!budgetOk()) return;
  watchBusy=true; lastWatchAt=Date.now(); callsLog.push(lastWatchAt);
  const ch=draft.chapters[curCh]; const chId=ch.id; lastCheckWc=countWords(ch.text);
  const w=curWriter(); const mode=(w&&w.reviewMode)||'hint';
  if(kind==='ask') showTip({tip:'让我看看你写的…',type:'idea',at:Date.now(),temp:true});
  try{
    const r=await sample.json(watchPrompt(ch,mode,kind),{modelTier:'quick',cache:false});
    const tip=String((r&&r.tip)||'').trim(); const type=TIP_LABEL[r&&r.type]?r.type:'idea';
    if(!draft||V.view!=='editor'||draft.chapters[curCh].id!==chId) return;

}

async function packStr(str){

// 连接信息不写在文件里：每台设备第一次打开时，从链接末尾的 #ws=… 或手动粘贴的「连接码」读入，存在这台设备上
const CONN_LS='ws_conn';
function readConn(code){ try{ code=String(code||'').trim().replace(/^.*#ws=/,'').replace(/^WS1\./,''); const j=JSON.parse(decodeURIComponent(escape(atob(code.replace(/-/g,'+').replace(/_/g,'/'))))); return j&&j.u&&j.k&&j.n?j:null; }catch(e){ return null; } }
const SB_CFG=(()=>{ const h=/[#&]ws=([^&]+)/.exec(location.hash||''); if(h){ const c=readConn(h[1]); if(c){ lsSet(CONN_LS,h[1]); return c; } } return readConn(lsGet(CONN_LS)); })();
const SB_URL=SB_CFG?SB_CFG.u:'', SB_KEY=SB_CFG?SB_CFG.k:'', SB_NS=SB_CFG?SB_CFG.n:'';
const RELAY_NS=SB_NS||'none';
function askConn(){
  const o=document.createElement('div');
  o.style.cssText='position:fixed;inset:0;z-index:9999;background:var(--bg);display:grid;place-items:center;padding:20px';
  o.innerHTML='<div style="background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:440px;width:100%;display:grid;gap:12px;font-family:var(--font-body)"><b style="font-size:18px">🔗 第一次在这台设备打开</b><span style="font-size:14px;color:var(--muted);line-height:1.6">请粘贴「连接码」（妈妈那里有，WS1. 开头）。只要粘贴一次，这台设备以后会记住。<br>用妈妈发的带连接码的链接打开，就不用粘贴。</span><textarea rows="3" placeholder="WS1.…" style="font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);resize:none"></textarea><span data-e style="color:var(--bad);font-size:13px" hidden>连接码不对，请重新复制粘贴。</span><button style="font:inherit;font-size:16px;font-weight:700;border:0;background:var(--accent);color:var(--on-accent);border-radius:10px;padding:11px;cursor:pointer">连接</button></div>';
  document.body.append(o);
  const ta=o.querySelector('textarea');
  o.querySelector('button').onclick=()=>{ const v=ta.value.trim(); if(!readConn(v)){ o.querySelector('[data-e]').hidden=false; return; } lsSet(CONN_LS,v.replace(/^.*#ws=/,'')); location.reload(); };
}
const RELAY_TOPIC_BASE='wsr/', RELAY_BROKER='wss://broker.hivemq.com:8884/mqtt';
const GROQ_MODEL='openai/gpt-oss-20b';   // Groq 最便宜的正式模型
const GROQ_KEY_LS='ws_groq_key';
const IS_PARENT=false;

function mkErr(code,msg){ const e=new Error(msg||code); e.code=code; return e; }
/* --- 数据库：Supabase（docs 表；读写用 REST，实时更新用 Supabase Realtime） --- */
function makeDB(){
  const BASE=SB_URL.replace(/\/$/,''), H={'content-type':'application/json',apikey:SB_KEY};
  if(!/^sb_/.test(SB_KEY)) H.authorization='Bearer '+SB_KEY;
  const q=o=>Object.entries(o).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
  async function call(qs,opt){ let r; try{ r=await fetch(BASE+'/rest/v1/docs?'+qs,Object.assign({headers:H},opt||{})); }catch(e){ throw mkErr('unavailable'); }
    if(!r.ok) throw mkErr(r.status===401||r.status===403?'invalid_argument':r.status===413?'quota_exceeded':'unavailable'); const t=await r.text(); return t?JSON.parse(t):null; }
  const split=key=>{ const i=key.indexOf('/'); return [key.slice(0,i),key.slice(i+1)]; };
  const parse=j=>{ try{ return JSON.parse(j); }catch(e){ return null; } };
  const cols={}, listeners={}; let started=false, live=false, chan=null;
  function emit(col){ const m=cols[col]||{}; (listeners[col]||[]).forEach(fn=>{ try{ fn.ok({metadata:{fromCache:false},docs:Object.keys(m).map(id=>({id,exists:true,data:()=>m[id]}))}); }catch(e){} }); }
  async function loadAll(){
    const names=Object.keys(listeners); if(!names.length) return;
    const rows=await call(q({select:'col,id,j',ns:'eq.'+SB_NS,col:'in.('+names.join(',')+')',limit:'5000'}));
    const fresh={}; names.forEach(c=>fresh[c]={});
    (rows||[]).forEach(r=>{ const d=parse(r.j); if(d&&fresh[r.col]) fresh[r.col][r.id]=d; });
    names.forEach(c=>{ const was=JSON.stringify(cols[c]||null), now=JSON.stringify(fresh[c]); cols[c]=fresh[c]; if(was!==now||!cols['__got_'+c]){ cols['__got_'+c]=1; emit(c); } });
  }
  function onChange(p){
    const row=p.new&&p.new.ns?p.new:p.old; if(!row||row.ns!==SB_NS||!listeners[row.col]) return;
    cols[row.col]=cols[row.col]||{};
    if(p.eventType==='DELETE') delete cols[row.col][row.id]; else { const d=parse(p.new.j); if(d) cols[row.col][row.id]=d; }
    emit(row.col);
  }
  function startLive(){
    const go=()=>{ try{
      const c=window.supabase.createClient(BASE,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
      chan=c.channel('ws-'+SB_NS).on('postgres_changes',{event:'*',schema:'public',table:'docs'},onChange)
        .subscribe(st=>{ const was=live; live=st==='SUBSCRIBED'; if(live&&!was) loadAll().catch(()=>{}); });
    }catch(e){} };
    if(window.supabase&&window.supabase.createClient) return go();
    const sc=document.createElement('script'); sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js'; sc.onload=go; document.head.append(sc);
  }
  function start(){
    if(started) return; started=true;
    let fails=0, warned=false;
    const tryLoad=()=>loadAll().then(()=>{ fails=0; },e=>{ if(++fails>=3&&!warned){ warned=true; Object.values(listeners).flat().forEach(l=>l.err&&l.err(e)); } });
    setTimeout(()=>{ tryLoad(); startLive(); },0);
    setInterval(()=>{ if(!live||fails) tryLoad(); },10000);      // 连不上就自己重试；实时通道断了也会定时补一次
    setInterval(()=>{ loadAll().catch(()=>{}); },10*60e3);               // 保险：每 10 分钟对一次账
  }
  async function getDoc(key){ const [col,id]=split(key); const rows=await call(q({select:'j',ns:'eq.'+SB_NS,col:'eq.'+col,id:'eq.'+id})); const d=rows&&rows[0]?parse(rows[0].j):null; return {exists:!!d,data:()=>d}; }
  return {
    doc:key=>({
      set:d=>{ const [col,id]=split(key); return call('on_conflict=ns,col,id',{method:'POST',headers:Object.assign({},H,{prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify({ns:SB_NS,col,id,j:JSON.stringify(d),t:Date.now()})}); },
      delete:()=>{ const [col,id]=split(key); return call(q({ns:'eq.'+SB_NS,col:'eq.'+col,id:'eq.'+id}),{method:'DELETE',headers:Object.assign({},H,{prefer:'return=minimal'})}); },
      get:()=>getDoc(key)
    }),
    collection:col=>({ onSnapshot:(ok,err)=>{ (listeners[col]=listeners[col]||[]).push({ok,err}); if(started) loadAll().catch(()=>{}); start(); } })
  };
}

/* --- AI：Groq（OpenAI 兼容接口），钥匙存在这台设备上 --- */
function groqKey(){ return lsGet(GROQ_KEY_LS)||''; }
function askGroqKey(force){
  return new Promise(res=>{
    if(!force&&groqKey()) return res(groqKey());
    const o=document.createElement('div');
    o.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(10,14,24,.45);display:grid;place-items:center;padding:16px';
    o.innerHTML='<div style="background:var(--surface);color:var(--ink);border-radius:14px;padding:20px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3);display:grid;gap:10px;font-family:var(--font-body)"><b style="font-size:17px">🔑 填 Groq 钥匙</b><span style="font-size:13.5px;color:var(--muted)">AI 批改、AI 梳理、查词都要用。贴上 gsk_ 开头的钥匙（和数学课堂用的同一把），只存在这台设备上。</span><input type="password" placeholder="gsk_…" autocomplete="off" style="font:inherit;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)"><div style="display:flex;gap:8px;justify-content:flex-end"><button data-x style="font:inherit;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer">取消</button><button data-ok style="font:inherit;font-weight:700;border:0;background:var(--accent);color:var(--on-accent);border-radius:10px;padding:8px 16px;cursor:pointer">保存</button></div></div>';
    document.body.append(o); const inp=o.querySelector('input'); setTimeout(()=>inp.focus(),30);
    const done=v=>{ o.remove(); res(v); };
    o.querySelector('[data-x]').onclick=()=>done('');
    const ok=()=>{ const v=inp.value.trim(); if(!/^gsk_/.test(v)){ inp.value=''; inp.placeholder='要 gsk_ 开头的钥匙'; return; } lsSet(GROQ_KEY_LS,v); done(v); };
    o.querySelector('[data-ok]').onclick=ok; inp.addEventListener('keydown',e=>{ if(e.key==='Enter') ok(); });
  });
}
async function groqChat(messages,opts,json){
  opts=opts||{};
  let key=groqKey(); if(!key) key=await askGroqKey(); if(!key) throw mkErr('no_key');
  const body={model:GROQ_MODEL,messages,reasoning_effort:'low',temperature:json?0.3:0.6,max_completion_tokens:4096,stream:!!opts.onText};
  if(json) body.response_format={type:'json_object'};
  let r;
  try{ r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',signal:opts.signal,headers:{'content-type':'application/json',authorization:'Bearer '+key},body:JSON.stringify(body)}); }
  catch(e){ throw mkErr(e&&e.name==='AbortError'?'cancelled':'unavailable'); }
  if(!r.ok){ if(r.status===401){ lsSet(GROQ_KEY_LS,''); throw mkErr('bad_key'); } throw mkErr(r.status===429?'rate_limited':r.status===413?'prompt_too_large':'unavailable'); }
  let text='';
  if(!opts.onText){ const d=await r.json(); text=(((d.choices||[])[0]||{}).message||{}).content||''; }
  else{
    const rd=r.body.getReader(), td=new TextDecoder(); let buf='';
    try{
      for(;;){ const c=await rd.read(); if(c.done) break; buf+=td.decode(c.value,{stream:true}); const ls=buf.split('\n'); buf=ls.pop();
        for(const l of ls){ if(!l.startsWith('data:')) continue; const s=l.slice(5).trim(); if(s==='[DONE]') continue; try{ const j=JSON.parse(s), t=((j.choices||[])[0]||{}).delta; if(t&&t.content){ text+=t.content; try{ opts.onText({text}); }catch(x){} } }catch(x){} } }
    }catch(e){ const er=mkErr(e&&e.name==='AbortError'?'cancelled':'unavailable'); er.text=text; throw er; }
  }
  if(!text.trim()) throw mkErr('empty_completion');
  return text;
}
function makeSample(){
  const toMsgs=x=>typeof x==='string'?[{role:'user',content:x}]:x.map(m=>({role:m.role==='assistant'?'assistant':'user',content:String(m.content)}));
  const s=async(turns,opts)=>({text:await groqChat(toMsgs(turns),opts,false)});
  s.json=async(prompt,opts)=>{
    const t=await groqChat(toMsgs(prompt),opts,true);
    try{ return JSON.parse(t); }catch(e){ const i=t.indexOf('{'), j=t.lastIndexOf('}'); if(i>=0&&j>i){ try{ return JSON.parse(t.slice(i,j+1)); }catch(x){} } throw mkErr('invalid_json'); }
  };
  return s;
}

/* --- 监视：经公共实时服务器转发画面（和学习课堂、每日20词同一种做法） --- */
function makeRoom(){
  const me=Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
  let pres={}, c=null, peersCb=null; const evCb={}, peers=new Map();
  const T=RELAY_TOPIC_BASE+RELAY_NS, pub=(t,o)=>{ try{ if(c&&c.connected) c.publish(t,JSON.stringify(o),{qos:0}); }catch(e){} };
  const list=()=>[{peer:me,sameTab:true,presence:pres},...[...peers.values()].map(p=>({peer:p.peer,sameTab:false,presence:p.presence}))];
  const fire=(joined,updated,left)=>{ if(peersCb) try{ peersCb({peers:list(),joined,updated,left}); }catch(e){} };
  const sendPres=()=>pub(T+'/p/'+me,{peer:me,presence:pres,ts:Date.now()});
  function onPres(m){
    if(!m||!m.peer||m.peer===me) return;
    if(m.gone){ const p=peers.get(m.peer); if(p){ peers.delete(m.peer); fire([],[],[p]); } return; }
    const old=peers.get(m.peer), p={peer:m.peer,presence:m.presence||{},at:Date.now()};
    peers.set(m.peer,p); if(old) fire([],[p],[]); else fire([p],[],[]);
  }
  setInterval(()=>{ const now=Date.now(), gone=[]; peers.forEach((p,k)=>{ if(now-p.at>15000){ peers.delete(k); gone.push(p); } }); if(gone.length) fire([],[],gone); sendPres(); },4000);
  (function go(){ (window.mqtt?Promise.resolve():(function L(i){return new Promise(function(ok,no){var u=['https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js','https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js','https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.1/mqtt.min.js'];var sc=document.createElement('script');sc.src=u[i];sc.onload=ok;sc.onerror=function(){sc.remove();if(i+1<u.length)L(i+1).then(ok,no);else no();};document.head.append(sc);});})(0)).then(()=>{
    c=window.mqtt.connect(RELAY_BROKER,{clientId:'ws_'+me,keepalive:30,reconnectPeriod:3000,connectTimeout:8000,clean:true,will:{topic:T+'/p/'+me,payload:JSON.stringify({peer:me,gone:1}),qos:0,retain:false}});
    c.on('connect',()=>{ c.subscribe([T+'/p/+',T+'/e/+',T+'/hello']); sendPres(); pub(T+'/hello',{peer:me}); });
    c.on('message',(t,buf)=>{ let m; try{ m=JSON.parse(String(buf)); }catch(e){ return; }
      if(t===T+'/hello'){ if(m.peer!==me) sendPres(); return; }
      if(t.startsWith(T+'/p/')) return onPres(m);
      if(t.startsWith(T+'/e/')){ if(m.peer===me) return; const fn=evCb[t.slice(T.length+3)]; if(fn) try{ fn({peer:m.peer,data:m.data}); }catch(e){} } });
  }).catch(()=>{ setTimeout(go,15000); }); })();
  addEventListener('pagehide',()=>pub(T+'/p/'+me,{peer:me,gone:1}));
  return {
    presence:o=>{ pres=Object.assign({},pres,o); sendPres(); return Promise.resolve(); },
    onPeers:cb=>{ peersCb=cb; fire([],[],[]); },
    on:(name,cb)=>{ evCb[name]=cb; },
    emit:(name,data)=>{ pub(T+'/e/'+name,{peer:me,data}); return Promise.resolve(); }
  };
}
