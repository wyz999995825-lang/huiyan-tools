<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>慧眼学习工具</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;background:linear-gradient(180deg,#f2f8fd 0%,#eaf3fa 100%);min-height:100vh;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#2b3a46;padding:20px;box-sizing:border-box}
h1{font-size:28px;margin:0 0 8px}
p.sub{color:#6b8299;margin:0 0 36px;font-size:16px}
.cards{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
a.card{display:block;background:#fff;border-radius:22px;padding:34px 44px;text-decoration:none;color:#2b3a46;box-shadow:0 6px 24px rgba(74,144,194,.15);transition:.2s;text-align:center;min-width:180px}
a.card:active,a.card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(74,144,194,.25)}
.icon{font-size:52px;margin-bottom:12px}
.name{font-size:20px;font-weight:700;margin-bottom:6px}
.desc{font-size:14px;color:#6b8299}
footer{margin-top:40px;font-size:12px;color:#9ab0c0}
</style>
</head>
<body>
<h1>🏠 慧眼学习工具</h1>
<p class="sub">选择你的工具箱开始学习</p>
<div class="cards">
  <a class="card" href="Johnson提升工具合集.html">
    <div class="icon">🚀</div>
    <div class="name">Johnson</div>
    <div class="desc">P5 · 数学 / 英语 / 高华</div>
  </a>
  <a class="card" href="Jenny提升工具合集.html">
    <div class="icon">🌸</div>
    <div class="name">Jenny</div>
    <div class="desc">P2 · 数学 / 思维 / 阅读</div>
  </a>
</div>
<footer>每天进步一点点 ✨</footer>

</html>
