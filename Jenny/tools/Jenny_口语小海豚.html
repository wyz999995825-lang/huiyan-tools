<style>
:root{

  --ink:#144644; --ink-soft:#3d7f7c; --ink-faint:#7aada9;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html{ -webkit-text-size-adjust:100%; }
body {
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;

}
header {

.hrow { display:flex; align-items:center; gap:10px; max-width:760px; margin:0 auto; }
.mermaid-big { font-size:46px; line-height:1; animation:floaty 3s ease-in-out infinite; filter:drop-shadow(0 4px 4px rgba(10,138,134,.25)); }

.htitle { font-size:22px; font-weight:800; color:var(--deep); }
.hsub { font-size:13px; color:var(--ink-soft); margin-top:2px; }
.stats { display:flex; gap:8px; margin-left:auto; align-items:center; }
.pill { background:#ffffffd9; border-radius:999px; padding:7px 12px; font-weight:800; font-size:14px; color:var(--deep); box-shadow:0 2px 6px rgba(10,138,134,.14); white-space:nowrap; }

.ringwrap { position:relative; width:48px; height:48px; flex-shrink:0; }

.ringwrap .ringtxt { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:10px; font-weight:800; color:var(--deep); line-height:1.15; }

main { max-width:760px; margin:0 auto; padding:14px; }

h3 { color:var(--deep); font-size:18px; margin-bottom:8px; }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; background:var(--tiffany); color:#fff; border:none; border-radius:18px; padding:12px 20px; font-size:17px; font-weight:800; cursor:pointer; min-height:48px; box-shadow:0 4px 10px rgba(10,138,134,.28); font-family:inherit; transition:transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s; }

.btn:active { transform:scale(.93) rotate(1.5deg); box-shadow:0 2px 5px rgba(10,138,134,.25); }
.btn.sand { background:var(--sand); color:#a4762a; box-shadow:0 3px 8px rgba(190,150,60,.2); }
.btn.coral { background:var(--coral); box-shadow:0 4px 10px rgba(255,138,122,.35); }
.btn.ghost { background:var(--lagoon); color:var(--deep); box-shadow:none; }
.btn.small { padding:9px 14px; min-height:46px; font-size:15px; }
.btn.recording { background:#e05b4b; animation:recpulse 1.1s ease-in-out infinite; }

.playmini { border:none; background:var(--lagoon); color:var(--deep); border-radius:14px; min-width:46px; min-height:46px; font-size:19px; cursor:pointer; font-family:inherit; transition:transform .18s cubic-bezier(.34,1.56,.64,1); vertical-align:middle; }

.itemcard { display:flex; gap:14px; align-items:center; background:var(--card); border-radius:20px; padding:14px; box-shadow:0 4px 14px rgba(10,138,134,.10); margin-bottom:12px; cursor:pointer; border:2px solid transparent; width:100%; text-align:left; font-family:inherit; color:inherit; font-size:17px; transition:transform .18s cubic-bezier(.34,1.56,.64,1); }

.itemcard.done { border-color:var(--tiffany-light); background:#f2fbfa; }

.itemcard .t { font-weight:800; font-size:18px; }
.itemcard .k { font-size:13px; color:var(--ink-faint); margin-top:3px; line-height:1.5; }
.readtext { font-size:20px; line-height:2.3; color:var(--ink); }
.readtext ruby rt { font-size:10px; color:var(--ink-faint); font-weight:400; }
.sentline { border-radius:12px; padding:6px 10px; margin:4px 0; display:block; transition:background .3s; }

.senscard { background:var(--sky); border:2px solid var(--tiffany-light); border-radius:18px; padding:16px; margin-top:8px; }
.recrow { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin:14px 0 6px; }
.recstatus { text-align:center; font-size:14px; font-weight:700; color:var(--ink-soft); min-height:24px; margin-bottom:6px; }
.switchrow { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.switch { position:relative; width:58px; height:46px; background:none; border:none; cursor:pointer; flex-shrink:0; }
.switch::before { content:""; position:absolute; left:0; top:6px; width:58px; height:34px; border-radius:999px; background:#cfe8e5; transition:background .2s; }
.switch.on::before { background:var(--tiffany); }
.switch::after { content:""; position:absolute; top:10px; left:4px; width:26px; height:26px; background:#fff; border-radius:50%; transition:left .25s cubic-bezier(.34,1.56,.64,1); box-shadow:0 1px 4px rgba(0,0,0,.2); }
.switch.on::after { left:28px; }
.tipbox { background:var(--sand); border-radius:16px; padding:14px; margin-top:14px; }
.tipbox h3 { color:#a4762a; }
.tipword { display:inline-block; background:#fff; border-radius:12px; padding:6px 12px; margin:4px 4px 4px 0; font-size:16px; }
.tipword b { color:#c26a2e; }
.selfbtn { font-size:34px; background:#fff; border:2px solid var(--tiffany-light); border-radius:18px; padding:10px 16px; cursor:pointer; min-width:92px; min-height:80px; font-family:inherit; transition:transform .18s cubic-bezier(.34,1.56,.64,1); }
.selfbtn small { display:block; font-size:13px; font-weight:800; color:var(--ink-soft); margin-top:4px; }
.selfbtn:active { background:var(--lagoon); transform:scale(.9) rotate(-2deg); }
.scene { background:linear-gradient(180deg,#c7ecf3 55%,var(--sand) 55%); border-radius:16px; margin-bottom:14px; overflow:hidden; }
.scene svg { display:block; width:100%; height:auto; }

.qchip b { color:var(--deep); }
.samplebox { background:#f2fbf6; border:2px solid #a9dfc4; border-radius:16px; padding:16px; font-size:18px; line-height:2.1; }
.goodword { background:#ffe9a8; border-radius:6px; padding:0 3px; font-weight:700; color:#8a6410; }

.lvl2 { background:#e3f4ec; }
.lvl3 { background:var(--sand); box-shadow:inset 0 0 0 2px #f0d9a5; }
.lvl .lab { font-size:13px; font-weight:800; display:block; margin-bottom:4px; }
.lvl1 .lab { color:var(--tiffany); } .lvl2 .lab { color:#2e9c6b; } .lvl3 .lab { color:#c2903a; }
.progressbar { height:12px; background:var(--lagoon); border-radius:999px; overflow:hidden; margin:8px 0 14px; }
.progressbar > div { height:100%; background:linear-gradient(90deg,var(--tiffany-light),var(--tiffany)); border-radius:999px; transition:width .4s cubic-bezier(.34,1.56,.64,1); }
.center { text-align:center; }
.big { font-size:52px; }
#fx { position:fixed; inset:0; pointer-events:none; z-index:200; }
.backrow { margin-bottom:12px; }
.hidden { display:none; }
.stepnote { font-size:14px; color:var(--ink-soft); font-weight:800; margin-bottom:8px; }
.gentle { background:var(--sand); border-radius:14px; padding:10px 14px; font-size:15px; line-height:1.8; color:#7c5a22; margin:10px 0; }
#medal { position:fixed; inset:0; z-index:210; display:flex; align-items:center; justify-content:center; background:rgba(10,138,134,.25); }
#medal .inner { background:var(--card); border-radius:26px; padding:28px 34px; text-align:center; box-shadow:0 10px 40px rgba(10,70,68,.3); animation:medalpop .55s cubic-bezier(.34,1.56,.64,1); max-width:86vw; }
#medal .m { font-size:74px; display:inline-block; animation:medalspin 1.4s ease-in-out infinite alternate; }
@keyframes medalpop { 0%{transform:scale(.2) rotate(-20deg); opacity:0;} 100%{transform:scale(1) rotate(0);} }
@keyframes medalspin { 0%{transform:rotate(-8deg) scale(1);} 100%{transform:rotate(8deg) scale(1.08);} }
#medal .mt { font-size:21px; font-weight:800; color:var(--deep); margin-top:6px; }
#medal .ms { font-size:15px; color:var(--ink-soft); margin:6px 0 14px; }
</style>
</head>

/* ============ 每日任务（jenny_daily_v1 · oral 目标 1/天） ============ */
const DAILY_KEY="jenny_daily_v1";
const ORAL_GOAL=1;
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function dailyLoad(){try{const s=localStorage.getItem(DAILY_KEY);if(s)return JSON.parse(s)||{};}catch(e){}return {};}
function todayOral(){const d=dailyLoad();const t=d[todayStr()];return t&&t.oral?t.oral:0;}
function bumpOral(){
  const d=dailyLoad();const k=todayStr();
  if(!d[k])d[k]={math:0,science:0,reading:0,chinese:0,oral:0};
  if(typeof d[k].oral!=="number")d[k].oral=0;
  d[k].oral++;
  try{localStorage.setItem(DAILY_KEY,JSON.stringify(d));}catch(e){}
  updateHeader();
}
function updateHeader(){
  document.getElementById("xpPill").textContent="⭐ "+state.xp;
  const n=todayOral(),pct=Math.min(1,n/ORAL_GOAL);
  const R=20,C=2*Math.PI*R;
  document.getElementById("ringWrap").innerHTML=
   `<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="${R}" fill="#ffffffd9" stroke="#cfe8e5" stroke-width="4"/>`+
   `<circle cx="24" cy="24" r="${R}" fill="none" stroke="${pct>=1?"#0abab5":"#ff8a7a"}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${(C*pct).toFixed(1)} ${C.toFixed(1)}"/></svg>`+
   `<span class="ringtxt">${pct>=1?"<b>✓</b>":"<b>"+Math.min(n,ORAL_GOAL)+"/"+ORAL_GOAL+"</b>"}<span>今日</span></span>`;
}
/* ============ WebAudio 合成音效（无音频文件） ============ */
let _ac=null;
function ac(){
  try{
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C)return null;
    if(!_ac)_ac=new C();
    if(_ac.state==="suspended")_ac.resume();
    return _ac;
  }catch(e){return null;}
}
function tone(freq,start,dur,type,vol,slideTo){
  const a=ac();if(!a)return;
  try{
    const o=a.createOscillator(),g=a.createGain();
    o.type=type||"sine";o.frequency.setValueAtTime(freq,a.currentTime+start);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,a.currentTime+start+dur);
    g.gain.setValueAtTime(0.0001,a.currentTime+start);
    g.gain.exponentialRampToValueAtTime(vol||0.18,a.currentTime+start+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+start+dur);
    o.connect(g);g.connect(a.destination);
    o.start(a.currentTime+start);o.stop(a.currentTime+start+dur+0.05);
  }catch(e){}
}

/* ============ TTS（Web Speech API） ============ */
let ttsOn=true;
try{ttsOn=localStorage.getItem("jenny_tts_on")!=="0";}catch(e){}
let zhVoice=null,voicesReady=false;
function pickVoice(){
  if(!("speechSynthesis" in window))return;
  try{
    const vs=speechSynthesis.getVoices();
    if(!vs||!vs.length)return;
    voicesReady=true;
    const zh=vs.filter(v=>/^zh([-_](CN|Hans))?/i.test(v.lang)||/zh/i.test(v.lang));
    const pref=["tingting","婷婷","ting-ting","meijia","美嘉","mei-jia","sinji","yue","xiaoxiao","huihui","lili"];
    for(const p of pref){
      const hit=zh.find(v=>v.name.toLowerCase().includes(p));
      if(hit){zhVoice=hit;return;}
    }
    const cn=zh.find(v=>/CN|Hans/i.test(v.lang));
    zhVoice=cn||zh[0]||null;
  }catch(e){}
}
if("speechSynthesis" in window){
  pickVoice();
  try{speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}
}
function speak(text,opts){
  opts=opts||{};
  if(!ttsOn)return;
  if(!("speechSynthesis" in window))return;      /* 不支持则静默降级 */
  if(!zhVoice)pickVoice();
  if(voicesReady&&!zhVoice)return;                /* 无中文音色，静默降级 */
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="zh-CN";
    if(zhVoice)u.voice=zhVoice;
    u.rate=opts.rate||0.95;
    u.pitch=opts.pitch||1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ============ 录音（MediaRecorder · 内存保存，不写存储） ============ */
const REC={
  supported:!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder),
  denied:false, stream:null, mr:null, chunks:[], url:null, recording:false, audio:null
};
function recAvailable(){return REC.supported&&!REC.denied;}
function pickMime(){
  try{
    if(window.MediaRecorder&&MediaRecorder.isTypeSupported){
      if(MediaRecorder.isTypeSupported("audio/mp4"))return "audio/mp4";       /* iPad Safari 优先 */
      if(MediaRecorder.isTypeSupported("audio/webm"))return "audio/webm";
    }
  }catch(e){}
  return "";
}
function clearRecUrl(){
  if(REC.audio){try{REC.audio.pause();}catch(e){}REC.audio=null;}
  if(REC.url){try{URL.revokeObjectURL(REC.url);}catch(e){}REC.url=null;}
}
function stopRecTracks(){
  if(REC.mr&&REC.recording){try{REC.mr.stop();}catch(e){}}
  REC.recording=false;REC.mr=null;
  if(REC.stream){try{REC.stream.getTracks().forEach(t=>t.stop());}catch(e){}REC.stream=null;}
}
function recFail(){
  REC.denied=true;
  stopRecTracks();
  const st=document.getElementById("recStatus");
  const rb=document.getElementById("recBtn"),pb=document.getElementById("playBtn");
  if(rb)rb.classList.add("hidden");
  if(pb)pb.classList.add("hidden");
  if(st)st.innerHTML="没关系～跟着小海豚<b>大声读出来</b>就好！🐬";
}
async function toggleRec(onReady){
  if(!recAvailable()){recFail();return;}
  if(REC.recording){ /* 停止 */
    try{REC.mr.stop();}catch(e){recFail();}
    return;
  }
  try{
    if(!REC.stream||!REC.stream.active){
      REC.stream=await navigator.mediaDevices.getUserMedia({audio:true});
    }
    clearRecUrl();
    REC.chunks=[];
    const mime=pickMime();
    REC.mr=mime?new MediaRecorder(REC.stream,{mimeType:mime}):new MediaRecorder(REC.stream);
    REC.mr.ondataavailable=e=>{if(e.data&&e.data.size)REC.chunks.push(e.data);};
    REC.mr.onstop=()=>{
      REC.recording=false;
      try{
        const blob=new Blob(REC.chunks,{type:REC.mr&&REC.mr.mimeType?REC.mr.mimeType:"audio/mp4"});
        REC.url=URL.createObjectURL(blob);   /* 仅内存，离开页面即丢弃 */
      }catch(e){REC.url=null;}
      sndRecStop();
      updateRecUI();
    };
    REC.mr.start();
    REC.recording=true;
    sndRecStart();
    updateRecUI();
  }catch(e){
    recFail();
  }
}
function playRec(){
  if(!REC.url)return;
  sndPop();
  try{
    if(REC.audio){REC.audio.pause();}
    REC.audio=new Audio(REC.url);
    REC.audio.play();
    const st=document.getElementById("recStatus");
    if(st)st.textContent="▶️ 正在播放你的声音……听听看，和示范像不像？";
    REC.audio.onended=()=>{const s=document.getElementById("recStatus");if(s)s.textContent="听完了！可以再录一次，也可以给自己评分啦。";};
  }catch(e){}
}
function updateRecUI(){
  const rb=document.getElementById("recBtn"),pb=document.getElementById("playBtn"),st=document.getElementById("recStatus");
  if(!rb)return;
  if(REC.recording){
    rb.textContent="⏹ 停止录音";
    rb.classList.add("recording");
    if(st)st.textContent="🔴 正在录音……大声读出来吧！";
    if(pb)pb.classList.add("hidden");
  }else{
    rb.textContent="🎙️ 开始录音";
    rb.classList.remove("recording");
    if(REC.url){
      if(pb)pb.classList.remove("hidden");
      if(st)st.textContent="录好啦！点 ▶️ 听听自己的声音，再和示范比一比。";
    }else{
      if(pb)pb.classList.add("hidden");
      if(st)st.textContent=recAvailable()?"先听示范，再点 🎙️ 录下你的朗读。":"";
    }
  }
}

/* ============ 问答小贝壳（三级答案逐级点读） ============ */
function renderQaList(){
  let h=`<div class="brow"><div class="face">🐬</div><div class="bubble grow">口试问答有个小魔法：<b>回答 + 原因 + 小细节</b>，三步说出最完整的答案！每个等级都可以点 🔊 听小海豚读，照着<b>金色的完整版</b>多说几遍。</div></div>`;
  QAS.forEach((qa,i)=>{
    const d=state.qa["q"+i];
    h+=`<button class="itemcard ${d?"done":""}" onclick="sndPop();openQa(${i})"><div class="cover">🐚</div>
    <div class="grow"><div class="t">${qa.q}</div><div class="k">${d?"✔ 已练过 · 温故知新！":"点我练一练"}</div></div>
    <div style="font-size:22px;">${d?"🏅":"➜"}</div></button>`;
  });
  document.getElementById("view").innerHTML=h;
}
function speakQa(i,lvl){
  const qa=QAS[i];if(!qa)return;
  const t=lvl===0?qa.q:lvl===1?qa.l1:lvl===2?qa.l2:qa.l3;
  speak(t,{rate:0.9});
}
function openQa(i){
  const qa=QAS[i];
  document.getElementById("view").innerHTML=`
  <div class="backrow"><button class="btn ghost small" onclick="go('qa')">← 返回</button></div>
  <div class="card"><h2 style="font-size:21px;">🐚 ${qa.q} <button class="playmini" onclick="sndPop();speakQa(${i},0)" title="听问题">🔊</button></h2>
  <div class="stepnote">第一步 · 听听问题，先自己回答一遍 🎤</div>
  <div class="stepnote" style="margin-top:10px;">第二步 · 三个等级，一级比一级棒，每级都点 🔊 听一听：</div>
  <div class="lvl lvl1"><button class="playmini" onclick="sndPop();speakQa(${i},1)">🔊</button><div class="txt"><span class="lab">🌱 简单回答</span>${qa.l1}</div></div>
  <div class="lvl lvl2"><button class="playmini" onclick="sndPop();speakQa(${i},2)">🔊</button><div class="txt"><span class="lab">🌿 加上原因</span>${qa.l2}</div></div>
  <div class="lvl lvl3"><button class="playmini" onclick="sndPop();speakQa(${i},3)">🔊</button><div class="txt"><span class="lab">🌟 加上细节（照着这个说！）</span>${qa.l3}</div></div>
  <div class="stepnote" style="margin-top:10px;">第三步 · 跟着 🌟 金色完整版，大声说两遍！</div>
  <div class="center" style="margin-top:12px;"><button class="btn" onclick="finishQa(${i})">✅ 我说完啦！</button></div>
  <div id="qaDoneBox"></div></div>`;
  window.scrollTo(0,0);
}
function finishQa(i){
  const first=!state.qa["q"+i];
  state.qa["q"+i]=true;
  if(first)addXP(10);else addXP(3);
  save();updateHeader();
  bumpOral();
  fireworks();sndDing();
  speakCheer();
  document.getElementById("qaDoneBox").innerHTML=`
  <div class="brow" style="margin-top:14px;"><div class="face">🐬</div><div class="bubble grow">太棒了！${first?"+10 颗星星！":"温故知新，+3 颗星星！"}记住这个魔法：<b>回答 + 原因 + 细节</b>。考试的时候也要这样说完整的句子哦！🌟</div></div>
  <div class="center"><button class="btn" onclick="sndPop();go('qa')">🐚 练下一题</button></div>`;
}
/* ============ 勋章弹窗 ============ */
function showMedal(title,subtitle){
  sndMagic();fireworks();
  const old=document.getElementById("medal");
  if(old)old.remove();
  const d=document.createElement("div");
  d.id="medal";
  d.innerHTML=`<div class="inner"><span class="m">🏅</span>
  <div class="mt">${title}</div><div class="ms">${subtitle}</div>
  <button class="btn" onclick="sndPop();document.getElementById('medal').remove()">收下勋章！</button></div>`;
  d.addEventListener("click",e=>{if(e.target===d)d.remove();});
  document.body.appendChild(d);
}
/* ============ 特效 ============ */
const fxCanvas=document.getElementById("fx");
const fxCtx=fxCanvas.getContext("2d");
let parts=[],fxRunning=false;
function fxResize(){fxCanvas.width=innerWidth;fxCanvas.height=innerHeight;}
addEventListener("resize",fxResize);fxResize();
const FX_COLORS=["#0abab5","#81d8d0","#ff8a7a","#ffd66b","#8fd7b8","#f7a8d8"];
function spawnConfetti(n,x,y,spread){
  for(let i=0;i<n;i++){
    parts.push({x:x??Math.random()*fxCanvas.width,y:y??-10,
      vx:(Math.random()-.5)*(spread||4),vy:Math.random()*3+2,
      s:Math.random()*7+4,c:FX_COLORS[Math.floor(Math.random()*FX_COLORS.length)],
      r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,life:140});
  }
  runFX();
}
function spawnFirework(){
  const x=Math.random()*fxCanvas.width,y=Math.random()*fxCanvas.height*.5+50;
  const c=FX_COLORS[Math.floor(Math.random()*FX_COLORS.length)];
  for(let i=0;i<28;i++){
    const a=(i/28)*Math.PI*2,sp=Math.random()*3+2;
    parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,s:4,c:c,r:0,vr:0,life:60,fw:true});
  }
}
function confettiBurst(){spawnConfetti(90);}
function fireworks(){
  spawnConfetti(70);
  let count=0;
  const iv=setInterval(()=>{spawnFirework();runFX();count++;if(count>5)clearInterval(iv);},350);
}
function runFX(){
  if(fxRunning)return;fxRunning=true;
  function tick(){
    fxCtx.clearRect(0,0,fxCanvas.width,fxCanvas.height);
    parts=parts.filter(p=>p.life>0&&p.y<fxCanvas.height+20);
    parts.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;if(!p.fw)p.vy+=.06;else p.vy+=.03;p.r+=p.vr;p.life--;
      fxCtx.save();fxCtx.translate(p.x,p.y);fxCtx.rotate(p.r);
      fxCtx.globalAlpha=Math.min(1,p.life/40);
      fxCtx.fillStyle=p.c;fxCtx.fillRect(-p.s/2,-p.s/2,p.s,p.s);fxCtx.restore();
    });
    if(parts.length){requestAnimationFrame(tick);}else{fxRunning=false;fxCtx.clearRect(0,0,fxCanvas.width,fxCanvas.height);}
  }
  requestAnimationFrame(tick);
}
/* ============ 启动 ============ */
document.getElementById("ttsBtn").textContent=ttsOn?"🔊":"🔇";
document.getElementById("ttsBtn").classList.toggle("off",!ttsOn);
updateHeader();
go("home");
</script>
