/* ============ 状态 ============ */
const LS_KEY="jenny_oral_dolphin";
let state={xp:0,read:{},pic:{},qa:{},pinyinOn:true};
try{const s=localStorage.getItem(LS_KEY);if(s)state=Object.assign(state,JSON.parse(s));}catch(e){}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}}
function addXP(n){state.xp+=n;save();updateHeader();}
function doneCount(){return Object.keys(state.read).length+Object.keys(state.pic).length+Object.keys(state.qa).length;}
function updateHeader(){
  document.getElementById("xpPill").textContent="⭐ "+state.xp;
  document.getElementById("donePill").textContent="✅ "+doneCount();
}
/* ============ 导航 ============ */
let currentTab="home";
function go(tab){
  currentTab=tab;
  ["home","read","pic","qa"].forEach(t=>document.getElementById("nav-"+t).classList.toggle("active",t===tab));
  if(tab==="home")renderHome();
  else if(tab==="read")renderReadList();
  else if(tab==="pic")renderPicList();
  else renderQaList();
  window.scrollTo(0,0);
}
/* ============ 首页 ============ */
function renderHome(){
  const r=Object.keys(state.read).length,p=Object.keys(state.pic).length,q=Object.keys(state.qa).length;
  document.getElementById("view").innerHTML=`
  <div class="brow"><div class="face">🐬</div><div class="bubble grow">Jenny 你好！我是小海豚。华文口语最重要的是<b>敢开口、多开口</b>！每天练一点点，你会说得越来越好听。今天想练哪一个？</div></div>
  <button class="itemcard" onclick="go('read')"><div class="cover">🌊</div>
  <div class="grow"><div class="t">朗读小浪花</div><div class="k">${READS.length} 段朗读练习 · 已完成 ${r} 段</div></div><div style="font-size:22px;">➜</div></button>
  <button class="itemcard" onclick="go('pic')"><div class="cover">🖼️</div>
  <div class="grow"><div class="t">看图说话</div><div class="k">${SCENES.length} 个场景 · 已练 ${p} 个 · 先说一说，再看范例</div></div><div style="font-size:22px;">➜</div></button>
  <button class="itemcard" onclick="go('qa')"><div class="cover">🐚</div>
  <div class="grow"><div class="t">问答小贝壳</div><div class="k">${QAS.length} 个口试问答 · 已练 ${q} 个 · 学最完整的说法</div></div><div style="font-size:22px;">➜</div></button>
  <div class="card" style="background:#fdf3dd;"><h3 style="color:#a4762a;">🐚 小海豚的悄悄话</h3>
  <div style="font-size:15px;line-height:1.9;color:#7c5a22;">说错了完全没关系！大声说出来，就已经赢了一半。可以请妈妈当你的小听众哦。🎤</div></div>`;
}
/* ============ 朗读小浪花 ============ */
function renderReadList(){
  let h=`<div class="brow"><div class="face">🐬</div><div class="bubble grow">选一段来朗读吧！先在心里<b>默读一遍</b>，再跟着<b>黄色亮光</b>一句一句大声读。</div></div>`;
  READS.forEach(r=>{
    const d=state.read[r.id];
    h+=`<button class="itemcard ${d?"done":""}" onclick="openRead('${r.id}')"><div class="cover">${r.e}</div>
    <div class="grow"><div class="t">${r.t}</div><div class="k">${d?"✔ 已练过（自评："+d+"）· 可以再练！":r.sent.length+" 句 · 点我开始"}</div></div>
    <div style="font-size:22px;">${d?"🏅":"➜"}</div></button>`;
  });
  document.getElementById("view").innerHTML=h;
}
let rd={id:null,phase:0,cur:0};
function sentHTML(sentence){
  return sentence.map(c=>{
    if(state.pinyinOn&&c[1])return `<ruby>${c[0]}<rt>${c[1]}</rt></ruby>`;
    return c[0];
  }).join("");
}
function openRead(id){rd={id:id,phase:0,cur:0};renderRead();}
function renderRead(){
  const r=READS.find(x=>x.id===rd.id);
  let inner="";
  if(rd.phase===0){
    inner=`<div class="stepnote">第一步 · 先在心里默读一遍 👀</div>
    <div class="readtext">${r.sent.map(s=>`<span class="sentline">${sentHTML(s)}</span>`).join("")}</div>
    <div class="center" style="margin-top:16px;"><button class="btn" onclick="rd.phase=1;rd.cur=0;renderRead()">🎤 开始朗读</button></div>`;
  }else if(rd.phase===1){
    inner=`<div class="stepnote">第二步 · 大声读出<b>黄色亮光</b>的那一句 🎤（第 ${rd.cur+1} / ${r.sent.length} 句）</div>
    <div class="readtext">${r.sent.map((s,i)=>`<span class="sentline ${i===rd.cur?"now":(i<rd.cur?"done":"")}">${sentHTML(s)}</span>`).join("")}</div>
    <div class="center" style="margin-top:16px;">
    <button class="btn" onclick="nextSent()">${rd.cur+1<r.sent.length?"读好了，下一句 →":"读完啦！🎉"}</button></div>`;
  }else{
    inner=`<div class="stepnote">第三步 · 自己评一评：刚才读得怎么样？（没有对错，说真话就好）</div>
    <div class="center" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px;">
      <button class="selfbtn" onclick="selfRate('😄')">😄<small>很流利！</small></button>
      <button class="selfbtn" onclick="selfRate('🙂')">🙂<small>还不错</small></button>
      <button class="selfbtn" onclick="selfRate('😅')">😅<small>想再练一次</small></button>
    </div>`;
  }
  const tips=`<div class="tipbox"><h3>💡 朗读小贴士</h3>
  <div>${r.tips.words.map(w=>`<span class="tipword"><b>${w.w}</b> ${w.p} — ${w.note}</span>`).join("")}</div>
  <div style="font-size:15px;line-height:1.8;color:#7c5a22;margin-top:8px;">⏸ <b>停顿建议：</b>${r.tips.pause}</div></div>`;
  document.getElementById("view").innerHTML=`
  <div class="backrow"><button class="btn ghost small" onclick="go('read')">← 返回</button></div>
  <div class="card"><h2 style="font-size:22px;">${r.e} ${r.t}</h2>
  <div class="switchrow"><button class="switch ${state.pinyinOn?"on":""}" onclick="state.pinyinOn=!state.pinyinOn;save();renderRead()"></button><span style="font-size:14px;font-weight:700;color:#5b8ba1;">显示拼音</span></div>
  ${inner}</div>${rd.phase===2?tips:""}
  <div id="rateBox"></div>`;
  window.scrollTo(0,0);
}
function nextSent(){
  const r=READS.find(x=>x.id===rd.id);
  if(rd.cur+1<r.sent.length){rd.cur++;renderRead();}
  else{rd.phase=2;renderRead();}
}
function selfRate(face){
  const first=!state.read[rd.id];
  state.read[rd.id]=face;
  if(first)addXP(10);else addXP(3);
  save();updateHeader();
  let msg,btns;
  if(face==="😅"){
    msg="想再练一次？太棒了！好的朗读都是练出来的。这次先看看下面的小贴士，再来一遍吧！💪";
    btns=`<button class="btn" onclick="rd.phase=1;rd.cur=0;renderRead()">🎤 再读一遍</button>
    <button class="btn ghost" onclick="go('read')">先休息一下</button>`;
    confettiBurst();
  }else{
    msg=face==="😄"?"哇，读得很流利！你的声音一定很好听！记得也看看小贴士，下次读得更棒！🌟":"不错不错！多读几遍会越来越顺哦。看看小贴士里的小秘密吧！✨";
    btns=`<button class="btn" onclick="go('read')">🌊 练下一段</button>
    <button class="btn ghost" onclick="rd.phase=1;rd.cur=0;renderRead()">再读一遍</button>`;
    fireworks();
  }
  document.getElementById("rateBox").innerHTML=`
  <div class="brow"><div class="face">🐬</div><div class="bubble grow">${msg}</div></div>
  <div class="center" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">${btns}</div>`;
}
/* ============ 看图说话 ============ */
function renderPicList(){
  let h=`<div class="brow"><div class="face">🐬</div><div class="bubble grow">看图说话的小秘诀：先想清楚<b>谁？在哪里？做什么？心情怎样？</b>自己先说一遍，再看范例。范例要<b>多看几遍</b>，好句子看多了，自然就会说啦！</div></div>`;
  SCENES.forEach(s=>{
    const d=state.pic[s.id];
    h+=`<button class="itemcard ${d?"done":""}" onclick="openScene('${s.id}')"><div class="cover">${s.e}</div>
    <div class="grow"><div class="t">${s.t}</div><div class="k">${d?"✔ 已练过 · 再看看范例！":"点我开始"}</div></div>
    <div style="font-size:22px;">${d?"🏅":"➜"}</div></button>`;

}
function openScene(id){
  const s=SCENES.find(x=>x.id===id);
  const qs=s.qs.map((q,i)=>`<div class="qchip">${["1️⃣","2️⃣","3️⃣","4️⃣"][i]} ${q}</div>`).join("");
  document.getElementById("view").innerHTML=`
  <div class="backrow"><button class="btn ghost small" onclick="go('pic')">← 返回</button></div>
  <div class="card"><h2 style="font-size:22px;">${s.e} ${s.t}</h2>
  <div class="scene">${s.svg}</div>
  <div class="stepnote">第一步 · 看着图，想一想这些问题：</div>${qs}
  <div class="stepnote" style="margin-top:12px;">第二步 · 自己大声说一说（可以说给妈妈听）🎤</div>
  <div class="center" style="margin-top:12px;"><button class="btn sand" onclick="showSample('${id}')">👀 我说完了，看看范例</button></div>
  <div id="sampleBox"></div></div>`;

}
function showSample(id){
  const s=SCENES.find(x=>x.id===id);
  const first=!state.pic[id];
  state.pic[id]=true;
  if(first)addXP(10);else addXP(3);
  save();updateHeader();fireworks();
  const text=s.sample.replace(/【([^】]+)】/g,'<span class="goodword">$1</span>');
  document.getElementById("sampleBox").innerHTML=`
  <div class="stepnote" style="margin-top:16px;">第三步 · 范例来啦！<span class="goodword">黄色</span>的是好词好句，跟着读一读：</div>
  <div class="samplebox">${text}</div>
  <div class="brow" style="margin-top:12px;"><div class="face">🐬</div><div class="bubble grow">把范例<b>大声读两遍</b>，再试着不看范例，用自己的话说一遍。每次都会比上一次说得好！🌟</div></div>
  <div class="center" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
  <button class="btn" onclick="go('pic')">🖼️ 练下一个场景</button></div>`;
}
/* ============ 问答小贝壳 ============ */
function renderQaList(){
  let h=`<div class="brow"><div class="face">🐬</div><div class="bubble grow">口试问答有个小魔法：<b>回答 + 原因 + 小细节</b>，三步说出最完整的答案！每题都有三个等级，照着<b>金色的完整版</b>多说几遍。</div></div>`;
  QAS.forEach((qa,i)=>{
    const d=state.qa["q"+i];
    h+=`<button class="itemcard ${d?"done":""}" onclick="openQa(${i})"><div class="cover">🐚</div>
    <div class="grow"><div class="t">${qa.q}</div><div class="k">${d?"✔ 已练过 · 温故知新！":"点我练一练"}</div></div>
    <div style="font-size:22px;">${d?"🏅":"➜"}</div></button>`;
  });
  document.getElementById("view").innerHTML=h;
}
function openQa(i){
  const qa=QAS[i];
  document.getElementById("view").innerHTML=`
  <div class="backrow"><button class="btn ghost small" onclick="go('qa')">← 返回</button></div>
  <div class="card"><h2 style="font-size:21px;">🐚 ${qa.q}</h2>
  <div class="stepnote">第一步 · 先自己回答一遍 🎤</div>
  <div class="stepnote" style="margin-top:10px;">第二步 · 看看回答的三个等级，一级比一级棒：</div>
  <div class="lvl lvl1"><span class="lab">🌱 简单回答</span>${qa.l1}</div>
  <div class="lvl lvl2"><span class="lab">🌿 加上原因</span>${qa.l2}</div>
  <div class="lvl lvl3"><span class="lab">🌟 加上细节（照着这个说！）</span>${qa.l3}</div>
  <div class="stepnote" style="margin-top:10px;">第三步 · 跟着 🌟 金色完整版，大声说两遍！</div>
  <div class="center" style="margin-top:12px;"><button class="btn" onclick="finishQa(${i})">✅ 我说完啦！</button></div>
  <div id="qaDoneBox"></div></div>`;
  window.scrollTo(0,0);
}
function finishQa(i){
  const first=!state.qa["q"+i];
  state.qa["q"+i]=true;
  if(first)addXP(10);else addXP(3);
  save();updateHeader();fireworks();
  document.getElementById("qaDoneBox").innerHTML=`
  <div class="brow" style="margin-top:14px;"><div class="face">🐬</div><div class="bubble grow">太棒了！${first?"+10 颗星星！":"温故知新，+3 颗星星！"}记住这个魔法：<b>回答 + 原因 + 细节</b>。考试的时候也要这样说完整的句子哦！🌟</div></div>
  <div class="center"><button class="btn" onclick="go('qa')">🐚 练下一题</button></div>`;
}
/* ============ 特效 ============ */
const fxCanvas=document.getElementById("fx");
const fxCtx=fxCanvas.getContext("2d");
let parts=[],fxRunning=false;
function fxResize(){fxCanvas.width=innerWidth;fxCanvas.height=innerHeight;}
addEventListener("resize",fxResize);fxResize();
const FX_COLORS=["#4ab8d8","#ff8a7a","#ffd66b","#8fd7b8","#a5e0ef","#f7a8d8"];
function spawnConfetti(n,x,y,spread){
  for(let i=0;i<n;i++){
    parts.push({x:x??Math.random()*fxCanvas.width,y:y??-10,
      vx:(Math.random()-.5)*(spread||4),vy:Math.random()*3+2,
      s:Math.random()*7+4,c:FX_COLORS[Math.floor(Math.random()*FX_COLORS.length)],
      r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,life:140});
  }
  runFX();
}
function spawnFirework(){
  const x=Math.random()*fxCanvas.width,y=Math.random()*fxCanvas.height*.5+50;
  const c=FX_COLORS[Math.floor(Math.random()*FX_COLORS.length)];
  for(let i=0;i<28;i++){
    const a=(i/28)*Math.PI*2,sp=Math.random()*3+2;
    parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,s:4,c:c,r:0,vr:0,life:60,fw:true});
  }
}
function confettiBurst(){spawnConfetti(90);}
function fireworks(){
  spawnConfetti(70);
  let count=0;
  const iv=setInterval(()=>{spawnFirework();runFX();count++;if(count>5)clearInterval(iv);},350);
}
function runFX(){
  if(fxRunning)return;fxRunning=true;
  function tick(){
    fxCtx.clearRect(0,0,fxCanvas.width,fxCanvas.height);
    parts=parts.filter(p=>p.life>0&&p.y<fxCanvas.height+20);
    parts.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;if(!p.fw)p.vy+=.06;else p.vy+=.03;p.r+=p.vr;p.life--;
      fxCtx.save();fxCtx.translate(p.x,p.y);fxCtx.rotate(p.r);
      fxCtx.globalAlpha=Math.min(1,p.life/40);
      fxCtx.fillStyle=p.c;fxCtx.fillRect(-p.s/2,-p.s/2,p.s,p.s);fxCtx.restore();
    });
    if(parts.length){requestAnimationFrame(tick);}else{fxRunning=false;fxCtx.clearRect(0,0,fxCanvas.width,fxCanvas.height);}
  }
  requestAnimationFrame(tick);
}
/* ============ 启动 ============ */
updateHeader();
go("home");
</script>
