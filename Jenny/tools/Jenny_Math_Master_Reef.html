<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Math Master Reef 🐬</title>
<style>
  :root {
    --tiffany:#0abab5; --tiffany-light:#81d8d0; --lagoon:#e6f7f5; --sky:#f4fbfa;
    --deep:#0a8a86; --sand:#fdf3dd; --coral:#ff8a7a; --card:#ffffff;
    --ink:#144644; --ink2:#4e7d78; --line:#bfe9e4; --line2:#8fd8d0;
    --good:#2fae82; --goodbg:#e2f7ee; --badbg:#ffece9; --sandline:#f0d79a; --sandink:#a8781a;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size:17px; line-height:1.8; color:var(--ink);
    background:var(--sky);
    background-image: linear-gradient(180deg,var(--sky) 0%,var(--lagoon) 55%,#d8f2ef 100%);
    background-attachment:fixed; min-height:100%;
  }
  #app { max-width:780px; margin:0 auto; padding:10px 10px 80px; }
  button { font-family:inherit; cursor:pointer; border:none; min-height:46px; color:var(--ink); }
  /* ---------- springy motion ---------- */
  @keyframes floaty { 0%,100%{transform:translateY(0) rotate(-2deg);} 50%{transform:translateY(-7px) rotate(2deg);} }
  @keyframes wiggle { 0%,100%{transform:rotate(0);} 25%{transform:rotate(-2.5deg) scale(1.02);} 75%{transform:rotate(2.5deg) scale(1.02);} }
  @keyframes popIn { 0%{opacity:0; transform:scale(.8);} 60%{opacity:1; transform:scale(1.04);} 100%{transform:scale(1);} }
  @keyframes slidein { from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;} }
  @keyframes shineflow { 0%{background-position:0 0;} 100%{background-position:60px 0;} }
  /* ---------- Header ---------- */
  .topbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .chip {
    background:var(--card); border-radius:16px; padding:6px 12px; font-weight:800; font-size:16px;
    box-shadow:0 3px 10px rgba(10,138,134,.13); display:flex; align-items:center; gap:6px; min-height:44px;
  }
  .chip small { font-weight:700; color:var(--ink2); font-size:12px; }
  button.chip { transition:transform .15s cubic-bezier(.34,1.56,.64,1); }
  button.chip:active { transform:scale(.92); }
  .lvlbar { flex:1 1 130px; background:var(--card); border-radius:16px; padding:6px 12px; box-shadow:0 3px 10px rgba(10,138,134,.13); min-height:44px;}
  .lvlbar .t { font-size:13px; font-weight:800; color:var(--deep); }
  .pbar { height:10px; background:var(--lagoon); border-radius:6px; overflow:hidden; margin-top:4px;}
  .pbar > div { height:100%; background:linear-gradient(90deg,var(--tiffany-light),var(--tiffany)); border-radius:6px; transition:width .5s; }
  /* ---------- Mermaid bubble ---------- */
  .guide { display:flex; align-items:flex-start; gap:10px; margin:8px 0 12px; }
  .guide .face { font-size:44px; line-height:1.15; filter:drop-shadow(0 3px 4px rgba(10,138,134,.25)); animation:floaty 3.2s ease-in-out infinite; }
  .bubble {
    background:var(--card); border-radius:4px 18px 18px 18px; padding:10px 15px; font-size:17px;
    box-shadow:0 4px 12px rgba(10,138,134,.13); flex:1; border:2px solid var(--tiffany-light); animation:popIn .35s;
  }
  /* ---------- Island map ---------- */
  .mapttl { color:var(--deep); font-size:18px; margin:8px 2px 8px; }
  .map { display:grid; grid-template-columns:repeat(auto-fill,minmax(205px,1fr)); gap:10px; }
  .island {
    background:var(--card); border-radius:20px; padding:12px 14px; text-align:left; box-shadow:0 5px 16px rgba(10,138,134,.13);
    display:flex; align-items:center; gap:10px; border:2px solid transparent;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s;
    position:relative; min-height:92px; width:100%;
  }
  .island:hover { transform:translateY(-3px) scale(1.02); box-shadow:0 8px 20px rgba(10,138,134,.2); animation:wiggle .5s; }
  .island:active { transform:scale(.96); }
  .island .em { font-size:38px; }
  .island .nm { font-weight:800; font-size:16px; color:var(--ink); line-height:1.3; }
  .island .sub { font-size:13px; color:var(--ink2); margin-top:2px; line-height:1.3; }
  .island.preview { background:linear-gradient(135deg,var(--card) 60%,var(--sand)); border-color:var(--sandline); }
  .island.logic { background:linear-gradient(135deg,var(--card) 55%,var(--lagoon)); border-color:var(--line2); }
  .ptag { position:absolute; top:-9px; right:12px; background:var(--sand); border:2px solid var(--sandline); color:var(--sandink);
    font-size:11px; font-weight:800; padding:1px 9px; border-radius:12px; }
  .ring { margin-left:auto; flex:none; }
  .shellbar {
    width:100%; margin:12px 0 4px; background:linear-gradient(135deg,var(--card) 60%,#ffeee9); border:2px solid #ffcdc4;
    border-radius:20px; padding:12px 16px; font-size:17px; font-weight:800; color:var(--ink); text-align:left;
    box-shadow:0 5px 16px rgba(10,138,134,.12); display:flex; align-items:center; gap:10px;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1);
  }
  .shellbar:hover { transform:scale(1.015); }
  .shellbar:active { transform:scale(.97); }
  .shellbar .cnt { background:var(--coral); color:#fff; border-radius:14px; padding:1px 11px; font-size:15px; }
  .shellbar .cnt.zero { background:var(--good); }
  /* ---------- Quiz ---------- */
  .qcard { background:var(--card); border-radius:20px; padding:18px; box-shadow:0 5px 18px rgba(10,138,134,.14); margin-bottom:12px; animation:popIn .3s; }
  .qtext { font-size:20px; line-height:1.8; font-weight:650; }
  .qtext b { color:var(--deep); }
  .qvis { margin:12px 0 4px; }
  .opts { display:grid; grid-template-columns:1fr; gap:10px; margin-top:14px; }
  @media(min-width:520px){ .opts.short { grid-template-columns:1fr 1fr; } }
  .opts.vis { grid-template-columns:1fr 1fr; }
  .opt {
    background:var(--sky); border:2px solid var(--line); border-radius:16px; padding:12px 15px; font-size:19px; font-weight:700;
    color:var(--ink); text-align:left; min-height:52px;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1), background .15s, border-color .15s;
  }
  .opt.vis { display:flex; align-items:center; justify-content:center; padding:8px; }
  .opt:not(:disabled):hover { transform:scale(1.02); border-color:var(--tiffany-light); }
  .opt:not(:disabled):active { background:var(--lagoon); transform:scale(.97); }
  .opt.sel-ok { background:var(--goodbg); border-color:var(--good); color:#177a55; }
  .opt.sel-no { background:var(--badbg); border-color:var(--coral); color:#c65a4c; }
  .opt.show-ok { background:var(--goodbg); border-color:var(--good); color:#177a55; }
  .inputrow { display:flex; gap:10px; margin-top:14px; align-items:stretch; flex-wrap:wrap; }
  .ansin {
    flex:1 1 140px; font-size:22px; font-weight:800; padding:10px 14px; border:2px solid var(--line); border-radius:16px;
    color:var(--ink); background:var(--sky); min-height:52px; width:100px; font-family:inherit;
  }
  .ansin:focus { outline:none; border-color:var(--tiffany); background:var(--card); }
  .btn {
    background:linear-gradient(180deg,#2ec9c4,var(--tiffany)); color:#fff; font-weight:800; font-size:17px;
    border-radius:16px; padding:11px 20px; box-shadow:0 4px 0 var(--deep); min-height:50px;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  .btn:hover { transform:scale(1.03); }
  .btn:active { transform:translateY(2px) scale(.98); box-shadow:0 2px 0 var(--deep); }
  .btn.sand { background:linear-gradient(180deg,#ffd98e,#f4c35d); color:#7a5a12; box-shadow:0 4px 0 #d9a83f; }
  .btn.ghost { background:var(--card); color:var(--deep); border:2px solid var(--line); box-shadow:none; }
  .btn.coral { background:linear-gradient(180deg,#ff9d8f,var(--coral)); box-shadow:0 4px 0 #e06a5a; }
  .btn:disabled { opacity:.5; }
  /* ---------- Sudoku ---------- */
  .sud { display:grid; grid-template-columns:repeat(4,60px); gap:5px; justify-content:center; margin:12px auto 4px; }
  .sudc {
    width:60px; height:60px; border-radius:12px; background:var(--card); border:2px solid var(--line);
    font-size:28px; display:flex; align-items:center; justify-content:center; min-height:46px; padding:0;
    transition:transform .12s cubic-bezier(.34,1.56,.64,1);
  }
  .sudc:not(.giv):not(:disabled):active { transform:scale(.9); }
  .sudc.giv { background:var(--lagoon); border-color:var(--line2); }
  .sudc.bad { background:var(--badbg); border-color:var(--coral); }
  .sudc.mr { margin-right:8px; } .sudc.mb { margin-bottom:8px; }
  .sudmini { display:grid; grid-template-columns:repeat(4,44px); gap:4px; justify-content:center; margin:8px auto; }
  .sudmini .mc { width:44px; height:44px; border-radius:9px; background:var(--card); border:2px solid var(--line);
    font-size:21px; display:flex; align-items:center; justify-content:center; }
  .sudmini .mc.giv { background:var(--lagoon); border-color:var(--line2); }
  .sudmini .mc.hl { background:var(--sand); border-color:var(--sandline); }
  .sudmini .mc.new { background:var(--goodbg); border-color:var(--good); }
  .sudmini .mc.mr { margin-right:7px; } .sudmini .mc.mb { margin-bottom:7px; }
  /* ---------- Feedback / steps ---------- */
  .fb { border-radius:20px; padding:14px 16px; margin-bottom:12px; animation:popIn .3s; }
  .fb.good { background:var(--goodbg); border:2px solid #7fd8b4; }
  .fb.oops { background:#fff4f2; border:2px solid #ffb8ae; }
  .fb .big { font-size:19px; font-weight:800; }
  .fb.good .big { color:#177a55; } .fb.oops .big { color:#c65a4c; }
  .model {
    background:var(--lagoon); border:2px dashed var(--tiffany); border-radius:16px; padding:12px 15px; margin:10px 0;
    font-size:17px; }
  .model b { color:var(--deep); }
  .model .tag { font-weight:800; color:var(--deep); font-size:14px; display:block; margin-bottom:2px; }
  .steps { background:var(--card); border-radius:20px; padding:15px; box-shadow:0 5px 16px rgba(10,138,134,.13); margin-bottom:12px; }
  .steps h4 { color:var(--deep); font-size:15px; margin-bottom:6px; }
  .step { margin:12px 0; animation:slidein .45s; }
  .stepcap { font-size:15px; font-weight:700; color:var(--deep); margin-bottom:6px; line-height:1.6; }
  .stepcap .no { background:var(--tiffany); color:#fff; border-radius:50%; display:inline-flex; width:22px; height:22px;
    align-items:center; justify-content:center; font-size:13px; margin-right:6px; }
  .hintbox { background:var(--sand); border:2px solid var(--sandline); border-radius:16px; padding:10px 14px; margin-top:12px; font-size:15px; color:#7a5a12; line-height:1.6; }
  /* ---------- Bar model ---------- */
  .bm { width:100%; max-width:520px; margin:4px auto; }
  .bmrow { display:flex; align-items:center; gap:8px; margin:7px 0; }
  .bmname { flex:0 0 76px; font-size:13px; font-weight:700; color:var(--ink2); text-align:right; line-height:1.3; }
  .bmbar { flex:1; display:flex; height:40px; border-radius:8px; overflow:hidden; }
  .bmseg { display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:15px;
    border-right:2px solid #fff; min-width:26px; line-height:1.2; }
  .bmseg:last-child { border-right:none; }
  .bmseg.q { background:repeating-linear-gradient(45deg,var(--sand),var(--sand) 8px,#f7e6bd 8px,#f7e6bd 16px)!important; color:var(--sandink); border:2px dashed #d9a83f; }
  .bmbrace { flex:1; text-align:center; font-size:14px; font-weight:800; color:var(--deep);
    border-left:2px solid var(--deep); border-right:2px solid var(--deep); border-bottom:2px solid var(--deep);
    border-radius:0 0 10px 10px; padding:2px 0 1px; margin-top:-2px; line-height:1.4; }
  /* ---------- misc visuals ---------- */
  .eq { font-size:20px; font-weight:800; color:var(--ink); text-align:center; margin:6px 0; line-height:1.7; }
  .eq b { color:var(--deep); }
  .blocks { display:flex; flex-wrap:wrap; gap:6px; align-items:flex-end; justify-content:center; }
  .hb { width:52px; height:52px; border-radius:8px; background:var(--tiffany); color:#fff; font-size:12px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    background-image:linear-gradient(#ffffff44 1px,transparent 1px),linear-gradient(90deg,#ffffff44 1px,transparent 1px);
    background-size:5.2px 5.2px; }
  .tb { width:14px; height:52px; border-radius:5px; background:var(--tiffany-light); color:#0d5b57; font-size:9px; font-weight:800;
    display:flex; align-items:flex-end; justify-content:center;
    background-image:linear-gradient(#ffffff55 1px,transparent 1px); background-size:100% 5.2px; }
  .ob { width:13px; height:13px; border-radius:4px; background:#ffd98e; }
  .pvchart { border-collapse:collapse; margin:0 auto; }
  .pvchart th { background:var(--lagoon); color:var(--deep); padding:5px 14px; font-size:13px; border:2px solid var(--line); }
  .pvchart td { font-size:24px; font-weight:800; padding:7px 14px; border:2px solid var(--line); text-align:center; }
  .pvchart td.hl { background:var(--sand); color:#d97706; }
  .chain { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:4px; }
  .chainbox { background:var(--sky); border:2px solid var(--tiffany); border-radius:12px; padding:6px 11px; font-weight:800; font-size:17px; line-height:1.4; }
  .chainbox.miss { border-style:dashed; background:var(--sand); border-color:#d9a83f; color:var(--sandink); }
  .chainarrow { color:var(--coral); font-weight:800; font-size:13px; text-align:center; padding:0 2px; line-height:1.3; }
  .chainarrow span { display:block; font-size:16px; color:var(--deep); }
  .grps { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .grp { border:2px dashed var(--tiffany); border-radius:12px; padding:5px 8px; font-size:18px; letter-spacing:2px;
    background:var(--sky); max-width:150px; text-align:center; line-height:1.5;}
  .grp.hl { background:var(--sand); border-color:#d9a83f; border-style:solid; }
  .fbarwrap { display:flex; align-items:center; gap:8px; margin:6px auto; max-width:420px; }
  .fbar { display:flex; flex:1; height:38px; border:2px solid var(--deep); border-radius:8px; overflow:hidden; }
  .fcell { flex:1; border-right:2px solid var(--deep); background:var(--card); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; color:var(--deep);}
  .fcell:last-child { border-right:none; }
  .fcell.sh { background:var(--tiffany); color:#fff; }
  .fcell.miss { background:repeating-linear-gradient(45deg,var(--sand),var(--sand) 7px,#f7e6bd 7px,#f7e6bd 14px); color:var(--sandink); }
  .flabel { font-weight:800; font-size:16px; color:var(--ink); flex:0 0 46px; }
  .cap { font-size:13px; color:var(--ink2); text-align:center; margin-top:4px; line-height:1.5; }
  .backrow { display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .combo { margin-left:auto; font-weight:800; color:#ff7a5c; font-size:16px; }
  #fx { position:fixed; inset:0; pointer-events:none; z-index:50; }
  .badgebox { background:var(--card); border-radius:20px; padding:12px 15px; box-shadow:0 5px 16px rgba(10,138,134,.13); margin-top:14px; }
  .badgebox h3 { color:var(--deep); font-size:15px; margin-bottom:6px; }
  .bdg { display:inline-flex; align-items:center; gap:5px; background:var(--sky); border:2px solid var(--line);
    border-radius:14px; padding:4px 11px; margin:3px; font-size:13px; font-weight:700; }
  .bdg.locked { opacity:.38; filter:grayscale(1); }
  /* ---------- mistake shells ---------- */
  .mcardlist { display:flex; flex-direction:column; gap:10px; }
  .mcard { background:var(--card); border-radius:18px; padding:12px 15px; box-shadow:0 4px 14px rgba(10,138,134,.12);
    text-align:left; display:flex; align-items:center; gap:10px; border:2px solid transparent; width:100%;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1); }
  .mcard:hover { transform:scale(1.01); }
  .mcard.fx { border-color:#7fd8b4; background:linear-gradient(135deg,var(--card) 70%,var(--goodbg)); }
  .mcard .em { font-size:28px; }
  .mcard .tx { flex:1; font-size:15px; line-height:1.5; color:var(--ink); font-weight:650; }
  .mcard .st { font-size:12px; font-weight:800; border-radius:12px; padding:2px 10px; white-space:nowrap; }
  .mcard .st.todo { background:var(--badbg); color:#c65a4c; }
  .mcard .st.done { background:var(--goodbg); color:#177a55; }
  .permchip { display:inline-block; background:var(--sky); border:2px solid var(--line); border-radius:12px;
    padding:4px 10px; margin:3px; font-weight:800; font-size:15px; }
  .permchip.out { opacity:.4; text-decoration:line-through; border-style:dashed; }
  .permchip.win { background:var(--goodbg); border-color:var(--good); color:#177a55; }
  footer { text-align:center; color:#7fb5af; font-size:12px; margin-top:20px; line-height:1.6; }
</style>
</head>
<body>
<div id="app"></div>
<canvas id="fx"></canvas>
<script>
"use strict";
/* ============ utils ============ */
function ri(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function fmtMoney(c){ return "$" + (c/100).toFixed(2); }
function fmtTime(mins){ mins=((mins%720)+720)%720; let h=Math.floor(mins/60); if(h===0)h=12; const m=mins%60; return h + ":" + String(m).padStart(2,"0"); }
function qid(topic,tpl,parts){ return topic+":"+tpl+":"+parts.join("_"); }
function stripTags(s){ return String(s).replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim(); }

/* ============ WebAudio synth (no audio files) ============ */
let AC=null;
function ensureAC(){
  try{
    if(typeof window==="undefined") return null;
    if(!AC){ const Ctor=window.AudioContext||window.webkitAudioContext; if(Ctor) AC=new Ctor(); }
    if(AC && AC.state==="suspended") AC.resume();
  }catch(e){ return null; }
  return AC;
}
function tone(freq,dur,type,vol,when,slide){
  const c=ensureAC(); if(!c) return;
  try{
    const t0=c.currentTime+(when||0);
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||"sine"; o.frequency.setValueAtTime(freq,t0);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide,t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||0.15,t0+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0+dur+0.05);
  }catch(e){}
}
function sndPop(){ tone(340,0.08,"sine",0.1,0,180); }              /* soft tap "pop" */
function sndDing(){ tone(880,0.16,"sine",0.16); tone(1318,0.2,"sine",0.13,0.09); tone(1760,0.3,"sine",0.07,0.18,2100); } /* bubble ding */
function sndOops(){ tone(280,0.22,"sine",0.09,0,200); }
function sndCombo(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.15,"triangle",0.13,i*0.09)); tone(2093,0.4,"sine",0.07,0.38,2600); } /* arpeggio */
function sndFix(){ tone(660,0.12,"sine",0.13); tone(990,0.22,"sine",0.12,0.1); }

/* ============ TTS (Web Speech API) ============ */
const TTSKEY="jenny_tts_on";
function ttsOn(){ try{ if(typeof localStorage==="undefined") return true; const v=localStorage.getItem(TTSKEY); return v===null?true:v==="1"; }catch(e){ return true; } }
function setTtsOn(on){ try{ if(typeof localStorage!=="undefined") localStorage.setItem(TTSKEY,on?"1":"0"); }catch(e){} }
let VOICES=[];
function loadVoices(){ try{ VOICES=speechSynthesis.getVoices()||[]; }catch(e){ VOICES=[]; } }
function pickVoice(lang){
  const en=lang.indexOf("en")===0;
  const prefs=en?["samantha","karen","enhanced","premium","natural"]:["tingting","ting-ting","meijia","mei-jia","婷婷"];
  const cand=VOICES.filter(v=>v.lang && v.lang.toLowerCase().indexOf(en?"en":"zh")===0);
  for(const p of prefs){ const f=cand.find(v=>(v.name||"").toLowerCase().indexOf(p)>=0); if(f) return f; }
  return cand[0]||null;
}
function speak(text,lang){
  if(!ttsOn()) return;
  try{
    if(typeof speechSynthesis==="undefined") return;
    if(!VOICES.length) loadVoices();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang||"en-US";
    const v=pickVoice(u.lang);
    if(v) u.voice=v;
    else if(u.lang.indexOf("zh")===0) return; /* silent fallback: no zh voice on device */
    u.rate=0.95; u.pitch=1.05;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

/* ============ daily quota (cross-tool convention) ============ */
const DKEY="jenny_daily_v1", DGOAL=10;
function today(){ return new Date().toISOString().slice(0,10); }
function dailyAll(){ try{ if(typeof localStorage==="undefined") return {}; return JSON.parse(localStorage.getItem(DKEY))||{}; }catch(e){ return {}; } }
function dailyMath(){ const d=dailyAll()[today()]; return d?(d.math||0):0; }
function bumpDaily(){
  try{
    if(typeof localStorage==="undefined") return;
    const all=dailyAll(), t=today();
    if(!all[t]) all[t]={math:0,science:0,reading:0,chinese:0,oral:0};
    all[t].math=(all[t].math||0)+1;
    localStorage.setItem(DKEY,JSON.stringify(all));

const C1="#0abab5", C2="#ff8a7a", C3="#7fd8b4", C4="#f4c35d", CDEEP="#0a8a86", CINK="#144644";
function bm(rows){
  let max=0;
  rows.forEach(r=>{ const s=r.segs.reduce((a,x)=>a+x.v,0); if(s>max)max=s; });
  let h='<div class="bm">';
  rows.forEach(r=>{
    const tot=r.segs.reduce((a,x)=>a+x.v,0);
    h+='<div class="bmrow"><div class="bmname">'+r.name+'</div><div style="flex:1"><div class="bmbar" style="width:'+(tot/max*100)+'%">';
    r.segs.forEach(s=>{
      h+='<div class="bmseg'+(s.q?' q':'')+'" style="width:'+(s.v/tot*100)+'%;'+(s.q?'':'background:'+(s.c||C1))+'">'+s.t+'</div>';
    });
    h+='</div>';
    if(r.brace) h+='<div style="display:flex"><div class="bmbrace" style="width:100%">'+r.brace+'</div></div>';
    h+='</div></div>';
  });
  return h+'</div>';
}

function base10(n, cap){
  const h=Math.floor(n/100), t=Math.floor(n%100/10), o=n%10;
  let s='<div class="blocks">';
  for(let i=0;i<h;i++) s+='<div class="hb">100</div>';
  for(let i=0;i<t;i++) s+='<div class="tb">10</div>';
  for(let i=0;i<o;i++) s+='<div class="ob"></div>';
  s+='</div>';
  if(cap) s+='<div class="cap">'+cap+'</div>';
  return s;
}
function pvChart(n, hlPos){
  const ds=String(n).split("");
  const heads = ds.length===4 ? ["Thousands","Hundreds","Tens","Ones"] : ["Hundreds","Tens","Ones"];
  let s='<table class="pvchart"><tr>'; heads.forEach(x=>s+='<th>'+x+'</th>'); s+='</tr><tr>';
  ds.forEach((d,i)=>s+='<td'+(i===hlPos?' class="hl"':'')+'>'+d+'</td>');
  return s+'</tr></table>';
}
function chain(items){
  let s='<div class="chain">';

    else s+='<div class="chainbox'+(it.miss?' miss':'')+'">'+it.box+'</div>';
  });

}

/* sudoku read-only mini grid; vals: 16 (0=blank); opts {hl, giv} */

    else if(o.giv && vals[i]!==0) cls+=" new";

  }

/* ============ option helper ============ */
function mkOpts(correct, wrongs, fmt){
  fmt = fmt || (x=>String(x));
  const ansS = fmt(correct);
  const set = new Set([ansS]); const out=[ansS];
  for(const w of wrongs){ const s=fmt(w); if(!set.has(s) && out.length<4){ set.add(s); out.push(s);} }
  let i=1;
  while(out.length<4 && i<80 && typeof correct==="number"){
    for(const c of [correct+i, correct-i]){
      const s=fmt(c); if(out.length<4 && !set.has(s) && c>0){ set.add(s); out.push(s); }
    }
    i++;
  }
  const opts=shuffle(out);
  return { opts:opts, ansIdx:opts.indexOf(ansS), ans:ansS };
}

/* ---------- Numbers to 1000 ---------- */
function genNum(d){
  const sub=pick(["pv","digit","cmp","pat","moreless","expand"]);
  if(sub==="pv"){
    let n; do{ n=ri(102,987); }while(new Set(String(n)).size<3 || String(n).includes("0"));
    const p=pick([0,1,2]); const dg=+String(n)[p]; const val=dg*Math.pow(10,2-p);
    const place=["hundreds","tens","ones"][p];
    const o=mkOpts(val,[dg, dg*Math.pow(10,(2-p+1)%3), dg*Math.pow(10,(2-p+2)%3), n-val]);
    return { id:qid("num","pv",[n,p]), type:"mcq", short:true,
      text:"In the number <b>"+n+"</b>, what is the <b>value</b> of the digit <b>"+dg+"</b>?",
      opts:o.opts, ansIdx:o.ansIdx, ans:o.ans,
      model:"The digit "+dg+" is in the "+place+" place, so its value is <b>"+val+"</b>.",
      steps:[
        {c:"Put "+n+" in a place-value chart. The digit "+dg+" sits in the "+place+" place.", h:pvChart(n,p)},
        {c:dg+" in the "+place+" place makes "+val+".", h:base10(val)},
        {c:"So the value of the digit "+dg+" is "+val+".", h:eq(dg+" × "+Math.pow(10,2-p)+" = <b>"+val+"</b>")}
      ],
      dbg:{tpl:"pv", n:n, p:p} };
  }
  if(sub==="digit"){
    let n; do{ n=ri(123,987); }while(new Set(String(n)).size<3 || String(n).includes("0"));
    const p=pick([0,1,2]); const dg=+String(n)[p];
    const place=["hundreds","tens","ones"][p];
    const digits=String(n).split("").map(Number);
    const wrong=[]; digits.forEach(x=>{ if(x!==dg) wrong.push(x); });
    let extra=ri(1,9); while(digits.includes(extra)) extra=(extra%9)+1;
    wrong.push(extra);
    const o=mkOpts(dg,wrong);
    return { id:qid("num","digit",[n,p]), type:"mcq", short:true,
      text:"Which digit of <b>"+n+"</b> is in the <b>"+place+" place</b>?",
      opts:o.opts, ansIdx:o.ansIdx, ans:o.ans,
      model:"The digit in the "+place+" place of "+n+" is <b>"+dg+"</b>.",
      steps:[
        {c:"Write "+n+" in a place-value chart.", h:pvChart(n,p)},
        {c:"Read the "+place+" column — it holds the digit "+dg+".", h:eq("The "+place+" digit of "+n+" is <b>"+dg+"</b>")}
      ],
      dbg:{tpl:"digit", n:n, p:p} };
  }
  if(sub==="cmp"){
    const h=ri(2,8);
    const nums=new Set();
    nums.add(h*100+ri(10,49)); nums.add(h*100+ri(50,99));
    while(nums.size<4) nums.add(ri(100,999));
    const arr=shuffle([...nums]);
    const big=pick([true,false]);
    const ans=big?Math.max(...arr):Math.min(...arr);
    const opts=shuffle(arr.map(String));
    return { id:qid("num","cmp",arr.concat(big?1:0)), type:"mcq", short:true,
      text:"Which is the <b>"+(big?"greatest":"smallest")+"</b> number?<br><span style='color:var(--deep)'>"+arr.join(" , ")+"</span>",
      opts:opts, ansIdx:opts.indexOf(String(ans)), ans:String(ans),
      model:"The "+(big?"greatest":"smallest")+" number is <b>"+ans+"</b>.",
      steps:[
        {c:"Compare the hundreds digit first.", h:'<div class="chain">'+arr.map(x=>'<div class="chainbox"><b style="color:#ff8a7a">'+String(x)[0]+'</b>'+String(x).slice(1)+'</div>').join("")+'</div>'},
        {c:"If the hundreds are the same, compare the tens next.", h:'<div class="chain">'+arr.filter(x=>Math.floor(x/100)===Math.floor(ans/100)).map(x=>'<div class="chainbox">'+String(x)[0]+'<b style="color:#ff8a7a">'+String(x)[1]+'</b>'+String(x)[2]+'</div>').join("")+'</div>'},
        {c:"Line them up from smallest to greatest.", h:eq(arr.slice().sort((a,b)=>a-b).join(" &lt; "))}
      ],
      dbg:{tpl:"cmp", arr:arr, big:big} };
  }
  if(sub==="pat"){
    const step=pick([2,3,5,10,25,50,100]) * pick([1,-1]);
    let start = step>0 ? ri(3,Math.max(4,900-4*step)) : ri(4*(-step)+3, 950);
    const seq=[0,1,2,3,4].map(i=>start+i*step);
    const mi=pick([1,2,3]);
    const ans=seq[mi];
    const shown=seq.map((v,i)=>i===mi?"?":v);
    return { id:qid("num","pat",[start,step,mi]), type:"input", intOnly:true,
      text:"What is the <b>missing number</b> in this pattern?",
      qvis:chain(shown.flatMap((v,i)=>i===0?[{box:v,miss:v==="?"}]:[{arrow:""},{box:v,miss:v==="?"}])),
      ans:ans,
      model:"The missing number is <b>"+ans+"</b>. The pattern "+(step>0?"adds":"subtracts")+" "+Math.abs(step)+" each time.",
      steps:[
        {c:"Find the jump between two numbers you can see.", h:eq(seq[mi===1?2:0]+" ➜ "+seq[mi===1?3:1]+" is a jump of <b>"+(step>0?"+":"−")+Math.abs(step)+"</b>")},
        {c:"Use the same jump for every step.", h:chain(seq.flatMap((v,i)=>i===0?[{box:v}]:[{arrow:(step>0?"+":"−")+Math.abs(step)},{box:(i===mi?"?":v),miss:i===mi}]))},
        {c:seq[mi-1]+" "+(step>0?"+":"−")+" "+Math.abs(step)+" = "+ans+".", h:chain(seq.flatMap((v,i)=>i===0?[{box:v}]:[{arrow:(step>0?"+":"−")+Math.abs(step)},{box:v,miss:i===mi}]))}
      ],
      dbg:{tpl:"pat", start:start, step:step, mi:mi} };
  }
  if(sub==="moreless"){
    const delta=pick([10,-10,100,-100,1,-1]);
    let n; do{ n=ri(115,880); }while(n+delta<1 || n+delta>999 || (delta===-10 && n%100<10) || (delta===-1 && n%10===0) || (delta===1 && n%10===9) || (delta===10 && n%100>=90));
    const ans=n+delta;
    const word=(Math.abs(delta))+" "+(delta>0?"more than":"less than");
    return { id:qid("num","moreless",[n,delta]), type:"input", intOnly:true,
      text:"What number is <b>"+word+" "+n+"</b>?",
      ans:ans,
      model:"<b>"+ans+"</b> is "+word+" "+n+".",
      steps:[
        {c:(delta>0?"Count on":"Count back")+" by "+Math.abs(delta)+" from "+n+".", h:chain([{box:n},{arrow:(delta>0?"+":"−")+Math.abs(delta)},{box:"?",miss:true}])},
        {c:"Only the "+(Math.abs(delta)===100?"hundreds":Math.abs(delta)===10?"tens":"ones")+" digit changes"+(Math.abs(delta)===10&&(n%100>=90||n%100<10)?" (watch the regrouping!)":"")+".", h:eq(n+" "+(delta>0?"+":"−")+" "+Math.abs(delta)+" = <b>"+ans+"</b>")},
        {c:"Check with blocks.", h:base10(ans, ans+" = "+Math.floor(ans/100)+" hundreds, "+Math.floor(ans%100/10)+" tens, "+(ans%10)+" ones")}
      ],
      dbg:{tpl:"moreless", n:n, delta:delta} };
  }
  const hh=ri(1,9), tt=ri(1,9), oo=ri(1,9);
  const ans=hh*100+tt*10+oo;
  return { id:qid("num","expand",[hh,tt,oo]), type:"input", intOnly:true,
    text:"<b>"+(hh*100)+" + "+(tt*10)+" + "+oo+" = ?</b><br>What is the number?",
    ans:ans,
    model:(hh*100)+" + "+(tt*10)+" + "+oo+" = <b>"+ans+"</b>.",
    steps:[
      {c:"Each part goes to its own place-value column.", h:pvChart(ans)},
      {c:"Build it with blocks: "+hh+" hundreds, "+tt+" tens, "+oo+" ones.", h:base10(ans)},
      {c:"Read the number: "+ans+".", h:eq((hh*100)+" + "+(tt*10)+" + "+oo+" = <b>"+ans+"</b>")}
    ],
    dbg:{tpl:"expand", h:hh, t:tt, o:oo} };
}

function subBondSteps(T, C){
  const x=T%100;
  if(x>0 && x<C && C-x>0){
    return [{c:"Number bond trick: split "+C+" into "+x+" and "+(C-x)+" to reach a nice round number.", h:bond(C,x,C-x)+eq(T+" − "+x+" = "+(T-x)+" , then "+(T-x)+" − "+(C-x)+" = <b>"+(T-C)+"</b>")}];
  }
  return [];
}

        {c:"Step 2: Take away the afternoon sale.", h:eq((A-B)+" − "+Cc+" = <b>"+ans+"</b>")}

        {c:"Step 1: Find "+name2+"'s number.", h:eq(A+" + "+B+" = <b>"+(A+B)+"</b>")},
        {c:"Step 2: Add both children. Careful — not just "+A+" + "+B+"!", h:bm([{name:name, segs:[{v:A,t:A,c:C1}]},{name:name2, segs:[{v:A+B,t:A+B,c:C3}]},{name:"Total", segs:[{v:ans,t:"?",q:1}]}])+eq(A+" + "+(A+B)+" = <b>"+ans+"</b>")}

      ans:ans,

      text:name+" buys a "+t1+" for <b>"+fmtMoney(p1)+"</b> and a "+t2+" for <b>"+fmtMoney(p2)+"</b>. "+name+" pays with a <b>"+fmtMoney(pay)+"</b> note.<br>How much <b>change</b> does "+name+" get? (e.g. 2.30)",
      ans:ans/100,
      model:name+" gets <b>"+fmtMoney(ans)+"</b> change.",
      steps:[
        {c:"Step 1: Add the two prices.", h:bm([{name:"Cost", segs:[{v:p1,t:fmtMoney(p1),c:C1},{v:p2,t:fmtMoney(p2),c:C3}], brace:"?"}])+eq(fmtMoney(p1)+" + "+fmtMoney(p2)+" = <b>"+fmtMoney(p1+p2)+"</b>")},
        {c:"Step 2: The change is what is left from the note.", h:bm([{name:"Paid", segs:[{v:p1+p2,t:fmtMoney(p1+p2),c:C2},{v:ans,t:"?",q:1}], brace:fmtMoney(pay)}])},
        {c:fmtMoney(pay)+" − "+fmtMoney(p1+p2)+" = "+fmtMoney(ans)+".", h:eq(fmtMoney(pay)+" − "+fmtMoney(p1+p2)+" = <b>"+fmtMoney(ans)+"</b>")}
      ],
      dbg:{tpl:"two", p1:p1, p2:p2, pay:pay} };
  }
  if(sub==="diff"){
    let p1,p2; do{ p1=ri(30,190)*5; p2=ri(21,150)*5; }while(p1-p2<60);
    const ans=p1-p2;
    const [t1,e1]=pick(SHOPS); let t2pair; do{ t2pair=pick(SHOPS); }while(t2pair[0]===t1);
    return { id:qid("money","diff",[p1,p2]), type:"input", money:true,
      text:"A "+t1+" "+e1+" costs <b>"+fmtMoney(p1)+"</b>. A "+t2pair[0]+" "+t2pair[1]+" costs <b>"+fmtMoney(p2)+"</b>.<br>How much <b>more</b> does the "+t1+" cost? (e.g. 1.25)",
      ans:ans/100,
      model:"The "+t1+" costs <b>"+fmtMoney(ans)+"</b> more.",
      steps:[
        {c:"Compare the two price bars — the extra piece is the difference.", h:bm([{name:t1, segs:[{v:p2,t:fmtMoney(p2),c:C1},{v:ans,t:"?",q:1}]},{name:t2pair[0], segs:[{v:p2,t:fmtMoney(p2),c:C3}]}])},
        {c:"'How much more' → subtract!", h:eq(fmtMoney(p1)+" − "+fmtMoney(p2)+" = <b>"+fmtMoney(ans)+"</b>")}
      ],
      dbg:{tpl:"diff", p1:p1, p2:p2} };
  }
  if(sub==="save"){
    const cost=ri(60,190)*10; const have=ri(2,Math.floor(cost/10)-2)*10;
    const ans=cost-have;
    const [t1,e1]=pick(SHOPS);
    return { id:qid("money","save",[have,cost]), type:"input", money:true,
      text:name+" has saved <b>"+fmtMoney(have)+"</b>. A "+t1+" "+e1+" costs <b>"+fmtMoney(cost)+"</b>.<br>How much <b>more</b> must "+name+" save to buy it? (e.g. 4.60)",
      ans:ans/100,
      model:name+" needs <b>"+fmtMoney(ans)+"</b> more.",
      steps:[
        {c:"The price is the whole. The savings are one part.", h:bm([{name:"Price", segs:[{v:have,t:fmtMoney(have),c:C1},{v:ans,t:"?",q:1}], brace:fmtMoney(cost)}])},
        {c:"Missing part → subtract.", h:eq(fmtMoney(cost)+" − "+fmtMoney(have)+" = <b>"+fmtMoney(ans)+"</b>")},
        {c:"Check by adding back: "+fmtMoney(have)+" + "+fmtMoney(ans)+" = "+fmtMoney(cost)+" ✓", h:eq(fmtMoney(have)+" + "+fmtMoney(ans)+" = "+fmtMoney(cost)+" ✓")}
      ],
      dbg:{tpl:"save", have:have, cost:cost} };
  }
  const a=ri(2,5), b=ri(1,5); const ans=200*a+50*b;
  return { id:qid("money","notes",[a,b]), type:"input", money:true,
    text:name+" has <b>"+a+"</b> two-dollar notes 💵 and <b>"+b+"</b> fifty-cent coins 🪙.<br>How much money is that altogether? (e.g. 6.50)",
    ans:ans/100,
    model:name+" has <b>"+fmtMoney(ans)+"</b> altogether.",
    steps:[
      {c:"Count the notes: "+a+" × $2 = "+fmtMoney(200*a)+".", h:eq(a+" × $2 = <b>"+fmtMoney(200*a)+"</b>")},
      {c:"Count the coins: "+b+" × 50¢ = "+fmtMoney(50*b)+".", h:eq(b+" × 50¢ = <b>"+fmtMoney(50*b)+"</b>")},
      {c:"Add them together.", h:eq(fmtMoney(200*a)+" + "+fmtMoney(50*b)+" = <b>"+fmtMoney(ans)+"</b>")}
    ],
    dbg:{tpl:"notes", a:a, b:b} };
}

/* ---------- Time ---------- */
function genTime(d){
  const sub=pick(["read","end","dur","startT","name","later"]);
  const ACTS=["swimming class","art lesson","piano practice","a movie about the sea","reading time","kite flying","a puppet show"];
  if(sub==="read"){
    const h=ri(1,12), m=ri(0,11)*5; const mins=(h%12)*60+m;
    const wrongs=[];
    if(m>=5 && m<=60 && m/5>=1 && m/5<=12) wrongs.push((m/5)%12*60 + (h*5)%60);
    wrongs.push(mins+5, mins-5, mins+60);
    const o=mkOpts(mins, wrongs, fmtTime);
    return { id:qid("time","read",[h,m]), type:"mcq", short:true,
      text:"What time does this clock show?",
      qvis:clockSVG(h,m),
      opts:o.opts, ansIdx:o.ansIdx, ans:o.ans,
      model:"The time is <b>"+fmtTime(mins)+"</b>.",
      steps:[
        {c:"The short teal hand is the hour hand. It points "+(m>=30?"between "+h+" and "+(h%12+1):"at or just past "+h)+" → the hour is "+h+".", h:clockSVG(h,m,120)},
        {c:"The long coral hand is the minute hand. Count by 5s: it points at "+(m===0?12:m/5)+" → "+m+" minutes.", h:eq((m===0?12:m/5)+" × 5 = <b>"+m+"</b> minutes")},
        {c:"Put them together.", h:eq("The time is <b>"+fmtTime(mins)+"</b>")}
      ],
      dbg:{tpl:"read", h:h, m:m} };
  }
  if(sub==="end"){
    const h=ri(1,10), m=ri(0,11)*5; const start=(h%12)*60+m;
    const dur=ri(4,11)*5; const end=start+dur;
    const o=mkOpts(end, [end+5, end-5, start+60, end+10], fmtTime);
    const toHour=(60-m)%60;
    const chainSteps = toHour>0 && dur>toHour
      ? chain([{box:fmtTime(start)},{arrow:"+"+toHour+" min"},{box:fmtTime(start+toHour)},{arrow:"+"+(dur-toHour)+" min"},{box:fmtTime(end),miss:true}])
      : chain([{box:fmtTime(start)},{arrow:"+"+dur+" min"},{box:fmtTime(end),miss:true}]);
    return { id:qid("time","end",[h,m,dur]), type:"mcq", short:true,
      text:pick(ACTS).replace(/^./,c=>c.toUpperCase())+" starts at <b>"+fmtTime(start)+"</b> and lasts <b>"+dur+" minutes</b>.<br>What time does it end?",
      opts:o.opts, ansIdx:o.ansIdx, ans:o.ans,
      model:"It ends at <b>"+fmtTime(end)+"</b>.",
      steps:[
        {c:"Start at "+fmtTime(start)+" and jump forward "+dur+" minutes on a time line.", h:chainSteps},
        {c:"Check on the clock: the minute hand moves "+(dur/5)+" numbers around.", h:'<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">'+clockSVG(h,m,110)+clockSVG(Math.floor((end%720)/60)===0?12:Math.floor((end%720)/60),end%60,110)+'</div>'},
        {c:fmtTime(start)+" + "+dur+" min = "+fmtTime(end)+".", h:eq(fmtTime(start)+" + "+dur+" min = <b>"+fmtTime(end)+"</b>")}
      ],
      dbg:{tpl:"end", h:h, m:m, dur:dur} };
  }
  if(sub==="dur"){
    const h=ri(1,10), m=ri(0,11)*5; const start=(h%12)*60+m;
    const dur=ri(4,12)*5; const end=start+dur;
    return { id:qid("time","dur",[h,m,dur]), type:"input", intOnly:true,
      text:"A dolphin show starts at <b>"+fmtTime(start)+"</b> and ends at <b>"+fmtTime(end)+"</b>.<br>How long is the show, in <b>minutes</b>?",
      ans:dur,
      model:"The show is <b>"+dur+" minutes</b> long.",
      steps:[
        {c:"Jump from the start time to the end time in easy hops.", h:(()=>{const toHour=(60-m)%60; return toHour>0&&dur>toHour?chain([{box:fmtTime(start)},{arrow:"+"+toHour+" min"},{box:fmtTime(start+toHour)},{arrow:"+"+(dur-toHour)+" min"},{box:fmtTime(end)}]):chain([{box:fmtTime(start)},{arrow:"+"+dur+" min"},{box:fmtTime(end)}]);})()},
        {c:"Add up the hops.", h:eq((()=>{const toHour=(60-m)%60; return toHour>0&&dur>toHour?toHour+" + "+(dur-toHour)+" = <b>"+dur+"</b> minutes":"<b>"+dur+"</b> minutes";})())},
        {c:"The minute hand moved "+(dur/5)+" numbers → "+(dur/5)+" × 5 = "+dur+" minutes.", h:eq((dur/5)+" × 5 = <b>"+dur+"</b>")}
      ],
      dbg:{tpl:"dur", start:start, end:end} };
  }
  if(sub==="startT"){
    const h=ri(2,10), m=ri(0,11)*5; const start=(h%12)*60+m;
    const dur=ri(4,11)*5; const end=start+dur;
    const o=mkOpts(start, [start+5, start-5, end, start-60], fmtTime);
    return { id:qid("time","startT",[h,m,dur]), type:"mcq", short:true,
      text:pick(ACTS).replace(/^./,c=>c.toUpperCase())+" <b>ends</b> at <b>"+fmtTime(end)+"</b>. It lasted <b>"+dur+" minutes</b>.<br>What time did it <b>start</b>?",
      opts:o.opts, ansIdx:o.ansIdx, ans:o.ans,
      model:"It started at <b>"+fmtTime(start)+"</b>.",
      steps:[
        {c:"This time we jump BACKWARDS from the end.", h:chain([{box:"?",miss:true},{arrow:"+"+dur+" min"},{box:fmtTime(end)}])},
        {c:"Go back "+dur+" minutes from "+fmtTime(end)+".", h:chain([{box:fmtTime(end)},{arrow:"−"+dur+" min"},{box:fmtTime(start),miss:true}])},
        {c:"Check forward: "+fmtTime(start)+" + "+dur+" min = "+fmtTime(end)+" ✓", h:eq(fmtTime(start)+" + "+dur+" = "+fmtTime(end)+" ✓")}
      ],
      dbg:{tpl:"startT", endMins:end, dur:dur} };
  }
  if(sub==="name"){
    const h=ri(1,12), m=pick([0,30]);
    const ansS = m===0 ? h+" o'clock" : "half past "+h;
    const prevH = h===1?12:h-1, nextH = h===12?1:h+1;
    const wrongs = m===0 ? ["half past "+h, prevH+" o'clock", "half past "+prevH] : [h+" o'clock", "half past "+nextH, nextH+" o'clock"];
    const opts=shuffle([ansS].concat(wrongs));
    return { id:qid("time","name",[h,m]), type:"mcq", short:true,
      text:"How do we <b>say</b> this time?",
      qvis:clockSVG(h,m),
      opts:opts, ansIdx:opts.indexOf(ansS), ans:ansS,
      model:"We say <b>"+ansS+"</b>."+(m===30?" The minute hand is at 6 — half the clock!":" The minute hand points straight up at 12."),
      steps:[
        {c:m===0?"The minute hand points to 12 → something o'clock.":"The minute hand points to 6 → half past something.", h:clockSVG(h,m,120)},
        {c:"The hour hand tells us which hour: "+h+".", h:eq("<b>"+ansS+"</b>")}
      ],
      dbg:{tpl:"name", h:h, m:m} };
  }
  const h=ri(1,11), m=ri(0,11)*5; const start=(h%12)*60+m;
  const add=pick([15,20,25,30,35,40]);
  const o=mkOpts(start+add, [start+add+5, start+add-5, start+60, start+add+10], fmtTime);
  return { id:qid("time","later",[h,m,add]), type:"mcq", short:true,
    text:"Look at the clock. What time will it be <b>"+add+" minutes later</b>?",
    qvis:clockSVG(h,m),
    opts:o.opts, ansIdx:o.ansIdx, ans:o.ans,
    model:"It will be <b>"+fmtTime(start+add)+"</b>.",
    steps:[
      {c:"The clock shows "+fmtTime(start)+".", h:clockSVG(h,m,110)},
      {c:"Jump forward "+add+" minutes.", h:chain([{box:fmtTime(start)},{arrow:"+"+add+" min"},{box:fmtTime(start+add),miss:true}])},
      {c:fmtTime(start)+" + "+add+" min = "+fmtTime(start+add)+".", h:eq(fmtTime(start)+" + "+add+" = <b>"+fmtTime(start+add)+"</b>")}
    ],
    dbg:{tpl:"later", start:start, add:add} };
}

/* ---------- Length · Mass · Volume ---------- */
const UNITQ=[
  ["the mass of a big sea turtle","kg"],
  ["the mass of one seashell","g"],
  ["the length of a pencil","cm"],
  ["the length of a swimming pool","m"],
  ["the water in a fish tank","ℓ"],
  ["the mass of a school bag","kg"],
  ["the length of a ladybug","cm"],
  ["the water in a big pail","ℓ"],
  ["the length of a bus","m"],
  ["the mass of a strawberry","g"]
];
function genMeasure(d){
  const sub=pick(["lendiff","lentotal","mass","vol","unit","cmp3"]);
  if(sub==="lendiff"){
    const m1=ri(2,4), c1=ri(1,19)*5;
    const m2=ri(1,m1-1), c2=ri(1,19)*5;
    const A=m1*100+c1, B=m2*100+c2, ans=A-B;
    return { id:qid("measure","lendiff",[m1,c1,m2,c2]), type:"input", intOnly:true,
      text:"Rope A is <b>"+m1+" m "+c1+" cm</b> long. Rope B is <b>"+m2+" m "+c2+" cm</b> long.<br>How much <b>longer</b> is Rope A than Rope B? (answer in cm)",
      ans:ans,
      model:"Rope A is <b>"+ans+" cm</b> longer than Rope B.",
      steps:[
        {c:"Change everything to cm first. Remember: 1 m = 100 cm.", h:eq("Rope A = "+m1+" m "+c1+" cm = <b>"+A+" cm</b><br>Rope B = "+m2+" m "+c2+" cm = <b>"+B+" cm</b>")},
        {c:"Draw the two ropes as bars. The difference is the extra piece.", h:bm([{name:"Rope A", segs:[{v:B,t:B+" cm",c:C1},{v:ans,t:"?",q:1}]},{name:"Rope B", segs:[{v:B,t:B+" cm",c:C3}]}])},
        {c:A+" − "+B+" = "+ans+".", h:eq(A+" − "+B+" = <b>"+ans+"</b> cm")}
      ],
      dbg:{tpl:"lendiff", m1:m1, c1:c1, m2:m2, c2:c2} };
  }
  if(sub==="lentotal"){
    const a=ri(45,180), b=ri(38,160); const ans=a+b;
    const things=pick([["ribbon","🎀"],["seaweed strip","🌿"],["paper chain","🔗"],["string","🧵"]]);
    return { id:qid("measure","lentotal",[a,b]), type:"input", intOnly:true,
      text:"One "+things[0]+" "+things[1]+" is <b>"+a+" cm</b> long. Another is <b>"+b+" cm</b> long. They are tied end to end.<br>How long are they <b>altogether</b>, in cm?",
      ans:ans,
      model:"Together they are <b>"+ans+" cm</b> long.",
      steps:[
        {c:"End to end means the bars join into one long bar.", h:bm([{name:"Total", segs:[{v:a,t:a+" cm",c:C1},{v:b,t:b+" cm",c:C3}], brace:"?"}])},
        {c:a+" + "+b+" = "+ans+".", h:eq(a+" + "+b+" = <b>"+ans+"</b> cm")}
      ],
      dbg:{tpl:"lentotal", a:a, b:b} };
  }
  if(sub==="mass"){
    let A,B; do{ A=ri(320,950); B=ri(150,A-100); }while((A%10)>=(B%10));
    const total=pick([true,false]);
    const ans= total? A+B : A-B;
    return { id:qid("measure","mass",[A,B,total?1:0]), type:"input", intOnly:true,
      text:"A crab has a mass of <b>"+A+" g</b> 🦀. A starfish has a mass of <b>"+B+" g</b> ⭐.<br>"+(total?"What is their <b>total</b> mass, in grams?":"How much <b>heavier</b> is the crab than the starfish, in grams?"),
      ans:ans,
      model: total? "Their total mass is <b>"+ans+" g</b>." : "The crab is <b>"+ans+" g</b> heavier than the starfish.",
      steps:[
        {c:"Draw the two masses as bars.", h: total
          ? bm([{name:"Crab", segs:[{v:A,t:A+" g",c:C1}]},{name:"Starfish", segs:[{v:B,t:B+" g",c:C4}]},{name:"Total", segs:[{v:ans,t:"?",q:1}]}])
          : bm([{name:"Crab", segs:[{v:B,t:B+" g",c:C1},{v:ans,t:"?",q:1}]},{name:"Starfish", segs:[{v:B,t:B+" g",c:C4}]}])},
        {c: total? "Add the two masses." : "Subtract to find the difference — mind the regrouping!", h:eq(A+(total?" + ":" − ")+B+" = <b>"+ans+"</b> g")},
        {c:"Say the answer with its unit: grams (g).", h:eq("<b>"+ans+" g</b>")}
      ],
      dbg:{tpl:"mass", A:A, B:B, total:total} };
  }
  if(sub==="vol"){
    const A=ri(24,60), B=ri(6,15), Cc=ri(5,18); const ans=A-B+Cc;
    return { id:qid("measure","vol",[A,B,Cc]), type:"input", intOnly:true,
      text:"A fish tank had <b>"+A+" ℓ</b> of water 🐠. <b>"+B+" ℓ</b> leaked out. Then <b>"+Cc+" ℓ</b> more water was poured in.<br>How much water is in the tank now, in litres?",
      ans:ans,
      model:"There are <b>"+ans+" ℓ</b> of water in the tank now.",
      steps:[
        {c:"Step 1: Some water leaked out.", h:bm([{name:"Tank", segs:[{v:A-B,t:"?",q:1},{v:B,t:B+" ℓ out",c:C2}], brace:A+" ℓ"}])+eq(A+" − "+B+" = <b>"+(A-B)+"</b> ℓ")},
        {c:"Step 2: More water was poured in.", h:bm([{name:"Tank", segs:[{v:A-B,t:(A-B)+" ℓ",c:C1},{v:Cc,t:"+"+Cc+" ℓ",c:C3}], brace:"?"}])},
        {c:(A-B)+" + "+Cc+" = "+ans+".", h:eq((A-B)+" + "+Cc+" = <b>"+ans+"</b> ℓ")}
      ],
      dbg:{tpl:"vol", A:A, B:B, C:Cc} };
  }
  if(sub==="unit"){
    const i=ri(0,UNITQ.length-1);
    const ansU=UNITQ[i][1];
    const allU=["g","kg","cm","m","ℓ"];
    const opts=shuffle([ansU].concat(shuffle(allU.filter(u=>u!==ansU)).slice(0,3)));
    return { id:qid("measure","unit",[i]), type:"mcq", short:true,
      text:"Which <b>unit</b> is best for measuring <b>"+UNITQ[i][0]+"</b>?",
      opts:opts, ansIdx:opts.indexOf(ansU), ans:ansU,
      model:"We measure "+UNITQ[i][0]+" in <b>"+ansU+"</b>.",
      steps:[
        {c:"Think: is it long or heavy or liquid? Is it big or small?", h:eq(UNITQ[i][0]+" → <b>"+ansU+"</b>")},
        {c:"Remember: g/kg for mass (light/heavy), cm/m for length (short/long), ℓ for water and liquids.", h:'<div class="cap">g = light things · kg = heavy things · cm = short · m = long · ℓ = liquids</div>'}
      ],
      dbg:{tpl:"unit", i:i} };
  }
  const creatures=shuffle([["eel","🐍"],["swordfish","🐟"],["dolphin","🐬"],["turtle","🐢"],["octopus","🐙"]]).slice(0,3);
  const vals=[];
  while(vals.length<3){ const v=ri(35,290); if(!vals.includes(v)) vals.push(v); }
  const big=pick([true,false]);
  const target= big?Math.max(...vals):Math.min(...vals);
  const ansName=creatures[vals.indexOf(target)][0];
  const opts=shuffle(creatures.map(c=>c[0]).concat(["they are the same"]));
  return { id:qid("measure","cmp3",vals.concat(big?1:0)), type:"mcq", short:true,
    text:"The "+creatures[0][0]+" "+creatures[0][1]+" is <b>"+vals[0]+" cm</b>, the "+creatures[1][0]+" "+creatures[1][1]+" is <b>"+vals[1]+" cm</b>, and the "+creatures[2][0]+" "+creatures[2][1]+" is <b>"+vals[2]+" cm</b>.<br>Which is the <b>"+(big?"longest":"shortest")+"</b>?",
    opts:opts, ansIdx:opts.indexOf(ansName), ans:ansName,
    model:"The <b>"+ansName+"</b> is the "+(big?"longest":"shortest")+" at "+target+" cm.",
    steps:[
      {c:"Draw the three lengths as bars and compare.", h:bm(creatures.map((c,i)=>({name:c[0]+" "+c[1], segs:[{v:vals[i],t:vals[i]+" cm",c:[C1,C3,C4][i]}]})))},
      {c:"Order them: "+vals.slice().sort((a,b)=>a-b).join(" cm &lt; ")+" cm.", h:eq(vals.slice().sort((a,b)=>a-b).join(" &lt; "))},
      {c:"So the "+(big?"longest":"shortest")+" is the "+ansName+".", h:eq("<b>"+ansName+"</b> — "+target+" cm")}
    ],
    dbg:{tpl:"cmp3", vals:vals, names:creatures.map(c=>c[0]), big:big} };
}

/* ---------- Fractions ---------- */
function genFrac(d){
  const sub=pick(["shade","cmp","whole","set","addlike","order"]);
  if(sub==="shade"){
    const dd=pick([2,3,4,6,8]); const s=ri(1,dd-1);
    const wrongs=[(dd-s)+"/"+dd, s+"/"+(dd+s), dd+"/"+s, (s+1)+"/"+(dd+1), (dd+s)+"/"+dd].filter(w=>w!==s+"/"+dd);
    const o=mkOpts(s+"/"+dd, wrongs, x=>String(x));
    return { id:qid("frac","shade",[dd,s]), type:"mcq", short:true,
      text:"What <b>fraction</b> of the bar is shaded?",
      qvis:fracBar(dd,s),
      opts:o.opts, ansIdx:o.ansIdx, ans:o.ans,
      model:"<b>"+s+"/"+dd+"</b> of the bar is shaded.",
      steps:[
        {c:"Count the equal parts: there are "+dd+" parts, so each part is 1/"+dd+".", h:fracBar(dd,0)},
        {c:"Count the shaded parts: "+s+" of them are shaded.", h:fracBar(dd,s)},
        {c:"So the fraction is "+s+" out of "+dd+".", h:eq("<b>"+s+"/"+dd+"</b> is shaded")}
      ],
      dbg:{tpl:"shade", d:dd, s:s} };
  }
  if(sub==="cmp"){
    let a,b; do{ a=pick([2,3,4,5,6,8,10]); b=pick([2,3,4,5,6,8,10]); }while(a===b);
    const small=Math.min(a,b);
    const opts=shuffle(["1/"+a,"1/"+b,"They are the same size","1/"+(a+b)]);
    return { id:qid("frac","cmp",[a,b]), type:"mcq", short:true,
      text:"Which fraction is <b>greater</b>: <b>1/"+a+"</b> or <b>1/"+b+"</b>?",
      opts:opts, ansIdx:opts.indexOf("1/"+small), ans:"1/"+small,
      model:"<b>1/"+small+"</b> is greater than 1/"+Math.max(a,b)+", because cutting into fewer parts makes each part bigger.",

        {c:"Put the pieces together: "+x+" + "+y+" = "+(x+y)+" pieces.", h:fracBar(dd,x+y)},
        {c:"The bottom number stays "+dd+" — the piece size never changed!", h:eq(x+"/"+dd+" + "+y+"/"+dd+" = <b>"+(x+y)+"/"+dd+"</b>")}
      ],

/* ---------- 1. Shape Pattern Sequences (Pattern Peak 🔷) ---------- */
const PAT_SHAPES=["circle","triangle","square","star","heart","diamond"];
function patToken(){ return pick(PAT_SHAPES)+"-"+ri(0,4); }
function genLPat(d){
  d=d||1;
  const kind = d<=1 ? pick(["repeat2","repeat2","rotate"]) : (d===2 ? pick(["repeat3","rotate","repeat2"]) : pick(["repeat3","rotate","grow"]));
  let unit=[], seq=[], ansKey="", optKeys=[], n0=0;
  if(kind==="repeat2" || kind==="repeat3"){
    const k=kind==="repeat2"?2:3;
    const set=new Set();
    while(set.size<k) set.add(patToken());
    unit=[...set];
    n0=k*2+ri(1,k-1); /* at least 2 full cycles shown, cut mid-cycle */
    for(let i=0;i<n0;i++) seq.push(unit[i%k]);
    ansKey=unit[n0%k];
    const others=new Set(unit.filter(u=>u!==ansKey));
    while(others.size<3){ const t=patToken(); if(t!==ansKey) others.add(t); }
    optKeys=shuffle([ansKey].concat([...others].slice(0,3)));
  } else if(kind==="rotate"){
    const start=pick([0,90,180,270]);
    n0=4;
    for(let i=0;i<n0;i++) seq.push("arr-"+((start+i*90)%360));
    ansKey="arr-"+((start+n0*90)%360);
    optKeys=shuffle(["arr-0","arr-90","arr-180","arr-270"]);
    unit=[];
    var rotStart=start;
  } else { /* grow */
    const start=ri(1,2), k=ri(1,2);
    n0=4;
    for(let i=0;i<n0;i++) seq.push("dots-"+(start+i*k));
    const ansN=start+n0*k;
    ansKey="dots-"+ansN;
    const wrongNs=new Set();
    [ansN-k, ansN+k, ansN+1, ansN-1, ansN+2, ansN-2].forEach(w=>{ if(w>0 && w<=12 && w!==ansN) wrongNs.add(w); });
    optKeys=shuffle([ansKey].concat([...wrongNs].slice(0,3).map(w=>"dots-"+w)));
    var growStart=start, growK=k;
  }
  const ansIdx=optKeys.indexOf(ansKey);
  const opts=optKeys.map(t=>shapeTile(t,60));
  let steps;
  if(kind==="rotate"){
    steps=[
      {c:"Watch the arrow — every step it makes a quarter turn (90°) clockwise.", h:patternRow(seq,true)},
      {c:"Turn the last arrow one more quarter turn…", h:patternRow([seq[n0-1],ansKey])},
      {c:"So the next arrow points like this!", h:patternRow(seq.concat([ansKey]))}
    ];
  } else if(kind==="grow"){
    steps=[
      {c:"Count the dots in each tile: "+seq.map(t=>t.split("-")[1]).join(", ")+" — they grow by "+growK+" each time!", h:patternRow(seq,true)},
      {c:"Add "+growK+" more: "+seq[n0-1].split("-")[1]+" + "+growK+" = "+ansKey.split("-")[1]+".", h:eq(seq[n0-1].split("-")[1]+" + "+growK+" = <b>"+ansKey.split("-")[1]+"</b>")},
      {c:"The finished pattern.", h:patternRow(seq.concat([ansKey]))}
    ];
  } else {
    steps=[
      {c:"Find the repeating unit — it is these "+unit.length+" shapes over and over.", h:patternRow(unit)},
      {c:"Lay the unit along the pattern. The next spot is position "+(n0%unit.length+1)+" of the unit.", h:patternRow(seq,true)},
      {c:"So the next shape is this one!", h:patternRow(seq.concat([ansKey]))}
    ];
  }
  return { id:qid("lpat",kind,seq.concat([ansKey])), type:"mcq", visOpts:true,
    text:"What comes <b>next</b> in the pattern?",
    qvis:patternRow(seq,true),
    opts:opts, ansIdx:ansIdx, ans:shapeTile(ansKey,44),
    model:"The next one is shown below — the pattern "+(kind==="rotate"?"turns 90° each time":kind==="grow"?"grows by the same amount each time":"repeats every "+unit.length+" shapes")+".<br>"+shapeTile(ansKey,52),
    steps:steps,
    dbg:{tpl:"lpat", kind:kind, unit:unit, n0:n0, seq:seq, rotStart:(typeof rotStart!=="undefined"?rotStart:null), growStart:(typeof growStart!=="undefined"?growStart:null), growK:(typeof growK!=="undefined"?growK:null), ansKey:ansKey, optKeys:optKeys} };
}

/* ---------- 2. Sea-creature Mini Sudoku (Sudoku Shoal 🧩) ---------- */
const SUD_SYMSETS=[["🐠","🐢","⭐","🦀"],["🐬","🐙","🐚","🪸"],["🐳","🦑","🫧","⭐"]];
function sudCount(cells, limit){
  const g=cells.slice();
  function ok(i,v){
    const r=Math.floor(i/4), c=i%4;
    for(let j=0;j<4;j++){ if(g[r*4+j]===v) return false; if(g[j*4+c]===v) return false; }
    const br=Math.floor(r/2)*2, bc=Math.floor(c/2)*2;
    for(let rr=br;rr<br+2;rr++) for(let cc=bc;cc<bc+2;cc++) if(g[rr*4+cc]===v) return false;
    return true;
  }
  let cnt=0;
  (function go(){
    const i=g.indexOf(0);
    if(i<0){ cnt++; return; }
    for(let v=1;v<=4;v++){
      if(ok(i,v)){ g[i]=v; go(); g[i]=0; if(cnt>=limit) return; }
    }
  })();
  return cnt;
}
function sudHint(giv){
  for(let i=0;i<16;i++){
    if(giv[i]!==0) continue;
    const r=Math.floor(i/4), c=i%4, br=Math.floor(r/2)*2, bc=Math.floor(c/2)*2;
    const used=new Set();
    for(let j=0;j<4;j++){ if(giv[r*4+j]) used.add(giv[r*4+j]); if(giv[j*4+c]) used.add(giv[j*4+c]); }
    for(let rr=br;rr<br+2;rr++) for(let cc=bc;cc<bc+2;cc++) if(giv[rr*4+cc]) used.add(giv[rr*4+cc]);
    if(used.size===3){ let v=1; while(used.has(v)) v++; return {i:i, v:v}; }
  }
  return null;
}
function genLSud(d){
  d=d||1;
  let m=[[1,2,3,4],[3,4,1,2],[2,1,4,3],[4,3,2,1]];
  const tr=x=>x[0].map((_,c)=>x.map(r=>r[c]));
  const flip=(x,i,j)=>{ const t=x[i]; x[i]=x[j]; x[j]=t; };
  if(Math.random()<0.5) flip(m,0,1);
  if(Math.random()<0.5) flip(m,2,3);
  if(Math.random()<0.5){ flip(m,0,2); flip(m,1,3); }
  m=tr(m);
  if(Math.random()<0.5) flip(m,0,1);
  if(Math.random()<0.5) flip(m,2,3);
  if(Math.random()<0.5){ flip(m,0,2); flip(m,1,3); }
  if(Math.random()<0.5) m=tr(m);
  const map=shuffle([1,2,3,4]);
  const sol=[].concat(...m).map(v=>map[v-1]);
  const target = d>=3?6 : (d===2?7:9);
  const giv=sol.slice();
  const order=shuffle([...Array(16).keys()]);
  for(const i of order){
    const count=giv.filter(x=>x!==0).length;
    if(count<=target) break;
    const keep=giv[i]; giv[i]=0;
    if(sudCount(giv,2)!==1) giv[i]=keep;
  }
  const syms=pick(SUD_SYMSETS);
  const hint=sudHint(giv);
  const steps=[
    {c:"Rule of the reef: every <b>row</b>, every <b>column</b> and every <b>2×2 box</b> must have each of the 4 friends exactly once.", h:sudMini(giv,syms,{})}
  ];
  if(hint) steps.push({c:"Start with an easy cell: in the sand-coloured spot, its row, column and box already use 3 friends — only "+syms[hint.v-1]+" is left!", h:sudMini(giv,syms,{hl:hint.i})});
  steps.push({c:"Fill one cell at a time the same way. Here is the finished puzzle — check your grid against it!", h:sudMini(sol,syms,{giv:giv})});
  return { id:qid("lsud","grid",[giv.join(""),sol.join("")]), type:"sud",
    text:"Sea-creature Sudoku! Fill the grid: every row, column and 2×2 box needs all four friends "+syms.join(" ")+".<br><span style='font-size:14px;color:var(--ink2)'>Tap an empty cell to change its creature.</span>",
    sol:sol, giv:giv, syms:syms,
    model:"Every row, column and 2×2 box has "+syms.join(" ")+" exactly once — see the finished grid in the steps below.",
    steps:steps,
    dbg:{tpl:"lsud", sol:sol, giv:giv} };
}

      qvis:scaleSVG([A], Array(b).fill(B)),

  const o=mkOpts(ans,[mm+nn, nn, ans+nn]);
  return { id:qid("lbal","chain",[mm,nn,ii]), type:"mcq", short:true,
    text:"<b>1</b> "+A+" balances <b>"+mm+"</b> "+B+". And <b>1</b> "+B+" balances <b>"+nn+"</b> "+Cc+".<br>How many "+Cc+" balance <b>1</b> "+A+"?",
    qvis:scaleSVG([A], Array(mm).fill(B))+scaleSVG([B], Array(nn).fill(Cc)),
    opts:o.opts, ansIdx:o.ansIdx, ans:o.ans,
    model:"1 "+A+" = <b>"+ans+"</b> "+Cc+". Swap the "+A+" for "+B+", then swap each "+B+" for "+Cc+"!",
    steps:[
      {c:"First swap: 1 "+A+" becomes "+mm+" "+B+".", h:scaleSVG([A], Array(mm).fill(B))},
      {c:"Second swap: EACH "+B+" becomes "+nn+" "+Cc+" — do it "+mm+" times.", h:groups(mm,nn,Cc)},
      {c:mm+" × "+nn+" = "+ans+". So 1 "+A+" balances "+ans+" "+Cc+"!", h:scaleSVG([A], Array(ans).fill(Cc))+eq(mm+" × "+nn+" = <b>"+ans+"</b>")}
    ],
    dbg:{tpl:"lbal", kind:"chain", m:mm, n:nn} };
}

/* ---------- 4. Deduction Riddles (Detective Dock 🕵️‍♀️) ---------- */
const DED_PERMS=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];
function dedSatisfy(orderNames, clue){
  const posOf={}; orderNames.forEach((n,i)=>posOf[n]=i);
  if(clue.t==="at") return posOf[clue.a]===clue.p;
  if(clue.t==="not") return posOf[clue.a]!==clue.p;
  if(clue.t==="before") return posOf[clue.a]<posOf[clue.b];
  if(clue.t==="next") return posOf[clue.b]===posOf[clue.a]+1;
  return false;
}
function dedSolutions(names, clues){
  return DED_PERMS.map(p=>p.map(i=>names[i])).filter(ord=>clues.every(c=>dedSatisfy(ord,c)));
}
function genLDed(d){
  d=d||1;
  const names=shuffle(KIDS).slice(0,3);
  const scen=pick([
    {intro:" had a sandcastle race", posN:["1st","2nd","3rd"], q:"Who came 1st, 2nd and 3rd?", before:"{a} finished before {b}", next:"{a} finished just before {b}", at:"{a} came {p}", not:"{a} did NOT come {p}", medals:["🥇","🥈","🥉"]},
    {intro:" are lining up for ice cream", posN:["1st","2nd","3rd"], q:"What is the order of the line?", before:"{a} is somewhere in front of {b}", next:"{a} is right in front of {b}", at:"{a} is {p} in line", not:"{a} is NOT {p} in line", medals:["1️⃣","2️⃣","3️⃣"]},
    {intro:" are sitting in a row of beach chairs", posN:["on the left","in the middle","on the right"], q:"Who sits where, from left to right?", before:"{a} is somewhere left of {b}", next:"{a} is right next to {b}, on {b}'s left", at:"{a} sits {p}", not:"{a} does NOT sit {p}", medals:["⬅️","🔵","➡️"]}
  ]);
  for(let attempt=0; attempt<50; attempt++){
    const order=shuffle(names.slice());
    const posOf={}; order.forEach((n,i)=>posOf[n]=i);
    const pool=[];
    names.forEach(n=>{ pool.push({t:"at", a:n, p:posOf[n]}); for(let p=0;p<3;p++) if(posOf[n]!==p) pool.push({t:"not", a:n, p:p}); });
    for(const x of names) for(const y of names) if(x!==y){
      if(posOf[x]<posOf[y]) pool.push({t:"before", a:x, b:y});
      if(posOf[y]===posOf[x]+1) pool.push({t:"next", a:x, b:y});
    }
    let cluePool;
    if(d>=2) cluePool=shuffle(pool.filter(c=>c.t!=="at")).concat(shuffle(pool.filter(c=>c.t==="at")));
    else cluePool=shuffle(pool);
    const clues=[];
    let solved=false;
    for(const c of cluePool){
      clues.push(c);
      if(dedSolutions(names,clues).length===1){ solved=true; break; }
      if(clues.length>=4) break;
    }
    if(!solved) continue;
    for(let i=clues.length-1; i>=0 && clues.length>2; i--){
      const test=clues.slice(0,i).concat(clues.slice(i+1));
      if(dedSolutions(names,test).length===1) clues.splice(i,1);
    }
    if(clues.length<2 || clues.length>3) continue;
    if(dedSolutions(names,clues).length!==1) continue;
    const clueText=c=>{
      let tmpl=scen[c.t];
      return tmpl.replace("{a}",c.a).replace(/\{b\}/g,c.b||"").replace("{p}",c.p!==undefined?scen.posN[c.p]:"");
    };
    const key=o=>o.join("|");
    const correctKey=key(order);
    const allOrds=DED_PERMS.map(p=>p.map(i=>names[i]));
    const others=shuffle(allOrds.filter(o=>key(o)!==correctKey)).slice(0,3);
    const optOrds=shuffle([order].concat(others));
    const ansIdx=optOrds.findIndex(o=>key(o)===correctKey);
    const fmtOrd=o=>o.map((n,i)=>scen.medals[i]+" "+n).join(" → ");
    const steps=[];
    let remaining=allOrds;
    clues.forEach((c,ci)=>{
      const next=remaining.filter(o=>clues.slice(0,ci+1).every(cl=>dedSatisfy(o,cl)));
      steps.push({
        c:"Clue "+(ci+1)+": <b>"+clueText(c)+"</b> — cross out every order that breaks this clue.",
        h:'<div style="text-align:center">'+remaining.map(o=>'<span class="permchip'+(next.some(x=>key(x)===key(o))?'':' out')+'">'+o.join(" → ")+'</span>').join("")+'</div>'
      });
      remaining=next;
    });
    steps.push({c:"Only one order survives all the clues — mystery solved! 🔍", h:'<div style="text-align:center"><span class="permchip win" style="font-size:18px">'+fmtOrd(order)+'</span></div>'});
    return { id:qid("lded","riddle",order.concat(clues.map(c=>c.t+(c.p!==undefined?c.p:"")+(c.a||"")+(c.b||"")))), type:"mcq",
      text:"Mystery time, detective! 🕵️‍♀️ "+names[0]+", "+names[1]+" and "+names[2]+scen.intro+".<br>"
        +clues.map((c,i)=>"Clue "+(i+1)+": <b>"+clueText(c)+"</b>").join("<br>")
        +"<br>"+scen.q,
      opts:optOrds.map(fmtOrd), ansIdx:ansIdx, ans:fmtOrd(order),
      model:"The order is <b>"+fmtOrd(order)+"</b>. Check: every clue is happy with this order!",
      steps:steps,
      dbg:{tpl:"lded", names:names, order:order, clues:clues} };
  }
  /* fallback (nearly impossible to reach): fully-told order */
  const order=shuffle(names.slice());
  const clues=[{t:"at",a:order[0],p:0},{t:"at",a:order[2],p:2}];
  const fmtOrd=o=>o.join(" → ");
  const allOrds=DED_PERMS.map(p=>p.map(i=>names[i]));
  const optOrds=shuffle([order].concat(shuffle(allOrds.filter(o=>o.join("|")!==order.join("|"))).slice(0,3)));
  return { id:qid("lded","riddle",order.concat(["fb"])), type:"mcq",
    text:names.join(", ")+" had a race. Clue 1: <b>"+order[0]+" came 1st</b>. Clue 2: <b>"+order[2]+" came 3rd</b>.<br>Who came 1st, 2nd and 3rd?",
    opts:optOrds.map(fmtOrd), ansIdx:optOrds.findIndex(o=>o.join("|")===order.join("|")), ans:fmtOrd(order),
    model:"The order is <b>"+fmtOrd(order)+"</b>.",
    steps:[
      {c:"Clue 1 fixes 1st place; Clue 2 fixes 3rd place.", h:eq(order[0]+" is 1st, "+order[2]+" is 3rd")},
      {c:"Only "+order[1]+" is left for 2nd!", h:eq("<b>"+fmtOrd(order)+"</b>")}
    ],
    dbg:{tpl:"lded", names:names, order:order, clues:clues} };
}

/* ---------- 5. Number Pyramids (Pyramid Point 🔺) ---------- */
function genLPyr(d){
  d=d||1;
  const hi = d>=3?15 : (d===2?12:9);
  const a=ri(1,hi), b=ri(1,hi), c=ri(1,hi);
  const cells=[a+2*b+c, a+b, b+c, a, b, c];
  const miss = d<=1 ? pick([0,1,2]) : pick([0,1,2,3,4,5]);
  const ans=cells[miss];
  const wrongPool=cells.filter((v,i)=>i!==miss).concat([ans+1,ans-1,ans+2]);
  const o=mkOpts(ans, shuffle(wrongPool));
  const rowOf=i=> i===0?"top":(i<3?"middle":"bottom");
  const steps=[
    {c:"Pyramid rule: every brick = the <b>sum of the two bricks below it</b>.", h:pyrSVG(["?","?","?",a,b,c],-1)},
    {c:"Fill the middle row: "+a+"+"+b+"="+(a+b)+" and "+b+"+"+c+"="+(b+c)+".", h:pyrSVG([miss===0?"?":cells[0],a+b,b+c,a,b,c], miss===0?0:-1, miss===1?1:(miss===2?2:-1))}
  ];
  if(miss===0){
    steps.push({c:"Top brick = "+(a+b)+" + "+(b+c)+" = "+ans+".", h:pyrSVG(cells,-1,0)+eq((a+b)+" + "+(b+c)+" = <b>"+ans+"</b>")});
  } else if(miss<3){
    steps.push({c:"The missing middle brick = "+(miss===1?a+" + "+b:b+" + "+c)+" = "+ans+".", h:pyrSVG(cells,-1,miss)+eq((miss===1?a+" + "+b:b+" + "+c)+" = <b>"+ans+"</b>")});
  } else {
    const known = miss===3 ? (a+b)+" − "+b : (miss===4 ? (a+b)+" − "+a : (b+c)+" − "+b);
    steps.push({c:"The missing brick is on the bottom — work BACKWARDS with subtraction: "+known+" = "+ans+".", h:pyrSVG(cells,-1,miss)+eq(known+" = <b>"+ans+"</b>")});
  }
  return { id:qid("lpyr","pyr",[a,b,c,miss]), type:"mcq", short:true,
    text:"Number pyramid! Each brick is the <b>sum of the two bricks below</b> it.<br>What number goes in the <b>?</b> brick?",
    qvis:pyrSVG(cells,miss),
    opts:o.opts, ansIdx:o.ansIdx, ans:o.ans,
    model:"The missing "+rowOf(miss)+" brick is <b>"+ans+"</b>.",
    steps:steps,
    dbg:{tpl:"lpyr", a:a, b:b, c:c, miss:miss} };
}

/* ---------- 6. Spatial: complete the picture (Tile Cove 🧭) ---------- */
function genLSpa(d){
  d=d||1;
  const v=ri(0,2);
  const mq=ri(0,3);
  const baseRot=[0,90,270,180][mq];
  const rel=shuffle([0,90,180,270]);
  const ansIdx=rel.indexOf(0);
  const opts=rel.map(r=>motifSVG(v,(baseRot+r)%360,64));
  return { id:qid("lspa","tile",[v,mq].concat(rel)), type:"mcq", visOpts:true,
    text:"One tile fell out of the picture! 🖼️ Which tile fits the empty spot <b>exactly</b>?<br><span style='font-size:14px;color:var(--ink2)'>Careful — some choices are turned the wrong way!</span>",
    qvis:mosaicSVG(v,mq),
    opts:opts, ansIdx:ansIdx, ans:motifSVG(v,baseRot,52),
    model:"The right tile is shown below — same picture, same turn direction.<br>"+motifSVG(v,baseRot,60),
    steps:[
      {c:"Look at the whole picture: the four tiles are the SAME picture, each turned a quarter more.", h:mosaicSVG(v,mq)},
      {c:"Look at the tiles beside the gap — follow how the picture turns around the centre.", h:mosaicSVG(v,-1,true)},
      {c:"So the missing tile must be turned exactly like this. The other choices are twisted the wrong way!", h:'<div style="display:flex;justify-content:center">'+motifSVG(v,baseRot,80)+'</div>'}
    ],
    dbg:{tpl:"lspa", v:v, mq:mq, rots:rel, ansIdx:ansIdx} };
}

    +'<div class="combo">'+(combo>=2&&!redo?"🔥 Combo ×"+combo:"")+'</div></div>';
  const bubbleLine = redo ? "Let's fix this shell together — you can do it this time! 💪"
    : (curTopic.logic ? pick(LOGIC_LINES)
    : (curTopic.preview ? "This is a sneak peek of P3 — take your time, hints are here to help! 🌟" : "Read carefully, then dive in! 🌊"));
  h+='<div class="guide"><div class="face">🧜‍♀️</div><div class="bubble" id="bub">'+bubbleLine+'</div></div>';
  h+='<div class="qcard"><div class="qtext">'+cur.text+'</div>';
  if(cur.qvis) h+='<div class="qvis">'+cur.qvis+'</div>';
  if(cur.hint) h+='<div class="hintbox">💡 <b>Hint:</b> '+cur.hint+'</div>';
  if(cur.type==="mcq"){
    h+='<div class="opts'+(cur.short?' short':'')+(cur.visOpts?' vis':'')+'">';
    cur.opts.forEach((o,i)=>{ h+='<button class="opt'+(cur.visOpts?' vis':'')+'" id="opt'+i+'" onclick="pickOpt('+i+')">'+o+'</button>'; });
    h+='</div>';
  } else if(cur.type==="sud"){
    curGrid=cur.giv.slice();
    h+='<div class="sud" id="sudgrid">'+sudCellsHTML()+'</div>';
    h+='<div class="inputrow" style="justify-content:center"><button class="btn" onclick="sudCheck()">Check my grid ✔</button></div>';
  } else {
    h+='<div class="inputrow"><input class="ansin" id="ansin" type="number" step="'+(cur.money?"0.01":"1")+'" inputmode="'+(cur.money?"decimal":"numeric")+'" placeholder="?">'
      +'<button class="btn" onclick="checkInput()">Check ✔</button></div>';
  }
  h+='</div><div id="fbzone"></div>';
  $("app").innerHTML=h;
  window.scrollTo(0,0);
  const inp=$("ansin");
  if(inp){ inp.addEventListener("keydown",e=>{ if(e.key==="Enter") checkInput(); }); }
}
function sudCellsHTML(showBad){
  let h="";
  for(let i=0;i<16;i++){
    const r=Math.floor(i/4), c=i%4;
    const giv=cur.giv[i]!==0;
    let cls="sudc"+(giv?" giv":"");
    if(c===1) cls+=" mr"; if(r===1) cls+=" mb";
    if(showBad && !giv && curGrid[i]!==cur.sol[i]) cls+=" bad";
    h+='<button class="'+cls+'" id="sud'+i+'" '+(giv?'disabled':'onclick="sudTap('+i+')"')+'>'+(curGrid[i]===0?"":cur.syms[curGrid[i]-1])+'</button>';
  }
  return h;
}
function sudTap(i){
  if(answered || cur.giv[i]!==0) return;
  curGrid[i]=(curGrid[i]+1)%5;
  $("sud"+i).textContent = curGrid[i]===0?"":cur.syms[curGrid[i]-1];
  sndPop();
}
function sudCheck(){
  if(answered) return;
  if(curGrid.includes(0)){
    const b=$("bub"); if(b) b.innerHTML="Some cells are still empty — tap them to add a creature! 🐠";
    sndOops();
    return;
  }
  const ok = curGrid.every((v,i)=>v===cur.sol[i]);
  const wrongN = curGrid.filter((v,i)=>v!==cur.sol[i]).length;
  if(!ok) $("sudgrid").innerHTML=sudCellsHTML(true);
  document.querySelectorAll("#sudgrid button").forEach(b=>b.disabled=true);
  finish(ok, ok?"perfect grid":wrongN+" cell"+(wrongN>1?"s":"")+" in the wrong spot");
}
function pickOpt(i){
  if(answered) return;
  const ok = i===cur.ansIdx;
  cur.opts.forEach((o,j)=>{
    const el=$("opt"+j); if(!el) return;
    el.disabled=true;
    if(j===cur.ansIdx) el.classList.add(ok&&j===i?"sel-ok":"show-ok");
    if(j===i&&!ok) el.classList.add("sel-no");
  });
  const pickText = cur.visOpts ? "choice "+(i+1) : stripTags(cur.opts[i]);
  finish(ok, pickText);
}
function checkInput(){
  if(answered) return;
  const el=$("ansin");
  const v=parseFloat(el.value);
  if(isNaN(v)){ el.focus(); return; }
  const ok=Math.abs(v-cur.ans)<0.005;
  el.disabled=true;
  el.style.borderColor= ok? "#2fae82":"#ff8a7a";
  el.style.background= ok? "#e2f7ee":"#ffece9";
  finish(ok, cur.money? "$"+v.toFixed(2) : String(v));
}
function addMistake(q, pickText){
  const ex=S.mistakes.find(m=>m.id===q.id && !m.fixed);
  if(ex){ ex.pick=pickText; ex.ts=Date.now(); return; }
  S.mistakes.unshift({id:q.id, tid:curTopic.id, q:q, pick:pickText, fixed:false, ts:Date.now()});
  if(S.mistakes.length>60){
    const fi=S.mistakes.map((m,i)=>m.fixed?i:-1).filter(i=>i>=0).pop();
    if(fi!==undefined && fi>=0) S.mistakes.splice(fi,1); else S.mistakes.pop();
  }
}
function finish(ok, pickText){
  answered=true;
  const isRedo = redoIdx>=0;
  S.totalAns++; bumpDaily();
  if(!isRedo) S.mastery[curTopic.id].t++;
  let headline;
  if(ok){
    if(isRedo){
      S.mistakes[redoIdx].fixed=true;
      S.fixedCount=(S.fixedCount||0)+1;
      S.xp+=5; bumpStreak();
      headline="🌟 Fixed! This shell is shiny again! (+5 XP)";
      sndFix(); confetti();
      speak("Fixed! "+pick(SPOKEN_PRAISE),"en-US");
    } else {
      combo++; S.mastery[curTopic.id].c++;
      const gain=10+(combo>=3?5:0);
      S.xp+=gain; bumpStreak();
      headline="✅ "+pick(PRAISE)+(combo>=3?" 🔥 Combo ×"+combo+" (+15 XP)":" (+10 XP)");
      if(combo>=3){ sndCombo(); fireworks(); } else { sndDing(); confetti(); }
      speak(pick(SPOKEN_PRAISE),"en-US");
    }
  } else {
    if(!isRedo){ combo=0; addMistake(cur, pickText); }
    headline="💙 "+pick(GENTLE);
    sndOops();
  }
  save();
  let h='<div class="fb '+(ok?"good":"oops")+'"><div class="big">'+headline+'</div>'
    +(!ok && pickText?'<div style="font-size:14px;color:#c65a4c;margin-top:4px">Your answer: '+pickText+(cur.type==="mcq"&&!cur.visOpts?' · Correct: '+stripTags(String(cur.ans)):'')+'</div>':'')
    +'</div>';
  h+='<div class="model"><span class="tag">✅ Model Answer</span>'+cur.model+'</div>';
  h+='<div class="steps"><h4>🔍 See it in pictures — tap for each step</h4><div id="steparea"></div>'
    +'<button class="btn sand" id="nsbtn" onclick="nextStep()">Next step ▶</button></div>';
  if(isRedo){
    h+='<div style="display:flex;gap:10px"><button class="btn" style="flex:1" onclick="showMistakes()">🐚 Back to shells</button>'
      +'<button class="btn ghost" onclick="showHome()">🏝️ Map</button></div>';
  } else {
    h+='<div style="display:flex;gap:10px"><button class="btn" style="flex:1" onclick="nextQ()">Next question 🌊</button>'
      +'<button class="btn ghost" onclick="showHome()">🏝️ Map</button></div>';
  }
  $("fbzone").innerHTML=h;
  nextStep();
  $("fbzone").scrollIntoView({behavior:"smooth"});
}
function nextStep(){
  if(!cur || stepIdx>=cur.steps.length) return;
  const st=cur.steps[stepIdx];
  const div=document.createElement("div");
  div.className="step";
  div.innerHTML='<div class="stepcap"><span class="no">'+(stepIdx+1)+'</span>'+st.c+'</div>'+st.h;
  $("steparea").appendChild(div);
  stepIdx++;
  if(stepIdx>=cur.steps.length){ const b=$("nsbtn"); if(b) b.style.display="none"; }
}

/* ============ 🐚 mistake shells (错题贝壳) ============ */
function showMistakes(){
  cur=null; redoIdx=-1;
  let h='<div class="backrow"><button class="btn ghost" onclick="showHome()">🏝️ Map</button>'
    +'<div class="chip">🐚 <small>Mistake Shells</small></div></div>';
  const uf=unfixedCount();
  h+='<div class="guide"><div class="face">🧜‍♀️</div><div class="bubble">'
    +(S.mistakes.length===0 ? "No shells here — your treasure box of mistakes is empty. Go make some brave tries! 🌊"
      : uf===0 ? "Every shell is polished! You fixed them all — that is TRUE reef magic ✨"
      : "Each shell is a question that tricked you before. Tap one, learn the trick, then fix it! 💪")+'</div></div>';
  if(S.mistakes.length){
    h+='<div class="mcardlist">';
    S.mistakes.forEach((m,i)=>{
      const t=TOPICS.find(x=>x.id===m.tid)||{emoji:"🐚",name:"?"};
      const snippet=stripTags(m.q.text).slice(0,90);
      h+='<button class="mcard'+(m.fixed?' fx':'')+'" onclick="showMistake('+i+')">'
        +'<span class="em">'+(m.fixed?"✨":"🐚")+'</span>'
        +'<span class="tx">'+t.emoji+' <b>'+t.name+'</b><br>'+snippet+(stripTags(m.q.text).length>90?"…":"")+'</span>'
        +'<span class="st '+(m.fixed?"done":"todo")+'">'+(m.fixed?"Fixed!":"to fix")+'</span></button>';
    });
    h+='</div>';
  }
  $("app").innerHTML=h;
  window.scrollTo(0,0);
}
function showMistake(i){
  const m=S.mistakes[i];
  const t=TOPICS.find(x=>x.id===m.tid)||{emoji:"🐚",name:"?"};
  let h='<div class="backrow"><button class="btn ghost" onclick="showMistakes()">🐚 Shells</button>'
    +'<div class="chip">'+t.emoji+' <small>'+t.name+'</small></div>'
    +(m.fixed?'<div class="chip">✨ <small>Fixed!</small></div>':'')+'</div>';
  h+='<div class="guide"><div class="face">🧜‍♀️</div><div class="bubble">First look at the model answer and the picture steps. When you feel ready, tap <b>Try again</b>! 🌟</div></div>';
  h+='<div class="qcard"><div class="qtext">'+m.q.text+'</div>';
  if(m.q.qvis) h+='<div class="qvis">'+m.q.qvis+'</div>';
  if(m.q.type==="sud" && !m.fixed) h+='<div class="cap">Your grid had a mix-up: '+m.pick+'</div>';
  else if(m.pick && !m.fixed) h+='<div class="cap">Last time you answered: <b style="color:#c65a4c">'+m.pick+'</b></div>';
  h+='</div>';
  h+='<div class="model"><span class="tag">✅ Model Answer</span>'+m.q.model+'</div>';
  h+='<div class="steps"><h4>🔍 The trick, in pictures</h4>';
  m.q.steps.forEach((st,j)=>{
    h+='<div class="step"><div class="stepcap"><span class="no">'+(j+1)+'</span>'+st.c+'</div>'+st.h+'</div>';
  });
  h+='</div>';
  h+='<div style="display:flex;gap:10px"><button class="btn coral" style="flex:1" onclick="startRedo('+i+')">'+(m.fixed?'Practise again 🔁':'Try again — fix this shell! 🔧')+'</button></div>';
  $("app").innerHTML=h;
  window.scrollTo(0,0);
}
function startRedo(i){
  const m=S.mistakes[i];
  curTopic=TOPICS.find(x=>x.id===m.tid)||TOPICS[0];
  cur=m.q; redoIdx=i;
  renderQuiz(true);
}

/* ============ confetti / fireworks ============ */
let particles=[], fxRunning=false;
function fxTick(){
  const cv=$("fx"); if(!cv) return;
  const ctx=cv.getContext("2d");
  cv.width=innerWidth; cv.height=innerHeight;
  ctx.clearRect(0,0,cv.width,cv.height);
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.life--; p.rot+=p.vr;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.globalAlpha=Math.min(1,p.life/30);
    ctx.fillStyle=p.color;
    if(p.shape==="c"){ ctx.beginPath(); ctx.arc(0,0,p.s,0,7); ctx.fill(); }
    else ctx.fillRect(-p.s,-p.s/2,p.s*2,p.s);
    ctx.restore();
  });
  if(particles.length) requestAnimationFrame(fxTick); else { fxRunning=false; ctx.clearRect(0,0,cv.width,cv.height); }
}
const FXCOLORS=["#0abab5","#81d8d0","#ff8a7a","#f4c35d","#7fd8b4","#c8a2ff"];
function burst(x,y,n,speed){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, v=(0.4+Math.random())*speed;
    particles.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,g:0.12,life:50+Math.random()*40,s:3+Math.random()*4,color:pick(FXCOLORS),rot:Math.random()*6,vr:(Math.random()-0.5)*0.3,shape:Math.random()<0.5?"c":"r"});
  }
  if(!fxRunning){ fxRunning=true; requestAnimationFrame(fxTick); }
}
function confetti(){ burst(innerWidth/2, innerHeight*0.35, 45, 4); }
function fireworks(){
  for(let k=0;k<4;k++){
    setTimeout(()=>burst(innerWidth*(0.2+Math.random()*0.6), innerHeight*(0.2+Math.random()*0.35), 60, 5.5), k*220);
  }
}

/* ============ boot ============ */
if(typeof window!=="undefined" && typeof document!=="undefined" && typeof document.getElementById==="function" && document.getElementById("app")){
  loadState(); save(); showHome();
  try{
    if(typeof speechSynthesis!=="undefined"){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
  }catch(e){}
  document.addEventListener("pointerdown", function(e){
    const b=e.target && e.target.closest ? e.target.closest("button") : null;
    if(b && !b.classList.contains("sudc")) sndPop();
  }, true);
  window.startTopic=startTopic; window.showHome=showHome; window.pickOpt=pickOpt;
  window.checkInput=checkInput; window.nextQ=nextQ; window.nextStep=nextStep;
  window.sudTap=sudTap; window.sudCheck=sudCheck; window.toggleTts=toggleTts;
  window.showMistakes=showMistakes; window.showMistake=showMistake; window.startRedo=startRedo;
}
if(typeof module!=="undefined" && module.exports){
  module.exports={TOPICS, mkOpts, fmtTime, fmtMoney, sudCount, sudHint, dedSolutions, dedSatisfy, UNITQ};
}
