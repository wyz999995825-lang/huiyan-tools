<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Jenny Story Diary</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--sky:#eef9ff;--blue:#8fd0f7;--deep:#347fa8;--ink:#17384d;--soft:#5e7d91;--paper:#fffdf8;--line:#cfe8f7;--mint:#bcebdc;--rose:#ffb8c7;--gold:#f5c96b}
body{min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,#f5fbff 0%,#e6f7ff 54%,#dff2ff 100%);font-size:17px;line-height:1.65}
#app{max-width:920px;margin:0 auto;padding:12px 12px 84px}
button,textarea,input{font:inherit}
button{border:0;cursor:pointer;min-height:44px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:7px 12px;font-weight:800;box-shadow:0 5px 16px rgba(72,150,195,.12)}
.chip small{display:block;font-size:12px;color:var(--soft);font-weight:700;line-height:1.15}
.book{background:var(--paper);border:2px solid #c7e8fa;border-radius:8px;box-shadow:0 16px 36px rgba(64,137,178,.18);overflow:hidden}
.cover{padding:18px 16px;background:linear-gradient(90deg,#dff4ff,#f4fbff 48%,#e8f8ff);border-bottom:2px solid #c7e8fa;display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center}
.badge{width:60px;height:60px;border-radius:50%;background:linear-gradient(145deg,#b7e8ff,#fff);display:flex;align-items:center;justify-content:center;font-size:34px;box-shadow:inset 0 0 0 3px #fff,0 7px 18px rgba(52,127,168,.2)}
h1{font-size:25px;line-height:1.15;color:#245f82;letter-spacing:0}
.sub{font-size:14px;color:var(--soft);font-weight:700;margin-top:3px}
.spread{display:grid;grid-template-columns:1fr;gap:0}
@media(min-width:760px){.spread{grid-template-columns:310px 1fr}.cover{grid-column:1/3}}
.left,.right{padding:16px}
.prompt{background:#f4fbff;border:1.5px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
.prompt h2{font-size:16px;color:var(--deep);margin-bottom:5px}
.starter{font-size:20px;font-weight:850;line-height:1.45;color:#234b68}
.datecard{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.datebox{background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:9px 10px;font-weight:900;color:#245f82}
.datebox small{display:block;font-size:11px;text-transform:uppercase;color:var(--soft);line-height:1.2}
.moods,.ideas,.frames{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.mood,.idea,.frame{background:#fff;border:1.5px solid #c7e8fa;border-radius:18px;padding:7px 10px;font-weight:850;color:#285a76;font-size:14px;min-height:38px}
.mood.sel,.idea.sel{background:#e7f7ff;border-color:#68bfe9;color:#1d6f97;box-shadow:0 0 0 3px rgba(143,208,247,.22)}
.frame{border-radius:8px;text-align:left}
.hint{font-size:13px;color:#4f7187;font-weight:750;line-height:1.55;margin-top:6px}
.words{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.word{border:1.5px solid #c7e8fa;background:#fff;color:#285a76;border-radius:18px;padding:7px 10px;font-weight:800;font-size:14px}
.word.used{background:#e3f8ef;border-color:#9bdcbd;color:#1c7555}
.map{display:grid;gap:8px;margin-top:12px}
.map input{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:10px;background:#fff;color:var(--ink);min-height:42px}
.map label{font-size:12px;color:var(--soft);font-weight:850;text-transform:uppercase}
textarea{width:100%;min-height:330px;resize:vertical;border:0;outline:0;background:repeating-linear-gradient(var(--paper),var(--paper) 31px,#dff0fa 32px);padding:10px 12px;font-size:18px;line-height:32px;color:var(--ink)}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0}
.check{border:1.5px solid var(--line);border-radius:8px;background:#fff;padding:8px 10px;font-weight:800;color:#8a6a1c;font-size:14px}
.check.ok{background:#e8f8ef;color:#177a55;border-color:#94dbb9}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:linear-gradient(180deg,#8fd0f7,#59addf);color:#fff;font-weight:900;border-radius:8px;padding:10px 16px;box-shadow:0 4px 0 #347fa8}
.btn:disabled{opacity:.45;filter:grayscale(.35);cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--deep);border:1.5px solid var(--line);box-shadow:none}
.btn.rose{background:linear-gradient(180deg,#ffc9d5,#ff94ad);box-shadow:0 4px 0 #d86b83}
.note{font-size:13px;color:var(--soft);font-weight:700}
.history{margin-top:14px;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:12px}
.entry{border-top:1px dashed #cfe8f7;padding:10px 0}
.entry:first-child{border-top:0}
.entry .d{font-size:12px;color:var(--soft);font-weight:900}
.entry .t{font-size:14px;white-space:pre-wrap;color:#36566a}
.stamp{display:inline-flex;align-items:center;gap:6px;background:#e8f8ef;color:#177a55;border:1.5px solid #94dbb9;border-radius:18px;padding:5px 10px;font-size:13px;font-weight:900}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const LS="jenny_story_diary_v1",DKEY="jenny_daily_v1",SUBJECT="writing";
const PROMPTS=[
{title:"The Blue Notebook",starter:"Today I found a tiny blue notebook under my desk.",words:["discovered","secret","carefully","wondered","because","suddenly","brave","promise"]},
{title:"A Rainy Recess",starter:"During recess, the rain became louder and everyone ran back inside.",words:["umbrella","slippery","shared","grateful","after","while","kind","noticed"]},
{title:"The New Girl",starter:"A new girl stood at the classroom door and held her bag tightly.",words:["nervous","welcome","smiled","invited","before","friendly","together","relieved"]},
{title:"The Missing Pencil Case",starter:"My pencil case was gone, and the bell was about to ring.",words:["searched","worried","honest","returned","then","finally","thankful","mistake"]},
{title:"The Garden Surprise",starter:"Grandma asked me to water the plants, but one pot looked different.",words:["sprout","gentle","soil","surprised","because","watched","patient","beautiful"]},
{title:"The Library Promise",starter:"I promised to return a book before the library closed.",words:["promise","responsible","hurried","shelf","when","quietly","helpful","proud"]},
{title:"The Science Fair",starter:"My project did not work at first, but I did not give up.",words:["experiment","failed","improved","explained","so","again","confident","result"]},
{title:"The Lunchbox Note",starter:"When I opened my lunchbox, I saw a note folded beside my sandwich.",words:["message","smiled","remembered","excited","after","special","shared","home"]},
{title:"The Brave Apology",starter:"I knew I had made a mistake, so I took a deep breath.",words:["sorry","truth","brave","forgive","because","better","learned","respect"]},
{title:"The Story Door",starter:"At the end of the hallway, a painted door appeared on the wall.",words:["magical","opened","whispered","adventure","suddenly","curious","sparkling","journey"]}
];
const BRIDGE_PROMPTS=[
{title:"The First P3 Challenge",starter:"When I saw the difficult question, I wanted to skip it.",words:["challenge","understood","mistake","strategy","because","although","confident","improved"]},
{title:"The Monitor's Choice",starter:"Our teacher asked me to help a classmate who kept forgetting the rules.",words:["patient","responsible","explained","fair","after","however","respect","promise"]},
{title:"The Lost Worksheet",starter:"My worksheet was missing five minutes before the lesson began.",words:["searched","realised","honest","solution","meanwhile","finally","relieved","careful"]},
{title:"The Hard Reading Passage",starter:"The passage looked long, so I read the first paragraph twice.",words:["paragraph","evidence","inferred","meaning","while","therefore","focused","proud"]},
{title:"The Group Project",starter:"Everyone in my group had a different idea for our project.",words:["discussed","disagreed","combined","result","because","instead","creative","teamwork"]},
{title:"The Kind Reminder",starter:"I noticed my friend looking upset after she made a mistake.",words:["comforted","encouraged","practice","brave","although","later","grateful","friendship"]},
{title:"The Unfinished Story",starter:"I had a good idea for a story, but I did not know how to end it.",words:["beginning","problem","solution","ending","then","suddenly","imagination","satisfied"]},
{title:"The Science Explanation",starter:"My experiment worked, but I still had to explain why it happened.",words:["observed","compared","reason","evidence","because","therefore","clear","accurate"]},
{title:"The Morning Routine",starter:"I woke up late, but I still wanted to reach school calmly.",words:["prepared","organised","hurried","decision","before","after","calm","responsible"]},
{title:"The Library Helper",starter:"A younger student could not find the book she needed.",words:["noticed","guided","shelf","thankful","while","finally","helpful","quietly"]}
];
const WEEKDAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MOODS=[
  {id:"happy",label:"happy",line:"I felt happy because something small made my day better."},
  {id:"excited",label:"excited",line:"I felt excited because I was looking forward to something."},
  {id:"proud",label:"proud",line:"I felt proud because I tried hard and did not give up."},
  {id:"nervous",label:"nervous",line:"I felt nervous at first, but I still tried."},
  {id:"grateful",label:"grateful",line:"I felt grateful because someone was kind to me."},
  {id:"calm",label:"calm",line:"I felt calm after I slowed down and thought carefully."}
];
const IDEAS=[
  {id:"friend",label:"a classmate",q:"Who did I talk to or help today?",line:"Today, something happened with my classmate."},
  {id:"lesson",label:"a lesson",q:"Which lesson made me think harder?",line:"During a lesson today, I learned something that was not easy at first."},
  {id:"recess",label:"recess",q:"What happened during recess or lunch?",line:"During recess, I noticed a small moment that I want to remember."},
  {id:"home",label:"home",q:"What happened at home?",line:"After school, something at home made me think."},
  {id:"kindness",label:"kindness",q:"Did someone show kindness?",line:"Today, I saw a kind action that made me smile."},
  {id:"mistake",label:"a mistake",q:"What mistake helped me learn?",line:"I made a small mistake today, but it taught me something useful."}
];
const FRAMES=[
  "At first, I felt ___ because ___.",
  "Then, I decided to ___.",
  "My friend/classmate told me that ___.",
  "I learned that ___ is important.",
  "Next time, I will ___."
];
function bridgeRules(){
  const d=new Date(),md=(d.getMonth()+1)*100+d.getDate();
  if(md>=914)return {name:"P3 Bridge",word:60,sent:6,unique:35,vocab:5,map:true,note:"Term 4 mode"};
  if(md>=905&&md<=913)return {name:"Holiday Bridge",word:50,sent:5,unique:30,vocab:4,map:true,note:"Holiday steady practice"};
  return {name:"P2 Finish Strong",word:45,sent:5,unique:25,vocab:4,map:false,note:"P2 consolidation"};
}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dayIndex(len){const d=new Date();return Math.floor(new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()/86400000)%len}
function load(){let s;try{s=JSON.parse(localStorage.getItem(LS))||{}}catch(e){s={}};if(!s.entries)s.entries={};if(!s.drafts)s.drafts={};if(!s.maps)s.maps={};if(!s.meta)s.meta={};return s}
function save(s){try{localStorage.setItem(LS,JSON.stringify(s))}catch(e){}}
function dailyLoad(){try{return JSON.parse(localStorage.getItem(DKEY))||{}}catch(e){return{}}}
function dailyCount(){const d=dailyLoad()[today()];return d?Math.max(0,+d[SUBJECT]||0):0}
function bumpWriting(){
  const all=dailyLoad(),t=today();
  if(!all[t])all[t]={math:0,science:0,reading:0,chinese:0,oral:0,writing:0};
  all[t][SUBJECT]=Math.max(1,+all[t][SUBJECT]||0);
  try{localStorage.setItem(DKEY,JSON.stringify(all))}catch(e){}
  syncParent();
}
function postMsg(m){try{if(window.parent&&window.parent!==window)window.parent.postMessage(m,"*")}catch(e){}}
function syncParent(){postMsg({t:"jenny_daily",subject:SUBJECT,date:today(),count:dailyCount()})}
function words(text){return (text.toLowerCase().match(/[a-z]+(?:'[a-z]+)?/g)||[])}
function sentenceCount(text){return (text.match(/[.!?]+/g)||[]).length}
function uniqueCount(list){return new Set(list).size}
function currentPrompt(){const r=bridgeRules(),arr=r.name==="P2 Finish Strong"?PROMPTS:BRIDGE_PROMPTS;return arr[dayIndex(arr.length)]}
function dateLabel(){const d=new Date();return d.toLocaleDateString("en-SG",{day:"numeric",month:"long",year:"numeric"})}
function todaysMeta(s){if(!s.meta)s.meta={};if(!s.meta[today()])s.meta[today()]={mood:"",idea:""};return s.meta[today()]}
function mapValues(){return ["m1","m2","m3","m4"].map(id=>{const el=document.getElementById(id);return el?el.value.trim():""})}
function analyse(text,prompt,rules,map){
  const ws=words(text),low=" "+text.toLowerCase()+" ";
  const used=prompt.words.filter(w=>new RegExp("\\b"+w.toLowerCase()+"\\b").test(low));
  const connectors=["because","so","then","after","before","when","while","but","finally"];
  const feelings=["happy","proud","worried","excited","surprised","nervous","grateful","relieved","sorry","confident","brave"];
  return {
    wordN:ws.length,
    sentN:sentenceCount(text),
    uniqueN:uniqueCount(ws),
    vocabN:used.length,
    used:used,
    hasConnector:connectors.some(w=>new RegExp("\\b"+w+"\\b").test(low)),
    hasFeeling:feelings.some(w=>new RegExp("\\b"+w+"\\b").test(low)),
    mapDone:!rules.map||(map||[]).every(v=>v.length>=3),
    copied:text.trim().toLowerCase()===prompt.starter.trim().toLowerCase()
  };
}
function pass(a,rules){return a.wordN>=rules.word&&a.sentN>=rules.sent&&a.uniqueN>=rules.unique&&a.vocabN>=rules.vocab&&a.hasConnector&&a.hasFeeling&&a.mapDone&&!a.copied}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function insertWord(w){const ta=document.getElementById("diary");const add=(ta.value&&/\\S$/.test(ta.value)?" ":"")+w+" ";ta.value+=add;ta.focus();onInput()}
function fillStarter(){const ta=document.getElementById("diary"),p=currentPrompt();if(!ta.value.trim())ta.value=p.starter+" ";ta.focus();onInput()}
function setMood(id){const s=load();todaysMeta(s).mood=id;save(s);render()}
function setIdea(id){const s=load();todaysMeta(s).idea=id;save(s);render()}
function chosenMood(meta){return MOODS.find(m=>m.id===meta.mood)||null}
function chosenIdea(meta){return IDEAS.find(i=>i.id===meta.idea)||null}
function useLifeStart(){
  const s=load(),meta=todaysMeta(s),m=chosenMood(meta),i=chosenIdea(meta),ta=document.getElementById("diary");
  const first=i?i.line:currentPrompt().starter;
  const second=m?m.line:"I want to remember this moment because it helped me notice my day.";
  if(!ta.value.trim())ta.value=first+" "+second+" ";
  else ta.value+=(/\\S$/.test(ta.value)?" ":"")+second+" ";
  ta.focus();onInput();
}
function insertFrame(txt){const ta=document.getElementById("diary");ta.value+=(ta.value&&/\\S$/.test(ta.value)?"\n":"")+txt+" ";ta.focus();onInput()}
function clearDraft(){const s=load();delete s.drafts[today()];delete s.maps[today()];delete s.meta[today()];save(s);render()}
function onInput(){
  const s=load(),p=currentPrompt(),r=bridgeRules(),text=document.getElementById("diary").value,map=mapValues();
  s.drafts[today()]=text;s.maps[today()]=map;save(s);
  const a=analyse(text,p,r,map);renderChecks(a,p,r);document.getElementById("saveBtn").disabled=!pass(a,r);
}
function renderChecks(a,p,r){
  p.words.forEach(w=>{const el=document.getElementById("w_"+w);if(el)el.classList.toggle("used",a.used.indexOf(w)>=0)});
  const checks=[
    ["words",a.wordN>=r.word,a.wordN+"/"+r.word+" words"],
    ["sent",a.sentN>=r.sent,a.sentN+"/"+r.sent+" sentences"],
    ["unique",a.uniqueN>=r.unique,a.uniqueN+"/"+r.unique+" different words"],
    ["vocab",a.vocabN>=r.vocab,a.vocabN+"/"+r.vocab+" diary words"],
    ["conn",a.hasConnector,"connector"],
    ["feel",a.hasFeeling,"feeling word"],
    ["map",a.mapDone,r.map?"story map":"map optional"]
  ];
  document.getElementById("checks").innerHTML=checks.map(c=>'<div class="check '+(c[1]?"ok":"")+'">'+(c[1]?"✓ ":"○ ")+c[2]+"</div>").join("");
}
function saveEntry(){
  const s=load(),p=currentPrompt(),r=bridgeRules(),text=document.getElementById("diary").value.trim(),map=mapValues(),a=analyse(text,p,r,map);
  if(!pass(a,r))return;
  s.entries[today()]={date:today(),title:p.title,level:r.name,text:text,map:map,words:a.used,time:new Date().toTimeString().slice(0,5)};
  delete s.drafts[today()];save(s);bumpWriting();render();
}
function historyHTML(s){
  const entries=Object.values(s.entries||{}).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);
  if(!entries.length)return '<div class="history"><b>Diary Pages</b><div class="note">No finished pages yet.</div></div>';
  return '<div class="history"><b>Diary Pages</b>'+entries.map(e=>'<div class="entry"><div class="d">'+esc(e.date)+" · "+esc(e.title)+'</div><div class="t">'+esc(e.text)+'</div></div>').join("")+'</div>';
}
function render(){
  const s=load(),p=currentPrompt(),r=bridgeRules(),meta=todaysMeta(s),m=chosenMood(meta),idea=chosenIdea(meta),done=!!s.entries[today()],draft=s.drafts[today()]||"",map=s.maps[today()]||["","","",""],n=dailyCount();
  document.getElementById("app").innerHTML='<div class="top"><div class="chip">✍️ Story Diary<small>English writing</small></div><div class="chip">'+(done?"✓":"○")+' Today '+n+'/1<small>daily writing</small></div></div>'
  +'<div class="book"><div class="cover"><div class="badge">🩵</div><div><h1>Jenny&apos;s Dream Blue Diary</h1><div class="sub">'+esc(p.title)+'</div></div></div>'
  +'<div class="prompt" style="margin:14px 16px 0"><h2>'+r.name+'</h2><div class="datecard"><div class="datebox"><small>Date</small>'+dateLabel()+'</div><div class="datebox"><small>Day</small>'+WEEKDAYS[new Date().getDay()]+'</div></div><div class="hint">'+r.note+' · target: '+r.word+' words, '+r.sent+' sentences, '+r.vocab+' diary words'+(r.map?', story map required':'')+'</div></div>'
  +'<div class="spread"><div class="left"><div class="prompt"><h2>How do I feel today?</h2><div class="moods">'+MOODS.map(x=>'<button class="mood '+(meta.mood===x.id?"sel":"")+'" onclick="setMood(&quot;'+x.id+'&quot;)">'+x.label+'</button>').join("")+'</div><div class="hint">'+esc(m?m.line:"Choose one feeling. It can be tiny. A normal school day is still worth writing.")+'</div></div>'
  +'<div class="prompt"><h2>What can I write about?</h2><div class="ideas">'+IDEAS.map(x=>'<button class="idea '+(meta.idea===x.id?"sel":"")+'" onclick="setIdea(&quot;'+x.id+'&quot;)">'+x.label+'</button>').join("")+'</div><div class="hint">'+esc(idea?idea.q:"Pick one small moment: a friend, a lesson, recess, home, kindness or a mistake.")+'</div><div style="margin-top:10px"><button class="btn" onclick="useLifeStart()">Help me start</button></div></div>'
  +'<div class="prompt"><h2>Story Starter</h2><div class="starter">'+esc(p.starter)+'</div><div class="words">'+p.words.map(w=>'<button class="word" id="w_'+w+'" onclick="insertWord(&quot;'+w+'&quot;)">'+w+'</button>').join("")+'</div></div>'
  +'<div class="prompt"><h2>Story Map</h2><div class="map"><label>Beginning</label><input id="m1" value="'+esc(map[0]||"")+'" placeholder="Who and where?"><label>Problem</label><input id="m2" value="'+esc(map[1]||"")+'" placeholder="What happened?"><label>Feeling</label><input id="m3" value="'+esc(map[2]||"")+'" placeholder="How did I feel?"><label>Ending</label><input id="m4" value="'+esc(map[3]||"")+'" placeholder="What changed?"></div></div></div>'
  +'<div class="right"><div class="prompt"><h2>Sentence Helpers</h2><div class="frames">'+FRAMES.map(x=>'<button class="frame" onclick="insertFrame(&quot;'+esc(x)+'&quot;)">'+esc(x)+'</button>').join("")+'</div></div><textarea id="diary" placeholder="Write a small true moment, or turn it into a story...">'+esc(done?s.entries[today()].text:draft)+'</textarea><div id="checks" class="checks"></div><div class="actions"><button class="btn" onclick="fillStarter()">Use story starter</button><button class="btn rose" id="saveBtn" onclick="saveEntry()">Finish today</button><button class="btn ghost" onclick="clearDraft()">Clear draft</button><span class="note">'+(done?'<span class="stamp">Finished today</span>':'Start with one tiny moment, then add feelings and details.')+'</span></div></div></div></div>'
  +historyHTML(s);
  document.getElementById("diary").addEventListener("input",onInput);
  ["m1","m2","m3","m4"].forEach(id=>document.getElementById(id).addEventListener("input",onInput));
  const a=analyse(document.getElementById("diary").value,p,r,mapValues());renderChecks(a,p,r);document.getElementById("saveBtn").disabled=done||!pass(a,r);
  syncParent();
}
render();
</script>
</body>
</html>
