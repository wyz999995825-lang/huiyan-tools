{tp:"量词",q:"我从图书馆借了一（　）故事书。",o:["张","支","本","块"],a:2,model:"我借了一本故事书。📖",why:"书、本子用「本」：一本书、一本作业本。"},

{tp:"近义词",q:"「仔细地看」可以说成（　）。",o:["观察","听见","休息","唱歌"],a:0,model:"我们观察小蚂蚁搬食物。🐜",why:"「观察」就是很仔细、很认真地看。"},

{tp:"反义词",q:"「冷」的反义词是（　）。",o:["凉","热","冰","雪"],a:1,model:"冬天冷，夏天热。☀️",why:"冷 ↔ 热，是一对反义词。"},

const LS_KEY="jenny_chinese_bay";
let state={xp:0,combo:0,bestCombo:0,totalCorrect:0,totalAnswered:0,passDone:{},usedQ:[],badges:{},pinyinOn:true};
try{const s=localStorage.getItem(LS_KEY);if(s)state=Object.assign(state,JSON.parse(s));}catch(e){}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}}
function addXP(n){state.xp+=n;save();updateHeader();}
function updateHeader(){
  document.getElementById("xpPill").textContent="⭐ "+state.xp;
  document.getElementById("comboPill").textContent="🔥 "+state.combo;
}
function checkBadges(){
  let newly=[];
  BADGES.forEach(b=>{if(!state.badges[b.id]&&b.check(state)){state.badges[b.id]=true;newly.push(b);}});
  if(newly.length){save();fireworks();
    setTimeout(()=>{showPopupHTML(`<div class="center"><div class="big">${newly[0].e}</div>
    <div class="word">获得新徽章！</div><div style="font-size:18px;font-weight:800;margin:8px 0;">${newly[0].n}</div>
    <div style="color:#6fa3ba;">${newly[0].desc}</div>
    <div style="margin-top:14px;"><button class="btn" onclick="closePopup()">太棒了！</button></div></div>`);},600);}
}

  <div class="brow"><div class="face">🧜‍♀️</div><div class="bubble grow">${CHEERS[Math.floor(Math.random()*CHEERS.length)]}</div></div>
  <button class="passcard" onclick="go('word')"><div class="cover">🏖️</div>
    <div class="grow"><div class="t">字词沙滩</div><div class="k">量词 · 近反义词 · 选词填空 · 读音字形（共 ${WQ.length} 题）</div></div>
    <div style="font-size:22px;">➜</div></button>
  <button class="passcard" onclick="go('read')"><div class="cover">🪸</div>
    <div class="grow"><div class="t">阅读珊瑚</div><div class="k">${PASSAGES.length} 篇小短文 · 已读完 ${readDone} 篇</div></div>
    <div style="font-size:22px;">➜</div></button>
  <div class="card"><h2>🏅 我的徽章</h2><div style="display:flex;flex-wrap:wrap;">${badgeHtml}</div></div>
  <div class="card" style="background:#fdf3dd;"><h3 style="color:#a4762a;">📊 小成绩单</h3>
  <div style="font-size:15px;line-height:1.9;color:#7c5a22;">一共答对 <b>${state.totalCorrect}</b> 题 · 最高连击 <b>${state.bestCombo}</b> 🔥 · 总星星 <b>${state.xp}</b> ⭐</div></div>`;
}
/* ============ 字词沙滩 ============ */
const ROUND=8;
let round={qs:[],idx:0,right:0,answered:false};
function pickRound(){
  let avail=WQ.map((_,i)=>i).filter(i=>!state.usedQ.includes(i));
  if(avail.length<ROUND){state.usedQ=[];avail=WQ.map((_,i)=>i);}
  for(let i=avail.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[avail[i],avail[j]]=[avail[j],avail[i]];}
  return avail.slice(0,ROUND);
}
function renderWordHome(){
  document.getElementById("view").innerHTML=`
  <div class="brow"><div class="face">🧜‍♀️</div><div class="bubble grow">欢迎来到<b>字词沙滩</b>！每一轮有 ${ROUND} 道题。答错也没关系——我每次都会给你看<b>正确的句子</b>，看多了自然就记住啦！💙</div></div>
  <div class="card center">
    <div class="big">🏖️</div>
    <h2>准备好了吗？</h2>
    <div style="color:#6fa3ba;font-size:14px;margin-bottom:14px;">题目类型：量词 · 近义词 · 反义词 · 选词填空 · 读音 · 字形</div>
    <button class="btn" onclick="startRound()">🌊 开始新一轮（${ROUND} 题）</button>
  </div>`;
}
function startRound(){
  round={qs:pickRound(),idx:0,right:0,answered:false};
  renderQ();
}
function renderQ(){
  const qi=round.qs[round.idx],q=WQ[qi];
  round.answered=false;
  let opts=q.o.map((o,i)=>`<button class="opt" id="opt${i}" onclick="answerQ(${i})">${["A","B","C","D"][i]}. ${o}</button>`).join("");
  document.getElementById("view").innerHTML=`
  <div class="backrow"><button class="btn ghost small" onclick="go('word')">← 退出本轮</button>
  <span style="float:right;font-size:14px;color:#6fa3ba;font-weight:700;">第 ${round.idx+1} / ${ROUND} 题 <span class="combo">🔥连击 ${state.combo}</span></span></div>
  <div class="progressbar"><div style="width:${(round.idx/ROUND)*100}%"></div></div>
  <div class="qbox"><span class="tag">${q.tp}</span><div class="qq">${q.q}</div>${opts}
  <div id="modelBox"></div></div>
  <div id="nextBox"></div>`;
  window.scrollTo(0,0);
}
function answerQ(i){
  if(round.answered)return;round.answered=true;
  const qi=round.qs[round.idx],q=WQ[qi];
  if(!state.usedQ.includes(qi))state.usedQ.push(qi);
  state.totalAnswered++;
  q.o.forEach((_,j)=>{
    const b=document.getElementById("opt"+j);b.disabled=true;
    if(j===q.a)b.classList.add("correct");else if(j===i)b.classList.add("wrong");
  });
  const right=i===q.a;
  let head;
  if(right){round.right++;state.combo++;state.totalCorrect++;
    if(state.combo>state.bestCombo)state.bestCombo=state.combo;
    addXP(5);miniConfetti();
    head="🌟 <b>答对啦！真棒！</b>";
  }else{state.combo=0;addXP(1);
    head="💙 <b>没关系，我们一起看看正确的说法：</b>";
  }
  document.getElementById("modelBox").innerHTML=`<div class="model">${head}<br><b>规范句子：</b>${q.model}<br><b>小提示：</b>${q.why}</div>`;
  document.getElementById("nextBox").innerHTML=`<div class="center"><button class="btn" onclick="nextQ()">${round.idx+1<ROUND?"下一题 →":"看看本轮成绩 🎉"}</button></div>`;
  save();updateHeader();
}
function nextQ(){
  round.idx++;
  if(round.idx<ROUND)renderQ();
  else{
    const r=round.right;
    let cheer=r===ROUND?"全对！你是字词沙滩的小冠军！🏆":r>=ROUND*0.7?"太厉害啦！继续保持！🌟":"每道题的规范句子你都看到啦，下一轮一定更棒！💪";
    if(r>=ROUND*0.7)fireworks();else confettiBurst();
    document.getElementById("view").innerHTML=`
    <div class="card center"><div class="big">${r===ROUND?"🏆":"🎉"}</div>
    <h2>本轮完成！</h2>
    <div style="font-size:18px;margin:10px 0;">答对 <b style="color:#1a7ea8;">${r}</b> / ${ROUND} 题</div>
    <div class="bubble" style="margin-left:0;text-align:left;">🧜‍♀️ ${cheer}</div>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px;">
      <button class="btn" onclick="startRound()">🌊 再来一轮</button>
      <button class="btn ghost" onclick="go('home')">🏝️ 回珊瑚湾</button>
    </div></div>`;
    checkBadges();
  }
  window.scrollTo(0,0);
}
/* ============ 阅读珊瑚 ============ */
function renderReadHome(){
  let h=`<div class="brow"><div class="face">🧜‍♀️</div><div class="bubble grow">这里有 ${PASSAGES.length} 篇小短文。看到<span class="vword">虚线的词</span>可以点一点，会有拼音和意思哦！</div></div>`;
  PASSAGES.forEach(p=>{
    const done=!!state.passDone[p.id];
    h+=`<button class="passcard ${done?"done":""}" onclick="openPass('${p.id}')"><div class="cover">${p.e}</div>
    <div class="grow"><div class="t">${p.t}</div><div class="k">${done?"✔ 已读完 · 可以再读一遍！":"点我开始阅读"}</div></div>
    <div style="font-size:22px;">${done?"🏅":"➜"}</div></button>`;
  });
  document.getElementById("view").innerHTML=h;
}
let passAnswered={};
function segHTML(p){
  return p.seg.map(s=>{
    const h=s[0],py=s[1],isV=s[2]===1;
    let inner=state.pinyinOn&&py?`<ruby>${h}<rt>${py}</rt></ruby>`:h;
    if(isV)return `<span class="vword" onclick="vocabTap('${p.id}','${h}')">${inner}</span>`;
    return inner;
  }).join("");
}
function openPass(id){
  const p=PASSAGES.find(x=>x.id===id);passAnswered={};
  let quiz=p.quiz.map((q,qi)=>{
    let opts=q.o.map((o,oi)=>`<button class="opt" id="pq${qi}o${oi}" onclick="passAnswer('${id}',${qi},${oi})">${o}</button>`).join("");
    return `<div class="qbox"><div class="qq" style="font-size:17px;">${qi+1}. ${q.q}</div>${opts}<div id="pq${qi}model"></div></div>`;
  }).join("");
  document.getElementById("view").innerHTML=`
  <div class="backrow"><button class="btn ghost small" onclick="go('read')">← 返回</button></div>
  <div class="card">
    <h2 style="font-size:22px;">${p.e} ${p.t}</h2>
    <div class="switchrow"><button class="switch ${state.pinyinOn?"on":""}" id="pySwitch" onclick="togglePinyin('${id}')"></button><span style="font-size:14px;font-weight:700;color:#5b8ba1;">显示拼音</span></div>
    <div class="readtext" id="passText">${segHTML(p)}</div>
  </div>
  <div class="brow"><div class="face">🧜‍♀️</div><div class="bubble grow">读完了吗？我们来做几道小题目。别担心，每题我都会给你看<b>规范答案</b>！</div></div>
  ${quiz}<div id="passDoneBox"></div>`;
  window.scrollTo(0,0);
}
function togglePinyin(id){
  state.pinyinOn=!state.pinyinOn;save();
  document.getElementById("pySwitch").classList.toggle("on",state.pinyinOn);
  document.getElementById("passText").innerHTML=segHTML(PASSAGES.find(x=>x.id===id));
}
function vocabTap(pid,w){
  const p=PASSAGES.find(x=>x.id===pid);
  const v=p.vocab.find(x=>x.w===w);
  if(!v)return;
  showPopupHTML(`<div class="word">${v.w}</div><div class="py">${v.p}</div><div class="def">${v.d}</div>
  <div style="margin-top:14px;"><button class="btn ghost small" onclick="closePopup()">知道啦</button></div>`);
}
function passAnswer(id,qi,oi){
  if(passAnswered[qi]!==undefined)return;
  const p=PASSAGES.find(x=>x.id===id),q=p.quiz[qi];
  passAnswered[qi]=oi;
  q.o.forEach((_,j)=>{
    const b=document.getElementById("pq"+qi+"o"+j);b.disabled=true;
    if(j===q.a)b.classList.add("correct");else if(j===oi)b.classList.add("wrong");
  });
  const right=oi===q.a;
  if(right){state.combo++;state.totalCorrect++;if(state.combo>state.bestCombo)state.bestCombo=state.combo;addXP(5);miniConfetti();}
  else{state.combo=0;addXP(1);}
  state.totalAnswered++;
  document.getElementById("pq"+qi+"model").innerHTML=`<div class="model">${right?"🌟 <b>答对啦！</b>":"💙 <b>没关系，看看规范答案：</b>"}<br><b>规范答案：</b>${q.model}<br><b>为什么：</b>${q.why}</div>`;
  save();updateHeader();
  if(Object.keys(passAnswered).length===p.quiz.length){
    const first=!state.passDone[id];
    state.passDone[id]=true;
    if(first)addXP(10);
    save();
    fireworks();
    document.getElementById("passDoneBox").innerHTML=`
    <div class="card center"><div class="big">🎆</div><h2>短文读完啦！</h2>
    <div style="font-size:15px;color:#6fa3ba;">${first?"+10 颗星星奖励！":"温故知新，真棒！"}</div>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px;">
    <button class="btn" onclick="go('read')">🪸 读下一篇</button>
    <button class="btn ghost" onclick="go('home')">🏝️ 回珊瑚湾</button></div></div>`;
    checkBadges();
  }
}
/* ============ 弹窗 ============ */
function showPopupHTML(h){document.getElementById("popupBox").innerHTML=h;document.getElementById("popupBg").classList.add("show");}
function closePopup(){document.getElementById("popupBg").classList.remove("show");}
/* ============ 特效 ============ */
const fxCanvas=document.getElementById("fx");
const fxCtx=fxCanvas.getContext("2d");
let parts=[],fxRunning=false;
function fxResize(){fxCanvas.width=innerWidth;fxCanvas.height=innerHeight;}
addEventListener("resize",fxResize);fxResize();
const FX_COLORS=["#4ab8d8","#ff8a7a","#ffd66b","#8fd7b8","#a5e0ef","#f7a8d8"];
function spawnConfetti(n,x,y,spread){
  for(let i=0;i<n;i++){
    parts.push({x:x??Math.random()*fxCanvas.width,y:y??-10,
      vx:(Math.random()-.5)*(spread||4),vy:Math.random()*3+2,
      s:Math.random()*7+4,c:FX_COLORS[Math.floor(Math.random()*FX_COLORS.length)],
      r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,life:140});
  }
  runFX();
}
function spawnFirework(){
  const x=Math.random()*fxCanvas.width,y=Math.random()*fxCanvas.height*.5+50;
  const c=FX_COLORS[Math.floor(Math.random()*FX_COLORS.length)];
  for(let i=0;i<28;i++){
    const a=(i/28)*Math.PI*2,sp=Math.random()*3+2;
    parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,s:4,c:c,r:0,vr:0,life:60,fw:true});
  }
}
function miniConfetti(){spawnConfetti(24,fxCanvas.width/2,fxCanvas.height*.35,8);}
function confettiBurst(){spawnConfetti(90);}
function fireworks(){
  spawnConfetti(70);
  let count=0;
  const iv=setInterval(()=>{spawnFirework();runFX();count++;if(count>5)clearInterval(iv);},350);
}
function runFX(){
  if(fxRunning)return;fxRunning=true;
  function tick(){
    fxCtx.clearRect(0,0,fxCanvas.width,fxCanvas.height);
    parts=parts.filter(p=>p.life>0&&p.y<fxCanvas.height+20);
    parts.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;if(!p.fw)p.vy+=.06;else p.vy+=.03;p.r+=p.vr;p.life--;
      fxCtx.save();fxCtx.translate(p.x,p.y);fxCtx.rotate(p.r);
      fxCtx.globalAlpha=Math.min(1,p.life/40);
      fxCtx.fillStyle=p.c;fxCtx.fillRect(-p.s/2,-p.s/2,p.s,p.s);fxCtx.restore();
    });
    if(parts.length){requestAnimationFrame(tick);}else{fxRunning=false;fxCtx.clearRect(0,0,fxCanvas.width,fxCanvas.height);}
  }
  requestAnimationFrame(tick);
}
/* ============ 启动 ============ */
updateHeader();
go("home");
</script>
</body>
