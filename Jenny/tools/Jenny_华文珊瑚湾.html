<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>华文珊瑚湾 🪸</title>
<style>
:root{
  --tiffany:#62b5e5; --tiffany-light:#aed9f7; --lagoon:#e9f4fc; --sky:#f5fafe;
  --deep:#3387c4; --sand:#fdf3dd; --coral:#ff8a7a; --card:#ffffff;
  --ink:#144644; --ink-soft:#4d7a77; --gold:#c9922e;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;
  background:linear-gradient(180deg,var(--sky),var(--lagoon) 60%,var(--sky));
  color:var(--ink); font-size:17px; padding-bottom:92px; min-height:100vh;
}
header {
  background:linear-gradient(160deg,var(--lagoon),var(--tiffany-light));
  padding:12px 14px 12px; border-radius:0 0 24px 24px;
  box-shadow:0 4px 14px rgba(10,138,134,.15);
}
.hrow { display:flex; align-items:center; gap:10px; max-width:760px; margin:0 auto; flex-wrap:wrap; }
.mermaid-big { font-size:42px; line-height:1; animation:floaty 3s ease-in-out infinite; }
.htitle { font-size:21px; font-weight:800; color:var(--deep); }
.hsub { font-size:13px; color:var(--ink-soft); margin-top:2px; }
.stats { display:flex; gap:7px; margin-left:auto; align-items:center; flex-wrap:wrap; }
.pill { background:#ffffffd9; border-radius:999px; padding:7px 11px; font-weight:800; font-size:14px; color:var(--deep); box-shadow:0 2px 6px rgba(10,138,134,.14); white-space:nowrap; display:inline-flex; align-items:center; gap:5px; }
.ringpill svg{ display:block; }
.ttsbtn { width:46px; height:46px; border-radius:50%; border:none; background:#ffffffd9; font-size:22px; cursor:pointer; box-shadow:0 2px 6px rgba(10,138,134,.16); transition:transform .15s; }
.ttsbtn:active { transform:scale(.88); }
.ttsbtn.off { opacity:.55; filter:grayscale(.6); }
nav {
  position:fixed; bottom:0; left:0; right:0; z-index:50; background:#fff;
  box-shadow:0 -4px 16px rgba(10,138,134,.16); display:flex; justify-content:space-around;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom)); border-radius:20px 20px 0 0;
}
.navbtn { border:none; background:none; font-size:12.5px; font-weight:800; color:#77a8a4; display:flex; flex-direction:column; align-items:center; gap:2px; min-width:70px; min-height:52px; justify-content:center; border-radius:14px; cursor:pointer; font-family:inherit; position:relative; transition:transform .15s; }
.navbtn:active { transform:scale(.9); }
.navbtn .ico { font-size:23px; }
.navbtn.active { color:var(--deep); background:var(--lagoon); }
.navbadge { position:absolute; top:2px; right:8px; background:var(--coral); color:#fff; border-radius:999px; min-width:19px; height:19px; font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center; padding:0 5px; box-shadow:0 1px 4px rgba(255,138,122,.5); }
main { max-width:760px; margin:0 auto; padding:14px; }
.card { background:var(--card); border-radius:18px; padding:16px; box-shadow:0 4px 14px rgba(10,138,134,.10); margin-bottom:14px; }
.bubble { background:var(--lagoon); border-radius:18px; padding:12px 15px; position:relative; font-size:16px; line-height:1.75; color:var(--ink); margin:8px 0 14px 14px; }
.bubble:before { content:""; position:absolute; left:-9px; top:16px; border:9px solid transparent; border-right-color:var(--lagoon); border-left:none; }
.brow { display:flex; align-items:flex-start; gap:4px; }
.brow .face { font-size:34px; margin-top:6px; animation:floaty 3.4s ease-in-out infinite; }
.grow { flex:1; }
h2 { color:var(--deep); font-size:19px; margin-bottom:10px; }
h3 { color:var(--deep); font-size:17px; margin-bottom:8px; }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; background:var(--tiffany); color:#fff; border:none; border-radius:16px; padding:12px 20px; font-size:16px; font-weight:800; cursor:pointer; min-height:48px; box-shadow:0 3px 10px rgba(10,186,181,.35); font-family:inherit; transition:transform .15s; }
.btn:hover { animation:wiggle .45s ease; }
.btn:active { transform:scale(.92); }
.btn.sand { background:var(--sand); color:var(--gold); box-shadow:0 3px 8px rgba(201,146,46,.2); }
.btn.ghost { background:var(--lagoon); color:var(--deep); box-shadow:none; }
.btn.coral { background:var(--coral); box-shadow:0 3px 10px rgba(255,138,122,.35); }
.btn.small { padding:8px 14px; min-height:46px; font-size:14px; }
.tag { display:inline-block; font-size:12px; font-weight:800; border-radius:999px; padding:3px 10px; margin-bottom:6px; background:var(--sand); color:var(--gold); margin-right:5px; }
.tag.blue { background:var(--lagoon); color:var(--deep); }
.qbox { background:var(--sky); border:1.5px solid var(--lagoon); border-radius:16px; padding:16px; margin-bottom:14px; }
.qq { font-weight:800; margin-bottom:12px; font-size:20px; line-height:1.8; }
.opt { display:block; width:100%; text-align:left; background:#fff; border:2px solid var(--tiffany-light); border-radius:14px; padding:12px 14px; font-size:18px; margin-bottom:8px; cursor:pointer; min-height:48px; color:var(--ink); font-family:inherit; transition:transform .12s; }
.opt:active { transform:scale(.97); }
.opt.correct { background:#d9f5e5; border-color:#5bc596; font-weight:700; animation:pop .35s ease; }
.opt.wrong { background:#ffe9e5; border-color:var(--coral); }
.model { background:#fff; border-left:5px solid var(--tiffany); border-radius:0 12px 12px 0; padding:10px 12px; margin-top:6px; font-size:16px; line-height:1.8; }
.model b { color:var(--deep); }
.readtext { font-size:18px; line-height:1.9; color:var(--ink); }
.readtext ruby rt { font-size:10px; color:#5aa39f; font-weight:400; }
.sent { border-radius:6px; cursor:pointer; transition:background .25s; }
.sent.speaking { background:#aee8e3; box-shadow:0 0 0 3px #aee8e3; }
.vword { border-bottom:2px dotted var(--tiffany); background:#cdeeea8a; border-radius:4px; padding:0 1px; cursor:pointer; }
.passcard { display:flex; gap:14px; align-items:center; background:#fff; border-radius:18px; padding:13px; box-shadow:0 4px 12px rgba(10,138,134,.10); margin-bottom:11px; cursor:pointer; border:2px solid transparent; width:100%; text-align:left; font-family:inherit; color:inherit; transition:transform .15s; }
.passcard:active { transform:scale(.97); }
.passcard.done { border-color:#8fd7b8; background:#f4fcf8; }
.passcard .cover { width:54px; height:54px; border-radius:16px; background:var(--lagoon); display:flex; align-items:center; justify-content:center; font-size:29px; flex-shrink:0; }
.passcard .t { font-weight:800; font-size:17px; }
.passcard .k { font-size:13px; color:var(--ink-soft); margin-top:3px; }
.popup-bg { position:fixed; inset:0; background:rgba(10,70,68,.45); z-index:100; display:none; align-items:center; justify-content:center; padding:20px; }
.popup-bg.show { display:flex; }
.popup { background:#fff; border-radius:20px; padding:22px; max-width:420px; width:100%; box-shadow:0 10px 40px rgba(0,0,0,.25); animation:pop .3s ease; }
.popup .word { font-size:28px; font-weight:800; color:var(--deep); }
.popup .py { font-size:17px; color:#c26a2e; font-weight:700; margin:4px 0 10px; }
.popup .def { font-size:17px; line-height:1.8; }
.progressbar { height:10px; background:var(--lagoon); border-radius:999px; overflow:hidden; margin:8px 0 14px; }
.progressbar > div { height:100%; background:linear-gradient(90deg,var(--tiffany-light),var(--tiffany)); border-radius:999px; transition:width .4s; }
.badge { display:inline-flex; flex-direction:column; align-items:center; width:76px; padding:10px 4px; background:#fff; border-radius:16px; box-shadow:0 2px 8px rgba(10,138,134,.10); margin:4px; font-size:11px; text-align:center; color:var(--ink-soft); font-weight:700; }
.badge .be { font-size:28px; }
.badge.locked { opacity:.35; filter:grayscale(1); }
.center { text-align:center; }
.big { font-size:52px; }
#fx { position:fixed; inset:0; pointer-events:none; z-index:200; }
.backrow { margin-bottom:12px; }
.combo { font-size:14px; color:#e67e22; font-weight:800; }
.switchrow { display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
.switch { position:relative; width:56px; height:33px; background:#c4e6e2; border-radius:999px; border:none; cursor:pointer; transition:background .2s; flex-shrink:0; }
.switch.on { background:var(--tiffany); }
.switch:after { content:""; position:absolute; top:3px; left:3px; width:27px; height:27px; background:#fff; border-radius:50%; transition:left .2s; box-shadow:0 1px 4px rgba(0,0,0,.2); }
.switch.on:after { left:26px; }
.mistcard { background:#fff; border-radius:16px; padding:14px; box-shadow:0 3px 10px rgba(10,138,134,.10); margin-bottom:12px; border-left:6px solid var(--coral); }
.mistcard.fixed { border-left-color:#5bc596; background:#f4fcf8; }
.chip { display:inline-block; font-size:12px; font-weight:800; border-radius:999px; padding:3px 10px; }
.chip.todo { background:#ffe9e5; color:#d05b4b; }
.chip.ok { background:#d9f5e5; color:#2b9268; }
.myans { color:#d05b4b; font-weight:700; }
.rightans { color:#2b9268; font-weight:700; }
.spkline { display:inline-flex; align-items:center; justify-content:center; border:none; background:var(--lagoon); color:var(--deep); border-radius:12px; min-width:46px; min-height:46px; font-size:19px; cursor:pointer; transition:transform .15s; }
.spkline:active { transform:scale(.88); }
@keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
@keyframes wiggle { 0%{transform:scale(1) rotate(0)} 30%{transform:scale(1.07) rotate(-2.5deg)} 60%{transform:scale(1.05) rotate(2.5deg)} 100%{transform:scale(1.04) rotate(0)} }
@keyframes pop { 0%{transform:scale(.85)} 60%{transform:scale(1.05)} 100%{transform:scale(1)} }
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="mermaid-big">🧜‍♀️</div>
    <div>
      <div class="htitle">华文珊瑚湾 🪸</div>
      <div class="hsub">Jenny 的华文小天地</div>
    </div>
    <div class="stats">
      <div class="pill ringpill" title="今日华文任务">
        <svg width="26" height="26" viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="16" fill="none" stroke="#cdeeea" stroke-width="6"/>
          <circle id="ringArc" cx="20" cy="20" r="16" fill="none" stroke="#ff8a7a" stroke-width="6" stroke-linecap="round" stroke-dasharray="100.5" stroke-dashoffset="100.5" transform="rotate(-90 20 20)"/>
        </svg>
        <span id="ringTxt">今日 0/5</span>
      </div>
      <div class="pill" id="xpPill">⭐ 0</div>
      <div class="pill" id="comboPill">🔥 0</div>
      <button class="ttsbtn" id="ttsBtn" onclick="toggleTTS()" title="朗读开关">🔊</button>
    </div>
  </div>
</header>
<main id="view"></main>
<nav>
  <button class="navbtn active" id="nav-home" onclick="go('home')"><span class="ico">🏝️</span>珊瑚湾</button>
  <button class="navbtn" id="nav-word" onclick="go('word')"><span class="ico">🏖️</span>字词沙滩</button>
  <button class="navbtn" id="nav-read" onclick="go('read')"><span class="ico">🪸</span>阅读珊瑚</button>
  <button class="navbtn" id="nav-mist" onclick="go('mist')"><span class="ico">🐚</span>错题贝壳<span class="navbadge" id="mistBadge" style="display:none;">0</span></button>
</nav>
<div class="popup-bg" id="popupBg" onclick="if(event.target===this)closePopup()">
  <div class="popup" id="popupBox"></div>
</div>
<canvas id="fx"></canvas>
<script>
"use strict";
/* ============ 字词沙滩题库（56题 · 稳定id · 新题只追加不删除） ============ */
const WQ=[
/* —— 量词 —— */
{id:"w1",tp:"量词",q:"河里有一（　）小鱼。",o:["条","只","头","张"],a:0,model:"河里有一条小鱼。🐟",why:"细长的东西（鱼、蛇、小河）常用「条」。"},
{id:"w2",tp:"量词",q:"海上开来一（　）大船。",o:["匹(pǐ)","艘(sōu)","座","把"],a:1,model:"海上开来一艘(sōu)大船。⛵",why:"船用「艘」，例如：一艘轮船、一艘小艇。"},
{id:"w3",tp:"量词",q:"花园里开了一（　）红花。",o:["朵","头","件","双"],a:0,model:"花园里开了一朵红花。🌸",why:"花用「朵」，云也可以用「朵」：一朵白云。"},
{id:"w4",tp:"量词",q:"我家有一（　）小猫。",o:["头","只","条","顶(dǐng)"],a:1,model:"我家有一只小猫。🐱",why:"小动物（猫、鸟、兔子）常用「只」。"},
{id:"w5",tp:"量词",q:"农场里有一（　）黄牛。",o:["只","匹(pǐ)","头","朵"],a:2,model:"农场里有一头黄牛。🐮",why:"大牲口（牛、猪、大象）常用「头」。"},
{id:"w6",tp:"量词",q:"下雨了，妈妈递(dì)给我一（　）雨伞。",o:["把","条","本","座"],a:0,model:"妈妈递(dì)给我一把雨伞。☔",why:"有柄可以拿的东西（伞、扇子、剪刀）用「把」。"},
{id:"w7",tp:"量词",q:"路上开过一（　）汽车。",o:["艘(sōu)","辆","匹(pǐ)","架"],a:1,model:"路上开过一辆汽车。🚗",why:"车用「辆」：一辆汽车、一辆脚踏车。"},
{id:"w8",tp:"量词",q:"我从图书馆借了一（　）故事书。",o:["张","支","本","块"],a:2,model:"我借了一本故事书。📖",why:"书、本子用「本」：一本书、一本作业本。"},
{id:"w9",tp:"量词",q:"请给我一（　）筷(kuài)子。",o:["双","只","个","条"],a:0,model:"请给我一双筷(kuài)子。🥢",why:"成对的东西用「双」：一双筷子、一双鞋。"},
{id:"w10",tp:"量词",q:"姐姐买了一（　）新衣服。",o:["条","件","顶(dǐng)","双"],a:1,model:"姐姐买了一件新衣服。👕",why:"上衣用「件」；裤子、裙子才用「条」。"},
{id:"w11",tp:"量词",q:"远处有一（　）大山。",o:["座","条","只","把"],a:0,model:"远处有一座大山。⛰️",why:"高大不动的东西（山、桥、房子）用「座」。"},
{id:"w12",tp:"量词",q:"草原上跑来一（　）白马。",o:["头","只","匹(pǐ)","艘(sōu)"],a:2,model:"草原上跑来一匹(pǐ)白马。🐴",why:"马专门用「匹」：一匹马、两匹小马。"},
/* —— 近义词 —— */
{id:"w13",tp:"近义词",q:"「高兴」的近义词是（　）。",o:["伤心","快乐","生气","害怕"],a:1,model:"收到礼物，我非常快乐。🎁",why:"「高兴」和「快乐」意思相近，都表示心情好。"},
{id:"w14",tp:"近义词",q:"「美丽」的近义词是（　）。",o:["漂亮","难看","干净","高大"],a:0,model:"公园里开满了漂亮的花。🌷",why:"「美丽」=「漂亮」，都是说很好看。"},
{id:"w15",tp:"近义词",q:"「赶快」的近义词是（　）。",o:["慢慢","连忙","休息","站住"],a:1,model:"听到铃声，我连忙跑进教室。🏃",why:"「赶快」和「连忙」都表示动作很快、不拖拉。"},
{id:"w16",tp:"近义词",q:"「仔细地看」可以说成（　）。",o:["观察(guān chá)","听见","休息","唱歌"],a:0,model:"我们观察(guān chá)小蚂蚁搬食物。🐜",why:"「观察」就是很仔细、很认真地看。"},
{id:"w17",tp:"近义词",q:"「有名」的近义词是（　）。",o:["无名","出名","名字","报名"],a:1,model:"这家面店非常出名。🍜",why:"「有名」=「出名」，就是很多人都知道。"},
/* —— 反义词 —— */
{id:"w18",tp:"反义词",q:"「高」的反义词是（　）。",o:["大","长","矮","远"],a:2,model:"哥哥长得高，弟弟长得矮。📏",why:"高 ↔ 矮，是一对反义词。"},
{id:"w19",tp:"反义词",q:"「哭」的反义词是（　）。",o:["笑","叫","说","看"],a:0,model:"妹妹不哭了，开心地笑了。😊",why:"哭 ↔ 笑，心情相反。"},
{id:"w20",tp:"反义词",q:"「冷」的反义词是（　）。",o:["凉","热","冰","雪"],a:1,model:"冬天冷，夏天热。☀️",why:"冷 ↔ 热，是一对反义词。"},
{id:"w21",tp:"反义词",q:"「安静」的反义词是（　）。",o:["热闹","干净","整齐","轻轻"],a:0,model:"图书馆很安静，市场很热闹。🏮",why:"安静 ↔ 热闹：一个没声音，一个人多声音大。"},
{id:"w22",tp:"反义词",q:"「勤劳(qín láo)」的反义词是（　）。",o:["努力","认真","懒惰(lǎn duò)","能干"],a:2,model:"小蜜蜂很勤劳，小懒猪很懒惰。🐝",why:"勤劳 ↔ 懒惰：爱做事和不爱做事。"},
/* —— 选词填空 —— */
{id:"w23",tp:"选词填空",q:"天空中（　）着朵朵白云。",o:["跑","飘","坐","躺"],a:1,model:"天空中飘着朵朵白云。☁️",why:"云很轻，在空中慢慢地动，用「飘」。"},
{id:"w24",tp:"选词填空",q:"妹妹头上（　）着一顶(dǐng)帽子。",o:["穿","拿","戴","披(pī)"],a:2,model:"妹妹头上戴着一顶帽子。👒",why:"帽子、眼镜、手表用「戴」；衣服、鞋子才用「穿」。"},
{id:"w25",tp:"选词填空",q:"我们要（　）小动物，不可以伤害它们。",o:["爱护","讨厌","害怕","打扰(dǎ rǎo)"],a:0,model:"我们要爱护小动物。🐰",why:"「爱护」就是关心和保护。"},
{id:"w26",tp:"选词填空",q:"上课时，我们要（　）听讲。",o:["马虎","认真","大声","随便"],a:1,model:"上课时，我们要认真听讲。📚",why:"「认真」表示用心、不马虎。"},
{id:"w27",tp:"选词填空",q:"弟弟（　）地爬上楼梯。",o:["慢慢","红红","高高","甜甜"],a:0,model:"弟弟慢慢地爬上楼梯。🪜",why:"小弟弟爬楼梯要小心，所以「慢慢地」爬。"},
{id:"w28",tp:"选词填空",q:"春天到了，花园里开满了（　）的花。",o:["东倒西歪(wāi)","五颜六色","又哭又笑","高高兴兴"],a:1,model:"花园里开满了五颜六色的花。🌈",why:"「五颜六色」形容颜色很多、很好看。"},
{id:"w29",tp:"选词填空",q:"图书馆里，我们说话要（　）的。",o:["轻轻","重重","快快","大大"],a:0,model:"在图书馆里，我们说话要轻轻的。🤫",why:"图书馆要保持安静，所以说话要「轻轻的」。"},
{id:"w30",tp:"选词填空",q:"妈妈把房间打扫得（　）。",o:["干干净净","歪歪扭扭(wāi wāi niǔ niǔ)","吵吵闹闹","咕咕叫"],a:0,model:"妈妈把房间打扫得干干净净。🧹",why:"打扫以后房间很干净，用「干干净净」。"},

{id:"w32",tp:"选词填空",q:"我帮奶奶（　）东西。",o:["提","踢","喝","骑(qí)"],a:0,model:"我帮奶奶提东西。🛍️",why:"用手拎着袋子，用「提」。"},

function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function getDailyAll(){let a={};try{a=JSON.parse(localStorage.getItem(DKEY))||{};}catch(e){}return a;}

/* ============ WebAudio 合成音效（无音频文件） ============ */
let AC=null;
function ac(){try{if(localStorage.getItem("jenny_tts_on")==="0")return;}catch(e){}
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
  if(AC&&AC.state==="suspended"){try{AC.resume();}catch(e){}}
  return AC;
}
function tone(freq,delay,dur,type,vol,slideTo){try{if(localStorage.getItem("jenny_tts_on")==="0")return;}catch(e){}
  const c=ac();if(!c)return;
  const t0=c.currentTime+delay;
  const o=c.createOscillator(),g=c.createGain();
  o.type=type||"sine";o.frequency.setValueAtTime(freq,t0);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||0.15,t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(c.destination);
  o.start(t0);o.stop(t0+dur+0.05);
}
function sfxTap(){tone(620,0,0.08,"sine",0.08,880);}
function sfxCorrect(){ /* 叮咚 + 小泡泡 */

}
function sfxWrong(){ /* 温柔的低音，不吓人 */

}

}

/* ============ TTS 中文朗读（Web Speech API，feature detection 保护） ============ */
let ttsOn=true;
try{ttsOn=localStorage.getItem("jenny_tts_on")!=="0";}catch(e){}
let zhVoice=null;
/* 人性化选声：给候选声音打分（Premium/Enhanced/Siri/本地/知名声音优先） */
function __voiceScore(v,pref){
  if(!v||!v.lang)return -1;
  const vl=String(v.lang).toLowerCase().replace(/_/g,'-');
  if(vl.indexOf(pref)!==0)return -1;
  const n=String(v.name||'');let s=0;
  if(/premium/i.test(n))s+=100;
  if(/enhanced|增强/i.test(n))s+=80;
  if(/siri/i.test(n))s+=70;
  if(v.localService===true)s+=40;
  if(pref==='en'){if(/\b(ava|zoe|samantha|karen|allison|susan)\b/i.test(n))s+=20;}
  else{
    if(/tingting|ting-ting|婷婷|meijia|mei-jia|美嘉|lili|丽丽|shanshan|珊珊/i.test(n))s+=20;
    if(vl.indexOf('zh-cn')===0||vl.indexOf('zh-hans')===0)s+=10;
  }
  return s;
}
function __bestVoice(vs,pref){
  let best=null,bs=-1;
  for(let i=0;i<(vs?vs.length:0);i++){const sc=__voiceScore(vs[i],pref);if(sc>bs){bs=sc;best=vs[i];}}
  return best;
}
function __humanRate(){return 0.95+(Math.random()*0.06-0.03);}
function __humanPitch(){return 1+(Math.random()*0.1-0.05);}
function pickVoice(){
  if(!("speechSynthesis" in window))return;
  try{
    const vs=speechSynthesis.getVoices();if(!vs||!vs.length)return;
    zhVoice=__bestVoice(vs,"zh");   /* 打分排序：Premium/增强 优先，zh-CN 优先但接受任何 zh */
  }catch(e){}
}
if("speechSynthesis" in window){
  pickVoice();
  try{speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}  /* iOS 声音异步加载后重新排序缓存 */
}
function cleanSpeech(t){
  return String(t).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{2B00}-\u{2BFF}]/gu,"")
    .replace(/[「」『』]/g,"").trim();
}
function speak(text,handlers){
  if(!ttsOn||!("speechSynthesis" in window))return null;
  try{
    const u=new SpeechSynthesisUtterance(cleanSpeech(text));
    if(zhVoice)u.voice=zhVoice;
    u.lang=zhVoice?zhVoice.lang:"zh-CN";
    u.rate=__humanRate();u.pitch=__humanPitch();
    if(handlers){u.onstart=handlers.onstart||null;u.onend=handlers.onend||null;u.onerror=handlers.onend||null;}
    setTimeout(function(){try{speechSynthesis.resume();}catch(e){}speechSynthesis.speak(u);},80);
    return u;
  }catch(e){return null;}
}
function stopSpeak(){
  readingAll=false;
  if("speechSynthesis" in window){try{speechSynthesis.cancel();}catch(e){}}
  document.querySelectorAll(".sent.speaking").forEach(el=>el.classList.remove("speaking"));
}

const ROUND=8;
let round={qs:[],idx:0,right:0,answered:false};
let curWordQ=null;
function pickRound(){
  let avail=WQ.map((_,i)=>i).filter(i=>!state.usedQ.includes(i));
  if(avail.length<ROUND){state.usedQ=[];avail=WQ.map((_,i)=>i);}
  for(let i=avail.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[avail[i],avail[j]]=[avail[j],avail[i]];}
  return avail.slice(0,ROUND);
}

function startRound(){

function renderQ(){
  const qi=round.qs[round.idx],q=WQ[qi];
  curWordQ=q;round.answered=false;
  let opts=q.o.map((o,i)=>`<button class="opt" id="opt${i}" onclick="answerQ(${i})">${["A","B","C","D"][i]}. ${o}</button>`).join("");
  document.getElementById("view").innerHTML=`

  <span style="float:right;font-size:14px;color:var(--ink-soft);font-weight:700;">第 ${round.idx+1} / ${ROUND} 题 <span class="combo">🔥连击 ${state.combo}</span></span></div>
  <div class="progressbar"><div style="width:${(round.idx/ROUND)*100}%"></div></div>
  <div class="qbox"><span class="tag">${q.tp}</span><div class="qq">${q.q}</div>${opts}
  <div id="modelBox"></div></div>
  <div id="nextBox"></div>`;

}
function speakCurModel(){
  if(!curWordQ)return;
  stopSpeak();speak(curWordQ.model+"。"+curWordQ.why);
}
function answerQ(i){
  if(round.answered)return;round.answered=true;
  const qi=round.qs[round.idx],q=WQ[qi];
  if(!state.usedQ.includes(qi))state.usedQ.push(qi);
  state.totalAnswered++;
  q.o.forEach((_,j)=>{
    const b=document.getElementById("opt"+j);b.disabled=true;
    if(j===q.a)b.classList.add("correct");else if(j===i)b.classList.add("wrong");
  });
  const right=i===q.a;
  let head;
  if(right){round.right++;state.combo++;state.totalCorrect++;
    if(state.combo>state.bestCombo)state.bestCombo=state.combo;
    addXP(5);miniConfetti();sfxCorrect();speakCheer();
    markFixedIfExists(q.id);
    head="🌟 <b>答对啦！真棒！</b>";
  }else{state.combo=0;addXP(1);sfxWrong();
    recordMistake(q.id,"字词",q.tp,q.q,q.o,i,q.a,q.model,q.why);
    head="💙 <b>没关系，我们一起看看正确的说法：</b>";
  }
  document.getElementById("modelBox").innerHTML=`<div class="model">${head}<br><b>规范句子：</b>${q.model} <button class="spkline" onclick="speakCurModel()" title="听规范句子">🔊</button><br><b>小提示：</b>${q.why}</div>`;

let passAnswered={},curPassId=null,readingAll=false;
function getSents(p){
  if(p._sents)return p._sents;
  const sents=[];let cur=[];
  for(let i=0;i<p.seg.length;i++){
    cur.push(p.seg[i]);
    if("。！？".includes(p.seg[i][0])){
      /* 把紧跟的下引号并入本句 */
      while(i+1<p.seg.length&&"」』".includes(p.seg[i+1][0])){cur.push(p.seg[++i]);}
      sents.push(cur);cur=[];
    }
  }
  if(cur.length)sents.push(cur);
  p._sents=sents;
  return sents;
}
function segHTML(p){
  const sents=getSents(p);
  return sents.map((sent,si)=>{
    const inner=sent.map(s=>{
      const h=s[0],py=s[1],isV=s[2]===1;
      let t=state.pinyinOn&&py?`<ruby>${h}<rt>${py}</rt></ruby>`:h;
      if(isV)return `<span class="vword" onclick="event.stopPropagation();vocabTap('${p.id}','${h}')">${t}</span>`;
      return t;
    }).join("");
    return `<span class="sent" id="sent-${si}" onclick="tapSent('${p.id}',${si})">${inner}</span>`;
  }).join("");
}
function sentText(sent){return sent.map(s=>s[0]).join("");}
function tapSent(pid,si){

function speakSent(pid,si,chain){
  const p=PASSAGES.find(x=>x.id===pid);if(!p)return;
  const sents=getSents(p);
  if(si>=sents.length){stopSpeak();return;}
  const u=speak(sentText(sents[si]),{
    onstart:()=>{
      document.querySelectorAll(".sent.speaking").forEach(x=>x.classList.remove("speaking"));
      const el=document.getElementById("sent-"+si);
      if(el){el.classList.add("speaking");}
    },
    onend:()=>{
      const el=document.getElementById("sent-"+si);
      if(el)el.classList.remove("speaking");
      if(chain&&readingAll&&currentTab==="read"&&curPassId===pid)speakSent(pid,si+1,true);

}

  const c=FX_COLORS[Math.floor(Math.random()*FX_COLORS.length)];
  for(let i=0;i<28;i++){
    const a=(i/28)*Math.PI*2,sp=Math.random()*3+2;
    parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,s:4,c:c,r:0,vr:0,life:60,fw:true});
  }
}
function miniConfetti(){spawnConfetti(24,fxCanvas.width/2,fxCanvas.height*.35,8);}
function confettiBurst(){spawnConfetti(90);}
function fireworks(){
  spawnConfetti(70);
  let count=0;
  const iv=setInterval(()=>{spawnFirework();runFX();count++;if(count>5)clearInterval(iv);},350);
}
function runFX(){
  if(fxRunning)return;fxRunning=true;
  function tick(){
    fxCtx.clearRect(0,0,fxCanvas.width,fxCanvas.height);
    parts=parts.filter(p=>p.life>0&&p.y<fxCanvas.height+20);
    parts.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;if(!p.fw)p.vy+=.06;else p.vy+=.03;p.r+=p.vr;p.life--;
      fxCtx.save();fxCtx.translate(p.x,p.y);fxCtx.rotate(p.r);
      fxCtx.globalAlpha=Math.min(1,p.life/40);
      fxCtx.fillStyle=p.c;fxCtx.fillRect(-p.s/2,-p.s/2,p.s,p.s);fxCtx.restore();
    });
    if(parts.length){requestAnimationFrame(tick);}else{fxRunning=false;fxCtx.clearRect(0,0,fxCanvas.width,fxCanvas.height);}
  }
  requestAnimationFrame(tick);
}
/* ============ 启动 ============ */
updateHeader();
renderRing();
renderTTSBtn();
updateMistBadge();
go("home");
</script>
<script>
/* ===== Jenny v3.1 桥接层（纯附加，不改任何已有存储结构） =====
   1) 今日计数芯片 + 每日目标一次性庆祝（新增键 jenny_goalcele_chinese 只存日期标记）
   2) 专注计时（番茄式）：每15分钟轻声两音+语音提醒，跟随全局静音 jenny_tts_on
   3) postMessage 桥：file:// 打开时 iframe 与合集主页的 localStorage 互相隔离，
      这里把今日计数/统计发给主页做 max 合并，保证任务清单照样打勾 */
(function(){
"use strict";
var SUBJECT="chinese", GOAL=5, ZH=true, CELE_KEY="jenny_goalcele_chinese";
function pad2(n){return (n<10?"0":"")+n}
function jToday(){var d=new Date();return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function soundOn(){return lsGet("jenny_tts_on")!=="0"}
function dailyCount(){try{var d=JSON.parse(lsGet("jenny_daily_v1"))||{};var t=d[jToday()];return t?Math.max(0,Math.floor(+t[SUBJECT]||0)):0}catch(e){return 0}}
function toolStats(){try{var S=JSON.parse(lsGet("jenny_chinese_bay"));if(!S)return null;var f=0,mi=S.mistakes||{};for(var k in mi)if(mi[k]&&mi[k].fixed)f++;return {xp:Math.max(0,+S.xp||0),correct:Math.max(0,+S.totalCorrect||0),answered:Math.max(0,+S.totalAnswered||0),fixed:f}}catch(e){return null}}
/* --- 独立小音效（全局静音同样生效） --- */
var _jac=null;
function jTone(f,at,dur,vol){if(!soundOn())return;try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!_jac)_jac=new C();if(_jac.state==="suspended")_jac.resume();var c=_jac,o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(0.0001,c.currentTime+at);g.gain.exponentialRampToValueAtTime(vol||0.12,c.currentTime+at+0.02);g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+at+dur);o.connect(g);g.connect(c.destination);o.start(c.currentTime+at);o.stop(c.currentTime+at+dur+0.06)}catch(e){}}
function jChime(){jTone(880,0,0.18);jTone(1318.5,0.16,0.3)}
function jCeleChime(){[523.25,659.25,783.99,1046.5,1318.5].forEach(function(f,i){jTone(f,i*0.09,0.28,0.13)})}
function jSpeak(text){if(!soundOn())return;try{if(!("speechSynthesis" in window))return;var u=new SpeechSynthesisUtterance(text);u.lang=ZH?"zh-CN":"en-US";try{var vs=speechSynthesis.getVoices()||[],best=null,bs=-1;for(var i=0;i<vs.length;i++){var v=vs[i];if(!v||!v.lang)continue;var vl=String(v.lang).toLowerCase();if(vl.indexOf(ZH?"zh":"en")!==0)continue;var sc=(/premium/i.test(v.name||"")?4:0)+(/enhanced|\u589e\u5f3a/i.test(v.name||"")?3:0)+(/siri/i.test(v.name||"")?2:0)+(v.localService?1:0);if(sc>bs){bs=sc;best=v}}if(ZH&&!best)return;if(best)u.voice=best}catch(e){}u.rate=0.95;u.pitch=1.05;speechSynthesis.speak(u)}catch(e){}}
function jConfetti(){try{if(typeof fireworks==="function"){fireworks();return}}catch(e){}try{if(typeof confettiBurst==="function"){confettiBurst();return}}catch(e){}try{if(typeof confetti==="function"){confetti();return}}catch(e){}try{if(typeof miniConfetti==="function")miniConfetti()}catch(e){}}
/* --- 芯片 UI（小、淡、不挡内容、不可点击） --- */
var box=null,cnt=null,tim=null;
function ensureChips(){
  if(box||typeof document==="undefined"||!document.body)return;
  try{
    var st=document.createElement("style");
    st.textContent="#jennyChips{position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;gap:6px;pointer-events:none;align-items:center}"
      +"#jennyChips .jc{background:rgba(255,255,255,.93);border:1.5px solid #9fd9d4;border-radius:999px;padding:2px 12px;font-size:12px;font-weight:800;color:#0a8a86;box-shadow:0 2px 8px rgba(10,138,134,.14);white-space:nowrap}"
      +"#jennyChips .jt{color:#7aa8a5;font-weight:650;border-color:#cfe8e5;background:rgba(255,255,255,.82)}"
      +"@keyframes jcPulse{0%{transform:scale(1)}40%{transform:scale(1.2)}100%{transform:scale(1)}}"
      +"#jennyChips .pulse{animation:jcPulse .7s ease 3}";
    document.head.appendChild(st);
    box=document.createElement("div");box.id="jennyChips";
    cnt=document.createElement("div");cnt.className="jc";
    tim=document.createElement("div");tim.className="jc jt";
    box.appendChild(cnt);box.appendChild(tim);
    document.body.appendChild(box);
  }catch(e){}
}
function pulse(el){if(!el||!el.classList)return;try{el.classList.remove("pulse");void el.offsetWidth;el.classList.add("pulse")}catch(e){}}
function chipText(n){
  if(n<GOAL)return ZH?("\ud83d\udcdd \u4eca\u65e5 "+n+"/"+GOAL):("\ud83d\udcdd Today: "+n+"/"+GOAL);
  return ZH?("\ud83c\udf1f \u76ee\u6807\u5b8c\u6210 \u00b7 \u4eca\u65e5 "+n):("\ud83c\udf1f Goal done \u00b7 "+n+" today");
}
/* --- 每日目标庆祝（同一天只放一次，标记存本工具自己的键里） --- */
function maybeCelebrate(n){
  if(n<GOAL)return;
  var t=jToday();
  if(lsGet(CELE_KEY)===t)return;
  lsSet(CELE_KEY,t);
  jCeleChime();jConfetti();pulse(cnt);
  jSpeak(ZH?"\u4eca\u65e5\u76ee\u6807\u5b8c\u6210\uff01\u4f60\u53ef\u4ee5\u7ee7\u7eed\u505a\uff0c\u8d62\u66f4\u591a\u79ef\u5206\uff01":"Daily goal complete! Keep going to earn bonus points!");
}
/* --- postMessage 同步（只在被 iframe 嵌入时发送；try/catch 保护） --- */
function postMsg(m){try{if(typeof window==="undefined"||!window.parent||window.parent===window)return;window.parent.postMessage(m,"*")}catch(e){}}
var lastDaily=-1,lastStatsStr="",lastStatsAt=0;
function syncOut(n){
  if(n!==lastDaily){lastDaily=n;postMsg({t:"jenny_daily",subject:SUBJECT,date:jToday(),count:n})}
  var st=toolStats();
  if(st){
    var s=JSON.stringify(st),now=Date.now();
    if(s!==lastStatsStr&&now-lastStatsAt>=2000){lastStatsStr=s;lastStatsAt=now;postMsg({t:"jenny_stats",subject:SUBJECT,date:jToday(),statsPatch:st})}
  }
}
/* --- 专注计时（本次打开累计，不存盘、不打扰） --- */
var t0=Date.now(),lastMile=0;
function fmtSec(s){var m=Math.floor(s/60);return pad2(m)+":"+pad2(s%60)}
function focusMsg(min){
  if(ZH){
    if(min===15)return "\u5df2\u7ecf\u4e13\u6ce815\u5206\u949f\u5566\uff0c\u4f60\u771f\u68d2\uff01\u559d\u53e3\u6c34\uff0c\u4f11\u606f\u4e00\u4e0b\u773c\u775b\u518d\u7ee7\u7eed\u5427\uff01";
    if(min===30)return "\u54c7\uff0c\u8fde\u7eed\u4e13\u6ce830\u5206\u949f\u5566\uff0c\u8d85\u7ea7\u4e86\u4e0d\u8d77\uff01\u7ad9\u8d77\u6765\u4f38\u5c55\u4e00\u4e0b\u518d\u7ee7\u7eed\u5427\uff01";
    if(min===45)return "\u4f60\u5df2\u7ecf\u4e13\u6ce845\u5206\u949f\u5566\uff0c\u662f\u4e13\u6ce8\u5c0f\u51a0\u519b\uff01\u8bb0\u5f97\u8ba9\u773c\u775b\u4f11\u606f\u4e00\u4e0b\u54e6\uff01";
    return "\u5df2\u7ecf\u4e13\u6ce8"+min+"\u5206\u949f\u5566\uff0c\u592a\u5389\u5bb3\u4e86\uff01\u4f11\u606f\u4e00\u4e0b\u518d\u7ee7\u7eed\u5427\uff01";
  }
  if(min===15)return "You have focused for 15 minutes. Amazing! Take a sip of water and keep going!";
  if(min===30)return "Wow, 30 minutes of focus! Incredible! Stand up and stretch, then keep going!";
  if(min===45)return "45 minutes of focus. You are a focus champion! Remember to rest your eyes!";
  return min+" minutes of focus. Amazing! Take a little break, then keep going!";
}
function tick(){
  ensureChips();
  var n=dailyCount();
  if(cnt)cnt.textContent=chipText(n);
  maybeCelebrate(n);
  syncOut(n);
  var sec=Math.max(0,Math.floor((Date.now()-t0)/1000));
  if(tim)tim.textContent="\u23f1 "+fmtSec(sec);
  var mile=Math.floor(sec/900);
  if(mile>lastMile){lastMile=mile;jChime();pulse(tim);jSpeak(focusMsg(mile*15))}
}
try{window.__jennyBridgeTick=tick}catch(e){}
tick();
try{setInterval(tick,1000)}catch(e){}
})();
</script>

/* iOS语音解锁：首次触摸播放一个静音utterance */
(function(){function unlock(){try{var u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u);}catch(e){}document.removeEventListener("pointerdown",unlock);}
document.addEventListener("pointerdown",unlock,{once:true});})();
