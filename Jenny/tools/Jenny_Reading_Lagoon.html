<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reading Lagoon 🐢</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  background:#f0fafd; color:#134b63; font-size:16px;
  padding-bottom:90px;
}
header {
  background:linear-gradient(160deg,#dff2f9,#a5e0ef);
  padding:16px 16px 14px; border-radius:0 0 24px 24px;
  box-shadow:0 4px 14px rgba(26,126,168,.12);
}
.hrow { display:flex; align-items:center; gap:12px; max-width:760px; margin:0 auto; }
.mermaid-big { font-size:44px; line-height:1; filter:drop-shadow(0 2px 3px rgba(26,126,168,.25)); }
.htitle { font-size:22px; font-weight:800; color:#1a7ea8; }
.hsub { font-size:13px; color:#3d7f9c; margin-top:2px; }
.stats { display:flex; gap:8px; margin-left:auto; align-items:center; }
.pill {
  background:#ffffffcc; border-radius:999px; padding:7px 12px; font-weight:700;
  font-size:14px; color:#1a7ea8; box-shadow:0 2px 6px rgba(26,126,168,.12);
  white-space:nowrap;
}
nav {
  position:fixed; bottom:0; left:0; right:0; z-index:50;
  background:#ffffff; box-shadow:0 -4px 16px rgba(26,126,168,.15);
  display:flex; justify-content:space-around; padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  border-radius:20px 20px 0 0;
}
.navbtn {
  border:none; background:none; font-size:12px; font-weight:700; color:#7aa9bd;
  display:flex; flex-direction:column; align-items:center; gap:2px;
  min-width:64px; min-height:52px; justify-content:center; border-radius:14px; cursor:pointer;
}
.navbtn .ico { font-size:24px; }
.navbtn.active { color:#1a7ea8; background:#dff2f9; }
main { max-width:760px; margin:0 auto; padding:16px; }
.card {
  background:#fff; border-radius:18px; padding:18px;
  box-shadow:0 4px 14px rgba(26,126,168,.10); margin-bottom:16px;
}
.bubble {
  background:#dff2f9; border-radius:18px; padding:12px 16px; position:relative;
  font-size:16px; line-height:1.6; color:#155e7d; margin:10px 0 16px 14px;
}
.bubble:before {
  content:""; position:absolute; left:-9px; top:16px;
  border:9px solid transparent; border-right-color:#dff2f9; border-left:none;
}
.brow { display:flex; align-items:flex-start; gap:4px; }
.brow .face { font-size:34px; margin-top:6px; }
h2 { color:#1a7ea8; font-size:19px; margin-bottom:10px; }
h3 { color:#1a7ea8; font-size:17px; margin-bottom:8px; }
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  background:#4ab8d8; color:#fff; border:none; border-radius:16px;
  padding:12px 20px; font-size:16px; font-weight:800; cursor:pointer;
  min-height:48px; box-shadow:0 3px 8px rgba(26,126,168,.25);
}
.btn:active { transform:scale(.97); }
.btn.sand { background:#fdf3dd; color:#a4762a; box-shadow:0 3px 8px rgba(190,150,60,.2); }
.btn.coral { background:#ff8a7a; }
.btn.ghost { background:#eaf6fb; color:#1a7ea8; box-shadow:none; }
.btn.small { padding:8px 14px; min-height:44px; font-size:14px; }
.artcard {
  display:flex; gap:14px; align-items:center; background:#fff; border-radius:18px;
  padding:14px; box-shadow:0 4px 12px rgba(26,126,168,.10); margin-bottom:12px;
  cursor:pointer; border:2px solid transparent; width:100%; text-align:left;
  font-family:inherit; color:inherit;
}
.artcard.done { border-color:#8fd7b8; background:#f4fcf8; }
.artcard .cover {
  width:58px; height:58px; border-radius:16px; background:#dff2f9;
  display:flex; align-items:center; justify-content:center; font-size:32px; flex-shrink:0;
}
.artcard .t { font-weight:800; font-size:16px; color:#134b63; }
.artcard .k { font-size:13px; color:#6fa3ba; margin-top:3px; }
.tag { display:inline-block; font-size:11px; font-weight:800; border-radius:999px; padding:3px 9px; margin-bottom:4px; }
.tag.fun { background:#fdf3dd; color:#a4762a; }
.tag.news { background:#e5e9fb; color:#4a5bbd; }
.readtext { font-size:18px; line-height:1.9; color:#183f52; }
.kwspan {
  border-bottom:2px dotted #4ab8d8; background:#dff2f97a; border-radius:4px;
  padding:0 2px; cursor:pointer; font-weight:600;
}
.kwspan.collected { background:#fdf3dd; border-bottom-color:#e0b25c; }
.ringwrap { position:relative; width:88px; height:88px; flex-shrink:0; }
.ringwrap svg { transform:rotate(-90deg); }
.ringlabel {
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; font-weight:800; color:#1a7ea8; font-size:15px;
}
.ringlabel small { font-weight:600; font-size:10px; color:#6fa3ba; }
.qbox { background:#f2fafd; border-radius:16px; padding:14px; margin-bottom:14px; }
.qq { font-weight:800; margin-bottom:10px; font-size:16px; }
.opt {
  display:block; width:100%; text-align:left; background:#fff; border:2px solid #cfe9f4;
  border-radius:14px; padding:12px 14px; font-size:16px; margin-bottom:8px; cursor:pointer;
  min-height:48px; color:#134b63; font-family:inherit;
}
.opt.correct { background:#d9f5e5; border-color:#5bc596; font-weight:700; }
.opt.wrong { background:#ffe9e5; border-color:#ff8a7a; }
.opt:disabled { opacity:1; }
.model {
  background:#fff; border-left:5px solid #4ab8d8; border-radius:0 12px 12px 0;
  padding:10px 12px; margin-top:6px; font-size:15px; line-height:1.6;
}
.model b { color:#1a7ea8; }
.xraybox { background:#eef7fb; border-radius:16px; padding:14px; margin:12px 0; }
.xr-sent { font-size:18px; line-height:2; margin:8px 0; }
.xr-who { background:#d6e6ff; color:#2b5bb7; border-radius:8px; padding:2px 6px; font-weight:700; }
.xr-act { background:#ffe1dc; color:#d1543f; border-radius:8px; padding:2px 6px; font-weight:700; }
.xr-rest { background:#dcf3e3; color:#237a4d; border-radius:8px; padding:2px 6px; font-weight:700; }
.xr-legend { font-size:13px; color:#5b8ba1; margin-top:6px; }
.xr-note { font-size:14px; color:#155e7d; margin-top:8px; background:#fff; border-radius:10px; padding:8px 10px; line-height:1.6; }
.popup-bg {
  position:fixed; inset:0; background:rgba(19,75,99,.45); z-index:100;
  display:none; align-items:center; justify-content:center; padding:20px;
}
.popup-bg.show { display:flex; }
.popup {
  background:#fff; border-radius:20px; padding:22px; max-width:420px; width:100%;
  box-shadow:0 10px 40px rgba(0,0,0,.25); max-height:80vh; overflow:auto;
}
.popup .word { font-size:26px; font-weight:800; color:#1a7ea8; }
.popup .cn { font-size:17px; color:#c26a2e; font-weight:700; margin:4px 0 10px; }
.popup .def { font-size:16px; line-height:1.7; }
.popup .ex { background:#f2fafd; border-radius:12px; padding:10px 12px; margin-top:10px; font-size:15px; line-height:1.7; font-style:italic; }
.chestword {
  display:flex; justify-content:space-between; align-items:center; background:#fff;
  border-radius:14px; padding:12px 14px; margin-bottom:8px; cursor:pointer;
  box-shadow:0 2px 8px rgba(26,126,168,.08); border:none; width:100%; font-family:inherit; font-size:16px;
}
.chestword .w { font-weight:800; color:#1a7ea8; font-size:17px; }
.chestword .from { font-size:12px; color:#8fb4c6; text-align:right; }
.chip {
  border:2px solid #cfe9f4; background:#fff; border-radius:16px; padding:10px 14px;
  font-size:15px; font-weight:700; color:#134b63; cursor:pointer; min-height:48px;
  display:inline-flex; align-items:center; gap:6px; font-family:inherit;
}
.chip.sel { background:#4ab8d8; color:#fff; border-color:#4ab8d8; }
.chiprow { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 16px; }
.slotopt {
  display:block; width:100%; text-align:left; background:#fff; border:2px solid #cfe9f4;
  border-radius:14px; padding:12px 14px; font-size:16px; line-height:1.6; margin-bottom:8px;
  cursor:pointer; min-height:48px; font-family:inherit; color:#134b63;
}
.slotopt:active { background:#dff2f9; }
.storysofar { background:#fdf3dd; border-radius:16px; padding:14px; font-size:17px; line-height:1.9; margin-bottom:14px; }
.mystory { background:#fff; border-radius:16px; padding:14px; margin-bottom:10px; box-shadow:0 2px 8px rgba(26,126,168,.08); }
.mystory .st { font-weight:800; color:#1a7ea8; margin-bottom:6px; }
.mystory .sx { font-size:16px; line-height:1.9; }
.progressbar { height:10px; background:#dff2f9; border-radius:999px; overflow:hidden; margin:8px 0 14px; }
.progressbar > div { height:100%; background:linear-gradient(90deg,#4ab8d8,#1a7ea8); border-radius:999px; transition:width .4s; }
.donebadge { font-size:13px; font-weight:800; color:#2e9c6b; }
.center { text-align:center; }
.big { font-size:52px; }
#fx { position:fixed; inset:0; pointer-events:none; z-index:200; }
.backrow { margin-bottom:12px; }
.hidden { display:none; }
.rowsplit { display:flex; gap:12px; align-items:center; }
.grow { flex:1; }
@media (min-width:700px){ .htitle{font-size:26px;} }
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="mermaid-big">🧜‍♀️</div>
    <div>
      <div class="htitle">Reading Lagoon 🐢</div>
      <div class="hsub">Dive into two stories every day!</div>
    </div>
    <div class="stats">
      <div class="pill" id="xpPill">⭐ 0 XP</div>
      <div class="pill" id="streakPill">🔥 0</div>
    </div>
  </div>
</header>
<main id="view"></main>
<nav>
  <button class="navbtn active" id="nav-home" onclick="go('home')"><span class="ico">🌊</span>Today</button>
  <button class="navbtn" id="nav-lib" onclick="go('lib')"><span class="ico">📚</span>Library</button>
  <button class="navbtn" id="nav-chest" onclick="go('chest')"><span class="ico">🔍</span>Word Chest</button>
  <button class="navbtn" id="nav-builder" onclick="go('builder')"><span class="ico">🧜‍♀️</span>Story Builder</button>
</nav>
<div class="popup-bg" id="popupBg" onclick="if(event.target===this)closePopup()">
  <div class="popup" id="popupBox"></div>
</div>
<canvas id="fx"></canvas>
<script>
"use strict";
/* ================= DATA: FUN STORIES ================= */
const STORIES = [
{id:"s1",t:"Toby's Big Wave",e:"🐢",
txt:`Toby the turtle lived in a calm blue {lagoon}. Every morning he watched the big kids surf the waves. "I am too small," he sighed. One day, a huge wave rolled toward the beach. Toby took a deep breath, climbed on a piece of {driftwood}, and {paddled} hard. Up, up, up he went! The wave lifted him like a feather. "Woohoo!" he shouted. He {wobbled}, he slipped, but he did not fall. When he glided back to shore, the big kids clapped their flippers. "You are small," said an old sea lion, "but your {courage} is {enormous}." Toby smiled all the way home.`,
kw:[
 {w:"lagoon",d:"a small, calm area of sea water near the beach",c:"潟湖；礁湖",ex:"The little fish like to hide in the quiet lagoon."},
 {w:"driftwood",d:"wood floating on the sea or washed up on the beach",c:"浮木",ex:"We found a long piece of driftwood on the sand."},
 {w:"paddled",d:"moved through water using arms, legs or flippers",c:"划水",ex:"The duck paddled across the pond."},
 {w:"wobbled",d:"moved from side to side in a shaky way",c:"摇晃",ex:"The jelly wobbled on the plate."},
 {w:"courage",d:"being brave even when you feel scared",c:"勇气",ex:"It takes courage to try something new."},
 {w:"enormous",d:"very, very big",c:"巨大的",ex:"The whale is an enormous animal."}],
xray:[
 {who:"Toby",act:"climbed",rest:"on a piece of driftwood.",note:"WHO did it? Toby. What was the ACTION? He climbed. WHAT did he climb on? A piece of driftwood."},
 {who:"The wave",act:"lifted",rest:"him like a feather.",note:"The wave is the WHO here — things can do actions too! The ACTION is lifted, and 'him like a feather' tells us WHAT happened."}],
quiz:[
 {q:"Where did Toby live?",o:["In a deep dark cave","In a calm blue lagoon","On a big ship","In a fish tank"],a:1,why:"The story starts: 'Toby the turtle lived in a calm blue lagoon.'"},
 {q:"Why did Toby sigh at first?",o:["He was hungry","He lost his driftwood","He thought he was too small to surf","He did not like water"],a:2,why:"Toby said 'I am too small' while watching the big kids surf."},
 {q:"How did Toby most likely feel at the end?",o:["Proud and happy","Angry","Bored","Sleepy"],a:0,why:"He smiled all the way home after everyone clapped — that shows he felt proud and happy."},
 {q:"In this story, 'enormous' means…",o:["very small","very big","very wet","very slow"],a:1,why:"The sea lion means Toby's courage is very BIG, even though his body is small."}]},
{id:"s2",t:"The Crab Who Lost His Shell",e:"🦀",
txt:`Carlo the crab woke up and — oh no! — his shell was gone. "A crab without a shell is like ice cream without a cone!" he cried. He {searched} under rocks. He {searched} in the seaweed. He asked Ollie the octopus, who was always {curious} about everything. "I saw a tiny hermit crab carrying it away," said Ollie. Carlo hurried over and found the little crab using his shell as a {cradle} for her sleepy baby snail. Carlo's heart went soft. "Keep it," he smiled. That afternoon, Ollie helped him find a new shell — bigger, rounder, and {gleaming} like a pearl. It fit perfectly.`,
kw:[
 {w:"searched",d:"looked very carefully to find something",c:"寻找",ex:"I searched everywhere for my missing sock."},
 {w:"curious",d:"wanting to know or learn about things",c:"好奇的",ex:"The curious kitten looked inside the box."},
 {w:"cradle",d:"a small bed for a baby",c:"摇篮",ex:"The baby slept softly in her cradle."},
 {w:"gleaming",d:"shining brightly",c:"闪闪发光",ex:"The clean car was gleaming in the sun."}],
xray:[
 {who:"Carlo",act:"searched",rest:"under rocks.",note:"WHO? Carlo. ACTION? Searched. WHERE did he search? Under rocks."},
 {who:"Ollie",act:"helped",rest:"him find a new shell.",note:"Ollie is the WHO, helped is the ACTION, and the rest tells us WHAT he helped to do."}],
quiz:[
 {q:"What did Carlo lose?",o:["His hat","His shell","His lunch","His friend"],a:1,why:"The first line says his shell was gone when he woke up."},
 {q:"Who told Carlo where his shell went?",o:["A sea lion","The baby snail","Ollie the octopus","A dolphin"],a:2,why:"Ollie the octopus said, 'I saw a tiny hermit crab carrying it away.'"},
 {q:"Why did Carlo let the hermit crab keep the shell?",o:["The shell was broken","He saw it was a cradle for a sleepy baby snail","He had two shells","He was scared of her"],a:1,why:"When Carlo saw the shell being used as a cradle for the baby snail, his heart went soft — he felt kind."},
 {q:"'Gleaming like a pearl' tells us the new shell was…",o:["dirty","shiny","tiny","heavy"],a:1,why:"'Gleaming' means shining brightly, so the shell was shiny like a pearl."}]},
{id:"s3",t:"Momo's Banana Plan",e:"🐒",
txt:`High on the tallest tree hung the biggest, yellowest banana Momo had ever seen. "It shall be mine!" said Momo. Plan One: jump! He jumped and missed. Plan Two: poke it with a stick! The stick was too short to {reach}. Plan Three: a monkey tower! Momo's three cousins stood on each other's shoulders. The tower {balanced}... then {toppled} into the mud with a great SPLAT. Just then, Gina the giraffe walked past. Momo had one plan left. "Excuse me, Gina," he asked {politely}, "could you help me, please?" Gina smiled, stretched her long neck, and picked the banana. It was the most {delicious} banana ever — and they shared it.`,
kw:[
 {w:"reach",d:"to stretch out and touch or get something",c:"够到",ex:"I cannot reach the top shelf."},
 {w:"balanced",d:"stayed steady without falling",c:"保持平衡",ex:"She balanced on one leg like a flamingo."},
 {w:"toppled",d:"became unsteady and fell over",c:"倒下",ex:"The tower of blocks toppled to the floor."},
 {w:"politely",d:"in a kind way, with good manners",c:"有礼貌地",ex:"He politely said thank you to the bus driver."},
 {w:"delicious",d:"very yummy to eat",c:"美味的",ex:"The mango cake was delicious."}],
xray:[
 {who:"Momo's three cousins",act:"stood",rest:"on each other's shoulders.",note:"WHO? Momo's three cousins. ACTION? Stood. WHERE? On each other's shoulders."},
 {who:"Gina",act:"picked",rest:"the banana.",note:"Gina is the WHO, picked is the ACTION, and the banana is WHAT she picked."}],
quiz:[
 {q:"What did Momo want?",o:["The biggest banana","A new stick","A tall tree","Gina's neck"],a:0,why:"The story begins with the biggest, yellowest banana Momo had ever seen — 'It shall be mine!'"},
 {q:"What happened to the monkey tower?",o:["It reached the banana","It toppled into the mud","It turned into a ladder","It flew away"],a:1,why:"The story says the tower 'toppled into the mud with a great SPLAT.'"},
 {q:"Which plan finally worked?",o:["Jumping high","Poking with a stick","Building a tower","Asking Gina politely"],a:3,why:"When Momo asked Gina politely, she stretched her long neck and picked the banana."},
 {q:"What lesson does this story teach?",o:["Never share bananas","Asking nicely for help works well","Giraffes are scary","Mud is fun"],a:1,why:"All the tricky plans failed, but asking politely for help solved the problem — and sharing made it sweeter."}]},
{id:"s4",t:"The Littlest Firefly",e:"🌟",
txt:`Faye was the littlest firefly in the meadow, and she had a funny secret: she was afraid of the dark! Every evening, when the sky turned purple, her light would {flicker} nervously. "How can a firefly fear the dark?" the crickets would {whisper}. One night, a baby beetle got lost in the long grass. "Help! I can't see!" he cried. Faye's wings trembled, but she flew into the {shadow} anyway. Her little light began to {glow} — brighter and brighter, until the whole path shone gold. The beetle followed her home safely. "You were so {brave}!" he said. Faye beamed. The dark, she discovered, was where her light shone best.`,
kw:[
 {w:"flicker",d:"to shine on and off, not steadily",c:"闪烁",ex:"The candle began to flicker in the wind."},
 {w:"whisper",d:"to speak very softly and quietly",c:"低声说",ex:"Please whisper in the library."},
 {w:"shadow",d:"a dark shape or dark place where light is blocked",c:"阴影",ex:"The tree made a cool shadow on the grass."},
 {w:"glow",d:"to give out a soft, steady light",c:"发光",ex:"The night light gives a warm glow."},
 {w:"brave",d:"not giving up even when you feel afraid",c:"勇敢的",ex:"The brave girl spoke in front of the whole class."}],
xray:[
 {who:"A baby beetle",act:"got lost",rest:"in the long grass.",note:"WHO? A baby beetle. ACTION? Got lost. WHERE? In the long grass."},
 {who:"The beetle",act:"followed",rest:"her home safely.",note:"The beetle is the WHO, followed is the ACTION, and 'her home safely' tells us where and how."}],
quiz:[
 {q:"What was Faye's funny secret?",o:["She could not fly","She was afraid of the dark","She had no light","She loved crickets"],a:1,why:"The story says she had a funny secret: she was afraid of the dark!"},
 {q:"Who needed help in the story?",o:["A cricket","A baby beetle","Faye's mother","A moth"],a:1,why:"A baby beetle got lost in the long grass and cried, 'Help! I can't see!'"},
 {q:"What did Faye discover at the end?",o:["The dark was where her light shone best","Beetles cannot walk","Crickets sing badly","The grass was short"],a:0,why:"The last line says the dark was where her light shone best."},
 {q:"In the story, 'flicker' means her light…",o:["turned red","went on and off","became a star","made a sound"],a:1,why:"Flicker means to shine on and off, not steadily — her light flickered because she was nervous."}]},
{id:"s5",t:"Captain Whiskers and the Missing Sock",e:"🐱",
txt:`Captain Whiskers was a house cat who believed he was a pirate. His ship was the sofa. His {crew} was one goldfish and two dust bunnies. One morning, disaster struck: Grandpa's favourite red sock had vanished! "All paws on deck!" meowed the Captain. "We must find the {treasure}!" He {sniffed} behind the curtains. Nothing. He peeked into the laundry basket. Only boring blue socks. Then he heard a {giggle} from the garden. There was Biscuit the puppy, wearing the red sock — on his ear, like a floppy hat! Grandpa laughed so hard he cried. "Welcome {aboard}, Biscuit," said Captain Whiskers. "Every pirate ship needs a silly first mate."`,
kw:[
 {w:"crew",d:"the team that works on a ship",c:"船员；团队",ex:"The captain thanked his crew for their hard work."},
 {w:"treasure",d:"something very special and valuable",c:"宝藏",ex:"The pirates buried their treasure on the island."},
 {w:"sniffed",d:"smelled something by breathing in through the nose",c:"嗅；闻",ex:"The dog sniffed the yummy bread."},
 {w:"giggle",d:"a small, silly laugh",c:"咯咯笑",ex:"The joke made everyone giggle."},
 {w:"aboard",d:"on a ship, train or plane",c:"上船；登上",ex:"The sailors climbed aboard the boat."}],
xray:[
 {who:"He",act:"peeked",rest:"into the laundry basket.",note:"WHO? He (Captain Whiskers). ACTION? Peeked. WHERE? Into the laundry basket."},
 {who:"Biscuit the puppy",act:"was wearing",rest:"the red sock on his ear.",note:"Biscuit is the WHO, was wearing is the ACTION, and the red sock is WHAT he wore."}],
quiz:[
 {q:"What did Captain Whiskers think he was?",o:["A doctor","A pirate","A chef","A teacher"],a:1,why:"The story says he was a house cat who believed he was a pirate."},
 {q:"What was the missing 'treasure'?",o:["A gold coin","Grandpa's red sock","A fish bone","A blue hat"],a:1,why:"Grandpa's favourite red sock had vanished, and the Captain called it the treasure."},
 {q:"Where was the sock found?",o:["Behind the curtains","In the laundry basket","On Biscuit's ear","Under the sofa"],a:2,why:"Biscuit the puppy was wearing the red sock on his ear, like a floppy hat!"},
 {q:"How do we know Grandpa was not angry?",o:["He hid the sock","He laughed so hard he cried","He walked away","He bought new socks"],a:1,why:"Laughing so hard he cried shows Grandpa found it funny, not upsetting."}]},
{id:"s6",t:"The Upside-Down Penguin",e:"🐧",
txt:`Pip the penguin did everything upside-down. He slid down icy hills on his head. He ate fish flapping his feet in the air. The other penguins {tumbled} about laughing. "Pip, you silly bird!" At the Great Ice Games, every penguin lined up for the {slippery} slide race. Whoosh! Off they went on their tummies. But halfway down, Pip hit a bump, flipped over, and finished the race sliding on his head — beak-first through the finish line! The crowd {cheered} louder than ever. The judges gave Pip a shiny medal that read: "Most {creative} Slider." Pip felt very {proud}. He wore the medal upside-down, of course.`,
kw:[
 {w:"tumbled",d:"fell or rolled over and over",c:"翻滚；跌倒",ex:"The puppies tumbled around on the grass."},

{id:"n6",t:"Why We Love Hawker Food",e:"🍜",
txt:`Follow your nose! At a busy {hawker} centre, delicious smells float from every {stall}: chicken rice, laksa, satay, roti prata and sweet ice desserts. This week, a food club asked one hundred children to name their favourite hawker {dishes}. Chicken rice came first, noodles came second, and ice kacang won "best dessert." Many hawkers learnt their recipes from their parents and grandparents, which makes the food part of our {tradition}. "My grandfather sold noodles from a pushcart long ago," one hawker shared. "I still use his special sauce." So next time you enjoy your {favourite} plate, remember: you are tasting a little piece of history, cooked with love.`,

{id:"n8",t:"Divers Plant a Coral Garden",e:"🪸",
txt:`Under the waves, a special garden is growing! This month, a team of {divers} began planting hundreds of baby {corals} onto an old reef that had become grey and empty. The divers gently attach each little coral to the rock, like planting seedlings in {underwater} soil. Corals may look like colourful stones, but they are actually alive — tiny animals build them, bit by bit. Healthy reefs give fish, turtles and seahorses a safe home. "If we {protect} the reef, the fish will come back," said the team leader. Scientists will visit every month to check how fast the corals {grow}. In a few years, they hope, the grey reef will bloom into a busy rainbow city of fish.`,

    <div style="margin-top:14px;"><button class="btn sand" onclick="document.getElementById('xraybox').classList.toggle('hidden')">🔬 Sentence X-ray</button></div>

  ${quiz}`;

function answer(id,qi,oi){
  if(quizAnswered[qi]!==undefined)return;
  const a=findArt(id),q=a.quiz[qi];
  quizAnswered[qi]=oi;
  for(let i=0;i<q.o.length;i++){
    const b=document.getElementById("q"+qi+"o"+i);
    b.disabled=true;
    if(i===q.a)b.classList.add("correct");
    else if(i===oi)b.classList.add("wrong");
  }
  const right=oi===q.a;
  document.getElementById("q"+qi+"model").innerHTML=
    `<div class="model">${right?"🌟 <b>Wonderful!</b>":"💙 <b>Nice try!</b> Let's look at the model answer together:"}<br>
     <b>Model answer:</b> ${q.o[q.a]}<br><b>Why:</b> ${q.why}</div>`;
  if(right){addXP(5);miniConfetti();}else addXP(1);
  if(Object.keys(quizAnswered).length===a.quiz.length)finishArticle(id);
}
function finishArticle(id){
  const first=!state.done[id];
  state.done[id]=true;
  const kind=kindOf(id);
  const d=dailyState();
  const p=todaysPicks();
  let daily=false;
  if((kind==="fun"&&p.fun.id===id&&!d.fun)){d.fun=true;daily=true;}
  if((kind==="news"&&p.news.id===id&&!d.news)){d.news=true;daily=true;}
  let msg=`<div class="card center"><div class="big">🎉</div><h2>Article complete!</h2><div style="font-size:16px;line-height:1.7;">You earned XP for every answer.`;
  if(first){addXP(10);msg+=` <b>+10 bonus XP</b> for a new article!`;}
  if(d.fun&&d.news&&state.lastStreakDay!==todayStr()){
    state.streak+=1;state.lastStreakDay=todayStr();
    msg+=`<br><b style="color:#e67e22;">🔥 Daily dive complete! Streak: ${state.streak}!</b>`;
    fireworks();
  }else{confettiBurst();}
  msg+=`</div><div style="margin-top:14px;"><button class="btn" onclick="go('home')">🌊 Back to Today</button></div></div>`;
  save();updateHeader();

  if(daily)save();
}

/* ================= EFFECTS ================= */
const fxCanvas=document.getElementById("fx");
const fxCtx=fxCanvas.getContext("2d");
let parts=[],fxRunning=false;
function fxResize(){fxCanvas.width=innerWidth;fxCanvas.height=innerHeight;}
addEventListener("resize",fxResize);fxResize();
const FX_COLORS=["#4ab8d8","#ff8a7a","#ffd66b","#8fd7b8","#a5e0ef","#f7a8d8"];
function spawnConfetti(n,x,y,spread){
  for(let i=0;i<n;i++){
    parts.push({x:x??Math.random()*fxCanvas.width,y:y??-10,
      vx:(Math.random()-.5)*(spread||4),vy:Math.random()*3+2,
      s:Math.random()*7+4,c:FX_COLORS[Math.floor(Math.random()*FX_COLORS.length)],
      r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,life:140});
  }
  runFX();
}
function spawnFirework(){
  const x=Math.random()*fxCanvas.width,y=Math.random()*fxCanvas.height*.5+50;
  const c=FX_COLORS[Math.floor(Math.random()*FX_COLORS.length)];
  for(let i=0;i<28;i++){
    const a=(i/28)*Math.PI*2,sp=Math.random()*3+2;
    parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,s:4,c:c,r:0,vr:0,life:60,fw:true});
  }
}
function miniConfetti(){spawnConfetti(24,fxCanvas.width/2,fxCanvas.height*.35,8);}
function confettiBurst(){spawnConfetti(90);}
function fireworks(){
  spawnConfetti(70);
  let count=0;
  const iv=setInterval(()=>{spawnFirework();runFX();count++;if(count>5)clearInterval(iv);},350);
}
function runFX(){
  if(fxRunning)return;fxRunning=true;
  function tick(){
    fxCtx.clearRect(0,0,fxCanvas.width,fxCanvas.height);
    parts=parts.filter(p=>p.life>0&&p.y<fxCanvas.height+20);
    parts.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;if(!p.fw)p.vy+=.06;else p.vy+=.03;p.r+=p.vr;p.life--;
      fxCtx.save();fxCtx.translate(p.x,p.y);fxCtx.rotate(p.r);
      fxCtx.globalAlpha=Math.min(1,p.life/40);
      fxCtx.fillStyle=p.c;fxCtx.fillRect(-p.s/2,-p.s/2,p.s,p.s);fxCtx.restore();
    });
    if(parts.length){requestAnimationFrame(tick);}else{fxRunning=false;fxCtx.clearRect(0,0,fxCanvas.width,fxCanvas.height);}
  }
  requestAnimationFrame(tick);
}
/* ================= INIT ================= */
updateHeader();
go("home");
</script>
