<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Science Explorer 🐠</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  :root{ --tiffany:#62b5e5; --tiffany-light:#aed9f7; --lagoon:#e9f4fc; --sky:#f5fafe; --deep:#3387c4;
    --sand:#fdf3dd; --coral:#ff8a7a; --card:#ffffff; --ink:#144644; --ink2:#3d7a76; --ink3:#7aa8a4; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
    font-size:17px; color:var(--ink); background:var(--sky);
    background-image:linear-gradient(180deg,#f5fafe 0%,#e9f4fc 55%,#d8f2ef 100%);
    min-height:100%; line-height:1.8;
  }
  #app { max-width:820px; margin:0 auto; padding:10px 12px 70px; }
  button { font-family:inherit; cursor:pointer; border:none; min-height:46px; }
  @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-3deg)} 75%{transform:rotate(3deg)} }
  @keyframes idlefloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
  @keyframes pop { from{opacity:0; transform:scale(.9);} to{opacity:1; transform:none;} }
  @keyframes springin { 0%{opacity:0; transform:scale(.7);} 60%{opacity:1; transform:scale(1.06);} 100%{opacity:1; transform:scale(1);} }
  @keyframes slidein { from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;} }
  .anim { animation:slidein .45s cubic-bezier(.34,1.56,.64,1); }
  .topbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .chip { background:var(--card); border-radius:18px; padding:6px 12px; font-weight:700; font-size:16px;
    box-shadow:0 3px 10px rgba(10,138,134,.13); display:flex; align-items:center; gap:6px; min-height:44px; }
  .chip small { font-weight:600; color:var(--ink2); font-size:12px; }
  .chip.title { background:linear-gradient(135deg,#fdf3dd,#ffe9c9); color:#8a6a1c; border:2px solid #f0d9a0; font-size:14px; }
  .ttsbtn { font-size:21px; border:2px solid var(--tiffany-light); margin-left:auto; }
  .ttsbtn:active { transform:scale(.88); }
  .guide { display:flex; align-items:flex-start; gap:10px; margin:8px 0 14px; }
  .guide .face { font-size:46px; line-height:1; filter:drop-shadow(0 3px 4px rgba(10,138,134,.25)); animation:idlefloat 3s ease-in-out infinite; }
  .bubble { background:var(--card); border-radius:4px 18px 18px 18px; padding:12px 16px; font-size:17px; line-height:1.75;
    box-shadow:0 4px 12px rgba(10,138,134,.13); flex:1; border:2px solid var(--tiffany-light); }
  .modes { display:grid; gap:12px; grid-template-columns:1fr; }
  @media(min-width:540px){ .modes { grid-template-columns:1fr 1fr; } }
  .modecard { background:var(--card); border-radius:20px; padding:20px 16px; text-align:center;
    box-shadow:0 5px 18px rgba(10,138,134,.15); transition:transform .25s cubic-bezier(.34,1.56,.64,1); border:2px solid var(--tiffany-light); width:100%; }
  .modecard:hover { transform:scale(1.03) rotate(-.5deg); }
  .modecard:active { transform:scale(.94); }
  .modecard .big { font-size:54px; animation:idlefloat 3.4s ease-in-out infinite; display:inline-block; }
  .modecard h2 { color:var(--deep); font-size:21px; margin:8px 0 4px; }
  .modecard p { color:var(--ink2); font-size:15px; line-height:1.6; }
  .mbadge { display:inline-block; background:var(--coral); color:#fff; font-size:13px; font-weight:800; border-radius:12px; padding:1px 10px; margin-top:6px; }
  .mbadge.done { background:#2bb673; }
  .tgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; }
  .tcard { background:var(--card); border-radius:18px; padding:13px; display:flex; align-items:center; gap:10px;
    box-shadow:0 4px 14px rgba(10,138,134,.13); border:2px solid var(--lagoon); min-height:78px; width:100%; text-align:left;
    transition:transform .22s cubic-bezier(.34,1.56,.64,1); }
  .tcard:hover { transform:scale(1.02); border-color:var(--tiffany-light); }
  .tcard:active { transform:scale(.95); }
  .tcard .em { font-size:33px; }
  .tcard .nm { font-weight:800; font-size:16px; }
  .tcard .sub { font-size:12px; color:var(--ink2); margin-top:2px; }
  .ring { margin-left:auto; flex:none; }
  .backrow { display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .btn { background:linear-gradient(180deg,#19c8c2,#62b5e5); color:#fff; font-weight:800; font-size:17px;
    border-radius:16px; padding:12px 22px; box-shadow:0 4px 0 var(--deep); min-height:50px;
    transition:transform .2s cubic-bezier(.34,1.56,.64,1); }
  .btn:hover { animation:wiggle .35s; }
  .btn:active { transform:translateY(2px) scale(.97); box-shadow:0 2px 0 var(--deep); }
  .btn.sand { background:linear-gradient(180deg,#ffd98e,#f4c35d); color:#7a5a12; box-shadow:0 4px 0 #d9a83f; }
  .btn.sand:active { box-shadow:0 2px 0 #d9a83f; }
  .btn.coral { background:linear-gradient(180deg,#ff9d8e,#ff8a7a); color:#fff; box-shadow:0 4px 0 #d96a5a; }
  .btn.ghost { background:var(--card); color:var(--deep); border:2px solid var(--tiffany-light); box-shadow:none; }
  /* flashcard */
  .flip { perspective:1200px; max-width:480px; margin:0 auto 14px; }
  .flipinner { position:relative; width:100%; min-height:310px; transition:transform .5s cubic-bezier(.34,1.4,.64,1); transform-style:preserve-3d; }
  .flip.flipped .flipinner { transform:rotateY(180deg); }
  .face3d { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    background:var(--card); border-radius:20px; box-shadow:0 5px 18px rgba(10,138,134,.16); padding:20px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; border:2px solid var(--tiffany-light); }
  .face3d.back { transform:rotateY(180deg); justify-content:flex-start; }
  .bigem { font-size:74px; animation:idlefloat 3s ease-in-out infinite; }
  .term { font-size:28px; font-weight:800; color:var(--deep); margin-top:8px; }
  .tapnote { color:var(--ink3); font-size:13px; margin-top:14px; }
  .def { font-size:17px; line-height:1.7; margin:10px 0; }
  .scibox { background:var(--lagoon); border:2px dashed var(--tiffany); border-radius:14px; padding:10px 13px; font-size:16px; line-height:1.7; margin-top:6px; width:100%; }
  .scibox .tag { font-weight:800; color:var(--deep); font-size:13px; display:block; margin-bottom:3px; }
  .wordstat { font-size:12px; font-weight:800; border-radius:12px; padding:3px 10px; margin-top:8px; }
  .wordstat.known { background:#e2f7ee; color:#177a55; }
  .wordstat.learning { background:#fdf3dd; color:#a8781a; }
  /* quiz */
  .qcard { background:var(--card); border-radius:20px; padding:20px; box-shadow:0 5px 18px rgba(10,138,134,.15); margin-bottom:14px; border:2px solid var(--lagoon); }
  .qtext { font-size:20px; line-height:1.8; font-weight:700; }
  .opts { display:grid; grid-template-columns:1fr; gap:10px; margin-top:16px; }
  .opts.short { grid-template-columns:1fr 1fr; }
  .opt { background:var(--sky); border:2px solid var(--tiffany-light); border-radius:16px; padding:13px 16px; font-size:17px;
    font-weight:600; color:var(--ink); text-align:left; min-height:52px; line-height:1.7;
    transition:transform .2s cubic-bezier(.34,1.56,.64,1), background .15s; }
  .opt:not(:disabled):hover { transform:scale(1.015); background:var(--lagoon); }
  .opt:not(:disabled):active { transform:scale(.97); background:var(--lagoon); }
  .opt.sel-ok, .opt.show-ok { background:#e2f7ee; border-color:#2bb673; color:#177a55; animation:springin .45s; }
  .opt.sel-no { background:#ffece9; border-color:var(--coral); color:#c65a4c; }
  .fb { border-radius:20px; padding:16px; margin-bottom:14px; animation:springin .4s; }
  .fb.good { background:#e2f7ee; border:2px solid #7fd8b4; }
  .fb.oops { background:#fff4f2; border:2px solid #ffb8ae; }
  .fb .big { font-size:20px; font-weight:800; }
  .fb.good .big { color:#177a55; } .fb.oops .big { color:#c65a4c; }
  .model { background:var(--lagoon); border:2px dashed var(--tiffany); border-radius:16px; padding:13px 15px; margin:12px 0; font-size:17px; line-height:1.75; }
  .model .tag { font-weight:800; color:var(--deep); font-size:14px; display:block; margin-bottom:4px; }
  .diabox { background:var(--card); border-radius:20px; padding:16px; box-shadow:0 5px 16px rgba(10,138,134,.13); margin-bottom:14px; }
  .diabox h4 { color:var(--deep); font-size:16px; margin-bottom:8px; }
  .whys { margin-top:10px; }
  .why { font-size:15px; color:var(--ink2); background:var(--sky); border-left:4px solid #ffb8ae; border-radius:8px; padding:8px 11px; margin:6px 0; line-height:1.6; }
  .spk { background:none; border:none; font-size:22px; min-height:40px; min-width:40px; padding:0 4px; vertical-align:middle; cursor:pointer; }
  .spk:active { transform:scale(.85); }
  /* --- reading guidance (tap-a-word + option speakers + phonics) --- */
  .tapw { border-radius:6px; }
  .tapw.hl { background:#ffe9c9; box-shadow:0 0 0 2px #f0d9a0; }
  .qspk { border:2px solid var(--tiffany-light); border-radius:12px; background:var(--sky); margin-left:6px; }
  .optrow { display:flex; gap:6px; align-items:stretch; }
  .optrow .opt { flex:1; }
  .optspk { flex:none; align-self:center; min-width:44px; min-height:44px; border:2px solid var(--tiffany-light);
    border-radius:14px; background:var(--card); font-size:19px; }
  .sylrow { margin-top:10px; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .sylbtn { font-size:14px; font-weight:800; color:var(--deep); background:var(--sky); border:2px solid var(--tiffany-light);
    border-radius:14px; padding:6px 14px; min-height:40px; cursor:pointer; }
  .sylbtn:active { transform:scale(.94); }
  .syl { font-size:20px; font-weight:800; color:var(--ink2); padding:2px 5px; border-radius:8px; transition:background .15s; }
  .syl.hl { background:#ffe9c9; color:#a8781a; }
  .syldot { color:var(--ink3); font-weight:800; }
  /* diagrams */
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:8px; }
  .cell { background:var(--sky); border:2px solid var(--tiffany-light); border-radius:14px; padding:9px 6px; text-align:center; }
  .cell .e { font-size:27px; }
  .cell .n { font-size:14px; font-weight:800; color:var(--deep); }
  .cell .d { font-size:12px; color:var(--ink2); line-height:1.45; }
  .vflow { display:flex; flex-direction:column; align-items:center; gap:2px; }
  .vbox { background:var(--sky); border:2px solid var(--tiffany); border-radius:12px; padding:8px 14px; font-weight:700; font-size:15px; text-align:center; min-width:230px; }
  .vbox .d { font-size:12px; color:var(--ink2); font-weight:600; }
  .varrow { color:var(--coral); font-size:18px; font-weight:800; }
  .cap { font-size:14px; color:var(--ink2); text-align:center; margin-top:6px; line-height:1.55; }
  .pbar { height:10px; background:#e0effa; border-radius:6px; overflow:hidden; margin-top:6px; }
  .pbar>div { height:100%; background:linear-gradient(90deg,var(--tiffany-light),var(--tiffany)); transition:width .4s; }
  .badgebox { background:var(--card); border-radius:20px; padding:14px 16px; box-shadow:0 5px 16px rgba(10,138,134,.13); margin-top:16px; }
  .badgebox h3 { color:var(--deep); font-size:16px; margin-bottom:8px; }
  .bdg { display:inline-flex; align-items:center; gap:5px; background:var(--sky); border:2px solid var(--tiffany-light);
    border-radius:14px; padding:5px 11px; margin:3px; font-size:13px; font-weight:700; }
  .bdg.locked { opacity:.38; filter:grayscale(1); }
  .bdg.gold { background:linear-gradient(135deg,#fdf3dd,#ffe9c9); border-color:#f0d9a0; color:#8a6a1c; }
  /* mistake shells */
  .mistst { display:inline-block; font-size:13px; font-weight:800; border-radius:12px; padding:3px 10px; margin-bottom:8px; background:#fff0ee; color:#c65a4c; }
  .fixedcard { border:2px solid #7fd8b4; }
  .fixedcard .mistst { background:#e2f7ee; color:#177a55; }
  .youpicked { font-size:14px; color:#c65a4c; background:#fff6f4; border-radius:10px; padding:8px 11px; margin:8px 0; line-height:1.55; }
  /* MEGA celebration */
  .mega { position:fixed; inset:0; z-index:40; overflow:hidden;
    background:linear-gradient(180deg,#8ce0da 0%,#2cc5c0 40%,#3387c4 100%); animation:pop .4s; }
  .megaray { position:absolute; top:-10%; width:14%; height:70%; background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0));
    transform:skewX(-12deg); animation:raypulse 3s ease-in-out infinite; pointer-events:none; }
  @keyframes raypulse { 0%,100%{opacity:.4} 50%{opacity:.9} }
  .pchar { position:absolute; left:-140px; font-size:58px; animation:swim linear infinite; pointer-events:none; }
  .pchar>span { display:inline-block; animation:idlefloat 2.2s ease-in-out infinite; }
  @keyframes swim { from{ transform:translateX(0); } to{ transform:translateX(130vw); } }
  .mbub { position:absolute; bottom:-50px; border-radius:50%; border:2px solid rgba(255,255,255,.65);
    background:rgba(255,255,255,.12); animation:rise linear infinite; pointer-events:none; }
  @keyframes rise { to{ transform:translateY(-115vh); } }
  .megacard { position:absolute; left:50%; top:44%; transform:translate(-50%,-50%); background:rgba(255,255,255,.95);
    border-radius:26px; padding:24px 30px; text-align:center; box-shadow:0 10px 40px rgba(0,60,58,.4);
    animation:springin .6s cubic-bezier(.34,1.56,.64,1); max-width:92vw; width:420px; z-index:2; }
  .megaem { font-size:76px; animation:idlefloat 2.4s ease-in-out infinite; display:inline-block; }
  .megatitle { color:var(--coral); font-weight:800; letter-spacing:2px; font-size:15px; margin-top:4px; }
  .meganame { color:var(--deep); font-size:30px; font-weight:800; margin:6px 0; line-height:1.3; }
  .megasub { color:var(--ink2); font-size:16px; margin-bottom:14px; }
  #fx { position:fixed; inset:0; pointer-events:none; z-index:50; }
  footer { text-align:center; color:var(--ink3); font-size:12px; margin-top:22px; }
</style>
</head>

<script>
"use strict";
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function rescape(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }

/* ================= TOPICS ================= */
const TOPICS=[
  {id:"lt", name:"Living Things",   emoji:"🐦"},
  {id:"ag", name:"Animal Groups",   emoji:"🐸"},
  {id:"pl", name:"Plants, Fungi & Bacteria", emoji:"🍄"},
  {id:"ma", name:"Materials",       emoji:"🧱"},
  {id:"cy", name:"Life Cycles",     emoji:"🦋"},

/* ================= VOCAB (Word Lab) ================= */
const VOCAB=[
 // Living Things (8)
 {t:"lt", term:"living thing", e:"🐦", def:"Something that is alive. It needs air, food and water, and it can grow, respond and reproduce.", sent:"A bird is a living thing because it needs air, food and water."},

 // Materials (10 + 2 new = 12)

function cell(e,n,d){ return '<div class="cell"><div class="e">'+e+'</div><div class="n">'+n+'</div>'+(d?'<div class="d">'+d+'</div>':'')+'</div>'; }
function cycleSVG(stages){
  // stages: [{e,label}] arranged in circle with arrows
  const cx=150, cy=120, r=82; const n=stages.length;
  let s='<svg viewBox="0 0 300 240" style="max-width:340px;display:block;margin:0 auto">';
  s+='<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#ff8a7a"/></marker></defs>';
  for(let i=0;i<n;i++){
    const a1=(i/n)*2*Math.PI-Math.PI/2, a2=((i+1)/n)*2*Math.PI-Math.PI/2;
    const pad=0.42;
    const x1=cx+r*Math.cos(a1+pad), y1=cy+r*Math.sin(a1+pad);
    const x2=cx+r*Math.cos(a2-pad), y2=cy+r*Math.sin(a2-pad);
    const mx=cx+(r+16)*Math.cos((a1+a2)/2), my=cy+(r+16)*Math.sin((a1+a2)/2);
    s+='<path d="M'+x1.toFixed(1)+','+y1.toFixed(1)+' Q'+mx.toFixed(1)+','+my.toFixed(1)+' '+x2.toFixed(1)+','+y2.toFixed(1)+'" fill="none" stroke="#ff8a7a" stroke-width="3" marker-end="url(#ah)"/>';
  }
  stages.forEach((st,i)=>{
    const a=(i/n)*2*Math.PI-Math.PI/2;
    const x=cx+r*Math.cos(a), y=cy+r*Math.sin(a);
    s+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="30" fill="#fff" stroke="#62b5e5" stroke-width="3"/>';
    s+='<text x="'+x.toFixed(1)+'" y="'+(y+7).toFixed(1)+'" text-anchor="middle" font-size="24">'+st.e+'</text>';
    s+='<text x="'+x.toFixed(1)+'" y="'+(y+48).toFixed(1)+'" text-anchor="middle" font-size="13" font-weight="800" fill="#3387c4">'+st.label+'</text>';
  });
  return s+'</svg>';
}
function magnetSVG(mode){
  const attract = mode==="attract";
  function bar(x,flip){
    return '<rect x="'+x+'" y="40" width="50" height="34" rx="4" fill="'+(flip?'#62b5e5':'#ff8a7a')+'"/>'
      +'<rect x="'+(x+50)+'" y="40" width="50" height="34" rx="4" fill="'+(flip?'#ff8a7a':'#62b5e5')+'"/>'
      +'<text x="'+(x+25)+'" y="63" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">'+(flip?'S':'N')+'</text>'
      +'<text x="'+(x+75)+'" y="63" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">'+(flip?'N':'S')+'</text>';
  }
  let s='<svg viewBox="0 0 360 110" style="max-width:360px;display:block;margin:0 auto">';
  if(attract){
    s+=bar(20,false)+bar(240,false); // N S  ...  N S  -> facing S|N unlike
    s+='<text x="180" y="30" text-anchor="middle" font-size="13" font-weight="800" fill="#177a55">unlike poles (S and N)</text>';
    s+='<path d="M135,57 L165,57" stroke="#177a55" stroke-width="4" marker-end="url(#ma)"/><path d="M225,57 L195,57" stroke="#177a55" stroke-width="4" marker-end="url(#ma)"/>';
    s+='<defs><marker id="ma" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#177a55"/></marker></defs>';
    s+='<text x="180" y="98" text-anchor="middle" font-size="14" font-weight="800" fill="#177a55">ATTRACT — they pull together 🤝</text>';
  }else{
    s+=bar(20,true)+bar(240,false); // S N ... N S -> facing N|N like
    s+='<text x="180" y="30" text-anchor="middle" font-size="13" font-weight="800" fill="#c65a4c">like poles (N and N)</text>';
    s+='<path d="M165,57 L135,57" stroke="#c65a4c" stroke-width="4" marker-end="url(#mr)"/><path d="M195,57 L225,57" stroke="#c65a4c" stroke-width="4" marker-end="url(#mr)"/>';
    s+='<defs><marker id="mr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#c65a4c"/></marker></defs>';
    s+='<text x="180" y="98" text-anchor="middle" font-size="14" font-weight="800" fill="#c65a4c">REPEL — they push apart ↔️</text>';
  }
  return s+'</svg>';
}

let AC=null;
function ac(){try{if(localStorage.getItem("jenny_tts_on")==="0")return;}catch(e){}
  try{
    if(!AC && (window.AudioContext||window.webkitAudioContext)) AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC && AC.state==="suspended") AC.resume();
  }catch(e){}
  return AC;

function tone(freq,at,dur,type,vol){try{if(localStorage.getItem("jenny_tts_on")==="0")return;}catch(e){}
  const a=ac(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||"sine"; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,a.currentTime+at);
  g.gain.exponentialRampToValueAtTime(vol||0.18,a.currentTime+at+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+at+dur);
  o.connect(g); g.connect(a.destination);
  o.start(a.currentTime+at); o.stop(a.currentTime+at+dur+0.05);
}

/* Humanized voice ranking: Premium/Enhanced/Siri/local/known-good names first */
function __voiceScore(v,pref){
  if(!v||!v.lang)return -1;
  const vl=String(v.lang).toLowerCase().replace(/_/g,'-');
  if(vl.indexOf(pref)!==0)return -1;
  const n=String(v.name||'');let s=0;
  if(/premium/i.test(n))s+=100;
  if(/enhanced|增强/i.test(n))s+=80;
  if(/siri/i.test(n))s+=70;
  if(v.localService===true)s+=40;
  if(pref==="en"){if(/\b(ava|zoe|samantha|karen|allison|susan)\b/i.test(n))s+=20;}
  else{
    if(/tingting|ting-ting|婷婷|meijia|mei-jia|美嘉|lili|丽丽|shanshan|珊珊/i.test(n))s+=20;
    if(vl.indexOf('zh-cn')===0||vl.indexOf('zh-hans')===0)s+=10;
  }
  return s;
}
function __bestVoice(vs,pref){
  let best=null,bs=-1;
  for(let i=0;i<(vs?vs.length:0);i++){const sc=__voiceScore(vs[i],pref);if(sc>bs){bs=sc;best=vs[i];}}
  return best;
}
function __humanRate(){return 0.95+(Math.random()*0.06-0.03);}
function __humanPitch(){return 1+(Math.random()*0.1-0.05);}
let __vCache={};
function __pickVoice(pref){
  if(__vCache[pref]!==undefined) return __vCache[pref];
  try{ return __vCache[pref]=__bestVoice(speechSynthesis.getVoices()||[],pref); }catch(e){ return null; }
}
try{ if(typeof speechSynthesis!=="undefined") speechSynthesis.onvoiceschanged=function(){ __vCache={}; }; }catch(e){} /* re-rank when voices load async (iOS) */
function speak(text,lang){
  if(!ttsOn) return;
  try{
    if(typeof speechSynthesis==="undefined") return;
    lang=lang||"en";
    const u=new SpeechSynthesisUtterance(text);
    u.lang = lang==="zh" ? "zh-CN" : "en-US";
    const v=__pickVoice(lang==="zh"?"zh":"en");
    if(lang==="zh" && !v) return; /* no Chinese voice on device: silent fallback */
    if(v) u.voice=v;
    u.rate=__humanRate(); u.pitch=__humanPitch();
    speechSynthesis.cancel(); setTimeout(function(){try{speechSynthesis.resume();}catch(e){}speechSynthesis.speak(u);},80);
  }catch(e){}
}
function toggleTTS(){
  ttsOn=!ttsOn;

  if(!ttsOn){ try{ speechSynthesis.cancel(); }catch(e){} } else speak("Voice is on!");

}

/* Wrap every English word in a tappable span. Safe over HTML: only text outside tags is wrapped. */
function tapWords(text){

    return seg.replace(/[A-Za-z][A-Za-z'’-]*/g,function(m){ return '<span class="tapw">'+m+'</span>'; });
  }).join("");
}

/* 字母引导 — naive syllable chunks: split before consonant clusters that follow vowels
   e.g. magnet -> mag·net, digestion -> di·ges·tion */
function syllabify(word){
  const out=[];
  const isV=function(ch){ return "aeiouyAEIOUY".indexOf(ch)>=0; };
  String(word).split(/[\s-]+/).forEach(function(w){
    if(!w) return;
    let i=0;
    while(i<w.length){
      const start=i;
      while(i<w.length && !isV(w.charAt(i))) i++;      /* leading consonants */
      while(i<w.length && isV(w.charAt(i))) i++;       /* vowel group */
      const cstart=i;
      while(i<w.length && !isV(w.charAt(i))) i++;      /* consonants before next vowel */
      const cons=i-cstart;
      if(i>=w.length){ out.push(w.slice(start)); }              /* tail joins this chunk */
      else if(cons<=1){ out.push(w.slice(start,cstart)); i=cstart; }      /* di-gest */
      else { out.push(w.slice(start,cstart+1)); i=cstart+1; }             /* mag-net */
    }
  });
  return out.filter(function(s){ return s; });
}
function sylHTML(term){
  return '<div class="sylrow"><div>'
    +syllabify(term).map(function(s,i){ return '<span class="syl" id="syl'+i+'">'+s+'</span>'; }).join('<span class="syldot">·</span>')
    +'</div><button class="sylbtn" onclick="event.stopPropagation();soundItOut()">🔤 sound it out</button></div>';
}
let __soToken=0;
function soundItOut(){
  if(!ttsOn||!curWord) return;
  const chunks=syllabify(curWord.term);
  const token=++__soToken;
  try{ speechSynthesis.cancel(); }catch(e){}
  let i=0, advanced=false;
  function clearHl(){ chunks.forEach(function(_,k){ const el=$("syl"+k); if(el) el.classList.remove("hl"); }); }
  function step(){
    if(token!==__soToken) return;
    clearHl();
    if(i>=chunks.length || !ttsOn){ clearHl(); if(ttsOn) speak(curWord.term); return; }  /* finish: whole word */
    const el=$("syl"+i); if(el) el.classList.add("hl");
    advanced=false;
    const go=function(){ if(advanced||token!==__soToken) return; advanced=true; i++; setTimeout(step,150); };
    try{
      const u=new SpeechSynthesisUtterance(chunks[i]);
      u.lang="en-US"; const v=__pickVoice("en"); if(v) u.voice=v;
      u.rate=0.6; u.pitch=1;
      u.onend=go; u.onerror=go;
      speechSynthesis.speak(u);
      setTimeout(go,2500);            /* iOS safety net if onend never fires */
    }catch(e){ go(); }
  }
  step();
}

const GENTLE=["Good try! Scientists learn by looking again 🧜‍♀️","Almost! Let's read the model answer together 💙","No worries — the diagram below will make it clear 🐠"];
const SPRAISE=["Amazing!","Well done!","Great job!","Super!","You got it!"]; /* short spoken praise */
function ringSVG(pct,size){
  size=size||50; const r=(size-10)/2, c=2*Math.PI*r;
  return '<svg class="ring" width="'+size+'" height="'+size+'"><circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="#e0effa" stroke-width="6"/>'
   +'<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="'+(pct>=80?"#39b98a":"#62b5e5")+'" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-pct/100))+'" transform="rotate(-90 '+(size/2)+' '+(size/2)+')"/>'
   +'<text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" font-size="12" font-weight="800" fill="#3387c4">'+pct+'%</text></svg>';
}
function header(){
  const ti=currentTitle();
  return '<div class="topbar"><div class="chip">⚡ '+S.xp+'<small>XP</small></div>'
   +'<div class="chip">🔥 '+S.streak+'<small>day streak</small></div>'
   +'<div class="chip">🐚 '+vocabMastered()+'/'+VOCAB.length+'<small>words known</small></div>'
   +(ti?'<div class="chip title">'+ti[2]+' '+ti[1]+'</div>':'')
   +'<button class="chip ttsbtn" id="ttsbtn" onclick="toggleTTS()" title="voice on / off">'+(ttsOn?"🔊":"🔇")+'</button></div>';
}
function showHome(){
  lastView="home";
  const ti=currentTitle(), mc=mistUnfixed();
  let h=header();
  h+='<div class="guide"><div class="face">🧜‍♀️</div><div class="bubble"><b>Marina the Mermaid:</b> Welcome'+(ti?", "+ti[1]:"")+'! Learn the words first, then test yourself in the Quiz Reef 🐠</div></div>';
  h+='<div class="topbar" style="margin:2px 0 10px">'+dailyChip()
    +'<div class="chip">🏆 <small>'+(ti?ti[2]+" "+ti[1]:"next title at 25 ⭐")+'</small></div></div>';
  h+='<div class="modes">';
  h+='<button class="modecard" onclick="sndPop();showWordTopics()"><div class="big">🧪</div><h2>Word Lab</h2><p>Learn '+VOCAB.length+' scientist words with flashcards</p></button>';
  h+='<button class="modecard" onclick="sndPop();showQuizTopics()"><div class="big">🪸</div><h2>Quiz Reef</h2><p>'+QUIZ.length+' questions — every answer teaches you how to write!</p></button>';
  h+='<button class="modecard" onclick="sndPop();showMistakes()"><div class="big">🐚</div><h2>Mistake Shells</h2><p>Redo tricky questions and turn every shell green!</p>'
    +(mc?'<span class="mbadge">'+mc+' to fix</span>':'<span class="mbadge done">all clear ✨</span>')+'</button>';
  h+='</div>';
  h+='<div class="badgebox"><h3>🏆 Title Awards</h3>'
    +TITLES.map(x=>{ const got=Math.max(quizCorrectTotal(),vocabMastered())>=x[0];
      return '<span class="bdg gold'+(got?'':' locked')+'">'+x[2]+' '+x[1]+' · '+x[0]+'</span>'; }).join("")
    +'</div>';
  h+='<div class="badgebox"><h3>🏅 Badges</h3>'+badges()+'</div>';
  h+='<footer>Science Explorer · P3 early prep · made with 💙 for Jenny · works offline</footer>';
  $("app").innerHTML=h; window.scrollTo(0,0);
}
function badges(){
  const defs=[["🐚","First Word", Object.keys(S.words).length>=1],
    ["🧪","10 Words Known", Object.values(S.words).filter(v=>v===2).length>=10],
    ["📚","30 Words Known", Object.values(S.words).filter(v=>v===2).length>=30],
    ["🎓","Word Master (all "+VOCAB.length+")", Object.values(S.words).filter(v=>v===2).length>=VOCAB.length],
    ["🔥","3-Day Streak", S.streak>=3],["⚡","100 XP", S.xp>=100],["🌟","300 XP", S.xp>=300]];
  TOPICS.forEach(t=>defs.push([t.emoji, t.name+" Star", S.quiz[t.id].c>=5]));
  return defs.map(d=>'<span class="bdg'+(d[2]?'':' locked')+'">'+d[0]+' '+d[1]+'</span>').join("");
}

/* ---------- Word Lab ---------- */
let deck=[], cardIdx=0, curWord=null, phase="card", wordTopic=null;
function showWordTopics(){
  lastView="words";
  let h=header()+'<div class="backrow"><button class="btn ghost" onclick="showHome()">🏠 Home</button><div class="chip">🧪 <small>Word Lab — pick a topic</small></div></div>';
  h+='<div class="tgrid">';
  TOPICS.forEach(t=>{
    const w=wordsOf(t.id);
    h+='<button class="tcard" onclick="startWords(\''+t.id+'\')"><span class="em">'+t.emoji+'</span><span><div class="nm">'+t.name+'</div><div class="sub">'+w.filter(x=>S.words[x.term]===2).length+'/'+w.length+' words known</div></span>'+ringSVG(knownPct(t.id))+'</button>';
  });
  h+='</div>';
  $("app").innerHTML=h; window.scrollTo(0,0);
}
function startWords(tid){
  wordTopic=TOPICS.find(t=>t.id===tid);
  const w=wordsOf(tid);
  const unknown=w.filter(x=>S.words[x.term]!==2);
  deck=shuffle(unknown.length?unknown.concat(shuffle(w.filter(x=>S.words[x.term]===2)).slice(0,2)):w);
  cardIdx=0; showCard();
}
function showCard(){
  if(cardIdx>=deck.length){ showWordTopics(); return; }
  curWord=deck[cardIdx]; phase="card";
  const st=S.words[curWord.term];
  let h=header()+'<div class="backrow"><button class="btn ghost" onclick="showWordTopics()">◀ Topics</button><div class="chip">'+wordTopic.emoji+' <small>'+wordTopic.name+' · card '+(cardIdx+1)+'/'+deck.length+'</small></div></div>';
  h+='<div class="pbar" style="margin-bottom:14px"><div style="width:'+(cardIdx/deck.length*100)+'%"></div></div>';
  h+='<div class="flip" id="flip" onclick="flipCard()"><div class="flipinner">';
  h+='<div class="face3d"><div class="bigem">'+curWord.e+'</div><div class="term">'+curWord.term+' <button class="spk" onclick="event.stopPropagation();speakTerm()" title="read the word">🔊</button></div>'
    +sylHTML(curWord.term)
    +(st===2?'<div class="wordstat known">✔ known</div>':st===1?'<div class="wordstat learning">📖 learning</div>':'')
    +'<div class="tapnote">tap the card to flip 🔄</div></div>';
  h+='<div class="face3d back"><div style="font-size:34px">'+curWord.e+'</div><div class="term" style="font-size:20px">'+curWord.term+' <button class="spk" onclick="event.stopPropagation();speakTerm()" title="read the word">🔊</button></div>'
    +'<div class="def"><button class="spk" onclick="event.stopPropagation();speakDef()" title="read the meaning">🔊</button> '+tapWords(curWord.def)+'</div>'
    +'<div class="scibox"><span class="tag">🔬 Scientist\'s sentence <button class="spk" onclick="event.stopPropagation();speakCurWord()">🔊</button></span>'+tapWords(curWord.sent)+'</div></div>';
  h+='</div></div>';
  h+='<div style="display:flex;gap:10px;max-width:460px;margin:0 auto"><button class="btn sand" style="flex:1" onclick="useWord()">Use the word! ✏️</button></div>';
  $("app").innerHTML=h; window.scrollTo(0,0);
  speakTerm();   /* auto-read the word when the card is shown */
}
function flipCard(){ sndPop(); $("flip").classList.toggle("flipped"); }
function useWord(){
  phase="mcq"; sndPop();
  const others=shuffle(wordsOf(curWord.t).filter(w=>w.term!==curWord.term)).slice(0,3).map(w=>w.term);
  const opts=shuffle([curWord.term].concat(others));
  const blanked=curWord.sent.replace(new RegExp(rescape(curWord.term),"i"),"<b style='color:#ff8a7a'>_____</b>");
  let h=header()+'<div class="backrow"><button class="btn ghost" onclick="showCard()">◀ Card</button><div class="chip">✏️ <small>Use the word</small></div></div>';
  h+='<div class="guide"><div class="face">🐙</div><div class="bubble">Which word fits the scientist\'s sentence?</div></div>';
  h+='<div class="qcard"><div class="qtext"><button class="spk" onclick="speakWQ()" title="read the sentence">🔊</button> '+blanked+'</div><div class="opts short">';
  opts.forEach((o,i)=>{ h+='<button class="opt" id="wopt'+i+'" onclick="pickWord('+i+',\''+o.replace(/'/g,"\\'")+'\')">'+o+'</button>'; });
  h+='</div></div><div id="fbzone"></div>';
  $("app").innerHTML=h; window.scrollTo(0,0);
  window._wopts=opts;
}
function speakCurWord(){ if(curWord) speak(curWord.term+". "+curWord.sent); }
function pickWord(i,chosen){
  const ok=chosen===curWord.term;
  sndPop();
  window._wopts.forEach((o,j)=>{
    const el=$("wopt"+j); el.disabled=true;
    if(o===curWord.term) el.classList.add(ok&&j===i?"sel-ok":"show-ok");
    if(j===i&&!ok) el.classList.add("sel-no");
  });
  if(ok){ S.words[curWord.term]=2; S.xp+=8; bumpStreak(); confetti(); sndDing(); }
  else { S.words[curWord.term]=1; sndOops(); }
  dailyBump(); save();
  let h='<div class="fb '+(ok?"good":"oops")+' anim"><div class="big">'+(ok?"✅ "+pick(PRAISE)+" (+8 XP)":"💙 "+pick(GENTLE))+'</div></div>';
  h+='<div class="model anim"><span class="tag">🔬 Scientist\'s sentence — read it out loud! <button class="spk" onclick="speakCurWord()">🔊</button></span>'+curWord.sent.replace(new RegExp(rescape(curWord.term),"i"),"<b style='color:#3387c4'>"+curWord.term+"</b>")+'</div>';
  h+='<button class="btn" style="width:100%" onclick="sndPop();cardIdx++;showCard()">Next word 🐚</button>';
  $("fbzone").innerHTML=h;
  speak((ok?pick(SPRAISE)+" ":"Let's read it together. ")+curWord.sent);
  checkMilestones();
}

/* ---------- Quiz Reef ---------- */
let qdeck=[], qIdx=0, curQ=null, qopts=[], combo=0, quizTopic=null, redoMode=false;
function showQuizTopics(){
  lastView="quiz"; redoMode=false;
  const mc=mistUnfixed();
  let h=header()+'<div class="backrow"><button class="btn ghost" onclick="showHome()">🏠 Home</button><div class="chip">🪸 <small>Quiz Reef — pick a topic</small></div>'
    +'<button class="btn coral" style="font-size:15px;padding:8px 14px" onclick="showMistakes()">🐚 Mistake Shells'+(mc?' <span class="mbadge" style="margin:0">'+mc+'</span>':'')+'</button></div>';
  h+='<div class="tgrid">';
  h+='<button class="tcard" onclick="startQuiz(\'mix\')"><span class="em">🌊</span><span><div class="nm">Mix — all topics!</div><div class="sub">'+QUIZ.length+' questions</div></span></button>';
  TOPICS.forEach(t=>{
    const n=QUIZ.filter(q=>q.t===t.id).length;
    h+='<button class="tcard" onclick="startQuiz(\''+t.id+'\')"><span class="em">'+t.emoji+'</span><span><div class="nm">'+t.name+'</div><div class="sub">'+n+' questions · '+S.quiz[t.id].c+' correct</div></span>'+ringSVG(quizPct(t.id))+'</button>';
  });
  h+='</div>';
  $("app").innerHTML=h; window.scrollTo(0,0);
}
function startQuiz(tid){
  sndPop(); redoMode=false;
  quizTopic = tid==="mix" ? {id:"mix",name:"Mix — all topics",emoji:"🌊"} : TOPICS.find(t=>t.id===tid);
  var pool = shuffle(tid==="mix" ? QUIZ : QUIZ.filter(q=>q.t===tid));
  S.seen = S.seen || {};                                  /* 跨天记住做过的题 */
  var fresh = pool.filter(function(q){return !S.seen[q.id]});
  var old_  = pool.filter(function(q){return S.seen[q.id]});
  qdeck = fresh.concat(old_);                             /* 新题优先，做完才轮旧题 */
  qIdx=0; combo=0; showQuiz();
}
function quizBack(){ sndPop(); if(redoMode){ redoMode=false; showMistakes(); } else showQuizTopics(); }
function showQuiz(){
  if(qIdx>=qdeck.length){
    if(redoMode){ redoMode=false; showMistakes(); return; }
    qdeck=shuffle(qdeck); qIdx=0;
  }
  curQ=qdeck[qIdx]; qopts=shuffle(curQ.opts);
  let h=header()+'<div class="backrow"><button class="btn ghost" onclick="quizBack()">◀ '+(redoMode?"Shells":"Topics")+'</button>'
    +'<div class="chip">'+quizTopic.emoji+' <small>'+quizTopic.name+'</small></div>'
    +(combo>=2?'<div class="chip" style="color:#ff7a5c">🔥 <small>combo ×'+combo+'</small></div>':'')+'</div>';
  h+='<div class="guide"><div class="face">🐙</div><div class="bubble">Read every sentence carefully — one of them is a perfect model answer! 📝</div></div>';
  h+='<div class="qcard"><div class="qtext"><button class="spk" onclick="speakQ()" title="read the question">🔊</button> '+tapWords(curQ.q)+'</div><div class="opts">';
  qopts.forEach((o,i)=>{ h+='<div style="display:flex;align-items:center;gap:6px"><button class="spk" style="flex:0 0 auto" onclick="event.stopPropagation();speakOpt('+i+')" title="read this answer">🔊</button>'
    +'<button class="opt" id="qopt'+i+'" style="flex:1" onclick="pickQ('+i+')">'+o.s+'</button></div>'; });
  h+='</div></div><div id="fbzone"></div>';
  $("app").innerHTML=h; window.scrollTo(0,0);
  setTimeout(function(){ try{speakQ()}catch(e){} },350);   /* 自动读题一次 */
}
function speakModel(){ if(curQ) speak(curQ.opts.find(o=>o.ok).s); }
function pickQ(i){
  const chosen=qopts[i]; const ok=!!chosen.ok;
  sndPop();
  qopts.forEach((o,j)=>{
    const el=$("qopt"+j); el.disabled=true;
    if(o.ok) el.classList.add(ok&&j===i?"sel-ok":"show-ok");
    if(j===i&&!ok) el.classList.add("sel-no");
  });
  if(!redoMode){ S.quiz[curQ.t].t++; S.done++; S.seen=S.seen||{}; S.seen[curQ.id]=1; }
  if(ok){
    combo++; bumpStreak(); sndDing();
    if(!redoMode){ S.quiz[curQ.t].c++; S.xp+=10+(combo>=3?5:0); } else S.xp+=6;
    if(S.mist[curQ.id] && !S.mist[curQ.id].fixed) S.mist[curQ.id].fixed=true;  /* shell repaired! */
    if(combo>=3) fireworks(); else confetti();
  } else {
    combo=0; sndOops();
    S.mist[curQ.id]={p:chosen.s, fixed:false};  /* collect into mistake shells */
  }
  dailyBump(); save();
  const model=curQ.opts.find(o=>o.ok).s;
  const bigLine = redoMode&&ok ? "💚 Fixed! The shell turned green! (+6 XP)"
    : ok ? "✅ "+pick(PRAISE)+(combo>=3?" 🔥 combo ×"+combo+" (+15 XP)":" (+10 XP)")
    : "💙 "+pick(GENTLE);
  let h='<div class="fb '+(ok?"good":"oops")+' anim"><div class="big">'+bigLine+'</div></div>';
  h+='<div class="model anim"><span class="tag">📝 How to write it in an open-ended question <button class="spk" onclick="speakModel()">🔊</button></span><b>'+model+'</b></div>';
  const d=DIA[curQ.dia];
  if(d) h+='<div class="diabox anim"><h4>🔍 '+d.t+'</h4>'+d.h+'</div>';
  const whys=qopts.filter(o=>!o.ok && o.n);
  if(whys.length){
    h+='<div class="diabox anim"><h4>🤔 Why the other answers are not quite right</h4><div class="whys">'
      +whys.map(o=>'<div class="why"><b>“'+o.s+'”</b><br>→ '+o.n+'</div>').join("")+'</div></div>';
  }
  h+='<button class="btn" style="width:100%" onclick="sndPop();qIdx++;showQuiz()">'+(redoMode?"Back to shells 🐚":"Next question 🌊")+'</button>';
  $("fbzone").innerHTML=h;
  $("fbzone").scrollIntoView({behavior:"smooth"});
  speak((ok?pick(SPRAISE)+" ":"Good try! Here is the model answer. ")+model);
  checkMilestones();
}

/* ---------- 🐚 Mistake Shells (review + redo) ---------- */
function showMistakes(){
  lastView="shells"; redoMode=false;
  const ids=Object.keys(S.mist);
  let h=header()+'<div class="backrow"><button class="btn ghost" onclick="sndPop();showHome()">🏠 Home</button>'
    +'<div class="chip">🐚 <small>Mistake Shells · '+mistUnfixed()+' to fix</small></div></div>';
  if(!ids.length){
    h+='<div class="guide"><div class="face">🧜‍♀️</div><div class="bubble">No mistake shells yet — your reef is sparkling clean! Answer questions in the Quiz Reef and any slips will wash up here. ✨</div></div>';
  } else {
    h+='<div class="guide"><div class="face">🧜‍♀️</div><div class="bubble">Read the model answer first, then tap <b>Redo</b>. Answer it right and the shell turns green! 💚</div></div>';
    ids.forEach(id=>{
      const q=QUIZ.find(x=>x.id===id); if(!q) return;   /* id-stable: survives question-bank updates */
      const m=S.mist[id]; const model=q.opts.find(o=>o.ok).s; const d=DIA[q.dia];
      h+='<div class="qcard anim'+(m.fixed?' fixedcard':'')+'"><span class="mistst">'+(m.fixed?"💚 Fixed!":"🐚 to fix")+'</span>'
        +'<div class="qtext" style="font-size:19px">'+q.q+'</div>'
        +'<div class="youpicked">Your pick last time: '+m.p+'</div>'
        +'<div class="model"><span class="tag">📝 Model answer <button class="spk" onclick="speakMist(\''+id+'\')">🔊</button></span><b>'+model+'</b></div>'
        +(d?'<div class="diabox" style="box-shadow:none;border:2px solid var(--lagoon);margin-bottom:8px"><h4>🔍 '+d.t+'</h4>'+d.h+'</div>':'')
        +(m.fixed?'':'<button class="btn coral" style="width:100%" onclick="redoQ(\''+id+'\')">Redo this question 💪</button>')
        +'</div>';
    });
  }
  $("app").innerHTML=h; window.scrollTo(0,0);
}
function speakMist(id){ const q=QUIZ.find(x=>x.id===id); if(q) speak(q.opts.find(o=>o.ok).s); }
function redoQ(id){
  const q=QUIZ.find(x=>x.id===id); if(!q) return;
  sndPop(); redoMode=true;
  quizTopic={id:"redo",name:"Fix the shell",emoji:"🐚"};
  qdeck=[q]; qIdx=0; combo=0; showQuiz();
}

/* ---------- confetti / fireworks ---------- */
let particles=[], fxRunning=false;
const FXCOLORS=["#62b5e5","#ff8a7a","#f4c35d","#7fd8b4","#3387c4","#c8a2ff"];
function fxTick(){
  const cv=$("fx"); if(!cv) return;
  const ctx=cv.getContext("2d");
  cv.width=innerWidth; cv.height=innerHeight;
  ctx.clearRect(0,0,cv.width,cv.height);
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.life--; p.rot+=p.vr;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.globalAlpha=Math.min(1,p.life/30);
    ctx.fillStyle=p.color;
    if(p.shape==="c"){ ctx.beginPath(); ctx.arc(0,0,p.s,0,7); ctx.fill(); }
    else ctx.fillRect(-p.s,-p.s/2,p.s*2,p.s);
    ctx.restore();
  });
  if(particles.length) requestAnimationFrame(fxTick); else { fxRunning=false; ctx.clearRect(0,0,cv.width,cv.height); }
}
function burst(x,y,n,speed){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, v=(0.4+Math.random())*speed;
    particles.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,g:0.12,life:50+Math.random()*40,s:3+Math.random()*4,color:pick(FXCOLORS),rot:Math.random()*6,vr:(Math.random()-0.5)*0.3,shape:Math.random()<0.5?"c":"r"});
  }
  if(!fxRunning){ fxRunning=true; requestAnimationFrame(fxTick); }
}
function confetti(){ burst(innerWidth/2, innerHeight*0.35, 45, 4); }
function fireworks(){ for(let k=0;k<4;k++){ setTimeout(()=>burst(innerWidth*(0.2+Math.random()*0.6), innerHeight*(0.2+Math.random()*0.35), 60, 5.5), k*220); } }

/* ---------- boot ---------- */
if(typeof window!=="undefined" && typeof document!=="undefined" && typeof document.getElementById==="function" && document.getElementById("app")){
  loadState(); save(); showHome();
  try{ if(typeof speechSynthesis!=="undefined") speechSynthesis.getVoices(); }catch(e){} /* warm up voice list */
  window.showHome=showHome; window.showWordTopics=showWordTopics; window.startWords=startWords;
  window.showCard=showCard; window.flipCard=flipCard; window.useWord=useWord; window.pickWord=pickWord;
  window.showQuizTopics=showQuizTopics; window.startQuiz=startQuiz; window.pickQ=pickQ;
  window.quizBack=quizBack; window.showMistakes=showMistakes; window.redoQ=redoQ; window.speakMist=speakMist;
  window.toggleTTS=toggleTTS; window.speak=speak; window.speakModel=speakModel; window.speakCurWord=speakCurWord;
  window.megaClose=megaClose; window.sndPop=sndPop;
}
if(typeof module!=="undefined" && module.exports){ module.exports={VOCAB, QUIZ, TOPICS, DIA}; }
</script>
<script>
/* ===== Jenny v3.1 桥接层（纯附加，不改任何已有存储结构） =====
   1) 今日计数芯片 + 每日目标一次性庆祝（新增键 jenny_goalcele_science 只存日期标记）
   2) 专注计时（番茄式）：每15分钟轻声两音+语音提醒，跟随全局静音 jenny_tts_on
   3) postMessage 桥：file:// 打开时 iframe 与合集主页的 localStorage 互相隔离，
      这里把今日计数/统计发给主页做 max 合并，保证任务清单照样打勾 */
(function(){
"use strict";
var SUBJECT="science", GOAL=10, ZH=false, CELE_KEY="jenny_goalcele_science";
function pad2(n){return (n<10?"0":"")+n}
function jToday(){var d=new Date();return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function soundOn(){return lsGet("jenny_tts_on")!=="0"}
function dailyCount(){try{var d=JSON.parse(lsGet("jenny_daily_v1"))||{};var t=d[jToday()];return t?Math.max(0,Math.floor(+t[SUBJECT]||0)):0}catch(e){return 0}}
function toolStats(){try{var S=JSON.parse(lsGet("jenny_science_explorer"));if(!S)return null;var c=0,q=S.quiz||{};for(var k in q)c+=(q[k]&&+q[k].c)||0;var f=0,mi=S.mist||{};for(var k2 in mi)if(mi[k2]&&mi[k2].fixed)f++;return {xp:Math.max(0,+S.xp||0),correct:c,answered:Math.max(0,+S.done||0),fixed:f}}catch(e){return null}}
/* --- 独立小音效（全局静音同样生效） --- */
var _jac=null;
function jTone(f,at,dur,vol){if(!soundOn())return;try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!_jac)_jac=new C();if(_jac.state==="suspended")_jac.resume();var c=_jac,o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(0.0001,c.currentTime+at);g.gain.exponentialRampToValueAtTime(vol||0.12,c.currentTime+at+0.02);g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+at+dur);o.connect(g);g.connect(c.destination);o.start(c.currentTime+at);o.stop(c.currentTime+at+dur+0.06)}catch(e){}}
function jChime(){jTone(880,0,0.18);jTone(1318.5,0.16,0.3)}
function jCeleChime(){[523.25,659.25,783.99,1046.5,1318.5].forEach(function(f,i){jTone(f,i*0.09,0.28,0.13)})}
function jSpeak(text){if(!soundOn())return;try{if(!("speechSynthesis" in window))return;var u=new SpeechSynthesisUtterance(text);u.lang=ZH?"zh-CN":"en-US";try{var vs=speechSynthesis.getVoices()||[],best=null,bs=-1;for(var i=0;i<vs.length;i++){var v=vs[i];if(!v||!v.lang)continue;var vl=String(v.lang).toLowerCase();if(vl.indexOf(ZH?"zh":"en")!==0)continue;var sc=(/premium/i.test(v.name||"")?4:0)+(/enhanced|\u589e\u5f3a/i.test(v.name||"")?3:0)+(/siri/i.test(v.name||"")?2:0)+(v.localService?1:0);if(sc>bs){bs=sc;best=v}}if(ZH&&!best)return;if(best)u.voice=best}catch(e){}u.rate=0.95;u.pitch=1.05;speechSynthesis.speak(u)}catch(e){}}
function jConfetti(){try{if(typeof fireworks==="function"){fireworks();return}}catch(e){}try{if(typeof confettiBurst==="function"){confettiBurst();return}}catch(e){}try{if(typeof confetti==="function"){confetti();return}}catch(e){}try{if(typeof miniConfetti==="function")miniConfetti()}catch(e){}}
/* --- 芯片 UI（小、淡、不挡内容、不可点击） --- */
var box=null,cnt=null,tim=null;
function ensureChips(){
  if(box||typeof document==="undefined"||!document.body)return;
  try{
    var st=document.createElement("style");
    st.textContent="#jennyChips{position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;gap:6px;pointer-events:none;align-items:center}"
      +"#jennyChips .jc{background:rgba(255,255,255,.93);border:1.5px solid #9fd9d4;border-radius:999px;padding:2px 12px;font-size:12px;font-weight:800;color:#0a8a86;box-shadow:0 2px 8px rgba(10,138,134,.14);white-space:nowrap}"
      +"#jennyChips .jt{color:#7aa8a5;font-weight:650;border-color:#cfe8e5;background:rgba(255,255,255,.82)}"
      +"@keyframes jcPulse{0%{transform:scale(1)}40%{transform:scale(1.2)}100%{transform:scale(1)}}"
      +"#jennyChips .pulse{animation:jcPulse .7s ease 3}";
    document.head.appendChild(st);
    box=document.createElement("div");box.id="jennyChips";
    cnt=document.createElement("div");cnt.className="jc";
    tim=document.createElement("div");tim.className="jc jt";
    box.appendChild(cnt);box.appendChild(tim);
    document.body.appendChild(box);
  }catch(e){}
}
function pulse(el){if(!el||!el.classList)return;try{el.classList.remove("pulse");void el.offsetWidth;el.classList.add("pulse")}catch(e){}}
function chipText(n){
  if(n<GOAL)return ZH?("\ud83d\udcdd \u4eca\u65e5 "+n+"/"+GOAL):("\ud83d\udcdd Today: "+n+"/"+GOAL);
  return ZH?("\ud83c\udf1f \u76ee\u6807\u5b8c\u6210 \u00b7 \u4eca\u65e5 "+n):("\ud83c\udf1f Goal done \u00b7 "+n+" today");
}
/* --- 每日目标庆祝（同一天只放一次，标记存本工具自己的键里） --- */
function maybeCelebrate(n){
  if(n<GOAL)return;
  var t=jToday();
  if(lsGet(CELE_KEY)===t)return;
  lsSet(CELE_KEY,t);
  jCeleChime();jConfetti();pulse(cnt);
  jSpeak(ZH?"\u4eca\u65e5\u76ee\u6807\u5b8c\u6210\uff01\u4f60\u53ef\u4ee5\u7ee7\u7eed\u505a\uff0c\u8d62\u66f4\u591a\u79ef\u5206\uff01":"Daily goal complete! Keep going to earn bonus points!");
}
/* --- postMessage 同步（只在被 iframe 嵌入时发送；try/catch 保护） --- */
function postMsg(m){try{if(typeof window==="undefined"||!window.parent||window.parent===window)return;window.parent.postMessage(m,"*")}catch(e){}}
var lastDaily=-1,lastStatsStr="",lastStatsAt=0;
function syncOut(n){
  if(n!==lastDaily){lastDaily=n;postMsg({t:"jenny_daily",subject:SUBJECT,date:jToday(),count:n})}
  var st=toolStats();
  if(st){
    var s=JSON.stringify(st),now=Date.now();
    if(s!==lastStatsStr&&now-lastStatsAt>=2000){lastStatsStr=s;lastStatsAt=now;postMsg({t:"jenny_stats",subject:SUBJECT,date:jToday(),statsPatch:st})}
  }
}
/* --- 专注计时（本次打开累计，不存盘、不打扰） --- */
var t0=Date.now(),lastMile=0;
function fmtSec(s){var m=Math.floor(s/60);return pad2(m)+":"+pad2(s%60)}
function focusMsg(min){
  if(ZH){
    if(min===15)return "\u5df2\u7ecf\u4e13\u6ce815\u5206\u949f\u5566\uff0c\u4f60\u771f\u68d2\uff01\u559d\u53e3\u6c34\uff0c\u4f11\u606f\u4e00\u4e0b\u773c\u775b\u518d\u7ee7\u7eed\u5427\uff01";
    if(min===30)return "\u54c7\uff0c\u8fde\u7eed\u4e13\u6ce830\u5206\u949f\u5566\uff0c\u8d85\u7ea7\u4e86\u4e0d\u8d77\uff01\u7ad9\u8d77\u6765\u4f38\u5c55\u4e00\u4e0b\u518d\u7ee7\u7eed\u5427\uff01";
    if(min===45)return "\u4f60\u5df2\u7ecf\u4e13\u6ce845\u5206\u949f\u5566\uff0c\u662f\u4e13\u6ce8\u5c0f\u51a0\u519b\uff01\u8bb0\u5f97\u8ba9\u773c\u775b\u4f11\u606f\u4e00\u4e0b\u54e6\uff01";
    return "\u5df2\u7ecf\u4e13\u6ce8"+min+"\u5206\u949f\u5566\uff0c\u592a\u5389\u5bb3\u4e86\uff01\u4f11\u606f\u4e00\u4e0b\u518d\u7ee7\u7eed\u5427\uff01";
  }
  if(min===15)return "You have focused for 15 minutes. Amazing! Take a sip of water and keep going!";
  if(min===30)return "Wow, 30 minutes of focus! Incredible! Stand up and stretch, then keep going!";
  if(min===45)return "45 minutes of focus. You are a focus champion! Remember to rest your eyes!";
  return min+" minutes of focus. Amazing! Take a little break, then keep going!";
}
function tick(){
  ensureChips();
  var n=dailyCount();
  if(cnt)cnt.textContent=chipText(n);
  maybeCelebrate(n);
  syncOut(n);
  var sec=Math.max(0,Math.floor((Date.now()-t0)/1000));
  if(tim)tim.textContent="\u23f1 "+fmtSec(sec);
  var mile=Math.floor(sec/900);
  if(mile>lastMile){lastMile=mile;jChime();pulse(tim);jSpeak(focusMsg(mile*15))}
}
try{window.__jennyBridgeTick=tick}catch(e){}
tick();
try{setInterval(tick,1000)}catch(e){}
})();
</script>
<script>
/* iOS语音解锁：首次触摸播放一个静音utterance */
(function(){function unlock(){try{var u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u);}catch(e){}document.removeEventListener("pointerdown",unlock);}
document.addEventListener("pointerdown",unlock,{once:true});})();
</script></body>
