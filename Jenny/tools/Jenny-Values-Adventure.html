<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Jenny & Mochi's Values Adventure</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Baloo+2:wght@500;700&display=swap');
:root{
  --tiffany:#0ABAB5;--tiffany-light:#E0F7F6;--tiffany-dark:#089E9A;
  --pink:#FFB5C2;--pink-light:#FFE4E9;
  --yellow:#FFD93D;--yellow-light:#FFF8E1;
  --coral:#FF6B6B;--green:#6BCB77;--purple:#9B59B6;--blue:#5DADE2;
  --text:#2C3E50;--bg:#F0FFFE;--gray:#95A5A6;
}
html,body{height:100%;overflow:hidden;font-family:'Quicksand',sans-serif;background:var(--bg);color:var(--text);font-size:18px;}

/* ===== SCREENS ===== */
.screen{display:none;width:100%;height:100%;position:absolute;top:0;left:0;flex-direction:column;align-items:center;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.screen.active{display:flex;}
.screen.fade-in{animation:fadeIn 0.5s ease;}

/* ===== TOP BAR (Duolingo style) ===== */
.top-bar{width:100%;max-width:600px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--bg);z-index:10;}
.top-bar .exit-btn{width:36px;height:36px;border-radius:50%;border:2px solid #DDD;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.2em;color:#999;transition:all 0.2s;}
.top-bar .exit-btn:hover{border-color:var(--coral);color:var(--coral);}
.top-bar .progress-wrap{flex:1;height:14px;background:#E8E8E8;border-radius:7px;overflow:hidden;}
.top-bar .progress-fill{height:100%;background:linear-gradient(90deg,var(--tiffany),var(--green));border-radius:7px;transition:width 0.5s ease;}
.top-bar .hearts{display:flex;align-items:center;gap:2px;font-size:0.9em;color:var(--coral);font-weight:700;}
.top-bar .xp{font-size:0.85em;color:var(--yellow);font-weight:700;background:var(--yellow-light);padding:2px 8px;border-radius:10px;}

/* ===== WELCOME ===== */
#welcome{background:linear-gradient(180deg,#E0F7F6 0%,#F0FFFE 40%,#FFF8E1 100%);justify-content:center;text-align:center;padding:20px;}
#welcome h1{font-family:'Baloo 2',cursive;font-size:2em;color:var(--tiffany-dark);margin:10px 0 5px;text-shadow:2px 2px 0 rgba(10,186,181,0.12);}
#welcome .subtitle{font-size:1em;color:#666;margin-bottom:20px;line-height:1.5;}
.btn-primary{background:var(--tiffany);color:#fff;border:none;padding:14px 44px;border-radius:50px;font-family:'Baloo 2',cursive;font-size:1.2em;cursor:pointer;box-shadow:0 4px 15px rgba(10,186,181,0.3);transition:all 0.2s;}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(10,186,181,0.4);}
.btn-primary:active{transform:translateY(1px);}

/* ===== MAP / CHAPTER SELECT ===== */
#map{background:linear-gradient(180deg,var(--tiffany-light) 0%,var(--bg) 100%);padding:20px;padding-bottom:40px;}
#map .map-header{text-align:center;margin:10px 0 15px;}
#map h2{font-family:'Baloo 2',cursive;font-size:1.6em;color:var(--tiffany-dark);}
#map .stats-row{display:flex;justify-content:center;gap:15px;margin:8px 0 15px;font-size:0.9em;}
#map .stat{background:#fff;padding:5px 14px;border-radius:20px;box-shadow:0 2px 6px rgba(0,0,0,0.05);font-weight:600;}
.story-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:500px;margin:0 auto;width:100%;}
.story-card{background:#fff;border-radius:18px;padding:16px 12px;text-align:center;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,0.06);border:2.5px solid transparent;transition:all 0.2s;position:relative;overflow:hidden;}
.story-card:hover{transform:translateY(-3px);border-color:var(--tiffany);}
.story-card.completed{border-color:var(--green);background:#F8FFF8;}
.story-card.completed::after{content:'⭐';position:absolute;top:8px;right:8px;font-size:1.1em;}
.story-card .card-emoji{font-size:2.2em;margin-bottom:6px;display:block;}
.story-card .card-title{font-family:'Baloo 2',cursive;font-size:1.05em;color:var(--text);line-height:1.2;}
.story-card .card-tag{font-size:0.8em;color:#999;margin-top:4px;display:block;}

/* ===== STORY PLAY SCREEN ===== */
#play{background:var(--bg);padding:0;flex-direction:column;}
.play-body{width:100%;max-width:600px;margin:0 auto;padding:0 16px 30px;flex:1;display:flex;flex-direction:column;}
.scene-area{width:100%;margin:10px auto;text-align:center;min-height:180px;display:flex;align-items:center;justify-content:center;}
.dialogue-box{background:#fff;border-radius:20px;padding:18px 22px;box-shadow:0 3px 12px rgba(0,0,0,0.06);margin-bottom:12px;text-align:center;font-size:1.1em;line-height:1.7;}
.dialogue-box .speaker{font-weight:700;color:var(--tiffany-dark);}
.dialogue-box .highlight{color:var(--coral);font-weight:700;}

/* ===== INTERACTION TYPES ===== */
/* Multiple Choice */
.interact-area{display:flex;flex-direction:column;gap:10px;margin-top:auto;}
.mc-btn{background:#fff;border:2.5px solid #E0E0E0;border-radius:14px;padding:13px 16px;font-family:'Quicksand',sans-serif;font-size:1em;font-weight:600;color:var(--text);cursor:pointer;transition:all 0.2s;text-align:left;display:flex;align-items:center;gap:10px;}
.mc-btn:hover{border-color:var(--tiffany);background:var(--tiffany-light);}
.mc-btn .mc-icon{font-size:1.2em;width:28px;text-align:center;flex-shrink:0;}
.mc-btn.correct{border-color:var(--green);background:#E8F8E8;animation:popIn 0.3s ease;}
.mc-btn.wrong{border-color:var(--coral);background:#FFE8E8;animation:shake 0.4s ease;}
.mc-btn:disabled{cursor:default;}

/* True/False (Thumbs) */
.tf-row{display:flex;gap:15px;justify-content:center;}
.tf-btn{width:100px;height:100px;border-radius:20px;border:3px solid #E0E0E0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;transition:all 0.2s;font-size:2em;}
.tf-btn span{font-size:0.35em;font-weight:700;color:#666;}
.tf-btn:hover{border-color:var(--tiffany);transform:scale(1.05);}
.tf-btn.correct{border-color:var(--green);background:#E8F8E8;animation:popIn 0.3s;}
.tf-btn.wrong{border-color:var(--coral);background:#FFE8E8;animation:shake 0.4s;}

/* Sort / Rank */
.sort-area{display:flex;flex-direction:column;gap:8px;}
.sort-item{background:#fff;border:2px solid #E0E0E0;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:grab;transition:all 0.2s;user-select:none;}
.sort-item:active{cursor:grabbing;box-shadow:0 4px 15px rgba(0,0,0,0.1);}
.sort-item .sort-num{width:24px;height:24px;border-radius:50%;background:var(--tiffany-light);display:flex;align-items:center;justify-content:center;font-size:0.8em;font-weight:700;color:var(--tiffany-dark);}
.sort-item.dragging{opacity:0.5;border-color:var(--tiffany);}
.sort-item.correct-pos{border-color:var(--green);background:#F0FFF0;}
.sort-item.wrong-pos{border-color:var(--coral);background:#FFF0F0;}

/* Multi-select (tap all correct) */
.multi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.multi-btn{background:#fff;border:2.5px solid #E0E0E0;border-radius:12px;padding:14px 12px;text-align:center;font-size:1em;font-weight:600;cursor:pointer;transition:all 0.2s;}
.multi-btn.selected{border-color:var(--tiffany);background:var(--tiffany-light);}
.multi-btn.correct-sel{border-color:var(--green);background:#E8F8E8;}
.multi-btn.wrong-sel{border-color:var(--coral);background:#FFE8E8;}
.multi-btn.missed{border-color:var(--yellow);background:var(--yellow-light);}

/* Submit button for multi-select and sort */
.submit-btn{background:var(--tiffany);color:#fff;border:none;padding:12px 30px;border-radius:50px;font-family:'Quicksand',sans-serif;font-size:1em;font-weight:700;cursor:pointer;margin:12px auto 0;display:block;transition:all 0.2s;opacity:0.5;pointer-events:none;}
.submit-btn.ready{opacity:1;pointer-events:auto;}
.submit-btn:hover{transform:translateY(-2px);}

/* Feedback bar */
.feedback{display:none;padding:16px 20px;border-radius:16px;margin-top:12px;font-weight:600;font-size:0.95em;line-height:1.5;animation:slideUp 0.4s ease;}
.feedback.show{display:block;}
.feedback.good{background:#E8F8E8;border:2px solid var(--green);color:#2E7D32;}
.feedback.bad{background:#FFE8E8;border:2px solid var(--coral);color:#C62828;}
.feedback .fb-title{font-family:'Baloo 2',cursive;font-size:1.1em;margin-bottom:4px;}
.feedback .fb-text{font-weight:500;font-size:1em;color:#555;}

/* Continue button */
.continue-btn{background:var(--green);color:#fff;border:none;padding:14px 0;border-radius:14px;font-family:'Quicksand',sans-serif;font-size:1.05em;font-weight:700;cursor:pointer;margin-top:12px;width:100%;transition:all 0.2s;display:none;}
.continue-btn.show{display:block;animation:fadeIn 0.4s ease;}
.continue-btn:hover{filter:brightness(1.05);transform:translateY(-1px);}
.continue-btn.btn-finish{background:var(--yellow);color:var(--text);}

/* ===== CHAPTER COMPLETE ===== */
#complete{background:linear-gradient(180deg,#FFF8E1 0%,var(--tiffany-light) 100%);justify-content:center;text-align:center;padding:30px 20px;}
#complete h2{font-family:'Baloo 2',cursive;font-size:1.8em;color:var(--tiffany-dark);margin:10px 0;}
.complete-stars{font-size:2.5em;margin:10px 0;letter-spacing:5px;}
.complete-msg{font-size:1em;color:#555;line-height:1.6;max-width:350px;margin:10px auto 20px;}
.complete-xp{font-size:1.3em;font-weight:700;color:var(--yellow);margin-bottom:15px;}

/* ===== ANIMATIONS ===== */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{0%{transform:scale(0.95)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes heartbeat{0%,100%{transform:scale(1)}15%{transform:scale(1.2)}30%{transform:scale(1)}}
@keyframes sparkle{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes confettiFall{0%{transform:translateY(-10px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
.float{animation:float 2.5s ease-in-out infinite;}
.bounce{animation:bounce 1s ease infinite;}

/* Stars burst */
.star-burst{position:fixed;pointer-events:none;z-index:999;}
.star-particle{position:absolute;animation:starFly 0.8s ease-out forwards;}
@keyframes starFly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0)}}

/* Confetti */
.confetti-piece{position:fixed;width:10px;height:10px;top:-10px;z-index:999;animation:confettiFall 2.5s ease-in forwards;}

/* Hearts animation */
@keyframes heartBreak{0%{transform:scale(1)}30%{transform:scale(1.3)}100%{transform:scale(0);opacity:0}}
.heart-break{animation:heartBreak 0.5s ease forwards;}

/* XP pop */
.xp-pop{position:fixed;pointer-events:none;z-index:999;font-family:'Baloo 2',cursive;font-size:1.3em;color:var(--yellow);font-weight:700;animation:xpFloat 1s ease-out forwards;}
@keyframes xpFloat{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}

/* Mobile */
@media(max-width:480px){
  #welcome h1{font-size:1.6em;}
  .story-grid{grid-template-columns:1fr 1fr;gap:10px;}
  .story-card{padding:12px 8px;}
  .story-card .card-emoji{font-size:1.8em;}
  .dialogue-box{font-size:1em;padding:14px 16px;}
  .mc-btn{font-size:0.9em;padding:11px 12px;}
  .scene-area{min-height:150px;}
}
</style>
</head>
<body>

<div class="screen active" id="welcome">
  <svg width="240" height="180" viewBox="0 0 240 180" class="float" style="margin-top:10px">

    <g transform="translate(50,15)">

    <!-- Sparkles -->
    <circle cx="20" cy="30" r="3" fill="var(--yellow)" style="animation:sparkle 2s infinite"/>

  </svg>
  <h1>Jenny & Mochi's<br>Values Adventure</h1>
  <p class="subtitle">Help Jenny and her bunny Mochi<br>learn to make great choices!</p>
  <button class="btn-primary" onclick="showScreen('map')">Start Adventure! 🌟</button>
</div>

<!-- ===== MAP ===== -->
<div class="screen" id="map">
  <div class="map-header">
    <h2>🗺️ Story Map</h2>
    <div class="stats-row">
      <span class="stat" id="mapXP">⚡ 0 XP</span>
      <span class="stat" id="mapStars">⭐ 0/11</span>
    </div>
  </div>
  <div class="story-grid" id="storyGrid"></div>
</div>

<!-- ===== PLAY ===== -->
<div class="screen" id="play">
  <div class="top-bar">
    <div class="exit-btn" onclick="exitStory()">✕</div>
    <div class="progress-wrap"><div class="progress-fill" id="playProgress"></div></div>
    <div class="hearts" id="playHearts">❤️5</div>
    <div class="xp" id="playXP">⚡0</div>
  </div>
  <div class="play-body">
    <div class="scene-area" id="sceneArea"></div>
    <div class="dialogue-box" id="dialogueBox"></div>
    <div class="interact-area" id="interactArea"></div>
    <div class="feedback" id="feedback"><div class="fb-title"></div><div class="fb-text"></div></div>
    <button class="continue-btn" id="continueBtn" onclick="nextStep()">CONTINUE</button>
  </div>
</div>

<!-- ===== COMPLETE ===== -->
<div class="screen" id="complete">
  <svg width="100" height="80" viewBox="0 0 100 80" class="bounce" style="animation-duration:2s">
    <text x="50" y="55" text-anchor="middle" font-size="50">🏆</text>
  </svg>
  <h2 id="completeTitle">Great Job!</h2>
  <div class="complete-stars" id="completeStars"></div>
  <div class="complete-xp" id="completeXP"></div>
  <p class="complete-msg" id="completeMsg"></p>

<script>
// ===== GAME STATE =====
const G = {
  totalXP: 0,
  hearts: 5,
  sessionXP: 0,
  currentStory: null,
  currentStep: 0,
  completed: {},
  storyHearts: 5
};

// ===== 11 STORIES =====
const STORIES = [
  {id:'honesty', emoji:'💎', title:'The Shiny Sticker', tag:'Honesty', color:'#FFD93D'},
  {id:'greet', emoji:'👋', title:'Good Morning!', tag:'Manners & Greetings', color:'#FFB5C2'},
  {id:'focus', emoji:'🎯', title:'Eyes on Teacher', tag:'Focus in Class', color:'#5DADE2'},
  {id:'helping', emoji:'🤝', title:'Helping Hands', tag:'Being Helpful', color:'#6BCB77'},
  {id:'truth', emoji:'🪞', title:'The Broken Vase', tag:'Telling the Truth', color:'#9B59B6'},
  {id:'kind', emoji:'💗', title:'The New Girl', tag:'Kindness & Friends', color:'#FF6B6B'},
  {id:'think', emoji:'🧠', title:'Stop & Think', tag:'Think Before You Act', color:'#0ABAB5'},
  {id:'share', emoji:'🍪', title:'Enough for All', tag:'Sharing', color:'#F0C420'},
  {id:'patience', emoji:'⏳', title:'My Turn Will Come', tag:'Patience', color:'#AF7AC5'},
  {id:'respect', emoji:'🙏', title:'Not Mine to Take', tag:'Respecting Others', color:'#5DADE2'},
  {id:'friendship', emoji:'🤗', title:'Real Friends', tag:'True Friendship', color:'#FF8A65'}
];

// Step types: 'narrate', 'mc' (multiple choice), 'tf' (true/false), 'multi' (select all correct), 'sort' (rank order)
const STORY_DATA = {
  // ===== 1. HONESTY =====
  honesty: [
    {type:'narrate', text:'After class, Jenny sees a <span class="highlight">sparkly sticker</span> on Ms Lee\'s desk. It\'s the prettiest one she\'s ever seen! ✨', scene:'classroom'},
    {type:'narrate', text:'<span class="speaker">Mochi:</span> "Ooh! That sticker is SO pretty! I really want one..."', scene:'mochi_excited'},
    {type:'mc', text:'Nobody is watching. What should Jenny do?',
      options:['Take it quickly — no one will see!','Leave it alone — it\'s not mine','Ask Ms Lee nicely if I can earn one'],
      correct:[1,2], explain_good:'Even when no one is watching, being honest matters! Asking politely is brave and right. 💪',
      explain_bad:'Taking something that isn\'t yours — even something small — is wrong. It doesn\'t matter if no one sees. YOU know.'},
    {type:'tf', text:'Is this TRUE or FALSE? "It\'s okay to take something if it\'s very small and no one notices."',
      answer:false, explain_good:'Size doesn\'t matter — taking without asking is always wrong, even a tiny eraser! ✨',
      explain_bad:'Nope! Small or big, if it\'s not yours, don\'t take it. Always ask first!'},
    {type:'mc', text:'Jenny asks Ms Lee politely. Ms Lee says: "This sticker is for honest students — and you just showed me you ARE one!" What did Jenny learn?',
      options:['Being honest gets you better rewards than sneaking','It\'s only wrong if you get caught','Stickers aren\'t that nice anyway'],
      correct:[0], explain_good:'Exactly! Honesty brings REAL rewards — trust, respect, and feeling proud of yourself!',
      explain_bad:'The real lesson is: being honest feels GOOD inside and people trust you more!'},
    {type:'multi', text:'Which of these are HONEST actions? Tap ALL the right ones:',

// ===== SCENE SVG GENERATOR =====

// ===== RENDER MAP =====
function renderMap(){
  const grid = document.getElementById('storyGrid');
  grid.innerHTML = '';
  STORIES.forEach(s=>{
    const done = G.completed[s.id];
    const card = document.createElement('div');
    card.className = 'story-card' + (done?' completed':'');
    card.innerHTML = `<span class="card-emoji">${s.emoji}</span><span class="card-title">${s.title}</span><span class="card-tag">${s.tag}</span>`;
    card.onclick = ()=> startStory(s.id);
    grid.appendChild(card);
  });
  document.getElementById('mapXP').textContent = `⚡ ${G.totalXP} XP`;
  document.getElementById('mapStars').textContent = `⭐ ${Object.keys(G.completed).length}/11`;
}

// ===== SCREEN NAV =====
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active','fade-in'));
  document.getElementById(id).classList.add('active','fade-in');
  if(id==='map') renderMap();
}

// ===== START STORY =====
function startStory(id){
  G.currentStory = id;
  G.currentStep = 0;
  G.storyHearts = 5;
  G.sessionXP = 0;
  showScreen('play');
  renderPlayStep();
}

function exitStory(){
  showScreen('map');
}

// ===== RENDER PLAY STEP =====
function renderPlayStep(){
  const steps = STORY_DATA[G.currentStory];
  const step = steps[G.currentStep];
  const total = steps.length;
  const pct = ((G.currentStep+1)/total)*100;

  // Update top bar
  document.getElementById('playProgress').style.width = pct+'%';
  document.getElementById('playHearts').innerHTML = '❤️'+G.storyHearts;
  document.getElementById('playXP').textContent = '⚡'+G.sessionXP;

  // Scene
  const sceneArea = document.getElementById('sceneArea');
  sceneArea.innerHTML = getSceneSVG(step.scene||'mochi_proud');

  // Dialogue
  document.getElementById('dialogueBox').innerHTML = step.text;

  // Clear interaction and feedback
  const ia = document.getElementById('interactArea');
  ia.innerHTML = '';
  const fb = document.getElementById('feedback');
  fb.classList.remove('show','good','bad');
  const cb = document.getElementById('continueBtn');
  cb.classList.remove('show','btn-finish');
  cb.textContent = 'CONTINUE';

  // Render interaction based on type
  switch(step.type){
    case 'narrate':
      if(G.currentStep === total-1){
        cb.textContent = '🎉 FINISH STORY';
        cb.classList.add('btn-finish');
      }
      cb.classList.add('show');
      break;
    case 'mc':
      renderMC(step, ia);
      break;
    case 'tf':
      renderTF(step, ia);
      break;
    case 'multi':
      renderMulti(step, ia);
      break;
    case 'sort':
      renderSort(step, ia);
      break;
  }

  // Scroll to top
  document.getElementById('play').scrollTop = 0;
}

// ===== MC =====
function renderMC(step, container){
  step.options.forEach((opt,i)=>{
    const btn = document.createElement('button');
    btn.className = 'mc-btn';
    btn.innerHTML = `<span class="mc-icon">${['🅰️','🅱️','🅲️','🅳️'][i]}</span>${opt}`;
    btn.onclick = ()=> handleMC(i, step, container);
    container.appendChild(btn);
  });
}

function handleMC(idx, step, container){
  const btns = container.querySelectorAll('.mc-btn');
  const isCorrect = Array.isArray(step.correct) ? step.correct.includes(idx) : step.correct===idx;

  btns.forEach((b,i)=>{
    b.disabled = true;
    if(i===idx) b.classList.add(isCorrect?'correct':'wrong');
    // Show correct answers
    const correctArr = Array.isArray(step.correct)?step.correct:[step.correct];
    if(!isCorrect && correctArr.includes(i)){
      setTimeout(()=>b.classList.add('correct'),500);
    }
  });

  showFeedback(isCorrect, step);
}

// ===== TF =====
function renderTF(step, container){
  const row = document.createElement('div');
  row.className = 'tf-row';

  const trueBtn = document.createElement('button');
  trueBtn.className = 'tf-btn';
  trueBtn.innerHTML = '👍<span>TRUE</span>';
  trueBtn.onclick = ()=> handleTF(true, step, row);

  const falseBtn = document.createElement('button');
  falseBtn.className = 'tf-btn';
  falseBtn.innerHTML = '👎<span>FALSE</span>';
  falseBtn.onclick = ()=> handleTF(false, step, row);

  row.appendChild(trueBtn);
  row.appendChild(falseBtn);
  container.appendChild(row);
}

function handleTF(answer, step, row){
  const btns = row.querySelectorAll('.tf-btn');
  const isCorrect = answer === step.answer;

  btns.forEach(b=>b.disabled=true);
  const idx = answer ? 0 : 1;
  btns[idx].classList.add(isCorrect?'correct':'wrong');
  if(!isCorrect) btns[1-idx].classList.add('correct');

  showFeedback(isCorrect, step);
}

// ===== MULTI SELECT =====
function renderMulti(step, container){
  const grid = document.createElement('div');
  grid.className = 'multi-grid';
  const selected = new Set();

  step.options.forEach((opt,i)=>{
    const btn = document.createElement('button');
    btn.className = 'multi-btn';
    btn.textContent = opt;
    btn.onclick = ()=>{
      if(btn.classList.contains('selected')){
        btn.classList.remove('selected');
        selected.delete(i);
      } else {
        btn.classList.add('selected');
        selected.add(i);
      }
      subBtn.classList.toggle('ready', selected.size > 0);
    };
    grid.appendChild(btn);
  });
  container.appendChild(grid);

  const subBtn = document.createElement('button');
  subBtn.className = 'submit-btn';
  subBtn.textContent = 'CHECK ✓';
  subBtn.onclick = ()=> handleMulti(selected, step, grid, subBtn);
  container.appendChild(subBtn);
}

function handleMulti(selected, step, grid, subBtn){
  subBtn.style.display = 'none';
  const btns = grid.querySelectorAll('.multi-btn');
  const correctSet = new Set(step.correct);
  let allRight = true;

  btns.forEach((b,i)=>{
    b.style.pointerEvents = 'none';
    if(selected.has(i) && correctSet.has(i)){
      b.classList.add('correct-sel');
    } else if(selected.has(i) && !correctSet.has(i)){
      b.classList.add('wrong-sel');
      allRight = false;
    } else if(!selected.has(i) && correctSet.has(i)){
      b.classList.add('missed');
      allRight = false;
    }
  });

  showFeedback(allRight, step, true);
}

// ===== SORT =====
function renderSort(step, container){
  const area = document.createElement('div');
  area.className = 'sort-area';

  // Shuffle items
  let indices = step.items.map((_,i)=>i);
  for(let i=indices.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [indices[i],indices[j]]=[indices[j],indices[i]];
  }

  indices.forEach((origIdx,pos)=>{
    const item = document.createElement('div');
    item.className = 'sort-item';
    item.draggable = true;
    item.dataset.origIdx = origIdx;
    item.innerHTML = `<span class="sort-num">${pos+1}</span>${step.items[origIdx]}`;

    item.addEventListener('dragstart', e=>{
      e.dataTransfer.setData('text/plain', pos);
      item.classList.add('dragging');
    });
    item.addEventListener('dragend', ()=>item.classList.remove('dragging'));
    item.addEventListener('dragover', e=>e.preventDefault());
    item.addEventListener('drop', e=>{
      e.preventDefault();
      const fromPos = parseInt(e.dataTransfer.getData('text/plain'));
      const toPos = [...area.children].indexOf(item);
      if(fromPos !== toPos){
        const items = [...area.children];
        const movedItem = items[fromPos];
        if(fromPos < toPos) area.insertBefore(movedItem, item.nextSibling);
        else area.insertBefore(movedItem, item);
        updateSortNums(area);
      }
    });

    // Touch support
    item.addEventListener('touchstart', e=>{
      item._touchY = e.touches[0].clientY;
      item.classList.add('dragging');
    });
    item.addEventListener('touchmove', e=>{
      e.preventDefault();
      const touch = e.touches[0];
      const items = [...area.children];
      const idx = items.indexOf(item);
      const dy = touch.clientY - item._touchY;
      if(Math.abs(dy) > 40){
        if(dy > 0 && idx < items.length-1){
          area.insertBefore(items[idx+1], item);
          item._touchY = touch.clientY;
        } else if(dy < 0 && idx > 0){
          area.insertBefore(item, items[idx-1]);
          item._touchY = touch.clientY;
        }
        updateSortNums(area);
      }
    },{passive:false});
    item.addEventListener('touchend', ()=>item.classList.remove('dragging'));

    area.appendChild(item);
  });
  container.appendChild(area);

  const subBtn = document.createElement('button');
  subBtn.className = 'submit-btn ready';
  subBtn.textContent = 'CHECK ORDER ✓';
  subBtn.onclick = ()=> handleSort(step, area, subBtn);
  container.appendChild(subBtn);
}

function updateSortNums(area){
  [...area.children].forEach((item,i)=>{
    item.querySelector('.sort-num').textContent = i+1;
  });
}

function handleSort(step, area, subBtn){
  subBtn.style.display = 'none';
  const items = [...area.children];
  let allCorrect = true;

  items.forEach((item,pos)=>{
    const origIdx = parseInt(item.dataset.origIdx);
    const correctPos = step.correctOrder.indexOf(origIdx);
    if(correctPos === pos){
      item.classList.add('correct-pos');
    } else {
      item.classList.add('wrong-pos');
      allCorrect = false;
    }
    item.draggable = false;
    item.style.pointerEvents = 'none';
  });

  showFeedback(allCorrect, step, true);
}

// ===== FEEDBACK =====
function showFeedback(isCorrect, step, isMultiOrSort=false){
  const fb = document.getElementById('feedback');
  const title = fb.querySelector('.fb-title');
  const text = fb.querySelector('.fb-text');

  if(isCorrect){
    G.sessionXP += 10;
    fb.className = 'feedback show good';
    title.textContent = ['🎉 Awesome!','💪 Great job!','✨ Perfect!','🌟 You got it!'][Math.floor(Math.random()*4)];
    text.textContent = step.explain_good || step.explain || '';
    spawnStars();
    showXPPop('+10 XP');
  } else {
    G.storyHearts = Math.max(0, G.storyHearts-1);
    fb.className = 'feedback show bad';
    title.textContent = ['🤔 Not quite...','💭 Think again...','Hmm...'][Math.floor(Math.random()*3)];
    text.textContent = step.explain_bad || step.explain || '';
    animateHeartLoss();
  }

  // Update top bar
  document.getElementById('playHearts').innerHTML = '❤️'+G.storyHearts;
  document.getElementById('playXP').textContent = '⚡'+G.sessionXP;

  // Show continue
  const cb = document.getElementById('continueBtn');
  setTimeout(()=>{
    cb.classList.add('show');
    cb.scrollIntoView({behavior:'smooth',block:'nearest'});
  }, 600);
}

// ===== NEXT STEP =====
function nextStep(){
  const steps = STORY_DATA[G.currentStory];
  G.currentStep++;
  if(G.currentStep >= steps.length){
    finishStory();
  } else {
    renderPlayStep();
  }
}

// ===== FINISH STORY =====
function finishStory(){
  G.completed[G.currentStory] = true;
  G.totalXP += G.sessionXP;

  // Calculate stars
  const maxHearts = 5;
  const stars = G.storyHearts >= 5 ? 3 : G.storyHearts >= 3 ? 2 : 1;

  document.getElementById('completeTitle').textContent = ['Good effort!','Great job!','PERFECT! 🏆'][stars-1];
  document.getElementById('completeStars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3-stars);
  document.getElementById('completeXP').textContent = `+${G.sessionXP} XP earned!`;

  const storyInfo = STORIES.find(s=>s.id===G.currentStory);
  document.getElementById('completeMsg').textContent = `You completed "${storyInfo.title}"! ${stars===3?'No mistakes — incredible!':stars===2?'Almost perfect — keep it up!':'Good try — play again to do even better!'}`;

  showScreen('complete');
  launchConfetti();
}

// ===== EFFECTS =====
function spawnStars(){
  for(let i=0;i<5;i++){
    const el = document.createElement('div');
    el.className = 'star-burst';
    el.style.left = (Math.random()*60+20)+'%';
    el.style.top = (Math.random()*30+40)+'%';
    el.innerHTML = `<span class="star-particle" style="--tx:${(Math.random()-0.5)*80}px;--ty:${-20-Math.random()*60}px;font-size:${1+Math.random()}em">${['⭐','✨','🌟','💫'][i%4]}</span>`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),900);
  }
}

function showXPPop(text){
  const el = document.createElement('div');
  el.className = 'xp-pop';
  el.textContent = text;
  el.style.left = '50%';
  el.style.top = '12%';
  el.style.transform = 'translateX(-50%)';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1100);
}

function animateHeartLoss(){
  const h = document.getElementById('playHearts');
  h.style.animation = 'none';
  h.offsetHeight;
  h.style.animation = 'shake 0.4s ease';
}

function launchConfetti(){
  const colors = ['#FFD93D','#0ABAB5','#FF6B6B','#6BCB77','#9B59B6','#FFB5C2'];
  for(let i=0;i<25;i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random()*100+'%';
    piece.style.background = colors[i%colors.length];
    piece.style.borderRadius = Math.random()>0.5?'50%':'2px';
    piece.style.width = (6+Math.random()*8)+'px';
    piece.style.height = (6+Math.random()*8)+'px';
    piece.style.animationDelay = (Math.random()*0.8)+'s';
    piece.style.animationDuration = (2+Math.random()*1.5)+'s';
    document.body.appendChild(piece);
    setTimeout(()=>piece.remove(),4000);
  }
}

// ===== INIT =====
renderMap();
</script>
