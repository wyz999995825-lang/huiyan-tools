<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jenny's Dream Diary 梦幻日记本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Patrick+Hand&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--pink:#ff7eb9;--pink2:#ffb3d9;--lav:#a98bff;--lav2:#d9ccff;--mint:#5fd3b3;--mint2:#c4f3e4;--gold:#ffc94d;--ink:#5a4478;--ink2:#8a78a8;--card:#ffffffd9;--r:22px;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:Fredoka,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,#ffe3f3 0%,#f0e6ff 45%,#e2f4ff 100%) fixed;overflow-x:hidden}
.zh{font-family:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font-family:inherit;color:var(--ink)}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#sky span{position:absolute;color:#fff;text-shadow:0 0 8px #ffd1ec,0 0 14px #c9b6ff;animation:tw 3s ease-in-out infinite;opacity:.8}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(20deg)}}
#app{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:calc(12px + var(--sat)) 14px calc(96px + var(--sab))}
/* top bar */
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo{font-weight:700;font-size:22px;display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,#ff6fb5,#a07bff,#5fc8ff);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;background:#fff;border-radius:99px;padding:6px 12px;font-weight:600;box-shadow:0 3px 10px #c9a9ff40;font-size:15px;white-space:nowrap}
.cloud{font-size:12px;color:var(--ink2)}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;gap:2px;padding:8px 8px calc(8px + var(--sab));background:#ffffffe8;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 -4px 20px #b9a6ff30}
.nav button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:600;padding:4px 2px;border-radius:14px;color:var(--ink2)}
.nav button b{font-size:23px;line-height:1.1}
.nav button.on{background:linear-gradient(135deg,#ffe0f0,#ece3ff);color:var(--ink)}
/* cards */
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 8px 28px #b99ce030;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);position:relative}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
h2{margin:0 0 10px;font-size:20px}h3{margin:0 0 8px;font-size:17px}
.muted{color:var(--ink2);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:16px;font-weight:600;font-size:16px;background:linear-gradient(135deg,#ff8cc6,#b18bff);color:#fff;box-shadow:0 5px 14px #ff8cc650;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 3px 10px #c9a9ff40}
.btn.mint{background:linear-gradient(135deg,#55d6b4,#7fb8ff);box-shadow:0 5px 14px #55d6b450}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:4px;padding:7px 12px;border-radius:99px;background:#fff;font-size:14px;font-weight:500;box-shadow:0 2px 8px #c9a9ff35;margin:3px;border:2px solid transparent}
.chip.on{border-color:var(--pink);background:#fff0f8}
.chip.gem{background:linear-gradient(135deg,#fff,#f3ecff)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
/* home */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
.books{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.book{position:relative;border-radius:14px 26px 26px 14px;min-height:210px;padding:18px 16px 16px 30px;color:#fff;text-align:left;overflow:hidden;box-shadow:0 12px 26px #c38cd860,inset 10px 0 0 #ffffff40;transition:transform .2s}
.book:hover{transform:translateY(-3px) rotate(-.6deg)}
.book.en{background:linear-gradient(145deg,#ff9fcf,#ff7eb9 40%,#c38cff)}
.book.zh{background:linear-gradient(145deg,#7fe8cc,#5fd3b3 40%,#78a8ff)}
.book::before{content:"";position:absolute;left:12px;top:0;bottom:0;border-left:3px dotted #ffffffaa}
.book::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#ffffff70 48%,transparent 62%);background-size:260% 100%;animation:shine 4s linear infinite}
@keyframes shine{0%{background-position:130% 0}100%{background-position:-130% 0}}
.book .t{font-size:24px;font-weight:700;line-height:1.15;text-shadow:0 2px 6px #0002}
.book .s{opacity:.95;font-size:14px;margin-top:4px}
.book .deco{position:absolute;right:10px;bottom:6px;font-size:54px;filter:drop-shadow(0 4px 6px #0003)}
.book .state{display:inline-block;margin-top:12px;background:#ffffff40;border-radius:99px;padding:5px 12px;font-weight:600;font-size:14px}
.stat{display:flex;gap:8px;flex-wrap:wrap}
.stat .pill{font-size:14px}
.week{display:flex;gap:6px;margin-top:6px}
.week div{flex:1;text-align:center;font-size:11px;color:var(--ink2)}
.week i{display:block;height:34px;border-radius:10px;background:#f1eaff;margin-bottom:3px;font-style:normal;font-size:15px;line-height:34px}
.week i.d1{background:linear-gradient(135deg,#ffd0e8,#e2d6ff)}
.week i.d2{background:linear-gradient(135deg,#ff9fcf,#9ee6d1)}
.lvl{height:12px;border-radius:9px;background:#f0e8ff;overflow:hidden}
.lvl b{display:block;height:100%;background:linear-gradient(90deg,#ff8cc6,#b18bff,#6fd0ff);border-radius:9px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.quick button{background:#fff;border-radius:18px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:13px;box-shadow:0 4px 14px #c9a9ff30;position:relative}
.quick button b{font-size:28px}
.dot{position:absolute;top:6px;right:10px;background:#ff5fa2;color:#fff;border-radius:99px;font-size:11px;padding:1px 6px}
/* fairy */
.fairy{display:flex;gap:10px;align-items:flex-start;margin:6px 0 12px}
.fairy .ava{font-size:40px;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 4px 8px #ffb3e6)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bubble{background:#fff;border-radius:6px 20px 20px 20px;padding:11px 14px;box-shadow:0 4px 14px #c9a9ff35;font-size:16px;line-height:1.45;flex:1}
.say{margin-left:6px;font-size:16px;vertical-align:middle;background:#f3ecff;border-radius:99px;width:28px;height:28px}
/* write */
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps button{flex:1;min-width:76px;padding:8px 6px;border-radius:14px;background:#ffffffa0;font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
.steps button.on{background:#fff;color:var(--ink);box-shadow:0 3px 10px #ff8cc640;outline:2px solid var(--pink2)}
.steps button.done{color:var(--mint)}
.emo{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.emo button{background:#fff;border-radius:18px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:600;border:3px solid transparent;box-shadow:0 3px 10px #c9a9ff30}
.emo button b{font-size:32px}
.emo button.on{border-color:var(--pink);background:#fff2f9;transform:scale(1.04)}
.sparks{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.spark{background:#fff;border-radius:20px;padding:16px 14px;text-align:left;box-shadow:0 5px 16px #c9a9ff35;border:3px solid transparent;position:relative;overflow:hidden;min-height:128px}
.spark b{font-size:38px;display:block}
.spark .c{font-size:12px;color:var(--ink2);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.spark .tt{font-weight:600;font-size:17px;margin-top:4px;line-height:1.25}
.spark.on{border-color:var(--pink)}
.spark::after{content:"✦";position:absolute;right:12px;top:8px;color:#ffc6e6;font-size:20px}
.cats{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.ta{width:100%;border:3px solid #f1e3ff;border-radius:18px;padding:12px 14px;font-size:19px;line-height:1.55;background:#fff;resize:vertical;min-height:110px;outline:none}
.ta:focus{border-color:var(--pink2)}
.en .ta,.en .paperTA{font-family:"Patrick Hand",Fredoka,cursive;font-size:22px}
.zh-mode .ta,.zh-mode .paperTA{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;font-size:20px}
.qtitle{font-size:20px;font-weight:600;margin:4px 0 8px}
.prog{font-size:13px;color:var(--ink2);font-weight:600}
.helpers{margin:8px 0}
.helpers .lab{font-size:13px;color:var(--ink2);font-weight:600;margin:6px 0 2px}
.split{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;align-items:start}
.sofar{white-space:pre-wrap;font-size:18px;line-height:1.6;max-height:360px;overflow:auto}
.en .sofar{font-family:"Patrick Hand",cursive;font-size:21px}
/* paper */
.paperWrap{position:relative}
.paper{position:relative;border-radius:10px 24px 24px 10px;padding:18px 18px 22px 46px;box-shadow:0 14px 34px #b49ad850;overflow:hidden;--line:#f6c3dc;--bg:#fffafd;background:var(--bg)}
.paper::before{content:"";position:absolute;left:30px;top:0;bottom:0;border-left:2px solid #ffb3cf80}
.paper[data-p=pink]{--line:#f8c6de;--bg:#fff8fc}
.paper[data-p=lav]{--line:#d9ccff;--bg:#fbf8ff}
.paper[data-p=ocean]{--line:#bfe3f5;--bg:#f6fcff}
.paper[data-p=mint]{--line:#bdebdc;--bg:#f7fffb}
.paper[data-p=lemon]{--line:#f8e3a6;--bg:#fffdf3}
.paper .holes{position:absolute;left:9px;top:20px;bottom:20px;display:flex;flex-direction:column;justify-content:space-around}
.paper .holes i{width:12px;height:12px;border-radius:50%;background:#efe4ff;box-shadow:inset 0 2px 3px #0002}
.phead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:15px;color:var(--ink2);border-bottom:2px dashed var(--line);padding-bottom:8px;margin-bottom:6px}
.ptitle{width:100%;border:0;background:transparent;font-size:24px;font-weight:700;color:var(--ink);outline:none;padding:4px 0}
.en .ptitle{font-family:"Patrick Hand",cursive;font-size:27px}
.paperTA{width:100%;border:0;outline:none;resize:none;background:transparent;line-height:38px;padding:0 2px;min-height:304px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 37px,var(--line) 37px,var(--line) 38px);background-attachment:local;color:#4a3a66;display:block}
.zh-mode .paperTA{text-indent:2em}
.readBody{white-space:pre-wrap;line-height:38px;font-size:20px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 37px,var(--line) 37px,var(--line) 38px);min-height:152px;color:#4a3a66}
.en .readBody{font-family:"Patrick Hand",cursive;font-size:22px}
.zh-mode .readBody{text-indent:2em}
.stLayer{position:absolute;inset:0;pointer-events:none;z-index:5}
.stLayer .placed{position:absolute;pointer-events:none;transform-origin:center;touch-action:none}
.decor .stLayer .placed{pointer-events:auto;cursor:grab}
.placed.sel{outline:3px dashed var(--pink);outline-offset:4px;border-radius:50%}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tools .btn.on{outline:3px solid #fff;box-shadow:0 0 0 3px var(--pink)}
.counter{display:flex;align-items:center;gap:10px;margin:10px 0}
.counter .bar{flex:1;height:14px;background:#f2eaff;border-radius:9px;overflow:hidden}
.counter .bar b{display:block;height:100%;background:linear-gradient(90deg,#ffb3d9,#ff7eb9,#b18bff);transition:width .3s}
.counter .bar b.ok{background:linear-gradient(90deg,#7fe8cc,#5fd3b3,#78a8ff)}
.check{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.check div{background:#fff;border-radius:12px;padding:7px 10px;font-size:13.5px;font-weight:500;opacity:.55}
.check div.ok{opacity:1;background:#effcf6;color:#2c8f73}
.palette{display:flex;gap:8px;overflow-x:auto;padding:8px 2px;scrollbar-width:thin}
.palette button{flex:0 0 auto}
.selbar{display:flex;gap:6px;justify-content:center;margin:6px 0}
.polaroid{background:#fff;padding:10px 10px 30px;box-shadow:0 6px 18px #0002;transform:rotate(-1.5deg);max-width:340px;margin:14px auto 4px;border-radius:4px}
.polaroid img{width:100%;display:block;border-radius:2px}
.drawBox{background:#fff;border-radius:18px;padding:10px}
#cv{width:100%;aspect-ratio:3/2;background:#fffefc;border-radius:12px;border:2px dashed #e7dcff;touch-action:none;display:block}
.colors{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.colors button{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px #0002}
.colors button.on{box-shadow:0 0 0 3px var(--pink)}
/* stickers */
.stk{--g:linear-gradient(135deg,#fbc2eb,#a6c1ee);position:relative;width:var(--sz,64px);height:var(--sz,64px);border-radius:50%;background:var(--g);display:grid;place-items:center;font-size:calc(var(--sz,64px)*.58);box-shadow:0 0 0 calc(var(--sz,64px)*.07) #fff,0 4px 10px #a37ccf55;overflow:hidden;line-height:1}
.stk.sq{border-radius:30%}
.stk.cl{border-radius:48% 52% 44% 56%/58% 56% 44% 42%}
.stk::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,#fff 1px,transparent 1.6px),radial-gradient(circle,#fff9 1px,transparent 1.5px);background-size:13px 13px,9px 9px;background-position:0 0,5px 6px;opacity:.55;animation:gl 2.2s ease-in-out infinite}
.stk::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 35%,#ffffffcc 50%,transparent 65%);background-size:300% 100%;animation:shine 3s linear infinite}
@keyframes gl{0%,100%{opacity:.25}50%{opacity:.8}}
.stk span{position:relative;z-index:2;filter:drop-shadow(0 2px 2px #0002)}
.stk.rare{box-shadow:0 0 0 calc(var(--sz,64px)*.07) #ffd86b,0 0 14px #ffd86b,0 4px 10px #a37ccf55}
.stk.lock{background:#eee6f7;box-shadow:0 0 0 calc(var(--sz,64px)*.07) #fff}
.stk.lock span{filter:grayscale(1) brightness(1.6) opacity(.35)}
.stk.lock::before,.stk.lock::after{display:none}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:14px 8px;justify-items:center}
.album .it{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;text-align:center;font-weight:500}
/* gems */
.gemList{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.gemC{background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 4px 12px #c9a9ff30;position:relative;border-left:6px solid var(--gc,#ffb3d9)}
.gemC .tx{font-size:18px;font-weight:600;line-height:1.35;padding-right:30px}
.py,.gemC .mn{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;}
.gemC .mn{font-size:13.5px;color:var(--ink2);margin-top:3px}
.gemC .ex{font-size:14px;margin-top:6px;background:#faf6ff;border-radius:10px;padding:6px 9px}
.gemC .ft{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.gemC .star{position:absolute;right:10px;top:8px;font-size:21px}
.tabs{display:flex;gap:6px;background:#ffffff90;padding:5px;border-radius:16px;width:max-content;max-width:100%}
.tabs button{padding:8px 16px;border-radius:12px;font-weight:600;font-size:15px}
.tabs button.on{background:#fff;box-shadow:0 2px 8px #c9a9ff40}
.search{width:100%;border:3px solid #f1e3ff;border-radius:14px;padding:10px 14px;font-size:16px;outline:none;background:#fff}
/* shelf */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal .h{font-size:12px;color:var(--ink2);font-weight:600}
.cal .d{aspect-ratio:1;border-radius:12px;background:#ffffff90;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.cal .d.today{outline:2px solid var(--pink)}
.cal .d .dots{display:flex;gap:3px}
.cal .d .dots i{width:7px;height:7px;border-radius:50%}
.ent{display:flex;gap:12px;align-items:center;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 4px 12px #c9a9ff30;text-align:left;width:100%}
.ent .ic{font-size:34px}
.ent .bd{flex:1;min-width:0}
.ent .tt{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:99px;padding:2px 8px}
.tag.en{background:#ffe0f0;color:#d24d8f}.tag.zh{background:#d8f6ec;color:#22977a}.tag.dr{background:#fff1cc;color:#a8790c}
/* letters */
.letter{background:linear-gradient(135deg,#fff,#fff4fa);border-radius:18px;padding:14px 16px;box-shadow:0 5px 14px #ffb3d940;border:2px dashed #ffc6e2;position:relative}
.letter .to{font-weight:700;font-size:15px}
.letter .msg{font-size:18px;line-height:1.5;margin:6px 0;white-space:pre-wrap}
.en .letter .msg,.letter.en .msg{font-family:"Patrick Hand",cursive;font-size:21px}
.reply{background:#eefcf7;border-radius:12px;padding:8px 12px;margin-top:6px;font-size:15px}
.secret{background:linear-gradient(135deg,#efe6ff,#ffe6f3);border-radius:16px;padding:14px;text-align:center;font-weight:600}
/* modal */
.mask{position:fixed;inset:0;background:#3c2b5a66;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.modal{background:#fff;border-radius:26px;padding:20px;max-width:520px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 50px #5a447860;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.field{margin:8px 0}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:3px}
.field input,.field textarea,.field select{width:100%;border:3px solid #f1e3ff;border-radius:12px;padding:9px 12px;font-size:16px;outline:none;background:#fff}
.toast{position:fixed;left:50%;bottom:calc(100px + var(--sab));transform:translateX(-50%);background:#5a4478;color:#fff;padding:10px 18px;border-radius:99px;z-index:80;font-weight:600;font-size:15px;box-shadow:0 8px 20px #0003;animation:pop .2s;max-width:90vw;text-align:center}
.box{font-size:96px;display:inline-block;animation:shake .5s ease-in-out infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.reveal{animation:rev .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes rev{from{transform:scale(0) rotate(-180deg)}to{transform:none}}
.confetti{position:fixed;top:-20px;z-index:70;font-size:22px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.big{font-size:34px;font-weight:700}
.bars{display:flex;align-items:flex-end;gap:4px;height:110px;padding-top:6px}
.bars div{flex:1;max-width:44px;border-radius:6px 6px 2px 2px;min-height:3px;position:relative}
.bars div span{position:absolute;bottom:-17px;left:0;right:0;text-align:center;font-size:10px;color:var(--ink2)}
.hide{display:none!important}
.mk{line-height:2.1;font-size:20px;white-space:pre-wrap;color:#4a3a66}
.en .mk{font-family:"Patrick Hand",cursive;font-size:23px}
.mk del{color:#e5484d;text-decoration:line-through 2px #e5484d}
.mk ins{color:#15803d;text-decoration:none;background:#dcfce7;border-radius:6px;padding:0 4px;font-weight:600;margin-left:2px}
.mk .todo{background:#ffe4e6;border-bottom:3px wavy #e5484d;border-radius:4px;cursor:pointer;padding:0 2px}
.mk .spk{background:#efe6ff;border-bottom:3px dotted #9b6bff;border-radius:4px;cursor:pointer;padding:0 2px}

let S=load();
function load(){let d=null;try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
 const b=DEF();if(!d)return b;
 d.entries=d.entries||{};d.gems=d.gems||{};d.owned=Array.isArray(d.owned)?d.owned:b.owned;d.rewarded=d.rewarded||{};d.bonus=d.bonus||{};
 d.settings=Object.assign(b.settings,d.settings||{});d.stars=d.stars||0;d.boxOrder=d.boxOrder||[];return d}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date());
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const WD_EN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],MO_EN=['January','February','March','April','May','June','July','August','September','October','November','December'],WD_ZH=['日','一','二','三','四','五','六'];
const fmtD=(s,lang)=>{const d=parseD(s);return lang==='zh'?(d.getMonth()+1)+'月'+d.getDate()+'日　星期'+WD_ZH[d.getDay()]:WD_EN[d.getDay()]+', '+d.getDate()+' '+MO_EN[d.getMonth()]+' '+d.getFullYear()};
const cnt=(t,lang)=>lang==='zh'?((t||'').match(/[㐀-鿿]/g)||[]).length:((t||'').match(/[A-Za-z]+(?:'[A-Za-z]+)?/g)||[]).length;
function rng(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296}}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor((r?r():Math.random())*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const liveEntries=()=>Object.values(S.entries).filter(e=>!e.del);
const liveGems=lang=>Object.values(S.gems).filter(g=>!g.del&&(!lang||g.lang===lang));
function totalWords(){return liveEntries().reduce((a,e)=>a+cnt((e.body||'')+' '+((e.ending&&e.ending.text)||''),e.lang),0)}
function doneDays(){const s=new Set();Object.keys(S.rewarded).forEach(k=>s.add(k.split('|')[0]));return s}
function streak(){const s=doneDays();let n=0;const d=new Date();if(!s.has(dstr(d)))d.setDate(d.getDate()-1);while(s.has(dstr(d))){n++;d.setDate(d.getDate()-1)}return n}
function level(){const w=totalWords();let i=0;LEVELS.forEach((l,k)=>{if(w>=l[0])i=k});const cur=LEVELS[i],nx=LEVELS[i+1];return{w,cur,nx,pct:nx?Math.min(100,(w-cur[0])/(nx[0]-cur[0])*100):100}}

const SEP='\n💌 ';
function combText(e){return (e.body||'').trim()+(e.ending&&e.ending.text.trim()?SEP+e.ending.text.trim():'')}
function locate(orig,fixes){let pos=0;const out=[];fixes.forEach(f=>{if(!f||typeof f.wrong!=='string'||!f.wrong||typeof f.right!=='string'||f.wrong===f.right||f.wrong.includes('\n'))return;let i=orig.indexOf(f.wrong,pos);if(i<0)i=orig.indexOf(f.wrong);if(i<0)return;if(out.some(o=>i<o.at+o.wrong.length&&o.at<i+f.wrong.length))return;out.push({wrong:f.wrong,right:f.right,type:String(f.type||'').slice(0,20),why:String(f.why||'').slice(0,90),at:i,fixed:false,sp:!!f.sp});if(i>=pos)pos=i+f.wrong.length});return out.sort((a,b)=>a.at-b.at)}
function applyCheck(e){const c=e.check;let t=c.orig;c.fixes.filter(f=>f.fixed).sort((a,b)=>b.at-a.at).forEach(f=>{t=t.slice(0,f.at)+f.right+t.slice(f.at+f.wrong.length)});
 const k=t.indexOf(SEP);let body=k>=0?t.slice(0,k):t,end=k>=0?t.slice(k+SEP.length):'';if(c.extra)body=body+(e.lang==='zh'?'':' ')+c.extra;e.body=body;if(e.ending)e.ending.text=end;e.updated=Date.now()}
function fxNum(c,i){let k=0;for(let j=0;j<=i;j++)if(!c.fixes[j].sp)k++;return k}
function markHTML(c,mode){const t=c.orig;let h='',p=0;c.fixes.forEach((f,i)=>{h+=esc(t.slice(p,f.at));const n=f.sp?'<sup style="background:#9b6bff">✨</sup>':'<sup>'+fxNum(c,i)+'</sup>';

  else h+='<span class="'+(f.sp?'spk':'todo')+'" data-act="fixOne" data-i="'+i+'">'+esc(f.wrong)+'</span>'+n;p=f.at+f.wrong.length});
 h+=esc(t.slice(p));return h.replace(esc(SEP),'<br><br>💌 ')}

 return 'You are a kind primary school English teacher in Singapore (British spelling). Jenny is an 8-year-old Primary 2 girl. Below is her English diary.\nFind ONLY real mistakes: spelling, capital letters, full stops and other punctuation, grammar (tense, plurals, a/an, verb agreement), missing or wrong words. Do NOT rewrite her style or ideas, and do not make sentences fancier.\nFor each mistake, "wrong" must be copied EXACTLY from her text (keep it short: one word or a few words; add a neighbouring word if needed to make it unique) and "right" is the corrected version of that same piece. List them in the order they appear.\nAlso give at most ONE "sparkle": copy a short phrase exactly ("from") and give a more vivid version ("to") using a describing word, simile or sense word.\nReply with JSON only: {"fixes":[{"wrong":"","right":"","type":"spelling|capital|punctuation|grammar|word","why":"very short reason a child understands, max 12 words"}],"praise":"one specific, warm compliment (max 22 words)","sparkle":{"from":"","to":"","why":""} or null,"ask":"one curious question that helps her add a detail (max 15 words)"}\nIf there are no mistakes, "fixes" is [].\nDiary:\n<<<\n'+text+'\n>>>'}

 '<div class="field"><label>现实奖励（孩子首页会看到）</label><input id="sR" value="'+esc(S.settings.reward)+'" placeholder="例如：周末去吃冰淇淋"></div><div class="field"><label>需要多少 ⭐</label><input id="sRS" type="number" min="5" value="'+S.settings.rewardStars+'"></div></div></div>'+

function errBook(){const all=[];liveEntries().forEach(e=>{if(e.check&&e.check.fixes)e.check.fixes.forEach(f=>{if(!f.sp)all.push({lang:e.lang,date:e.date,...f})})});
 if(!all.length)return '<div class="card" style="margin-top:14px"><h3>📒 错误小本（露娜 AI 批改）</h3><div class="muted">孩子完成日记时露娜会自动批改，错误会记在这里。</div></div>';
 const by={};all.forEach(f=>{const k=(f.lang==='zh'?'华文·':'英文·')+(f.lang==='zh'?f.type:(TYPEZH[f.type]||f.type));by[k]=(by[k]||0)+1});
 const rec=all.sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30);
 return '<div class="card" style="margin-top:14px"><h3>📒 错误小本（露娜 AI 批改，共 '+all.length+' 处）</h3><div class="row">'+Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>'<span class="pill">'+esc(k)+' '+v+'</span>').join('')+'</div><div style="margin-top:10px;max-height:260px;overflow:auto">'+rec.map(f=>'<div style="margin:4px 0;font-size:15px"><span class="muted">'+f.date.slice(5)+'</span> <span style="color:#e5484d;text-decoration:line-through">'+esc(f.wrong)+'</span> ➜ <b style="color:#15803d">'+esc(f.right)+'</b> <span class="muted">'+esc(f.why)+'</span></div>').join('')+'</div></div>'}
/* ============ BACKUP / MERGE ============ */
function mergeInto(base,inc){if(!inc||typeof inc!=='object')return base;
 Object.values(inc.entries||{}).forEach(e=>{if(!e||!e.id)return;const c=base.entries[e.id];if(!c||(e.updated||0)>(c.updated||0))base.entries[e.id]=e});
 Object.values(inc.gems||{}).forEach(g=>{if(!g||!g.id)return;const c=base.gems[g.id];if(!c||(g.updated||g.created||0)>(c.updated||c.created||0))base.gems[g.id]=g});
 base.owned=[...new Set([...(base.owned||[]),...(inc.owned||[])])];
 base.stars=Math.max(base.stars||0,inc.stars||0);
 base.rewarded=Object.assign({},inc.rewarded||{},base.rewarded||{});base.bonus=Object.assign({},inc.bonus||{},base.bonus||{});
 if(inc.settingsAt&&(!base.settingsAt||inc.settingsAt>base.settingsAt)){base.settings=Object.assign(base.settings,inc.settings);base.settingsAt=inc.settingsAt}
 return base}
const b64e=s=>btoa(unescape(encodeURIComponent(s))),b64d=s=>decodeURIComponent(escape(atob(s)));

/* ============ CLOUD (db) ============ */
let DB=null,UID=null,CL='local',dirty=new Set(),flushT=null,writing=false;
function cloudMsg(){return CL==='ok'?'☁️ 已自动同步到云端（换设备用同一个账号登录就能看到）':CL==='loading'?'☁️ 连接云端中…':CL==='err'?'⚠️ 云端暂时连不上，已保存在本机，稍后自动再试':'💾 已保存在这台设备。换设备：在旧设备点「复制备份码」，到新设备点「粘贴恢复」。（用 claude.ai 链接打开时会自动云端同步，并有露娜 AI 批改）'}
function showCloud(){$('#cloud').textContent=CL==='ok'?'☁️ synced':CL==='err'?'⚠️ offline — saved on this device':CL==='loading'?'☁️ …':'💾 saved on this device';const c2=$('#cloud2');if(c2)c2.textContent=cloudMsg()}
function metaDoc(){return{owned:S.owned,stars:S.stars,rewarded:S.rewarded,bonus:S.bonus,settings:S.settings,settingsAt:S.settingsAt||0,gems:S.gems,v:1}}
function markDirty(k){dirty.add(k);clearTimeout(flushT);flushT=setTimeout(flush,1500)}
async function flush(){if(!DB||!UID||writing)return;writing=true;const col=DB.collection('data/users/'+UID);
 try{while(dirty.size){const k=dirty.values().next().value;dirty.delete(k);let body;
   if(k==='meta')body=metaDoc();else{const e=S.entries[k.slice(2)];if(!e)continue;body=Object.assign({},e);if(JSON.stringify(body).length>240000)body.drawing=null}
   try{await col.doc(k).set(body)}catch(err){if(err&&err.code==='unavailable'){await new Promise(r=>setTimeout(r,800+Math.random()*800));await col.doc(k).set(body)}else throw err}}
  CL='ok'}catch(err){CL='err';console.warn('cloud',err);setTimeout(()=>{if(CL==='err')flush()},30000)}
 writing=false;showCloud();if(dirty.size){clearTimeout(flushT);flushT=setTimeout(flush,1500)}}
async function initCloud(){try{if(!window.claude||!window.claude.use){CL='local';showCloud();return}CL='loading';showCloud();
 const [db,us]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);if(!db||!us){CL='local';showCloud();return}
 const id=await us.id();if(!id){CL='local';showCloud();return}DB=db;UID=id;
 const to=setTimeout(()=>{if(CL==='loading'){CL='err';showCloud()}},10000);
 const snap=await db.collection('data/users/'+id).get();clearTimeout(to);
 const inc={entries:{},gems:{}};let cloudE={};snap.docs.forEach(d=>{const x=d.data();if(!x)return;if(d.id==='meta'){Object.assign(inc,x);inc.entries={};inc.gems=x.gems||{}}else if(d.id.startsWith('e_')){inc.entries[x.id]=x;cloudE[x.id]=x.updated||0}});
 const before=JSON.stringify(S);mergeInto(S,inc);persist();
 Object.values(S.entries).forEach(e=>{if(!(e.id in cloudE)||(e.updated||0)>cloudE[e.id])dirty.add('e_'+e.id)});dirty.add('meta');
 CL='ok';showCloud();if(JSON.stringify(S)!==before&&VIEW!=='write')render();flush()}catch(err){console.warn(err);CL='err';showCloud()}}

const ACT={
 go:b=>{if(b.dataset.v==='parent')parentGate();else go(b.dataset.v)},
 say:b=>speak(b.dataset.t,b.dataset.l),

 mood:b=>{W.e.mood=+b.dataset.i;saveW(true);render()},
